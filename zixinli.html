<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>《中国人失掉自信力了吗》课件</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .animate-spin {
            animation: spin 1s linear infinite;
        }
        .reveal-box {
            display: inline-block;
            min-width: 60px;
            padding: 0 8px;
            text-align: center;
            border-bottom: 2px solid #8a1f1f;
            cursor: pointer;
            transition: all 0.3s ease;
            background-color: rgba(138, 31, 31, 0.1);
            color: transparent;
            user-select: none;
        }
        .reveal-box.revealed {
            color: #8a1f1f;
            background-color: transparent;
            font-weight: bold;
        }
    </style>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone -->
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js" crossorigin="anonymous"></script>
    <script>
        window.addEventListener('error', function(e) {
            const errDiv = document.createElement('div');
            errDiv.style.cssText = 'position:fixed;top:0;left:0;right:0;background:red;color:white;padding:10px;z-index:9999;';
            errDiv.innerText = 'Error: ' + (e.message || e.error);
            document.body.appendChild(errDiv);
        });
    </script>
</head>
<body class="bg-[#f4f1eb]">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // Icons
        const Settings = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>;
        const RefreshCw = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="23 4 23 10 17 10"></polyline><polyline points="1 20 1 14 7 14"></polyline><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path></svg>;
        const RotateCcw = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="3 2 3 10 11 10"></polyline><path d="M3 10a9 9 0 1 1 5 8"></path></svg>;
        const ChevronDown = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><polyline points="6 9 12 15 18 9"></polyline></svg>;
        const Menu = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="3" y1="12" x2="21" y2="12"></line><line x1="3" y1="6" x2="21" y2="6"></line><line x1="3" y1="18" x2="21" y2="18"></line></svg>;
        const XInfo = ({ className }) => <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" className={className}><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>;

        const INITIAL_ARGUMENT = `近年来，国内互联网行业的许多热门商业模式，从团购、网约车到短视频、生成式人工智能，最初都能在海外找到原型。一些国产手机品牌在外观设计上与国际大牌高度相似，某些综艺节目也被指抄袭海外版权。这些现象被反复报道后，不少人据此断言：现在的中国人只会抄袭，根本没有自主创新能力。`;

        function useStickyState(defaultValue, key) {
            const [value, setValue] = useState(() => {
                const stickyValue = window.localStorage.getItem(key);
                return stickyValue !== null ? JSON.parse(stickyValue) : defaultValue;
            });
            useEffect(() => {
                window.localStorage.setItem(key, JSON.stringify(value));
            }, [key, value]);
            return [value, setValue];
        }

        const RevealWord = ({ word }) => {
            const [revealed, setRevealed] = useState(false);
            return (
                <span 
                    className={`reveal-box mx-1 ${revealed ? 'revealed' : ''}`}
                    onClick={() => setRevealed(true)}
                    title="点击显示答案"
                >
                    {word}
                </span>
            );
        };

        const Accordion = ({ title, children, defaultOpen = false }) => {
            const [open, setOpen] = useState(defaultOpen);
            return (
                <div className="border border-[#d3c8ba] bg-white mb-4 shadow-sm">
                    <button 
                        className="w-full px-6 py-4 flex justify-between items-center bg-[#fcfbf9] hover:bg-[#f4f1eb] transition-colors"
                        onClick={() => setOpen(!open)}
                    >
                        <h3 className="text-lg font-bold text-[#2c2420]">{title}</h3>
                        <ChevronDown className={`w-5 h-5 text-[#8a1f1f] transition-transform ${open ? 'rotate-180' : ''}`} />
                    </button>
                    {open && (
                        <div className="p-6 border-t border-[#d3c8ba] text-[#3d312a] leading-relaxed text-lg">
                            {children}
                        </div>
                    )}
                </div>
            );
        };

        function App() {
            const [apiKey, setApiKey] = useStickyState('', 'luxun-apikey');
            const [argument, setArgument] = useStickyState(INITIAL_ARGUMENT, 'luxun-argument');
            const [response, setResponse] = useStickyState('', 'luxun-response');
            const [feedback, setFeedback] = useStickyState('', 'luxun-feedback');
            const [model, setModel] = useStickyState('deepseek-v4-flash', 'luxun-model');
            const [loading, setLoading] = useState(false);
            const [generating, setGenerating] = useState(false);
            const [activeTab, setActiveTab] = useState(0);
            const [entered, setEntered] = useState(false);
            const [sidebarOpen, setSidebarOpen] = useState(true);

            const handleGenerateFallacy = async () => {
                if (!apiKey.trim()) {
                    alert("请先输入 DeepSeek API Key");
                    return;
                }
                setGenerating(true);
                setFeedback('');
                setResponse('');
                try {
                    const systemPrompt = `你是一个逻辑学老师。请仿照鲁迅《中国人失掉自信力了吗》中敌方的论点结构，生成一段生活中常见的逻辑谬误。
要求：
1. 结构必须是：列举几个真实的、具有当代时代特征的客观事实作为迷惑性论据，最后得出一个荒谬的论点（结论只能有一句）。总字数在30到100字之间。
2. 论点中必须包含2-3个值得“厘清内涵”的核心概念（比如类似“中国人失去自信力了”中的“中国人”、“失掉”、“自信力”）。
3. 谬论的错误根源必须是模糊了这些核心概念的内涵：可能是以偏概全（用小部分人代表全体）、可能是前提不成立（比如谈“失去”但其实从未“拥有”）、或是偷换了能力或状态的定义。
4. 只要学生能敏锐地抓出这几个概念，并澄清其准确定义、范围或前提，就能彻底推翻该谬论。
5. 绝对不能包含违反道德、法律、公序良俗或不适合青少年阅读的内容。
6. 绝不要提供任何关于如何反驳的提示或解析，不要特意指出哪句是论点论据。
7. 生成的内容要有一定的迷惑性，最好具有时代特征。
直接输出这段话本身，不要输出其他多余的解释、标题或前缀。`;

                    const fetchResult = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: [{ role: 'user', content: systemPrompt }],
                            ...(model === 'deepseek-v4-pro' ? { reasoning_effort: 'high' } : { temperature: 0.8 })
                        })
                    });

                    if (!fetchResult.ok) {
                        const errObj = await fetchResult.json().catch(() => ({}));
                        throw new Error(`DeepSeek API Error: ${fetchResult.status} - ${errObj.error?.message || fetchResult.statusText}`);
                    }

                    const data = await fetchResult.json();
                    setArgument(data.choices[0].message.content);
                } catch (err) {
                    alert(`网络出了些问题：${err.message}`);
                } finally {
                    setGenerating(false);
                }
            };

            const handleSubmit = async () => {
                if (!response.trim() || loading) return;
                if (!apiKey.trim()) {
                    alert("请先输入 DeepSeek API Key");
                    return;
                }
                setLoading(true);
                setFeedback('');
                try {
                    const systemPrompt = `你是鲁迅。
学生正在学习用“明确概念的内涵”（澄清概念的定义、范围、前提等）这一逻辑思维工具来反驳谬论。
他们面临的错误论点及论据是：
${argument}

你的任务是：
对学生的反驳进行百分制打分。

【评分依据】
请先在内心（或利用模型的思维演算能力）执行以下步骤，以确立评分基准：
1. 罗列谬论中有哪些需要厘清的核心概念。
2. 分别明确这些概念的真实内涵是什么，以及谬论中是如何偷换、收窄或模糊了它们的内涵的。
3. 思考：基于明确后的概念内涵，应如何一针见血地驳倒对方。
对照以上3点与学生的反驳进行比对，遵循以下评分规则：
- 【60-69分】：学生有运用“明确概念的内涵”这个思想工具的“意识”，哪怕只模模糊糊指出了一个概念。
- 【70-79分】：能针对性地解剖谬论中的一两个具体概念内涵，指出了部分荒谬之处。
- 【80-89分】：找准了大部分主要核心概念的漏洞，并基于内涵逻辑进行了有力反驳。
- 【90-100分】：对所有痛点概念都进行了精准剖析，内涵澄明，逻辑严密，无懈可击。
给分请客观，但应当温和宽厚。

【回复结构要求】
回复必须且仅包含以下两部分（绝不输出你的打分思考过程或“概念列表”等）：
1. 第一行必须且只能是分数数字，格式必须严格为“【得分：XX分】”。
2. 第二部分是批语。必须使用极具鲁迅色彩的语言风格（冷峻、深沉、带些反讽、语言精炼，适当使用如“大约”、“倒是”、“其实”、“罢了”等半文辞）。在批语中，要融合你先前思考的概念内涵，犀利地指出学生的反驳好在哪里，坏在哪里（遗漏了哪些该厘清的概念，或者哪个概念的内涵没讲透亮，应当如何基于概念内涵去反驳才算通透）。莫作多余的客套。`;

                    const messages = [
                        { role: 'system', content: systemPrompt },
                        { role: 'user', content: `【学生的反驳】：${response}` }
                    ];

                    const fetchResult = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: model,
                            messages: messages,
                            ...(model === 'deepseek-v4-pro' ? { reasoning_effort: 'high' } : { temperature: 0.7 })
                        })
                    });

                    if (!fetchResult.ok) {
                        const errObj = await fetchResult.json().catch(() => ({}));
                        throw new Error(`DeepSeek API Error: ${fetchResult.status} - ${errObj.error?.message || fetchResult.statusText}`);
                    }

                    const data = await fetchResult.json();
                    setFeedback(data.choices[0].message.content);
                } catch (err) {
                    setFeedback(`先生有言：出了些岔子，怕是网络断绝了。${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const TABS = [
                { id: 0, title: '课文原文' },
                { id: 1, title: '基础重温' },
                { id: 2, title: '概念辨析' },
                { id: 3, title: '实战演练' },
                { id: 4, title: '课后拓展' },
                { id: 5, title: '系统设置' }
            ];

            if (!entered) {
                return (
                    <div 
                        className="min-h-screen bg-[#1f1a17] text-[#f4f1eb] font-serif flex flex-col justify-center items-center cursor-pointer relative overflow-hidden"
                        onClick={() => setEntered(true)}
                    >
                        <div className="absolute top-0 left-0 w-full h-full opacity-10 pointer-events-none" style={{ backgroundImage: 'radial-gradient(circle, #3d312a 20%, transparent 20%), radial-gradient(circle, #3d312a 20%, transparent 20%)', backgroundSize: '10px 10px', backgroundPosition: '0 0, 5px 5px' }}></div>
                        
                        <div className="z-10 flex flex-col items-center space-y-8 p-8 md:p-16 border-4 border-[#8a1f1f] bg-[#1f1a17] shadow-[20px_20px_0_0_#8a1f1f] transition-transform hover:-translate-y-2 hover:shadow-[24px_24px_0_0_#8a1f1f] max-w-[90vw]">
                            <svg className="w-48 h-48 sm:w-64 sm:h-64 mb-6 bg-[#f4f1eb] p-0 border-2 border-[#1f1a17] shadow-[6px_6px_0_0_#3d312a] rounded-sm" viewBox="0 0 200 200" fill="none" xmlns="http://www.w3.org/2000/svg">
                                <rect width="200" height="200" fill="#f4f1eb"/>
                                
                                <g fill="#1f1a17">
                                    {/* 烟斗斗钵 */}
                                    <path d="M 50 85 L 100 85 L 95 130 C 93 155 65 160 50 140 C 42 128 45 100 50 85 Z" />
                                    <rect x="40" y="75" width="70" height="12" rx="4" />
                                    
                                    {/* 烟斗柄 */}
                                    <path d="M 80 140 C 120 165 155 135 170 120 L 175 115 C 180 110 172 102 165 108 L 140 130 C 120 145 95 150 80 130 Z" />
                                </g>

                                {/* 烟雾 */}
                                <path d="M 75 60 C 60 30 110 30 85 5" stroke="#8a1f1f" strokeWidth="8" strokeLinecap="round" fill="none" opacity="0.8" />
                                <path d="M 50 50 C 40 25 75 20 60 5" stroke="#1f1a17" strokeWidth="5" strokeLinecap="round" fill="none" opacity="0.6" />
                                <path d="M 100 55 C 90 30 125 25 110 10" stroke="#1f1a17" strokeWidth="6" strokeLinecap="round" fill="none" opacity="0.7" />
                            </svg>
                            
                            <div className="text-center space-y-4">
                                <h1 className="text-4xl sm:text-6xl font-black tracking-[0.2em] text-[#f4f1eb]" style={{ textShadow: '4px 4px 0 #8a1f1f' }}>
                                    且介亭
                                </h1>
                                <p className="text-xl sm:text-2xl font-bold tracking-widest text-[#8a1f1f]">
                                    《中国人失掉自信力了吗》
                                </p>
                                <div className="mt-8 pt-6 border-t-2 border-[#3d312a] flex items-center justify-center animate-pulse text-[#bbaea0]">
                                    <span className="tracking-widest">点击开启思辨之旅</span>
                                </div>
                            </div>
                        </div>
                        <div className="absolute bottom-6 right-6 text-right text-sm text-[#a2988b] tracking-widest font-medium z-10">
                            <p className="mb-1">武汉市第十一中学</p>
                            <p>喻业伟</p>
                        </div>
                    </div>
                );
            }

            return (
                <div className="flex flex-col md:flex-row h-screen font-serif bg-[#f4f1eb] text-[#1f1a17] overflow-hidden">
                    {/* Header for mobile when sidebar is closed */}
                    {!sidebarOpen && (
                        <div className="md:hidden flex items-center p-4 border-b-2 border-[#d3c8ba] bg-[#fcfbf9] z-30">
                            <button onClick={() => setSidebarOpen(true)} className="p-2 text-[#2c2420] hover:bg-[#eae5db] transition-colors rounded-sm shadow-sm border border-[#d3c8ba]">
                                <Menu className="w-6 h-6" />
                            </button>
                            <h1 className="ml-4 font-black tracking-widest text-[#2c2420]">且介亭</h1>
                        </div>
                    )}
                    
                    {/* Persistent Toggle Button for Desktop */}
                    <div className="hidden md:flex absolute top-6 left-6 z-30">
                        <button onClick={() => setSidebarOpen(!sidebarOpen)} className={`p-2 text-[#2c2420] transition-colors rounded-sm shadow-sm border border-[#d3c8ba] ${sidebarOpen ? 'bg-[#fcfbf9] hover:bg-[#eae5db]' : 'bg-[#fcfbf9] hover:bg-[#eae5db]'}`}>
                            {sidebarOpen ? <XInfo className="w-6 h-6" /> : <Menu className="w-6 h-6" />}
                        </button>
                    </div>

                    {/* Sidebar */}
                    {sidebarOpen && (
                        <aside className="w-full md:w-72 border-b-2 md:border-b-0 md:border-r-2 border-[#d3c8ba] bg-[#fcfbf9] flex-shrink-0 flex flex-col z-20 transition-all duration-300">
                            <div className="p-5 md:p-8 md:pt-20 border-b-2 border-[#d3c8ba] relative">
                                <div className="flex justify-between items-start md:hidden mb-4">
                                    <h1 className="font-black tracking-widest text-[#2c2420] text-xl">且介亭</h1>
                                    <button onClick={() => setSidebarOpen(false)} className="p-1 text-[#2c2420] hover:bg-[#eae5db] transition-colors rounded-sm">
                                        <XInfo className="w-6 h-6" />
                                    </button>
                                </div>
                                <h1 className="text-2xl md:text-3xl font-black tracking-widest text-[#2c2420] mb-3 leading-tight">
                                    《中国人失掉自信力了吗》
                                </h1>
                                <p className="text-base md:text-lg text-[#8a1f1f] font-bold">—— 明确概念的内涵</p>
                            </div>
                            <nav className="flex-1 px-4 py-4 md:p-6 flex md:flex-col overflow-x-auto md:overflow-y-auto space-x-2 md:space-x-0 md:space-y-4 shadow-[inset_0_-10px_10px_-10px_rgba(0,0,0,0.05)] md:shadow-none">
                                {TABS.map(tab => (
                                    <button
                                        key={tab.id}
                                        onClick={() => {
                                            setActiveTab(tab.id);
                                            if(window.innerWidth < 768) setSidebarOpen(false);
                                        }}
                                        className={`whitespace-nowrap px-6 py-3 md:py-4 text-base md:text-xl font-bold transition-all border-2 border-transparent ${activeTab === tab.id ? 'bg-[#2c2420] text-[#f4f1eb]' : 'text-[#7d6c5d] hover:border-[#d3c8ba] hover:bg-[#eae5db]'} md:text-left`}
                                    >
                                        {tab.title}
                                    </button>
                                ))}
                            </nav>
                        </aside>
                    )}

                    {/* Main Content */}
                    <main className={`flex-1 overflow-y-auto w-full p-6 md:p-10 lg:p-16 pb-32 relative text-lg bg-[#f4f1eb] ${!sidebarOpen ? 'md:pl-24' : ''}`}>
                        <div className="max-w-[1000px] mx-auto flex flex-col h-full">

                        {/* 0. 课文原文 */}
                        {activeTab === 0 && (
                            <section className="space-y-6 animate-in fade-in duration-300">
                                <h2 className="text-2xl font-bold border-l-4 border-[#8a1f1f] pl-4 flex items-center">
                                    0. 课文原文
                                </h2>
                                <div className="bg-white border-2 border-[#d3c8ba] p-6 md:p-10 shadow-sm leading-relaxed text-[#2c2420]">
                                    <h3 className="text-2xl font-bold text-center mb-2">中国人失掉自信力了吗</h3>
                                    <p className="text-center font-bold mb-8">鲁迅</p>
                                    <div className="space-y-4 text-justify indent-8">
                                        <p>从公开的文字上看起来：两年以前，我们总自夸着“地大物博”，是事实；不久就不再自夸了，只希望着国联，也是事实；现在是既不夸自己，也不信国联，改为一味求神拜佛，怀古伤今了——却也是事实。</p>
                                        <p>于是有人慨叹曰：中国人失掉自信力了。</p>
                                        <p>如果单据这一点现象而论，自信其实是早就失掉了的。先前信“地”，信“物”，后来信“国联”，都没有相信过“自己”。假使这也算一种“信”，那也只能说中国人曾经有过“他信力”，自从对国联失望之后，便把这他信力都失掉了。</p>

                                            【提升层·二选一选做】
                                        </h3>
                                        <ol className="list-decimal list-inside space-y-3 text-lg leading-relaxed text-[#2c2420]">
                                            <li>观察生活，找到一个常见的、似是而非的错误论调（如“读书无用论”“颜值即正义”等），运用本节课学到的思辨方法，写一段200字左右的反驳文字</li>
                                            <li>以《新时代的中国脊梁》为题，写一段150字左右的文字，结合具体人物事例，谈谈你对新时代民族脊梁的理解</li>
                                        </ol>
                                    </div>

                                    <div className="bg-white border-2 border-[#d3c8ba] p-6 md:p-8 shadow-sm">
                                        <h3 className="text-xl font-bold text-[#8a1f1f] mb-4 flex items-center">
                                            <span className="w-2 h-6 bg-[#1f1a17] mr-3 inline-block"></span>
                                            【拓展层·学有余力选做】
                                        </h3>
                                        <p className="text-lg leading-relaxed text-[#2c2420] mb-6">
                                            从以下两篇鲁迅杂文中任选一篇，用本节课学到的驳论方法梳理其反驳思路，写一段200字左右的分析文字，同时说说文中的语言手法在反驳中起了什么作用。
                                        </p>
                                        
                                        <div className="space-y-6">
                                            <Accordion title="拓展阅读一：《拿来主义》" defaultOpen={false}>
                                                <div className="text-justify text-[#3d312a] space-y-4 indent-8 leading-relaxed">
                                                    <p>中国一向是所谓“闭关主义”，自己不去，别人也不许来。自从给枪炮打破了大门之后，又碰了一串钉子，到现在，成了什么都是“送去主义”了。别的且不说罢，单是学艺上的东西，近来就先送一批古董到巴黎去展览，但终“不知后事如何”；还有几位“大师”们捧着几张古画和新画，在欧洲各国一路的挂过去，叫作“发扬国光”。听说不远还要送梅兰芳博士到苏联去，以催进“象征主义”，此后是顺便到欧洲传道。我在这里不想讨论梅博士演艺和象征主义的关系，总之，活人替代了古董，我敢说，也可以算得显出一点进步了。</p>
                                                    <p>但我们没有人根据了“礼尚往来”的仪节，说道：拿来！</p>
                                                    <p>当然，能够只是送出去，也不算坏事情，一者见得丰富，二者见得大度。尼采就自诩过他是太阳，光热无穷，只是给与，不想取得。然而尼采究竟不是太阳，他发了疯。中国也不是，虽然有人说，掘起地下的煤来，就足够全世界几百年之用，但是，几百年之后呢？几百年之后，我们当然是化为魂灵，或上天堂，或落了地狱，但我们的子孙是在的，所以还应该给他们留下一点礼品。要不然，则当佳节大典之际，他们拿不出东西来，只好磕头贺喜，讨一点残羹冷炙做奖赏。</p>
                                                    <p>这种奖赏，不要误解为“抛来”的东西，这是“抛给”的，说得冠冕些，可以称之为“送来”，我在这里不想举出实例。</p>
                                                    <p>我在这里也并不想对于“送去”再说什么，否则太不“摩登”了。我只想鼓吹我们再吝啬一点，“送去”之外，还得“拿来”，是为“拿来主义”。</p>
                                                    <p>但我们被“送来”的东西吓怕了。先有英国的鸦片，德国的废枪炮，后有法国的香粉，美国的电影，日本的印着“完全国货”的各种小东西。于是连清醒的青年们，也对于洋货发生了恐怖。其实，这正是因为那是“送来”的，而不是“拿来”的缘故。</p>
                                                    <p>所以我们要运用脑髓，放出眼光，自己来拿！</p>
                                                    <p>譬如罢，我们之中的一个穷青年，因为祖上的阴功（姑且让我这么说说罢），得了一所大宅子，且不问他是骗来的，抢来的，或合法继承的，或是做了女婿换来的。那么，怎么办呢？我想，首先是不管三七二十一，“拿来”！但是，如果反对这宅子的旧主人，怕给他的东西染污了，徘徊不敢走进门，是孱头；勃然大怒，放一把火烧光，算是保存自己的清白，则是昏蛋。不过因为原是羡慕这宅子的旧主人的，而这回接受一切，欣欣然的蹩进卧室，大吸剩下的鸦片，那当然更是废物。“拿来主义”者是全不这样的。</p>
                                                    <p>他占有，挑选。看见鱼翅，并不就抛在路上以显其“平民化”，只要有养料，也和朋友们像萝卜白菜一样的吃掉，只不用它来宴大宾；看见鸦片，也不当众摔在茅厕里，以见其彻底革命，只送到药房里去，以供治病之用，却不弄“出售存膏，售完即止”的玄虚。只有烟枪和烟灯，虽然形式和印度，波斯，阿剌伯的烟具都不同，确可以算是一种国粹，倘使背着周游世界，一定会有人看，但我想，除了送一点进博物馆之外，其余的是大可以毁掉的了。还有一群姨太太，也大以请她们各自走散为是，要不然，“拿来主义”怕未免有些危机。</p>
                                                    <p>总之，我们要拿来。我们要或使用，或存放，或毁灭。那么，主人是新主人，宅子也就会成为新宅子。然而首先要这人沉着，勇猛，有辨别，不自私。没有拿来的，人不能自成为新人，没有拿来的，文艺不能自成为新文艺。</p>
                                                </div>
                                            </Accordion>

                                            <Accordion title="拓展阅读二：《“友邦惊诧”论》" defaultOpen={false}>
                                                <div className="text-justify text-[#3d312a] space-y-4 indent-8 leading-relaxed">
                                                    <p>只要略有知觉的人就都知道：这回学生的请愿，是因为日本占据了辽吉，南京政府束手无策，单会去哀求国联，而国联却正和日本是一伙。读书呀，读书呀，不错，学生是应该读书的，但一面也要大人老爷们不至于葬送土地，这才能够安心读书。报上不是说过，东北大学逃散，冯庸大学逃散，日本兵看见学生模样的就枪毙吗？放下书包来请愿，真是已经可怜之至。不道国民党政府却在十二月十八日通电各地军政当局文里，又加上他们“捣毁机关，阻断交通，殴伤中委，拦劫汽车，攒击路人及公务人员，私逮刑讯，社会秩序，悉被破坏”的罪名，而且指出结果，说是“友邦人士，莫名惊诧，长此以往，国将不国”了！</p>
                                                    <p>好个“友邦人士”！日本帝国主义的兵队强占了辽吉，炮轰机关，他们不惊诧；阻断铁路，追炸客车，捕禁官吏，枪毙人民，他们不惊诧。中国国民党治下的连年内战，空前水灾，卖儿救穷，砍头示众，秘密杀戮，电刑逼供，他们也不惊诧。在学生的请愿中有一点纷扰，他们就惊诧了！</p>
                                                    <p>好个国民党政府的“友邦人士”！是些什么东西！即使所举的罪状是真的罢，但这些事情，是无论那一个“友邦”也都有的，他们的维持他们的“秩序”的监狱，就撕掉了他们的“文明”的面具。摆什么“惊诧”的臭脸孔呢？</p>
                                                    <p>可是“友邦人士”一惊诧，我们的国府就怕了，“长此以往，国将不国”了，好像失了东三省，党国倒愈像一个国，失了东三省谁也不响，党国倒愈像一个国，失了东三省只有几个学生上几篇“呈文”，党国倒愈像一个国，可以博得“友邦人士”的夸奖，永远“国”下去一样。</p>
                                                    <p>几句电文，说得明白极了：怎样的党国，怎样的“友邦”。“友邦”要我们人民身受宰割，寂然无声，略有“越轨”，便加屠戮；党国是要我们遵从这“友邦人士”的希望，否则，他就要“通电各地军政当局”，“即予紧急处置，不得于事后借口无法劝阻，敷衍塞责”了！</p>
                                                    <p>因为“友邦人士”是知道的：日兵“无法劝阻”，学生们怎会“无法劝阻”？每月一千八百万的军费，四百万的政费，作什么用的呀，“军政当局”呀？</p>
                                                </div>
                                            </Accordion>
                                        </div>
                                    </div>
                                </div>
                            </section>
                        )}

                                        </div>
                                        <div>
                                            <label className="block text-xl font-bold text-[#2c2420] mb-4">推演引擎</label>
                                            <select 
                                                value={model} 
                                                onChange={(e) => setModel(e.target.value)}

                                            >
                                                <option value="deepseek-v4-flash">DeepSeek Flash (速度较快)</option>
                                                <option value="deepseek-v4-pro">DeepSeek Pro (深入思考)</option>
                                            </select>
                                        </div>

                                </div>
                            </section>
                        )}
                        
                    </div>
                </main>
            </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
