<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>大明辅弼 · 首辅之路</title>
<style>
:root{
  --paper:#f1e7cf; --paper2:#e6d7b4;
  --ink:#2b2318; --ink2:#6b5d47;
  --zhu:#9b2d22; --zhu-d:#7a2018;
  --gold:#b8860b; --gold-d:#8f6a07;
  --qing:#3a6b7c;
  --panel:rgba(43,35,24,.92);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{
  font-family:"PingFang SC","Microsoft YaHei",-apple-system,sans-serif;
  color:var(--ink);font-size:14px;line-height:1.5;
  background:
    radial-gradient(ellipse at 20% 0%, rgba(185,134,11,.08), transparent 60%),
    radial-gradient(ellipse at 100% 100%, rgba(155,45,34,.07), transparent 55%),
    var(--paper);
  overscroll-behavior:none;
}
#app{display:flex;flex-direction:column;height:100%}

#topbar{
  height:54px;flex:none;display:flex;align-items:center;gap:10px;padding:0 12px;
  background:linear-gradient(180deg,#3a2d1c,#2b2217);
  color:#f0e6cd;box-shadow:0 2px 10px rgba(0,0,0,.35);z-index:40;
}
#topbar .logo{
  width:34px;height:34px;flex:none;border-radius:8px;
  background:linear-gradient(135deg,#c9a227,#8a6a18);color:#fff;
  display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:800;
  box-shadow:0 1px 4px rgba(0,0,0,.4);
}
#topbar h1{font-size:17px;letter-spacing:3px;white-space:nowrap;font-family:"KaiTi","STKaiti","SimSun",serif}
#topbar .sub{font-size:10.5px;color:#b9a87f;margin-top:-1px;letter-spacing:2px}
.tbstat{display:flex;flex-direction:column;align-items:center;margin-left:6px;flex:none}
.tbstat .lbl{font-size:9.5px;color:#b9a87f;letter-spacing:2px}
.tbstat .val{font-size:15px;font-weight:800;color:#f2c56a;line-height:1.1}
.tbstat .val.warn{color:#e0705c}
.tbstat .val.good{color:#8fd18f}
.tbstat .val.lead{color:#ffd78a}
.tbsp{flex:1}
.icon-btn{
  width:34px;height:34px;flex:none;border-radius:9px;border:none;cursor:pointer;
  background:rgba(255,255,255,.1);color:#f0e6cd;font-size:14px;
  display:flex;align-items:center;justify-content:center;transition:background .15s;
}
.icon-btn:hover{background:rgba(255,255,255,.24)}

#main{flex:1;overflow:hidden;display:flex;flex-direction:column;position:relative}
#scroll{flex:1;overflow-y:auto;padding:10px 12px 6px}
#scroll::-webkit-scrollbar{width:6px}
#scroll::-webkit-scrollbar-thumb{background:rgba(0,0,0,.15);border-radius:3px}

#eventBar{
  display:none;margin-bottom:10px;border-radius:10px;padding:10px 14px;
  background:linear-gradient(180deg,#fff8e6,#f6e9c8);
  border:1px solid #d9c48a;box-shadow:0 2px 10px rgba(120,90,20,.15);
  position:relative;overflow:hidden;
}
#eventBar.pop{animation:eventIn .6s ease}
@keyframes eventIn{from{transform:translateY(-8px);opacity:0}to{transform:none;opacity:1}}
#eventBar .tag{
  display:inline-block;background:var(--zhu);color:#fff;font-size:10px;letter-spacing:2px;
  padding:1px 8px;border-radius:3px;margin-bottom:5px;
}
#eventBar .txt{font-size:13.5px;color:#4a3c24;font-family:"KaiTi","STKaiti","SimSun",serif}
#eventBar .fx{font-size:11.5px;color:var(--zhu);margin-top:4px;font-weight:600}

.sect{
  font-size:11px;color:var(--ink2);letter-spacing:3px;margin:4px 0 8px;
  display:flex;align-items:center;gap:8px;
}
.sect::before{content:'';width:3px;height:12px;background:var(--zhu);border-radius:2px}
.sect .hint{font-size:10.5px;color:#a8936a;letter-spacing:1px;margin-left:auto;font-weight:400}
#court{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.mini{
  background:linear-gradient(180deg,#fbf4e2,#f2e6c8);
  border:1px solid #d9c48a;border-radius:10px;padding:9px 10px;
  position:relative;box-shadow:0 1px 4px rgba(0,0,0,.06);transition:all .2s;
}
.mini.leader{border-color:var(--gold);box-shadow:0 0 0 2px rgba(184,134,11,.35),0 2px 8px rgba(0,0,0,.1)}
.mini.dead{opacity:.4;filter:grayscale(.6)}
.mini.you{border-color:var(--zhu)}
.mini .top{display:flex;align-items:center;gap:7px;margin-bottom:6px}
.seal{
  width:34px;height:34px;flex:none;border-radius:7px;color:#fff;font-size:19px;
  display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#b5442e,#8c2717);font-family:"KaiTi","STKaiti","SimSun",serif;
  box-shadow:inset 0 -2px 4px rgba(0,0,0,.25);
}
.mini .who{line-height:1.25}
.mini .bu{font-size:13px;font-weight:700;font-family:"KaiTi","STKaiti","SimSun",serif}
.mini .nm{font-size:11px;color:var(--ink2)}
.badge{
  position:absolute;top:6px;right:6px;font-size:9.5px;color:#fff;
  background:var(--gold);border-radius:3px;padding:1px 6px;letter-spacing:1px;
  font-family:"KaiTi","STKaiti","SimSun",serif;font-weight:700;
}
.badge.you{background:var(--zhu)}
.bar{display:flex;align-items:center;gap:6px;margin-top:4px;font-size:10.5px;color:var(--ink2)}
.bar .lab{width:22px;flex:none;letter-spacing:1px;font-weight:700}
.bar .track{flex:1;height:7px;background:rgba(0,0,0,.08);border-radius:4px;overflow:hidden}
.bar .fill{height:100%;border-radius:4px;transition:width .4s}
.fill.fav{background:linear-gradient(90deg,#d9503c,#9b2d22)}
.fill.rep{background:linear-gradient(90deg,#6aa3b8,#3a6b7c)}
.bar .num{width:20px;text-align:right;font-weight:700}
.men{display:flex;align-items:center;gap:3px;margin-top:4px;font-size:10px;color:var(--ink2)}
.men .m{width:8px;height:8px;border-radius:50%;background:var(--gold);display:inline-block;border:1px solid rgba(0,0,0,.15)}
.men .m.off{background:#ddd2b4}

#logWrap{background:var(--panel);color:#e8dcc0;border-radius:12px;margin-top:12px;padding:10px 12px 8px;box-shadow:0 2px 10px rgba(0,0,0,.2)}
#logTitle{font-size:11px;letter-spacing:3px;color:#c9b78f;margin-bottom:6px;display:flex;align-items:center;gap:6px}
#logTitle::before{content:'▍';color:var(--gold)}
#log{max-height:150px;overflow-y:auto;scrollbar-width:thin}
#log::-webkit-scrollbar{width:5px}
#log::-webkit-scrollbar-thumb{background:rgba(255,255,255,.15);border-radius:3px}
.le{font-size:12px;line-height:1.6;padding:2px 0;border-bottom:1px dashed rgba(255,255,255,.07)}
.le:last-child{border-bottom:none}
.le .yr{color:#8f7f5e;font-size:10px;margin-right:4px}
.le.good{color:#9fd99f}
.le.bad{color:#ef9a8c}
.le.player{color:#ffd78a}
.le.ai{color:#c8bfa0}

#op{flex:none;background:linear-gradient(180deg,#f8f0dc,#efe3c4);border-top:1px solid #dcc98f;box-shadow:0 -4px 16px rgba(0,0,0,.12);z-index:30;padding:8px 12px 10px}
#phaseLine{display:flex;align-items:center;gap:8px;font-size:12.5px;color:var(--ink2);margin-bottom:7px}
#phaseLine .dot{width:8px;height:8px;border-radius:50%;background:var(--zhu);animation:pulse 1.4s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}
#phaseLine b{color:var(--zhu);font-weight:700}

#targetRow{display:none;gap:6px;flex-wrap:wrap;margin-bottom:7px}
#targetRow .tt{
  padding:5px 10px;border-radius:8px;border:1px solid var(--zhu);background:#fff;
  color:var(--zhu);font-size:12.5px;cursor:pointer;transition:all .15s;
}
#targetRow .tt:hover{background:var(--zhu);color:#fff}
#targetRow .close{
  margin-left:auto;border:none;background:transparent;color:var(--ink2);cursor:pointer;font-size:12px;
}

#handRow{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
#handRow::-webkit-scrollbar{display:none}
.card{
  flex:none;width:150px;min-height:120px;border-radius:10px;padding:9px 10px;
  background:linear-gradient(180deg,#fffdf5,#f7edcf);
  border:1px solid #cdb877;border-top:3px solid var(--zhu);
  box-shadow:0 2px 6px rgba(0,0,0,.08);cursor:pointer;transition:all .18s;text-align:left;
  display:flex;flex-direction:column;gap:3px;
}
.card:hover{transform:translateY(-3px);box-shadow:0 6px 16px rgba(0,0,0,.14)}
.card.sel{transform:translateY(-4px);box-shadow:0 0 0 2px var(--zhu),0 6px 16px rgba(0,0,0,.16)}
.card .cdept{font-size:9.5px;color:#fff;background:var(--ink2);border-radius:3px;padding:0 6px;align-self:flex-start;letter-spacing:1px}
.card .cdept.red{background:var(--zhu)}
.card .cname{font-size:15px;font-weight:700;font-family:"KaiTi","STKaiti","SimSun",serif;color:#3a2d1c}
.card .cdesc{font-size:10.5px;color:#7a6a55;line-height:1.4;flex:1}
.card .ceff{font-size:10.5px;color:var(--zhu);font-weight:600}
#handEmpty{color:#a8936a;font-size:12px;padding:14px 4px}
#handTitle{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--ink2);letter-spacing:2px;margin:2px 0 6px}
#handTitle::before{content:'▍';color:var(--zhu)}

#actions{display:flex;gap:8px;margin-top:8px;align-items:center;flex-wrap:wrap}
.btn{
  padding:8px 16px;border:none;border-radius:9px;cursor:pointer;font-size:13px;font-weight:700;
  letter-spacing:2px;color:#fff;background:var(--zhu);font-family:inherit;
  transition:all .15s;box-shadow:0 2px 6px rgba(0,0,0,.15);
}
.btn:disabled{opacity:.4;cursor:not-allowed;box-shadow:none}
.btn:hover:not(:disabled){filter:brightness(1.1)}
.btn.gold{background:var(--gold)}
.btn.gray{background:#8a7c60}
.btn.ghost{background:transparent;color:var(--ink2);border:1px solid #c8b88d;box-shadow:none}
.btn.small{padding:5px 12px;font-size:12px}
#selHint{font-size:12px;color:var(--zhu);font-weight:600;margin-right:auto}

.modal{
  position:fixed;inset:0;background:rgba(20,14,8,.6);z-index:100;
  display:flex;align-items:center;justify-content:center;padding:20px;
  animation:fade .25s;
}
@keyframes fade{from{opacity:0}to{opacity:1}}
.mbox{
  background:linear-gradient(180deg,#fdf6e4,#f1e3c2);
  border:1px solid #cdb877;border-radius:14px;max-width:520px;width:100%;
  max-height:86vh;overflow-y:auto;padding:22px 22px 18px;
  box-shadow:0 20px 60px rgba(0,0,0,.5);position:relative;
  animation:pop .28s cubic-bezier(.2,1.2,.3,1);
}
@keyframes pop{from{transform:scale(.92);opacity:0}to{transform:scale(1);opacity:1}}
.mbox .mseal{color:var(--zhu);font-size:12px;letter-spacing:4px;font-family:"KaiTi","STKaiti","SimSun",serif}
.mbox h2{font-size:22px;margin:6px 0 10px;font-family:"KaiTi","STKaiti","SimSun",serif;color:#3a2d1c;letter-spacing:2px}
.mbox .mbody{font-size:13.5px;color:#4a3c24;line-height:1.7}
.mbox .mbody p{margin-bottom:8px}
.mbox .mfoot{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.mbox .btn{flex:1}
.mrul{font-size:12.5px;color:#4a3c24}
.mrul b{color:var(--zhu)}
.mrul .row{display:flex;gap:8px;padding:5px 0;border-bottom:1px dashed #d9c48a;align-items:baseline}
.mrul .rname{font-weight:700;min-width:88px;font-family:"KaiTi","STKaiti","SimSun",serif}

#piModal .piseal{
  font-size:56px;color:var(--zhu);text-align:center;letter-spacing:10px;
  font-family:"KaiTi","STKaiti","SimSun",serif;text-shadow:0 2px 10px rgba(155,45,34,.3);
  margin:10px 0;
}
#piModal .pipct{text-align:center;font-size:13px;color:#4a3c24;margin-bottom:4px;line-height:1.7}

#roleGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.role{
  border:1px solid #cdb877;border-radius:10px;background:#fffdf5;padding:12px;
  cursor:pointer;transition:all .18s;text-align:center;
}
.role:hover{border-color:var(--zhu);transform:translateY(-2px);box-shadow:0 6px 14px rgba(0,0,0,.12)}
.role .rseal{
  width:44px;height:44px;margin:0 auto 6px;border-radius:9px;background:linear-gradient(135deg,#b5442e,#8c2717);
  color:#fff;font-size:24px;display:flex;align-items:center;justify-content:center;
  font-family:"KaiTi","STKaiti","SimSun",serif;
}
.role .rname{font-weight:700;font-family:"KaiTi","STKaiti","SimSun",serif;font-size:16px}
.role .rab{font-size:10.5px;color:#7a6a55;line-height:1.5;margin-top:4px}

#resBig{text-align:center;padding:10px 0}
#resBig .bigseal{font-size:44px;letter-spacing:8px;font-family:"KaiTi","STKaiti","SimSun",serif;margin:12px 0}
#resBig .bigseal.win{color:var(--gold)}
#resBig .bigseal.lose{color:var(--zhu)}
#resBig .resTxt{font-size:13px;color:#4a3c24;line-height:1.8;text-align:left;margin:10px 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}
.stat{background:#fffdf5;border:1px solid #d9c48a;border-radius:8px;padding:8px;text-align:center}
.stat .n{font-size:20px;font-weight:800;color:var(--zhu)}
.stat .l{font-size:10.5px;color:#7a6a55;letter-spacing:1px;margin-top:2px}

#toast{
  position:fixed;left:50%;bottom:100px;transform:translateX(-50%);z-index:120;
  background:var(--panel);color:#f0e6cd;padding:10px 18px;border-radius:30px;
  font-size:13px;letter-spacing:1px;box-shadow:0 8px 24px rgba(0,0,0,.4);
  opacity:0;pointer-events:none;transition:opacity .3s;
}
#toast.show{opacity:1}

@media(max-width:640px){
  #topbar h1{font-size:15px;letter-spacing:1px}
  #court{grid-template-columns:repeat(3,1fr)}
  .card{width:135px;min-height:110px}
  #piModal .piseal{font-size:44px}
  .mini{padding:7px 8px}
  .seal{width:30px;height:30px;font-size:16px}
}
</style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="logo">輔</div>
    <div>
      <h1>大明辅弼</h1>
      <div class="sub">首辅之路 · 六部争衡</div>
    </div>
    <div class="tbstat"><div class="lbl">年号</div><div class="val" id="tbYear">—</div></div>
    <div class="tbstat"><div class="lbl">国势</div><div class="val" id="tbGuo">—</div></div>
    <div class="tbstat"><div class="lbl">首辅</div><div class="val lead" id="tbLead">—</div></div>
    <div class="tbstat"><div class="lbl">圣眷</div><div class="val" id="tbFav">—</div></div>
    <div class="tbsp"></div>
    <button class="icon-btn" onclick="showRules()" title="规则">规</button>
    <button class="icon-btn" onclick="confirmRestart()" title="重开">⟳</button>
  </div>

  <div id="main">
    <div id="scroll">
      <div id="eventBar"></div>
      <div class="sect">朝堂 <span class="hint" id="hintA"></span></div>
      <div id="court"></div>
      <div id="logWrap">
        <div id="logTitle">邸报</div>
        <div id="log"></div>
      </div>
      <div style="height:6px"></div>
    </div>

    <div id="op">
      <div id="phaseLine"><span class="dot"></span><span id="phaseTxt">正在开衙理事…</span></div>
      <div id="targetRow"></div>
      <div id="handTitle">奏疏 <span id="handCount"></span></div>
      <div id="handRow"></div>
      <div id="actions"></div>
    </div>
  </div>
</div>

<div id="toast"></div>
<div id="modalHost"></div>

<script>
/* =========================================================
   大明辅弼 · 首辅之路 —— 马伯庸《大明辅弼》桌游电子改编
   单文件 · 单人对抗AI · 六部争衡
   ========================================================= */
const DEPT = {'吏':'吏部','户':'户部','礼':'礼部','兵':'兵部','刑':'刑部','工':'工部'};
const NAMES = {'吏':'赵昌','户':'钱珪','礼':'孙岳','兵':'周放','刑':'吴襄','工':'郑熙'};
const ABILITY = {
  '吏':'掌铨衡。弹劾威力+1，起手官声更高。',
  '户':'掌钱粮。起手多一件珠宝，钱粮国策圣眷有加。',
  '礼':'掌礼仪。进献恩宠+1，言祥瑞事必准。',
  '兵':'掌军务。言整饬边墙事必准且国势+3，边患不损圣眷。',
  '刑':'掌刑名。弹劾所需的官声门槛-1。',
  '工':'掌营造。言兴修水利事必准且国势+2。'
};

/* ------- 奏疏牌 ------- */
const ZOU = [
  {id:'qinzheng', dept:'吏', name:'言陛下勤政事', kind:'逢迎', desc:'颂扬天子宵衣旰食，勤于政务。',
   eff:'准奏：圣眷+1；驳回：圣眷-1', suc:{fav:1}, fail:{fav:-1}},
  {id:'xiangrui', dept:'礼', name:'言祥瑞事', kind:'逢迎', desc:'奏报凤鸟翔集、嘉禾呈瑞，天降吉兆。',
   eff:'准奏：圣眷+1，官声-1；驳回：圣眷-1，国势-1', suc:{fav:1,rep:-1}, fail:{fav:-1,guo:-1}},
  {id:'bianqiang', dept:'兵', name:'言整饬边墙事', kind:'治政', desc:'奏请增修九边城垣，整饬边备。',
   eff:'准奏：国势+2，官声+1；驳回(擅开边衅)：国势-2，圣眷-1，官声-1', suc:{guo:2,rep:1}, fail:{guo:-2,fav:-1,rep:-1}},
  {id:'mianfu', dept:'户', name:'言蠲免钱粮事', kind:'治政', desc:'奏请蠲免受灾州县钱粮，以安民心。',
   eff:'准奏：国势+1，官声+1，圣眷-1；驳回：国势-1，圣眷-1', suc:{guo:1,rep:1,fav:-1}, fail:{guo:-1,fav:-1}},
  {id:'shenxing', dept:'刑', name:'言慎刑狱事', kind:'治政', desc:'奏请复核冤狱，慎用刑具。',
   eff:'准奏：圣眷+1，官声+1；驳回：官声-1', suc:{fav:1,rep:1}, fail:{rep:-1}},
  {id:'shuili', dept:'工', name:'言兴修水利事', kind:'治政', desc:'奏请疏浚河道，修筑堤坝。',
   eff:'准奏：国势+1，官声+1；驳回：官声-1', suc:{guo:1,rep:1}, fail:{rep:-1}},
  {id:'qingwang', dept:'廷', name:'树清望', kind:'名望', desc:'结交清流，广布令名，以标榜风骨。',
   eff:'准奏：官声+2；驳回：官声-1', suc:{rep:2}, fail:{rep:-1}},
  {id:'tejin', dept:'廷', name:'特进恩荣', kind:'恩宠', desc:'曲意逢迎天颜，谋一进身之阶。',
   eff:'准奏：圣眷+2；驳回：圣眷-1', suc:{fav:2}, fail:{fav:-1}},
  {id:'zibian', dept:'廷', name:'上疏自辩', kind:'自保', desc:'抗章自辩，剖白心迹，以释天子之疑。',
   eff:'准奏：圣眷+1，官声-1；驳回：圣眷-1', suc:{fav:1,rep:-1}, fail:{fav:-1}},
  {id:'miansheng', dept:'廷', name:'门生帖', kind:'结党', desc:'保举门生故吏，广植党羽。',
   eff:'准奏：门生+1，官声+1；驳回：官声-1', suc:{men:1,rep:1}, fail:{rep:-1}},
  {id:'jianxian', dept:'吏', name:'荐贤任能', kind:'结党', desc:'荐举亲信入朝，以为奥援。',
   eff:'准奏：门生+1，官声+1，圣眷-1；驳回：圣眷-1', suc:{men:1,rep:1,fav:-1}, fail:{fav:-1}},
  {id:'mixin', dept:'廷', name:'密奏', kind:'密谋', desc:'深夜封事，密陈机宜于天子，成败难料。',

let deck=[];
function buildDeck(){
  deck=[];
  const mul={'qinzheng':2,'xiangrui':2,'bianqiang':2,'mianfu':2,'shenxing':2,'shuili':2,
    'qingwang':1,'tejin':1,'zibian':2,'miansheng':2,'jianxian':1,'mixin':2,'kouque':1,
    'dantong':2,'shiwei':2,'yushi':1,'douyushi':1};
  for(const id in mul) for(let i=0;i<mul[id];i++) deck.push(id);
  shuffle(deck);
}
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}}
function drawCard(){ if(!deck.length) buildDeck(); return deck.pop(); }

let S=null, selCard=null, selTarget=null, waiting=false;
const SAVE_KEY='fubi_save_v1';
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const $=id=>document.getElementById(id);

function addLog(txt,kind){
  S.log.unshift({y:S.year,t:txt,k:kind||'info'});
  if(S.log.length>80)S.log.pop();
}
function toast(t){const e=$('toast');e.textContent=t;e.classList.add('show');clearTimeout(e._t);e._t=setTimeout(()=>e.classList.remove('show'),1800)}
function leader(){return S.players.find(p=>p.isLeader)}
function me(){return S.players.find(p=>p.isPlayer)}
function pf(i){return S.players[i]}

function batchPass(actor){
  const p=pf(actor);
  if(S.forcePass&&p.isPlayer){S.forcePass=false;return true;}
  const prob=clamp(0.42+p.fav*0.05,0.28,0.9);
  return Math.random()<prob;
}

/* ---------- 效果结算 ---------- */
function applyEff(p,eff){
  let out=[];
  const fmt=(pre,n)=>pre+(n>0?'+':'')+n;
  if(eff.fav){p.fav=clamp(p.fav+eff.fav,0,10);out.push(fmt('圣眷',eff.fav));}
  if(eff.rep){p.rep=clamp(p.rep+eff.rep,0,10);out.push(fmt('官声',eff.rep));}
  if(eff.men){p.men=clamp(p.men+eff.men,0,4);out.push(fmt('门生',eff.men));}
  if(eff.guo){S.guo=clamp(S.guo+eff.guo,0,10);out.push(fmt('国势',eff.guo));}
  return out;
}

/* 普通批红（含各部长处加成），玩家与AI共用 */
function resolveFavor(c,p){
  const pass=batchPass(S.players.indexOf(p));
  const label=p.isPlayer?'player':'ai';
  if(pass){
    const addons=[];
    if(c.id==='xiangrui'&&p.bu==='礼'){p.fav=clamp(p.fav+1,0,10);addons.push('礼部加成圣眷+1');}
    if(c.id==='bianqiang'&&p.bu==='兵'){S.guo=clamp(S.guo+1,0,10);addons.push('兵部加成国势+1');}
    if(c.id==='shuili'&&p.bu==='工'){S.guo=clamp(S.guo+1,0,10);addons.push('工部加成国势+1');}
    const r=applyEff(p,c.suc);
    addLog('【'+p.name+'】'+c.name+'：天子准奏（'+r.concat(addons).join('，')+'）',label);
    return '天子朱批：准奏。';
  }else{
    const r=applyEff(p,c.fail);
    addLog('【'+p.name+'】'+c.name+'：天子批驳（'+r.join('，')+'）','bad');
    if(c.id==='bianqiang')addLog('言整饬边墙事翻作「擅开边衅」，祸由此生','bad');
    return '天子朱批：所奏不合，驳回。';
  }
}

/* 玩家打牌主入口 */
function playCard(pIdx,cardId,target){
  const p=pf(pIdx);
  const c=ZOU.find(z=>z.id===cardId);
  const ci=p.hand.indexOf(cardId); if(ci>-1)p.hand.splice(ci,1);

  if(c.petition){
    const L=leader();
    if(L){L.fav=clamp(L.fav-1,0,10);}
    p.rep=clamp(p.rep+1,0,10);
    addLog('【'+p.name+'】'+c.name+'：当廷叩阙，首辅'+(L?L.name:'—')+'圣眷-1，'+(p.isPlayer?'你':'他')+'官声+1','player');
    return '叩阙死谏，直折首辅！';
  }
  if(c.secret){
    const r=Math.random();
    if(r<0.34){p.fav=clamp(p.fav+2,0,10);addLog('【'+p.name+'】密奏获嘉纳，圣眷+2','player');return '密奏获嘉纳，天子暗喜。'}
    else if(r<0.67){S.guo=clamp(S.guo+1,0,10);addLog('【'+p.name+'】密奏于国有益，国势+1','player');return '密奏暗中有益于国。'}
    else {p.fav=clamp(p.fav-1,0,10);p.rep=clamp(p.rep-1,0,10);addLog('【'+p.name+'】密奏反遭猜忌，圣眷-1官声-1','bad');return '密奏触怒天颜，反遭猜忌。'}
  }
  if(c.target){
    const T=target!=null?pf(target):(c.target==='leader'?leader():null);
    if(!T){addLog('【'+p.name+'】欲弹劾而无可劾之人，作罢','info');return '无可弹劾之人。'}
    const pass=batchPass(pIdx);
    if(pass){
      let dmg=c.dmg||2;
      if(p.bu==='吏')dmg+=1;
      if(p.rep>=6)dmg+=1;
      if(c.tgtRep){T.rep=clamp(T.rep-1,0,10);}
      let blocked=0;
      while(dmg>0&&T.men>0){T.men--;dmg--;blocked++;}
      if(T.rep>=6)dmg=Math.max(0,dmg-1);
      T.fav=clamp(T.fav-dmg,0,10);
      addLog('【'+p.name+'】'+c.name+'：天子准奏，'+T.name+'圣眷-'+dmg+(blocked?('（门生代挡'+blocked+'）'):''),'player');
      if(T.isLeader)checkTopple();
      return '天子准奏，'+DEPT[T.bu]+'尚书'+T.name+'遭重创！';
    }else{
      if(c.fail){applyEff(p,c.fail);}
      addLog('【'+p.name+'】'+c.name+'：留中不发，反遭讥议','bad');
      return '弹劾被留中不发，天子不纳。';
    }
  }
  return resolveFavor(c,p);
}

/* ---------- 首辅倒台 / 胜负 ---------- */
function checkTopple(){
  const L=leader();
  if(!L||L.fav>0)return;
  if(L.isPlayer){
    addLog('首辅'+L.name+'圣眷尽失，被罢官夺职！','bad');
    endGame('lose','mount');
    return;
  }
  addLog('首辅'+L.name+'圣眷尽失，罢官去职！','bad');
  L.isLeader=false; L.dead=true; L.fav=0;
  const cands=S.players.filter(p=>!p.dead&&!p.isLeader);
  if(!cands.length){ addLog('朝堂一空，社稷危矣','bad'); endGame('lose','luan'); return; }
  const next=cands.sort((a,b)=>b.fav-a.fav||b.rep-a.rep)[0];
  next.isLeader=true;
  if(next.isPlayer){ addLog('天子点中了你，入阁拜相，执掌票拟！','player'); toast('你当上了首辅！守住圣眷与国势！'); }
  else addLog('新首辅为'+next.bu+'部'+next.name+'，朝局易主','info');
}

function checkWin(phase){
  if(S.guo<=0){ endGame('lose','luan'); return true; }
  if(S.guo>=10){ endGame('win','shengshi'); return true; }
  if(phase==='yearEnd'&&S.year>S.maxYear){ endGame(me().isLeader?'win':'lose','years'); return true; }
  return false;
}

function endGame(res,why){
  if(S.phase==='over')return;
  S.phase='over'; waiting=true;
  const p=me();
  const msg = res==='win'
    ? (why==='shengshi'
      ? '<p>国势登顶，四海升平，万邦来朝。'+(p.isLeader?'你作为首辅总揽朝纲，名留青史。':'然则主政者非你，功业归于他人。')+'</p>'
      : '<p>八载已过，朝局定鼎。'+(p.isLeader?'你稳稳坐住了首辅之位，青史留名！':'然则首辅另有其人，你功亏一篑。')+'</p>')
    : (why==='mount'
      ? '<p>圣眷尽失，你被罢官夺职，一夜之间门庭冷落。子孙后代，仕途亦绝。</p>'
      : why==='luan'
        ? '<p>国势崩坏，边患内乱并起，大明社稷倾颓。此非一人之罪，然在朝诸公，无一幸免。</p>'
        : '<p>八载终局，你始终未能登上首辅之位。</p>');
  const big = res==='win'?'<div class="bigseal win">功成</div>':'<div class="bigseal lose">败局</div>';
  showModal(`<div id="resBig"><div class="mseal">大明辅弼</div>
    <h2>${res==='win'?'大功告成':'功败垂成'}</h2>${big}
    <div class="resTxt">${msg}</div>
    <div class="stats">
      <div class="stat"><div class="n">${p.fav}</div><div class="l">你的圣眷</div></div>
      <div class="stat"><div class="n">${p.rep}</div><div class="l">你的官声</div></div>
      <div class="stat"><div class="n">${S.guo}</div><div class="l">终局国势</div></div>
    </div>
    <div class="mfoot">
      <button class="btn gold" onclick="location.reload()">再来一局</button>
      <button class="btn gray" onclick="closeModal();showRules()">查看规则</button>
    </div></div>`);
}

        const need=(c.needRep||0)-(me().bu==='刑'?1:0);
        if(c.target){
          html+=`<span id="selHint">${selTarget!=null?'具本弹劾 · '+DEPT[pf(selTarget).bu]+pf(selTarget).name:'选择弹劾对象（需官声≥'+need+'）'}</span>`;
          if(selTarget!=null)html+=`<button class="btn" onclick="confirmPlay()">上奏弹劾</button>`;
        }else{
          html+=`<button class="btn" onclick="confirmPlay()">上奏</button>`;
        }
      }
      html+=`<button class="btn ghost" onclick="clearSel()">取消</button>`;
    }else{
      html+=`<button class="btn gray" onclick="endTurn()">歇朝 · 岁末</button>`;
    }
  }
  box.innerHTML=html;
  renderTargets();
}
function renderTargets(){
  const row=$('targetRow');
  if(!selCard||selCard.startsWith('@')){row.style.display='none';row.innerHTML='';return;}
  const c=ZOU.find(z=>z.id===selCard);
  if(!c.target){row.style.display='none';row.innerHTML='';return;}
  row.style.display='flex';
  let tgtList;
  if(c.target==='leader')tgtList=S.players.filter(p=>p.isLeader&&!p.isPlayer);
  else tgtList=S.players.filter(p=>!p.isPlayer&&!p.dead);
  row.innerHTML=tgtList.map(p=>{
    const i=S.players.indexOf(p);
    return `<span class="tt" onclick="pickTarget(${i})" style="${selTarget===i?'background:var(--zhu);color:#fff':''}">${DEPT[p.bu]}·${p.name}</span>`;
  }).join('')+`<button class="close" onclick="clearSel()">取消</button>`;
  if(!tgtList.length)row.innerHTML='<span style="font-size:12px;color:#a8936a">当前无人可弹劾</span><button class="close" onclick="clearSel()">取消</button>';
}
function renderEvent(){
  if(!S.curEvent){$('eventBar').style.display='none';return;}
  $('eventBar').style.display='block';
  $('eventBar').innerHTML=`<span class="tag">国策 · ${S.curEvent.name}</span>
    <div class="txt">${S.curEvent.txt}</div><div class="fx">${S.curEvent.fx}</div>`;
}
function renderLog(){
  $('log').innerHTML=S.log.map(e=>`<div class="le ${e.k}"><span class="yr">[${e.y}年]</span>${e.t}</div>`).join('');
  const el=$('log');el.scrollTop=0;
}
function renderAll(){renderTop();renderCourt();renderHand();renderEvent();renderLog();setPhaseTxt();}

function setPhaseTxt(){
  let t;
  if(S.phase==='over')t='朝局已定，江山易主';
  else if(S.phase==='ai')t='群臣廷议，轮番上疏…';
  else if(S.phase==='act')t=(me().isLeader?'你为当朝首辅，':'你身为尚书，')+'请上奏、进献或歇朝度岁';
  else t='正在开衙理事…';
  $('phaseTxt').textContent=t;
}

/* ---------- 玩家操作 ---------- */
function pickCard(id){
  if(S.phase!=='act'||waiting)return;
  selCard=selCard===id?null:id; selTarget=null;
  renderHand();
}
function pickTarget(i){selTarget=i;renderHand();}
function clearSel(){selCard=null;selTarget=null;renderHand();}

function confirmPlay(){
  if(waiting)return;
  const p=me();
  if(selCard&&selCard.startsWith('@'))return giftItem();
  const c=ZOU.find(z=>z.id===selCard);
  if(!c)return;
  const need=(c.needRep||0)-(p.bu==='刑'?1:0);
  if(c.needRep&&need>p.rep){toast('官声不足'+need+'，难以发难');return;}
  if(c.target&&selTarget==null){toast('请选择弹劾对象');return;}
  waiting=true;
  const msg=playCard(S.players.indexOf(p),selCard,c.target?selTarget:null);
  selCard=null;selTarget=null;
  renderAll();
  if(S.phase==='over'){return;}
  if(checkWin('act')){renderAll();return;}
  if(c.petition||c.secret){
    waiting=false;
    toast(msg);
    continueAct();
    return;
  }
  showPi(msg,c);
}
function giftItem(){
  if(waiting)return;
  if(!selCard||!selCard.startsWith('@'))return;
  const id=selCard.slice(1);
  const p=me();
  const it=ITEMS.find(x=>x.id===id);
  if(!it)return;
  const res=it.fn(p);
  p.items=p.items.filter(x=>x!==id);
  let parts=[];
  if(res.forcePass){S.forcePass=true;parts.push('下次批红必准');}
  if(res.fav){p.fav=clamp(p.fav+res.fav,0,10);parts.push('圣眷'+(res.fav>0?'+':'')+res.fav);}
  if(res.rep){p.rep=clamp(p.rep+res.rep,0,10);parts.push('官声'+(res.rep>0?'+':'')+res.rep);}
  if(res.guo){S.guo=clamp(S.guo+res.guo,0,10);parts.push('国势'+(res.guo>0?'+':'')+res.guo);}
  addLog('【'+p.name+'】'+it.name+'：'+parts.join('，'),'player');
  selCard=null;selTarget=null;
  renderAll();
  if(checkWin('act')){renderAll();return;}
}
function endTurn(){
  if(waiting||S.phase!=='act')return;
  addLog('—— 建文第'+S.year+'年议事已毕 ——','info');
  waiting=true;selCard=null;selTarget=null;
  renderAll();
  afterPlayerAct();
}
function continueAct(){
  closeModal();
  if(S.phase==='over')return;
  waiting=false; S.phase='act';
  renderAll();
  toast('还可进献私藏，或歇朝度岁');
}

/* ---------- 批红弹窗 ---------- */
function showPi(msg,c){
  const isImp=c&&c.target;
  showModal(`<div id="piModal"><div class="mseal">内阁进呈 · 御览</div>
    <h2 style="text-align:center">${c?c.name:''}</h2>
    <div class="piseal">${isImp?'准·驳':'朱批'}</div>
    <div class="pipct">${msg}</div>
    <div class="mfoot"><button class="btn gold" onclick="continueAct()">臣退</button></div></div>`);
}

/* 玩家行动后 → AI 阶段 */
function afterPlayerAct(){
  if(S.phase==='over')return;
  S.phase='ai';
  renderAll();
  return aiPhase();
}

/* ---------- AI ---------- */
async function aiPhase(){
  waiting=true;
  const order=S.players.filter(p=>!p.isPlayer&&!p.dead);
  for(const m of order){
    if(S.phase==='over')return;
    await sleep(600);
    if(S.phase==='over')return;
    if(m.dead)continue;
    aiAct(m);
    renderAll();
    const L=leader();
    if(L&&L.fav<=0)checkTopple();
    if(S.phase==='over')return;
    if(checkWin('act')){renderAll();return;}
  }
  await sleep(300);
  if(S.phase==='over')return;
  yearEnd();
}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

function aiAct(m){
  const p=m;
  const L=leader();
  const mep=me();
  // 首辅自保
  if(p.isLeader){
    if(p.fav<5&&Math.random()<0.8){ fakePlay(p,'tejin'); }
    else if(p.fav<7&&Math.random()<0.5){ fakePlay(p,'zibian'); }
    else if(S.guo<7){ fakePlay(p,['qinzheng','mianfu','shuili'][Math.floor(Math.random()*3)]); }
    else fakePlay(p,'qingwang');
    return;
  }
  const canImp=need=>p.rep>=need-(p.bu==='刑'?1:0);
  const agenda=p.agenda;
  if(agenda==='野心'){
    if(L&&!L.dead&&L.fav<=p.fav+1&&canImp(4)){ fakeImpeach(p,L,'dantong'); return; }
    if(Math.random()<0.5){ fakePlay(p,'tejin'); } else { fakePlay(p,'xiangrui'); }
  }else if(agenda==='党争'){
    const target=(mep.isLeader||mep.fav>=L.fav)?mep:L;
    if(target&&target!==p&&!target.dead&&target.fav>2&&canImp(3)){ fakeImpeach(p,target,'shiwei'); return; }
    fakePlay(p,'qinzheng');
  }else if(agenda==='谄媚'){
    if(p.items.length){ fakeGift(p); }
    else fakePlay(p,'xiangrui');
  }else{ // 忠直
    if(L&&!L.dead&&L.fav<3&&Math.random()<0.7){
      L.fav=clamp(L.fav+1,0,10); p.rep=clamp(p.rep+1,0,10);
      addLog('【'+p.name+'】上疏保奏首辅：'+L.name+'圣眷+1，'+p.name+'官声+1','ai');
    }else if(S.guo<7){ fakePlay(p,['mianfu','shuili','bianqiang'][Math.floor(Math.random()*3)]); }
    else fakePlay(p,'qinzheng');
  }
}
function fakePlay(p,id){
  const c=ZOU.find(z=>z.id===id);
  if(!c)return;
  if(c.petition){
    const L=leader();
    if(L){L.fav=clamp(L.fav-1,0,10);}
    p.rep=clamp(p.rep+1,0,10);
    addLog('【'+p.name+'】叩阙死谏：首辅圣眷-1，'+p.name+'官声+1','ai');
    return;
  }
  if(c.secret){
    const r=Math.random();
    if(r<0.34){p.fav=clamp(p.fav+1,0,10);addLog('【'+p.name+'】'+c.name+'：圣眷+1','ai')}
    else if(r<0.67){S.guo=clamp(S.guo+1,0,10);addLog('【'+p.name+'】'+c.name+'：国势+1','ai')}
    else {p.fav=clamp(p.fav-1,0,10);addLog('【'+p.name+'】'+c.name+'：反遭猜忌','bad')}
    return;
  }
  if(c.target){ return; } // 弹劾由 fakeImpeach 处理
  resolveFavor(c,p);
}
function fakeImpeach(p,T,cid){
  const c=ZOU.find(z=>z.id===cid);
  if(!c||!T)return;
  const pass=batchPass(S.players.indexOf(p));
  if(pass){
    let dmg=c.dmg; if(p.bu==='吏')dmg++; if(p.rep>=6)dmg++;
    let blocked=0;
    while(dmg>0&&T.men>0){T.men--;dmg--;blocked++;}
    if(T.rep>=6)dmg=Math.max(0,dmg-1);
    T.fav=clamp(T.fav-dmg,0,10);
    addLog('【'+p.name+'】'+c.name+'：天子准奏，'+T.name+'圣眷-'+dmg+(blocked?('（门生代挡'+blocked+'）'):''),'ai');
    if(T.isLeader)checkTopple();
  }else{
    addLog('【'+p.name+'】'+c.name+'：留中不发','ai');
  }
}
function fakeGift(p){
  if(!p.items.length)return;
  const id=p.items.shift();
  const it=ITEMS.find(x=>x.id===id);
  if(!it)return;
  const r=it.fn(p);
  const parts=[];
  if(r.fav){p.fav=clamp(p.fav+r.fav,0,10);parts.push('圣眷'+(r.fav>0?'+':'')+r.fav);}
  if(r.rep){p.rep=clamp(p.rep+r.rep,0,10);parts.push('官声'+(r.rep>0?'+':'')+r.rep);}
  if(r.guo){S.guo=clamp(S.guo+r.guo,0,10);parts.push('国势'+(r.guo>0?'+':'')+r.guo);}
  addLog('【'+p.name+'】'+it.name+'：'+parts.join('，'),'ai');
}

/* ---------- 回合流程 ---------- */
function startYear(){
  waiting=true; selCard=null;selTarget=null;
  S.year++;
  const L=leader();
  if(L&&S.year>1){L.fav=clamp(L.fav+1,0,10);addLog('首辅'+L.name+'坐拥票拟之权，圣眷+1','info');}
  const ev=EVENTS[Math.floor(Math.random()*EVENTS.length)];
  S.curEvent=ev; ev.fn(S);
  addLog('国策·'+ev.name+'：'+ev.txt,'info');
  const p=me();
  if(p.items.length<2&&Math.random()<0.4){
    const pool=['shuhua','zhubao','danyao'];
    const got=pool[Math.floor(Math.random()*pool.length)];
    p.items.push(got);
    addLog('门生暗中孝敬，你获'+ITEMS.find(x=>x.id===got).name+'一件','player');
  }
  while(p.hand.length<4&&deck.length){ p.hand.push(drawCard()); }
  if(p.isLeader)addLog('你如今身居首辅，坐议大政，唯惧圣眷动摇','info');
  renderAll();
  const E=$('eventBar');E.classList.remove('pop');void E.offsetWidth;E.classList.add('pop');
  setTimeout(()=>{ if(S.phase==='over')return; waiting=false; S.phase='act'; renderAll(); },650);
}
function yearEnd(){
  if(S.phase==='over')return;
  const p=me();
  while(p.hand.length>4)p.hand.pop();
  const L=leader();
  if(L&&L.fav<=0)checkTopple();
  if(S.phase==='over')return;
  if(checkWin('yearEnd'))return;
  addLog('—— 建文第'+S.year+'年结束 ——','info');
  startYear();
}

/* ---------- 弹窗 ---------- */
function showModal(html){
  $('modalHost').innerHTML=`<div class="modal"><div class="mbox">${html}</div></div>`;
}
function closeModal(){ $('modalHost').innerHTML=''; }

function showRules(){
  showModal(`<div class="mseal">大明辅弼 · 电子版</div>
  <h2>游戏规则</h2>
  <div class="mbody"><div class="mrul">
  <p><b>背景：</b>本作改编自马伯庸《大明辅弼》桌游，你扮演大明朝六部尚书之一，在朝堂之上争权固宠，终极目标是——当上<b>首辅</b>。</p>
  <p><b>核心数值：</b></p>
  <p class="row"><span class="rname" style="color:var(--zhu)">圣眷</span><span>天子恩宠。被弹劾会损失圣眷，圣眷尽失即罢官。批红概率随圣眷提高。</span></p>
  <p class="row"><span class="rname" style="color:var(--qing)">官声</span><span>清望名节。弹劾需要官声门槛（2~5），官声≥6可减免弹劾伤害。</span></p>
  <p class="row"><span class="rname" style="color:var(--gold)">门生</span><span>党羽。可代你抵挡弹劾伤害，也可在储位之争中获利。</span></p>
  <p class="row"><span class="rname">国势</span><span>天下气运。登顶10为盛世（首辅胜）；归零为社稷崩坏（全员败）。</span></p>
  <p><b>每岁流程：</b>国策→补手牌→<b>上奏</b>（奏疏一张，经天子批红）→（可选）<b>进献</b>私藏道具→<b>歇朝度岁</b>→群臣轮番行动→岁末结算。</p>
  <p><b>胜负：</b>若首辅圣眷尽失则倒台，圣眷最高者继任首辅。身为首辅若圣眷尽失——即刻败北；撑到国势≥10（盛世）或第8年结束即为大胜。非首辅须在终局前扳倒当朝首辅并取而代之。</p>
  <p><b>弹劾：</b>弹劾类奏疏需官声达标（刑部-1）。准奏则目标圣眷受损，其门生可代挡伤害，官声高者亦可减免。</p>
  <p><b>各部长处：</b>吏·弹劾威力+1｜户·起手珠宝｜礼·进献/祥瑞恩宠+1｜兵·边墙奏疏强化｜刑·弹劾门槛-1｜工·水利奏疏强化。</p>
  <p style="color:var(--ink2);font-size:11px">自动存档于浏览器本地，重开可换部重来。</p>
  </div></div>
  <div class="mfoot"><button class="btn gold" onclick="closeModal()">明白</button></div>`);
}
function confirmRestart(){
  showModal(`<div class="mbody"><p>确定要重开新朝吗？当前进度将丢失。</p></div>
  <div class="mfoot"><button class="btn" onclick="closeModal();newGame()">重开</button><button class="btn gray" onclick="closeModal()">取消</button></div>`);
}

/* ---------- 开局 ---------- */
function newGame(bu){
  if(bu==null){
    showModal(`<div class="mseal">大明辅弼 · 电子版</div>
    <h2>择一部为官</h2>
    <div class="mbody"><p>请选择你在六部中的官位。六部各有专长，首辅之位现由吏部赵昌把持。</p>
    <div id="roleGrid">${['吏','户','礼','兵','刑','工'].map(b=>`
      <div class="role" onclick="newGame('${b}')">
        <div class="rseal">${b}</div>
        <div class="rname">${DEPT[b]}尚书</div>
        <div class="rab">${ABILITY[b]}</div>
      </div>`).join('')}
    </div></div>
    <div class="mfoot"><button class="btn gray" onclick="showRules()">先看规则</button></div>`);
    return;
  }
  S={
    year:1,maxYear:8,guo:5,curEvent:null,log:[],forcePass:false,phase:'start',
    players:['吏','户','礼','兵','刑','工'].map(b=>({
      bu:b,name:NAMES[b],fav:3,rep:3,men:0,isPlayer:(b===bu),isLeader:(b==='吏'),dead:false,
      agenda:null,hand:[],items:[]
    }))
  };
  const p=me();
  p.fav=4;
  if(p.bu==='吏')p.rep=4;
  if(p.bu==='户')p.items.push('zhubao');
  p.items.push('shuhua');
  buildDeck();
  while(p.hand.length<4)p.hand.push(drawCard());
  const L=leader(); L.fav=5; L.men=1;
  const ags=['忠直','谄媚','党争','野心','忠直'];
  shuffle(ags);
  S.players.filter(x=>!x.isPlayer).forEach((m,i)=>m.agenda=ags[i]);
  addLog('新朝开基，吏部尚书赵昌坐拥首辅之位，恩眷正隆','info');
  addLog('你以'+DEPT[p.bu]+'尚书入仕，且看风云如何际会','player');
  save();
  $('eventBar').style.display='none';
  closeModal();
  startYear();
}

function save(){ try{ localStorage.setItem(SAVE_KEY,JSON.stringify(S)); }catch(e){} }
setInterval(()=>{ if(S&&S.phase!=='start'&&S.phase!=='over')save(); },3000);

window.addEventListener('load',()=>{
  try{ const d=localStorage.getItem(SAVE_KEY); if(d){ S=JSON.parse(d); if(S&&S.players){ S.phase='act'; waiting=false; selCard=null; selTarget=null; renderAll(); return; } } }catch(e){}
  newGame();
});
</script>
