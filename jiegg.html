<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#17324d">
<title>小鸡接鸡蛋</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;overscroll-behavior:none}
  body{
    min-height:100vh;display:flex;align-items:center;justify-content:center;padding:14px;
    font-family:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",system-ui,sans-serif;
    background:radial-gradient(1200px 800px at 50% 18%,#2b5d8a 0%,#17324d 60%,#0e1f33 100%);
    overflow:hidden;
  }
  .wrap{position:relative;width:min(92vw,calc((100vh - 42px) * .75),480px)}
  @supports (height:100dvh){.wrap{width:min(92vw,calc((100dvh - 42px) * .75),480px)}}
  canvas{
    display:block;width:100%;height:auto;border-radius:18px;background:#bde7ff;
    box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 0 6px rgba(255,255,255,.06);
    touch-action:none;
  }
  .side{position:absolute;right:12px;top:60px;display:flex;flex-direction:column;gap:10px;z-index:6}
  .icon-btn{
    width:40px;height:40px;border-radius:50%;border:none;cursor:pointer;font-size:17px;line-height:1;
    background:rgba(255,255,255,.88);box-shadow:0 3px 10px rgba(0,0,0,.28);transition:transform .1s;
  }
  .icon-btn:active{transform:scale(.9)}
  .overlay{
    position:absolute;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;
    gap:12px;text-align:center;color:#fff;padding:20px;border-radius:18px;
    background:rgba(14,32,52,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);
  }
  .hidden{display:none!important}
  .big{font-size:62px;line-height:1;filter:drop-shadow(0 6px 12px rgba(0,0,0,.35));animation:bob 1.6s ease-in-out infinite}
  @keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
  .overlay h1{font-size:30px;letter-spacing:3px}
  .overlay p{font-size:14px;opacity:.92}
  .rules{
    list-style:none;display:flex;flex-direction:column;gap:7px;font-size:14px;
    background:rgba(255,255,255,.13);padding:12px 20px;border-radius:14px;
  }
  .rules b{color:#ffe066}
  .best{font-size:14px;opacity:.9}
  .btn{
    margin-top:4px;font-size:18px;font-weight:700;color:#fff;letter-spacing:2px;cursor:pointer;
    background:linear-gradient(180deg,#ff9a62,#ff6b4a);border:none;border-radius:999px;padding:13px 44px;
    box-shadow:0 8px 18px rgba(255,107,74,.45),inset 0 -3px 0 rgba(0,0,0,.18);transition:transform .12s;
  }
  .btn:hover{transform:translateY(-2px)}
  .btn:active{transform:scale(.95)}
  .btn.ghost{background:rgba(255,255,255,.16);box-shadow:none;border:1px solid rgba(255,255,255,.4);margin-top:0;padding:10px 32px;font-size:15px}
  .keys{font-size:12px;opacity:.7}
  .record{font-size:16px;color:#ffe066;animation:pop .5s ease infinite alternate}
  @keyframes pop{from{transform:scale(1)}to{transform:scale(1.12)}}
</style>
</head>
<body>
<div class="wrap">
  <canvas id="game"></canvas>

  <div class="side">
    <button class="icon-btn" id="pauseBtn" title="暂停 (P)">⏸</button>
    <button class="icon-btn" id="muteBtn" title="声音开关">🔊</button>
  </div>

  <div class="overlay" id="startOverlay">
    <div class="big">🐤</div>
    <h1>小鸡接鸡蛋</h1>
    <ul class="rules">
      <li>🥚 普通蛋 <b>+1</b>，漏接扣 1 命</li>
      <li>✨ 金蛋 <b>+5</b>，可遇不可求</li>
      <li>🪨 石头蛋：千万别接，接了扣命！</li>
      <li>📈 每接 10 个蛋，速度 +1 级</li>
    </ul>
    <div class="best">历史最佳：🥚 <b id="bestStart">0</b></div>
    <button class="btn" id="startBtn">开始接蛋</button>
    <p class="keys">← → / A D 移动 · 支持鼠标与触屏拖动 · P 暂停 · 空格开始</p>
  </div>

  <div class="overlay hidden" id="overOverlay">
    <div class="big">🥚</div>
    <h1>接蛋结束</h1>
    <p>这只小鸡这次接了 <b id="finalScore" style="font-size:20px;color:#ffe066">0</b> 个蛋</p>
    <div class="record hidden" id="newRecord">🎉 打破纪录！</div>
    <div class="best">历史最佳：🥚 <b id="bestOver">0</b></div>
    <button class="btn" id="againBtn">再来一次</button>
  </div>

  <div class="overlay hidden" id="pauseOverlay">
    <div class="big">😴</div>
    <h1>已暂停</h1>
    <button class="btn" id="resumeBtn">继续游戏</button>
    <button class="btn ghost" id="restartPauseBtn">重新开始</button>
  </div>
</div>

<script>
(()=>{ 'use strict';
const W=480, H=640, GROUND=H-72;
const cv=document.getElementById('game');
const ctx=cv.getContext('2d');
function fit(){
  const dpr=Math.min(2,window.devicePixelRatio||1);
  cv.width=W*dpr; cv.height=H*dpr;
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
fit();

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:(v>b?b:v);
const rand=(a,b)=>a+Math.random()*(b-a);

/* ---------------- 音效 (WebAudio 合成) ---------------- */
let muted=localStorage.getItem('jidan_mute')==='1';
let actx=null;
function audio(){
  if(!actx){ try{ actx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} }
  if(actx&&actx.state==='suspended') actx.resume();
  return actx;
}
function tone(f,dur,type,vol,delay,slideTo){
  const a=audio(); if(!a||muted) return;
  type=type||'sine'; vol=(vol==null)?0.16:vol; delay=delay||0;
  try{
    const t0=a.currentTime+delay;
    const o=a.createOscillator(), g=a.createGain();
    o.type=type; o.frequency.setValueAtTime(f,t0);
    if(slideTo) o.frequency.exponentialRampToValueAtTime(Math.max(30,slideTo),t0+dur);
    g.gain.setValueAtTime(0.0001,t0);
    g.gain.exponentialRampToValueAtTime(vol,t0+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
    o.connect(g); g.connect(a.destination);
    o.start(t0); o.stop(t0+dur+0.05);
  }catch(e){}
}
const SFX={
  catch(){ tone(720,.09,'sine',.14); tone(1080,.12,'sine',.11,.06); },
  gold(){ [784,988,1319].forEach((f,i)=>tone(f,.16,'triangle',.15,i*.07)); },
  bad(){ tone(150,.32,'sawtooth',.18,0,55); },
  miss(){ tone(320,.28,'square',.07,0,120); },
  dust(){ tone(95,.12,'triangle',.07); },
  level(){ [523,659,784].forEach((f,i)=>tone(f,.13,'triangle',.14,i*.08)); },
  over(){ [440,330,247,196].forEach((f,i)=>tone(f,.24,'triangle',.16,i*.16)); }
};

/* ---------------- 状态 ---------------- */
let state='idle';               // idle | playing | over
let paused=false;
let eggCount=0, lives=3;
let best=+(localStorage.getItem('jidan_best')||0);
let level=1, prevLevel=1;
let eggsArr=[], parts=[], texts=[];
let spawnT=1, shake=0, flash=0;
let announce=null;              // {text, life}
const player={x:W/2, target:W/2, vx:0};
const CL={
  a:{x:90, y:118, s:1.05, v:10},
  b:{x:280,y:76,  s:0.8,  v:14},
  c:{x:410,y:160, s:0.6,  v:8}
};

/* ---------------- 输入 ---------------- */
const keys={L:false,R:false};
addEventListener('keydown',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a') keys.L=true;
  if(k==='arrowright'||k==='d') keys.R=true;
  if(k===' '||k==='enter'){
    e.preventDefault();
    if(state!=='playing'&&!e.repeat) start();
  }
  if((k==='p'||k==='escape')&&!e.repeat){ e.preventDefault(); togglePause(); }
});
addEventListener('keyup',e=>{
  const k=e.key.toLowerCase();
  if(k==='arrowleft'||k==='a') keys.L=false;
  if(k==='arrowright'||k==='d') keys.R=false;
});
function toGameX(cx){ const r=cv.getBoundingClientRect(); return (cx-r.left)/r.width*W; }
cv.addEventListener('mousemove',e=>{ player.target=clamp(toGameX(e.clientX),20,W-20); });
cv.addEventListener('touchstart',e=>{ if(e.touches[0]) player.target=clamp(toGameX(e.touches[0].clientX),20,W-20); },{passive:true});
cv.addEventListener('touchmove',e=>{ e.preventDefault(); if(e.touches[0]) player.target=clamp(toGameX(e.touches[0].clientX),20,W-20); },{passive:false});

/* ---------------- 粒子 / 飘字 ---------------- */
function burst(x,y,color,n,sp){
  n=n||10; sp=sp||160;
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, v=rand(sp*.3,sp);
    parts.push({x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v-70,g:460,life:rand(.35,.65),ttl:.65,size:rand(2,5),col:color});
  }
}
function addText(x,y,str,col,size){
  texts.push({x,y,str,col:col||'#fff',size:size||18,life:1.1,ttl:1.1});
}
function updateFx(dt){
  for(let i=parts.length-1;i>=0;i--){
    const p=parts[i]; p.life-=dt;
    if(p.life<=0){ parts.splice(i,1); continue; }
    p.vy+=p.g*dt; p.x+=p.vx*dt; p.y+=p.vy*dt;
  }
  for(let i=texts.length-1;i>=0;i--){
    const o=texts[i]; o.life-=dt;
    if(o.life<=0){ texts.splice(i,1); continue; }
    o.y-=36*dt;
  }
  if(announce) announce.life-=dt;
  flash=Math.max(0,flash-2.5*dt);
  shake=Math.max(0,shake-36*dt);
}

/* ---------------- 游戏逻辑 ---------------- */
function handleCatch(e){
  if(state!=='playing') return;
  if(e.type==='gold'){
    eggCount+=5; SFX.gold();
    burst(e.x,e.y,'#ffd93b',16,210);
    addText(e.x,e.y-26,'+5 金蛋！','#e89400',22);
  }else if(e.type==='bad'){
    SFX.bad();
    burst(e.x,e.y,'#9a8f7d',14,190);
    addText(e.x,e.y-26,'💔 被砸了！','#e04040',20);
    damage();
  }else{
    eggCount++; SFX.catch();
    burst(e.x,e.y,'#fff3d6',8,150);
    addText(e.x,e.y-26,'+1','#ffffff',18);
  }
}
function handleMiss(e){
  if(state!=='playing') return;
  SFX.miss();
  burst(e.x,GROUND-12,'#ffffff',10,170);
  addText(e.x,GROUND-48,'💔 漏了！','#e04040',20);
  damage();
}
function damage(){
  if(state!=='playing') return;
  lives--; flash=1; shake=Math.max(shake,9);
  if(lives<=0){ lives=0; gameOver(); }
}
function gameOver(){
  if(state==='over') return;
  state='over';
  SFX.over();
  const rec=eggCount>best;
  if(rec){ best=eggCount; localStorage.setItem('jidan_best',String(best)); }
  $('finalScore').textContent=eggCount;
  $('bestOver').textContent=best;
  $('newRecord').classList.toggle('hidden',!rec);
  setTimeout(()=>{ if(state==='over') $('overOverlay').classList.remove('hidden'); },600);
}
function updateGame(dt){
  const dir=(keys.R?1:0)-(keys.L?1:0);
  if(dir!==0){
    player.vx=dir*430;
    player.x+=dir*430*dt;
    player.target=player.x;
  }else{
    const px=player.x;
    player.x+=(player.target-player.x)*Math.min(1,dt*15);
    player.vx=(player.x-px)/Math.max(dt,1e-4);
  }
  player.x=clamp(player.x,34,W-34);

  level=clamp(1+Math.floor(eggCount/10),1,9);
  if(level>prevLevel){
    prevLevel=level;
    announce={text:'Lv.'+level+' 速度提升！',life:1.4};
    SFX.level();
  }

  const interval=Math.max(0.34,1.15-(level-1)*0.085);
  spawnT-=dt;
  if(spawnT<=0){
    spawnT=rand(interval*0.7,interval*1.35);
    const badP=Math.min(0.2,0.05+(level-1)*0.035);
    const r=Math.random();
    const type=(r<badP)?'bad':(r<badP+0.12?'gold':'egg');
    const spk=[0,1,2,3].map(()=>({x:rand(-8,8),y:rand(-10,10)}));
    eggsArr.push({x:rand(36,W-36),y:-24,vy:150+(level-1)*26+rand(-12,12),type,seed:Math.random()*10,spk});
  }

  const catchTop=GROUND-88;
  for(let i=eggsArr.length-1;i>=0;i--){
    const e=eggsArr[i];
    e.y+=e.vy*dt;
    if(e.y>catchTop&&e.y<GROUND+6&&Math.abs(e.x-player.x)<46){
      eggsArr.splice(i,1);
      handleCatch(e);
      if(state!=='playing') break;
      continue;
    }
    if(e.y>=GROUND-14){
      eggsArr.splice(i,1);
      if(e.type==='bad'){ burst(e.x,GROUND-10,'#b7a98f',6,120); SFX.dust(); }
      else { handleMiss(e); if(state!=='playing') break; }
    }
  }
}
function start(){
  audio();
  state='playing'; paused=false;
  eggCount=0; lives=3; level=1; prevLevel=1;
  eggsArr=[]; parts=[]; texts=[];
  player.x=W/2; player.target=W/2; player.vx=0;
  spawnT=0.8; shake=0; flash=0;
  announce={text:'开始接蛋！',life:1.2};
  $('startOverlay').classList.add('hidden');
  $('overOverlay').classList.add('hidden');
  $('pauseOverlay').classList.add('hidden');
  $('pauseBtn').textContent='⏸';
  $('bestStart').textContent=best;
  if(document.activeElement&&document.activeElement.blur) document.activeElement.blur();
}
function togglePause(){
  if(state!=='playing') return;
  paused=!paused;
  $('pauseOverlay').classList.toggle('hidden',!paused);
  $('pauseBtn').textContent=paused?'▶':'⏸';
}
function updateClouds(dt){
  for(const k in CL){ const c=CL[k]; c.x+=c.v*dt; if(c.x>W+90) c.x=-90; }
}

/* ---------------- 绘制 ---------------- */
function drawBG(t){
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,'#9fd8f7'); g.addColorStop(0.7,'#cdeefb'); g.addColorStop(1,'#e6f8ff');
  ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  const sg=ctx.createRadialGradient(W-70,128,4,W-70,128,46);
  sg.addColorStop(0,'rgba(255,236,150,.95)'); sg.addColorStop(1,'rgba(255,236,150,0)');
  ctx.fillStyle=sg; ctx.beginPath(); ctx.arc(W-70,128,46,0,7); ctx.fill();
  ctx.fillStyle='#ffe9a8'; ctx.beginPath(); ctx.arc(W-70,128,19,0,7); ctx.fill();
}
function drawCloud(c){
  ctx.fillStyle='rgba(255,255,255,.92)';
  ctx.beginPath();
  ctx.arc(c.x,c.y,16*c.s,0,7);
  ctx.arc(c.x+18*c.s,c.y+4*c.s,13*c.s,0,7);
  ctx.arc(c.x-18*c.s,c.y+5*c.s,12*c.s,0,7);
  ctx.arc(c.x+2*c.s,c.y+8*c.s,14*c.s,0,7);
  ctx.fill();
}
function drawGround(){
  const g=ctx.createLinearGradient(0,GROUND,0,H);
  g.addColorStop(0,'#8ed15f'); g.addColorStop(1,'#5da33d');
  ctx.fillStyle=g; ctx.fillRect(0,GROUND,W,H-GROUND);
  ctx.fillStyle='#4e8a30'; ctx.fillRect(0,GROUND,W,4);
  ctx.strokeStyle='rgba(46,98,28,.5)'; ctx.lineWidth=2;
  for(let i=0;i<12;i++){
    const gx=(i*47+20)%W, gy=GROUND+14+((i*13)%38);
    ctx.beginPath();
    ctx.moveTo(gx,gy+5); ctx.lineTo(gx-3,gy-2);
    ctx.moveTo(gx,gy+5); ctx.lineTo(gx,gy-4);
    ctx.moveTo(gx,gy+5); ctx.lineTo(gx+3,gy-2);
    ctx.stroke();
  }
}
function drawChick(t){
  const bobY=(state==='idle')?Math.sin(t*2.6)*3:0;
  const tilt=clamp(player.vx/1400,-0.14,0.14);
  const x=player.x, y=GROUND-46+bobY;
  ctx.fillStyle='rgba(30,60,20,.18)';
  ctx.beginPath(); ctx.ellipse(player.x,GROUND+7,30,7,0,0,7); ctx.fill();

  ctx.save(); ctx.translate(x,y); ctx.rotate(tilt);
  // 脚
  ctx.fillStyle='#ff9f43';
  ctx.beginPath(); ctx.ellipse(-11,40,7,4,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11,40,7,4,0,0,7); ctx.fill();
  // 翅膀
  const flap=Math.sin(t*(8+Math.min(8,Math.abs(player.vx)/60)))*(0.35+Math.min(0.5,Math.abs(player.vx)/500));
  ctx.fillStyle='#ffc94d';
  ctx.save(); ctx.translate(-29,3); ctx.rotate(0.35+flap*0.6);
  ctx.beginPath(); ctx.ellipse(0,0,7,12,0,0,7); ctx.fill(); ctx.restore();
  ctx.save(); ctx.translate(29,3); ctx.rotate(-0.35-flap*0.6);
  ctx.beginPath(); ctx.ellipse(0,0,7,12,0,0,7); ctx.fill(); ctx.restore();
  // 身体
  const bg=ctx.createLinearGradient(0,-38,0,38);
  bg.addColorStop(0,'#fff6c9'); bg.addColorStop(1,'#ffd75e');
  ctx.fillStyle=bg;
  ctx.strokeStyle='rgba(186,120,20,.5)'; ctx.lineWidth=2;
  ctx.beginPath(); ctx.ellipse(0,0,30,37,0,0,7); ctx.fill(); ctx.stroke();
  // 头顶绒毛
  ctx.fillStyle='#ff9f43';
  [[-8,-38,4.5],[0,-42,5],[8,-38,4.5]].forEach(p=>{
    ctx.beginPath(); ctx.arc(p[0],p[1],p[2],0,7); ctx.fill();
  });
  // 腮红
  ctx.fillStyle='rgba(255,140,150,.55)';
  ctx.beginPath(); ctx.arc(-16,-6,4.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(16,-6,4.5,0,7); ctx.fill();
  // 眼睛 (会眨眼)
  const blink=((t%3.2)<0.12)?0.15:1;
  ctx.fillStyle='#3a2e22';
  ctx.beginPath(); ctx.ellipse(-11,-13,5,5*blink,0,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(11,-13,5,5*blink,0,0,7); ctx.fill();
  if(blink===1){
    ctx.fillStyle='#fff';
    ctx.beginPath(); ctx.arc(-12.5,-14.5,1.7,0,7); ctx.fill();
    ctx.beginPath(); ctx.arc(9.5,-14.5,1.7,0,7); ctx.fill();
  }
  // 嘴巴
  ctx.fillStyle='#ff8c1a';
  ctx.beginPath();
  ctx.moveTo(-5,-3); ctx.quadraticCurveTo(0,-9,5,-3); ctx.quadraticCurveTo(0,4,-5,-3);
  ctx.closePath(); ctx.fill();
  ctx.restore();
}
function drawEgg(e,t){
  ctx.save();
  ctx.translate(e.x,e.y);
  ctx.rotate(Math.sin(t*3+e.seed)*0.14);
  if(e.type==='gold'){
    ctx.shadowColor='rgba(255,190,40,.85)'; ctx.shadowBlur=14;
    const g=ctx.createRadialGradient(-4,-6,2,0,0,20);
    g.addColorStop(0,'#fff3c4'); g.addColorStop(1,'#ffb62e');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(0,0,13,17,0,0,7); ctx.fill();
    ctx.shadowBlur=0;
    ctx.strokeStyle='rgba(200,130,0,.7)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,.95)'; ctx.lineWidth=2;
    ctx.beginPath();
    ctx.moveTo(-4,-12); ctx.lineTo(-4,-2);
    ctx.moveTo(-9,-7); ctx.lineTo(1,-7);
    ctx.stroke();
  }else if(e.type==='bad'){
    const g=ctx.createRadialGradient(-4,-6,2,0,0,20);
    g.addColorStop(0,'#d8d2c6'); g.addColorStop(1,'#8f8574');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(0,0,13,17,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(80,70,55,.6)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.strokeStyle='rgba(70,62,50,.75)'; ctx.lineWidth=1.6;
    ctx.beginPath();
    ctx.moveTo(-8,-6); ctx.lineTo(-3,-2); ctx.lineTo(-7,3); ctx.lineTo(-1,7);
    ctx.stroke();
  }else{
    const g=ctx.createRadialGradient(-4,-6,2,0,0,22);
    g.addColorStop(0,'#ffffff'); g.addColorStop(1,'#f2e0b6');
    ctx.fillStyle=g;
    ctx.beginPath(); ctx.ellipse(0,0,13,17,0,0,7); ctx.fill();
    ctx.strokeStyle='rgba(190,160,90,.45)'; ctx.lineWidth=1.5; ctx.stroke();
    ctx.fillStyle='rgba(190,160,90,.5)';
    e.spk.forEach(s=>{ ctx.beginPath(); ctx.arc(s.x,s.y,1.6,0,7); ctx.fill(); });
  }
  ctx.restore();
}
function drawParts(){
  parts.forEach(p=>{
    ctx.globalAlpha=clamp(p.life/p.ttl,0,1);
    ctx.fillStyle=p.col;
    ctx.beginPath(); ctx.arc(p.x,p.y,p.size,0,7); ctx.fill();
  });
  ctx.globalAlpha=1;
}
function drawTexts(){
  texts.forEach(o=>{
    ctx.globalAlpha=clamp(o.life/o.ttl,0,1);
    ctx.font='800 '+o.size+'px "PingFang SC","Microsoft YaHei",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.lineWidth=5; ctx.strokeStyle='rgba(80,50,10,.65)';
    ctx.strokeText(o.str,o.x,o.y);
    ctx.fillStyle=o.col; ctx.fillText(o.str,o.x,o.y);
  });
  ctx.globalAlpha=1;
}
function rr(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function drawHUD(){
  ctx.fillStyle='rgba(255,255,255,.6)';
  rr(8,8,W-16,44,14); ctx.fill();
  ctx.font='700 19px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textBaseline='middle';
  ctx.textAlign='left'; ctx.fillStyle='#4a3a10';
  ctx.fillText('🥚 '+eggCount+'  ⭐ '+best,24,31);
  ctx.textAlign='center'; ctx.fillStyle='#b06f10';
  ctx.fillText('Lv.'+level,W/2,31);
  ctx.textAlign='right'; ctx.fillStyle='#d33';
  ctx.fillText('❤️'.repeat(Math.max(0,lives))+'🤍'.repeat(Math.max(0,3-lives)),W-24,31);
  ctx.textAlign='left';
}
function drawAnnounce(){
  if(!announce||announce.life<=0) return;
  ctx.save();
  ctx.globalAlpha=clamp(announce.life,0,1);
  ctx.font='800 34px "PingFang SC","Microsoft YaHei",sans-serif';
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.lineWidth=7; ctx.strokeStyle='rgba(255,255,255,.9)';
  ctx.strokeText(announce.text,W/2,H*0.35);
  ctx.fillStyle='#ff8c1a';
  ctx.fillText(announce.text,W/2,H*0.35);
  ctx.restore();
}

/* ---------------- 主循环 ---------------- */
let last=performance.now();
function frame(now){
  const dt=Math.min(0.05,(now-last)/1000)||0.016; last=now;
  const t=now/1000;
  updateClouds(dt);
  if(state==='playing'&&!paused){ updateGame(dt); updateFx(dt); }
  else if(state==='over'){ updateFx(dt); }

  const s=(shake>0.2)?shake:0;
  const sx=(Math.random()*2-1)*s, sy=(Math.random()*2-1)*s;
  ctx.save(); ctx.translate(sx,sy);
  drawBG(t);
  for(const k in CL) drawCloud(CL[k]);
  drawGround();
  drawChick(t);
  eggsArr.forEach(e=>drawEgg(e,t));
  drawParts();
  drawTexts();
  ctx.restore();
  drawHUD();
  drawAnnounce();
  if(flash>0){
    ctx.fillStyle='rgba(255,70,70,'+Math.min(.32,flash*.32).toFixed(3)+')';
    ctx.fillRect(0,0,W,H);
  }
  requestAnimationFrame(frame);
}

/* ---------------- 按钮初始化 ---------------- */
$('startBtn').onclick=()=>start();
$('againBtn').onclick=()=>start();
$('resumeBtn').onclick=()=>togglePause();
$('restartPauseBtn').onclick=()=>start();
$('pauseBtn').onclick=()=>togglePause();
function refreshMute(){ $('muteBtn').textContent=muted?'🔇':'🔊'; }
$('muteBtn').onclick=()=>{
  muted=!muted;
  localStorage.setItem('jidan_mute',muted?'1':'0');
  refreshMute();
};
refreshMute();
$('bestStart').textContent=best;
document.addEventListener('visibilitychange',()=>{
  if(document.hidden&&state==='playing'&&!paused) togglePause();
});

requestAnimationFrame(frame);
})();
</script>
