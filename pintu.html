<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>长截图拼接</title>
<style>
:root{
    --bg:#F5F0E8;--card:#FFFDF7;--primary:#B8453A;--primary-light:#D4645A;
    --accent:#C8A951;--accent-light:#E8D48B;--text:#2C2420;--text-light:#6B5D52;
    --border:#D4C5B0;--border-light:#E8DDD0;--success:#6B9F7E;--success-light:#8FBFA0;
    --shadow:0 4px 20px rgba(44,36,32,.08);--shadow-lg:0 8px 40px rgba(44,36,32,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei","Noto Sans SC",sans-serif;background:var(--bg);color:var(--text);min-height:100vh;padding:0}
.container{max-width:960px;margin:0 auto;padding:16px}
h1{font-size:clamp(20px,5vw,28px);font-weight:700;text-align:center;padding:20px 16px 16px;color:var(--text);letter-spacing:1px}
h1::after{content:'';display:block;width:40px;height:3px;background:linear-gradient(90deg,var(--primary),var(--accent));margin:10px auto 0;border-radius:2px}
.card{background:var(--card);border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:var(--shadow);border:1px solid var(--border-light)}
.drop-area{border:2px dashed var(--border);border-radius:12px;padding:clamp(24px,6vw,40px) 16px;text-align:center;color:var(--text-light);cursor:pointer;transition:all .3s ease;background:linear-gradient(135deg,#FFFDF7 0%,#F8F3EB 100%)}
.drop-area:hover,.drop-area.drag-over{border-color:var(--primary);color:var(--primary);background:linear-gradient(135deg,#FFF8F5 0%,#FEF0EC 100%);transform:translateY(-2px);box-shadow:0 6px 24px rgba(184,69,58,.1)}
.drop-area svg{width:48px;height:48px;margin-bottom:12px;opacity:.5;pointer-events:none}
.drop-area .main-text{font-size:16px;font-weight:500;margin-bottom:6px}
.drop-area .sub-text{font-size:13px;opacity:.7}
.drop-area input{display:none}
.image-list{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px;min-height:8px}
.thumb{position:relative;width:clamp(64px,18vw,88px);aspect-ratio:3/4;border:2px solid var(--border-light);border-radius:10px;overflow:hidden;background:#f9f9f9;cursor:grab;user-select:none;flex-shrink:0;transition:all .2s}
.thumb:hover{border-color:var(--primary);transform:scale(1.03)}
.thumb:active{cursor:grabbing}
.thumb img{width:100%;height:100%;object-fit:cover;pointer-events:none}
.thumb .idx{position:absolute;top:4px;left:4px;background:rgba(44,36,32,.75);color:#fff;font-size:11px;font-weight:600;padding:2px 6px;border-radius:10px;backdrop-filter:blur(4px)}
.thumb .del{position:absolute;top:4px;right:4px;width:20px;height:20px;line-height:18px;text-align:center;background:rgba(184,69,58,.9);color:#fff;border-radius:50%;font-size:14px;cursor:pointer;z-index:2;transition:transform .2s}
.thumb .del:hover{transform:scale(1.15)}
.thumb.dragging{opacity:.3;transform:scale(.95)}
.thumb-touch-ghost{position:fixed;z-index:9999;pointer-events:none;opacity:.85;border:2px solid var(--primary);box-shadow:0 8px 32px rgba(0,0,0,.25);transition:none}
.thumb.drag-left{border-left:4px solid var(--primary);box-shadow:inset 4px 0 0 var(--primary-light)}
.thumb.drag-left::before{content:'◀';position:absolute;left:-20px;top:50%;transform:translateY(-50%);color:var(--primary);font-size:16px;z-index:10}
.thumb.drag-right{border-right:4px solid var(--primary);box-shadow:inset -4px 0 0 var(--primary-light)}
.thumb.drag-right::after{content:'▶';position:absolute;right:-20px;top:50%;transform:translateY(-50%);color:var(--primary);font-size:16px;z-index:10}
.controls{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px;justify-content:center}
.btn{padding:10px 20px;border:none;border-radius:10px;font-size:14px;font-weight:500;cursor:pointer;transition:all .2s;display:inline-flex;align-items:center;gap:6px}
.btn-primary{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff;box-shadow:0 4px 12px rgba(184,69,58,.25)}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(184,69,58,.35)}
.btn-primary:disabled{background:#ccc;box-shadow:none;cursor:not-allowed;transform:none}
.btn-accent{background:linear-gradient(135deg,var(--accent) 0%,var(--accent-light) 100%);color:#fff;box-shadow:0 4px 12px rgba(200,169,81,.25)}
.btn-accent:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(200,169,81,.35)}
.btn-outline{background:transparent;color:var(--text-light);border:1.5px solid var(--border)}
.btn-outline:hover{border-color:var(--primary);color:var(--primary)}
.btn-group{display:inline-flex;border-radius:10px;overflow:hidden;border:1.5px solid var(--border)}
.btn-group .btn{border-radius:0;border:none;background:var(--card);color:var(--text-light);padding:8px 16px}
.btn-group .btn.on{background:linear-gradient(135deg,var(--primary) 0%,var(--primary-light) 100%);color:#fff}
.status{font-size:13px;color:var(--text-light);margin:10px 0;padding:8px 12px;background:rgba(200,169,81,.08);border-radius:8px;border-left:3px solid var(--accent)}
.hint{text-align:center;font-size:12px;color:var(--accent);margin:8px 0;display:none;padding:6px;background:rgba(200,169,81,.06);border-radius:8px}
.hint.show{display:block}
.result-wrap{width:100%;overflow:hidden;position:relative;background:linear-gradient(135deg,#E8E0D4 0%,#D4C5B0 100%);border-radius:12px;min-height:200px}
.result-inner{position:relative;margin:0 auto}
.result-inner canvas{display:block;width:100%;height:auto}
.seam-v{position:absolute;left:0;right:0;height:24px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center}
.seam-v svg{width:100%;height:24px;display:block}
.seam-v .tip{position:absolute;right:8px;top:50%;transform:translateY(-50%);font-size:11px;color:var(--text-light);background:rgba(255,253,247,.95);padding:3px 8px;border-radius:8px;pointer-events:none;display:none;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.seam-v:hover .tip{display:block}
.seam-v.open{cursor:ns-resize}
.seam-v.open .tip{display:block;color:var(--accent);background:rgba(255,253,247,.95);border:1px solid var(--accent-light)}
.seam-v.open line{stroke:var(--accent);stroke-dasharray:8 3}
.seam-h-seam{position:absolute;top:0;bottom:0;width:24px;z-index:10;cursor:pointer;display:flex;align-items:center;justify-content:center}
.seam-h-seam svg{width:24px;height:100%;display:block}
.seam-h-seam .tip{position:absolute;bottom:4px;left:50%;transform:translateX(-50%);font-size:10px;color:var(--text-light);background:rgba(255,253,247,.95);padding:3px 6px;border-radius:6px;pointer-events:none;display:none;white-space:nowrap;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.seam-h-seam:hover .tip{display:block}
.seam-h-seam.open{cursor:ew-resize}
.seam-h-seam.open .tip{display:block;color:var(--accent);background:rgba(255,253,247,.95);border:1px solid var(--accent-light)}
.seam-h-seam.open line{stroke:var(--accent);stroke-dasharray:8 3}
.tip-text{font-size:12px;color:var(--text-light);margin-top:8px;text-align:center;opacity:.7}
.download-btns{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;margin-top:16px}
.lightbox{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(44,36,32,.92);z-index:1000;display:none;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(8px)}
.lightbox.show{display:flex}
.lightbox img{max-width:100%;max-height:100%;object-fit:contain;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.lightbox-close{position:absolute;top:20px;right:20px;width:40px;height:40px;background:rgba(255,255,255,.15);border:none;border-radius:50%;color:#fff;font-size:24px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s}
.lightbox-close:hover{background:rgba(255,255,255,.25)}
.crop-overlay{position:absolute;top:0;left:0;width:100%;height:100%;z-index:20;display:none}
.crop-overlay.active{display:block}
.crop-box{position:absolute;border:2px dashed #fff;box-shadow:0 0 0 9999px rgba(44,36,32,.5);cursor:move}
.crop-handle{position:absolute;width:16px;height:16px;background:#fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,.3)}
.crop-handle.tl{top:-8px;left:-8px;cursor:nw-resize}
.crop-handle.tr{top:-8px;right:-8px;cursor:ne-resize}
.crop-handle.bl{bottom:-8px;left:-8px;cursor:sw-resize}
.crop-handle.br{bottom:-8px;right:-8px;cursor:se-resize}
.crop-actions{position:absolute;bottom:-50px;left:50%;transform:translateX(-50%);display:flex;gap:8px;white-space:nowrap}
.crop-actions .btn{padding:6px 14px;font-size:12px}
@media(max-width:600px){
    .container{padding:12px}
    .card{padding:16px;border-radius:12px}
    .controls{gap:8px}
    .btn{padding:8px 14px;font-size:13px}
    .btn-group .btn{padding:6px 12px;font-size:13px}
    .download-btns{flex-direction:column;align-items:stretch}
    .download-btns .btn{justify-content:center}
}
@media(min-width:601px) and (max-width:900px){
    .container{padding:16px}
}
</style>
</head>
<body>
<div class="container">
<h1>长截图拼接</h1>

<div class="card">
    <div class="drop-area" id="dropArea">
        <svg viewBox="0 0 48 48" fill="none" stroke="currentColor" stroke-width="2"><path d="M24 32V16m0 0l-8 8m8-8l8 8M8 40h32"/><rect x="4" y="4" width="40" height="40" rx="4"/></svg>
        <div class="main-text">点击或拖拽截图到此处</div>
        <div class="sub-text">自动识别重叠区域 · 无缝拼接长图（可多次添加）</div>
        <input type="file" id="fileIn" accept="image/*">
    </div>
    <div class="image-list" id="imgList"></div>
    <div class="controls">
        <div class="btn-group" id="dirBtns">
            <button class="btn on" data-d="v">垂直拼接</button>
            <button class="btn" data-d="h">水平拼接</button>
        </div>
        <button class="btn btn-primary" id="stitchBtn" disabled>开始拼接</button>
        <button class="btn btn-outline" id="clearBtn">清空</button>
    </div>
    <div class="tip-text">拖拽缩略图可调整顺序 · 点击图片可放大查看</div>
</div>

<div class="card" id="resultPanel" style="display:none">
    <div class="status" id="status"></div>
    <div class="hint" id="hint">点击虚线缝解锁 → 拖动图片微调 → 松手自动锁定</div>
    <div class="result-wrap" id="resultWrap">
        <div class="result-inner" id="resultInner"></div>
        <div class="crop-overlay" id="cropOverlay">
            <div class="crop-box" id="cropBox">
                <div class="crop-handle tl" data-h="tl"></div>
                <div class="crop-handle tr" data-h="tr"></div>
                <div class="crop-handle bl" data-h="bl"></div>
                <div class="crop-handle br" data-h="br"></div>
            </div>
        </div>
    </div>
    <div class="controls" style="justify-content:center;margin-top:12px">
        <button class="btn btn-outline" id="cropBtn">裁剪</button>
    </div>
    <div class="download-btns">
        <button class="btn btn-primary" id="dlPng">下载 PNG</button>
        <button class="btn btn-accent" id="dlJpg">下载 JPG</button>
    </div>
</div>
</div>

<div class="lightbox" id="lightbox">
    <button class="lightbox-close" id="lightboxClose">×</button>
    <img id="lightboxImg" src="">
</div>

<script>
(function(){
const $=id=>document.getElementById(id);
const drop=$('dropArea'),fileIn=$('fileIn'),imgList=$('imgList');
const stitchBtn=$('stitchBtn'),clearBtn=$('clearBtn');
const resultPanel=$('resultPanel'),resultInner=$('resultInner'),resultWrap=$('resultWrap');
const statusEl=$('status'),hint=$('hint');
const dlPng=$('dlPng'),dlJpg=$('dlJpg');
const dirBtns=$('dirBtns');
const lightbox=$('lightbox'),lightboxImg=$('lightboxImg'),lightboxClose=$('lightboxClose');
const cropOverlay=$('cropOverlay'),cropBox=$('cropBox'),cropBtn=$('cropBtn');

let imgs=[],mode='v',seamState={},curScale=1;
let cropMode=false,cropRect={x:0,y:0,w:0,h:0};

drop.addEventListener('click',()=>fileIn.click());
drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag-over')});
drop.addEventListener('dragleave',()=>drop.classList.remove('drag-over'));
drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag-over');addFiles(e.dataTransfer.files)});
fileIn.addEventListener('change',e=>{addFiles(e.target.files);e.target.value=''});

function addFiles(files){
    const arr=Array.from(files).filter(f=>f.type.startsWith('image/'));
    arr.sort((a,b)=>a.name.localeCompare(b.name,{numeric:true}));
    arr.forEach(f=>{
        const img=new Image(),url=URL.createObjectURL(f);
        img.onload=()=>{
            imgs.push({img,url,crop:{t:0,b:0,l:0,r:0}});
            renderThumbs();
            if(imgs.every(it=>it.img.width>0&&it.img.height>0))stitchBtn.disabled=imgs.length<2;
        };
        img.onerror=()=>{URL.revokeObjectURL(url)};
        img.src=url;
    });
}

let dragIdx=-1;
function renderThumbs(){
    imgList.innerHTML='';
    imgs.forEach((it,i)=>{
        const d=document.createElement('div');
        d.className='thumb';d.draggable=true;
        d.innerHTML=`<img src="${it.url}"><span class="idx">${i+1}</span><span class="del" data-i="${i}">×</span>`;
        d.addEventListener('click',e=>{
            if(e.target.classList.contains('del'))return;
            lightboxImg.src=it.url;lightbox.classList.add('show');
        });
        d.addEventListener('dragstart',e=>{dragIdx=i;d.classList.add('dragging');e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain','')});
        d.addEventListener('dragend',()=>{d.classList.remove('dragging');dragIdx=-1;imgList.querySelectorAll('.thumb').forEach(t=>t.classList.remove('drag-left','drag-right'))});
        d.addEventListener('dragover',e=>{e.preventDefault();e.dataTransfer.dropEffect='move';const r=d.getBoundingClientRect();d.classList.remove('drag-left','drag-right');d.classList.add(e.clientX<r.left+r.width/2?'drag-left':'drag-right')});
        d.addEventListener('dragleave',()=>d.classList.remove('drag-left','drag-right'));
        d.addEventListener('drop',e=>{
            e.preventDefault();d.classList.remove('drag-left','drag-right');
            if(dragIdx<0||dragIdx===i)return;
            const r=d.getBoundingClientRect(),before=e.clientX<r.left+r.width/2;
            const item=imgs.splice(dragIdx,1)[0];
            let t=i;if(dragIdx<i)t=before?i-1:i;
            imgs.splice(t,0,item);renderThumbs();stitchBtn.disabled=imgs.length<2;
        });
        d.querySelector('.del').onclick=e=>{e.stopPropagation();URL.revokeObjectURL(imgs[+e.target.dataset.i].url);imgs.splice(+e.target.dataset.i,1);renderThumbs();stitchBtn.disabled=imgs.length<2};

        let touchState=null,ghostEl=null;
        d.addEventListener('touchstart',e=>{
            const t=e.touches[0];
            touchState={idx:i,startX:t.clientX,startY:t.clientY,started:false};
        },{passive:true});
        d.addEventListener('touchmove',e=>{
            if(!touchState)return;
            const t=e.touches[0];
            const dx=t.clientX-touchState.startX,dy=t.clientY-touchState.startY;
            if(!touchState.started){
                if(Math.abs(dx)<10&&Math.abs(dy)<10)return;
                touchState.started=true;
                ghostEl=d.cloneNode(true);
                ghostEl.classList.add('thumb-touch-ghost');
                ghostEl.style.width=d.offsetWidth+'px';
                ghostEl.style.height=d.offsetHeight+'px';
                document.body.appendChild(ghostEl);
                d.classList.add('dragging');
            }
            e.preventDefault();
            ghostEl.style.left=(t.clientX-d.offsetWidth/2)+'px';
            ghostEl.style.top=(t.clientY-d.offsetHeight/2)+'px';
            imgList.querySelectorAll('.thumb').forEach(t=>t.classList.remove('drag-left','drag-right'));
            const el=document.elementFromPoint(t.clientX,t.clientY);
            const over=el?el.closest('.thumb'):null;
            if(over&&over!==d){
                const r=over.getBoundingClientRect();
                over.classList.add(t.clientX<r.left+r.width/2?'drag-left':'drag-right');
            }
        },{passive:false});
        d.addEventListener('touchend',e=>{
            if(!touchState||!touchState.started){
                touchState=null;
                if(ghostEl){ghostEl.remove();ghostEl=null}
                return;
            }
            const t=e.changedTouches[0];
            imgList.querySelectorAll('.thumb').forEach(x=>{x.classList.remove('dragging','drag-left','drag-right')});
            if(ghostEl){ghostEl.remove();ghostEl=null}
            const el=document.elementFromPoint(t.clientX,t.clientY);
            const over=el?el.closest('.thumb'):null;
            if(over&&over!==d){
                const r=over.getBoundingClientRect();
                const before=t.clientX<r.left+r.width/2;
                let targetIdx=+over.querySelector('.del').dataset.i;
                const item=imgs.splice(touchState.idx,1)[0];
                if(touchState.idx<targetIdx)targetIdx=before?targetIdx-1:targetIdx;
                imgs.splice(targetIdx,0,item);
                renderThumbs();
                stitchBtn.disabled=imgs.length<2;
            }
            touchState=null;
        },{passive:true});

        imgList.appendChild(d);
    });
}

lightboxClose.onclick=()=>lightbox.classList.remove('show');
lightbox.onclick=e=>{if(e.target===lightbox)lightbox.classList.remove('show')};

dirBtns.addEventListener('click',e=>{
    const b=e.target.closest('button');if(!b)return;
    dirBtns.querySelectorAll('button').forEach(x=>x.classList.remove('on'));
    b.classList.add('on');mode=b.dataset.d;
});

clearBtn.onclick=()=>{imgs.forEach(it=>URL.revokeObjectURL(it.url));imgs=[];seamState={};renderThumbs();stitchBtn.disabled=true;resultPanel.style.display='none';cropMode=false;cropOverlay.classList.remove('active')};

function findOverlap(a,b){
    const isV=mode==='v';
    const dimA=isV?a.height:a.width, dimB=isV?b.height:b.width;
    const crossA=isV?a.width:a.height, crossB=isV?b.width:b.height;
    const cw=Math.min(crossA,crossB);
    if(cw===0)return 0;
    const sw=Math.min(400,cw);
    const scale=sw/cw;
    const scanPx=Math.min(dimA,dimB);
    const sh=Math.round(scanPx*scale);
    if(sh<3)return 0;

    const cv=document.createElement('canvas');cv.width=sw;cv.height=sh;
    const ctx=cv.getContext('2d',{willReadFrequently:true});

    if(isV)ctx.drawImage(a,0,dimA-scanPx,crossA,scanPx,0,0,sw,sh);
    else ctx.drawImage(a,dimA-scanPx,0,scanPx,crossA,0,0,sh,sw);
    const dA=ctx.getImageData(0,0,sw,sh).data;

    ctx.clearRect(0,0,sw,sh);
    if(isV)ctx.drawImage(b,0,0,crossB,scanPx,0,0,sw,sh);
    else ctx.drawImage(b,0,0,scanPx,crossB,0,0,sh,sw);
    const dB=ctx.getImageData(0,0,sw,sh).data;

    function rowGrad(data,row,w){
        let s=0;
        for(let x=0;x<w-1;x++){
            const a_=(data[(row*w+x)*4]+data[(row*w+x)*4+1]+data[(row*w+x)*4+2])/3;
            const b_=(data[(row*w+x+1)*4]+data[(row*w+x+1)*4+1]+data[(row*w+x+1)*4+2])/3;
            s+=Math.abs(b_-a_);
        }
        return s/(w-1);
    }

    const sigA=new Float64Array(sh),sigB=new Float64Array(sh);
    for(let y=0;y<sh;y++){sigA[y]=rowGrad(dA,y,sw);sigB[y]=rowGrad(dB,y,sw)}

    // 取梯度中位数作为文字行阈值
    const tmp=[...sigA].sort((a,b)=>a-b);
    const thr=tmp[Math.floor(sh*0.4)]+1;

    let best=0,bestScore=-1;
    const maxI=sh;
    for(let i=0;i<maxI;i++){
        const rows=Math.min(sh-i,sh);
        let match=0,total=0;
        for(let y=0;y<rows;y++){
            if(sigA[i+y]>thr||sigB[y]>thr){
                total++;
                const diff=Math.abs(sigA[i+y]-sigB[y]);
                const scale_=Math.max(sigA[i+y],sigB[y],1);
                if(diff/scale_<0.35)match++;
            }
        }
        if(total<sh*0.1)continue;
        const score=match/total;
        if(score>bestScore){bestScore=score;best=i}
    }
    // best=0 表示A底部和B顶部完全重合 → overlap=scanPx; best=sh表示完全不重叠 → overlap=0
    let overlap=Math.round(scanPx - best/scale);
    overlap=Math.max(0,Math.min(overlap,scanPx));

    console.log(`重叠:偏移=${best},重叠=${overlap}px,得分=${(bestScore*100).toFixed(1)}%`);
    return bestScore<0.3?0:overlap;
}

stitchBtn.onclick=async()=>{
    if(imgs.length<2)return;
    stitchBtn.disabled=true;resultPanel.style.display='block';
    statusEl.textContent='正在计算重叠区域...';resultInner.innerHTML='';hint.className='hint';
    seamState={};cropMode=false;cropOverlay.classList.remove('active');

    const overlaps=[];
    for(let i=0;i<imgs.length-1;i++){
        statusEl.textContent=`分析第 ${i+1}/${imgs.length-1} 组...`;
        await new Promise(r=>setTimeout(r,5));
        const o=findOverlap(imgs[i].img,imgs[i+1].img);
        overlaps.push(o);
        console.log(`图${i+1}-图${i+2}:重叠=${o}px`);
    }

    imgs.forEach(it=>it.crop={t:0,b:0,l:0,r:0});
    for(let i=0;i<overlaps.length;i++){
        if(mode==='v'){imgs[i].crop.b=Math.round(overlaps[i]/2);imgs[i+1].crop.t=Math.round(overlaps[i]/2)}
        else{imgs[i].crop.r=Math.round(overlaps[i]/2);imgs[i+1].crop.l=Math.round(overlaps[i]/2)}
    }

    fullRender();
    const hasOverlap=overlaps.some(o=>o>0);
    const sum=overlaps.reduce((a,b)=>a+b,0);
    statusEl.textContent=hasOverlap
        ?`检测到重叠 ${overlaps.join(',')}px（共${sum}px）— 点击虚线缝解锁后拖动微调`
        :`未检测到重叠 — 请点击虚线缝解锁后手动拖动调整`;
    stitchBtn.disabled=false;
};

function renderResult(){
    const wrapW=resultWrap.clientWidth||resultWrap.offsetWidth||800;
    if(needsFullRender){
        resultInner.innerHTML='';
        if(mode==='v')renderV(wrapW,true);else renderH(wrapW,true);
    }else{
        if(mode==='v')renderV(wrapW,false);else renderH(wrapW,false);
    }
    hint.className=imgs.length>1?'hint show':'hint';
    needsFullRender=false;
}
let rafPending=false,needsFullRender=true;
function scheduleRender(){if(!rafPending){rafPending=true;requestAnimationFrame(()=>{rafPending=false;renderResult()})}}
function fullRender(){needsFullRender=true;renderResult()}

function renderV(wrapW,full){
    const outW=Math.max(...imgs.map(it=>it.img.width));
    let totalH=0;
    imgs.forEach(it=>{const ch=it.img.height-it.crop.t-it.crop.b;if(ch>0)totalH+=ch});

    curScale=Math.min(1,wrapW/outW);
    const dispW=Math.round(outW*curScale);
    const dispH=Math.round(totalH*curScale);

    resultInner.style.width=dispW+'px';
    resultInner.style.height=dispH+'px';

    let y=0;
    for(let i=0;i<imgs.length;i++){
        const it=imgs[i];
        const ch=it.img.height-it.crop.t-it.crop.b;
        if(ch<=0)continue;

        let c;
        if(full||!(c=resultInner.querySelector(`canvas[data-i="${i}"]`))){
            c=document.createElement('canvas');
            c.dataset.i=i;
            c.width=it.img.width;c.height=ch;
            c.addEventListener('mousedown',e=>onImgDownV(e,i));
            c.addEventListener('touchstart',e=>onImgDownV(e.touches[0],i));
            resultInner.appendChild(c);
        }else{
            c.width=it.img.width;c.height=ch;
        }
        c.style.cssText=`position:absolute;left:0;width:${dispW}px;height:${Math.round(ch*curScale)}px;top:${Math.round(y*curScale)}px;`;
        c.getContext('2d').drawImage(it.img,0,it.crop.t,it.img.width,ch,0,0,it.img.width,ch);

        let isDraggable=false;
        for(const k in seamState){
            if(!seamState[k])continue;
            const si=+k.replace(/[vh]/g,'');
            const upG=mode==='v'?collectGroup(si,'up'):[];
            const dnG=mode==='v'?collectGroup(si,'down'):[];
            if(upG.includes(i)||dnG.includes(i)){isDraggable=true;break;}
        }
        c.style.cursor=isDraggable?'grab':'';

        if(full){
            if(i<imgs.length-1){
                const seamY=y+ch;
                resultInner.appendChild(makeSeamV(i,seamY,dispW));
            }
        }
        y+=ch;
    }
}

function collectGroup(idx, dir) {
    const group = [idx];
    if (dir === 'up') {
        for (let i = idx - 1; i >= 0; i--) {
            if (seamState['v' + i]) break;
            group.unshift(i);
        }
    } else {
        for (let i = idx + 1; i < imgs.length; i++) {
            if (seamState['v' + (i - 1)]) break;
            group.push(i);
        }
    }
    return group;
}

function onImgDownV(e, imgIdx) {
    if(cropMode)return;
    let seamIdx = -1, dragSide = '';
    if (imgIdx < imgs.length - 1 && seamState['v' + imgIdx]) { seamIdx = imgIdx; dragSide = 'upper'; }
    else if (imgIdx > 0 && seamState['v' + (imgIdx - 1)]) { seamIdx = imgIdx - 1; dragSide = 'lower'; }
    else return;

    const sy = e.clientY || e.pageY;
    const group = dragSide === 'upper'
        ? collectGroup(imgIdx, 'up')
        : collectGroup(imgIdx, 'down');
    const orig = group.map(i => ({ t: imgs[i].crop.t, b: imgs[i].crop.b }));

    let dragging = false;

    function move(cy) {
        if (!dragging) {
            if (Math.abs(cy - sy) < 10) return;
            dragging = true;
        }
        const d = (cy - sy) / curScale;
        const first = group[0], last = group[group.length - 1];
        imgs[first].crop.t = orig[0].t - d;
        imgs[last].crop.b = orig[group.length - 1].b + d;
        scheduleRender();
    }

    function up() {
        document.removeEventListener('mousemove', onM);
        document.removeEventListener('mouseup', up);
        document.removeEventListener('touchmove', onT);
        document.removeEventListener('touchend', up);
    }
    function onM(ev) { move(ev.clientY); }
    function onT(ev) { ev.preventDefault(); move(ev.touches[0].clientY); }
    document.addEventListener('mousemove', onM);
    document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', onT, { passive: false });
    document.addEventListener('touchend', up);
}

function renderH(wrapW,full){
    const outH=Math.max(...imgs.map(it=>it.img.height));
    let totalW=0;
    imgs.forEach(it=>{const cw=it.img.width-it.crop.l-it.crop.r;if(cw>0)totalW+=cw});

    curScale=Math.min(1,wrapW/totalW);
    const dispW=Math.round(totalW*curScale);
    const dispH=Math.round(outH*curScale);

    resultInner.style.width=dispW+'px';
    resultInner.style.height=dispH+'px';

    let x=0;
    for(let i=0;i<imgs.length;i++){
        const it=imgs[i];
        const cw=it.img.width-it.crop.l-it.crop.r;
        if(cw<=0)continue;

        let c;
        if(full||!(c=resultInner.querySelector(`canvas[data-i="${i}"]`))){
            c=document.createElement('canvas');
            c.dataset.i=i;
            c.width=cw;c.height=it.img.height;
            c.addEventListener('mousedown',e=>onImgDownH(e,i));
            c.addEventListener('touchstart',e=>onImgDownH(e.touches[0],i));
            resultInner.appendChild(c);
        }else{
            c.width=cw;c.height=it.img.height;
        }
        c.style.cssText=`position:absolute;top:0;width:${Math.round(cw*curScale)}px;height:${dispH}px;left:${Math.round(x*curScale)}px;`;
        c.getContext('2d').drawImage(it.img,it.crop.l,0,cw,it.img.height,0,0,cw,it.img.height);

        let isDraggable=false;
        for(const k in seamState){
            if(!seamState[k])continue;
            const si=+k.replace(/[vh]/g,'');
            const lfG=mode!=='v'?collectGroupH(si,'left'):[];
            const rtG=mode!=='v'?collectGroupH(si,'right'):[];
            if(lfG.includes(i)||rtG.includes(i)){isDraggable=true;break;}
        }
        c.style.cursor=isDraggable?'grab':'';

        if(full){
            if(i<imgs.length-1){
                const seamX=x+cw;
                resultInner.appendChild(makeSeamH(i,seamX,dispH));
            }
        }
        x+=cw;
    }
}

function collectGroupH(idx, dir) {
    const group = [idx];
    if (dir === 'left') {
        for (let i = idx - 1; i >= 0; i--) {
            if (seamState['h' + i]) break;
            group.unshift(i);
        }
    } else {
        for (let i = idx + 1; i < imgs.length; i++) {
            if (seamState['h' + (i - 1)]) break;
            group.push(i);
        }
    }
    return group;
}

function onImgDownH(e, imgIdx) {
    if(cropMode)return;
    let seamIdx = -1, dragSide = '';
    if (imgIdx < imgs.length - 1 && seamState['h' + imgIdx]) { seamIdx = imgIdx; dragSide = 'upper'; }
    else if (imgIdx > 0 && seamState['h' + (imgIdx - 1)]) { seamIdx = imgIdx - 1; dragSide = 'lower'; }

    const group = dragSide === 'upper'

    let dragging = false;

    function move(cx) {
        if (!dragging) {
            if (Math.abs(cx - sx) < 10) return;
            dragging = true;
        }

        const first = group[0], last = group[group.length - 1];
        imgs[first].crop.l = orig[0].l - d;
        imgs[last].crop.r = orig[group.length - 1].r + d;
        scheduleRender();
    }

    function up() {
        document.removeEventListener('mousemove', onM);
        document.removeEventListener('mouseup', up);
        document.removeEventListener('touchmove', onT);

    }
    function onM(ev) { move(ev.clientX); }
    function onT(ev) { ev.preventDefault(); move(ev.touches[0].clientX); }
    document.addEventListener('mousemove', onM);
    document.addEventListener('mouseup', up);
    document.addEventListener('touchmove', onT, { passive: false });
    document.addEventListener('touchend', up);
}

function makeSeamV(idx,actualY,dispW){
    const el=document.createElement('div');
    el.className='seam-v'+(seamState['v'+idx]?' open':'');
    el.style.top=Math.round(actualY*curScale-12)+'px';
    const open=seamState['v'+idx];
    el.innerHTML=`<svg viewBox="0 0 ${dispW} 24" preserveAspectRatio="none"><line x1="0" y1="12" x2="${dispW}" y2="12" stroke="${open?'var(--accent)':'var(--border)'}" stroke-width="1.5" stroke-dasharray="${open?'8 3':'5 3'}"/></svg><span class="tip">${open?'↕ 拖动图片调整':'点击解锁'}</span>`;
    el.addEventListener('click',()=>{
        const open=!seamState['v'+idx];
        for(const k in seamState)seamState[k]=false;
        seamState['v'+idx]=open;
        fullRender();
    });
    return el;
}

function makeSeamH(idx,actualX,dispH){
    const el=document.createElement('div');
    el.className='seam-h-seam'+(seamState['h'+idx]?' open':'');
    el.style.left=Math.round(actualX*curScale-12)+'px';
    const open=seamState['h'+idx];
    el.innerHTML=`<svg viewBox="0 0 24 ${dispH}" preserveAspectRatio="none"><line x1="12" y1="0" x2="12" y2="${dispH}" stroke="${open?'var(--accent)':'var(--border)'}" stroke-width="1.5" stroke-dasharray="${open?'8 3':'5 3'}"/></svg><span class="tip">${open?'↔ 拖动图片调整':'点击解锁'}</span>`;
    el.addEventListener('click',()=>{
        const open=!seamState['h'+idx];
        for(const k in seamState)seamState[k]=false;
        seamState['h'+idx]=open;
        fullRender();
    });
    return el;
}

function buildFinal(){
    let cv;
    if(mode==='v'){
        const outW=Math.max(...imgs.map(it=>it.img.width));
        let totalH=0;imgs.forEach(it=>{const ch=it.img.height-it.crop.t-it.crop.b;if(ch>0)totalH+=ch});
        cv=document.createElement('canvas');cv.width=outW;cv.height=totalH;
        const ctx=cv.getContext('2d');let y=0;
        for(const it of imgs){
            const ch=it.img.height-it.crop.t-it.crop.b;if(ch<=0)continue;
            ctx.drawImage(it.img,0,it.crop.t,it.img.width,ch,Math.round((outW-it.img.width)/2),y,it.img.width,ch);
            y+=ch;
        }
    }else{
        const outH=Math.max(...imgs.map(it=>it.img.height));
        let totalW=0;imgs.forEach(it=>{const cw=it.img.width-it.crop.l-it.crop.r;if(cw>0)totalW+=cw});
        cv=document.createElement('canvas');cv.width=totalW;cv.height=outH;
        const ctx=cv.getContext('2d');let x=0;
        for(const it of imgs){
            const cw=it.img.width-it.crop.l-it.crop.r;if(cw<=0)continue;
            ctx.drawImage(it.img,it.crop.l,0,cw,it.img.height,x,Math.round((outH-it.img.height)/2),cw,it.img.height);
            x+=cw;
        }
    }
    if(cropMode&&cropRect.w>0&&cropRect.h>0){
        const wrapW=resultWrap.offsetWidth,wrapH=resultWrap.offsetHeight;
        const sx=cropRect.x/curScale,sy=cropRect.y/curScale;
        const sw=cropRect.w/curScale,sh=cropRect.h/curScale;
        const nc=document.createElement('canvas');
        nc.width=Math.round(sw);nc.height=Math.round(sh);
        nc.getContext('2d').drawImage(cv,sx,sy,sw,sh,0,0,nc.width,nc.height);
        return nc;
    }
    return cv;
}
dlPng.onclick=()=>{const cv=buildFinal();const a=document.createElement('a');a.download='拼接长图.png';a.href=cv.toDataURL('image/png');a.click()};
dlJpg.onclick=()=>{const cv=buildFinal();const a=document.createElement('a');a.download='拼接长图.jpg';a.href=cv.toDataURL('image/jpeg',.92);a.click()};

cropBtn.onclick=()=>{
    cropMode=!cropMode;
    if(cropMode){
        const ir=resultInner.getBoundingClientRect();
        const wr=resultWrap.getBoundingClientRect();
        const X=ir.left-wr.left, Y=ir.top-wr.top;
        cropOverlay.style.width=ir.width+'px';
        cropOverlay.style.height=ir.height+'px';
        cropOverlay.style.left=X+'px';
        cropOverlay.style.top=Y+'px';
        cropOverlay.classList.add('active');
        cropBtn.textContent='取消裁剪';
        cropRect={x:ir.width*0.1,y:ir.height*0.1,w:ir.width*0.8,h:ir.height*0.8};
        updateCropBox();
    }else{
        cropOverlay.classList.remove('active');cropOverlay.style.width='';cropOverlay.style.height='';cropOverlay.style.left='';cropOverlay.style.top='';
        cropBtn.textContent='裁剪';
    }
};

function updateCropBox(){
    cropBox.style.left=cropRect.x+'px';
    cropBox.style.top=cropRect.y+'px';
    cropBox.style.width=cropRect.w+'px';
    cropBox.style.height=cropRect.h+'px';
}

let cropDrag=null;
cropBox.addEventListener('mousedown',e=>{
    if(e.target.classList.contains('crop-handle')){
        cropDrag={type:e.target.dataset.h,startX:e.clientX,startY:e.clientY,rect:{...cropRect}};
    }else{
        cropDrag={type:'move',startX:e.clientX,startY:e.clientY,rect:{...cropRect}};
    }
    e.preventDefault();
});
cropBox.addEventListener('touchstart',e=>{
    const t=e.touches[0];
    if(e.target.classList.contains('crop-handle')){
        cropDrag={type:e.target.dataset.h,startX:t.clientX,startY:t.clientY,rect:{...cropRect}};
    }else{
        cropDrag={type:'move',startX:t.clientX,startY:t.clientY,rect:{...cropRect}};
    }
    e.preventDefault();
},{passive:false});

document.addEventListener('mousemove',e=>{
    if(!cropDrag)return;
    const dx=e.clientX-cropDrag.startX,dy=e.clientY-cropDrag.startY;
    const r=cropDrag.rect,rw=resultInner.offsetWidth,rh=resultInner.offsetHeight;
    switch(cropDrag.type){
        case 'move':
            cropRect.x=Math.max(0,Math.min(rw-r.w,r.x+dx));
            cropRect.y=Math.max(0,Math.min(rh-r.h,r.y+dy));
            break;
        case 'tl':
            cropRect.x=Math.max(0,Math.min(r.x+r.w-50,r.x+dx));
            cropRect.y=Math.max(0,Math.min(r.y+r.h-50,r.y+dy));
            cropRect.w=r.w-(cropRect.x-r.x);
            cropRect.h=r.h-(cropRect.y-r.y);
            break;
        case 'tr':
            cropRect.y=Math.max(0,Math.min(r.y+r.h-50,r.y+dy));
            cropRect.w=Math.max(50,Math.min(rw-r.x,r.w+dx));
            cropRect.h=r.h-(cropRect.y-r.y);
            break;
        case 'bl':
            cropRect.x=Math.max(0,Math.min(r.x+r.w-50,r.x+dx));
            cropRect.w=r.w-(cropRect.x-r.x);
            cropRect.h=Math.max(50,Math.min(rh-r.y,r.h+dy));
            break;
        case 'br':
            cropRect.w=Math.max(50,Math.min(rw-r.x,r.w+dx));
            cropRect.h=Math.max(50,Math.min(rh-r.y,r.h+dy));
            break;
    }
    updateCropBox();
});
document.addEventListener('touchmove',e=>{
    if(!cropDrag)return;
    const t=e.touches[0];
    const dx=t.clientX-cropDrag.startX,dy=t.clientY-cropDrag.startY;
    const r=cropDrag.rect,rw=resultInner.offsetWidth,rh=resultInner.offsetHeight;
    switch(cropDrag.type){
        case 'move':
            cropRect.x=Math.max(0,Math.min(rw-r.w,r.x+dx));
            cropRect.y=Math.max(0,Math.min(rh-r.h,r.y+dy));
            break;
        case 'tl':
            cropRect.x=Math.max(0,Math.min(r.x+r.w-50,r.x+dx));
            cropRect.y=Math.max(0,Math.min(r.y+r.h-50,r.y+dy));
            cropRect.w=r.w-(cropRect.x-r.x);
            cropRect.h=r.h-(cropRect.y-r.y);
            break;
        case 'tr':
            cropRect.y=Math.max(0,Math.min(r.y+r.h-50,r.y+dy));
            cropRect.w=Math.max(50,Math.min(rw-r.x,r.w+dx));
            cropRect.h=r.h-(cropRect.y-r.y);
            break;
        case 'bl':
            cropRect.x=Math.max(0,Math.min(r.x+r.w-50,r.x+dx));
            cropRect.w=r.w-(cropRect.x-r.x);
            cropRect.h=Math.max(50,Math.min(rh-r.y,r.h+dy));
            break;
        case 'br':
            cropRect.w=Math.max(50,Math.min(rw-r.x,r.w+dx));
            cropRect.h=Math.max(50,Math.min(rh-r.y,r.h+dy));
            break;
    }
    updateCropBox();
    e.preventDefault();
},{passive:false});
document.addEventListener('mouseup',()=>{cropDrag=null});
document.addEventListener('touchend',()=>{cropDrag=null});

window.addEventListener('resize',()=>{if(resultPanel.style.display!=='none')fullRender()});
})();
</script>
