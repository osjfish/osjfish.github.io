                e.stopPropagation();
                sidebarToggle.classList.toggle('active');
                sidebar.classList.toggle('collapsed');
            };

            // 侧边栏失去焦点自动隐藏
            document.addEventListener('click', (e) => {
                if (!sidebar.classList.contains('collapsed')) {
                    if (!sidebar.contains(e.target) && !sidebarToggle.contains(e.target)) {
                        sidebar.classList.add('collapsed');
                        sidebarToggle.classList.remove('active');
                    }
                }
            });

            newBtn.onclick = async () => {
                const name = await showModal({
                    title: "新建桌布",
                    desc: "为新桌布起一个名字吧：",
                    showInput: true,
                    inputValue: `桌布 ${state.boards.length + 1}`
                });
                if (name) createNewBoard(name);
            };

            clearAllBtn.onclick = async () => {
                const ok = await showModal({
                    title: "清空所有数据",
                    desc: "这将永久删除所有已保存的桌布。操作不可恢复，确定要清空吗？",
                    confirmText: "确定清空",
                    type: "danger"
                });

                if (ok) {
                    localStorage.removeItem('zenboard_pro_data');
                    // 重置到默认快照
                    state.boards = [];
                    state.elements = [];
                    state.currentBoardId = null;
                    state.penColor = '#ffffff';
                    state.bgColor = '#1a1c22';
                    state.penSize = 5;
                    state.eraserSize = 30;
                    state.textBgOpacity = 0.04;
                    state.textBgColor = '#6366f1';
                    state.textColor = '#ffffff';
                    state.eraserMode = 'area';
                    
                    createNewBoard('默认桌布');
                    
                    // 同步 UI 状态（确保函数在 setupUIHandlers 作用域外也可访问或通过触发同步）
                    const syncBtn = document.querySelector('.ui-container');
                    if (syncBtn) {
                        // 重新执行初始化同步逻辑
                        document.getElementById('size-slider').value = state.penSize;
                        document.getElementById('size-val').innerText = state.penSize;
                        document.getElementById('e-size-slider').value = state.eraserSize;
                        document.getElementById('e-size-val').innerText = state.eraserSize;
                        document.getElementById('t-opacity-slider').value = 4;
                        document.getElementById('t-opacity-val').innerText = '0.04';
                    }
                    document.body.style.backgroundColor = state.bgColor;
                }
            };
        }

        function resize() {
            const r = window.devicePixelRatio || 1;
            canvas.width = window.innerWidth * r;
            canvas.height = window.innerHeight * r;
            canvas.style.width = window.innerWidth + 'px';
            canvas.style.height = window.innerHeight + 'px';
            requestRender();
        }

        function render() {
            if (!needsRender) { requestAnimationFrame(render); return; }
            needsRender = false;
            maybeMountIframes();
            const r = window.devicePixelRatio || 1;

            // 画笔绘制中：快速路径（拷贝离屏 + 只画当前一笔）
            const penActive = state.isDown && state.tool === 'pen' && state.currentPath && state.currentPath.points.length >= 2;
            if (penActive) {
                if (offscreenDirty) { rebuildOffscreen(); offscreenDirty = false; }
                ctx.setTransform(r, 0, 0, r, 0, 0);
                ctx.drawImage(offscreen, 0, 0, window.innerWidth, window.innerHeight);
                ctx.save();
                ctx.translate(state.camera.x, state.camera.y);
                ctx.scale(state.camera.zoom, state.camera.zoom);
                strokePath(ctx, state.currentPath);
                ctx.restore();
                if (state.selected.length) drawSelectionBoxes();
                requestAnimationFrame(render);
                return;
            }

            ctx.setTransform(r, 0, 0, r, 0, 0);
            ctx.fillStyle = state.bgColor;
            ctx.fillRect(0, 0, window.innerWidth, window.innerHeight);

            ctx.translate(state.camera.x, state.camera.y);
            ctx.scale(state.camera.zoom, state.camera.zoom);

            state.elements.forEach(el => {
                if(el.type === 'path') drawPath(el);
                if(el.type === 'image') drawImage(el);
            });

            if(state.currentPath) drawPath(state.currentPath);

            rebuildOffscreen();
            offscreenDirty = false;

            if (state.tool === 'eraser' && state.isDown && state.lastPos) {
                ctx.save();
                ctx.beginPath();
                // 修正：橡皮中心对齐，半径严格对应缩放比例
                const displayRadius = state.eraserSize / state.camera.zoom;
                ctx.arc(state.lastPos.x, state.lastPos.y, displayRadius, 0, Math.PI * 2);
                ctx.strokeStyle = 'rgba(255, 255, 255, 0.5)';
                const dashStep = 4 / state.camera.zoom;
                ctx.setLineDash([dashStep, dashStep]); 
                ctx.lineWidth = 1 / state.camera.zoom;
                ctx.stroke();
                ctx.restore();
            }

            requestAnimationFrame(render);
        }

        function strokePath(c, p) {
            if (!p || p.points.length < 2) return;
            c.save();
            c.globalCompositeOperation = p.isEraser ? 'destination-out' : 'source-over';
            c.beginPath();
            c.strokeStyle = p.color;
            c.lineWidth = p.width;
            c.lineCap = 'round'; c.lineJoin = 'round';
            c.moveTo(p.points[0].x, p.points[0].y);
            for (let i = 1; i < p.points.length - 1; i++) {
                const xc = (p.points[i].x + p.points[i + 1].x) / 2;
                const yc = (p.points[i].y + p.points[i + 1].y) / 2;
                c.quadraticCurveTo(p.points[i].x, p.points[i].y, xc, yc);
            }
            const l = p.points[p.points.length - 1];
            c.lineTo(l.x, l.y);
            c.stroke();
            c.restore();
        }

        function drawPath(p) {
            if (p.points.length < 2) return;
            if (p.angle) { ctx.save(); applyRotation(ctx, p); strokePath(ctx, p); ctx.restore(); }
            else strokePath(ctx, p);

            if(state.selected.includes(p) && !p.isEraser) drawSelBox(ctx, p);
        }

        function drawImageOn(c, p) {
            if(!p._img || !(p._img instanceof HTMLImageElement)) {
                p._img = new Image();
                p._img.onload = () => requestRender();
                p._img.src = p.src;
            }
            if(!p._img.complete) return;
            if (p.angle) { c.save(); applyRotation(c, p); c.drawImage(p._img, p.x, p.y, p.w, p.h); c.restore(); }
            else c.drawImage(p._img, p.x, p.y, p.w, p.h);
        }

        function drawImage(p) {
            drawImageOn(ctx, p);
        }

        function drawSelBox(c, p) {
            const zoom = state.camera.zoom || 1;
            c.save();
            c.setLineDash([5 / zoom, 5 / zoom]);
            c.lineWidth = 1.5 / zoom;
            c.globalCompositeOperation = 'source-over';
            c.strokeStyle = 'rgba(99,102,241,0.8)';
            const b = getBounds(p);
            const offset = 5 / zoom;
            c.strokeRect(b.mx - offset, b.my - offset, b.mw + offset * 2, b.mh + offset * 2);
            c.restore();
        }

        function drawSelectionBoxes() {
            if (!state.selected.length) return;
            ctx.save();
            ctx.translate(state.camera.x, state.camera.y);
            ctx.scale(state.camera.zoom, state.camera.zoom);
            state.selected.forEach(el => {
                if (el.type === 'path') drawSelBox(ctx, el);
            });
            ctx.restore();
        }

        function rebuildOffscreen() {
            const r = window.devicePixelRatio || 1;
            offscreen.width = canvas.width;
            offscreen.height = canvas.height;
            const c = offscreen.getContext('2d');
            c.setTransform(r, 0, 0, r, 0, 0);
            c.fillStyle = state.bgColor;
            c.fillRect(0, 0, window.innerWidth, window.innerHeight);
            c.translate(state.camera.x, state.camera.y);
            c.scale(state.camera.zoom, state.camera.zoom);
            state.elements.forEach(el => {
                if (el.type === 'path') strokePath(c, el);
                else if (el.type === 'image') drawImageOn(c, el);
            });
        }

        function wrapText(c, text, maxW) {
            const lines = [];
            String(text || '').split('\n').forEach(word => {
                if (!word) { lines.push(''); return; }
                let cur = '';
                for (const ch of word) {
                    if (cur && c.measureText(cur + ch).width > maxW) { lines.push(cur); cur = ch; }
                    else cur += ch;
                }
                lines.push(cur);
            });
            return lines;
        }

        function drawTextOn(c, el) {
            const fs = el.fontSize || 24;
            const color = el.textColor || state.textColor;
            const bg = el.bgColor || state.textBgColor;
            const op = el.bgOpacity !== undefined ? el.bgOpacity : state.textBgOpacity;
            c.save();
            if (el.angle) {
                const b = getLocalBounds(el);
                const cx = b.mx + b.mw / 2, cy = b.my + b.mh / 2;
                c.translate(cx, cy); c.rotate(el.angle); c.translate(-cx, -cy);
            }
            c.font = fs + 'px system-ui, sans-serif';
            c.textBaseline = 'top';
            if (op > 0) {
                const r = parseInt(bg.slice(1, 3), 16), g = parseInt(bg.slice(3, 5), 16), b = parseInt(bg.slice(5, 7), 16);
                c.fillStyle = `rgba(${r},${g},${b},${Math.min(1, Math.max(0, op))})`;
                c.fillRect(el.x, el.y, el.width || 200, fs * 1.4);
            }
            c.fillStyle = color;
            const maxW = (el.width || 200) - 16;
            const lines = wrapText(c, el.content || '', maxW);
            lines.forEach((ln, i) => c.fillText(ln, el.x + 8, el.y + 8 + i * fs * 1.4));
            c.restore();
        }

        function drawIframePlaceholder(c, el) {
            c.save();
            if (el.angle) applyRotation(c, el);
            c.fillStyle = 'rgba(0,0,0,0.4)';
            c.fillRect(el.x, el.y, el.w, el.h);
            c.strokeStyle = 'rgba(255,255,255,0.55)';
            c.lineWidth = 1.5;
            c.setLineDash([6, 5]);
            c.strokeRect(el.x, el.y, el.w, el.h);
            c.setLineDash([]);
            c.fillStyle = 'rgba(255,255,255,0.85)';
            const fs = Math.min(el.h / 7, 15);
            c.font = fs + 'px system-ui, sans-serif';
            c.textAlign = 'center';
            c.textBaseline = 'middle';
            c.fillText('网页: ' + (el.src || ''), el.x + el.w / 2, el.y + el.h / 2, Math.max(40, el.w - 16));
            c.restore();
        }

        function normalizeCamera(cam) {
            cam = Object.assign({}, cam || {});
            cam.x = isFinite(cam.x) ? cam.x : 0;
            cam.y = isFinite(cam.y) ? cam.y : 0;
            cam.zoom = isFinite(cam.zoom) ? Math.min(Math.max(cam.zoom, 0.1), 10) : 10;
            return cam;
        }

        function toCanvasCoord(cx, cy) {
            return {
                x: (cx - state.camera.x) / state.camera.zoom,
                y: (cy - state.camera.y) / state.camera.zoom
            };
        }

        function setupZoomEvents() {
            // 鼠标滚轮缩放
            window.addEventListener('wheel', (e) => {
                e.preventDefault();
                
                const factor = e.deltaY > 0 ? 0.92 : 1.08;
                const pos = toCanvasCoord(e.clientX, e.clientY);

                // 如果选中了元素，则缩放选中的元素
                if (state.selected.length > 0 && state.tool === 'select') {
                    saveHistory(true);
                    // 计算选中区域的中心点作为缩放原点
                    const sb = getSelectionBounds();
                    const cx = sb.x + sb.w/2;
                    const cy = sb.y + sb.h/2;
                    
                    state.selected.forEach(el => {
                        if (el.locked) return;
                        if (el.type === 'path') {
                            el.points = el.points.map(p => ({
                                x: cx + (p.x - cx) * factor,
                                y: cy + (p.y - cy) * factor
                            }));
                            el.width *= factor;
                        } else if (el.type === 'text') {
                            el.fontSize = Math.min(Math.max((el.fontSize || 24) * factor, 2), 500);
                            el.x = cx + (el.x - cx) * factor;
                            el.y = cy + (el.y - cy) * factor;
                            if (el.width) el.width *= factor;
                        } else if (el.type === 'image' || el.type === 'iframe') {
                            el.w *= factor;
                            el.h *= factor;
                            el.x = cx + (el.x - cx) * factor;
                            el.y = cy + (el.y - cy) * factor;
                        }
                    });
                    syncDOMElements();
                    offscreenDirty = true;
                    requestRender();
                    return;
                }

                const scaleFactor = Math.pow(0.999, e.deltaY);
                const newZoom = Math.min(Math.max(state.camera.zoom * scaleFactor, 0.1), 10);
                const actualFactor = newZoom / state.camera.zoom;
                
                // 以鼠标点为中心缩放
                state.camera.x = e.clientX - (e.clientX - state.camera.x) * actualFactor;
                state.camera.y = e.clientY - (e.clientY - state.camera.y) * actualFactor;
                state.camera.zoom = newZoom;
                offscreenDirty = true;

                if (state.showZoom) {
                    const zd = document.getElementById('zoom-display');
                    if (zd) zd.innerText = Math.round(newZoom * 10) + '%';
                }

                syncDOMElements();
                requestRender();
            }, { passive: false });
        }

        function simplifyPath(points, tolerance = 1) {
            if (points.length <= 2) return points;
            const result = [points[0]];
            let last = points[0];
            for (let i = 1; i < points.length - 1; i++) {
                const current = points[i];
                const dist = Math.hypot(current.x - last.x, current.y - last.y);
                if (dist > tolerance) {
                    result.push(current);
                    last = current;
                }
            }
            result.push(points[points.length - 1]);
            return result;
        }

        function setupPointerEvents() {
            let lastDist = 0;
            let lastCenter = { x: 0, y: 0 };
            let lastEraserPos = null; // 三指橡皮擦上一位置（canvas 坐标）
            let lastPanCenter = null; // 四指平移上一中心（屏幕坐标）

            // 根据当前触点数重算手势模式：2指缩放 / 3指橡皮 / 4指及以上平移
            function recalcMode() {
                const n = state.pointers.size;
                state.multiMode = n >= 4 ? 'pan' : n === 3 ? 'eraser' : n === 2 ? 'zoom' : null;
                const pts = Array.from(state.pointers.values());
                if (n === 2) {
                    lastDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                    lastCenter = { x: (pts[0].x + pts[1].x) / 2, y: (pts[0].y + pts[1].y) / 2 };
                } else if (n === 3) {
                    if (!state.preOpState) state.preOpState = snapshotElements(); // 保证三指擦除可撤销
                    lastEraserPos = toCanvasCoord(
                        (pts[0].x + pts[1].x + pts[2].x) / 3,
                        (pts[0].y + pts[1].y + pts[2].y) / 3
                    );
                } else if (n >= 4) {
                    let sx = 0, sy = 0;
                    for (const p of pts) { sx += p.x; sy += p.y; }
                    lastPanCenter = { x: sx / n, y: sy / n };
                }
            }

            canvas.addEventListener('contextmenu', (e) => e.preventDefault());

            canvas.addEventListener('pointerdown', (e) => {
                if (e.button !== undefined && e.button !== 0) return;
                state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                state.histCoalesced = false;
                
                if (state.pointers.size === 1) {
                    state.isDown = true;
                    const pos = toCanvasCoord(e.clientX, e.clientY);
                    state.lastPos = pos;
                    state.preOpState = snapshotElements();

                    if(state.tool === 'pen') {
                        const adaptiveWidth = state.penSize / state.camera.zoom;
                        state.currentPath = { type:'path', points:[pos], color:state.penColor, width:adaptiveWidth };
                    } else if(state.tool === 'eraser') {
                        // 橡皮：仅标记，不创建路径，依靠实时 eraseAt 处理
                        if (state.selected.length) { state.selected = []; syncDOMElements(); }
                        eraseAt(pos);
                    } else if(state.tool === 'select') {
                        const hit = state.elements.findLast(el => isHit(pos, el));
                        if(hit) {
                            if (e.shiftKey) {
                                const idx = state.selected.indexOf(hit);
                                if (idx >= 0) state.selected.splice(idx, 1);
                                else state.selected.push(hit);
                            } else if(!state.selected.includes(hit)) {
                                state.selected = [hit];
                            }
                            state.dragOffset = { x: e.clientX, y: e.clientY };
                        } else {
                            if (!e.shiftKey) state.selected = [];
                            state.boxStart = { x: e.clientX, y: e.clientY };
                            state.marqueeAdditive = !!e.shiftKey;
                            marquee.style.display = 'block';
                        }
                        syncDOMElements();
                    } else if(state.tool === 'text') {
                        addTextBox(pos);
                        state.isDown = false;
                    } else if(state.tool === 'pan') {
                        state.selected = [];
                        syncDOMElements();
                        state.dragOffset = { x: e.clientX, y: e.clientY };
                    } else {
                        // 在其它工具（如笔）下点击背景也清空选中状态，以便隐藏文本框边框
                        const hit = state.elements.findLast(el => isHit(pos, el));
                        if(!hit) {
                            state.selected = [];
                            syncDOMElements();
                        }
                    }
                } else {
                    // 2 指及以上：切换为多点手势（2指缩放 / 3指橡皮 / 4指+平移）
                    if (state.currentPath && state.currentPath.points.length >= 2) {
                        state.elements.push(state.currentPath); // 保留已画部分
                        state.needsSave = true;
                    }
                    state.isDown = false;
                    state.currentPath = null;
                    recalcMode();
                }
                requestRender();
            });

            window.addEventListener('pointermove', (e) => {
                if (!state.pointers.has(e.pointerId)) return;
                state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

                const pointerCount = state.pointers.size;

                // 4 指及以上：拖动画布
                if (pointerCount >= 4 && state.multiMode === 'pan') {
                    let sx = 0, sy = 0;
                    for (const p of state.pointers.values()) { sx += p.x; sy += p.y; }
                    const cx = sx / pointerCount, cy = sy / pointerCount;
                    if (lastPanCenter) {
                        state.camera.x += cx - lastPanCenter.x;
                        state.camera.y += cy - lastPanCenter.y;
                    }
                    lastPanCenter = { x: cx, y: cy };
                    offscreenDirty = true;
                    syncDOMElements();
                    requestRender();
                    return;
                }

                // 3 指：橡皮擦（以三指中心为擦除点）
                if (pointerCount === 3 && state.multiMode === 'eraser') {
                    const pts = Array.from(state.pointers.values());
                    const cp = toCanvasCoord(
                        (pts[0].x + pts[1].x + pts[2].x) / 3,
                        (pts[0].y + pts[1].y + pts[2].y) / 3
                    );
                    if (lastEraserPos) {
                        const dist = Math.hypot(cp.x - lastEraserPos.x, cp.y - lastEraserPos.y);
                        const displayRadius = state.eraserSize / state.camera.zoom;
                        const steps = Math.max(1, Math.ceil(dist / (displayRadius / 2)));
                        for (let i = 1; i <= steps; i++) {
                            eraseAt({
                                x: lastEraserPos.x + (cp.x - lastEraserPos.x) * (i / steps),
                                y: lastEraserPos.y + (cp.y - lastEraserPos.y) * (i / steps)
                            });
                        }
                    } else {
                        eraseAt(cp);
                    }
                    lastEraserPos = cp;
                    requestRender();
                    return;
                }

                if (state.pointers.size === 2) {
                    const p = Array.from(state.pointers.values());
                    const dist = Math.hypot(p[0].x - p[1].x, p[0].y - p[1].y);
                    const center = { x: (p[0].x + p[1].x) / 2, y: (p[0].y + p[1].y) / 2 };
                    
                    if (lastDist > 0) {
                        const scaleFactor = dist / lastDist;

                        if (state.selected.length > 0) {
                            // 双指缩放选中项（任意工具下，选中元素即缩放元素本体）
                            const sb = getSelectionBounds();
                            const cx = sb.x + sb.w/2;
                            const cy = sb.y + sb.h/2;
                            
                            state.selected.forEach(el => {
                                if (el.locked) return;
                                if (el.type === 'path') {
                                    el.points = el.points.map(p => ({
                                        x: cx + (p.x - cx) * scaleFactor,
                                        y: cy + (p.y - cy) * scaleFactor
                                    }));
                                    el.width *= scaleFactor;
                                } else if (el.type === 'text') {
                                    el.fontSize = Math.min(Math.max((el.fontSize || 24) * scaleFactor, 2), 500);
                                    el.x = cx + (el.x - cx) * scaleFactor;
                                    el.y = cy + (el.y - cy) * scaleFactor;
                                    if (el.width) el.width *= scaleFactor;
                                } else if (el.type === 'image' || el.type === 'iframe') {
                                    el.w *= scaleFactor;
                                    el.h *= scaleFactor;
                                    el.x = cx + (el.x - cx) * scaleFactor;
                                    el.y = cy + (el.y - cy) * scaleFactor;
                                }
                            });
                            state.needsSave = true; // 缩放结束会通过 pointerup 保存
                        } else {
                            // 缩放摄像机
                            const newZoom = Math.min(Math.max(state.camera.zoom * scaleFactor, 0.1), 10);
                            const actualFactor = newZoom / state.camera.zoom;
                            state.camera.x = center.x - (center.x - state.camera.x) * actualFactor;
                            state.camera.y = center.y - (center.y - state.camera.y) * actualFactor;
                            state.camera.zoom = newZoom;
                            state.camera.x += (center.x - lastCenter.x);
                            state.camera.y += (center.y - lastCenter.y);
                            offscreenDirty = true;

                            if (state.showZoom) {
                                const zd = document.getElementById('zoom-display');
                                if (zd) zd.innerText = Math.round(newZoom * 10) + '%';
                            }
                        }
                    }

                    lastDist = dist;
                    lastCenter = center;
                    syncDOMElements();
                    requestRender();
                    return;
                }

                if(!state.isDown) return;
                const pos = toCanvasCoord(e.clientX, e.clientY);

                // 处理框选
                if (state.boxStart && state.tool === 'select') {
                    const x = Math.min(e.clientX, state.boxStart.x);
                    const y = Math.min(e.clientY, state.boxStart.y);
                    const w = Math.abs(e.clientX - state.boxStart.x);
                    const h = Math.abs(e.clientY - state.boxStart.y);
                    marquee.style.left = x + 'px';
                    marquee.style.top = y + 'px';
                    marquee.style.width = w + 'px';
                    marquee.style.height = h + 'px';
                    return;
                }

                // 优先处理选中元素的拖拽（包括文本框在任意工具下的拖拽）
                if (state.tool === 'pan') {
                    const dx = e.clientX - state.dragOffset.x;
                    const dy = e.clientY - state.dragOffset.y;
                    state.camera.x += dx;
                    state.camera.y += dy;
                    state.dragOffset = { x: e.clientX, y: e.clientY };
                    canvas.style.cursor = 'grabbing';
                    offscreenDirty = true;
                    syncDOMElements(); // 更新 DOM（如文本框位置）
                } else if (state.selected.length > 0 && !state.currentPath) {
                    const dx = (e.clientX - state.dragOffset.x) / (state.camera.zoom || 1);
                    const dy = (e.clientY - state.dragOffset.y) / (state.camera.zoom || 1);
                    state.selected.forEach(el => {
                        if (el.locked) return;
                        if (el.type === 'path') {
                            el.points = el.points.map(p => ({ x:p.x+dx, y:p.y+dy }));
                        } else if (el.type === 'text' || el.type === 'image' || el.type === 'iframe') {
                            el.x += dx;
                            el.y += dy;
                        }
                    });
                    state.dragOffset = { x: e.clientX, y: e.clientY };
                    state.needsSave = true; // 移动选中物品也需要保存状态
                    syncDOMElements();
                } else if(state.tool === 'pen' && state.currentPath) {
                    const last = state.currentPath.points[state.currentPath.points.length - 1];
                    const dist = Math.hypot(pos.x - last.x, pos.y - last.y);
                    // 最小采样距离：基于缩放比例。防止记录过于微小的抖动点。
                    const threshold = 1.0 / state.camera.zoom;
                    if (dist > threshold) {
                        state.currentPath.points.push(pos);
                    }
                } else if(state.tool === 'eraser') {
                    // 插值调用 eraseAt，解决移动过快导致的一段段消失
                    if (state.lastPos) {
                        const dist = Math.hypot(pos.x - state.lastPos.x, pos.y - state.lastPos.y);
                        const displayRadius = state.eraserSize / state.camera.zoom;
                        const steps = Math.max(1, Math.ceil(dist / (displayRadius / 2)));
                        for (let i = 1; i <= steps; i++) {
                            const p = {
                                x: state.lastPos.x + (pos.x - state.lastPos.x) * (i / steps),
                                y: state.lastPos.y + (pos.y - state.lastPos.y) * (i / steps)
                            };
                            eraseAt(p);
                        }
                    } else {
                        eraseAt(pos);
                    }
                }
                state.lastPos = pos;
                requestRender();
            });

            window.addEventListener('pointerup', (e) => {
                if (state.pointers.has(e.pointerId)) {
                    state.pointers.delete(e.pointerId);
                }
                recalcMode();
                if (state.pointers.size < 2) {
                    lastDist = 0;
                    lastEraserPos = null;
                    lastPanCenter = null;
                    state.lastPos = null;
                    state.isDown = false;
                }
                
                if (state.needsSave || state.currentPath) {
                    if (state.currentPath) {
                        // 抬起画笔时简化路径点：基于缩放比例的容差值
                        if (state.currentPath.points.length > 2) {
                            state.currentPath.points = simplifyPath(state.currentPath.points, 0.5 / state.camera.zoom);
                        }
                        // 至少两个点才保留，避免单击产生无效元素
                        if (state.currentPath.points.length >= 2) {
                            state.elements.push(state.currentPath);
                        }
                    }
                    
                    // 检查是否有实质性内容变化，避免生成无效回退点
                    if (state.preOpState) {
                        if (snapshotElements() !== state.preOpState) {
                            state.undoStack.push(state.preOpState);
                            state.redoStack = [];
                            while (state.undoStack.length > MAX_HISTORY) state.undoStack.shift();
                        }
                        state.preOpState = null;
                    }

                    // 同步看板数据
                    const board = state.boards.find(b => b.id === state.currentBoardId);
                    if (board) board.elements = state.elements;
                    
                    saveToLocalStorage();
                    state.needsSave = false;
                }
                if(state.boxStart) {
                    const r = marquee.getBoundingClientRect();
                    if (!state.marqueeAdditive) state.selected = [];
                    state.elements.forEach(el => {
                        const b = getBounds(el);
                        const ex = b.mx * state.camera.zoom + state.camera.x;
                        const ey = b.my * state.camera.zoom + state.camera.y;
                        const ew = b.mw * state.camera.zoom;
                        const eh = b.mh * state.camera.zoom;
                        
                        // 元素完全在矩形内
                        const hit = ex > r.left && ex + ew < r.right && ey > r.top && ey + eh < r.bottom;
                        if(hit) state.selected.push(el);
                    });
                    marquee.style.display = 'none';
                    state.boxStart = null;
                    state.marqueeAdditive = false;
                }
                if (state.tool === 'pan') {
                    canvas.style.cursor = 'grab';
                }
                state.currentPath = null;
                state.histCoalesced = false;
                syncDOMElements();
                requestRender();
            });

            window.addEventListener('pointercancel', (e) => {
                state.pointers.delete(e.pointerId);
                recalcMode();
                if (state.pointers.size < 2) {
                    lastDist = 0;
                    lastEraserPos = null;
                    lastPanCenter = null;
                    state.lastPos = null;
                    state.isDown = false;
                }
                if (state.currentPath && state.currentPath.points.length >= 2) {
                    state.currentPath.points = simplifyPath(state.currentPath.points, 0.5 / state.camera.zoom);
                    state.elements.push(state.currentPath);
                }
                state.currentPath = null;
                state.preOpState = null;
                state.histCoalesced = false;
                state.needsSave = false;
                state.boxStart = null;
                marquee.style.display = 'none';
                if (state.tool === 'pan') canvas.style.cursor = 'grab';
                requestRender();
            });
        }

        function getDistToSegment(p, a, b) {
            const l2 = Math.pow(a.x - b.x, 2) + Math.pow(a.y - b.y, 2);
            if (l2 === 0) return Math.hypot(p.x - a.x, p.y - a.y);
            let t = ((p.x - a.x) * (b.x - a.x) + (p.y - a.y) * (b.y - a.y)) / l2;
            t = Math.max(0, Math.min(1, t));
            return Math.hypot(p.x - (a.x + t * (b.x - a.x)), p.y - (a.y + t * (b.y - a.y)));
        }

        function eraseAt(pos) {
            const radius = state.eraserSize / state.camera.zoom;
            let changed = false;
            let nextElements = [];

            // 辅助函数：计算线段与圆的交点（用于平滑擦除边际）
            function getIntersections(p1, p2, center, r) {
                const dx = p2.x - p1.x;
                const dy = p2.y - p1.y;
                const fx = p1.x - center.x;
                const fy = p1.y - center.y;
                const a = dx * dx + dy * dy;
                const b = 2 * (fx * dx + fy * dy);
                const c = fx * fx + fy * fy - r * r;
                let discriminant = b * b - 4 * a * c;
                if (discriminant < 0) return [];
                discriminant = Math.sqrt(discriminant);
                const t1 = (-b - discriminant) / (2 * a);
                const t2 = (-b + discriminant) / (2 * a);
                const results = [];
                if (t1 >= 0 && t1 <= 1) results.push({ x: p1.x + t1 * dx, y: p1.y + t1 * dy });
                if (t2 >= 0 && t2 <= 1) results.push({ x: p1.x + t2 * dx, y: p1.y + t2 * dy });
                return results;
            }

            for (let el of state.elements) {
                if (el.isEraser) { nextElements.push(el); continue; }
                if (el.locked) { nextElements.push(el); continue; }

                if (el.type === 'path') {
                    const hitRadius = radius + (el.width || 1) / 2;
                    
                    // 性能优化：包围盒预检
                    const b = getBounds(el);
                    const margin = hitRadius;
                    if (pos.x < b.mx - margin || pos.x > b.mx + b.mw + margin ||
                        pos.y < b.my - margin || pos.y > b.my + b.mh + margin) {
                        nextElements.push(el);
                        continue;
                    }

                    // 旋转笔画：把擦除点变换到元素局部坐标系再裁剪
                    let epos = pos;
                    if (el.angle) {
                        const lb = getLocalBounds(el);
                        const cx = lb.mx + lb.mw / 2, cy = lb.my + lb.mh / 2;
                        const a = -el.angle, cos = Math.cos(a), sin = Math.sin(a);
                        const dx = pos.x - cx, dy = pos.y - cy;
                        epos = { x: cx + dx * cos - dy * sin, y: cy + dx * sin + dy * cos };
                    }

                    if (state.eraserMode === 'object') {
                        let isHit = false;
                        for (let i = 0; i < el.points.length; i++) {
                            if (Math.hypot(el.points[i].x - epos.x, el.points[i].y - epos.y) <= hitRadius) { isHit = true; break; }
                            if (i > 0 && getDistToSegment(epos, el.points[i-1], el.points[i]) <= hitRadius) { isHit = true; break; }
                        }
                        if (isHit) changed = true;
                        else nextElements.push(el);
                    } else {
                        // 局部擦除改进逻辑：线段裁剪
                        let currentSubPath = [];
                        let elChangedAny = false;

                        for (let i = 0; i < el.points.length; i++) {
                            const pCurr = el.points[i];
                            const pCurrIn = Math.hypot(pCurr.x - epos.x, pCurr.y - epos.y) <= hitRadius;

                            if (i === 0) {
                                if (!pCurrIn) currentSubPath.push(pCurr);
                                else elChangedAny = true;
                                continue;
                            }

                            const pPrev = el.points[i - 1];
                            const pPrevIn = Math.hypot(pPrev.x - epos.x, pPrev.y - epos.y) <= hitRadius;

                            if (!pPrevIn && !pCurrIn) {
                                // 检查线段中间是否穿过圆
                                if (getDistToSegment(epos, pPrev, pCurr) <= hitRadius) {
                                    elChangedAny = true;
                                    const ints = getIntersections(pPrev, pCurr, epos, hitRadius);
                                    if (ints.length >= 2) {
                                        currentSubPath.push(ints[0]);
                                        nextElements.push({ ...el, points: currentSubPath });
                                        currentSubPath = [ints[1], pCurr];
                                    } else {
                                        currentSubPath.push(pCurr);
                                    }
                                } else {
                                    currentSubPath.push(pCurr);
                                }
                            } else if (!pPrevIn && pCurrIn) {
                                elChangedAny = true;
                                const ints = getIntersections(pPrev, pCurr, epos, hitRadius);
                                if (ints.length > 0) currentSubPath.push(ints[0]);
                                if (currentSubPath.length > 1) nextElements.push({ ...el, points: currentSubPath });
                                currentSubPath = [];
                            } else if (pPrevIn && !pCurrIn) {
                                elChangedAny = true;
                                const ints = getIntersections(pPrev, pCurr, epos, hitRadius);
                                currentSubPath = ints.length > 0 ? [ints[0], pCurr] : [pCurr];
                            } else {
                                // 都在圆内
                                elChangedAny = true;
                            }
                        }
                        if (currentSubPath.length > 1) nextElements.push({ ...el, points: currentSubPath });
                        if (elChangedAny) changed = true;
                    }
                } else {
                    const b = getBounds(el);
                    const hit = pos.x > b.mx - radius && pos.x < b.mx + b.mw + radius &&
                                pos.y > b.my - radius && pos.y < b.my + b.mh + radius;
                    if (hit) changed = true;
                    else nextElements.push(el);
                }
            }

            if (changed) {
                state.elements = nextElements;
                const board = state.boards.find(b => b.id === state.currentBoardId);
                if (board) board.elements = state.elements;
                state.needsSave = true;
            }
        }

        function getSelectionBounds() {
            if (state.selected.length === 0) return { x:0, y:0, w:0, h:0 };
            const bs = state.selected.map(getBounds);
            const minX = Math.min(...bs.map(b => b.mx));
            const minY = Math.min(...bs.map(b => b.my));
            const maxX = Math.max(...bs.map(b => b.mx + b.mw));
            const maxY = Math.max(...bs.map(b => b.my + b.mh));
            return { x: minX, y: minY, w: maxX - minX, h: maxY - minY };
        }

        function getLocalBounds(p) {
            if (p.type === 'path') {
                if (!p.points.length) return { mx:0, my:0, mw:0, mh:0 };
                let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
                for (const pt of p.points) {
                    if (pt.x < minX) minX = pt.x;
                    if (pt.x > maxX) maxX = pt.x;
                    if (pt.y < minY) minY = pt.y;
                    if (pt.y > maxY) maxY = pt.y;
                }
                return { mx: minX, my: minY, mw: maxX-minX, mh: maxY-minY };
            } else if (p.type === 'image' || p.type === 'iframe') {
                return { mx: p.x, my: p.y, mw: p.w, mh: p.h };
            } else if (p.type === 'text') {
                return { mx: p.x, my: p.y, mw: p.width || 100, mh: (p.fontSize || 24) * 1.5 };
            }
            return { mx: 0, my: 0, mw: 0, mh: 0 };
        }

        function getBounds(p) {
            const b = getLocalBounds(p);
            if (p.angle) {
                const cx = b.mx + b.mw / 2, cy = b.my + b.mh / 2;
                const cos = Math.cos(p.angle), sin = Math.sin(p.angle);
                const corners = [[b.mx,b.my],[b.mx+b.mw,b.my],[b.mx+b.mw,b.my+b.mh],[b.mx,b.my+b.mh]];
                const pts = corners.map(([x,y]) => ({
                    x: cx + (x - cx) * cos - (y - cy) * sin,
                    y: cy + (x - cx) * sin + (y - cy) * cos
                }));
                const xs = pts.map(q => q.x), ys = pts.map(q => q.y);
                return { mx: Math.min(...xs), my: Math.min(...ys), mw: Math.max(...xs) - Math.min(...xs), mh: Math.max(...ys) - Math.min(...ys) };
            }
            return b;
        }

        function applyRotation(c, p) {
            const b = getLocalBounds(p);
            const cx = b.mx + b.mw / 2, cy = b.my + b.mh / 2;
            c.translate(cx, cy);
            c.rotate(p.angle || 0);
            c.translate(-cx, -cy);
        }

        function isHit(pos, el) {
            const b = getBounds(el);
            const padding = 0; // 修复：修改为 0 以保证点击精确触发
            return pos.x > b.mx - padding && pos.x < b.mx + b.mw + padding &&
                   pos.y > b.my - padding && pos.y < b.my + b.mh + padding;
        }

        function addTextBox(cp) {
            saveHistory();
            const id = 'text-' + Date.now();
            const adaptiveFontSize = 20 / state.camera.zoom;
            const textEl = { 
                id, 
                type: 'text', 
                x: cp.x, 
                y: cp.y, 
                width: 200 / state.camera.zoom, 
                fontSize: adaptiveFontSize,
                content: '',
                bgColor: state.textBgColor,
                textColor: state.textColor,
                bgOpacity: state.textBgOpacity
            };
            
            state.elements.push(textEl);
            state.selected = [textEl]; // 选中新创建的文本框，支持立即缩放
            syncDOMElements();
            
            setTimeout(() => {
                const dom = document.getElementById(id);
                if (dom) {
                    const area = dom.querySelector('textarea');
                    area.readOnly = false; // 新创建时允许直接输入
                    area.focus();
                }
            }, 50);
        }

        const updateTextareaSize = (area, el) => {
            if (!area) return;
            area.style.height = 'auto';
            area.style.height = (area.scrollHeight) + 'px';
        };

        function createDOMText(textEl) {
            const wrap = document.createElement('div');
            wrap.className = 'text-box';
            wrap.id = textEl.id;

            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '×';
            // 关键：阻止事件冒泡到父容器 wrap，防止 wrap 触发 setPointerCapture 导致按钮点击失效
            delBtn.onpointerdown = (e) => e.stopPropagation();
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if (textEl.locked) return;
                saveHistory();
                state.elements = state.elements.filter(el => el.id !== textEl.id);
                state.selected = state.selected.filter(el => el.id !== textEl.id);
                syncDOMElements();
            };

            const lockBadge = document.createElement('div');
            lockBadge.className = 'lock-badge';
            lockBadge.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

            const area = document.createElement('textarea');
            area.placeholder = '...'; area.rows = 1;
            area.value = textEl.content;
            area.readOnly = true; 
            
            const handle = document.createElement('div');
            handle.className = 'resize-handle';
            
            handle.onpointerdown = (e) => {
                e.stopPropagation();
                if (textEl.locked) return;
                handle.setPointerCapture(e.pointerId);
                state.isResizing = true;
                state.dragOffset = { x: e.clientX, y: e.clientY };
            };
            handle.onpointermove = (e) => {
                if (!state.isResizing) return;
                const dx = (e.clientX - state.dragOffset.x) / (state.camera.zoom || 1);
                // 允许调整到最小 30px (屏幕像素) 的宽度
                const minWorldWidth = 30 / state.camera.zoom;
                textEl.width = Math.max(minWorldWidth, (textEl.width || 200) + dx);
                state.dragOffset = { x: e.clientX, y: e.clientY };
                syncDOMElements(); 
            };
            handle.onpointerup = () => {
                if (state.isResizing) {
                    saveHistory();
                    state.isResizing = false;
                }
            };

            // 接管事件流：允许缩放和拖动
            wrap.onpointerdown = (e) => {
                e.stopPropagation();

                if (e.shiftKey) {
                    const i = state.selected.findIndex(s => s && s.id === textEl.id);
                    if (i >= 0) state.selected.splice(i, 1);
                    else state.selected.push(textEl);
                    syncDOMElements();
                    return;
                }

                if (textEl.locked) {
                    if (!state.selected.some(sel => sel.id === textEl.id)) state.selected = [textEl];
                    syncDOMElements();
                    return;
                }

                wrap.setPointerCapture(e.pointerId);
                
                // 将当前指针加入全局追踪，确保双指缩放能捕获到该点
                state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                state.preOpState = snapshotElements();
                state.histCoalesced = false;

                // 核心：设置状态位允许全局 mousemove 接管拖拽逻辑
                state.isDown = true;
                state.dragOffset = { x: e.clientX, y: e.clientY };
                state.boxStart = null; 

                if (!state.selected.some(sel => sel.id === textEl.id)) {
                    state.selected = [textEl];
                }
                syncDOMElements();
            };

            wrap.onwheel = (e) => {
                if (state.selected.includes(textEl) && !textEl.locked) {
                    e.preventDefault();
                    e.stopPropagation();
                    const factor = e.deltaY > 0 ? 0.9 : 1.1;
                    const oldSize = textEl.fontSize || 24;
                    const newSize = Math.min(Math.max(oldSize * factor, 2 / state.camera.zoom), 300);
                    if (newSize !== oldSize) {
                        saveHistory(true); // 滚轮前存一次（合并为一步撤销）
                        textEl.fontSize = newSize;
                        syncDOMElements();
                    }
                }
            };

            wrap.ondblclick = (e) => {
                e.stopPropagation();
                area.style.pointerEvents = 'auto'; // 双击后允许交互输入
                area.readOnly = false;
                area.focus();
            };

            wrap.appendChild(delBtn);
            wrap.appendChild(lockBadge);
            wrap.appendChild(area);
            wrap.appendChild(handle);
            document.body.appendChild(wrap);

            area.oninput = () => {
                textEl.content = area.value;
                updateTextareaSize(area, textEl);
            };

            area.onblur = () => { 
                area.readOnly = true;
                area.style.pointerEvents = 'none'; // 失去焦点后重新恢复拖拽穿透
                if(!area.value.trim()) {
                    saveHistory();
                    state.elements = state.elements.filter(el => el.id !== textEl.id);
                    state.selected = state.selected.filter(el => el.id !== textEl.id);
                    syncDOMElements();
                } else {
                    saveHistory(); // 内容编辑完成保存
                }
            };
            
            // 必须在挂载后计算一次大小
            setTimeout(() => updateTextareaSize(area, textEl), 0);
            return area;
        }

        function syncDOMElements() {
            const currentIds = new Set();
            state.elements.forEach((el, idx) => {
                if (el.type === 'text' || el.type === 'image' || el.type === 'iframe') {
                    if (!el.id) el.id = (el.type === 'image' || el.type === 'iframe' ? 'obj-' : 'text-') + Math.random().toString(36).substr(2, 9);
                    currentIds.add(el.id);
                    let dom = document.getElementById(el.id);

                    if (!dom) {
                        if (el.type === 'text') {
                            createDOMText(el);
                        } else if (el.type === 'image') {
                            createDOMImageOverlay(el);
                        } else {
                            createDOMIframeOverlay(el);
                        }
                        dom = document.getElementById(el.id);
                    }

                    if (!dom) return;

                    const isSelected = state.selected.some(sel => sel === el || (sel.id && sel.id === el.id));
                    dom.classList.toggle('selected', isSelected);
                    dom.classList.toggle('locked', !!el.locked);

                    const screenX = el.x * state.camera.zoom + state.camera.x;
                    const screenY = el.y * state.camera.zoom + state.camera.y;
                    dom.style.left = screenX + 'px';
                    dom.style.top = screenY + 'px';
                    dom.style.zIndex = String(50 + idx);
                    dom.style.borderWidth = '1px';
                    dom.style.borderColor = el.bgColor || state.textBgColor;
                    dom.style.padding = '8px';
                    dom.style.borderRadius = '6px';
                    dom.style.boxShadow = isSelected ? '0 4px 20px rgba(0,0,0,0.3)' : 'none';
                    dom.style.transformOrigin = '50% 50%';
                    dom.style.transform = el.angle ? `rotate(${(el.angle * 180 / Math.PI).toFixed(2)}deg)` : '';

                    if (el.type === 'text') {
                        const screenW = (el.width || 200) * state.camera.zoom;
                        dom.style.width = screenW + 'px';

                        const area = dom.querySelector('textarea');
                        area.style.fontSize = (el.fontSize * state.camera.zoom) + 'px';

                        const bgColor = el.bgColor || state.textBgColor;
                        const bgOpacity = el.bgOpacity !== undefined ? el.bgOpacity : state.textBgOpacity;
                        const r = parseInt(bgColor.slice(1,3), 16);
                        const g = parseInt(bgColor.slice(3,5), 16);
                        const b = parseInt(bgColor.slice(5,7), 16);
                        dom.style.background = `rgba(${r}, ${g}, ${b}, ${isSelected ? bgOpacity + 0.1 : bgOpacity})`;

                        area.style.color = el.textColor || state.textColor;
                        area.value = el.content;
                        area.style.height = 'auto';
                        area.style.height = area.scrollHeight + 'px';
                    } else {
                        dom.style.width = el.w * state.camera.zoom + 'px';
                        dom.style.height = el.h * state.camera.zoom + 'px';
                        if (el.type === 'iframe') {
                            const hint = dom.querySelector('.embed-hint');
                            if (hint) hint.innerText = '网页: ' + (el.src || '');
                            maybeMountIframes();
                        }
                    }
                }
            });

            document.querySelectorAll('.text-box, .image-wrap').forEach(dom => {
                if (!currentIds.has(dom.id)) dom.remove();
            });

            // 旋转手柄定位
            const rotH = document.getElementById('rotate-handle');
            if (rotH) {
                const sel = state.selected.filter(el => !el.locked);
                if (sel.length) {
                    const sb = getSelectionBounds();
                    const sx = (sb.x + sb.w / 2) * state.camera.zoom + state.camera.x;
                    const sy = sb.y * state.camera.zoom + state.camera.y;
                    rotH.style.display = 'block';
                    rotH.style.left = (sx - 8) + 'px';
                    rotH.style.top = (sy - 48) + 'px';
                } else {
                    rotH.style.display = 'none';
                }
            }
        }

        function createDOMImageOverlay(imgEl) {
            const wrap = document.createElement('div');
            wrap.className = 'image-wrap';
            wrap.id = imgEl.id;
            
            const delBtn = document.createElement('button');
            delBtn.className = 'delete-btn';
            delBtn.innerHTML = '×';
            delBtn.onpointerdown = (e) => e.stopPropagation();
            delBtn.onclick = (e) => {
                e.stopPropagation();
                if (imgEl.locked) return;
                saveHistory();
                state.elements = state.elements.filter(el => el.id !== imgEl.id);
                state.selected = state.selected.filter(el => el.id !== imgEl.id);
                syncDOMElements();
            };

            const lockBadge = document.createElement('div');
            lockBadge.className = 'lock-badge';
            lockBadge.innerHTML = '<svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>';

            wrap.onpointerdown = (e) => {
                e.stopPropagation();

                if (e.shiftKey) {
                    const i = state.selected.findIndex(s => s && s.id === imgEl.id);
                    if (i >= 0) state.selected.splice(i, 1);
                    else state.selected.push(imgEl);
                    syncDOMElements();
                    return;
                }

                if (imgEl.locked) {
                    if (!state.selected.some(sel => sel.id === imgEl.id)) state.selected = [imgEl];
                    syncDOMElements();
                    return;
                }

                wrap.setPointerCapture(e.pointerId);
                
                // 将当前指针加入全局追踪，确保拖拽逻辑能识别此指针
                state.pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
                state.preOpState = snapshotElements();
                state.histCoalesced = false;

                state.dragOffset = { x: e.clientX, y: e.clientY };
                state.isDown = true;
                state.boxStart = null; 

                if (!state.selected.some(sel => sel.id === imgEl.id)) {
                    state.selected = [imgEl];
                }
                syncDOMElements();
            };

            // 滚轮直接缩放图片本体（选中时，任意工具），可超过原始尺寸
            wrap.onwheel = (e) => {
                if (state.selected.includes(imgEl) && !imgEl.locked) {
                    e.preventDefault();
                    e.stopPropagation();
                    const factor = e.deltaY > 0 ? 0.9 : 1.1;
                    const cx = imgEl.x + imgEl.w / 2;
                    const cy = imgEl.y + imgEl.h / 2;
                    imgEl.w *= factor;
                    imgEl.h *= factor;
                    imgEl.x = cx - imgEl.w / 2;
                    imgEl.y = cy - imgEl.h / 2;
                    saveHistory(true);
                    syncDOMElements();
                    offscreenDirty = true;
                    requestRender();
                }
            };

            wrap.appendChild(delBtn);
            wrap.appendChild(lockBadge);
            document.body.appendChild(wrap);
            return wrap;
        }

        function maybeMountIframes() {
            state.elements.forEach(el => {
                if (el.type !== 'iframe' || el._mounted || el.locked) return;
                const b = getBounds(el);
                const sx = b.mx * state.camera.zoom + state.camera.x;
                const sy = b.my * state.camera.zoom + state.camera.y;
                const sw = b.mw * state.camera.zoom, sh = b.mh * state.camera.zoom;
                if (sx + sw < -50 || sy + sh < -50 || sx > window.innerWidth + 50 || sy > window.innerHeight + 50) return;
                const dom = document.getElementById(el.id);
                if (!dom) return;
                const iframe = dom.querySelector('iframe');
                if (iframe && !el._mounted) {
                    iframe.src = el.src;
                    el._mounted = true;
                    dom.classList.add('loaded');
                }
            });
        }

        function addImageElement(src, pos) {
            const img = new Image();
            img.onload = () => {
                saveHistory(true);
                const p = pos || toCanvasCoord(window.innerWidth / 2, window.innerHeight / 2);
                const maxWidth = 500 / state.camera.zoom;
                const w = Math.min(img.width, maxWidth);
                const h = img.height * (w / img.width);
                state.elements.push({ type: 'image', src, x: p.x - w / 2, y: p.y - h / 2, w, h, angle: 0, locked: false });
                state.selected = [state.elements[state.elements.length - 1]];
                syncDOMElements();
                offscreenDirty = true;
                requestRender();
            };
            img.src = src;
        }

        function snapshotElements() {
            return JSON.stringify(state.elements.map(el => cleanEl(el)));
        }

        function cleanEl(el) {
            if (!el) return el;
            const { _img, _mounted, _ifr, _hint, ...rest } = el;
            return rest;
        }

        function saveHistory(coalesce) {
            // 确保同步到看板对象
            const board = state.boards.find(b => b.id === state.currentBoardId);
            if (board) board.elements = state.elements;

            if (coalesce && state.histCoalesced) return;
            state.undoStack.push(snapshotElements());
            state.redoStack = []; 
            while (state.undoStack.length > MAX_HISTORY) state.undoStack.shift();
            if (coalesce) state.histCoalesced = true;
            saveToLocalStorage();
        }

            };

            // 时钟更新逻辑
            function updateClock() {
                const now = new Date();
                const h = String(now.getHours()).padStart(2, '0');
                const m = String(now.getMinutes()).padStart(2, '0');
                const s = String(now.getSeconds()).padStart(2, '0');
                clockDisplay.innerText = `${h}:${m}:${s}`;
            }
            setInterval(updateClock, 1000);
            updateClock();
            syncUIRange();

            clockBtn.onclick = (e) => {
                e.stopPropagation();
                clockDisplay.classList.toggle('visible');
                clockBtn.classList.toggle('active');
            };

            const zoomToggleBtn = document.getElementById('zoom-toggle-btn');
            const zoomDisplay = document.getElementById('zoom-display');

            zoomToggleBtn.onclick = (e) => {
                e.stopPropagation();
                state.showZoom = !state.showZoom;
                zoomToggleBtn.classList.toggle('active', state.showZoom);
                zoomDisplay.classList.toggle('visible', state.showZoom);
            };

            const exportBtn = document.getElementById('export-btn');
            exportBtn.onclick = async () => {
                try {
                    const els = state.elements;
                    if (!els.length) { alert("画布是空的，没有可导出的内容。"); return; }

                    // 预加载所有图片（不依赖外部库，离线可用）
                    const pending = els.filter(el => el.type === 'image' && (!el._img || !el._img.complete));
                    if (pending.length) {
                        await Promise.all(pending.map(el => new Promise((res) => {
                            const im = new Image();
                            im.onload = () => { el._img = im; res(); };
                            im.onerror = res;
                            im.src = el.src;
                        })));
                    }

                    // 计算所有内容的世界包围盒
                    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
                    els.forEach(el => {
                        const b = getBounds(el);
                        if (b.mw <= 0 && b.mh <= 0) return;
                        if (b.mx < minX) minX = b.mx;
                        if (b.my < minY) minY = b.my;
                        if (b.mx + b.mw > maxX) maxX = b.mx + b.mw;
                        if (b.my + b.mh > maxY) maxY = b.my + b.mh;
                    });
                    if (!isFinite(minX)) { alert("画布是空的，没有可导出的内容。"); return; }

                    const pad = 40;
                    const w = maxX - minX + pad * 2;
                    const h = maxY - minY + pad * 2;
                    const dpr = window.devicePixelRatio || 2;
                    const scale = Math.min(dpr, 4096 / Math.max(w, h));

                    const cv = document.createElement('canvas');
                    cv.width = Math.max(1, Math.round(w * scale));
                    cv.height = Math.max(1, Math.round(h * scale));
                    const c = cv.getContext('2d');
                    c.scale(scale, scale);
                    c.fillStyle = state.bgColor;
                    c.fillRect(0, 0, w, h);
                    c.translate(pad - minX, pad - minY);

                    els.forEach(el => {
                        if (el.type === 'path') {
                            if (el.angle) { c.save(); applyRotation(c, el); strokePath(c, el); c.restore(); }
                            else strokePath(c, el);
                        }
                        else if (el.type === 'image' && el._img && el._img.complete) {
                            if (el.angle) { c.save(); applyRotation(c, el); c.drawImage(el._img, el.x, el.y, el.w, el.h); c.restore(); }
                            else c.drawImage(el._img, el.x, el.y, el.w, el.h);
                        }
                        else if (el.type === 'text') drawTextOn(c, el);
                        else if (el.type === 'iframe') drawIframePlaceholder(c, el);
                    });

                    const board = state.boards.find(b => b.id === state.currentBoardId);
                    const link = document.createElement('a');
                    link.download = `${board ? board.name : 'zen-board'}_${new Date().getTime()}.png`;
                    link.href = cv.toDataURL('image/png');
                    link.click();
                } catch (err) {
                    console.error("Export failed:", err);
                    alert("导出失败，请重试");
                }
            };

                            syncDOMElements();
                            renderSidebar();
                            saveToLocalStorage();
                            requestRender();
                        } catch (err) {
                            alert("无法导入：文件格式错误或已损坏。");
                        }
                    };
                    reader.readAsText(file);
                };
                i.click();
            };

            document.getElementById('p-picker').oninput = (e) => {
                const active = document.querySelector('#pen-swatches .swatch.active');
                if (active) active.classList.remove('active');
                state.penColor = e.target.value;
            };
            document.getElementById('b-picker').oninput = (e) => {
                const active = document.querySelector('#bg-swatches .swatch.active');
                if (active) active.classList.remove('active');
                state.bgColor = e.target.value;
                canvas.style.backgroundColor = state.bgColor;
            };

            document.getElementById('import-img').onclick = () => {
                const i = document.createElement('input'); i.type='file'; i.accept='image/*';
                i.onchange = (e) => {
                    const file = e.target.files[0];
                    if(!file) return;
                    const r = new FileReader();
                    r.onload = (ex) => addImageElement(ex.target.result);
                    r.readAsDataURL(file);
                };
                i.click();
            };
        }

        init();
    </script>
</body>
</html>
