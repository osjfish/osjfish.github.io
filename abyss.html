function updateBossBar(){
  var bb=document.getElementById('bossBar');
  if(!bb) return;
  var boss=null;
  for(var i=0;i<enemies.length;i++){
    if(enemies[i].kind==='boss'&&enemies[i].hp>0){ boss=enemies[i]; break; }
  }
  if(!boss){
    if(!bb.classList.contains('hide')) bb.classList.add('hide');
    return;
  }
  bb.classList.remove('hide');
  document.getElementById('bossTxt').textContent=boss.emoji+' '+boss.type+' '+(boss.enraged?'【狂暴！】':'')+' '+boss.hp+'/'+boss.maxHp;
  document.getElementById('bossFill').style.width=(boss.hp/boss.maxHp*100)+'%';
}
function render(){
  if(scene!=='play'){ return; }
  updateBossBar();
  computeFOV();
  ctx.save();
  ctx.clearRect(0,0,cv.width,cv.height);
  ctx.fillStyle='#05070c';
  ctx.fillRect(0,0,cv.width,cv.height);
  var shx=0,shy=0;
  if(shake>0){
    shx=R(-shake,shake);shy=R(-shake,shake);
    shake*=0.8;
    if(shake<0.5) shake=0;
  }
  ctx.translate(shx,shy);
  var camX=clamp(player.x-Math.floor(VIEW/2),0,MAP_W-VIEW);
  var camY=clamp(player.y-Math.floor(VIEW/2),0,MAP_H-VIEW);
  for(var y=0;y<VIEW;y++){
    for(var x=0;x<VIEW;x++){
      var mx=camX+x,my=camY+y;
      var vis=explored[my][mx];
      if(!vis) continue;
      var px=x*TILE,py=y*TILE;
      var visible=manhattan(mx,my,player.x,player.y)<=9&&los(player.x,player.y,mx,my);
      var t=grid[my][mx];
      var base,wall=false;
      if(t===1){ wall=true; }
      if(wall){
        base=visible?'#262b38':'#171b26';
      } else if(t===2){
        base=visible?'#3a2f16':'#241d10';
      } else if(t===3){
        base=visible?'#2f2410':'#1c1608';
      } else if(t===4){
        base=visible?'#221630':'#150f1c';
      } else if(t===5){
        base=visible?'#3d2b12':'#241d10';
        wall=true;
      } else if(t===6){
        base=visible?'#3a1a10':'#24120a';
      } else {
        base=visible?'#1a1f2c':'#12161f';
      }
      ctx.fillStyle=base;
      ctx.fillRect(px,py,TILE,TILE);
      if(!visible&&explored[my][mx]) ctx.fillStyle='rgba(0,0,0,0.35)';
      if(wall){
        ctx.fillStyle='rgba(0,0,0,0.35)';
        ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
      }
      if(!wall&&visible){
        ctx.strokeStyle='rgba(255,255,255,0.03)';
        ctx.strokeRect(px+0.5,py+0.5,TILE-1,TILE-1);
      }
      if(t===4&&visible){
        ctx.fillStyle='rgba(199,107,255,0.22)';
        ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
        ctx.strokeStyle='rgba(199,107,255,0.55)';
        ctx.lineWidth=1.5;
        ctx.strokeRect(px+3,py+3,TILE-6,TILE-6);
        ctx.font='bold 13px sans-serif';
        ctx.fillStyle='#c76bff';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('?',px+TILE/2,py+TILE/2);
        ctx.textAlign='start';ctx.textBaseline='alphabetic';
      }
      if(t===5&&visible){
        ctx.fillStyle='rgba(255,159,10,0.15)';
        ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
        ctx.strokeStyle='rgba(255,159,10,0.45)';
        ctx.lineWidth=1;
        ctx.strokeRect(px+3,py+3,TILE-6,TILE-6);
        ctx.font='bold 14px sans-serif';
        ctx.fillStyle='#ff9f0a';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('🛢',px+TILE/2,py+TILE/2);
        ctx.textAlign='start';ctx.textBaseline='alphabetic';
      }
      if(t===6&&visible){
        ctx.fillStyle='rgba(255,120,50,0.35)';
        ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
        ctx.fillStyle='rgba(255,190,80,0.5)';
        ctx.fillRect(px+3,py+3,TILE-6,TILE-6);
      }
      if(t===6&&!visible){
        ctx.fillStyle='rgba(120,60,25,0.4)';
        ctx.fillRect(px+2,py+2,TILE-4,TILE-4);
      }
    }
  }
  // 陷阱
  for(var ti=0;ti<traps.length;ti++){
    var tr=traps[ti];
    if(!explored[tr.y][tr.x]) continue;
    var tvx=tr.x-camX,tvy=tr.y-camY;
    if(tvx<0||tvy<0||tvx>=VIEW||tvy>=VIEW) continue;
    var tvis=manhattan(tr.x,tr.y,player.x,player.y)<=9&&los(player.x,player.y,tr.x,tr.y);
    if(!tvis) continue;
    var tpx=tvx*TILE, tpy=tvy*TILE;
    var trDraw=function(fill,inner){
      ctx.fillStyle=fill;
      ctx.beginPath();
      ctx.moveTo(tpx+TILE/2,tpy+3);
      ctx.lineTo(tpx+TILE-4,tpy+TILE-3);
      ctx.lineTo(tpx+4,tpy+TILE-3);
      ctx.closePath();
      ctx.fill();
      if(inner) inner();
    };
    var dot=function(){ ctx.fillStyle='rgba(0,0,0,0.45)'; ctx.beginPath(); ctx.arc(tpx+TILE/2,tpy+TILE/2+2,3,0,Math.PI*2); ctx.fill(); };
    var cross=function(){ ctx.strokeStyle='rgba(0,0,0,0.5)'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(tpx+TILE/2-4,tpy+TILE/2-2);ctx.lineTo(tpx+TILE/2+4,tpy+TILE/2+6);ctx.moveTo(tpx+TILE/2+4,tpy+TILE/2-2);ctx.lineTo(tpx+TILE/2-4,tpy+TILE/2+6); ctx.stroke(); };
    if(tr.type==='spike'){
      trDraw('rgba(255,60,40,0.8)');
    } else if(tr.type==='web'){
      trDraw('rgba(170,184,201,0.7)', cross);
    } else if(tr.type==='venom'){
      trDraw('rgba(87,255,138,0.7)', dot);
    } else if(tr.type==='tele'){
      trDraw('rgba(199,107,255,0.7)', dot);
    } else if(tr.type==='boom'){
      trDraw('rgba(255,150,60,0.85)');
    } else {
      trDraw('rgba(180,80,255,0.75)', cross);
    }
  }
  // 寻路目标标记
  if(targetPos){
    var tmx=targetPos.x-camX,tmy=targetPos.y-camY;
    if(tmx>=0&&tmy>=0&&tmx<VIEW&&tmy<VIEW&&explored[targetPos.y][targetPos.x]){
      ctx.strokeStyle='rgba(120,255,120,0.9)';
      ctx.lineWidth=2;
      ctx.setLineDash([4,3]);
      ctx.strokeRect(tmx*TILE+1.5,tmy*TILE+1.5,TILE-3,TILE-3);
      ctx.setLineDash([]);
    }
  }
  // 地面物品
  for(var i=0;i<groundItems.length;i++){
    var it=groundItems[i];
    if(!explored[it.y][it.x]) continue;
    var vx=it.x-camX,vy=it.y-camY;
    if(vx<0||vy<0||vx>=VIEW||vy>=VIEW) continue;
    var vis2=manhattan(it.x,it.y,player.x,player.y)<=9&&los(player.x,player.y,it.x,it.y);
    if(!vis2) continue;
    var gx=vx*TILE+TILE/2,gy=vy*TILE+TILE/2;
    ctx.font='16px "Segoe UI Emoji",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    var em=it.item.kind==='potion'?POTIONS[it.item.potion].emoji:(it.item.kind==='consum'?CONSUM[it.item.consum].emoji:(it.item.kind==='gold'?'\uD83D\uDCB0':'\uD83C\uDF81'));
    ctx.fillText(em,gx,gy);
    var pul=(Math.sin(Date.now()/300+i))*2;
    ctx.fillStyle='rgba(20,26,38,0.75)';
    ctx.beginPath();
    ctx.arc(gx,gy+5,TILE/2-3+pul,0,Math.PI*2);
    ctx.fill();
    ctx.strokeStyle=it.item.kind==='gear'?RARITY_COLOR[it.item.gear.rarity-1]:'#8fa3bd';
    ctx.lineWidth=1.5;
    ctx.beginPath();
    ctx.arc(gx,gy+5,TILE/2-3+pul,0,Math.PI*2);
    ctx.stroke();
  }
  // 宝箱标记
  for(var ci=0;ci<chests.length;ci++){
    var ch=chests[ci];
    if(!explored[ch.y][ch.x]) continue;
    var vx=ch.x-camX,vy=ch.y-camY;
    if(vx<0||vy<0||vx>=VIEW||vy>=VIEW) continue;
    var vis3=manhattan(ch.x,ch.y,player.x,player.y)<=9&&los(player.x,player.y,ch.x,ch.y);
    if(!vis3) continue;
    var gx=vx*TILE+TILE/2,gy=vy*TILE+TILE/2;
    ctx.font='15px "Segoe UI Emoji",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(ch.golden?'\uD83D\uDCC5':'\uD83D\uDEE1\uFE0F',gx,gy);
    if(ch.golden){
      ctx.fillStyle='rgba(255,216,87,'+(Math.sin(Date.now()/300)*0.25+0.45).toFixed(2)+')';
      ctx.beginPath();ctx.arc(gx,gy,TILE/2+2,0,Math.PI*2);ctx.fill();
    }
  }
  // 楼梯
  var stTile=findStairs();
  if(stTile){
    var sx=stTile.x-camX,sy=stTile.y-camY;
    if(sx>=0&&sy>=0&&sx<VIEW&&sy<VIEW){
      var visS=manhattan(stTile.x,stTile.y,player.x,player.y)<=9&&los(player.x,player.y,stTile.x,stTile.y);
      if(visS&&explored[stTile.y][stTile.x]){
        var gx=sx*TILE+TILE/2,gy=sy*TILE+TILE/2;
        ctx.font='17px "Segoe UI Emoji",sans-serif';
        ctx.textAlign='center';ctx.textBaseline='middle';
        ctx.fillText('\u2B07\uFE0F',gx,gy);
        var glow=Math.sin(Date.now()/400)*0.3+0.7;
        ctx.fillStyle='rgba(255,216,87,'+glow.toFixed(2)+')';
        ctx.fillRect(sx*TILE+2,sy*TILE+TILE-5,TILE-4,3);
      }
    }
  }
  // 敌人
  for(var ei=0;ei<enemies.length;ei++){
    var e=enemies[ei];
    if(e.hp<=0) continue;
    if(!explored[e.y][e.x]) continue;
    var ex=e.x-camX,ey=e.y-camY;
    if(ex<0||ey<0||ex>=VIEW||ey>=VIEW) continue;
    var visE=manhattan(e.x,e.y,player.x,player.y)<=9&&los(player.x,player.y,e.x,e.y);
    if(!visE) continue;
    var gx2=ex*TILE+TILE/2,gy2=ey*TILE+TILE/2;
    var r=e.kind==='boss'?TILE/2-2:TILE/2-4;
    var pulse=Math.sin(Date.now()/250+ei)*2;
    if(e.elite||e.enraged){
      ctx.beginPath();
      ctx.arc(gx2,gy2,r+4+pulse,0,Math.PI*2);
      ctx.strokeStyle=e.enraged?'#ff2d55':'#ffb03d';
      ctx.lineWidth=2;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(gx2,gy2,r+pulse,0,Math.PI*2);
    ctx.fillStyle=e.color;
    ctx.globalAlpha=0.25;
    ctx.fill();
    ctx.globalAlpha=1;
    ctx.beginPath();
    ctx.arc(gx2,gy2,r*0.6,0,Math.PI*2);
    ctx.fillStyle=e.color;
    ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,0.5)';
    ctx.lineWidth=1;
    ctx.stroke();
    ctx.font=(e.kind==='boss'?'20px':'16px')+' "Segoe UI Emoji",sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.fillText(e.emoji,gx2,gy2);
    var intentRange=(e.range||1);
    var canHit=manhattan(e.x,e.y,player.x,player.y)<=intentRange&&los(e.x,e.y,player.x,player.y);
    var it=null;
    if(e.freeze>0) it={t:'❄',c:'#7fd8ff'};
    else if(e.kind==='boss'){
      var nxt=(e.specialT||0)+1;
      var bsp=1;
      if(e.bossType==='knight'&&nxt%4===0) bsp=0;
      if(e.bossType==='guard'&&nxt%3===0) bsp=0;
      if(e.bossType==='lord'&&nxt%3===0) bsp=0;
      it=bsp?{t:'⚡',c:'#ff2d55'}:{t:'✦',c:'#c76bff'};
    } else if(e.kind==='ranged'){
      it=canHit?{t:'➡',c:'#ff7b2d'}:{t:'⇨',c:'#ffd23d'};
    } else {
      it=canHit?(e.bomb?{t:'💣',c:'#ff9f0a'}:{t:'⚔️',c:'#ff2d55'}):{t:'⇨',c:'#ffd23d'};
    }
    ctx.font='bold 12px sans-serif';
    ctx.fillStyle=it.c;
    ctx.fillText(it.t,gx2+TILE/2-6,gy2-TILE/2+8);
    if(e.kind==='boss'&&e.weak&&ELEMENTS[e.weak]){
      ctx.font='11px sans-serif';
      ctx.fillStyle='#ffd857';
      ctx.fillText(ELEMENTS[e.weak].icon,gx2-TILE/2+4,gy2-TILE/2+4);
    }
    if(e.elite){
      ctx.font='10px sans-serif';
      ctx.fillStyle='#ffb03d';
      ctx.fillText('★',gx2-TILE/2+4,gy2-TILE/2+2);
    }
    if(e.shieldHp>0){
      ctx.font='11px sans-serif';
      ctx.fillStyle='#57c8ff';
      ctx.fillText('🛡'+e.shieldHp,gx2-TILE/2+4,gy2+TILE/2-3);
    }
    if(e.elem){
      ctx.font='10px "Segoe UI Emoji",sans-serif';
      ctx.fillStyle=ELEMENTS[e.elem].color;
      ctx.fillText(ELEMENTS[e.elem].icon,gx2+TILE/2-6,gy2-TILE/2+2);
    }
    if(e.hp<e.maxHp){
      var bw=TILE-4;
      ctx.fillStyle='rgba(0,0,0,0.6)';
      ctx.fillRect(ex*TILE+2,ey*TILE-3,bw,3);
      ctx.fillStyle=e.elite?'#ffb03d':(e.enraged?'#ff2d55':'#e74c3c');
      ctx.fillRect(ex*TILE+2,ey*TILE-3,bw*Math.max(0,e.hp/e.maxHp),3);
    }
  }
  // 玩家
  var px2=(player.x-camX)*TILE+TILE/2,py2=(player.y-camY)*TILE+TILE/2;
  ctx.beginPath();
  ctx.arc(px2,py2,TILE/2+4,0,Math.PI*2);
  ctx.fillStyle='rgba(255,216,87,0.15)';
  ctx.fill();
  ctx.font='20px "Segoe UI Emoji",sans-serif';
  ctx.textAlign='center';ctx.textBaseline='middle';
  ctx.fillText(player.emoji,px2,py2);
  // 状态图标
  var icons=0;
  if(player.burn>0){ ctx.font='11px sans-serif'; ctx.fillStyle='#ff6b57'; ctx.fillText('灼',px2-TILE/2+8,py2-TILE/2+8); icons++; }
  if(player.poison>0){ ctx.font='11px sans-serif'; ctx.fillStyle='#57ff8a'; ctx.fillText('毒',px2-TILE/2+18,py2-TILE/2+8); icons++; }
  if(player.atkBuffT>0){ ctx.font='11px sans-serif'; ctx.fillStyle='#ffd857'; ctx.fillText('攻',px2-TILE/2+8,py2+TILE/2-8); icons++; }
  if(player.dodgeT>0){ ctx.font='11px sans-serif'; ctx.fillStyle='#b0ff57'; ctx.fillText('闪',px2+TILE/2-16,py2-TILE/2+8); icons++; }
  if(player.berserkT>0){ ctx.font='11px sans-serif'; ctx.fillStyle='#ff9d3d'; ctx.fillText('狂',px2+TILE/2-16,py2+TILE/2-8); icons++; }
  if(player.slow>0){ ctx.font='11px sans-serif'; ctx.fillStyle='#aab8c9'; ctx.fillText('缓',px2-TILE/2+16,py2+TILE/2-8); icons++; }
  // 炸弹瞄准
  if(bombTargeting&&hoverTile){
    ctx.strokeStyle='rgba(255,157,61,0.9)';
    ctx.lineWidth=2;
    ctx.strokeRect((hoverTile.x-camX)*TILE+1,(hoverTile.y-camY)*TILE+1,TILE-2,TILE-2);
    if(manhattan(player.x,player.y,hoverTile.x,hoverTile.y)<=5){
      ctx.fillStyle='rgba(255,157,61,0.12)';
      ctx.fillRect((hoverTile.x-camX)*TILE,(hoverTile.y-camY)*TILE,TILE,TILE);
    }
  }
  // 浮动文字
  for(var fi=floats.length-1;fi>=0;fi--){
    var f=floats[fi];
    f.t+=0.05;
    var alpha=Math.max(0,1-f.t/1.2);
    ctx.font='bold '+f.size+'px sans-serif';
    ctx.textAlign='center';ctx.textBaseline='middle';
    ctx.globalAlpha=alpha;
    ctx.fillStyle=f.color;
    ctx.fillText(f.text,f.x-camX*TILE-shx,f.y-f.t*22-camY*TILE-shy);
    ctx.globalAlpha=1;
    if(f.t>=1.2) floats.splice(fi,1);
  }
  // 粒子
  for(var pi=particles.length-1;pi>=0;pi--){
    var p=particles[pi];
    p.x+=p.vx;p.y+=p.vy;p.life-=0.03;
    ctx.globalAlpha=Math.max(0,p.life);
    ctx.fillStyle=p.color;
    ctx.fillRect(p.x-camX*TILE-shx,p.y-camY*TILE-shy,3,3);
    ctx.globalAlpha=1;
    if(p.life<=0) particles.splice(pi,1);
  }
  ctx.restore();
  renderMinimap();
}
function findStairs(){
  for(var y=0;y<MAP_H;y++){
    for(var x=0;x<MAP_W;x++){
      if(grid[y][x]===2) return {x:x,y:y};
    }
  }
  return null;
}
function renderMinimap(){
  var s=2;
  mctx.clearRect(0,0,miniCv.width,miniCv.height);
  mctx.fillStyle='#0a0d13';
  mctx.fillRect(0,0,miniCv.width,miniCv.height);
  for(var y=0;y<MAP_H;y++){
    for(var x=0;x<MAP_W;x++){
      if(!explored[y][x]) continue;
      var t=grid[y][x];
      if(t===1){ mctx.fillStyle='#232936'; }
      else if(t===2){ mctx.fillStyle='#ffd857'; }
      else if(t===3){ mctx.fillStyle='#8a6a1f'; }
      else if(t===4){ mctx.fillStyle='#c76bff'; }
      else if(t===5){ mctx.fillStyle='#ff9f0a'; }
      else if(t===6){ mctx.fillStyle='#ff5a2d'; }
      else { mctx.fillStyle='#141a26'; }
      mctx.fillRect(x*s,y*s,s,s);
    }
  }
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(!explored[e.y][e.x]) continue;
    mctx.fillStyle=e.elite?'#ffb03d':e.color;
    mctx.fillRect(e.x*s,e.y*s,s,s);
  }
  for(var ti=0;ti<traps.length;ti++){
    var tr=traps[ti];
    if(!explored[tr.y][tr.x]) continue;
    mctx.fillStyle='#ff4d3d';
    mctx.fillRect(tr.x*s,tr.y*s,s,s);
  }
  mctx.fillStyle='#fff';
  mctx.fillRect(player.x*s-1,player.y*s-1,4,4);
}
function renderLog(){
  var el=document.getElementById('log');
  var last=logMsgs.slice(-3).reverse();
  var html='';
  for(var i=0;i<last.length;i++){
    html+='<div'+(last[i].n?' class="l-new"':'')+'>'+escapeHtml(last[i].t)+'</div>';
  }
  el.innerHTML=html;
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// ================= 提示框 =================
var tipEl=document.getElementById('tooltip');
var tipTimer=null;
function showTip(x,y,html){
  tipEl.innerHTML=html;
  tipEl.style.display='block';
  positionTip(x,y);
}
function positionTip(x,y){
  var r=tipEl.getBoundingClientRect();
  var px=clamp(x+14,8,window.innerWidth-r.width-8);
  var py=clamp(y+14,8,window.innerHeight-r.height-8);
  tipEl.style.left=px+'px';
  tipEl.style.top=py+'px';
}
function hideTip(){
  tipEl.style.display='none';
  if(tipTimer){ clearTimeout(tipTimer); tipTimer=null; }
}
function bindTip(el,getHtml){
  el.addEventListener('mouseenter',function(e){ showTip(e.clientX,e.clientY,getHtml()); });
  el.addEventListener('mousemove',function(e){ positionTip(e.clientX,e.clientY); });
  el.addEventListener('mouseleave',hideTip);
  el.addEventListener('click',function(e){
    showTip(e.clientX,e.clientY,getHtml());
    if(tipTimer) clearTimeout(tipTimer);
    tipTimer=setTimeout(hideTip,3200);
  });
}
function skillTipHtml(i){

  var sk=CLASSES[player.cls].skills[sid];
  var h='<div class="tt-name">'+sk.name+' <span class="kbd">'+sk.key+'</span></div>';
  h+='<div class="tt-line">'+sk.type+' · 消耗 '+skillMp(sk)+' 魔力'+(sk.cd?' · 冷却 '+sk.cd+' 回合':'')+(sk.range?' · 射程 '+sk.range+' 格':'')+'</div>';
  h+='<div class="tt-line">'+sk.effect+'</div>';
  if(player.m.spellfocus) h+='<div class="tt-good">法术专注：技能魔力消耗-30%</div>';
  if(player.m.arcaneflow&&(sid==='fire'||sid==='ice')) h+='<div class="tt-good">奥术洪流：技能伤害+25%</div>';
  if(player.m.laststand) h+='<div class="tt-good">破釜沉舟：生命低于30%时攻击+40%</div>';
  return h;
}
function potTipHtml(id){

function conTipHtml(id){

  return '<div class="tt-name">'+c.emoji+' '+c.name+'</div><div class="tt-line">'+c.detail+'</div><div class="tt-dim">持有 x'+(player.consum[id]||0)+'</div>';
}
function gearTipHtml(it){
  var h='<div class="tt-name" style="color:'+RARITY_COLOR[it.rarity-1]+'">'+it.name+(it.upgrade?' <span style="color:#57c8ff">强化+'+it.upgrade+'</span>':'')+'</div>';
  if(it.set&&SETS[it.set]){
    var st=SETS[it.set];
    var owned=0;
    if(player&&player.gear){ for(var sk in player.gear){ var sit2=player.gear[sk]; if(sit2&&sit2.set===it.set) owned++; } }
    h+='<div class="tt-line" style="color:'+st.color+'">'+st.icon+' 套装：'+st.name+'（'+owned+'/4）</div>';
    h+='<div class="tt-line" style="color:#5a6678;font-size:10px">2件：'+st.b2+'</div>';
    h+='<div class="tt-line" style="color:#5a6678;font-size:10px">4件：'+st.b4+'</div>';
  }
  var lines=itemStatLines(it);
  for(var i=0;i<lines.length;i++) h+='<div class="tt-line">'+lines[i]+'</div>';
  if(player&&player.gear&&!isEquippedGear(it)){
    var cur=getEquippedOfSlot(it.slot);
    if(cur){
      h+='<div class="tt-line" style="color:#5a6678;border-top:1px solid #2a3245;margin-top:4px;padding-top:4px">对比当前 '+cur.name+'：</div>';
      var fields=['atk','def','hp','spd','crit','critDmg','mp','lifesteal','thorns','block'];
      var labels={atk:'攻击',def:'防御',hp:'生命',spd:'速度',crit:'暴击',critDmg:'暴伤',mp:'魔力',lifesteal:'吸血',thorns:'荆棘',block:'格挡'};
      var pct={crit:1,critDmg:1,block:1,lifesteal:1};
      var hasDiff=false;
      for(var f=0;f<fields.length;f++){
        var up1=1+0.12*(it.upgrade||0),up2=1+0.12*(cur.upgrade||0);
        var nv=(it[fields[f]]||0)*up1, cv=(cur[fields[f]]||0)*up2;
        var diff=Math.round(nv-cv);
        if(diff!==0){
          hasDiff=true;
          var color=diff>0?'#3ddc7a':'#ff6b57';
          h+='<div class="tt-line" style="color:'+color+'">'+labels[fields[f]]+' '+(diff>0?'+':'')+diff+(pct[fields[f]]?'%':'')+'</div>';
        }
      }
      if(!hasDiff) h+='<div class="tt-line" style="color:#8fa3bd">属性与当前装备相当</div>';
    }
  }
  return h;
}
function isEquippedGear(it){
  for(var k in player.gear){ if(player.gear[k]===it) return true; }
  return false;
}
function getEquippedOfSlot(slot){
  if(slot==='ring'){
    if(player.gear.ring1) return player.gear.ring1;
    if(player.gear.ring2) return player.gear.ring2;
    return null;
  }
  return player.gear[slot]||null;
}

function chestTipHtml(c){
  if(c&&c.golden) return '<div class="tt-name" style="color:#ffb03d">✨ 金色宝箱</div><div class="tt-line">走近开启：金币更多，掉落品质更高</div><div class="tt-dim">小心：部分宝箱会伪装成怪物或陷阱</div>';
  return '<div class="tt-name" style="color:#ffd857">📦 宝箱</div><div class="tt-line">走近开启：获得金币与道具</div><div class="tt-dim">小心：部分宝箱会伪装成怪物或陷阱</div>';
}
function tileTipHtml(tile){
  if(tile===4) return '<div class="tt-name" style="color:#c76bff">✨ 神秘事件</div><div class="tt-line">走近触发随机事件：商人、祭坛、赌博、竞技场……</div>';
  if(tile===5) return '<div class="tt-name" style="color:#ff9f0a">🛢 爆炸桶</div><div class="tt-line">无法通行；被炸弹、爆炸陷阱或火系敌人波及会引爆，范围伤害并可连锁</div>';
  if(tile===6) return '<div class="tt-name" style="color:#ff8c42">🌋 岩浆</div><div class="tt-line">可以走过，但每步受到最大生命4%的灼烧伤害</div>';
  return '';
}
function questTipHtml(){
  var q=quest;
  if(!q) return '';
  var label='';
  if(q.type==='hunt') label='猎杀 '+ENEMY_TYPES[q.target].name+'（'+q.got+'/'+q.need+'）';
  else if(q.type==='chest') label='开启宝箱（'+q.got+'/'+q.need+'）';
  else label='本层不受到任何伤害';
  var st=q.done?'已完成':(q.failed?'已失败':'进行中');
  return '<div class="tt-name">📜 契约任务</div><div class="tt-line">'+label+'</div><div class="tt-line">奖励：'+(100+floor*20)+' 金币，30%概率额外装备</div><div class="tt-dim">状态：'+st+' · 离开本层未完成则失败</div>';
}

// ================= 侧栏 =================
function updateSidebar(){
  if(!player) return;
  checkGoldAch();
  var hpEl=document.getElementById('barHp');
  hpEl.querySelector('.fill').style.width=(player.hp/player.maxHp*100)+'%';
  document.getElementById('hpTxt').textContent=player.hp+'/'+player.maxHp;
  var mpEl=document.getElementById('barMp');
  mpEl.querySelector('.fill').style.width=(player.mp/player.maxMp*100)+'%';
  document.getElementById('mpTxt').textContent=player.mp+'/'+player.maxMp;
  document.getElementById('barXp').querySelector('.fill').style.width=(player.xp/xpNeeded(player.level)*100)+'%';
  document.getElementById('hudTitle').textContent='深渊回廊 · 第'+floor+'层'+(difficulty==='normal'?'':(' · '+DIFF[difficulty].name));
  var mtxt=document.getElementById('hudTitle');
  if(player.modifier){ var m2=MODIFIERS.filter(function(x){ return x.id===player.modifier; })[0]; if(m2) mtxt.textContent+=' · '+m2.name; }
  document.getElementById('lvTxt').textContent=player.level;
  document.getElementById('goldTxt').textContent=player.gold;
  document.getElementById('floorTxt').textContent=floor;
  var stepEl=document.getElementById('stepTxt');
  if(stepEl){
    var fs2=getFloorSteps();
    stepEl.textContent=fs2;
    var sc=stepEl.parentNode;
    if(sc){ sc.style.borderColor=fs2<=0?'#a55eea':(fs2<=5?'#ff2d55':(fs2<=10?'#ffb03d':'')); sc.style.color=fs2<=0?'#a55eea':''; }
  }
  document.getElementById('atkTxt').textContent=player.curAtk;
  document.getElementById('defTxt').textContent=player.curDef;
  document.getElementById('critTxt').textContent=player.curCrit+'%';
  document.getElementById('cdmgTxt').textContent=player.curCritDmg+'%';
  document.getElementById('dodgeTxt').textContent=player.dodgeChance+'%';
  document.getElementById('blockTxt').textContent=player.blockChance+'%';
  var cc=document.getElementById('comboChip');
  var ct=document.getElementById('comboTxt');
  if(player.combo>1){
    cc.style.display='block';
    ct.textContent=player.combo+'× (+'+(player.combo*5)+'%)';
    cc.style.borderColor=player.combo>=15?'#ffb03d':(player.combo>=8?'#ff6b81':'#3a4664');
  } else {
    cc.style.display='none';
  }
  var st=[];
  if(player.burn>0) st.push('<span class="st-burn">灼烧 '+player.burn+'</span>');
  if(player.poison>0) st.push('<span class="st-poison">中毒 '+player.poison+'</span>');
  if(player.atkBuffT>0) st.push('<span class="st-buff">攻击提升 '+player.atkBuffT+'</span>');
  if(player.dodgeT>0) st.push('<span class="st-dodge">疾风闪避 '+player.dodgeT+'</span>');
  if(player.strT>0) st.push('<span class="st-buff">力量药剂</span>');
  if(player.berserkT>0) st.push('<span class="st-berserk">狂暴 '+player.berserkT+'</span>');
  if(player.slow>0) st.push('<span class="st-slow">迟缓 '+player.slow+'</span>');
  if(player.lifesteal) st.push('<span class="st-poison">吸血'+player.lifesteal+'%</span>');
  if(player.thorns) st.push('<span class="st-buff">荆棘'+player.thorns+'</span>');
  if(player.curseT>0) st.push('<span class="st-slow">诅咒 '+player.curseT+'</span>');
  if(player.activeSets){
    for(var as in player.activeSets){
      var at=SETS[as];
      if(at) st.push('<span style="color:'+at.color+'">'+at.icon+at.name+'套装 ×'+player.activeSets[as]+'</span>');
    }
  }
  document.getElementById('statusList').innerHTML=st.length?st.join(' · '):'<span style="color:#5a6678">无状态</span>';
  // 技能
  var cls=CLASSES[player.cls];
  var keys=Object.keys(cls.skills);
  var sh='';
  for(var i=0;i<keys.length;i++){
    var sk=cls.skills[keys[i]];
    var cd=player.cd[keys[i]]||0;
    var dis=(player.mp<skillMp(sk)||cd>0)?'dis':'';
    var cHtml=cd>0?'<span class="c cd">冷却 '+cd+'</span>':'<span class="c">'+skillMp(sk)+' MP · '+(sk.range?'射程'+sk.range+'格 · ':'')+sk.desc+'</span>';
    sh+='<div class="skill-btn '+dis+'" data-sk="'+i+'"><span class="k">'+sk.key+'</span><span class="name">'+sk.name+'</span>'+cHtml+'</div>';
  }
  document.getElementById('skills').innerHTML=sh;
  document.querySelectorAll('.skill-btn').forEach(function(btn){
    var skIdx=parseInt(btn.getAttribute('data-sk'));
    btn.onclick=function(){ useSkill(skIdx); };
    bindTip(btn,function(){ return skillTipHtml(skIdx); });
  });
  // 装备与背包
  var ih='';
  var slots={weapon:'武器',armor:'护甲',ring1:'戒指1',ring2:'戒指2'};
  for(var s in slots){
    var g=player.gear[s];
    ih+='<div class="gear-row"><span>'+slots[s]+'</span><span class="gname r'+(g?g.rarity:1)+'" data-gslot="'+s+'">'+(g?g.name+(g.upgrade?' +'+g.upgrade:''):'无')+'</span></div>';
  }
  for(var k in POTIONS){
    var pn=potionCount(k);
    if(pn>0){
      ih+='<div class="item-btn" data-pot="'+k+'"><span class="k">'+POTIONS[k].key+'</span><span>'+POTIONS[k].emoji+' '+POTIONS[k].name+'</span><span style="margin-left:auto;color:#8fa3bd">x'+pn+'</span></div>';
    }
  }
  for(var ck in CONSUM){
    var cn=player.consum[ck]||0;
    if(cn>0){
      ih+='<div class="item-btn" data-con="'+ck+'"><span class="k">'+CONSUM[ck].key+'</span><span>'+CONSUM[ck].emoji+' '+CONSUM[ck].name+'</span><span style="margin-left:auto;color:#8fa3bd">x'+cn+'</span></div>';
    }
  }
  var bagHtml='';
  for(var b=0;b<player.bag.length;b++){
    var item=player.bag[b];
    var curG=getEquippedOfSlot(item.slot);
    var isUpg=curG?gearScore(item)>gearScore(curG):false;
    bagHtml+='<div class="item-btn'+(isUpg?' upg':'')+'" data-eq="'+b+'"><span class="r'+item.rarity+'" style="font-weight:bold">'+item.name+(isUpg?' <span style="color:#3ddc7a;font-size:10px">▲升级</span>':'')+'</span><span style="margin-left:auto;color:#8fa3bd;font-size:10px">'+itemDesc(item)+'</span><span class="sellbtn" data-sell="'+b+'">卖</span></div>';
  }
  if(bagHtml) ih+='<div style="margin:5px 0 2px;font-size:11px;color:#5a6678">背包（点击装备/替换，卖字出售）</div>'+bagHtml;
  document.getElementById('items').innerHTML=ih||'<div style="color:#5a6678;font-size:12px">空空如也</div>';
  document.querySelectorAll('[data-sell]').forEach(function(btn){
    btn.onclick=function(ev){
      ev.stopPropagation();
      sellBagItem(parseInt(this.getAttribute('data-sell')));
    };
  });
  document.querySelectorAll('[data-gslot]').forEach(function(el2){
    var slot=el2.getAttribute('data-gslot');
    var g=player.gear[slot];
    bindTip(el2,function(){ return g?gearTipHtml(g):''; });
    if(g){
      el2.style.cursor='pointer';
      el2.title='点击卸下';
      el2.onclick=function(){
        if(player.bag.length>=30){ addLog('背包已满，无法卸下',true); SFX.deny(); return; }
        player.bag.push(g);
        player.gear[slot]=null;
        SFX.pickup();
        recomputeStats();
        updateSidebar();
        render();
      };
    }
  });
  document.querySelectorAll('.item-btn[data-pot]').forEach(function(btn){
    var pid=btn.getAttribute('data-pot');
    btn.onclick=function(){ usePotion(pid); };
    bindTip(btn,function(){ return potTipHtml(pid); });
  });
  document.querySelectorAll('.item-btn[data-con]').forEach(function(btn){
    var cid=btn.getAttribute('data-con');
    btn.onclick=function(){ useConsum(cid); };
    bindTip(btn,function(){ return conTipHtml(cid); });
  });
  document.querySelectorAll('.item-btn[data-eq]').forEach(function(btn){
    btn.onclick=function(){
      var idx=parseInt(this.getAttribute('data-eq'));
      var item=player.bag[idx];
      if(!item) return;
      if(equipItem(item)){
        player.bag.splice(idx,1);
        recomputeStats();
        SFX.pickup();
      } else {
        addLog('已有更好的'+ (item.slot==='ring'?'戒指':'装备'),true);
        SFX.deny();
      }
      updateSidebar();
      render();
    };
    var idx=parseInt(btn.getAttribute('data-eq'));
    bindTip(btn,function(){
      var it=player.bag[idx];
      return it?gearTipHtml(it):'';
    });
  });
  // 移动端HUD
  var gslotBtns=document.querySelectorAll('#touch .gslot');
  var gslots=['weapon','armor','ring1','ring2'];
  var gslotNames=['⚔','🛡','💍','💍'];
  for(var gsi=0;gsi<gslotBtns.length&&gsi<gslots.length;gsi++){
    var gg2=player.gear[gslots[gsi]];
    if(gg2){
      gslotBtns[gsi].innerHTML=gg2.name.slice(0,2)+(gg2.upgrade?'+'+gg2.upgrade:'');
      gslotBtns[gsi].style.color=RARITY_COLOR[gg2.rarity-1];
    } else {
      gslotBtns[gsi].innerHTML='<span style="font-size:14px">'+gslotNames[gsi]+'</span>';
      gslotBtns[gsi].style.color='#5a6678';
    }
  }
  var gsBtns=document.querySelectorAll('#touch .gskill');
  for(var gi=0;gi<gsBtns.length&&gi<keys.length;gi++){
    var sk4=cls.skills[keys[gi]];
    var cd4=player.cd[keys[gi]]||0;
    var dis4=(player.mp<skillMp(sk4)||cd4>0);
    if(dis4) gsBtns[gi].classList.add('dis');
    else gsBtns[gi].classList.remove('dis');
    gsBtns[gi].innerHTML=sk4.name+'<span>'+(cd4>0?'冷却'+cd4:skillMp(sk4)+'MP')+'</span>';
  }
  var mc='';
  mc+='<div class="chip">Lv'+player.level+'</div>';
  mc+='<div class="chip" style="color:#ffd857">💰'+player.gold+'</div>';
  var fs3=getFloorSteps();
  mc+='<div class="chip" style="'+(fs3<=0?'color:#a55eea;border-color:#a55eea':(fs3<=5?'color:#ff2d55;border-color:#ff2d55':''))+'">步<b>'+fs3+'</b></div>';
  mc+='<div class="chip">攻'+player.curAtk+'</div>';
  mc+='<div class="chip">防'+player.curDef+'</div>';
  mc+='<div class="chip">暴击<b>'+player.curCrit+'%</b></div>';
  mc+='<div class="chip">闪避<b>'+player.dodgeChance+'%</b></div>';
  mc+='<div class="chip">格挡<b>'+player.blockChance+'%</b></div>';
  if(player.combo>=2) mc+='<div class="chip combo">连击<b>x'+player.combo+'</b></div>';
  document.getElementById('mChips').innerHTML=mc;
  var mBar=document.getElementById('mBar');
  if(mBar){
    var hpPct=Math.max(0,Math.min(100,player.hp/player.maxHp*100));
    var mpPct=player.maxMp>0?Math.max(0,Math.min(100,player.mp/player.maxMp*100)):0;
    var hpFill=mBar.querySelector('.mbar-fill.hp');
    var mpFill=mBar.querySelector('.mbar-fill.mp');
    if(hpFill) hpFill.style.width=hpPct+'%';
    if(mpFill) mpFill.style.width=mpPct+'%';
    var hpTxt=document.getElementById('mBarHp');
    var mpTxt=document.getElementById('mBarMp');
    if(hpTxt) hpTxt.textContent='❤ '+player.hp+'/'+player.maxHp;
    if(mpTxt) mpTxt.textContent='✦ '+player.mp+'/'+player.maxMp;
  }
  var mp2='';
  for(var pk in POTIONS){
    var cnt=player.potions[pk]||0;
    var key=POTIONS[pk].key;
    mp2+='<button class="'+(cnt>0?'':'dis')+'" data-pot="'+pk+'">'+POTIONS[pk].emoji+' '+POTIONS[pk].name+'<span class="cn">x'+cnt+'</span></button>';
  }
  for(var ck2 in CONSUM){
    var cnt2=player.consum[ck2]||0;
    mp2+='<button class="'+(cnt2>0?'':'dis')+'" data-con="'+ck2+'">'+CONSUM[ck2].emoji+' '+CONSUM[ck2].name+'<span class="cn">x'+cnt2+'</span></button>';
  }
  document.getElementById('mPots').innerHTML=mp2;
  document.querySelectorAll('#mPots button[data-pot]').forEach(function(btn){
    var pid2=btn.getAttribute('data-pot');
    btn.onclick=function(){ usePotion(pid2); };
    bindTip(btn,function(){ return potTipHtml(pid2); });
  });
  document.querySelectorAll('#mPots button[data-con]').forEach(function(btn){
    var cid2=btn.getAttribute('data-con');
    btn.onclick=function(){ useConsum(cid2); };
    bindTip(btn,function(){ return conTipHtml(cid2); });
  });
}

function achListHtml(){

function bindOverlay(type){
  var el=overlayEl;
  el.querySelectorAll('.diff-btn').forEach(function(btn){
    btn.onclick=function(){
      difficulty=this.getAttribute('data-diff');
      renderOverlay('title');
    };
  });
  el.querySelectorAll('.class-card').forEach(function(card){
    card.onclick=function(){ newGame(this.getAttribute('data-cls')); };
  });
  el.querySelectorAll('.perk-card[data-perk]').forEach(function(card){
    var idx=parseInt(card.getAttribute('data-perk'));
    card.onclick=function(){ choosePerk(idx); };
    bindTip(card,function(){
      var p=pendingPerks[idx];
      return p?'<div class="tt-name" style="color:#ffb03d">'+p.name+'</div><div class="tt-line">'+p.desc+'</div>':'';
    });
  });
  el.querySelectorAll('.mastery-card').forEach(function(card){
    var idx=parseInt(card.getAttribute('data-mastery'));
    card.onclick=function(){ chooseMastery(idx); };
    bindTip(card,function(){
      var m=pendingMastery?pendingMastery[idx]:null;
      return m?'<div class="tt-name" style="color:#57c8ff">'+m.name+'</div><div class="tt-line">'+m.desc+'</div>':'';
    });
  });
  el.querySelectorAll('.buy').forEach(function(btn){
    var bidx=parseInt(btn.getAttribute('data-buy'));
    btn.onclick=function(){ buyShop(parseInt(this.getAttribute('data-buy'))); };
    var oit=shopOffers[bidx];
    if(oit&&oit.kind==='gear'){
      bindTip(btn,function(){ return gearTipHtml(oit.gear); });
    }
  });
  el.querySelectorAll('[data-smith]').forEach(function(btn){
    btn.onclick=function(){ buySmith(this.getAttribute('data-smith')); };
  });
  el.querySelectorAll('[data-event]').forEach(function(btn){
    var idx=parseInt(btn.getAttribute('data-event'));
    btn.onclick=function(){ chooseEvent(idx); };
    if(currentEvent&&currentEvent.opts[idx]){
      var op=currentEvent.opts[idx];
      bindTip(btn,function(){
        var t='<div class="tt-name" style="color:#c76bff">'+currentEvent.emoji+' '+currentEvent.title+'</div>';
        if(currentEvent.desc) t+='<div class="tt-dim">'+currentEvent.desc+'</div>';
        t+='<div class="tt-line">'+op.label+'</div>';
        return t;
      });
    }
  });
  el.querySelectorAll('[data-selleq]').forEach(function(btn){
    btn.onclick=function(){ sellEquipped(this.getAttribute('data-selleq')); };
  });
  el.querySelectorAll('[data-sellbag]').forEach(function(btn){
    btn.onclick=function(){ sellBagItem(parseInt(this.getAttribute('data-sellbag'))); };
  });
  el.querySelectorAll('[data-cslot]').forEach(function(el3){
    var cs2=el3.getAttribute('data-cslot');
    var g2=player.gear[cs2];
    bindTip(el3,function(){ return g2?gearTipHtml(g2):''; });
  });
  el.querySelectorAll('[data-uneq]').forEach(function(btn){
    btn.onclick=function(){
      var slot=btn.getAttribute('data-uneq');
      var g=player.gear[slot];
      if(!g) return;
      if(player.bag.length>=30){ addLog('背包已满，无法卸下',true); SFX.deny(); return; }
      player.bag.push(g);
      player.gear[slot]=null;
      SFX.pickup();
      recomputeStats();
      updateSidebar();
      if(overlayType==='equip') renderOverlay('equip');
      else renderOverlay('shop');
    };
  });
  var sellAll=el.querySelector('#btnSellAll');
  if(sellAll) sellAll.onclick=function(){
    if(!player.bag.length) return;
    var total=0;
    for(var i=player.bag.length-1;i>=0;i--){
      total+=sellPrice(player.bag[i]);
      player.bag.splice(i,1);
      stats.sold=(stats.sold||0)+1;
    }
    player.gold+=total; stats.goldEarned+=total;
    if(stats.sold>=5) unlock('sell5');
    SFX.coin();
    addLog('清空背包，获得 '+total+' 金币',true);
    renderOverlay('shop');
    updateSidebar();
  };

    btn.onclick=function(){ buyUpg(this.getAttribute('data-upg')); };
  });

    btn.onclick=function(){ synthesizePotion(this.getAttribute('data-synth')); };
  });
  el.querySelectorAll('[data-ench]').forEach(function(btn){
    btn.onclick=function(){ enchantWeapon(this.getAttribute('data-ench')); };
  });
  var resume=el.querySelector('#btnResume');
  if(resume) resume.onclick=function(){
    if(loadGame()){
      scene='play';
      hideOverlay();
      recomputeStats();
      computeFOV();
      updateSidebar();
      updateQuestBar();
      if(levelQueue.length){
        if(pendingPerks.length) renderOverlay('levelup');
        else startLevelUp();
      }
      render();
      addLog('欢迎回来，继续你的冒险',true);
      render();
    }
  };
  var clear=el.querySelector('#btnClear');
  if(clear) clear.onclick=function(){
    clearSave();
    renderOverlay('title');
  };
  var again=el.querySelector('#btnAgain');
  if(again) again.onclick=function(){ renderOverlay('title'); };
  var today=getDaily();
  var dailyEl=el.querySelector('#dailyTip');
  if(dailyEl&&today.tip) bindTip(dailyEl,function(){ return '<div class="tt-name" style="color:#ffd857">📅 今日深渊 · '+today.name+'</div><div class="tt-line">'+today.tip+'</div>'; });
  var achBtn=el.querySelector('#btnAch');
  if(achBtn) achBtn.onclick=function(){ renderOverlay('ach'); };
  var achClose=el.querySelector('#btnAchClose');
  if(achClose) achClose.onclick=function(){ renderOverlay('title'); };
  el.querySelectorAll('[data-bagwear]').forEach(function(btn){
    btn.onclick=function(){
      var idx=parseInt(this.getAttribute('data-bagwear'));
      var item=player.bag[idx];
      if(!item) return;
      if(equipItem(item)){
        player.bag.splice(idx,1);
        recomputeStats();
        SFX.pickup();
        renderOverlay('bag');
      } else {
        addLog('已有更好的'+(item.slot==='ring'?'戒指':'装备'),true);
        SFX.deny();
      }
      updateSidebar();
    };
  });
  var bagClose=el.querySelector('#btnBagClose');
  if(bagClose) bagClose.onclick=function(){ hideOverlay(); };
  var bagEquip=el.querySelector('#btnBagEquip');
  if(bagEquip) bagEquip.onclick=function(){ renderOverlay('equip'); };
  var equipBag=el.querySelector('#btnEquipBag');
  if(equipBag) equipBag.onclick=function(){ renderOverlay('bag'); };
  var endless=el.querySelector('#btnEndless');
  if(endless) endless.onclick=function(){ continueEndless(); };
  var title=el.querySelector('#btnTitle');
  if(title) title.onclick=function(){ renderOverlay('title'); };
  var shop=el.querySelector('#btnLeaveShop');
  if(shop) shop.onclick=function(){ leaveShop(); };
  var refresh=el.querySelector('#btnRefreshShop');
  if(refresh) refresh.onclick=function(){
    if(player.gold<40){ addLog('金币不足！',true); SFX.deny(); return; }
    player.gold-=40;
    SFX.coin();
    openShop(true);
    updateSidebar();
  };
  var help=el.querySelector('#btnHelpClose');
  if(help) help.onclick=function(){ hideOverlay(); scene='play'; render(); };
  var resumeP=el.querySelector('#btnResumeP');
  if(resumeP) resumeP.onclick=function(){ hideOverlay(); };
  var sfxBtn=el.querySelector('#btnSfx');
  if(sfxBtn) sfxBtn.onclick=function(){
    SFX_ENABLED=!SFX_ENABLED;
    try{ localStorage.setItem('abyss_sfx',SFX_ENABLED?'on':'off'); }catch(e){}
    renderOverlay('pause');
  };
  var toTitle=el.querySelector('#btnToTitle');
  if(toTitle) toTitle.onclick=function(){ hideOverlay(); scene='title'; renderOverlay('title'); };
}

// ================= 输入 =================
document.addEventListener('keydown',function(e){
  var k=e.key.toLowerCase();
  if(scene==='title'||scene==='shop'||scene==='levelup'||scene==='mastery'||scene==='dead'||scene==='win') return;
  if(scene==='play'&&!overlayEl.classList.contains('hide')){
    if(k==='escape'&&(overlayType==='pause'||overlayType==='help'||overlayType==='bag')){ hideOverlay(); }
    return;
  }
  if(k==='escape'){ renderOverlay('pause'); return; }
  var m=null;
  if(k==='w'||k==='arrowup') m={x:0,y:-1};
  else if(k==='s'||k==='arrowdown') m={x:0,y:1};
  else if(k==='a'||k==='arrowleft') m={x:-1,y:0};
  else if(k==='d'||k==='arrowright') m={x:1,y:0};
  if(m){
    e.preventDefault();
    playerMove(m.x,m.y);
    return;
  }
  if(k===' '){ e.preventDefault(); waitTurn(); }
  else if(k==='m'){
    showAllMap=true;
    addLog('地图已揭示',true);
  }
  else if(k==='h'){ renderOverlay('help'); }
  else if(k==='1'||k==='2'||k==='3'){ useSkill(parseInt(k)-1); }
  else if(k==='4'){ usePotion('heal'); }
  else if(k==='5'){ usePotion('mana'); }
  else if(k==='6'){ usePotion('str'); }
  else if(k==='7'){ usePotion('insight'); }
  else if(k==='8'){ usePotion('elixir'); }
  else if(k==='z'){ useConsum('bomb'); }
  else if(k==='x'){ useConsum('scroll'); }
  else if(k==='c'){ useConsum('berserk'); }
  else if(k==='v'){ useConsum('antidote'); }
  else if(k==='r'){ useConsum('revive'); }
  else if(k==='p'){ paused=!paused; }
});
cv.addEventListener('mousemove',function(e){
  if(scene!=='play'||!overlayEl.classList.contains('hide')) return;
  var t=tileAtEvent(e);
  if(!t) return;
  hoverTile=t;
  var en=enemyAt(t.x,t.y);
  var tr=trapAt(t.x,t.y);
  if(en&&en.hp>0){ showTip(e.clientX,e.clientY,enemyTipHtml(en)); }
  else if(tr){ showTip(e.clientX,e.clientY,trapTipHtml(tr)); }
  else {
    var gi=null,ch=null;
    for(var i=0;i<groundItems.length;i++){ if(groundItems[i].x===t.x&&groundItems[i].y===t.y){ gi=groundItems[i]; break; } }
    for(var j=0;j<chests.length;j++){ if(chests[j].x===t.x&&chests[j].y===t.y){ ch=chests[j]; break; } }
    var tt=grid[t.y][t.x];
    if(gi){ showTip(e.clientX,e.clientY,dropTipHtml(gi.item)); }
    else if(ch&&tt===3){ showTip(e.clientX,e.clientY,chestTipHtml(ch)); }
    else if(tt===4||tt===5||tt===6){ showTip(e.clientX,e.clientY,tileTipHtml(tt)); }
    else hideTip();
  }
});
cv.addEventListener('mouseleave',hideTip);
cv.addEventListener('click',function(e){
  if(scene!=='play') return;
  if(!overlayEl.classList.contains('hide')) return;
  var t=tileAtEvent(e);
  if(!t) return;
  var tx=t.x,ty=t.y;
  if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) return;
  if(bombTargeting){
    placeBomb(tx,ty);
    return;
  }
  if(grid[ty][tx]===1){ return; }
  var e2=enemyAt(tx,ty);
  if(e2){
    if(manhattan(player.x,player.y,tx,ty)>1){
      var p2=bfs(player.x,player.y,tx,ty,false);
      if(!p2){
        showTip(e.clientX,e.clientY,enemyTipHtml(e2));
        if(tipTimer) clearTimeout(tipTimer);
        tipTimer=setTimeout(hideTip,3200);
        return;
      }
      targetPos={x:tx,y:ty,enemy:e2};
      addLog('已锁定目标：'+e2.type,true);
    } else {
      targetPos={x:tx,y:ty,enemy:e2};
    }
  } else {
    var p3=bfs(player.x,player.y,tx,ty,false);
    if(!p3){
      var gi2=null,ch2=null;
      for(var i2=0;i2<groundItems.length;i2++){ if(groundItems[i2].x===tx&&groundItems[i2].y===ty){ gi2=groundItems[i2]; break; } }
      for(var j2=0;j2<chests.length;j2++){ if(chests[j2].x===tx&&chests[j2].y===ty){ ch2=chests[j2]; break; } }
      var tt2=grid[ty][tx];
      var tip='';
      if(gi2) tip=dropTipHtml(gi2.item);
      else if(ch2&&tt2===3) tip=chestTipHtml(ch2);
      else if(tt2===4||tt2===5||tt2===6) tip=tileTipHtml(tt2);
      if(tip){
        showTip(e.clientX,e.clientY,tip);
        if(tipTimer) clearTimeout(tipTimer);
        tipTimer=setTimeout(hideTip,3200);
        return;
      }
      addLog('无法到达',true); SFX.deny(); return;
    }
    targetPos={x:tx,y:ty,enemy:null};
  }
  if(targetPos) moveToTarget();
});
cv.addEventListener('contextmenu',function(e){
  e.preventDefault();
  if(targetPos){ targetPos=null; addLog('已取消目标',true); }
});
function tileAtEvent(e){
  var rect=cv.getBoundingClientRect();
  var mx=Math.floor((e.clientX-rect.left)/rect.width*VIEW);
  var my=Math.floor((e.clientY-rect.top)/rect.height*VIEW);
  var camX=clamp(player.x-Math.floor(VIEW/2),0,MAP_W-VIEW);
  var camY=clamp(player.y-Math.floor(VIEW/2),0,MAP_H-VIEW);
  return {x:camX+mx,y:camY+my};
}
document.querySelectorAll('#touch .tpad button[data-m]').forEach(function(btn){
  btn.addEventListener('click',function(){
    if(scene!=='play') return;
    var p=this.getAttribute('data-m').split(',');
    if(p[0]==='0'&&p[1]==='0'){ waitTurn(); return; }
    playerMove(parseInt(p[0]),parseInt(p[1]));
  });
});
document.querySelectorAll('#touch .tcol button[data-q]').forEach(function(btn){
  btn.addEventListener('click',function(){
    if(scene!=='play') return;
    var q=this.getAttribute('data-q');
    if(q==='heal'){ usePotion('heal'); }
    else if(q==='mana'){ usePotion('mana'); }
    else if(q==='bag'){ renderOverlay('bag'); }
  });
});
document.querySelectorAll('#touch .gskill').forEach(function(btn,i){
  btn.addEventListener('click',function(){ useSkill(i); });
});
document.querySelectorAll('#touch .gslot').forEach(function(btn){
  btn.addEventListener('click',function(){ renderOverlay('equip'); });
});

// ================= 自适应 =================
function fitCanvas(){
  var w=window.innerWidth;
  if(w>900) return;
  var h=window.innerHeight;
  var s=Math.min(w-8, h-245, 616);
  if(s>0){ cv.style.width=s+'px'; cv.style.height=s+'px'; }
}
window.addEventListener('resize',function(){ fitCanvas(); });
window.addEventListener('orientationchange',function(){ setTimeout(fitCanvas,200); });
fitCanvas();

// ================= 主循环 =================
function loop(){
  if(scene==='play'&&!paused){
    render();
  }
  requestAnimationFrame(loop);
}

// ================= 启动 =================
renderOverlay('title');
loop();
setInterval(function(){
  if(scene==='play') saveGame();
},5000);
</script>
