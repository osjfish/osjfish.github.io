<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>深渊回廊</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body { height:100%; height:100dvh; }
body {
  background:#0b0d12;
  color:#cfd8e3;
  font-family:"Microsoft YaHei","PingFang SC",sans-serif;
  overflow:hidden;
  user-select:none;
  -webkit-user-select:none;
  touch-action:manipulation;
}
#app { display:flex; height:100%; height:100dvh; justify-content:center; align-items:center; gap:10px; padding:max(8px, env(safe-area-inset-top)) 8px 8px; }
#left { position:relative; display:flex; align-items:center; justify-content:center; }
canvas#cv {
  background:#000;
  border:1px solid #2a2f3a;
  border-radius:8px;
  box-shadow:0 0 40px rgba(80,60,120,0.25);
  image-rendering:pixelated;
  display:block;
  touch-action:manipulation;
  width:616px; height:616px;
  max-width:min(92vw, calc(100dvh - 24px));
  max-height:calc(100dvh - 24px);
}
#log {
  position:absolute; left:8px; right:8px; bottom:6px;
  background:rgba(0,0,0,0.72);
  border:1px solid #2a2f3a; border-radius:6px;
  padding:5px 10px; font-size:12px; line-height:1.5;
  height:64px; overflow:hidden; pointer-events:none;
  color:#9fb2c8; backdrop-filter:blur(2px);
}
#log .l-new { color:#e8d5a8; }
#questBar { position:absolute; top:8px; left:8px; z-index:3; font-size:11px; }
#questBar .qpill {
  background:rgba(10,13,20,0.85); border:1px solid #3a4664; border-radius:14px;
  padding:4px 10px; color:#cfd8e3; cursor:pointer; max-width:78vw; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
#questBar .qpill.done { border-color:#3ddc7a; color:#3ddc7a; }
#questBar .qpill.fail { border-color:#ff6b57; color:#ff6b57; }
#side { width:300px; display:flex; flex-direction:column; gap:8px; height:min(94vh,720px); overflow-y:auto; scrollbar-width:thin; }
.panel {
  background:rgba(15,18,26,0.9);
  border:1px solid #232936;
  border-radius:8px; padding:8px 10px;
}
.panel h3 {
  font-size:12px; color:#8fa3bd; margin-bottom:6px;
  border-bottom:1px solid #232936; padding-bottom:4px;
  letter-spacing:1px;
}
.bar { position:relative; height:16px; background:#141a26; border-radius:8px; overflow:hidden; margin-bottom:4px; border:1px solid #232936; }
.bar .fill { height:100%; transition:width .25s; }
.bar .txt { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:10px; font-weight:bold; text-shadow:0 1px 2px #000; }
#barHp .fill { background:linear-gradient(90deg,#7a1f1f,#c0392b); }
#barMp .fill { background:linear-gradient(90deg,#1a3f7a,#2980b9); }
#barXp { height:7px; border-radius:4px; }
#barXp .fill { background:linear-gradient(90deg,#7d5a1f,#d4a017); }
#bossBar { position:absolute; top:8px; left:50%; transform:translateX(-50%); width:280px; z-index:3; background:rgba(10,12,18,0.9); border:1px solid #ff2d55; border-radius:8px; padding:6px 10px; font-size:12px; }
#bossBar.hide { display:none; }
#bossBar .txt { color:#ff8a7a; font-weight:bold; margin-bottom:3px; }
#barBoss { height:10px; border-color:#ff2d55; }
#barBoss .fill { background:linear-gradient(90deg,#7a1020,#ff2d55); }
.chips { display:grid; grid-template-columns:repeat(3,1fr); gap:4px; margin-bottom:4px; }
.chip { background:#141a26; border:1px solid #232936; border-radius:5px; padding:2px 4px; font-size:10px; color:#8fa3bd; text-align:center; line-height:1.6; }
.chip b { color:#e8d5a8; font-weight:bold; }
#statusList { font-size:11px; min-height:15px; color:#f0a8a0; }
.st-burn { color:#ff6b57; } .st-poison { color:#57ff8a; } .st-freeze{ color:#57c8ff; } .st-buff { color:#ffd857; } .st-dodge{ color:#b0ff57; } .st-slow { color:#aab8c9; } .st-berserk { color:#ff9d3d; }
#skills { display:flex; flex-direction:column; gap:4px; }
.skill-btn {
  display:flex; align-items:center; gap:8px;
  background:#161c2a; border:1px solid #2a3245; border-radius:6px;
  padding:5px 8px; color:#cfd8e3; cursor:pointer; font-size:12px;
  transition:all .15s; text-align:left;
}
.skill-btn:hover { border-color:#5a6a8a; background:#1c2436; }
.skill-btn:active { transform:scale(0.97); }
.skill-btn.dis { opacity:.4; cursor:not-allowed; }
.skill-btn .k { background:#232b3d; border-radius:4px; padding:0 6px; font-size:10px; color:#8fa3bd; }
.skill-btn .name { font-weight:bold; color:#e8d5a8; }
.skill-btn .c { color:#8fa3bd; font-size:10px; margin-left:auto; text-align:right; }
.skill-btn .c.cd { color:#57c8ff; }
#items { display:flex; flex-direction:column; gap:3px; font-size:11px; }
.item-btn { display:flex; gap:8px; align-items:center; background:#141a26; border:1px solid #232936; border-radius:5px; padding:3px 6px; cursor:pointer; font-size:11px; }
.item-btn:hover { border-color:#5a6a8a; }
.item-btn.upg { border-color:#1f8a52; box-shadow:0 0 6px rgba(61,220,122,0.25); }
.item-btn .k { background:#232b3d; border-radius:4px; padding:0 5px; font-size:10px; color:#8fa3bd; }
  .sellbtn { background:#3d1f22; border:1px solid #7a3a3f; color:#ff8a7a; border-radius:4px; padding:0 6px; font-size:10px; cursor:pointer; margin-left:6px; white-space:nowrap; }
  .sellbtn:hover { background:#572b30; }
  .st-combo { color:#ff6b81; font-weight:bold; }
.gear-row { display:flex; justify-content:space-between; align-items:center; padding:2px 0; font-size:11px; color:#aab8c9; }
.gear-row .gname { cursor:pointer; }
.gear-row .gname:hover { color:#fff; }
.r1{color:#c8cdd6;} .r2{color:#3ddc7a;} .r3{color:#3da9ff;} .r4{color:#c76bff;} .r5{color:#ffb03d;}
#mini { width:100%; image-rendering:pixelated; border:1px solid #232936; border-radius:6px; background:#0a0d13; }
#tooltip {
  position:fixed; z-index:60; display:none; max-width:280px;
  background:rgba(8,10,16,0.97); border:1px solid #3a4664; border-radius:8px;
  padding:10px 12px; font-size:12px; line-height:1.7; color:#cfd8e3;
  box-shadow:0 10px 34px rgba(0,0,0,0.65); pointer-events:none;
}
#tooltip .tt-name { color:#e8d5a8; font-weight:bold; margin-bottom:4px; }
#tooltip .tt-line { color:#aab8c9; }
#tooltip .tt-good { color:#3ddc7a; }
#tooltip .tt-bad { color:#ff6b57; }
#tooltip .tt-dim { color:#5a6678; font-size:11px; }
#touch { display:none; }
.chip.combo { border-color:#ff6b81; color:#ff6b81; }
#mobileHud { display:none; }
@media (max-width:900px) {
  #app { flex-direction:column; justify-content:flex-start; padding:max(4px, env(safe-area-inset-top)) 4px 4px; gap:4px; }
  #side { display:none; }
  canvas#cv {
    width:min(100vw - 8px, 100dvh - 120px);
    height:min(100vw - 8px, 100dvh - 120px);
    max-width:min(100vw - 8px, 100dvh - 120px);
    max-height:min(100vw - 8px, 100dvh - 120px);
  }
  #log { height:56px; font-size:11px; bottom:4px; padding:3px 8px; }
  #questBar { top:4px; left:4px; font-size:10px; }
  #bossBar { top:4px; width:min(46vw, 190px); padding:3px 8px; font-size:10px; border-radius:6px; }
  #bossBar .txt { margin-bottom:2px; }
  #barBoss { height:7px; }
  #touch { display:block; position:fixed; inset:0; pointer-events:none; z-index:5; }
  #mBar { position:absolute; left:8px; right:8px; display:flex; gap:4px; pointer-events:auto;
    bottom:calc(100dvh - min(100vw - 8px, 100dvh - 120px) - 18px); }
  #mBar .mbar { flex:1; position:relative; height:14px; background:#10141f; border:1px solid #232936; border-radius:4px; overflow:hidden; }
  #mBar .mbar-fill { position:absolute; left:0; top:0; bottom:0; border-radius:3px; transition:width .2s; }
  #mBar .mbar-fill.hp { background:linear-gradient(90deg,#b33,#e55); }
  #mBar .mbar-fill.mp { background:linear-gradient(90deg,#339,#55e); }
  #mBar .mbar span { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; font-size:9px; color:#cfd8e3; z-index:1; }
  #touch .tcols { position:absolute; left:8px; right:8px; display:flex; gap:6px; align-items:center; justify-content:space-between;
    bottom:calc(100dvh - min(100vw - 8px, 100dvh - 120px) - 191px); }
  #touch .tcol { display:flex; flex-direction:column; gap:3px; pointer-events:auto; flex:1; align-items:center; }
  #touch .tcol button { width:100%; max-width:72px; height:40px; background:rgba(30,36,52,0.88); border:1px solid #4a5670; border-radius:7px; color:#cfd8e3; font-size:11px; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:1px; }
  #touch .tcol button span { font-size:9px; color:#8fa3bd; line-height:1.1; }
  #touch .tcol button.dis { opacity:.4; }
  #touch .tpad { display:grid; grid-template-columns:repeat(3,48px); grid-template-rows:repeat(3,40px); gap:3px; pointer-events:auto; flex:0 0 auto; }
  #touch .tpad button { background:rgba(30,36,52,0.88); border:1px solid #4a5670; border-radius:7px; color:#cfd8e3; font-size:14px; }
  #touch .tpad button.gw { background:rgba(255,200,80,0.14); border-color:#ffd857; color:#ffd857; font-size:11px; }
  #mobileHud { display:block; position:fixed; left:0; right:0; bottom:0; z-index:4; background:rgba(10,12,18,0.97); border-top:1px solid #232936; padding:4px 4px calc(4px + env(safe-area-inset-bottom)); }
  #mGear { display:flex; gap:3px; margin-bottom:3px; }
  #mGear .mgear { flex:1; background:#10141f; border:1px solid #232936; border-radius:5px; font-size:9.5px; padding:2px 4px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; text-align:center; }
  #mChips { display:flex; gap:3px; flex-wrap:wrap; margin-bottom:3px; }
  #mChips .chip { flex:1; min-width:44px; font-size:10px; padding:1px 2px; background:#10141f; border:1px solid #232936; border-radius:5px; text-align:center; color:#cfd8e3; }
  #mSkills { display:flex; gap:3px; margin-bottom:3px; }
  #mSkills button { flex:1; background:#161c2a; border:1px solid #2a3245; border-radius:6px; color:#cfd8e3; font-size:10px; padding:3px 0; cursor:pointer; }
  #mSkills button .nm { color:#e8d5a8; font-weight:bold; display:block; }
  #mSkills button .mt { font-size:8.5px; color:#8fa3bd; }
  #mSkills button.dis { opacity:.4; }
  #mPots { display:flex; gap:3px; overflow-x:auto; padding-bottom:2px; }
  #mPots button { flex:0 0 auto; background:#141a26; border:1px solid #232936; border-radius:5px; color:#cfd8e3; font-size:10px; padding:3px 6px; cursor:pointer; white-space:nowrap; }
  #mPots button .cn { color:#8fa3bd; margin-left:4px; }
  #mPots button.dis { opacity:.4; }
}
#overlay {
  position:fixed; inset:0; background:rgba(5,6,10,0.92);
  display:flex; align-items:flex-start; justify-content:center; z-index:10;
  overflow-y:auto; padding:16px 0;
}
#overlay.hide { display:none; }
.card {
  background:linear-gradient(160deg,#141926,#0d1018);
  border:1px solid #2c3550; border-radius:14px;
  padding:22px; max-width:580px; width:94%; text-align:center;
  box-shadow:0 0 60px rgba(90,60,160,0.35);
  margin:auto;
}
.card h1 { font-size:32px; letter-spacing:8px; color:#e8d5a8; margin-bottom:4px; text-shadow:0 0 20px rgba(232,213,168,0.4); }
.card .sub { color:#8fa3bd; font-size:13px; margin-bottom:14px; }
.card h2 { color:#e8d5a8; font-size:20px; margin-bottom:10px; }
.card p { font-size:13px; color:#aab8c9; line-height:1.7; }
.class-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
.class-card {
  background:#151b29; border:1px solid #2a3245; border-radius:10px; padding:12px 6px;
  cursor:pointer; transition:all .2s;
}
.class-card:hover { border-color:#e8d5a8; transform:translateY(-3px); box-shadow:0 6px 20px rgba(0,0,0,0.5); }
.class-card .em { font-size:30px; }
.class-card .nm { color:#e8d5a8; font-weight:bold; margin:4px 0 2px; }
.class-card .ds { font-size:11px; color:#8fa3bd; }
.class-card .st { font-size:11px; color:#aab8c9; margin-top:4px; line-height:1.5; }
.diff-row { display:flex; justify-content:center; gap:8px; margin:8px 0; }
.diff-btn { background:#151b29; border:1px solid #2a3245; border-radius:8px; padding:6px 18px; color:#8fa3bd; cursor:pointer; font-size:13px; }
.diff-btn.sel { border-color:#ffb03d; color:#ffb03d; font-weight:bold; }
.btn {
  display:inline-block; background:#232b3d; border:1px solid #3a4664; border-radius:8px;
  color:#e8d5a8; padding:9px 20px; font-size:14px; cursor:pointer; margin:5px 3px;
  transition:all .15s;
}
.btn:hover { background:#2c3650; border-color:#e8d5a8; }
.btn.primary { background:linear-gradient(135deg,#7a5a1f,#d4a017); border-color:#e8d5a8; color:#1a1404; font-weight:bold; }
.btn.danger { border-color:#8a3a3a; color:#ff8a7a; }
.perk-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:8px; margin:12px 0; }
.perk-card { background:#151b29; border:1px solid #3a4664; border-radius:10px; padding:14px 8px; cursor:pointer; transition:all .2s; }
.perk-card:hover { border-color:#ffb03d; background:#1c2436; }
.perk-card .nm { color:#ffb03d; font-weight:bold; margin-bottom:4px; }
.mastery-grid { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin:12px 0; }
.mastery-card { background:#151b29; border:1px solid #57c8ff; border-radius:10px; padding:16px 10px; cursor:pointer; transition:all .2s; }
.mastery-card:hover { background:#1c2436; transform:translateY(-3px); }
.mastery-card .nm { color:#57c8ff; font-weight:bold; margin-bottom:4px; }
.shop-list { display:flex; flex-direction:column; gap:6px; margin:10px 0; text-align:left; }
.shop-item { display:flex; justify-content:space-between; align-items:center; background:#151b29; border:1px solid #2a3245; border-radius:8px; padding:7px 10px; font-size:12px; }
.shop-item .info { font-size:12px; }
.shop-item .price { color:#ffd857; font-weight:bold; font-size:12px; white-space:nowrap; margin-left:8px; }
.shop-item .buy { background:#232b3d; border:1px solid #ffd857; color:#ffd857; border-radius:6px; padding:3px 10px; cursor:pointer; font-size:11px; white-space:nowrap; }
.shop-item .buy:hover { background:#2c3650; }
.shop-item .buy.no { opacity:.35; cursor:not-allowed; }
.shop-section { font-size:11px; color:#8fa3bd; margin:8px 0 4px; border-top:1px solid #232936; padding-top:8px; letter-spacing:1px; }
.ach-list { text-align:left; font-size:12px; color:#aab8c9; margin-top:10px; max-height:150px; overflow-y:auto; }
.ach-list div { padding:2px 0; }
.ach-list .got { color:#ffd857; }
.upg-box { margin-top:10px; text-align:left; font-size:12px; background:#151b29; border:1px solid #3a2f5a; border-radius:8px; padding:8px 10px; max-height:130px; overflow-y:auto; }
.upg-box .upg-row { display:flex; justify-content:space-between; align-items:center; padding:3px 0; color:#aab8c9; }
.upg-box .buy { background:#232b3d; border:1px solid #c76bff; color:#c76bff; border-radius:6px; padding:2px 10px; cursor:pointer; font-size:11px; }
.upg-box .buy:hover { background:#2c3650; }
.upg-box .buy.no { opacity:.35; cursor:not-allowed; }
.event-opt.no { opacity:.4; }
.kbd { display:inline-block; background:#232b3d; border:1px solid #3a4664; border-bottom-width:3px; border-radius:4px; padding:0 6px; font-size:11px; color:#cfd8e3; margin:0 2px; }
#floatLayer { position:absolute; inset:0; pointer-events:none; overflow:hidden; }
</style>
</head>
<body>
<div id="app">
  <div id="left">
    <canvas id="cv" width="616" height="616"></canvas>
    <div id="bossBar" class="hide">
      <div class="txt" id="bossTxt"></div>
      <div class="bar" id="barBoss"><div class="fill" id="bossFill" style="width:100%"></div></div>
    </div>
    <div id="log"></div>
    <div id="questBar"></div>
  </div>
  <div id="side">
    <div class="panel">
      <h3 id="hudTitle">深渊回廊</h3>
      <div class="bar" id="barHp"><div class="fill" style="width:100%"></div><div class="txt" id="hpTxt"></div></div>
      <div class="bar" id="barMp"><div class="fill" style="width:100%"></div><div class="txt" id="mpTxt"></div></div>
      <div class="bar" id="barXp"><div class="fill" style="width:0%"></div></div>
      <div class="chips">
        <div class="chip">等级<b id="lvTxt"></b></div>
        <div class="chip">金币<b id="goldTxt"></b></div>
        <div class="chip">层数<b id="floorTxt"></b></div>
        <div class="chip" id="stepChip">步数<b id="stepTxt"></b></div>
        <div class="chip">攻击<b id="atkTxt"></b></div>
        <div class="chip">防御<b id="defTxt"></b></div>
        <div class="chip">暴击<b id="critTxt"></b></div>
        <div class="chip">暴伤<b id="cdmgTxt"></b></div>
        <div class="chip">闪避<b id="dodgeTxt"></b></div>
        <div class="chip">格挡<b id="blockTxt"></b></div>
        <div class="chip" id="comboChip" style="display:none;border-color:#ff6b81">连击<b id="comboTxt"></b></div>
      </div>
      <div id="statusList"></div>
    </div>
    <div class="panel">
      <h3>技能</h3>
      <div id="skills"></div>
    </div>
    <div class="panel">
      <h3>装备与背包</h3>
      <div id="items"></div>
    </div>
    <div class="panel">
      <h3>地图</h3>
      <canvas id="mini" width="280" height="130"></canvas>
    </div>
  </div>
</div>
<div id="mobileHud">
  <div id="mChips"></div>
  <div id="mPots"></div>
</div>
<div id="touch">
  <div id="mBar">
    <div class="mbar"><div class="mbar-fill hp"></div><span id="mBarHp"></span></div>
    <div class="mbar"><div class="mbar-fill mp"></div><span id="mBarMp"></span></div>
  </div>
  <div class="tcols">
    <div class="tcol">
      <button class="gslot" data-g="weapon">武</button>
      <button class="gslot" data-g="armor">甲</button>
      <button class="gslot" data-g="ring1">戒1</button>
      <button class="gslot" data-g="ring2">戒2</button>
    </div>
    <div class="tcol">
      <button class="gskill">技能1</button>
      <button class="gskill">技能2</button>
      <button class="gskill">技能3</button>
    </div>
    <div class="tcol">
      <button data-q="heal">💊<span>回血</span></button>
      <button data-q="mana">✨<span>回蓝</span></button>
      <button data-q="bag">🎒<span>背包</span></button>
    </div>
    <div class="tpad">
      <div></div><button data-m="0,-1">▲</button><div></div>
      <button data-m="-1,0">◀</button><button data-m="0,0" class="gw">等待</button><button data-m="1,0">▶</button>
      <div></div><button data-m="0,1">▼</button><div></div>
    </div>
  </div>
</div>
<div id="overlay" class="hide"></div>
<div id="floatLayer"></div>
<div id="tooltip"></div>

<script>
'use strict';
// ================= 工具 =================
var R = function(a,b){ return Math.floor(Math.random()*(b-a+1))+a; };
var pick = function(arr){ return arr[R(0,arr.length-1)]; };
var chance = function(p){ return Math.random()<p; };
var clamp = function(v,a,b){ return Math.max(a,Math.min(b,v)); };
var manhattan = function(x1,y1,x2,y2){ return Math.abs(x1-x2)+Math.abs(y1-y2); };

// ================= 音效 =================
var SFX_ENABLED = (function(){ try{ return localStorage.getItem('abyss_sfx')!=='off'; }catch(e){ return true; } })();
var AC = null;
function sfx(freq,dur,type,vol,slide){
  if(!SFX_ENABLED) return;
  try{
    if(!AC) AC = new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state==='suspended') AC.resume();
    var o=AC.createOscillator(), g=AC.createGain();
    o.type=type||'square';
    o.frequency.setValueAtTime(freq,AC.currentTime);
    if(slide) o.frequency.exponentialRampToValueAtTime(Math.max(30,freq+slide),AC.currentTime+dur);
    g.gain.setValueAtTime(vol||0.12,AC.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001,AC.currentTime+dur);

function rollRarity(f){
  var r=Math.random();
  var b=Math.min(0.03+f*0.004,0.08);
  if(player&&player.pity===undefined) player.pity=0;
  var pityMult=player?Math.min(1+player.pity*0.35,2.8):1;
  b*=pityMult;
  if(r< b*0.15) return 5;
  if(r< b*0.5) return 4;
  if(r< b) return 3;
  if(r< b+0.12) return 2;
  return 1;
}
function genGear(slot,f){
  var list=GEAR[slot];
  var avail=list.filter(function(g){ return g.tier<=f+1; });
  var base=pick(avail);
  var rarity=rollRarity(f);
  if(player){
    if(rarity>=3) player.pity=0;
    else player.pity=(player.pity||0)+1;
  }
  var mult=RARITY_MULT[rarity-1];
  var item={ slot:slot, name:RARITY_NAMES[rarity-1]+base.name, rarity:rarity, atk:0, def:0, hp:0, spd:0, crit:0 };
  if(chance(0.18)) item.set=pick(Object.keys(SETS));
  if(base.atk) item.atk=Math.max(1,Math.round(base.atk*mult));
  if(base.def) item.def=Math.max(1,Math.round(base.def*mult));
  if(base.hp) item.hp=Math.round(base.hp*mult);
  if(base.spd) item.spd=base.spd;
  if(base.crit) item.crit=base.crit;
  if(item.crit>=5&&chance(0.5)) item.crit+=R(1,3);
  rollAffixes(item,rarity);
  if(rarity>=5||(rarity===4&&chance(0.5))){
    var effs=GEAR_EFFECTS[slot==='ring'?'ring':slot];
    var eff=pick(effs);
    eff.apply(item);
  }
  if(rarity===5) unlock('legendary');
  return item;
}
function rollAffixes(item,rarity){
  var n=0;
  if(rarity>=2&&chance(0.35)) n=1;
  if(rarity>=3&&chance(0.6)) n+=1;
  if(rarity>=4) n+=1;
  if(rarity>=5) n+=1;
  var pool=AFFIXES.filter(function(a){ return a.slots.indexOf(item.slot)>=0; });
  var used={};
  var guard=0;
  while(n>0&&pool.length&&guard<20){
    guard++;
    var a=pick(pool);
    if(used[a.id]) continue;
    used[a.id]=true;
    a.apply(item);
    n--;
  }
}
function itemDesc(item){
  var s=[];
  if(item.atk) s.push('攻击+'+item.atk);
  if(item.def) s.push('防御+'+item.def);
  if(item.hp) s.push('生命+'+item.hp);
  if(item.spd) s.push('速度+'+item.spd);
  if(item.crit) s.push('暴击+'+item.crit+'%');
  if(item.critDmg) s.push('暴伤+'+item.critDmg+'%');
  if(item.mp) s.push('魔力+'+item.mp);
  if(item.lifesteal) s.push('吸血+'+item.lifesteal+'%');
  if(item.thorns) s.push('荆棘+'+item.thorns);
  if(item.block) s.push('格挡+'+item.block+'%');
  if(item.elem) s.push(ELEMENTS[item.elem].name+'伤害');
  if(item.eff) s.push('特效['+effName(item.eff)+']');
  return s.join(' ');
}
function itemStatLines(it){

  if(it.critDmg) s.push('暴击伤害 +'+it.critDmg+'%');
  if(it.mp) s.push('魔力 +'+Math.round(it.mp*up));
  if(it.lifesteal) s.push('吸血 +'+it.lifesteal+'%');
  if(it.thorns) s.push('荆棘 +'+it.thorns);
  if(it.block) s.push('格挡 +'+it.block+'%');
  if(it.elem) s.push('附加 '+ELEMENTS[it.elem].name+'元素伤害（克制关系加成）');

var floorShortest=55;
function floorStepsLimit(f){
  var d=(floorShortest>0)?floorShortest:55;
  return Math.min(380,Math.max(120,Math.round(d*3.5)+25+Math.floor(f*2)));
}
function getFloorSteps(){ return (player.floorSteps==null)?floorStepsLimit(floor):player.floorSteps; }
function floorConnected(ax,ay,bx,by){
  var q=[[ax,ay]],qh=0,vis={};
  vis[ay*MAP_W+ax]=true;
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(qh<q.length){
    var c=q[qh++];
    if(c[0]===bx&&c[1]===by) return true;
    for(var i=0;i<4;i++){
      var nx=c[0]+dirs[i][0],ny=c[1]+dirs[i][1];
      if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
      var k=ny*MAP_W+nx;
      if(vis[k]) continue;
      var t=grid[ny][nx];
      if(t===1||t===5) continue;
      vis[k]=true; q.push([nx,ny]);
    }
  }
  return false;
}
function genFloor(f){
  grid=Array.from({length:MAP_H},function(){ return Array(MAP_W).fill(1); });
  explored=Array.from({length:MAP_H},function(){ return Array(MAP_W).fill(false); });
  var rooms=[];
  var tries=0;
  while(rooms.length<15&&tries<500){
    tries++;
    var w=R(4,8),h=R(4,6),x=R(1,MAP_W-w-2),y=R(1,MAP_H-h-2);
    var ok=true;
    for(var i=0;i<rooms.length;i++){
      var r=rooms[i];
      if(x<r.x+r.w+1&&x+w>r.x-1&&y<r.y+r.h+1&&y+h>r.y-1){ ok=false; break; }
    }
    if(!ok) continue;
    rooms.push({x:x,y:y,w:w,h:h});
    for(var yy=y;yy<y+h;yy++) for(var xx=x;xx<x+w;xx++) grid[yy][xx]=0;
  }
  rooms.sort(function(a,b){ return (a.x+a.y)-(b.x+b.y); });
  for(var i2=1;i2<rooms.length;i2++){
    var a=rooms[i2-1],b=rooms[i2];
    var ax=Math.floor(a.x+a.w/2),ay=Math.floor(a.y+a.h/2);
    var bx=Math.floor(b.x+b.w/2),by=Math.floor(b.y+b.h/2);
    if(ax>bx){ for(var x1=bx;x1<=ax;x1++) grid[ay][x1]=0; }
    else { for(var x2=ax;x2<=bx;x2++) grid[ay][x2]=0; }
    if(ay>by){ for(var y1=by;y1<=ay;y1++) grid[y1][bx]=0; }
    else { for(var y2=ay;y2<=by;y2++) grid[y2][bx]=0; }
  }
  var start=rooms[0], stairs=rooms[rooms.length-1];
  player.x=Math.floor(start.x+start.w/2);
  player.y=Math.floor(start.y+start.h/2);
  targetPos=null;
  bombTargeting=false;
  stairsX=Math.floor(stairs.x+stairs.w/2);
  stairsY=Math.floor(stairs.y+stairs.h/2);
  grid[stairsY][stairsX]=2;

  enemies=[]; groundItems=[]; chests=[]; traps=[];
  placeTraps(f,start,stairs);
  var bossFloor=BOSSES[f];
  if(!bossFloor&&f>8&&f%5===0){
    var bk=Object.keys(BOSSES)[Math.floor(Math.random()*Object.keys(BOSSES).length)];
    bossFloor=JSON.parse(JSON.stringify(BOSSES[bk]));
    bossFloor.name=bossFloor.name+'·'+f+'层';
    bossFloor.endless=true;
  }
  if(bossFloor){
    addBoss(bossFloor, stairsX, stairsY);
  }
  var diff=DIFF[difficulty];
  var count=Math.min(8+f*2,34);
  var dd0=player.daily?DAILIES.filter(function(x){ return x.id===player.daily; })[0]:null;
  if(dd0&&dd0.spawnMul) count=Math.round(count*dd0.spawnMul);
  var placed=0, guard=0;
  while(placed<count&&guard<600){
    guard++;
    var ex=R(2,MAP_W-3),ey=R(2,MAP_H-3);
    if(grid[ey][ex]!==0) continue;
    if(manhattan(ex,ey,player.x,player.y)<7) continue;
    if(rooms.some(function(r){ return ex===Math.floor(r.x+r.w/2)&&ey===Math.floor(r.y+r.h/2); })) continue;
    var t=spawnEnemy(f);
    if(!t) continue;
    t.x=ex; t.y=ey;
    if(chance(diff.elite)) makeElite(t);
    enemies.push(t);
    placed++;
  }
  // 宝箱
  var chestCount=R(1,2)+Math.min(2,Math.floor(f/2));
  var cPlaced=0,cGuard=0;
  while(cPlaced<chestCount&&cGuard<300){
    cGuard++;
    var cx=R(2,MAP_W-3),cy=R(2,MAP_H-3);
    if(grid[cy][cx]!==0) continue;
    if(manhattan(cx,cy,player.x,player.y)<5) continue;
    grid[cy][cx]=3;
    chests.push({x:cx,y:cy});
    cPlaced++;
  }
  // 每10层必有一个金色宝库
  if(f%10===0){
    var gGuard=0;
    while(gGuard<300){
      gGuard++;
      var gx=R(2,MAP_W-3),gy=R(2,MAP_H-3);
      if(grid[gy][gx]!==0) continue;
      if(manhattan(gx,gy,player.x,player.y)<8) continue;
      grid[gy][gx]=3;
      chests.push({x:gx,y:gy,golden:true});
      break;
    }
  }
  // 事件房间
  if(f>=2&&chance(0.85)){
    var eGuard=0;
    while(eGuard<300){
      eGuard++;
      var evx=R(2,MAP_W-3),evy=R(2,MAP_H-3);
      if(grid[evy][evx]!==0) continue;
      if(manhattan(evx,evy,player.x,player.y)<6) continue;
      grid[evy][evx]=4;
      break;
    }
  }
  // 地面物品
  var itemCount=Math.min(2+f,7);
  var iPlaced=0,iGuard=0;
  while(iPlaced<itemCount&&iGuard<300){
    iGuard++;
    var ix=R(2,MAP_W-3),iy=R(2,MAP_H-3);
    if(grid[iy][ix]!==0) continue;
    if(manhattan(ix,iy,player.x,player.y)<4) continue;
    groundItems.push({x:ix,y:iy,item:randomDrop(f)});
    iPlaced++;
  }
  // 爆炸桶
  var barrelCount=Math.min(6,R(2,3)+Math.floor(f/3));
  var bPlaced=0,bGuard=0;
  while(bPlaced<barrelCount&&bGuard<300){
    bGuard++;
    var bx=R(2,MAP_W-3),by=R(2,MAP_H-3);
    if(grid[by][bx]!==0) continue;
    if(manhattan(bx,by,player.x,player.y)<4) continue;
    grid[by][bx]=5;
    if(!floorConnected(player.x,player.y,stairsX,stairsY)){
      grid[by][bx]=0;
      continue;
    }
    bPlaced++;
  }
  // 岩浆池
  var lavaCount=Math.min(5,R(2,3)+Math.floor(f/4));
  var lPlaced=0,lGuard=0;
  while(lPlaced<lavaCount&&lGuard<300){
    lGuard++;
    var lx=R(2,MAP_W-3),ly=R(2,MAP_H-3);
    if(grid[ly][lx]!==0) continue;
    if(manhattan(lx,ly,player.x,player.y)<5) continue;
    grid[ly][lx]=6;
    lPlaced++;
  }
  showAllMap=false;
  var sp=bfs(player.x,player.y,stairsX,stairsY,false);
  floorShortest=sp?sp.length:55;
  player.floorSteps=floorStepsLimit(f);
  recomputeStats();
}
function placeTraps(f,start,stairs){
  traps=[];
  var n=Math.min(14,R(6,10)+Math.floor(f/2));
  var placed=0,guard=0;
  var sx=Math.floor(start.x+start.w/2),sy=Math.floor(start.y+start.h/2);
  var tx=Math.floor(stairs.x+stairs.w/2),ty=Math.floor(stairs.y+stairs.h/2);
  while(placed<n&&guard<400){
    guard++;
    var px=R(2,MAP_W-3),py=R(2,MAP_H-3);
    if(grid[py][px]!==0) continue;
    if(manhattan(px,py,sx,sy)<7) continue;
    if(manhattan(px,py,tx,ty)<5) continue;
    var r=Math.random();
    var tp=r<0.35?'spike':(r<0.55?'web':(r<0.72?'tele':(r<0.85?'boom':(r<0.93?'curse':'venom'))));
    traps.push({x:px,y:py,type:tp});
    placed++;
  }
}
function spawnEnemy(f){

    return f>=t.minF&&f<=t.maxF;
  });

  var key=pick(keys);

  var diff=DIFF[difficulty];
  var hpMul=Math.pow(1.24,f-1)*diff.eHp, atkMul=Math.pow(1.21,f-1)*diff.eAtk;
  return {
    typeKey:key,
    type:t.name, emoji:t.emoji, color:t.color, kind:t.type, range:t.range||1, elem:t.elem||null,
    x:0,y:0,hp:Math.round(t.hp*hpMul),maxHp:Math.round(t.hp*hpMul),
    atk:Math.round(t.atk*atkMul),def:Math.round(t.def+(f-1)*0.3),
    xp:Math.round(t.xp*diff.xp),gold:Math.round(t.gold*diff.gold),spd:t.spd,burn:0,poison:0,freeze:0,
    burnChance:t.burn||0,poisonChance:t.poison||0,specialT:0,thorns:t.thorns||0,bomb:t.bomb||0,thief:t.thief||0,split:t.split||0,
    vision:t.vision||10
  };
}
function makeElite(e){
  var mod=pick(Object.keys(ELITE_MODS));
  e.elite=true; e.mods=[mod];
  e.maxHp=Math.round(e.maxHp*2.5); e.hp=e.maxHp;
  e.atk=Math.round(e.atk*1.25);
  e.xp=Math.round(e.xp*3); e.gold=Math.round(e.gold*2.5);
  e.dropChance=0.75;
  e.vision=Math.min(14,(e.vision||10)+2);
  if(mod==='shield') e.shieldHp=Math.round(e.maxHp*0.25);
}
function addBoss(b,tx,ty){
  var diff=DIFF[difficulty];
  var hpMul=Math.pow(1.22,floor-1)*diff.eHp, atkMul=Math.pow(1.18,floor-1)*diff.eAtk;
  enemies.push({
    type:b.name, emoji:b.emoji, color:b.color, kind:'boss', range:1, elem:b.elem||null,

    atk:Math.round(b.atk*atkMul),def:Math.round(b.def+(floor-1)),
    xp:Math.round(b.xp*diff.xp),gold:Math.round(b.gold*diff.gold),spd:b.spd,burn:0,poison:0,freeze:0,
    burnChance:0,poisonChance:0,specialT:0,bossType:b.bossType,endless:b.endless?true:false
  });

function randomDrop(f){
  var r=Math.random();
  if(r<0.3){ return {kind:'potion', potion:pick(['heal','heal','mana'])}; }
  if(r<0.42){ return {kind:'potion', potion:'str'}; }
  if(r<0.5){ return {kind:'potion', potion:'insight'}; }
  if(r<0.62){ return {kind:'consum', consum:pick(['bomb','scroll','berserk','antidote','revive'])}; }
  if(r<0.72){ return {kind:'gold', amount:R(12,30)*(1+Math.floor(f/2))}; }
  var slot=pick(['weapon','armor','ring']);
  return {kind:'gear', gear:genGear(slot,f)};
}
function applyDrop(item,x,y){
  if(item.kind==='potion'){ player.potions[item.potion]=(player.potions[item.potion]||0)+1; return true; }
  if(item.kind==='consum'){ player.consum[item.consum]=(player.consum[item.consum]||0)+1; return true; }
  if(item.kind==='gold'){ player.gold+=item.amount; stats.goldEarned+=item.amount; return true; }
  return tryEquipOrAdd(item.gear);
}

// ================= 寻路 =================
function bfs(sx,sy,tx,ty,ghost){
  if(sx===tx&&sy===ty) return [];
  var q=[[sx,sy]], qh=0;
  var prev={}, vis={};
  vis[sy*MAP_W+sx]=true;
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  while(qh<q.length){
    var c=q[qh++];
    var cx=c[0],cy=c[1];
    if(cx===tx&&cy===ty) break;
    for(var i=0;i<4;i++){
      var nx=cx+dirs[i][0],ny=cy+dirs[i][1];
      if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
      var k=ny*MAP_W+nx;
      if(vis[k]) continue;
      var t=grid[ny][nx];
      if(t===1&&!(ghost&&t===1)) continue;
      if(t===5) continue;
      vis[k]=true;
      prev[k]=[cx,cy];
      q.push([nx,ny]);
    }
  }
  if(!vis[ty*MAP_W+tx]) return null;
  var path=[], cx=tx,cy=ty;
  while(prev[cy*MAP_W+cx]){
    path.push([cx,cy]);
    var p=prev[cy*MAP_W+cx];
    cx=p[0];cy=p[1];
  }
  path.reverse();
  return path;
}

// ================= 视野 =================
function los(x0,y0,x1,y1){
  var dx=Math.abs(x1-x0),dy=Math.abs(y1-y0);
  var sx=x0<x1?1:-1,sy=y0<y1?1:-1;
  var err=dx-dy,x=x0,y=y0;
  while(true){
    if((x!==x0||y!==y0)){
      if(grid[y][x]===1) return false;
    }
    if(x===x1&&y===y1) return true;
    var e2=2*err;
    if(e2>-dy){ err-=dy; x+=sx; }
    if(e2<dx){ err+=dx; y+=sy; }
  }
}
function computeFOV(){
  var pr=9;
  for(var y=Math.max(0,player.y-pr);y<=Math.min(MAP_H-1,player.y+pr);y++){
    for(var x=Math.max(0,player.x-pr);x<=Math.min(MAP_W-1,player.x+pr);x++){
      if(manhattan(x,y,player.x,player.y)<=pr&&los(player.x,player.y,x,y)){
        explored[y][x]=true;
      }
    }
  }
}

// ================= 战斗 =================
function elemMult(attElem,defElem){
  if(!attElem||!defElem) return 1;
  if(ELEMENTS[attElem].beats===defElem) return 1.25;
  if(attElem===defElem) return 0.8;
  return 1;
}
function playerElem(){ var w=player.gear.weapon; return w&&w.elem?w.elem:null; }
function calcDamage(atk,def,critRate,critDmg,isCrit){
  var base=atk*(0.9+Math.random()*0.3);
  var dmg=Math.max(1,Math.round(base-def*(0.8+Math.random()*0.4)));
  var c=false;
  if(critRate&&Math.random()*100<critRate){ dmg=Math.round(dmg*critDmg/100); c=true; }
  return {dmg:dmg,crit:c};
}
function playerAttackEnemy(e,mult,critOverride,isSkill){
  if(!e||e.hp<=0) return {dmg:0,miss:true};
  if(e.elite&&e.mods&&e.mods.indexOf('elusive')>=0&&chance(0.3)){
    addFloat(e.x*TILE+TILE/2,e.y*TILE-TILE/2,'MISS','#aab8c9',13);
    return {dmg:0,miss:true};
  }
  var shadowMul=player.shadowT>0?2:1;
  if(player.shadowT>0) player.shadowT=0;
  var mult2=mult||1;
  if(player.m.coup&&e.hp>=e.maxHp) mult2*=1.2;
  if(e.weak&&playerElem()){
    if(ELEMENTS[playerElem()].beats===e.weak) mult2*=1.5;
    else if(playerElem()===e.weak) mult2*=0.8;
  }
  var cm=comboMult();
  var c=calcDamage(player.curAtk*(mult2)*(isSkill?player.skillMult:1)*shadowMul,e.def,player.curCrit,player.curCritDmg,false);
  c.dmg=Math.round(c.dmg*elemMult(playerElem(),e.elem)*cm);
  if(e.shieldHp>0){
    var taken=Math.min(e.shieldHp,c.dmg);
    e.shieldHp-=taken;
    c.dmg-=taken;
    addFloat(e.x*TILE+TILE/2,e.y*TILE-TILE/2,'护盾 -'+taken,'#57c8ff',13);
    if(e.shieldHp<=0) addLog(e.type+'的护盾被击碎了！',true);
  }
  if(c.crit){ stats.crits++; unlock('crit10'); }
  e.hp-=c.dmg;
  stats.dmgDealt+=c.dmg;
  player.combo=(player.combo||0)+1;
  if(player.combo>stats.comboMax) stats.comboMax=player.combo;
  if(player.combo===30) unlock('combo30');
  if(c.dmg>stats.bestHit) stats.bestHit=c.dmg;
  if(c.dmg>=150) unlock('bighit');
  if(e.hp>0){
    var wEff=player.gear.weapon?player.gear.weapon.eff:null;
    if(wEff==='burn'&&chance(0.3)){
      e.burn=Math.max(e.burn||0,2);
      addLog('炎刃灼烧了敌人！',true);
    }
    if(wEff==='shock'&&chance(0.2)){
      e.freeze=Math.max(e.freeze||0,1);
      addLog('雷牙麻痹了敌人！',true);
    }
    if(player.activeSets&&player.activeSets['ember']>=4&&chance(0.4)){
      e.burn=Math.max(e.burn||0,3);
      addLog('余烬套装点燃了敌人！',true);
    }
  }
  var off={x:e.x*TILE+TILE/2,y:e.y*TILE+TILE/2};
  addFloat(off.x,off.y,'-'+c.dmg,c.crit?'#ffd23d':'#ff6b57',c.crit?20:13);
  if(c.crit) SFX.crit(); else SFX.hit();
  addShake(2);
  hitstop=2;
  if(e.thorns>0&&c.dmg>0){
    var tb=Math.max(1,Math.round(c.dmg*e.thorns/100));
    player.hp-=tb;
    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'反弹 -'+tb,'#57c8ff',13);
    addLog(e.type+'的尖刺反弹了伤害！-'+tb,true);
    onPlayerDamage(tb);
    checkPlayerDeath();
  }
  if(player.lifesteal>0){
    var heal=Math.min(12,Math.round(c.dmg*player.lifesteal/100));
    if(heal>0){
      player.hp=Math.min(player.maxHp,player.hp+heal);
      addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'+'+heal,'#3ddc7a',11);
    }
  }
  if(e.hp<=0){
    var pe=playerElem();
    if(pe&&e.elem){ stats.elemKills[pe]=true; if(Object.keys(stats.elemKills).length>=4) unlock('element4'); }
    killEnemy(e);
  }
  return c;
}
function critDmg(){ return player.critDmg; }
function enemyAttackPlayer(e,mult){

  if(e.elite&&e.mods&&e.mods.indexOf('ice')>=0&&chance(0.3)){

    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'中毒','#57ff8a',13);
  }
  if(e.poisonChance&&chance(e.poisonChance)){ player.poison=4; addLog('你中毒了！',true); }

  if(e.elite&&e.mods&&e.mods.indexOf('fiery')>=0&&chance(0.25)){ player.burn=Math.max(player.burn,3); addLog('精英的灼热气浪灼烧了你！',true); }
  if(player.thorns>0){
    var dth=manhattan(e.x,e.y,player.x,player.y);
    if(dth<=1){
      e.hp-=player.thorns;
      addFloat(e.x*TILE+TILE/2,e.y*TILE-TILE/2,'-'+player.thorns,'#ffd857',12);
      if(e.hp<=0){ killEnemy(e); return; }
    }
  }
  checkPlayerDeath();
}
function onPlayerDamage(d){
  if(d<=0) return d;
  var real=d;
  /* 潮汐4件套减伤15%：调用方已先扣血，这里返还多扣的部分（修正结算顺序） */
  if(player.activeSets&&player.activeSets['tide']>=4) real=Math.round(d*0.85);
  if(real<d){
    player.hp+=d-real;
    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'潮汐 -'+(d-real),'#57c8ff',12);
  }
  stats.hitsTaken=(stats.hitsTaken||0)+1;
  player.combo=0;
  if(quest&&quest.type==='untouched'&&!quest.failed&&!quest.done){
    quest.failed=true;
    addLog('契约失败：你受到了伤害',true);
    updateQuestBar();
  }
  return real;
}
function comboMult(){
  var cap=20, unit=0.05;
  if(player.daily){
    var cd=DAILIES.filter(function(x){ return x.id===player.daily; })[0];
    if(cd){
      if(cd.comboCapBonus) cap+=cd.comboCapBonus;
      if(cd.comboMul) unit*=cd.comboMul;
    }
  }
  var c=Math.min(player.combo||0,cap);
  return 1+c*unit;
}
function killEnemy(e){
  e.hp=0;
  SFX.enemyDie();
  addShake(2);
  var off={x:e.x*TILE+TILE/2,y:e.y*TILE+TILE/2};
  spawnParticles(off.x,off.y,e.color,10);
  addFloat(off.x,off.y,'+'+e.xp+' XP','#ffd23d',13);
  var comboN=player.combo||0;
  if(comboN>=2) addFloat(off.x,off.y-16,comboN+'× 连击','#ff6b81',13);
  if(comboN>=10&&comboN%5===0){
    var mpGain=Math.min(4,1+Math.floor(comboN/15));
    player.mp=Math.min(player.maxMp,player.mp+mpGain);
    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'+'+mpGain+' MP','#57c8ff',13);
  }
  if(player.activeSets&&player.activeSets['void']>=4){
    player.mp=Math.min(player.maxMp,player.mp+2);
    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'+2 MP','#c76bff',12);
  }
  stats.kills++;
  stats.killsByType=stats.killsByType||{};
  stats.killsByType[e.typeKey]=(stats.killsByType[e.typeKey]||0)+1;
  unlock('first_blood');
  if(stats.kills===10) unlock('slayer10');
  if(stats.kills===50) unlock('slayer50');
  if(stats.kills===100) unlock('kill100');
  if(e.elite){ stats.elitesKilled++; if(stats.elitesKilled===5) unlock('elite5'); }
  var g=Math.round(e.gold*(1+player.goldLuck/100)*(hasEff('gold')?1.15:1));
  if(player.modifier){ var gmod=MODIFIERS.filter(function(x){ return x.id===player.modifier; })[0]; if(gmod&&gmod.goldMul) g=Math.round(g*gmod.goldMul); }
  if(player.daily){ var gd2=DAILIES.filter(function(x){ return x.id===player.daily; })[0]; if(gd2&&gd2.goldMul) g=Math.round(g*gd2.goldMul); }
  player.gold+=g; stats.goldEarned+=g;
  addLog('击败了'+e.type+'！获得 '+g+' 金币',true);
  if((e.elite&&e.mods&&e.mods.indexOf('split')>=0)||e.split){
    var spots=[];
    var sdirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var s=0;s<4;s++){
      var ax=e.x+sdirs[s][0],ay=e.y+sdirs[s][1];
      if(ax>=0&&ay>=0&&ax<MAP_W&&ay<MAP_H&&grid[ay][ax]===0&&!enemyAt(ax,ay)) spots.push([ax,ay]);
    }
    for(var s2=0;s2<2&&spots.length;s2++){
      var a=spots.splice(Math.floor(Math.random()*spots.length),1)[0];
      var sl=spawnEnemy(Math.max(floor-2,1));
      if(sl){
        sl.maxHp=Math.max(1,Math.round(e.maxHp*0.4));
        sl.hp=sl.maxHp;
        sl.atk=Math.max(1,Math.round(e.atk*0.5));
        sl.xp=Math.max(1,Math.round(e.xp*0.5));
        sl.gold=Math.max(1,Math.round(e.gold*0.5));
        sl.x=a[0];sl.y=a[1];
        enemies.push(sl);
        addLog(e.type+'分裂了！',true);
      }
    }
  }
  if((e.elite&&e.mods&&e.mods.indexOf('explode')>=0)){
    if(manhattan(e.x,e.y,player.x,player.y)<=1){
      var xd=R(10,16)+Math.round(player.maxHp*0.05);
      player.hp-=xd;
      addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'-'+xd,'#ff9f0a',16);
      addLog(e.type+'爆炸了！-'+xd,true);
      SFX.trap();
      onPlayerDamage(xd);
      checkPlayerDeath();
    } else {
      addLog(e.type+'轰然爆炸，溅起一片尘埃',true);
    }
  }
  if(e.elem==='fire'){
    var fdirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var fd=0;fd<4;fd++){
      var fx=e.x+fdirs[fd][0],fy=e.y+fdirs[fd][1];
      if(fx>=0&&fy>=0&&fx<MAP_W&&fy<MAP_H&&grid[fy][fx]===5) explodeBarrel(fx,fy);
    }
  }
  if(quest&&!quest.failed&&!quest.done&&quest.type==='hunt'&&quest.target===e.typeKey){
    quest.got++;
    questProgress();
  }
  var k=indexOfEnemy(e);
  if(k>=0) enemies.splice(k,1);
  var dropChance = (e.dropChance!=null)?e.dropChance:(e.kind==='boss'?1:0.25);
  if(chance(dropChance)){
    var item=randomDrop(floor);
    groundItems.push({x:e.x,y:e.y,item:item});
    addLog('掉落物品！',true);
  }
  if(e.kind==='boss'){
    var bonus=null;
    if(e.bossType==='knight') bonus={slot:'weapon',name:'寒冰之刃',atk:20,rarity:4,elem:'ice',upgrade:1};
    else if(e.bossType==='guard') bonus={slot:'armor',name:'壁垒之盾',def:14,hp:20,rarity:4,upgrade:1};
    else if(e.bossType==='lord') bonus={slot:'ring',name:'魔王之印',atk:8,crit:10,critDmg:25,rarity:5};
    else bonus=genGear(pick(['weapon','armor','ring']),floor+2);
    var ok=tryEquipOrAdd(bonus);
    if(ok) addLog('BOSS掉落：'+bonus.name+'！',true);
    else { groundItems.push({x:e.x,y:e.y,item:{kind:'gear',gear:bonus}}); addLog('背包已满，BOSS掉落留在了原地',true); }
    if(e.bossType==='knight') unlock('killBoss4');
    if(e.bossType==='guard') unlock('killBoss7');
    if(e.bossType==='lord'&&!e.endless){ unlock('conqueror'); winGame(); }
  }
  gainXp(e.xp);
}
function gainXp(n){
  if(player.modifier){
    var xm=MODIFIERS.filter(function(x){ return x.id===player.modifier; })[0];
    if(xm&&xm.xpMul) n=Math.round(n*xm.xpMul);
  }
  if(player.daily){
    var dm=DAILIES.filter(function(x){ return x.id===player.daily; })[0];
    if(dm&&dm.xpMul) n=Math.round(n*dm.xpMul);
  }
  player.xp+=n;
  while(player.xp>=xpNeeded(player.level)){
    player.xp-=xpNeeded(player.level);
    player.level++;
    levelQueue.push(player.level);
    player.growth.maxHp+=5; player.hp+=5;
    player.growth.maxMp+=2; player.mp+=2;
    player.growth.atk+=1; player.growth.def+=1;
    recomputeStats();
    SFX.levelup();
    addLog('升级了！等级 '+player.level,true);
    if(player.level===5) unlock('level5');
    if(player.level===10) unlock('level10');
    if(player.level===15) unlock('lv15');
  }
  if(levelQueue.length&&scene==='play'&&!pendingPerks.length&&!pendingMastery&&!inEnemyTurn){
    startLevelUp();
  }
}
function xpNeeded(lv){ return 30+lv*20; }
function indexOfEnemy(e){ return enemies.indexOf(e); }

function useSkill(i){

  } else if(sid==='fire'){
    var target=findRangedTarget(4);

    playerAttackEnemy(target,2.2,null,true);
    target.burn=3;
    addLog('火球命中，敌人被灼烧！',true);
    done=true;
  } else if(sid==='ice'){

    if(!target2){ addLog('射程内没有敌人',true); player.mp+=mp; return; }
    playerAttackEnemy(target2,1.8,null,true);
    target2.freeze=1;
    addLog('冰锥命中，敌人被冻结！',true);
    done=true;
  } else if(sid==='blink'){
    var nx=player.x,ny=player.y;
    var px=player.x,py=player.y;
    for(var b=0;b<5;b++){
      var tx=px+lastDir.x,ty=py+lastDir.y;
      if(tx<0||ty<0||tx>=MAP_W||ty>=MAP_H) break;
      if(grid[ty][tx]!==0&&grid[ty][tx]!==6) break;
      px=tx;py=ty;
      if(!enemyAt(tx,ty)){ nx=tx;ny=ty; }
    }
    if(nx===player.x&&ny===player.y){ addLog('无法移动',true); player.mp+=mp; return; }
    player.x=nx;player.y=ny;
    addLog('闪现！',true);
    done=true;
  } else if(sid==='volley'){
    var t=findRangedTarget(6);
    if(!t){ addLog('射程内没有敌人',true); player.mp+=mp; return; }
    for(var v=0;v<3;v++){ if(t.hp>0) playerAttackEnemy(t,0.6,null,true); }
    done=true;
  } else if(sid==='venom'){
    var t2=findRangedTarget(5);
    if(!t2){ addLog('射程内没有敌人',true); player.mp+=mp; return; }

    if(e3.hp<e3.maxHp*0.5) player.curCrit=100;
    playerAttackEnemy(e3,2.6,null,true);
    player.curCrit=critSave;
    if(e3.hp<e3.maxHp*0.5) addLog('背刺！致命一击！',true);
    done=true;
  } else if(sid==='fan'){
    var t3=findRangedTarget(4);
    if(!t3){ addLog('射程内没有敌人',true); player.mp+=mp; return; }
    for(var f=0;f<3;f++){ if(t3.hp>0) playerAttackEnemy(t3,0.75,null,true); }
    done=true;
  } else if(sid==='shadow'){
    var best=null,bd=99;
    for(var i=0;i<enemies.length;i++){
      var en=enemies[i];
      if(en.hp<=0) continue;
      var d=manhattan(en.x,en.y,player.x,player.y);
      if(d<=8&&d<bd&&los(player.x,player.y,en.x,en.y)){ bd=d; best=en; }
    }
    if(!best){ addLog('附近没有敌人',true); player.mp+=mp; return; }
    var spot=null;
    var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
    for(var i2=0;i2<4;i2++){
      var nx=best.x+dirs[i2][0],ny=best.y+dirs[i2][1];
      if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
      if(grid[ny][nx]===0&&!enemyAt(nx,ny)&&!(nx===player.x&&ny===player.y)){

        if(spot===null||dd<spot[2]) spot=[nx,ny,dd];

    player.x=spot[0];player.y=spot[1];
    player.shadowT=2;
    addLog('暗影步！下一次攻击伤害翻倍',true);
    done=true;
  }
  if(done){
    player.cd[sid]=sk.cd||0;
    endTurn();
  }
}
function enemyAt(x,y){
  for(var i=0;i<enemies.length;i++){
    if(enemies[i].x===x&&enemies[i].y===y&&enemies[i].hp>0) return enemies[i];
  }
  return null;
}
function trapAt(x,y){
  for(var i=0;i<traps.length;i++){
    if(traps[i].x===x&&traps[i].y===y) return traps[i];
  }
  return null;
}
function findRangedTarget(range){
  var best=null,bd=999;
  for(var i=0;i<enemies.length;i++){
    var e=enemies[i];
    if(e.hp<=0) continue;
    var d=manhattan(e.x,e.y,player.x,player.y);
    if(d<=range&&d<bd&&los(player.x,player.y,e.x,e.y)){ bd=d; best=e; }
  }
  return best;
}

function explodeBarrel(x,y){
  if(grid[y][x]!==5) return;
  grid[y][x]=0;
  var dmg=R(18,28)+8*floor;
  spawnParticles(x*TILE+TILE/2,y*TILE+TILE/2,'#ff9d3d',18);
  SFX.bomb();
  addLog('爆炸桶轰然炸开！',true);
  addShake(3);
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.hp<=0) continue;
    if(manhattan(e.x,e.y,x,y)<=1){
      e.hp-=dmg;
      addFloat(e.x*TILE+TILE/2,e.y*TILE-TILE/2,'-'+dmg,'#ff9d3d',15);
      if(e.hp<=0) killEnemy(e);
    }
  }
  if(manhattan(player.x,player.y,x,y)<=1){
    var pd=Math.max(1,Math.round(dmg*0.5));
    player.hp-=pd;
    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'-'+pd,'#ff9d3d',15);
    addLog('爆炸波及了你！-'+pd,true);
    onPlayerDamage(pd);
    checkPlayerDeath();
  }
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  for(var d=0;d<4;d++){
    var nx2=x+dirs[d][0],ny2=y+dirs[d][1];
    if(nx2>=0&&ny2>=0&&nx2<MAP_W&&ny2<MAP_H&&grid[ny2][nx2]===5){
      explodeBarrel(nx2,ny2);
    }
  }
}
function placeBomb(tx,ty){
  if(manhattan(player.x,player.y,tx,ty)>5){ addLog('超出投掷距离（5格）',true); SFX.deny(); return; }
  bombTargeting=false;
  player.consum.bomb--;
  var dmg=R(20,30)+10*floor;
  var hit=0;
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.hp<=0) continue;
    if(Math.abs(e.x-tx)<=1&&Math.abs(e.y-ty)<=1){
      e.hp-=dmg;
      addFloat(e.x*TILE+TILE/2,e.y*TILE-TILE/2,'-'+dmg,'#ff9d3d',15);
      if(e.hp<=0) killEnemy(e); else hit++;
    }
  }
  spawnParticles(tx*TILE+TILE/2,ty*TILE+TILE/2,'#ff9d3d',22);
  SFX.bomb();
  for(var bx2=tx-1;bx2<=tx+1;bx2++) for(var by2=ty-1;by2<=ty+1;by2++){
    if(bx2>=0&&by2>=0&&bx2<MAP_W&&by2<MAP_H&&grid[by2][bx2]===5) explodeBarrel(bx2,by2);
  }
  if(!hit) addLog('爆炸没有波及任何敌人',true);
  else addLog('炸弹炸到了 '+hit+' 个敌人！',true);
  endTurn();
}

// ================= 陷阱 =================
function triggerTrap(x,y){
  for(var i=traps.length-1;i>=0;i--){
    var t=traps[i];
    if(t.x===x&&t.y===y){
      traps.splice(i,1);
      stats.trapsTriggered++;
      if(stats.trapsTriggered===10) unlock('trap10');
      if(t.type==='spike'){
        var d=R(8,14)+Math.round(player.maxHp*0.03);
        player.hp-=d;
        addFloat(x*TILE+TILE/2,y*TILE+TILE/2,'-'+d,'#ff6b57',14);
        SFX.trap();
        addLog('踩中了地刺陷阱！-'+d,true);
        onPlayerDamage(d);
        checkPlayerDeath();
      } else if(t.type==='web'){
        if(player.m.swift){
          addLog('蛛网缠身，但疾风血脉让你轻松挣脱！',true);
          SFX.pickup();
        } else {
          player.slow=Math.max(player.slow,4);
          addLog('被蛛网缠住，行动迟缓！',true);
          SFX.trap();
        }
      } else if(t.type==='boom'){
        var bd=R(12,20)+Math.round(player.maxHp*0.04);
        player.hp-=bd;
        addFloat(x*TILE+TILE/2,y*TILE+TILE/2,'-'+bd,'#ff2d55',16);
        SFX.trap();
        addLog('引爆了爆炸陷阱！-'+bd,true);
        onPlayerDamage(bd);
        for(var bi=enemies.length-1;bi>=0;bi--){
          var be=enemies[bi];
          if(be.hp<=0) continue;
          if(manhattan(be.x,be.y,x,y)<=1){
            playerAttackEnemy(be,1.5);
          }
        }
        for(var bx3=x-1;bx3<=x+1;bx3++) for(var by3=y-1;by3<=y+1;by3++){
          if(bx3>=0&&by3>=0&&bx3<MAP_W&&by3<MAP_H&&grid[by3][bx3]===5) explodeBarrel(bx3,by3);
        }
        checkPlayerDeath();
      } else if(t.type==='venom'){
        var vd=Math.round(player.maxHp*0.04);
        player.hp-=vd;
        player.poison=Math.max(player.poison,3);
        addFloat(x*TILE+TILE/2,y*TILE+TILE/2,'-'+vd,'#57ff8a',14);
        SFX.trap();
        addLog('踩中了毒雾陷阱！中毒，-'+vd,true);
        onPlayerDamage(vd);
        checkPlayerDeath();
      } else if(t.type==='curse'){
        var pid2=null;
        for(var pk in player.potions){ if(player.potions[pk]>0){ pid2=pk; break; } }
        if(pid2){ player.potions[pid2]--; addLog('诅咒陷阱夺走了一瓶'+POTIONS[pid2].name+'！',true); }
        else if(player.gold>0){ var gd=Math.min(player.gold,Math.round(player.gold*0.1)+10); player.gold-=gd; addLog('诅咒陷阱偷走了 '+gd+' 金币！',true); }
        else addLog('诅咒陷阱翻了个空',true);
        SFX.trap();
      } else {
        var list=[];
        for(var yy=2;yy<MAP_H-2;yy++) for(var xx=2;xx<MAP_W-2;xx++){
          if(grid[yy][xx]===0&&manhattan(xx,yy,player.x,player.y)>10) list.push([xx,yy]);
        }
        if(list.length){
          var p=pick(list);
          player.x=p[0];player.y=p[1];
          addLog('被传送陷阱送到了别处！',true);
        } else {
          addLog('传送陷阱启动但无处可去',true);
        }
        SFX.trap();
      }
      return true;
    }
  }
  return false;
}

// ================= 敌人AI =================
function enemiesAct(){
  inEnemyTurn=true;
  for(var i=enemies.length-1;i>=0;i--){
    var e=enemies[i];
    if(e.hp<=0) continue;
    if(manhattan(e.x,e.y,player.x,player.y)>((e.kind==='boss')?99:(e.vision||10))) continue;
    if(e.freeze>0){ e.freeze--; continue; }
    var prevHp=e.hp;
    if(!e.enraged&&e.kind==='boss'&&e.hp<e.maxHp*0.3){
      e.enraged=true;
      e.atk=Math.round(e.atk*1.8);
      addLog(e.type+'进入了狂暴状态！攻击大幅提升',true);
      SFX.boss();
    }
    if(e.kind==='boss'){
      if(e.weak===undefined){ e.weak=pick(['fire','ice','lightning','poison']); e.weakT=3; }
      else {
        e.weakT--;
        if(e.weakT<=0){ e.weak=pick(['fire','ice','lightning','poison']); e.weakT=3; }
      }
    }
    if(e.kind==='boss'&&e.bossType==='knight'){
      e.specialT++;
      var kd=manhattan(e.x,e.y,player.x,player.y);
      if(e.retreat&&!e.enraged){
        e.retreat=0;
        var kspot=null;
        for(var ky=1;ky<MAP_H-1;ky++) for(var kx=1;kx<MAP_W-1;kx++){
          if(grid[ky][kx]!==0) continue;
          if(enemyAt(kx,ky)) continue;
          var kdd=manhattan(kx,ky,player.x,player.y);
          if(kdd>=3&&kdd<=5&&(kspot===null||kdd>manhattan(kspot[0],kspot[1],player.x,player.y))) kspot=[kx,ky];
        }
        if(kspot){
          e.x=kspot[0]; e.y=kspot[1];
          addLog(e.type+'策马后撤拉开距离！',true);
          continue;
        }
      }
      var kInterval=e.enraged?2:3;
      if(e.specialT%kInterval===0&&kd>=3&&kd<=8){
        var adj=adjacentFloor(player.x,player.y);
        if(adj){
          e.x=adj[0]; e.y=adj[1];
          addLog(e.type+'发动了冲锋！',true);
          enemyAttackPlayer(e,e.enraged?1.8:2.0);
          e.retreat=1;
          continue;
        }
      }
    }
    if(e.kind==='boss'&&e.bossType==='guard'){
      e.specialT++;
      if(e.specialT%(e.enraged?2:3)===0&&manhattan(e.x,e.y,player.x,player.y)<=1){
        addLog(e.type+'举起巨盾砸下！',true);
        enemyAttackPlayer(e,e.enraged?2.2:1.8);
        continue;
      }
    }
    if(e.kind==='boss'&&e.bossType==='lord'){
      e.specialT++;
      if(e.specialT%(e.enraged?2:3)===0){
        addLog('深渊魔王召唤了魔物！',true);
        var sum=e.enraged?3:2;
        for(var s=0;s<sum;s++){
          var a=adjacentFloor(e.x,e.y);
          if(a&&!enemyAt(a[0],a[1])){
            var sl=spawnEnemy(Math.max(floor-2,1));
            if(sl){ sl.x=a[0];sl.y=a[1]; enemies.push(sl); }
          }
        }
        continue;
      }
      if(e.enraged&&manhattan(e.x,e.y,player.x,player.y)<=2){
        addLog(e.type+'喷吐地狱烈焰！',true);
        enemyAttackPlayer(e,1.6);
        continue;
      }
    }
    var d=manhattan(e.x,e.y,player.x,player.y);
    var range=e.range||1;
    if(e.bomb&&d<=1){
      e.hp=0;
      SFX.trap();
      addShake(3);
      spawnParticles(e.x*TILE+TILE/2,e.y*TILE+TILE/2,'#ff9f0a',14);
      var xd=Math.max(1,Math.round(e.atk*1.5));
      player.hp-=xd;
      addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'爆炸 -'+xd,'#ff9f0a',16);
      addLog(e.type+'轰然自爆！你受到 '+xd+' 伤害',true);
      onPlayerDamage(xd);
      checkPlayerDeath();
      continue;
    }
    if(e.kind==='ghost'){
      var path=bfs(e.x,e.y,player.x,player.y,true);
      if(d>1){
        if(path&&path.length){
          var step=path[0];
          var target=enemyAt(step[0],step[1]);
          if(!target||target===e){
            e.x=step[0];e.y=step[1];
          } else if(d===1){
            enemyAttackPlayer(e,1);
          }
        }
      } else {
        enemyAttackPlayer(e,1);
      }
    } else if(e.kind==='ranged'){
      if(d<=range&&los(e.x,e.y,player.x,player.y)){
        enemyAttackPlayer(e,1);
      } else {
        var path2=bfs(e.x,e.y,player.x,player.y,false);
        if(path2&&path2.length){
          var step2=path2[0];
          if(!enemyAt(step2[0],step2[1])){ e.x=step2[0];e.y=step2[1]; }
        }
      }
    } else if(e.kind==='boss'){
      if(d<=1){
        enemyAttackPlayer(e,1);
      } else {
        var path3=bfs(e.x,e.y,player.x,player.y,false);
        if(path3&&path3.length){
          var step3=path3[0];
          if(!enemyAt(step3[0],step3[1])){ e.x=step3[0];e.y=step3[1]; }
        }
      }
    } else {
      if(d<=1){
        enemyAttackPlayer(e,1);
      } else {
        var path4=bfs(e.x,e.y,player.x,player.y,false);
        if(path4&&path4.length){
          var step4=path4[0];
          if(!enemyAt(step4[0],step4[1])){ e.x=step4[0];e.y=step4[1]; }
        }
      }
    }
    if(e.hp>0&&e.elite&&e.mods&&e.mods.indexOf('regrow')>=0&&e.hp<e.maxHp){
      e.hp=Math.min(e.maxHp,e.hp+Math.max(2,Math.round(e.maxHp*0.05)));
    }
    if(e.hp>0&&e.elite&&e.mods&&e.mods.indexOf('fiery')>=0&&manhattan(e.x,e.y,player.x,player.y)<=1&&chance(0.25)){
      player.burn=Math.max(player.burn,3);
      addLog(e.type+'的灼热气浪燃烧着你！',true);
    }
    if(e.hp>0&&prevHp===e.hp&&d<=2){
      tickEnemyStatus(e);
    } else if(e.hp>0){
      tickEnemyStatus(e);
    }
  }
  tickPlayerStatus();
  inEnemyTurn=false;
}
function adjacentFloor(x,y){
  var dirs=[[1,0],[-1,0],[0,1],[0,-1]];
  var list=[];
  for(var i=0;i<4;i++){
    var nx=x+dirs[i][0],ny=y+dirs[i][1];
    if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H) continue;
    if(grid[ny][nx]===0) list.push([nx,ny]);
  }
  return list.length?pick(list):null;
}
function tickEnemyStatus(e){
  if(e.hp>0&&e.burn>0&&e.poison>0){
    var cd=Math.max(1,Math.round(e.maxHp*0.06));
    e.hp-=cd;
    addFloat(e.x*TILE+TILE/2,e.y*TILE-TILE/2,'-'+cd,'#b66bff',12);
    addLog('腐蚀反应侵蚀着'+e.type+'！',true);
    if(e.hp<=0){ killEnemy(e); return; }
  }
  if(e.burn>0){
    e.burn--;
    var d=Math.max(1,Math.round(e.maxHp*0.1));
    e.hp-=d;
    addFloat(e.x*TILE+TILE/2,e.y*TILE-TILE/2,'-'+d,'#ff6b57',12);
    if(e.hp<=0){ killEnemy(e); return; }
  }
  if(e.poison>0){
    e.poison--;
    var d2=Math.max(1,Math.round(e.maxHp*0.08));
    e.hp-=d2;
    addFloat(e.x*TILE+TILE/2,e.y*TILE-TILE/2,'-'+d2,'#57ff8a',12);
    if(e.hp<=0){ killEnemy(e); }
  }
}
function tickPlayerStatus(){
  var died=false;
  player.mp=Math.min(player.maxMp,player.mp+Math.round(player.maxMp*0.1));
  if(hasEff('blood')&&player.hp<player.maxHp){
    player.hp=Math.min(player.maxHp,player.hp+Math.max(1,Math.round(player.maxHp*0.02)));
  }
  if(player.activeSets&&player.activeSets['tide']>=2&&player.hp<player.maxHp){
    player.hp=Math.min(player.maxHp,player.hp+Math.max(1,Math.round(player.maxHp*0.02)));
  }
  if(player.burn>0){
    player.burn--;
    var d=Math.max(1,Math.round(player.maxHp*0.08));
    player.hp-=d;
    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'-'+d,'#ff6b57',13);
    SFX.hurt();
    onPlayerDamage(d);
    if(player.hp<=0) died=true;
  }
  if(player.poison>0){
    player.poison--;
    var d2=Math.max(1,Math.round(player.maxHp*0.06));
    player.hp-=d2;
    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'-'+d2,'#57ff8a',13);
    SFX.hurt();
    onPlayerDamage(d2);
    if(player.hp<=0) died=true;
  }
  if(player.atkBuffT>0){
    player.atkBuffT--;
    if(player.atkBuffT<=0) player.atkBuff=0;
  }
  if(player.curseT>0) player.curseT--;
  if(player.shadowT>0) player.shadowT--;
  if(player.dodgeT>0) player.dodgeT--;
  if(player.berserkT>0) player.berserkT--;
  if(player.slow>0) player.slow--;
  for(var k in player.cd){
    if(player.cd[k]>0) player.cd[k]--;
  }
  if(!died&&player.hp===1) unlock('hp1');
  if(died) checkPlayerDeath();
}
function checkPlayerDeath(){
  if(player.hp<=0){
    if((player.consum.revive||0)>0){
      player.consum.revive--;
      player.hp=Math.max(1,Math.round(player.maxHp*0.5));
      player.poison=0; player.burn=0; player.curseT=0;
      addLog('替身人偶碎裂，替你挡下了致命一击！',true);
      showToast('替身人偶救了你一命');
      unlock('revive1');
      SFX.levelup();
      recomputeStats();
      return;
    }
    player.hp=0;
    addLog('你倒下了……',true);
    scene='dead';
    stats.playTime=Math.floor((Date.now()-stats.startTime)/1000);
    meta.deathStreak=(meta.deathStreak||0)+1;
    saveMeta();
    saveGame();
    gainEssence();
    renderOverlay('dead');
  }
}
function winGame(){
  if(difficulty==='nightmare') unlock('nightmare_win');
  if((stats.hitsTaken||0)===0) unlock('untouchable');
  scene='win';
  stats.playTime=Math.floor((Date.now()-stats.startTime)/1000);
  meta.deathStreak=0;
  saveMeta();
  saveGame();
  gainEssence();
  renderOverlay('win');
}
function continueEndless(){
  if(scene!=='win') return;
  floor=floor+1;
  if(floor>=15) unlock('endless15');
  genFloor(floor);
  computeFOV();
  scene='play';
  addLog('你拒绝了终局，踏入无尽深渊第 '+floor+' 层！',true);
  hideOverlay();
  updateSidebar();
  render();
}

// ================= 行动流程 =================
function endTurn(){
  computeFOV();
  // 速度属性生效：身法远超常人时，有概率抢先行动（跳过敌人回合，每点+2%，上限20%）
  var _spdAdv=Math.max(0,(player.curSpd||0)-6);
  var _haste=player.hp>0&&_spdAdv>0&&Math.random()<Math.min(0.2,_spdAdv*0.02);
  if(_haste){
    addLog('⚡ 你身形如风，抢得先机，敌人来不及反应！',true);
    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'⚡先手','#ffd857',13);
  } else {
    enemiesAct();
  }
  if(scene!=='play') return;
  var fs=getFloorSteps();
  if(fs>0) player.floorSteps=fs-1;
  if(fs===0){
    var sd=Math.max(5,Math.round(player.maxHp*0.05));
    player.hp-=sd;
    addFloat(player.x*TILE+TILE/2,player.y*TILE-TILE/2,'深渊 -'+sd,'#a55eea',14);
    addLog('深渊吞噬：步数耗尽，生命被剥离 -'+sd+'（快找到楼梯！）',true);
    SFX.trap();
    onPlayerDamage(sd);
    checkPlayerDeath();
  } else if(player.floorSteps===0){
    addLog('警告：本层步数耗尽！深渊开始吞噬你的生命……',true);
  }
  recomputeStats();
  targetPos=null;
  saveGame();
  updateSidebar();
  render();
  if(levelQueue.length&&!pendingPerks.length&&!pendingMastery) startLevelUp();
}
function playerMove(dx,dy){
  if(scene!=='play') return;
  if(overlayEl&&!overlayEl.classList.contains('hide')) return;
  lastDir={x:dx,y:dy};
  var nx=player.x+dx,ny=player.y+dy;
  if(player.freeze>0){
    player.freeze--;
    addLog('你被冻结了，只能原地挣扎……',true);
    endTurn();
    return;
  }
  if(nx<0||ny<0||nx>=MAP_W||ny>=MAP_H){ SFX.bump(); return; }
  var t=grid[ny][nx];
  if(t===1||t===5){ SFX.bump(); return; }
  if(player.slow>0){
    player.slow--;
    addLog('被蛛网缠住，行动迟缓……',true);
    SFX.bump();
    return;
  }
  if(t===6){
    var ld=Math.max(2,Math.round(player.maxHp*0.04));
    player.hp-=ld;
    addFloat(nx*TILE+TILE/2,ny*TILE-TILE/2,'岩浆 -'+ld,'#ff8c42',13);
    addLog('灼热的岩浆灼烧着你！-'+ld,true);
    onPlayerDamage(ld);
    checkPlayerDeath();
  }
  var e=enemyAt(nx,ny);
  if(e){
    playerAttackEnemy(e,1);
    endTurn();
    return;
  }
  if(t===2){
    player.x=nx;player.y=ny;
    descend();
    return;
  }
  if(t===3){
    player.x=nx;player.y=ny;
    openChest(nx,ny);
    endTurn();
    return;
  }
  if(t===4){
    player.x=nx;player.y=ny;
    grid[ny][nx]=0;
    triggerEvent(genEvent());
    return;
  }
  player.x=nx;player.y=ny;
  triggerTrap(nx,ny);
  for(var i=groundItems.length-1;i>=0;i--){
    var it=groundItems[i];
    if(it.x===nx&&it.y===ny){
      pickupItem(it);
      groundItems.splice(i,1);
    }
  }
  endTurn();
}
function moveToTarget(){
  if(!targetPos) return;
  if(targetPos.enemy&&targetPos.enemy.hp>0){
    var d=manhattan(player.x,player.y,targetPos.enemy.x,targetPos.enemy.y);
    if(d<=1){
      playerAttackEnemy(targetPos.enemy,1);
      endTurn();
      return;
    }
  }
  var path=bfs(player.x,player.y,targetPos.x,targetPos.y,false);
  if(path&&path.length){
    var step=path[0];
    var e=enemyAt(step[0],step[1]);
    if(e){
      playerAttackEnemy(e,1);
    } else {
      var t=grid[step[1]][step[0]];
      if(t===2){
        player.x=step[0];player.y=step[1];
        descend();
        return;
      }
      if(t===3){
        player.x=step[0];player.y=step[1];
        openChest(step[0],step[1]);
        endTurn();
        return;
      }
      if(t===4){
        player.x=step[0];player.y=step[1];
        grid[step[1]][step[0]]=0;
        triggerEvent(genEvent());
        return;
      }
      player.x=step[0];player.y=step[1];
      triggerTrap(player.x,player.y);
      for(var i=groundItems.length-1;i>=0;i--){
        var it=groundItems[i];
        if(it.x===player.x&&it.y===player.y){
          pickupItem(it);
          groundItems.splice(i,1);
        }
      }
    }
  }
  endTurn();
}
function waitTurn(){ endTurn(); }
function descend(){
  if(quest&&!quest.done&&!quest.failed){
    if(quest.type==='untouched') completeQuest();
    else {
      var penalty=Math.max(10,Math.round(player.gold*0.05));
      player.gold-=penalty;
      stats.goldEarned=Math.max(0,stats.goldEarned-penalty);
      addLog('契约未完成：奖励丢失，且被深渊夺走 '+penalty+' 金币……',true);
      SFX.deny();
    }
  }
  floor++;
  stats.maxFloor=Math.max(stats.maxFloor,floor);
  SFX.stairs();
  addLog('你走下楼梯，来到第 '+floor+' 层',true);
  player.hp=Math.min(player.maxHp,player.hp+Math.round(player.maxHp*0.15));
  if(floor===2) unlock('first_step');
  if(floor===5) unlock('floor5');
  quest=null;
  player.strT=0;
  genFloor(floor);
  computeFOV();
  recomputeStats();
  saveGame();
  updateSidebar();
  genQuest();
  if(floor>1){ openShop(); }
  else {
    render();
    addLog('第 '+floor+' 层：小心前行',true);
  }
}
function openChest(x,y){
  SFX.open();
  grid[y][x]=0;
  stats.chestsOpened++;
  if(stats.chestsOpened===10) unlock('chest10');
  if(quest&&!quest.failed&&!quest.done&&quest.type==='chest'){
    quest.got++;
    questProgress();
  }
  var chest=null;
  for(var cxi=0;cxi<chests.length;cxi++){ if(chests[cxi].x===x&&chests[cxi].y===y){ chest=chests[cxi]; break; } }
  var cr=Math.random();
  if(cr<0.06&&!chest.golden){
    addLog('宝箱居然是伪装的怪物！',true);
    SFX.boss();
    var mi=spawnEnemy(floor);
    if(mi){
      mi.type='宝箱怪'; mi.emoji='\uD83D\uDCE6'; mi.color='#b8860b';
      mi.maxHp=Math.round(mi.maxHp*1.2); mi.hp=mi.maxHp;
      var mAdj=adjacentFloor(x,y);
      if(mAdj&&!enemyAt(mAdj[0],mAdj[1])){ mi.x=mAdj[0]; mi.y=mAdj[1]; }
      else { mi.x=x; mi.y=y; }
      enemies.push(mi);
      if(manhattan(mi.x,mi.y,player.x,player.y)<=1) enemyAttackPlayer(mi,1);
    }
    checkPlayerDeath();
    return;
  }
  if(cr<0.12&&!chest.golden){
    var td=R(10,18)+Math.round(player.maxHp*0.03);
    player.hp-=td;
    onPlayerDamage(td);
    addFloat(x*TILE+TILE/2,y*TILE+TILE/2,'-'+td,'#ff2d55',15);
    SFX.trap();
    addLog('宝箱居然是陷阱！-'+td,true);
    checkPlayerDeath();
    return;
  }
  var eliteChest=cr>=0.93||chest.golden;
  var gold=R(15,40)*(1+Math.floor(floor/2));
  if(eliteChest) gold=Math.round(gold*2);
  if(player.daily){ var cdm=DAILIES.filter(function(x){ return x.id===player.daily; })[0]; if(cdm&&cdm.chestMul) gold=Math.round(gold*cdm.chestMul); }
  player.gold+=gold;
  stats.goldEarned+=gold;
  if(eliteChest) addLog('金色宝箱！获得 '+gold+' 金币！',true);
  else addLog('打开宝箱，获得 '+gold+' 金币！',true);
  var n=2+Math.floor(floor/3)+(eliteChest?1:0);
  for(var i=0;i<n;i++){
    var it=randomDrop(floor+(eliteChest?1:0));
    if(!applyDrop(it,x,y)){
      groundItems.push({x:x,y:y,item:it});
      addLog('背包已满，装备掉落在了地上',true);
    } else if(it.kind==='potion'){
      addLog('获得药水：'+POTIONS[it.potion].name,true);
    } else if(it.kind==='consum'){
      addLog('获得道具：'+CONSUM[it.consum].name,true);
    } else if(it.kind==='gold'){
      addLog('获得 '+it.amount+' 金币！',true);
    }
  }
  spawnParticles(x*TILE+TILE/2,y*TILE+TILE/2,eliteChest?'#ffb03d':'#ffd857',eliteChest?22:14);
}
function pickupItem(it){
  if(applyDrop(it.item,it.x,it.y)){
    SFX.pickup();
    if(it.item.kind==='potion') addLog('拾取：'+POTIONS[it.item.potion].name,true);
    else if(it.item.kind==='consum') addLog('拾取：'+CONSUM[it.item.consum].name,true);
    else if(it.item.kind==='gold') addLog('拾取 '+it.item.amount+' 金币！',true);
  } else {
    addLog('背包已满，无法拾取',true);
    SFX.deny();
    groundItems.push(it);
  }
  updateSidebar();
}
function equipItem(item){
  var slot=item.slot;
  var key=slot;
  if(slot==='ring'){
    if(!player.gear.ring1) key='ring1';
    else if(!player.gear.ring2) key='ring2';
    else {
      var w1=gearScore(player.gear.ring1),w2=gearScore(player.gear.ring2);
      var cur=w1<=w2?player.gear.ring1:player.gear.ring2;
      if(gearScore(item)<=gearScore(cur)) return false;
      player.bag.push(cur);
      key = (w1<=w2)?'ring1':'ring2';
    }
  } else {
    var cur2=player.gear[key];
    if(cur2) player.bag.push(cur2);
  }
  player.gear[key]=item;
  return true;
}
function tryEquipOrAdd(gear){
  if(player.bag.length>=30){ return false; }
  player.bag.push(gear);
  addLog('放入背包：'+gear.name+'（可在背包中穿戴）',true);
  return true;
}

// ================= 升级与专精 =================
function startLevelUp(){
  if(pendingPerks.length||pendingMastery) return;
  var lv=levelQueue[0];
  if(lv>1&&lv%3===0){
    pendingMastery=MASTERIES[player.cls].slice();
    renderOverlay('mastery');
    return;
  }
  var pool=PERKS.slice();
  var picks=[];
  for(var i=0;i<3&&pool.length;i++){
    var idx=R(0,pool.length-1);
    picks.push(pool[idx]);
    pool.splice(idx,1);
  }
  pendingPerks=picks;
  renderOverlay('levelup');
}
function choosePerk(idx){
  var perk=pendingPerks[idx];
  if(!perk) return;
  perk.apply(player);
  addLog('获得祝福：'+perk.name,true);
  pendingPerks=[];
  levelQueue.shift();
  SFX.levelup();
  hideOverlay();
  recomputeStats();
  updateSidebar();
  render();
  if(levelQueue.length) startLevelUp();
}
function chooseMastery(idx){
  var m=pendingMastery[idx];
  if(!m) return;
  m.apply(player);
  addLog('领悟专精：「'+m.name+'」',true);
  pendingMastery=null;
  levelQueue.shift();
  SFX.levelup();
  hideOverlay();
  recomputeStats();
  updateSidebar();
  render();
  if(levelQueue.length) startLevelUp();
}

// ================= 契约任务 =================
function genQuest(){
  quest=null;
  var r=Math.random();
  if(r<0.4){
    var types=Object.keys(ENEMY_TYPES).filter(function(k){ return floor>=ENEMY_TYPES[k].minF; });
    var t=types.length?pick(types):null;
    if(t) quest={type:'hunt',target:t,need:R(3,5),got:0,done:false,failed:false};
  } else if(r<0.7){
    quest={type:'chest',target:null,need:R(2,3),got:0,done:false,failed:false};
  } else {
    quest={type:'untouched',target:null,need:0,got:0,done:false,failed:false};
  }
  updateQuestBar();
}
function questProgress(){
  if(!quest||quest.failed||quest.done) return;
  if(quest.type==='hunt'&&quest.got>=quest.need) completeQuest();
  if(quest.type==='chest'&&quest.got>=quest.need) completeQuest();
  updateQuestBar();
}
function completeQuest(){
  if(!quest||quest.done) return;
  quest.done=true;
  var g=100+floor*20;
  player.gold+=g; stats.goldEarned+=g; stats.questsDone++;
  if(stats.questsDone===3) unlock('quest3');
  SFX.quest();
  addLog('契约完成！获得 '+g+' 金币',true);
  if(chance(0.3)){
    var it=randomDrop(floor);
    if(it.kind==='gear'){ tryEquipOrAdd(it.gear); }
    else if(it.kind==='potion'){ player.potions[it.potion]=(player.potions[it.potion]||0)+1; }
    else if(it.kind==='consum'){ player.consum[it.consum]=(player.consum[it.consum]||0)+1; }
    else { player.gold+=it.amount; stats.goldEarned+=it.amount; }
  }
  showToast('契约完成 +'+g+' 金币');
  updateQuestBar();
}
function updateQuestBar(){
  var el=document.getElementById('questBar');
  if(!quest||scene!=='play'){ el.innerHTML=''; return; }
  var txt='📜 ';
  if(quest.type==='hunt') txt='契约：猎杀 '+ENEMY_TYPES[quest.target].name+'（'+quest.got+'/'+quest.need+'）';
  else if(quest.type==='chest') txt='契约：开启宝箱（'+quest.got+'/'+quest.need+'）';
  else txt='契约：本层不受伤害';
  var cls=quest.done?'done':(quest.failed?'fail':'');
  el.innerHTML='<div class="qpill '+cls+'" id="qpill">'+txt+'</div>';
  var pill=el.querySelector('.qpill');
  if(pill) bindTip(pill,questTipHtml);
}

var shopOffers=[];
function openShop(refresh){
  shopOffers=[];
  var items=[];
  var potPicks=['heal','mana','str','insight'];
  while(potPicks.length>4) potPicks.pop();
  var pots=['heal','mana','str','insight','antidote','berserk','scroll','bomb','revive'];
  var shown=[];
  while(shown.length<4){
    var pp=pick(pots);
    if(shown.indexOf(pp)>=0) continue;
    shown.push(pp);
  }
  for(var i=0;i<shown.length;i++){
    var pid=shown[i];
    var price = POTIONS[pid]?POTIONS[pid].price:CONSUM[pid].price;
    items.push({kind:'potion',potion:pid,price:price});
  }
  var g1=genGear('weapon',floor), g2=genGear('armor',floor), g3=genGear('ring',floor);
  items.push({kind:'gear',gear:g1,price:60+floor*15});
  items.push({kind:'gear',gear:g2,price:60+floor*15});
  items.push({kind:'gear',gear:g3,price:80+floor*20});
  items.push({kind:'gamble',price:60});
  shopOffers=items;
  renderOverlay('shop');
}
function synthesizePotion(which){
  if(which==='mana'){
    if(player.potions.mana<3){ addLog('魔法药水不足3个',true); SFX.deny(); return; }
    player.potions.mana-=3;
    player.potions.str=(player.potions.str||0)+1;
    unlock('alchemist');
    SFX.potion();
    addLog('炼金成功：力量药水 +1！',true);
    renderOverlay('shop');
    updateSidebar();
    return;
  }
  if(player.potions.heal<3){ addLog('治疗药水不足3个',true); SFX.deny(); return; }
  player.potions.heal-=3;
  player.potions.elixir=(player.potions.elixir||0)+1;
  unlock('alchemist');
  SFX.potion();
  addLog('炼金成功：圣灵药剂 +1！',true);
  renderOverlay('shop');
  updateSidebar();
}
function enchantWeapon(elem){
  var w=player.gear.weapon;
  if(!w){ addLog('需要先装备武器',true); SFX.deny(); return; }
  if(player.gold<50){ addLog('金币不足（50💰）',true); SFX.deny(); return; }
  player.gold-=50;
  w.elem=elem;
  SFX.levelup();
  addLog('武器已附魔：'+ELEMENTS[elem].icon+' '+ELEMENTS[elem].name+'元素伤害！',true);
  recomputeStats();
  renderOverlay('shop');
  updateSidebar();
}
function buyShop(idx){
  var it=shopOffers[idx];
  if(!it) return;
  if(player.gold<it.price){ addLog('金币不足！',true); SFX.deny(); return; }
  if(it.kind==='gamble'){
    player.gold-=it.price;
    var r=Math.random();
    var slot=pick(['weapon','armor','ring']);
    var gear;
    if(r<0.5) gear=genGear(slot,floor);
    else if(r<0.8) gear=genGear(slot,floor+2);
    else gear=genGear(slot,floor+4);
    SFX.coin();
    if(tryEquipOrAdd(gear)){ addLog('赌博开出：'+gear.name+'！',true); }
    else { player.gold+=sellPrice(gear); addLog('背包已满，装备被回收为 '+sellPrice(gear)+' 金币',true); SFX.coin(); }
    renderOverlay('shop');
    updateSidebar();
    return;
  }
  player.gold-=it.price;
  SFX.coin();
  if(it.kind==='potion'){
    if(POTIONS[it.potion]) player.potions[it.potion]=(player.potions[it.potion]||0)+1;
    else player.consum[it.potion]=(player.consum[it.potion]||0)+1;
  } else {
    tryEquipOrAdd(it.gear);
  }
  renderOverlay('shop');
  updateSidebar();
}
function smithCost(slot){
  var it=player.gear[slot];
  if(!it) return -1;
  var lvl=it.upgrade||0;
  if(lvl>=5) return -2;
  return 80+60*lvl;
}
function buySmith(slot){
  var it=player.gear[slot];
  if(!it){ addLog('没有装备该部位',true); SFX.deny(); return; }
  var cost=smithCost(slot);
  if(cost<0){ addLog('无法强化',true); SFX.deny(); return; }
  if(player.gold<cost){ addLog('金币不足！',true); SFX.deny(); return; }
  player.gold-=cost;
  it.upgrade=(it.upgrade||0)+1;
  if(it.upgrade===3) unlock('smith3');
  SFX.smith();
  addLog('强化成功！'+it.name+' → +'+it.upgrade,true);
  recomputeStats();
  updateSidebar();
  renderOverlay('shop');
}
function leaveShop(){
  hideOverlay();
  scene='play';
  render();
}

// ================= 属性计算 =================
function recomputeStats(){
  if(!player) return;
  var g=player.gear;
  var growth=player.growth||{atk:0,def:0,spd:0,crit:0,critDmg:0,maxHp:0,maxMp:0};
  var bonus={atk:0,def:0,hp:0,spd:0,crit:0,critDmg:0,lifesteal:0,thorns:0,mp:0,block:0};
  for(var k in g){
    var it=g[k];
    if(!it) continue;
    var up=1+0.12*((it.upgrade||0));
    bonus.atk+=(it.atk||0)*up;
    bonus.def+=(it.def||0)*up;
    bonus.hp+=(it.hp||0)*up;
    bonus.spd+=(it.spd||0)*up;
    bonus.crit+=(it.crit||0);
    bonus.critDmg+=(it.critDmg||0);
    bonus.lifesteal+=(it.lifesteal||0);
    bonus.thorns+=(it.thorns||0);
    bonus.mp+=(it.mp||0);
    bonus.block+=(it.block||0);
  }
  var cls=CLASSES[player.cls];
  var mod=player.modifier?MODIFIERS.filter(function(x){ return x.id===player.modifier; })[0]:null;
  var maxHpFull=cls.hp+bonus.hp+growth.maxHp;
  if(mod&&mod.hpMul) maxHpFull=Math.round(maxHpFull*mod.hpMul);
  var daily0=player.daily?DAILIES.filter(function(x){ return x.id===player.daily; })[0]:null;
  if(daily0&&daily0.hpMul) maxHpFull=Math.round(maxHpFull*daily0.hpMul);
  var strMul=player.strT>0?1.3:1;
  var curseMul=player.curseT>0?0.85:1;
  var atkBuffMul=player.atkBuffT>0?(1+player.atkBuff):1;
  var berserkMul=player.berserkT>0?1.5:1;
  var berserkDef=player.berserkT>0?0.7:1;
  var modAtk=(mod&&mod.atkMul)?mod.atkMul:1;
  var laststand=player.m.laststand&&player.hp<maxHpFull*0.3?1.4:1;
  var setCounts={},setTiers={};
  for(var sk2 in g){
    var sit=g[sk2];
    if(sit&&sit.set) setCounts[sit.set]=(setCounts[sit.set]||0)+1;
  }
  for(var sc in setCounts){
    if(setCounts[sc]>=4) setTiers[sc]=4;
    else if(setCounts[sc]>=2) setTiers[sc]=2;
  }
  player.activeSets=setTiers;
  var setAtk=1,setCritDmg=0,setSpd=0,setCrit=0;
  for(var s2 in setTiers){
    if(s2==='ember'&&setTiers[s2]>=2){ setAtk*=1.1; setCritDmg+=20; }
    if(s2==='void'&&setTiers[s2]>=2){ setSpd+=2; setCrit+=5; }
  }
  player.curAtk=Math.round((cls.atk+bonus.atk+growth.atk)*strMul*curseMul*atkBuffMul*berserkMul*laststand*modAtk*setAtk);
  player.curDef=Math.round((cls.def+bonus.def+growth.def)*berserkDef);
  player.curMaxHp=Math.round(maxHpFull);
  player.curMaxMp=cls.mp+bonus.mp+growth.maxMp;
  player.curCrit=cls.crit+bonus.crit+growth.crit+setCrit;
  player.curCritDmg=cls.critDmg+bonus.critDmg+growth.critDmg+setCritDmg;
  player.curSpd=cls.spd+bonus.spd+growth.spd+(mod&&mod.spdBonus?mod.spdBonus:0)+setSpd;
  player.lifesteal=bonus.lifesteal;
  player.thorns=bonus.thorns;
  player.blockChance=Math.min(40,Math.round(player.curDef*0.4+bonus.block+(player.blockBonus||0)));
  player.dodgeChance=Math.min(95,(player.dodgeT>0?90:0)+(player.dodgeBonus||0)+(mod&&mod.dodgeBonus?mod.dodgeBonus:0));
  player.skillMult=1+(player.m.arcaneflow?0.25:0)+(hasEff('potent')?0.1:0);
  player.maxHp=player.curMaxHp;
  player.maxMp=player.curMaxMp;
  player.hp=Math.min(player.hp,player.maxHp);
  player.mp=Math.min(player.mp,player.maxMp);
  if(g.weapon&&g.armor&&(g.ring1||g.ring2)) unlock('fullset');
}
