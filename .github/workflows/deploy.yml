name: Deploy to Alibaba Cloud

on:
  push:
    branches: [ main ]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v5

    - name: Pack site
      run: |
        git archive --format=tar.gz -o site.tar.gz HEAD
        ls -la site.tar.gz

    - name: Upload tarball
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        source: site.tar.gz
        target: /tmp
        strip_components: 0

    - name: Replace site files
      uses: appleboy/ssh-action@v1
      with:
        host: ${{ secrets.REMOTE_HOST }}
        username: ${{ secrets.REMOTE_USER }}
        key: ${{ secrets.SSH_PRIVATE_KEY }}
        script: |
          set -e
          # 双保险：路径为空或目标不是站点目录（无 index.html）一律终止，绝不清理
          DEPLOY_PATH="${{ secrets.DEPLOY_PATH }}"
          [ -n "$DEPLOY_PATH" ] || { echo "DEPLOY_PATH is empty, abort"; exit 1; }
          cd "$DEPLOY_PATH"
          [ -f index.html ] || { echo "target check failed (no index.html), abort"; exit 1; }
          # 备份当前站点（保留最近3份），误删可回滚
          BACKUP_DIR="/tmp/apps_site_backup"
          mkdir -p "$BACKUP_DIR"
          tar -czf "$BACKUP_DIR/site-$(date +%Y%m%d-%H%M%S).tar.gz" ./
          ls -1t "$BACKUP_DIR"/site-*.tar.gz | tail -n +4 | xargs -r rm -f
          find . -mindepth 1 -maxdepth 1 ! -name '.' -exec rm -rf {} +
          tar -xzf /tmp/site.tar.gz
          rm -f /tmp/site.tar.gz
          echo "Deploy OK (backup at $BACKUP_DIR)"
