name: 热点聚合数据更新

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: news-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: 抓取热点数据
        run: python scripts/fetch_news.py

      - name: 提交并推送
        run: |
          if [ -n "$(git status --porcelain news_data.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add news_data.json
            git commit -m "更新热点聚合数据"
            git push
          else
            echo "无数据变化，跳过提交"
          fi
