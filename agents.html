<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体</title>
<style>
:root{
  --bg:#f5f1e6; --card:#fffdf7; --text:#33302b; --text2:#8a857d; --line:#e2d9c6;
  --accent:#3d5a70; --accent-soft:#e8eef2; --seal:#a03a2e; --gold:#b98a44;
  --user:#3d5a70; --code-bg:#efe9db; --danger:#a03a2e; --ok:#6b7f4f;
  --radius:8px; --radius-sm:6px;
  --serif:"Songti SC","STSong","SimSun",serif;
}
[data-theme="dark"]{
  --bg:#1e1c19; --card:#2a2723; --text:#e6dfd2; --text2:#a39a88; --line:#3a362f;
  --accent:#c9a45c; --accent-soft:#2c2a24; --seal:#b04a3c; --gold:#c9a45c;
  --user:#3d5a70; --code-bg:#26231e; --danger:#c96a5e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;height:100dvh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:3px}
.header-actions{display:flex;gap:8px}
.icon-btn{height:32px;padding:0 12px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--bg);border:1px solid var(--line);transition:.15s;color:var(--text2)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.layout{display:flex;height:calc(100vh - 56px);height:calc(100dvh - 56px)}
.sidebar{width:264px;min-width:264px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;gap:12px}
.backdrop{position:fixed;inset:0;top:56px;background:rgba(30,28,22,.35);z-index:40;display:none}
.backdrop.show{display:block}
.sidebar-actions{display:flex;gap:8px}
.sidebar-actions button{flex:1;height:36px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn-new{background:var(--seal);color:#fdf6e8}
.btn-new:hover{filter:brightness(1.08)}
.sidebar-search{padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px}
.sidebar-search input{border:none;background:none;padding:0;font-size:13px}
.sidebar-search input:focus{outline:none}
.agent-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.agent-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:.12s;border:1px solid transparent;position:relative}
.agent-item:hover{background:var(--bg)}
.agent-item.active{background:var(--accent-soft);border-color:var(--line)}
.agent-item.active::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;background:var(--seal);border-radius:2px}
.agent-avatar{width:38px;height:38px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-family:var(--serif);font-weight:700;color:#fdf6e8}
.agent-meta{flex:1;min-width:0}
.agent-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-desc{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.agent-item .del{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:5px;display:none;align-items:center;justify-content:center;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--danger)}
.agent-item:hover .del{display:flex}
.agent-item:hover .del:hover{background:var(--danger);color:#fff}
.sidebar-empty{text-align:center;color:var(--text2);font-size:12.5px;padding:24px 8px;line-height:1.8}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.chat-head{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
#menuBtn{display:none}
.chat-head .head-meta{min-width:0}
.chat-head .name{font-size:15.5px;font-weight:700;font-family:var(--serif);letter-spacing:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chat-head .sub{font-size:12px;color:var(--text2);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.chat-head .spacer{flex:1}
.chat-head .mini-btn{height:32px;padding:0 12px;border-radius:var(--radius-sm);font-size:12.5px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;gap:5px;color:var(--text2)}
.chat-head .mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.messages{flex:1;overflow-y:auto;padding:24px 20px 10px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth;position:relative}
.scrubber{position:absolute;top:10px;right:3px;bottom:10px;width:16px;display:none;z-index:5}
.scrubber.show{display:block}
.scrub-tick{position:absolute;left:50%;transform:translate(-50%,-50%);width:10px;height:10px;border-radius:50%;background:var(--accent-soft);border:2px solid var(--accent);cursor:pointer;transition:background .12s,border-color .12s,transform .12s}
.scrub-tick:hover{border-color:var(--seal);background:var(--seal);transform:translate(-50%,-50%) scale(1.3)}
.scrub-tick.active{border-color:var(--accent);background:var(--accent);transform:translate(-50%,-50%) scale(1.2)}
.msg{display:flex;gap:12px;max-width:840px;margin:0 auto;width:100%}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:36px;height:36px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px;font-family:var(--serif);font-weight:700}
.msg-body{max-width:78%;min-width:0}
.msg.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;font-size:14.5px;line-height:1.75;word-break:break-word}
.msg.user .bubble{background:var(--user);color:#f2f5f7;border:none;border-bottom-right-radius:3px}
.msg.ai .bubble{border-bottom-left-radius:3px}
.bubble pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.6;margin:8px 0;font-family:Consolas,"Courier New",monospace}
.bubble code{background:var(--code-bg);border-radius:4px;padding:2px 6px;font-size:13px;font-family:Consolas,"Courier New",monospace}
.bubble pre code{background:none;padding:0}
.bubble p{margin:6px 0}
.bubble h1,.bubble h2,.bubble h3{margin:10px 0 6px;font-family:var(--serif)}
.bubble ul,.bubble ol{margin:6px 0;padding-left:22px}
.bubble a{color:var(--accent);text-decoration:none}
.bubble a:hover{text-decoration:underline}
.bubble blockquote{border-left:3px solid var(--gold);padding:2px 12px;color:var(--text2);margin:8px 0;background:var(--bg);border-radius:0 4px 4px 0}
.msg-time{font-size:11px;color:var(--text2);margin-top:5px}
.thinking{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--text2);margin-bottom:8px;line-height:1.7}
.thinking summary{cursor:pointer;font-weight:600;color:var(--text2);user-select:none}
.thinking .think-inner{white-space:pre-wrap;margin-top:6px;max-height:220px;overflow-y:auto;opacity:.85}
.typing-cursor{display:inline-block;width:7px;height:15px;background:var(--seal);border-radius:1px;animation:blink 1s infinite;vertical-align:-2px;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.msg-actions{display:flex;gap:6px;margin-top:6px;opacity:0;transition:.15s}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{font-size:11.5px;color:var(--text2);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:3px 9px}
.msg-actions button:hover{color:var(--accent);border-color:var(--accent)}
.msg-actions button.speaking{color:var(--accent);border-color:var(--accent);background:var(--accent-soft)}
.welcome{max-width:840px;margin:0 auto;width:100%;padding:30px 0 10px}
.welcome .hello{font-size:25px;font-weight:700;font-family:var(--serif);letter-spacing:1px;color:var(--text)}
.welcome .hint{color:var(--text2);font-size:14px;margin-top:10px;line-height:1.8}
.questions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.q-chip{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 18px;font-size:13.5px;color:var(--text);transition:.15s;text-align:left;line-height:1.5}
.q-chip:hover{border-color:var(--gold);color:var(--seal)}
.input-wrap{border-top:1px solid var(--line);background:var(--card);padding:14px 20px 18px}
.input-box{max-width:840px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;transition:.15s;position:relative}
.input-box:focus-within{border-color:var(--gold)}
.input-box textarea{border:none;background:none;resize:none;padding:4px 0;max-height:160px;font-size:14.5px;line-height:1.6}
.input-box textarea:focus{outline:none}
.input-bar{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin-top:4px}
.input-hint{flex:1;min-width:0;font-size:11.5px;color:var(--text2);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding-bottom:10px}
.attach-btn{height:38px;width:38px;border-radius:var(--radius-sm);background:var(--bg);border:1px solid var(--line);color:var(--text2);font-size:19px;line-height:1;display:flex;align-items:center;justify-content:center;flex-shrink:0;transition:.15s}
.attach-btn:hover{border-color:var(--gold);color:var(--seal)}
.attach-list{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.attach-item{position:relative;display:flex;align-items:center;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:4px 6px;font-size:12px;max-width:200px}
.attach-item img{width:44px;height:44px;object-fit:cover;border-radius:4px}
.attach-item .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:110px;color:var(--text2)}
.attach-item .x{position:absolute;top:-7px;right:-7px;width:18px;height:18px;border-radius:50%;background:var(--text2);color:var(--card);font-size:11px;display:flex;align-items:center;justify-content:center;cursor:pointer}
.msg-files{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.msg-file{display:flex;align-items:center;gap:6px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:5px 8px;font-size:12px;color:var(--text2);max-width:220px}
.msg-file img{width:44px;height:44px;object-fit:cover;border-radius:4px}
.msg-file .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.msg.user .msg-files{justify-content:flex-end}
.attach-item .vid,.msg-file .vid{width:44px;height:44px;flex-shrink:0;display:flex;align-items:center;justify-content:center;background:var(--accent-soft);color:var(--accent);border-radius:4px;font-size:14px}
.send-btn{height:38px;min-width:76px;padding:0 18px;border-radius:var(--radius-sm);background:var(--seal);color:#fdf6e8;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;letter-spacing:2px}
.send-btn:hover{filter:brightness(1.08)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.stop-btn{background:var(--text2)}
.overlay{position:fixed;inset:0;background:rgba(30,28,22,.5);z-index:100;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:10px;box-shadow:0 12px 40px rgba(30,28,22,.18);border:1px solid var(--line);width:min(560px,94vw);max-height:90vh;display:flex;flex-direction:column;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px;font-family:var(--serif);letter-spacing:2px}
.modal-close{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2)}
.modal-close:hover{background:var(--bg);color:var(--danger)}
.modal-body{padding:16px 22px 14px;overflow-y:auto}
.modal-foot{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.field .tip{font-size:11.5px;color:var(--text2);margin-top:4px;line-height:1.6}
.avatar-row{display:flex;align-items:center;gap:12px}
.avatar-preview{width:52px;height:52px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:22px;font-family:var(--serif);font-weight:700;color:#fdf6e8}
.avatar-input{flex:1}
.color-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.12s}
.color-dot:hover{transform:scale(1.12)}
.color-dot.sel{border-color:var(--text)}
.q-list{display:flex;flex-direction:column;gap:8px}
.q-row{display:flex;gap:8px;align-items:center}
.q-row input{flex:1}
.q-row .rm{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.q-row .rm:hover{background:var(--bg);color:var(--danger)}
.btn-add{height:34px;border-radius:var(--radius-sm);border:1px dashed var(--line);color:var(--accent);font-size:13px;width:100%;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-add:hover{border-color:var(--accent);background:var(--accent-soft)}
.model-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:8px}
.mchip{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);border:1px solid var(--line);border-radius:4px;padding:5px 9px;font-size:12.5px;color:var(--text)}
.mchip .tag{font-size:10.5px;color:var(--seal);font-weight:700}
.mchip .x{cursor:pointer;color:var(--text2);font-size:14px;line-height:1}
.mchip .x:hover{color:var(--danger)}
.model-add{display:flex;gap:8px}
.model-add input{flex:1;min-width:0}
.btn-add-mini{flex-shrink:0;height:38px;padding:0 14px;border-radius:var(--radius-sm);background:var(--accent-soft);border:1px solid var(--line);color:var(--accent);font-size:13px;font-weight:600}
.btn-add-mini:hover{border-color:var(--accent)}
.btn-primary{background:var(--seal);color:#fdf6e8;height:38px;padding:0 22px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;letter-spacing:2px}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--text);height:38px;padding:0 20px;border-radius:var(--radius-sm);font-size:14px}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:var(--radius-sm);font-size:13.5px;z-index:300;opacity:0;transition:.25s;pointer-events:none;max-width:80vw;text-align:center;line-height:1.6}
.toast.show{opacity:1}
.toast.err{background:var(--danger);color:#fff}
.settings-note{font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;line-height:1.7;margin-bottom:14px}
.chip-group{display:flex;gap:8px;flex-wrap:wrap}
.chip-group button{height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--line);font-size:12.5px;color:var(--text2);background:var(--card);transition:.12s}
.chip-group button.sel{border-color:var(--seal);color:var(--seal);background:var(--accent-soft);font-weight:600}
.provider-preset{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.provider-preset button{font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:4px}
.provider-preset button:hover{filter:brightness(1.1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){
  #menuBtn{display:flex}
  .sidebar{position:absolute;left:0;top:56px;bottom:0;width:min(264px,84vw);z-index:50;transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:none;box-shadow:0 8px 30px rgba(30,28,22,.25)}
  .agent-item{padding-right:32px}
  .agent-item .del{display:flex}
  .msg-body{max-width:88%}
  .msg-avatar{width:30px;height:30px;font-size:12.5px}
  .bubble{padding:10px 12px;font-size:14px}
  .msg{gap:8px}
  .msg-actions{opacity:1}
  .messages{padding:14px 12px 10px}
  .input-wrap{padding:10px 12px calc(12px + env(safe-area-inset-bottom))}
  .chat-head{padding:0 10px;gap:8px}
  .chat-head .mini-btn{padding:0 9px;font-size:12px}
  .chat-head .sub{max-width:44vw}
  .header{padding:0 12px}
  .brand{font-size:16px;letter-spacing:2px}
  .icon-btn{padding:0 10px;font-size:12px}
  input,textarea,select{font-size:16px}
  .welcome .hello{font-size:21px}
  .welcome .hint{font-size:13.5px}
  .q-chip{font-size:13px;padding:9px 12px}
  .modal-head{padding:14px 14px 10px}
  .modal-body{padding:14px 14px 10px}
  .modal-foot{padding:12px 14px calc(14px + env(safe-area-inset-bottom));flex-wrap:wrap;gap:8px}
  .modal-foot button{flex:1}
  .modal-foot .left-group{flex-basis:100%}
  .scrubber{right:2px}
  .toast{top:64px;font-size:13px}
  .row2{grid-template-columns:1fr}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand"><span>智能体</span></div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" title="切换主题">深色</button>
    <button class="icon-btn" id="settingsBtn" title="模型设置">设置</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-actions">
      <button class="btn-new" id="newAgentBtn">新建智能体</button>
    </div>
    <div class="sidebar-search"><input id="searchInput" type="search" placeholder="搜索智能体" autocomplete="off"></div>
    <div class="agent-list" id="agentList"></div>
    <div class="sidebar-empty" id="sidebarEmpty" style="display:none">还没有智能体<br>点击上方按钮创建</div>
  </aside>

  <main class="main" id="main">
    <div class="chat-head" id="chatHead" style="display:none">
      <button class="mini-btn" id="menuBtn" title="智能体列表">☰</button>
      <div class="agent-avatar" id="headAvatar">智</div>
      <div class="head-meta">
        <div class="name" id="headName">智能体</div>
        <div class="sub" id="headModel">模型未配置</div>
      </div>
      <div class="spacer"></div>
      <button class="mini-btn" id="editBtn">编辑</button>
      <button class="mini-btn" id="clearBtn">清空对话</button>
    </div>
    <div class="messages" id="messages"></div>
    <div class="input-wrap">
      <div class="input-box">
        <div class="attach-list" id="attachList"></div>
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="input-bar">
          <button class="attach-btn" id="attachBtn" title="上传图片或文件">＋</button>
          <div class="input-hint">支持图片、文本文件，视频（需豆包视觉模型或支持视频的接口）</div>
          <button class="send-btn" id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="backdrop" id="backdrop"></div>
<input type="file" id="attachFile" accept="image/*,video/mp4,video/quicktime,video/x-msvideo,video/x-matroska,video/x-ms-wmv,.pdf,.doc,.docx,.txt,.md,.csv,.json,.xlsx,.xls,.pptx,.ppt,.log,.js,.py,.html,.css,.xml,.yml,.yaml" multiple style="display:none">

<div class="overlay" id="editOverlay">
  <div class="modal">
    <div class="modal-head">

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const deepcopy=o=>JSON.parse(JSON.stringify(o));
const COLORS=["#3d5a70","#a03a2e","#6b7f4f","#b98a44","#4a4a4a","#7c5c8c","#2f6d5e","#8a5a3a"];
function mkProvider(){return {apiKey:"",baseURL:"",model:"",models:[],temperature:0.8};}

let state={
  agents:[],
  currentId:null,
  settings:{providers:{deepseek:mkProvider(),doubao:mkProvider(),ollama:mkProvider(),custom:mkProvider()},activeProvider:"deepseek"},
  search:"",
  editing:null,
  generating:false,
  abort:null,
  pendingFiles:[],
  convCache:{}
};
let stickToBottom=true;

const EMOJI_RE=/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{2B00}-\u{2BFF}\u{FE0F}\u{1F1E6}-\u{1F1FF}]/gu;
function stripEmoji(s){return String(s||"").replace(EMOJI_RE,"").trim();}
function normalizeSettings(s){
  const out={providers:{},activeProvider:(s&&s.activeProvider)||"deepseek"};
  for(const p of ["deepseek","doubao","ollama","custom"]){
    out.providers[p]={apiKey:"",baseURL:"",model:"",models:[],temperature:0.8};
    if(s&&s.providers&&s.providers[p])Object.assign(out.providers[p],s.providers[p]);
    if(!Array.isArray(out.providers[p].models)){
      out.providers[p].models=out.providers[p].model?[out.providers[p].model]:[];
    }
  }
  if(!out.providers[out.activeProvider])out.activeProvider="deepseek";
  return out;
}
function persistSettings(){localStorage.setItem("agentwork_settings",JSON.stringify(state.settings));}
function load(){
  try{state.agents=JSON.parse(localStorage.getItem("agentwork_agents")||"[]");}catch(e){state.agents=[];}
  try{Object.assign(state.settings,JSON.parse(localStorage.getItem("agentwork_settings")||"{}"));}catch(e){}
  if(!Array.isArray(state.agents))state.agents=[];
  if(!state.settings.providers||!state.settings.providers.deepseek){
    const old=state.settings;
    const p=(old&&old.provider)||"deepseek";
    state.settings={providers:{deepseek:mkProvider(),doubao:mkProvider(),ollama:mkProvider(),custom:mkProvider()},activeProvider:p};
    if(old&&typeof old==="object"){
      state.settings.providers[p].apiKey=old.apiKey||"";
      state.settings.providers[p].baseURL=old.baseURL||"";
      state.settings.providers[p].model=old.model||"";
      state.settings.providers[p].temperature=old.temperature!=null?old.temperature:0.8;
      state.settings.providers[p].models=old.model?[old.model]:[];
    }
    persistSettings();
  }else{
    state.settings=normalizeSettings(state.settings);
  }
  let dirty=false;
  for(const a of state.agents){
    const cleaned={avatar:stripEmoji(a.avatar),greeting:stripEmoji(a.greeting),persona:stripEmoji(a.persona)};
    if(a.avatar!==cleaned.avatar||a.greeting!==cleaned.greeting||a.persona!==cleaned.persona)dirty=true;
    a.avatar=cleaned.avatar||a.name.slice(0,1)||"智";
    a.greeting=cleaned.greeting;
    a.persona=cleaned.persona;
    if(a.questions)a.questions=a.questions.map(stripEmoji).filter(Boolean);
    if(a.kb)delete a.kb;
    if(a.builtin&&(a.persona==="你是一个知识渊博、耐心友善的万能助理。回答准确、条理清晰，中文交流，语气自然亲切。遇到不确定的事情会坦诚说明。"||a.greeting==="你好，我是万能助手。写作、学习、生活、编程都能帮上忙，今天想聊点什么？")){
      a.persona="";a.greeting="";a.questions=[];
      dirty=true;
    }
  }
  if(dirty)save();
  if(!state.agents.length){
    state.agents.push({id:uid(),name:"万能助手",avatar:"智",color:"#3d5a70",persona:"",greeting:"",questions:[],model:"",createdAt:Date.now(),builtin:true});
    save();
  }
  state.currentId=state.agents[0].id;
}
function save(){localStorage.setItem("agentwork_agents",JSON.stringify(state.agents));}
function getAgent(id){return state.agents.find(a=>a.id===id)||null;}
function currentAgent(){return getAgent(state.currentId);}
const DB_NAME="agentwork",DB_STORE="convs";
let dbPromise=null;
function openDb(){
  if(dbPromise)return dbPromise;
  dbPromise=new Promise((res,rej)=>{
    const r=indexedDB.open(DB_NAME,1);
    r.onupgradeneeded=()=>r.result.createObjectStore(DB_STORE,{keyPath:"id"});
    r.onsuccess=()=>res(r.result);
    r.onerror=()=>rej(r.error);
  });
  return dbPromise;
}
function dbReq(mode,fn){
  return openDb().then(d=>new Promise((res,rej)=>{
    const t=d.transaction(DB_STORE,mode);
    const rq=fn(t.objectStore(DB_STORE));
    if(rq){
      rq.onsuccess=()=>res(rq.result);
      rq.onerror=()=>rej(rq.error);
    }else{
      t.oncomplete=()=>res(null);
    }
    t.onerror=()=>rej(t.error);
  }));
}
function dbPut(c){dbReq("readwrite",s=>s.put(c)).catch(()=>toast("对话保存失败：存储空间不足，请减少大附件",true));}
function dbDel(id){dbReq("readwrite",s=>s.delete(id)).catch(()=>{});}
function dbGet(id){return dbReq("readonly",s=>s.get(id)).catch(()=>null);}
function dbAll(){return dbReq("readonly",s=>s.getAll()).catch(()=>[]);}
function dbClear(){return dbReq("readwrite",s=>s.clear()).catch(()=>{});}
function getConv(id){
  if(state.convCache[id])return state.convCache[id];
  let c=null;
  try{c=JSON.parse(localStorage.getItem("agentwork_conv_"+id)||"null");}catch(e){c=null;}
  if(!c)c={id,messages:[]};
  state.convCache[id]=c;
  dbPut(c);
  localStorage.removeItem("agentwork_conv_"+id);
  return c;
}
async function getConvAsync(id){
  if(state.convCache[id])return state.convCache[id];
  const c=await dbGet(id);
  if(c){state.convCache[id]=c;return c;}
  return getConv(id);
}
function saveConv(c){
  state.convCache[c.id]=c;
  dbPut(c);
}
function delConv(id){
  delete state.convCache[id];
  dbDel(id);
  localStorage.removeItem("agentwork_conv_"+id);
}
async function preloadConvs(){
  try{
    for(const c of await dbAll())state.convCache[c.id]=c;
  }catch(e){}
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf("agentwork_conv_")===0)keys.push(k);
  }
  for(const k of keys){
    const id=k.slice("agentwork_conv_".length);
    if(!state.convCache[id]){
      try{state.convCache[id]=JSON.parse(localStorage.getItem(k)||"null");}catch(e){}
      if(!state.convCache[id])state.convCache[id]={id,messages:[]};
      dbPut(state.convCache[id]);
    }
    localStorage.removeItem(k);
  }
}

const PROVIDERS={
  deepseek:{label:"DeepSeek",base:"https://api.deepseek.com/v1",model:"deepseek-v4-flash",models:["deepseek-v4-flash","deepseek-v4-pro"],tip:"deepseek-v4-flash（快速，推荐）/ deepseek-v4-pro（更强）。"},
  doubao:{label:"豆包/火山方舟",base:"https://ark.cn-beijing.volces.com/api/v3",model:"",models:[],tip:"model 填火山方舟的「推理接入点 ID」（ep- 开头）或模型 ID，需先在方舟控制台创建接入点并完成实名认证。"},
  ollama:{label:"Ollama 本地",base:"http://localhost:11434/v1",model:"",models:[],tip:"需先启动 Ollama 并拉取模型（ollama pull 模型名），模型 ID 填已拉取的模型名。"},
  custom:{label:"自定义接口",base:"https://",model:"",models:[],tip:"任意 OpenAI 兼容的 Chat Completions 接口：Base URL 填到 /v1 即可，会自动拼 /chat/completions。"}
};

function chatUrl(base){
  let b=String(base||"").trim().replace(/\/+$/,"");
  if(!b)return "";
  if(b.endsWith("/chat/completions"))return b;
  return b+"/chat/completions";
}

function toApiContent(m){
  const text=Array.isArray(m.content)?"":String(m.text||m.content||"").slice(0,60000);
  const parts=[];
  if(text)parts.push({type:"text",text});
  for(const f of (m.files||[])){
    if(f.type==="image"){
      parts.push({type:"image_url",image_url:{url:f.data}});
    }else if(f.type==="video"){
      if(f.data)parts.push({type:"video_url",video_url:{url:f.data}});
      else parts.push({type:"text",text:"\n[用户曾上传视频："+f.name+"，视频内容已不在本地，无法重新分析]"});
    }else if(f.type==="text"){
      parts.push({type:"text",text:"\n[用户上传文件："+f.name+"]\n"+String(f.data).slice(0,60000)});
    }else{
      parts.push({type:"text",text:"\n[用户上传了文件："+f.name+"，当前模型无法直接读取该文件内容]"});
    }
  }
  return parts.length?parts:text;
}
function buildMessages(agent,history,userMsg){
  const msgs=[];
  let sys=agent.persona||"你是一个乐于助人的 AI 助手。";
  sys+="\n\n当前日期："+new Date().toLocaleDateString("zh-CN");
  msgs.push({role:"system",content:sys});
  for(const m of history){
    if(!m||(!m.content&&!m.files))continue;
    msgs.push({role:m.role,content:Array.isArray(m.content)?m.content:toApiContent(m)});
  }
  msgs.push({role:"user",content:toApiContent(userMsg)});
  return msgs;
}

function inline(t){
  let s=esc(t);
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(t){
  if(!t)return "";
  const lines=String(t).replace(/\r/g,"").split("\n");
  let html="",inCode=false,codeBuf=[],inUl=false,inOl=false,inBq=false;
  const closeList=()=>{
    if(inUl){html+="</ul>";inUl=false;}
    if(inOl){html+="</ol>";inOl=false;}
  };
  for(const raw of lines){
    const line=raw.trimEnd();
    if(inCode){
      if(line.trim().startsWith("```")){
        html+="<pre><code>"+esc(codeBuf.join("\n"))+"</code></pre>";
        inCode=false;codeBuf=[];
      }else codeBuf.push(line);
      continue;
    }
    if(line.trim().startsWith("```")){closeList();inCode=true;continue;}
    if(inBq){
      if(!line){html+="</blockquote>";inBq=false;continue;}
      html+=esc(line)+"<br>";
      continue;
    }
    if(line.trim().startsWith(">")){
      if(!inBq){closeList();html+="<blockquote>";inBq=true;}
      const content=line.trim().replace(/^>\s?/,"");
      if(content)html+=esc(content)+"<br>";
      continue;
    }
    if(!line.trim()){closeList();html+="\n";continue;}
    const h=line.match(/^(#{1,3})\s+(.*)$/);
    if(h){closeList();const n=h[1].length;html+="<h"+n+">"+inline(h[2])+"</h"+n+">";continue;}
    const ul=line.match(/^([-*])\s+(.*)$/);
    if(ul){if(!inUl){html+="<ul>";inUl=true;}html+="<li>"+inline(ul[2])+"</li>";continue;}
    const ol=line.match(/^\d+[.、]\s+(.*)$/);
    if(ol){if(!inOl){html+="<ol>";inOl=true;}html+="<li>"+inline(ol[1])+"</li>";continue;}
    if(inUl||inOl)closeList();
    html+="<p>"+inline(line)+"</p>";
  }
  if(inCode)html+="<pre><code>"+esc(codeBuf.join("\n"))+"</code></pre>";
  if(inBq)html+="</blockquote>";
  closeList();
  return html;
}

function toast(msg,isErr,ms){
  const t=$("toast");
  t.textContent=msg;
  t.className="toast show"+(isErr?" err":"");
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove("show"),ms||2800);
}

function renderAgents(){
  const list=$("agentList");
  const kw=state.search.toLowerCase();
  list.innerHTML="";
  const shown=state.agents.filter(a=>!kw||a.name.toLowerCase().includes(kw));
  for(const a of shown){
    const el=document.createElement("div");
    el.className="agent-item"+(a.id===state.currentId?" active":"");
    el.innerHTML='<div class="agent-avatar" style="background:'+a.color+'">'+esc(a.avatar||a.name.slice(0,1))+'</div>'+
      '<div class="agent-meta"><div class="agent-name">'+esc(a.name)+'</div>'+
      '<div class="agent-desc">'+esc((a.persona||"").slice(0,24)||"自定义智能体")+'</div></div>'+
      (a.builtin?'':'<button class="del" data-id="'+a.id+'" title="删除">×</button>');
    el.addEventListener("click",e=>{
      if(e.target.classList.contains("del"))return;
      selectAgent(a.id);
    });
    const delBtn=el.querySelector(".del");
    if(delBtn)delBtn.addEventListener("click",e=>{
      e.stopPropagation();
      deleteAgent(a.id);
    });
    list.appendChild(el);
  }
  $("sidebarEmpty").style.display=shown.length?"none":"block";
}

async function selectAgent(id){
  state.currentId=id;
  save();
  renderAgents();
  await getConvAsync(id);
  renderChat(true);
  closeSidebarMobile();
}
function deleteAgent(id){
  const a=getAgent(id);
  if(!confirm("删除智能体「"+a.name+"」？其对话记录也会一并删除。"))return;
  state.agents=state.agents.filter(x=>x.id!==id);
  delConv(id);
  if(state.currentId===id)state.currentId=state.agents.length?state.agents[0].id:null;
  if(!state.agents.length)state.agents.push({id:uid(),name:"万能助手",avatar:"智",color:"#3d5a70",persona:"",greeting:"你好，我是你的助手。",questions:[],model:"",createdAt:Date.now()});
  save();
  renderAgents();
  renderChat(true);
}

function scrollBottomNow(sc){
  if(!sc)return;
  sc.style.scrollBehavior="auto";
  sc.scrollTop=sc.scrollHeight;
  sc.style.scrollBehavior="";
}
function renderChat(forceBottom){
  const head=$("chatHead"),msgs=$("messages");
  const prevStick=stickToBottom,prevTop=msgs.scrollTop;
  const a=currentAgent();
  if(!a){head.style.display="none";msgs.innerHTML='';return;}
  head.style.display="flex";
  const av=$("headAvatar");av.textContent=a.avatar||a.name.slice(0,1);av.style.background=a.color;
  $("headName").textContent=a.name;
  const s=effectiveSettings(a);
  $("headModel").textContent="模型："+(a.model||s.model||"未设置")+" · "+(PROVIDERS[s.provider]?PROVIDERS[s.provider].label:s.provider);
  const c=getConv(a.id);
  msgs.innerHTML="";
  const sbEl=document.createElement("div");sbEl.className="scrubber";sbEl.id="scrubber";
  $("main").appendChild(sbEl);
  if(!c.messages.length){
    const w=document.createElement("div");
    w.className="welcome";
    w.innerHTML='<div class="hello">'+esc(a.greeting||("你好，我是"+a.name))+'</div>'+
      '<div class="hint">我是「'+esc(a.name)+'」，可以直接提问，也可以从下面挑一个问题开始。</div>';
    const qs=document.createElement("div");
    qs.className="questions";
    const questions=a.questions&&a.questions.length?a.questions:["你好，介绍一下自己","你能帮我做什么？"];
    for(const q of questions){
      if(!q)continue;
      const btn=document.createElement("button");
      btn.className="q-chip";btn.textContent=q;
      btn.addEventListener("click",()=>sendMessage(q));
      qs.appendChild(btn);
    }
    w.appendChild(qs);
    msgs.appendChild(w);
  }else{
    for(const m of c.messages)appendMsgEl(msgs,m);
    if(forceBottom||prevStick){
      stickToBottom=true;
      scrollBottomNow(msgs);
    }else{
      stickToBottom=false;
      msgs.scrollTop=Math.min(prevTop,msgs.scrollHeight-msgs.clientHeight);
    }
  }
  renderScrubber();
}

function msgText(m){
  if(!Array.isArray(m.content))return m.content;
  return m.content.map(p=>p&&p.type==="text"?p.text:"").join("");
}
function renderMsgFiles(files){
  let h='<div class="msg-files">';
  for(const f of files){
    h+='<div class="msg-file">'+(f.type==="image"?'<img src="'+f.data+'" alt="">':f.type==="video"?'<span class="vid">▶</span>':'')+'<span class="nm">'+esc(f.name)+'</span></div>';
  }
  return h+"</div>";
}
function appendMsgEl(container,m){
  const div=document.createElement("div");
  div.className="msg "+(m.role==="user"?"user":"ai");
  const a=currentAgent();
  const avHtml=m.role==="user"?'<div class="msg-avatar" style="background:var(--user);color:#f2f5f7">我</div>'

async function streamChat(base,apiKey,payload,handlers,signal){
  const url=chatUrl(base);
  if(!url)throw new Error("Base URL 为空");
  if(!payload.model)throw new Error("模型 ID 未设置");
  const headers={"Content-Type":"application/json","Accept":"text/event-stream"};
  if(apiKey)headers["Authorization"]="Bearer "+apiKey;
  let res;
  try{
    res=await fetch(url,{method:"POST",headers,body:JSON.stringify(payload),signal});
  }catch(e){
    if(e.name==="AbortError")throw e;
    const m=String(e&&e.message||e).toLowerCase();
    if(/network|failed to fetch|fetch failed|load failed/i.test(m)||!m){
      throw new Error("网络连接失败（无法访问 "+url+"）。请检查：① 设置中的接口地址与 API Key 是否正确；② 网络是否正常；③ Ollama 本地服务需先启动（ollama serve）；④ 若页面为 https，访问 http 本地接口可能被浏览器拦截，建议改用 DeepSeek/豆包等在线接口");
    }
    throw new Error(m);
  }
  if(!res.ok){
    let msg="HTTP "+res.status;
    try{
      const j=await res.json();
      msg=(j.error&&(j.error.message||j.error.code))||msg;
    }catch(e){}
    throw new Error(msg);
  }
  const reader=res.body.getReader();
  const dec=new TextDecoder();
  let buf="";
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,idx).trim();
      buf=buf.slice(idx+1);
      if(!line.startsWith("data:"))continue;
      const data=line.slice(5).trim();
      if(data==="[DONE]")return;
      try{
        const j=JSON.parse(data);
        const d=j.choices&&j.choices[0]&&j.choices[0].delta;
        if(!d)continue;
        if(d.reasoning_content)handlers.onReasoning(d.reasoning_content);
        if(d.content!==undefined&&d.content!==null&&d.content!=="")handlers.onDelta(d.content);
      }catch(e){}
    }
  }
}

async function sendMessage(text){
  const a=currentAgent();
  const s=effectiveSettings(a);
  if(!a||state.generating)return;
  if(!s.baseURL&&!PROVIDERS[s.provider]){openSettings();return;}
  let base=s.baseURL||PROVIDERS[s.provider].base;
  let apiKey=s.apiKey||"";
  const input=$("input");
  const files=state.pendingFiles.slice();
  if(!text&&!files.length)return;
  if(text&&text.length>20000){toast("消息过长（最多 20000 字）",true);return;}
  if(files.some(f=>f.type==="video")&&!VIDEO_PROVIDERS[s.provider]){
    toast("当前 AI 不支持视频，请改用豆包视觉模型或支持视频的自定义接口",true);
    return;
  }
  const totalBytes=files.reduce((n,f)=>n+((f.type==="text"&&f.data)?f.data.length:0),0);
  if(totalBytes>2.5*1024*1024){toast("文本附件总大小超过限制（约 2.5MB）",true);return;}
  const c=getConv(a.id);
  const savedFiles=files.map(f=>f.type==="video"?{name:f.name,type:"video"}:f);
  c.messages.push({role:"user",content:text,files:savedFiles.length?savedFiles:undefined,ts:Date.now()});
  saveConv(c);
  input.value="";
  state.pendingFiles=[];
  renderAttachList();
  autoResize();
  renderChat(true);

  const container=$("messages");
  const msgsEl=container;
  const aiMsg={role:"assistant",content:"",reasoning:"",streaming:true,ts:Date.now()};
  c.messages.push(aiMsg);
  saveConv(c);
  const aiEl=appendStreamEl(msgsEl);
  aiEl._aiMsg=aiMsg;

  const payload=buildPayload(a,{text,files},c.messages.slice(0,-2));
  state.generating=true;
  state.abort=new AbortController();
  setGeneratingUI(true);
  let errorMsg="";
  let lastReasoning="";
  let lastContent="";
  try{
    await streamChat(base,apiKey,payload.body,{
      onReasoning:(t)=>{lastReasoning+=t;aiMsg.reasoning=lastReasoning;updateStreamEl(aiEl,aiMsg);},
      onDelta:(t)=>{lastContent+=t;aiMsg.content=lastContent;updateStreamEl(aiEl,aiMsg);}
    },state.abort.signal);
  }catch(e){
    if(e.name==="AbortError"){
      toast("已停止生成");
    }else{
      errorMsg=(e&&e.message)||String(e);
      aiMsg.error=errorMsg;
      toast("请求失败："+errorMsg,true,5000);
    }
  }
  aiMsg.streaming=false;
  aiMsg.content=lastContent;
  if(!lastContent&&!errorMsg)aiMsg.content="（无回复内容）";
  saveConv(c);
  updateStreamEl(aiEl,aiMsg);
  state.generating=false;
  state.abort=null;
  setGeneratingUI(false);
}

const ttsState={ut:null,btn:null};
function setTtsBtn(btn,on){
  if(!btn)return;
  btn.classList.toggle("speaking",on);
  btn.textContent=on?"停止朗读":"朗读";
}
function speakText(text,btn){
  if(!("speechSynthesis" in window)){toast("当前浏览器不支持朗读",true);return;}
  if(!text){toast("没有可朗读的内容",true);return;}
  if(ttsState.ut){
    speechSynthesis.cancel();
    setTtsBtn(ttsState.btn,false);
    const same=ttsState.btn===btn;
    ttsState.ut=null;
    ttsState.btn=null;
    if(same)return;
  }
  const ut=new SpeechSynthesisUtterance(text);
  ut.lang="zh-CN";
  const v=speechSynthesis.getVoices().find(v=>/^zh[-_]?CN/i.test(v.lang));
  if(v)ut.voice=v;
  ttsState.ut=ut;
  ttsState.btn=btn;
  setTtsBtn(btn,true);
  ut.onend=()=>{setTtsBtn(btn,false);ttsState.ut=null;ttsState.btn=null;};
  ut.onerror=()=>{setTtsBtn(btn,false);ttsState.ut=null;ttsState.btn=null;};
  speechSynthesis.speak(ut);
}
function plainText(s){
  return String(s||"")
    .replace(/```[\s\S]*?```/g,"代码块 ")
    .replace(/`([^`]+)`/g,"$1 ")
    .replace(/!\[[^\]]*\]\([^)]*\)/g,"图片 ")
    .replace(/\[([^\]]*)\]\([^)]*\)/g,"$1 ")
    .replace(/^#{1,6}\s+/gm,"")
    .replace(/[*_~>]+/g,"")
    .replace(/^\s*[-*+]\s+/gm,"")
    .replace(/^\s*\d+\.\s+/gm,"")
    .replace(/[\r\n]+/g," ")
    .replace(/\s{2,}/g," ")
    .trim();
}

const ATTACH_TEXT_EXT={txt:1,md:1,json:1,csv:1,log:1,js:1,py:1,html:1,css:1,xml:1,yml:1,yaml:1,ini:1,ts:1,jsx:1,tsx:1};
const ATTACH_VIDEO_EXT={mp4:1,mov:1,avi:1,mkv:1,wmv:1};
const VIDEO_PROVIDERS={doubao:1,custom:1};
function readFileAsDataUrl(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f);});}
function readFileAsText(f){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsText(f,"utf-8");});}
function compressImage(dataUrl){
  return new Promise(res=>{
    const img=new Image();
    img.onload=()=>{
      const MAX=1024;
      let w=img.naturalWidth,h=img.naturalHeight;
      const scale=Math.min(1,MAX/Math.max(w,h));
      if(scale<1){w=Math.round(w*scale);h=Math.round(h*scale);}
      const c=document.createElement("canvas");
      c.width=w;c.height=h;
      c.getContext("2d").drawImage(img,0,0,w,h);
      res(c.toDataURL("image/jpeg",0.75));
    };
    img.onerror=()=>res(dataUrl);
    img.src=dataUrl;
  });
}

$("attachBtn").addEventListener("click",()=>$("attachFile").click());
$("attachFile").addEventListener("change",async e=>{
  const files=[...e.target.files];
  e.target.value="";
  for(const f of files){
    const name=f.name;
    const ext=name.split(".").pop().toLowerCase();
    const isImg=/^image\//.test(f.type);
    const isVideo=/^video\//.test(f.type)||ATTACH_VIDEO_EXT[ext];
    if(!isImg&&!isVideo&&!ATTACH_TEXT_EXT[ext]){
      toast("不支持的文件类型："+name+"（仅支持图片、视频和文本类文件）",true);
      continue;
    }
    if(isVideo){
      const a=currentAgent();
      const s=effectiveSettings(a);
      if(!VIDEO_PROVIDERS[s.provider]){
        toast("当前 AI 不支持视频（仅豆包视觉模型或支持视频的自定义接口可用）",true);
        continue;
      }
      if(f.size>20*1024*1024){toast(name+" 超过 20MB，已跳过",true);continue;}
    }
    if(!isImg&&!isVideo&&f.size>2*1024*1024){toast(name+" 超过 2MB，已跳过",true);continue;}
    try{
      if(isImg){
        const raw=await readFileAsDataUrl(f);
        const data=await compressImage(raw);
        state.pendingFiles.push({name,type:"image",data});
      }else if(isVideo){
        const data=await readFileAsDataUrl(f);
        state.pendingFiles.push({name,type:"video",data});
      }else{
        const data=await readFileAsText(f);
        state.pendingFiles.push({name,type:"text",data:String(data).slice(0,60000)});
      }
    }catch(err){
      toast("读取失败："+name,true);
    }
  }
  renderAttachList();
});
$("attachList").addEventListener("click",e=>{
  const i=e.target.dataset.i;
  if(i===undefined)return;
  state.pendingFiles.splice(Number(i),1);
  renderAttachList();
});

function fillAgProvider(sel,a){
  sel.innerHTML="";
  const o=document.createElement("option");
  o.value="";o.textContent="跟随全局设置";
  sel.appendChild(o);
  for(const k in PROVIDERS){
    const op=document.createElement("option");
    op.value=k;op.textContent=PROVIDERS[k].label;
    sel.appendChild(op);
  }
  if(a&&a.provider&&sel.querySelector('option[value="'+a.provider+'"]'))sel.value=a.provider;
  else if(a&&a.model)sel.value=state.settings.activeProvider||"deepseek";
  return sel;
}
function fillAgModel(sel,provider,cur){
  sel.innerHTML="";
  const empty=document.createElement("option");
  empty.value="";
  empty.textContent=provider?"（留空 = 使用该 AI 的默认模型）":"（跟随全局默认）";
  sel.appendChild(empty);
  const prov=provider?state.settings.providers[provider]:null;
  const p=PROVIDERS[provider];
  const list=prov&&Array.isArray(prov.models)?prov.models.slice():[];
  const seen=new Set(list);
  if(p){
    for(const md of [p.model].concat(p.models)){
      if(md&&!seen.has(md)){seen.add(md);list.push(md);}
    }
  }
  for(const md of list){
    const o=document.createElement("option");
    o.value=md;
    o.textContent=md+(prov&&prov.models&&prov.models[0]===md?"（默认）":"");
    sel.appendChild(o);
  }
  if(cur&&[...sel.options].some(o=>o.value===cur)){
    sel.value=cur;
  }else if(cur){
    const o=document.createElement("option");
    o.value=cur;o.textContent=cur+"（自定义）";
    sel.appendChild(o);
    sel.value=cur;
  }
  return sel;
}

function addModelChip(md){
  md=String(md||"").trim();
  if(!md)return;
  const prov=currentProviderSettings();
  if(!Array.isArray(prov.models))prov.models=[];
  if(prov.models.indexOf(md)<0)prov.models.push(md);
  renderModelChips();
}
function closeOverlay(id){$(id).classList.remove("show");}

document.querySelectorAll("[data-close]").forEach(b=>{
  b.addEventListener("click",()=>closeOverlay(b.dataset.close));
});
document.querySelectorAll(".overlay").forEach(o=>{
  o.addEventListener("mousedown",e=>{
    if(e.target===o)o.classList.remove("show");
  });
});
$("newAgentBtn").addEventListener("click",()=>{
  closeSidebarMobile();
  openEdit(null);
});
$("settingsBtn").addEventListener("click",openSettings);
$("editBtn").addEventListener("click",()=>openEdit(state.currentId));
$("clearBtn").addEventListener("click",()=>{
  const a=currentAgent();
  if(!a)return;
  if(!confirm("清空与「"+a.name+"」的对话记录？"))return;
  delConv(a.id);
  renderChat(true);
  toast("对话已清空");
});
$("searchInput").addEventListener("input",e=>{state.search=e.target.value;renderAgents();});
$("addQ").addEventListener("click",()=>{
  const row=document.createElement("div");
  row.className="q-row";
  const inp=document.createElement("input");
  inp.placeholder="推荐问题（选填）";
  const rm=document.createElement("button");
  rm.className="rm";rm.textContent="×";
  rm.addEventListener("click",()=>row.remove());
  row.appendChild(inp);row.appendChild(rm);
  $("qList").appendChild(row);
  inp.focus();
});
$("agAvatar").addEventListener("input",e=>{
  const p=$("agAvatarPreview");
  p.textContent=e.target.value.slice(0,2)||"智";
});
$("saveAgent").addEventListener("click",saveAgent);
$("agProvider").addEventListener("change",()=>fillAgModel($("agModel"),$("agProvider").value,""));
$("saveSettings").addEventListener("click",()=>{
  const prov=currentProviderSettings();
  prov.apiKey=$("setKey").value.trim();
  prov.baseURL=$("setBase").value.trim();
  prov.temperature=Math.min(2,Math.max(0,Number($("setTemp").value)||0.8));
  const mv=$("setModel").value.trim();
  if(mv&&prov.models.indexOf(mv)<0)prov.models.push(mv);
  prov.models=(prov.models||[]).map(s=>String(s).trim()).filter(Boolean);
  prov.models=[...new Set(prov.models)];
  prov.model=prov.models[0]||"";
  state.settings.activeProvider=selProvider;
  persistSettings();
  closeOverlay("settingsOverlay");
  renderChat();
  toast("设置已保存");
});
$("exportBtn").addEventListener("click",async()=>{
  const data=await buildExportData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const aEl=document.createElement("a");
  aEl.href=url;
  aEl.download="agent-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(aEl);
  aEl.click();
  aEl.remove();
  URL.revokeObjectURL(url);
  toast("已导出配置（不含 API Key）");
});
$("importBtn").addEventListener("click",()=>{
  if(!confirm("导入将覆盖当前所有智能体、对话记录与设置，确定继续？"))return;
  $("importFile").click();
});
$("importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];
  if(!f)return;
  try{
    const text=await f.text();
    applyImport(JSON.parse(text));
    toast("导入成功，已刷新数据");
  }catch(err){
    toast("导入失败："+(err.message||String(err)),true,4500);
  }
  e.target.value="";
});
$("resetBtn").addEventListener("click",factoryReset);
async function buildExportData(){
  const convs=[];
  for(const a of state.agents)convs.push({id:a.id,messages:(await getConvAsync(a.id)).messages});
  const data={
    app:"agentwork",version:2,exportedAt:new Date().toISOString(),
    settings:deepcopy(state.settings),
    agents:deepcopy(state.agents),
    conversations:convs,
    theme:localStorage.getItem("agentwork_theme")||"light"
  };
  for(const p in data.settings.providers)data.settings.providers[p].apiKey="";
  return data;
}
function applyImport(d){
  if(!d||d.app!=="agentwork")throw new Error("不是本应用导出的配置文件");
  if(!Array.isArray(d.agents)||!d.agents.length)throw new Error("文件中没有智能体数据");
  for(const a of d.agents){
    a.avatar=stripEmoji(a.avatar)||a.name.slice(0,1)||"智";
    a.greeting=stripEmoji(a.greeting);
    a.persona=stripEmoji(a.persona);
    if(a.questions)a.questions=a.questions.map(stripEmoji).filter(Boolean);
    if(a.kb)delete a.kb;
  }
  state.agents=d.agents;
  save();
  if(d.settings&&d.settings.providers)state.settings=normalizeSettings(d.settings);
  else state.settings={providers:{deepseek:mkProvider(),doubao:mkProvider(),ollama:mkProvider(),custom:mkProvider()},activeProvider:"deepseek"};
  persistSettings();
  if(Array.isArray(d.conversations)){
    for(const c of d.conversations){
      if(c&&c.id)saveConv({id:c.id,messages:Array.isArray(c.messages)?c.messages:[]});
    }
  }
  state.currentId=state.agents[0].id;
  if(d.theme){
    localStorage.setItem("agentwork_theme",d.theme);
    document.documentElement.dataset.theme=d.theme;
  }
  updateThemeBtn();
  renderAgents();
  renderChat(true);
}
function factoryReset(){
  if(!confirm("确定初始化？将清空所有智能体、对话记录、模型设置与主题偏好，且无法恢复。"))return;
  if(!confirm("再次确认：所有数据都会被删除。"))return;
  localStorage.removeItem("agentwork_agents");
  localStorage.removeItem("agentwork_settings");
  localStorage.removeItem("agentwork_theme");
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf("agentwork_conv_")===0)keys.push(k);
  }
  keys.forEach(k=>localStorage.removeItem(k));
  state.convCache={};
  dbClear().finally(()=>location.reload());
}
document.querySelectorAll("#providerChips button").forEach(b=>{
  b.addEventListener("click",()=>renderProviderChips(b.dataset.p));
});
$("basePresets").addEventListener("click",e=>{
  if(e.target.dataset.b)$("setBase").value=e.target.dataset.b;
});
$("modelPresets").addEventListener("click",e=>{
  if(e.target.dataset.m)addModelChip(e.target.dataset.m);
});
$("modelChips").addEventListener("click",e=>{

});

  if(e.key==="Enter"){
    e.preventDefault();
    addModelChip($("setModel").value);
    $("setModel").value="";
  }
});
$("keyPresets").addEventListener("click",e=>{
  if(e.target.dataset.v==="deepseek")toast("DeepSeek Key：platform.deepseek.com 的 API Keys 页面创建");
  if(e.target.dataset.v==="doubao")toast("豆包 Key：console.volcengine.com/ark 的 API Key 管理页创建（需实名）");
});
$("sendBtn").addEventListener("click",()=>{
  if(state.generating){if(state.abort)state.abort.abort();return;}
  const v=$("input").value.trim();
  if(v)sendMessage(v);
});
$("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    const v=$("input").value.trim();
    if(v&&!state.generating)sendMessage(v);
    else if(state.generating){}else $("input").focus();
  }
});
$("input").addEventListener("input",autoResize);
$("messages").addEventListener("scroll",()=>{
  const sc=$("messages");
  stickToBottom=sc.scrollHeight-sc.scrollTop-sc.clientHeight<60;
  markScrubActive();
});
function updateThemeBtn(){
  const dark=document.documentElement.dataset.theme==="dark";
  $("themeBtn").textContent=dark?"浅色":"深色";
}
$("themeBtn").addEventListener("click",()=>{
  const cur=document.documentElement.dataset.theme;
  const next=cur==="dark"?"light":"dark";
  document.documentElement.dataset.theme=next;
  localStorage.setItem("agentwork_theme",next);
  updateThemeBtn();
});

function closeSidebarMobile(){
  $("sidebar").classList.remove("open");
  $("backdrop").classList.remove("show");
}
function toggleSidebarMobile(){
  const open=$("sidebar").classList.toggle("open");
  $("backdrop").classList.toggle("show",open);
}
$("menuBtn").addEventListener("click",toggleSidebarMobile);
$("backdrop").addEventListener("click",closeSidebarMobile);
let sidebarTimer=null;
document.querySelector(".brand").addEventListener("click",()=>{
  if(window.innerWidth<=760)toggleSidebarMobile();
});
window.addEventListener("resize",()=>{
  if(window.innerWidth>760)closeSidebarMobile();
});

(async function init(){
  const theme=localStorage.getItem("agentwork_theme")||"light";
  document.documentElement.dataset.theme=theme;
  updateThemeBtn();
  load();
  renderAgents();
  await preloadConvs();
  renderChat(true);
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape"){
      document.querySelectorAll(".overlay.show").forEach(o=>o.classList.remove("show"));
      closeSidebarMobile();
    }
  });
})();
})();
</script>
