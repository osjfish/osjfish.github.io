<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>智能体</title>
<style>
:root{
  --bg:#f5f1e6; --card:#fffdf7; --text:#33302b; --text2:#8a857d; --line:#e2d9c6;
  --accent:#3d5a70; --accent-soft:#e8eef2; --seal:#a03a2e; --gold:#b98a44;
  --user:#3d5a70; --code-bg:#efe9db; --danger:#a03a2e; --ok:#6b7f4f;
  --radius:8px; --radius-sm:6px;
  --serif:"Songti SC","STSong","SimSun",serif;
}
[data-theme="dark"]{
  --bg:#1e1c19; --card:#2a2723; --text:#e6dfd2; --text2:#a39a88; --line:#3a362f;
  --accent:#c9a45c; --accent-soft:#2c2a24; --seal:#b04a3c; --gold:#c9a45c;
  --user:#3d5a70; --code-bg:#26231e; --danger:#c96a5e;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:"PingFang SC","Microsoft YaHei",system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--text);height:100vh;overflow:hidden}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input,textarea,select{font-family:inherit;font-size:14px;color:var(--text);background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:9px 12px;outline:none;width:100%}
input:focus,textarea:focus,select:focus{border-color:var(--accent)}
textarea{resize:vertical}
::-webkit-scrollbar{width:8px;height:8px}
::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
.header{height:56px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;background:var(--card);border-bottom:1px solid var(--line);position:relative;z-index:10}
.brand{display:flex;align-items:center;gap:11px;font-family:var(--serif);font-weight:700;font-size:18px;letter-spacing:3px}
.header-actions{display:flex;gap:8px}
.icon-btn{height:32px;padding:0 12px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:13px;background:var(--bg);border:1px solid var(--line);transition:.15s;color:var(--text2)}
.icon-btn:hover{border-color:var(--accent);color:var(--accent)}
.layout{display:flex;height:calc(100vh - 56px)}
.sidebar{width:264px;min-width:264px;background:var(--card);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:14px 12px;gap:12px}
.sidebar-actions{display:flex;gap:8px}
.sidebar-actions button{flex:1;height:36px;border-radius:var(--radius-sm);font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s}
.btn-new{background:var(--seal);color:#fdf6e8}
.btn-new:hover{filter:brightness(1.08)}
.sidebar-search{padding:8px 10px;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);display:flex;align-items:center;gap:8px}
.sidebar-search input{border:none;background:none;padding:0;font-size:13px}
.sidebar-search input:focus{outline:none}
.agent-list{flex:1;overflow-y:auto;display:flex;flex-direction:column;gap:4px}
.agent-item{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--radius-sm);cursor:pointer;transition:.12s;border:1px solid transparent;position:relative}
.agent-item:hover{background:var(--bg)}
.agent-item.active{background:var(--accent-soft);border-color:var(--line)}
.agent-item.active::before{content:"";position:absolute;left:-1px;top:8px;bottom:8px;width:3px;background:var(--seal);border-radius:2px}
.agent-avatar{width:38px;height:38px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0;font-family:var(--serif);font-weight:700;color:#fdf6e8}
.agent-meta{flex:1;min-width:0}
.agent-name{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.agent-desc{font-size:11.5px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:2px}
.agent-item .del{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:5px;display:none;align-items:center;justify-content:center;font-size:12px;background:var(--card);border:1px solid var(--line);color:var(--danger)}
.agent-item:hover .del{display:flex}
.agent-item:hover .del:hover{background:var(--danger);color:#fff}
.sidebar-empty{text-align:center;color:var(--text2);font-size:12.5px;padding:24px 8px;line-height:1.8}
.main{flex:1;display:flex;flex-direction:column;min-width:0;position:relative}
.chat-head{height:58px;display:flex;align-items:center;gap:12px;padding:0 20px;background:var(--card);border-bottom:1px solid var(--line)}
.chat-head .name{font-size:15.5px;font-weight:700;font-family:var(--serif);letter-spacing:1px}
.chat-head .sub{font-size:12px;color:var(--text2);margin-top:2px}
.chat-head .spacer{flex:1}
.chat-head .mini-btn{height:32px;padding:0 12px;border-radius:var(--radius-sm);font-size:12.5px;background:var(--bg);border:1px solid var(--line);display:flex;align-items:center;gap:5px;color:var(--text2)}
.chat-head .mini-btn:hover{border-color:var(--accent);color:var(--accent)}
.messages{flex:1;overflow-y:auto;padding:24px 20px 10px;display:flex;flex-direction:column;gap:18px;scroll-behavior:smooth;position:relative}
.scrubber{position:absolute;top:10px;right:2px;bottom:10px;width:12px;display:none;z-index:5}
.scrubber.show{display:block}
.scrub-tick{position:absolute;left:50%;transform:translate(-50%,-50%);width:7px;height:7px;border-radius:50%;background:var(--card);border:1px solid var(--line);cursor:pointer;transition:background .12s,border-color .12s}
.scrub-tick:hover{border-color:var(--accent);background:var(--accent)}
.scrub-tick.active{border-color:var(--accent);background:var(--accent)}
@media (max-width:760px){.scrubber{display:none!important}}
.msg{display:flex;gap:12px;max-width:840px;margin:0 auto;width:100%}
.msg.user{flex-direction:row-reverse}
.msg-avatar{width:36px;height:36px;border-radius:5px;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:14px;margin-top:2px;font-family:var(--serif);font-weight:700}
.msg-body{max-width:78%;min-width:0}
.msg.user .msg-body{display:flex;flex-direction:column;align-items:flex-end}
.bubble{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:12px 16px;font-size:14.5px;line-height:1.75;word-break:break-word}
.msg.user .bubble{background:var(--user);color:#f2f5f7;border:none;border-bottom-right-radius:3px}
.msg.ai .bubble{border-bottom-left-radius:3px}
.bubble pre{background:var(--code-bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:12px 14px;overflow-x:auto;font-size:13px;line-height:1.6;margin:8px 0;font-family:Consolas,"Courier New",monospace}
.bubble code{background:var(--code-bg);border-radius:4px;padding:2px 6px;font-size:13px;font-family:Consolas,"Courier New",monospace}
.bubble pre code{background:none;padding:0}
.bubble p{margin:6px 0}
.bubble h1,.bubble h2,.bubble h3{margin:10px 0 6px;font-family:var(--serif)}
.bubble ul,.bubble ol{margin:6px 0;padding-left:22px}
.bubble a{color:var(--accent);text-decoration:none}
.bubble a:hover{text-decoration:underline}
.bubble blockquote{border-left:3px solid var(--gold);padding:2px 12px;color:var(--text2);margin:8px 0;background:var(--bg);border-radius:0 4px 4px 0}
.msg-time{font-size:11px;color:var(--text2);margin-top:5px}
.thinking{background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 14px;font-size:13px;color:var(--text2);margin-bottom:8px;line-height:1.7}
.thinking summary{cursor:pointer;font-weight:600;color:var(--text2);user-select:none}
.thinking .think-inner{white-space:pre-wrap;margin-top:6px;max-height:220px;overflow-y:auto;opacity:.85}
.typing-cursor{display:inline-block;width:7px;height:15px;background:var(--seal);border-radius:1px;animation:blink 1s infinite;vertical-align:-2px;margin-left:2px}
@keyframes blink{50%{opacity:0}}
.msg-actions{display:flex;gap:6px;margin-top:6px;opacity:0;transition:.15s}
.msg:hover .msg-actions{opacity:1}
.msg-actions button{font-size:11.5px;color:var(--text2);background:var(--card);border:1px solid var(--line);border-radius:4px;padding:3px 9px}
.msg-actions button:hover{color:var(--accent);border-color:var(--accent)}
.welcome{max-width:840px;margin:0 auto;width:100%;padding:30px 0 10px}
.welcome .hello{font-size:25px;font-weight:700;font-family:var(--serif);letter-spacing:1px;color:var(--text)}
.welcome .hint{color:var(--text2);font-size:14px;margin-top:10px;line-height:1.8}
.questions{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}
.q-chip{background:var(--card);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 18px;font-size:13.5px;color:var(--text);transition:.15s;text-align:left;line-height:1.5}
.q-chip:hover{border-color:var(--gold);color:var(--seal)}
.input-wrap{border-top:1px solid var(--line);background:var(--card);padding:14px 20px 18px}
.input-box{max-width:840px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:var(--radius);padding:10px 14px;transition:.15s;position:relative}
.input-box:focus-within{border-color:var(--gold)}
.input-box textarea{border:none;background:none;resize:none;padding:4px 0;max-height:160px;font-size:14.5px;line-height:1.6}
.input-box textarea:focus{outline:none}
.input-bar{display:flex;align-items:flex-end;justify-content:flex-end;gap:10px;margin-top:4px}
.send-btn{height:38px;min-width:76px;padding:0 18px;border-radius:var(--radius-sm);background:var(--seal);color:#fdf6e8;font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center;gap:6px;transition:.15s;letter-spacing:2px}
.send-btn:hover{filter:brightness(1.08)}
.send-btn:disabled{opacity:.5;cursor:not-allowed}
.stop-btn{background:var(--text2)}
.overlay{position:fixed;inset:0;background:rgba(30,28,22,.5);z-index:100;display:none;align-items:center;justify-content:center}
.overlay.show{display:flex}
.modal{background:var(--card);border-radius:10px;box-shadow:0 12px 40px rgba(30,28,22,.18);border:1px solid var(--line);width:min(560px,94vw);max-height:90vh;display:flex;flex-direction:column;animation:pop .18s ease}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:scale(1);opacity:1}}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 22px 12px;border-bottom:1px solid var(--line)}
.modal-head h3{font-size:17px;font-family:var(--serif);letter-spacing:2px}
.modal-close{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:15px;color:var(--text2)}
.modal-close:hover{background:var(--bg);color:var(--danger)}
.modal-body{padding:16px 22px 14px;overflow-y:auto}
.modal-foot{padding:14px 22px 20px;display:flex;justify-content:flex-end;gap:10px}
.field{margin-bottom:14px}
.field label{display:block;font-size:13px;font-weight:600;margin-bottom:6px;color:var(--text)}
.field .tip{font-size:11.5px;color:var(--text2);margin-top:4px;line-height:1.6}
.avatar-row{display:flex;align-items:center;gap:12px}
.avatar-preview{width:52px;height:52px;border-radius:5px;display:flex;align-items:center;justify-content:center;font-size:22px;font-family:var(--serif);font-weight:700;color:#fdf6e8}
.avatar-input{flex:1}
.color-row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.color-dot{width:26px;height:26px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:.12s}
.color-dot:hover{transform:scale(1.12)}
.color-dot.sel{border-color:var(--text)}
.q-list{display:flex;flex-direction:column;gap:8px}
.q-row{display:flex;gap:8px;align-items:center}
.q-row input{flex:1}
.q-row .rm{width:32px;height:32px;border-radius:5px;display:flex;align-items:center;justify-content:center;color:var(--text2);flex-shrink:0}
.q-row .rm:hover{background:var(--bg);color:var(--danger)}
.btn-add{height:34px;border-radius:var(--radius-sm);border:1px dashed var(--line);color:var(--accent);font-size:13px;width:100%;display:flex;align-items:center;justify-content:center;gap:5px}
.btn-add:hover{border-color:var(--accent);background:var(--accent-soft)}
.btn-primary{background:var(--seal);color:#fdf6e8;height:38px;padding:0 22px;border-radius:var(--radius-sm);font-size:14px;font-weight:600;letter-spacing:2px}
.btn-primary:hover{filter:brightness(1.08)}
.btn-ghost{background:var(--bg);border:1px solid var(--line);color:var(--text);height:38px;padding:0 20px;border-radius:var(--radius-sm);font-size:14px}
.btn-ghost:hover{border-color:var(--accent);color:var(--accent)}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 20px;border-radius:var(--radius-sm);font-size:13.5px;z-index:300;opacity:0;transition:.25s;pointer-events:none;max-width:80vw;text-align:center;line-height:1.6}
.toast.show{opacity:1}
.toast.err{background:var(--danger);color:#fff}
.settings-note{font-size:12px;color:var(--text2);background:var(--bg);border:1px solid var(--line);border-radius:var(--radius-sm);padding:10px 12px;line-height:1.7;margin-bottom:14px}
.chip-group{display:flex;gap:8px;flex-wrap:wrap}
.chip-group button{height:32px;padding:0 14px;border-radius:4px;border:1px solid var(--line);font-size:12.5px;color:var(--text2);background:var(--card);transition:.12s}
.chip-group button.sel{border-color:var(--seal);color:var(--seal);background:var(--accent-soft);font-weight:600}
.provider-preset{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.provider-preset button{font-size:11.5px;background:var(--accent-soft);color:var(--accent);padding:4px 10px;border-radius:4px}
.provider-preset button:hover{filter:brightness(1.1)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:760px){
  .sidebar{position:absolute;left:0;top:56px;bottom:0;z-index:50;transform:translateX(-100%);transition:.2s}
  .sidebar.open{transform:none;box-shadow:0 8px 30px rgba(30,28,22,.25)}
  .msg-body{max-width:88%}
}
</style>
</head>
<body>

<header class="header">
  <div class="brand"><span>智能体</span></div>
  <div class="header-actions">
    <button class="icon-btn" id="themeBtn" title="切换主题">深色</button>
    <button class="icon-btn" id="settingsBtn" title="模型设置">设置</button>
  </div>
</header>

<div class="layout">
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-actions">
      <button class="btn-new" id="newAgentBtn">新建智能体</button>
    </div>
    <div class="sidebar-search"><input id="searchInput" type="search" placeholder="搜索智能体" autocomplete="off"></div>
    <div class="agent-list" id="agentList"></div>
    <div class="sidebar-empty" id="sidebarEmpty" style="display:none">还没有智能体<br>点击上方按钮创建</div>
  </aside>

  <main class="main">
    <div class="chat-head" id="chatHead" style="display:none">
      <div class="agent-avatar" id="headAvatar">智</div>
      <div>
        <div class="name" id="headName">智能体</div>
        <div class="sub" id="headModel">模型未配置</div>
      </div>
      <div class="spacer"></div>
      <button class="mini-btn" id="editBtn">编辑</button>
      <button class="mini-btn" id="clearBtn">清空对话</button>
    </div>
    <div class="messages" id="messages">
      <div class="scrubber" id="scrubber"></div>
    </div>
    <div class="input-wrap">
      <div class="input-box">
        <textarea id="input" rows="1" placeholder="输入消息，Enter 发送，Shift+Enter 换行"></textarea>
        <div class="input-bar">
          <button class="send-btn" id="sendBtn">发送</button>
        </div>
      </div>
    </div>
  </main>
</div>

<div class="overlay" id="editOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3 id="editTitle">编辑智能体</h3>
      <button class="modal-close" data-close="editOverlay">×</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label>名称</label>
        <input id="agName" maxlength="20" placeholder="给智能体起个名字" autocomplete="off">
      </div>
      <div class="field">
        <label>头像文字</label>
        <div class="avatar-row">
          <div class="avatar-preview" id="agAvatarPreview">智</div>
          <input class="avatar-input" id="agAvatar" maxlength="2" placeholder="输入 1-2 个汉字，如：智" autocomplete="off">
        </div>
        <div class="color-row" id="colorRow"></div>
      </div>
      <div class="field">
        <label>人设（角色设定）</label>
        <textarea id="agPersona" rows="5" placeholder="描述这个智能体的性格、身份、说话风格、擅长领域……"></textarea>
      </div>
      <div class="field">
        <label>开场白</label>
        <textarea id="agGreeting" rows="2" placeholder="智能体首次打招呼的话，如：你好，我是小灵。有什么想聊的吗？"></textarea>
      </div>
      <div class="field">
        <label>推荐问题</label>
        <div class="q-list" id="qList"></div>
        <button class="btn-add" id="addQ">添加推荐问题</button>
      </div>
      <div class="field">
        <label>模型</label>
        <input id="agModel" placeholder="留空 = 使用全局默认模型" title="可填写具体的模型 ID，如 deepseek-v4-flash / ep-xxx / qwen2.5:7b" autocomplete="off">
        <div class="tip">留空时使用右上角「设置」里的全局模型。</div>
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-ghost" data-close="editOverlay">取消</button>
      <button class="btn-primary" id="saveAgent">保存</button>
    </div>
  </div>
</div>

<div class="overlay" id="settingsOverlay">
  <div class="modal">
    <div class="modal-head">
      <h3>模型设置</h3>
      <button class="modal-close" data-close="settingsOverlay">×</button>
    </div>
    <div class="modal-body">
      <div class="settings-note">每个服务商的 API Key、接口地址、模型、温度均独立保存，互不影响。API Key 仅保存在本机浏览器，导出配置时不包含。</div>
      <div class="field">
        <label>服务商</label>
        <div class="chip-group" id="providerChips">
          <button data-p="deepseek">DeepSeek</button>
          <button data-p="doubao">豆包/火山方舟</button>
          <button data-p="ollama">Ollama 本地</button>
          <button data-p="custom">自定义接口</button>
        </div>
      </div>
      <div class="field">
        <label>API Key</label>
        <input id="setKey" type="password" placeholder="sk-... 或 ARK 密钥" autocomplete="new-password">
        <div class="provider-preset" id="keyPresets" style="display:none">
          <button data-v="deepseek">platform.deepseek.com</button>
          <button data-v="doubao">console.volcengine.com/ark</button>
        </div>
      </div>
      <div class="field">
        <label>接口地址 Base URL</label>
        <input id="setBase" placeholder="https://..." autocomplete="off">
        <div class="provider-preset" id="basePresets"></div>
      </div>
      <div class="field">
        <label>模型 ID</label>
        <input id="setModel" placeholder="模型 ID 或接入点 ID" autocomplete="off">
        <div class="provider-preset" id="modelPresets"></div>
        <div class="tip" id="modelTip"></div>
      </div>
      <div class="row2">
        <div class="field">
          <label>温度</label>
          <input id="setTemp" type="number" min="0" max="2" step="0.1" value="0.8">
        </div>
      </div>
    </div>
    <div class="modal-foot">
      <div style="display:flex;gap:8px;margin-right:auto">
        <button class="btn-ghost" id="exportBtn" title="导出全部智能体、对话与设置（不含 API Key）">导出配置</button>
        <button class="btn-ghost" id="importBtn" title="从配置文件恢复（覆盖当前数据）">导入配置</button>
        <button class="btn-ghost" id="resetBtn" style="color:var(--danger);border-color:var(--danger)" title="清空所有数据并恢复出厂">初始化</button>
      </div>
      <button class="btn-ghost" data-close="settingsOverlay">取消</button>
      <button class="btn-primary" id="saveSettings">保存</button>
    </div>
  </div>
</div>
<input type="file" id="importFile" accept=".json" style="display:none">

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";

const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const deepcopy=o=>JSON.parse(JSON.stringify(o));
const COLORS=["#3d5a70","#a03a2e","#6b7f4f","#b98a44","#4a4a4a","#7c5c8c","#2f6d5e","#8a5a3a"];
function mkProvider(){return {apiKey:"",baseURL:"",model:"",temperature:0.8};}

let state={
  agents:[],
  currentId:null,

function stripEmoji(s){return String(s||"").replace(EMOJI_RE,"").trim();}
function normalizeSettings(s){
  const out={providers:{},activeProvider:(s&&s.activeProvider)||"deepseek"};
  for(const p of ["deepseek","doubao","ollama","custom"]){
    out.providers[p]={apiKey:"",baseURL:"",model:"",temperature:0.8};
    if(s&&s.providers&&s.providers[p])Object.assign(out.providers[p],s.providers[p]);
  }
  if(!out.providers[out.activeProvider])out.activeProvider="deepseek";
  return out;
}

function load(){

  try{Object.assign(state.settings,JSON.parse(localStorage.getItem("agentwork_settings")||"{}"));}catch(e){}
  if(!Array.isArray(state.agents))state.agents=[];
  if(!state.settings.providers||!state.settings.providers.deepseek){
    const old=state.settings;
    const p=(old&&old.provider)||"deepseek";
    state.settings={providers:{deepseek:mkProvider(),doubao:mkProvider(),ollama:mkProvider(),custom:mkProvider()},activeProvider:p};
    if(old&&typeof old==="object"){
      state.settings.providers[p].apiKey=old.apiKey||"";
      state.settings.providers[p].baseURL=old.baseURL||"";
      state.settings.providers[p].model=old.model||"";
      state.settings.providers[p].temperature=old.temperature!=null?old.temperature:0.8;
    }
    persistSettings();
  }else{
    state.settings=normalizeSettings(state.settings);
  }
  let dirty=false;
  for(const a of state.agents){
    const cleaned={avatar:stripEmoji(a.avatar),greeting:stripEmoji(a.greeting),persona:stripEmoji(a.persona)};
    if(a.avatar!==cleaned.avatar||a.greeting!==cleaned.greeting||a.persona!==cleaned.persona)dirty=true;
    a.avatar=cleaned.avatar||a.name.slice(0,1)||"智";
    a.greeting=cleaned.greeting;
    a.persona=cleaned.persona;
    if(a.questions)a.questions=a.questions.map(stripEmoji).filter(Boolean);
    if(a.kb)delete a.kb;
    if(a.builtin&&(a.persona==="你是一个知识渊博、耐心友善的万能助理。回答准确、条理清晰，中文交流，语气自然亲切。遇到不确定的事情会坦诚说明。"||a.greeting==="你好，我是万能助手。写作、学习、生活、编程都能帮上忙，今天想聊点什么？")){
      a.persona="";a.greeting="";a.questions=[];
      dirty=true;
    }
  }
  if(dirty)save();
  if(!state.agents.length){
    state.agents.push({id:uid(),name:"万能助手",avatar:"智",color:"#3d5a70",persona:"",greeting:"",questions:[],model:"",createdAt:Date.now(),builtin:true});

function chatUrl(base){

function buildMessages(agent,history,userText){
  const msgs=[];

  sys+="\n\n当前日期："+new Date().toLocaleDateString("zh-CN");

function inline(t){
  let s=esc(t);
  s=s.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  s=s.replace(/\*\*([^*]+)\*\*/g,"<strong>$1</strong>");
  s=s.replace(/\*([^*\n]+)\*/g,"<em>$1</em>");
  s=s.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  return s;
}
function md(t){
  if(!t)return "";
  const lines=String(t).replace(/\r/g,"").split("\n");
  let html="",inCode=false,codeBuf=[],inUl=false,inOl=false,inBq=false;
  const closeList=()=>{
    if(inUl){html+="</ul>";inUl=false;}
    if(inOl){html+="</ol>";inOl=false;}
  };
  for(const raw of lines){
    const line=raw.trimEnd();
    if(inCode){
      if(line.trim().startsWith("```")){
        html+="<pre><code>"+esc(codeBuf.join("\n"))+"</code></pre>";
        inCode=false;codeBuf=[];
      }else codeBuf.push(line);
      continue;
    }
    if(line.trim().startsWith("```")){closeList();inCode=true;continue;}
    if(inBq){
      if(!line){html+="</blockquote>";inBq=false;continue;}
      html+=esc(line)+"<br>";
      continue;
    }
    if(line.trim().startsWith(">")){
      if(!inBq){closeList();html+="<blockquote>";inBq=true;}
      const content=line.trim().replace(/^>\s?/,"");
      if(content)html+=esc(content)+"<br>";
      continue;
    }
    if(!line.trim()){closeList();html+="\n";continue;}
    const h=line.match(/^(#{1,3})\s+(.*)$/);
    if(h){closeList();const n=h[1].length;html+="<h"+n+">"+inline(h[2])+"</h"+n+">";continue;}
    const ul=line.match(/^([-*])\s+(.*)$/);
    if(ul){if(!inUl){html+="<ul>";inUl=true;}html+="<li>"+inline(ul[2])+"</li>";continue;}
    const ol=line.match(/^\d+[.、]\s+(.*)$/);
    if(ol){if(!inOl){html+="<ol>";inOl=true;}html+="<li>"+inline(ol[1])+"</li>";continue;}
    if(inUl||inOl)closeList();
    html+="<p>"+inline(line)+"</p>";
  }
  if(inCode)html+="<pre><code>"+esc(codeBuf.join("\n"))+"</code></pre>";
  if(inBq)html+="</blockquote>";
  closeList();
  return html;
}

function renderScrubber(){
  const sc=$("messages"),sb=$("scrubber");
  if(!sc||!sb)return;
  sb.innerHTML="";
  const users=sc.querySelectorAll(".msg.user");
  if(users.length<2){sb.classList.remove("show");return;}
  sb.classList.add("show");
  const h=Math.max(1,sc.scrollHeight);
  users.forEach((el,i)=>{
    const t=document.createElement("div");
    t.className="scrub-tick";
    const timeEl=el.querySelector(".msg-time");
    if(timeEl)t.title="跳转到 "+timeEl.textContent;
    t.style.top=Math.min(97,Math.max(3,el.offsetTop/h*100))+"%";
    t.addEventListener("click",()=>{
      sc.scrollTop=Math.max(0,el.offsetTop-sc.clientHeight/3);
      stickToBottom=sc.scrollHeight-sc.scrollTop-sc.clientHeight<60;

function markScrubActive(){
  const sc=$("messages"),sb=$("scrubber");
  if(!sc||!sb)return;
  const ticks=sb.children;
  const users=sc.querySelectorAll(".msg.user");
  let active=-1;
  for(let i=0;i<users.length;i++){
    if(users[i].offsetTop<=sc.scrollTop+sc.clientHeight/2)active=i;
  }
  for(let i=0;i<ticks.length;i++)ticks[i].classList.toggle("active",i===active);
}
function updateScrubberPositions(){

  markScrubActive();
}

async function streamChat(base,apiKey,payload,handlers,signal){
  const url=chatUrl(base);
  if(!url)throw new Error("Base URL 为空");
  if(!payload.model)throw new Error("模型 ID 未设置");
  const headers={"Content-Type":"application/json","Accept":"text/event-stream"};
  if(apiKey)headers["Authorization"]="Bearer "+apiKey;
  const res=await fetch(url,{method:"POST",headers,body:JSON.stringify(payload),signal});
  if(!res.ok){
    let msg="HTTP "+res.status;
    try{
      const j=await res.json();
      msg=(j.error&&(j.error.message||j.error.code))||msg;
    }catch(e){}
    throw new Error(msg);
  }
  const reader=res.body.getReader();
  const dec=new TextDecoder();
  let buf="";
  while(true){
    const {done,value}=await reader.read();
    if(done)break;
    buf+=dec.decode(value,{stream:true});
    let idx;
    while((idx=buf.indexOf("\n"))>=0){
      const line=buf.slice(0,idx).trim();
      buf=buf.slice(idx+1);
      if(!line.startsWith("data:"))continue;
      const data=line.slice(5).trim();
      if(data==="[DONE]")return;
      try{
        const j=JSON.parse(data);
        const d=j.choices&&j.choices[0]&&j.choices[0].delta;
        if(!d)continue;
        if(d.reasoning_content)handlers.onReasoning(d.reasoning_content);
        if(d.content!==undefined&&d.content!==null&&d.content!=="")handlers.onDelta(d.content);
      }catch(e){}
    }
  }
}

async function sendMessage(text){
  const a=currentAgent();
  const s=effectiveSettings(a);
  if(!a||state.generating)return;
  if(!s.baseURL&&!PROVIDERS[s.provider]){openSettings();return;}
  let base=s.baseURL||PROVIDERS[s.provider].base;
  let apiKey=s.apiKey||"";
  const input=$("input");
  if(!text)return;
  if(text.length>20000){toast("消息过长（最多 20000 字）",true);return;}
  const c=getConv(a.id);
  c.messages.push({role:"user",content:text,ts:Date.now()});
  saveConv(c);
  input.value="";
  autoResize();
  renderChat();

  const container=$("messages");
  const msgsEl=container;
  const aiMsg={role:"assistant",content:"",reasoning:"",streaming:true,ts:Date.now()};
  c.messages.push(aiMsg);
  saveConv(c);
  const aiEl=appendStreamEl(msgsEl);

  const payload=buildPayload(a,text,c.messages.slice(0,-1));
  state.generating=true;
  state.abort=new AbortController();
  setGeneratingUI(true);
  let errorMsg="";
  let lastReasoning="";
  let lastContent="";
  try{
    await streamChat(base,apiKey,payload.body,{
      onReasoning:(t)=>{lastReasoning+=t;aiMsg.reasoning=lastReasoning;updateStreamEl(aiEl,aiMsg);},
      onDelta:(t)=>{lastContent+=t;aiMsg.content=lastContent;updateStreamEl(aiEl,aiMsg);}
    },state.abort.signal);
  }catch(e){
    if(e.name==="AbortError"){
      toast("已停止生成");
    }else{
      errorMsg=(e&&e.message)||String(e);
      aiMsg.error=errorMsg;
      toast("请求失败："+errorMsg,true,5000);
    }
  }
  aiMsg.streaming=false;
  aiMsg.content=lastContent;
  if(!lastContent&&!errorMsg)aiMsg.content="（无回复内容）";
  saveConv(c);
  updateStreamEl(aiEl,aiMsg);
  state.generating=false;
  state.abort=null;
  setGeneratingUI(false);
}

  const name=$("agName").value.trim();
  if(!name){toast("请填写智能体名称",true);return;}
  const avatar=$("agAvatar").value.trim()||"智";
  const a=state.editing?getAgent(state.editing):null;
  const data={name,avatar:avatar.slice(0,2),color:getSelColor(),persona:$("agPersona").value.trim(),greeting:$("agGreeting").value.trim(),questions:collectQ(),model:$("agModel").value.trim()};
  if(a){
    Object.assign(a,data);
  }else{
    data.id=uid();data.createdAt=Date.now();
    state.agents.unshift(data);
    state.currentId=data.id;
  }
  save();
  closeOverlay("editOverlay");
  renderAgents();
  renderChat();
}
function getSelColor(){
  const sel=document.querySelector("#colorRow .color-dot.sel");
  return sel?sel.dataset.c:COLORS[0];
}

function openSettings(){
  renderProviderChips(state.settings.activeProvider||"deepseek");
  $("settingsOverlay").classList.add("show");
}
let selProvider="deepseek";
function currentProviderSettings(){
  if(!state.settings.providers[selProvider])state.settings.providers[selProvider]=mkProvider();
  return state.settings.providers[selProvider];
}
function renderProviderChips(p){
  selProvider=p;
  document.querySelectorAll("#providerChips button").forEach(b=>{
    b.classList.toggle("sel",b.dataset.p===p);
  });
  const prov=currentProviderSettings();
  const info=PROVIDERS[p];
  const keyPresets=$("keyPresets");
  keyPresets.style.display=(p==="deepseek"||p==="doubao")?"flex":"none";
  $("setKey").value=prov.apiKey||"";
  $("setBase").value=prov.baseURL||info.base;
  $("setModel").value=prov.model||"";
  $("setTemp").value=prov.temperature!=null?prov.temperature:0.8;
  $("basePresets").innerHTML='<button data-b="'+esc(info.base)+'">'+esc(info.base)+'</button>';
  const mp=$("modelPresets");
  mp.innerHTML=info.models.map(m=>'<button data-m="'+esc(m)+'">'+esc(m)+'</button>').join("");
  $("modelTip").textContent=info.tip||"";
}
function closeOverlay(id){$(id).classList.remove("show");}

document.querySelectorAll("[data-close]").forEach(b=>{
  b.addEventListener("click",()=>closeOverlay(b.dataset.close));
});
document.querySelectorAll(".overlay").forEach(o=>{
  o.addEventListener("mousedown",e=>{
    if(e.target===o)o.classList.remove("show");
  });
});
$("newAgentBtn").addEventListener("click",()=>{
  if(window.innerWidth<=760)$("sidebar").classList.remove("open");
  openEdit(null);
});
$("settingsBtn").addEventListener("click",openSettings);
$("editBtn").addEventListener("click",()=>openEdit(state.currentId));
$("clearBtn").addEventListener("click",()=>{
  const a=currentAgent();
  if(!a)return;
  if(!confirm("清空与「"+a.name+"」的对话记录？"))return;
  delConv(a.id);
  renderChat();
  toast("对话已清空");
});
$("searchInput").addEventListener("input",e=>{state.search=e.target.value;renderAgents();});
$("addQ").addEventListener("click",()=>{
  const row=document.createElement("div");
  row.className="q-row";
  const inp=document.createElement("input");
  inp.placeholder="推荐问题（选填）";
  const rm=document.createElement("button");
  rm.className="rm";rm.textContent="×";
  rm.addEventListener("click",()=>row.remove());
  row.appendChild(inp);row.appendChild(rm);
  $("qList").appendChild(row);
  inp.focus();
});
$("agAvatar").addEventListener("input",e=>{
  const p=$("agAvatarPreview");
  p.textContent=e.target.value.slice(0,2)||"智";
});
$("saveAgent").addEventListener("click",saveAgent);
$("saveSettings").addEventListener("click",()=>{
  const prov=currentProviderSettings();
  prov.apiKey=$("setKey").value.trim();
  prov.baseURL=$("setBase").value.trim();
  prov.model=$("setModel").value.trim();
  prov.temperature=Math.min(2,Math.max(0,Number($("setTemp").value)||0.8));
  state.settings.activeProvider=selProvider;
  persistSettings();
  closeOverlay("settingsOverlay");
  renderChat();
  toast("设置已保存");
});
$("exportBtn").addEventListener("click",()=>{
  const data=buildExportData();
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const url=URL.createObjectURL(blob);
  const aEl=document.createElement("a");
  aEl.href=url;
  aEl.download="agent-backup-"+new Date().toISOString().slice(0,10)+".json";
  document.body.appendChild(aEl);
  aEl.click();
  aEl.remove();
  URL.revokeObjectURL(url);
  toast("已导出配置（不含 API Key）");
});
$("importBtn").addEventListener("click",()=>{
  if(!confirm("导入将覆盖当前所有智能体、对话记录与设置，确定继续？"))return;
  $("importFile").click();
});
$("importFile").addEventListener("change",async e=>{
  const f=e.target.files[0];
  if(!f)return;
  try{
    const text=await f.text();
    applyImport(JSON.parse(text));
    toast("导入成功，已刷新数据");
  }catch(err){
    toast("导入失败："+(err.message||String(err)),true,4500);
  }
  e.target.value="";
});
$("resetBtn").addEventListener("click",factoryReset);
function buildExportData(){
  const data={
    app:"agentwork",version:2,exportedAt:new Date().toISOString(),
    settings:deepcopy(state.settings),
    agents:deepcopy(state.agents),
    conversations:state.agents.map(a=>({id:a.id,messages:getConv(a.id).messages})),
    theme:localStorage.getItem("agentwork_theme")||"light"
  };
  for(const p in data.settings.providers)data.settings.providers[p].apiKey="";
  return data;
}
function applyImport(d){
  if(!d||d.app!=="agentwork")throw new Error("不是本应用导出的配置文件");
  if(!Array.isArray(d.agents)||!d.agents.length)throw new Error("文件中没有智能体数据");
  for(const a of d.agents){
    a.avatar=stripEmoji(a.avatar)||a.name.slice(0,1)||"智";
    a.greeting=stripEmoji(a.greeting);
    a.persona=stripEmoji(a.persona);
    if(a.questions)a.questions=a.questions.map(stripEmoji).filter(Boolean);
    if(a.kb)delete a.kb;
  }
  state.agents=d.agents;
  save();
  if(d.settings&&d.settings.providers)state.settings=normalizeSettings(d.settings);
  else state.settings={providers:{deepseek:mkProvider(),doubao:mkProvider(),ollama:mkProvider(),custom:mkProvider()},activeProvider:"deepseek"};
  persistSettings();
  if(Array.isArray(d.conversations)){
    for(const c of d.conversations){
      if(c&&c.id)saveConv({id:c.id,messages:Array.isArray(c.messages)?c.messages:[]});
    }
  }
  state.currentId=state.agents[0].id;
  if(d.theme){
    localStorage.setItem("agentwork_theme",d.theme);
    document.documentElement.dataset.theme=d.theme;
  }
  updateThemeBtn();
  renderAgents();
  renderChat();
}
function factoryReset(){
  if(!confirm("确定初始化？将清空所有智能体、对话记录、模型设置与主题偏好，且无法恢复。"))return;
  if(!confirm("再次确认：所有数据都会被删除。"))return;
  localStorage.removeItem("agentwork_agents");
  localStorage.removeItem("agentwork_settings");
  localStorage.removeItem("agentwork_theme");
  const keys=[];
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k&&k.indexOf("agentwork_conv_")===0)keys.push(k);
  }
  keys.forEach(k=>localStorage.removeItem(k));
  location.reload();
}
document.querySelectorAll("#providerChips button").forEach(b=>{
  b.addEventListener("click",()=>renderProviderChips(b.dataset.p));
});
$("basePresets").addEventListener("click",e=>{
  if(e.target.dataset.b)$("setBase").value=e.target.dataset.b;
});
$("modelPresets").addEventListener("click",e=>{
  if(e.target.dataset.m)$("setModel").value=e.target.dataset.m;
});
$("keyPresets").addEventListener("click",e=>{
  if(e.target.dataset.v==="deepseek")toast("DeepSeek Key：platform.deepseek.com 的 API Keys 页面创建");
  if(e.target.dataset.v==="doubao")toast("豆包 Key：console.volcengine.com/ark 的 API Key 管理页创建（需实名）");
});
$("sendBtn").addEventListener("click",()=>{
  if(state.generating){if(state.abort)state.abort.abort();return;}
  const v=$("input").value.trim();
  if(v)sendMessage(v);
});
$("input").addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){
    e.preventDefault();
    const v=$("input").value.trim();
    if(v&&!state.generating)sendMessage(v);
    else if(state.generating){}else $("input").focus();
  }
});
$("input").addEventListener("input",autoResize);
$("messages").addEventListener("scroll",()=>{
  const sc=$("messages");
  stickToBottom=sc.scrollHeight-sc.scrollTop-sc.clientHeight<60;
  markScrubActive();
});
function updateThemeBtn(){
  const dark=document.documentElement.dataset.theme==="dark";
  $("themeBtn").textContent=dark?"浅色":"深色";
}
$("themeBtn").addEventListener("click",()=>{
  const cur=document.documentElement.dataset.theme;
  const next=cur==="dark"?"light":"dark";
  document.documentElement.dataset.theme=next;
  localStorage.setItem("agentwork_theme",next);
  updateThemeBtn();
});

let sidebarTimer=null;
document.querySelector(".brand").addEventListener("click",()=>{
  if(window.innerWidth<=760){
    $("sidebar").classList.toggle("open");
  }
});

(function init(){
  const theme=localStorage.getItem("agentwork_theme")||"light";
  document.documentElement.dataset.theme=theme;
  updateThemeBtn();
  load();
  renderAgents();
  renderChat();
  document.addEventListener("keydown",e=>{
    if(e.key==="Escape")document.querySelectorAll(".overlay.show").forEach(o=>o.classList.remove("show"));
  });
})();
})();
</script>
</body>
</html>
