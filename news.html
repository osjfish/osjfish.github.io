<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>热点聚合</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --zhu:#A93226;--zhu-light:#C0392B;--zhu-soft:#f3d9d5;
    --xuan:#FDF6E3;--xuan-dark:#F5E6C8;
    --shui:#2C3E50;--shui-light:#42576d;--line:#e7ddc4;
    --gold:#B8860B;--muted:#8a8279;
  }
  html{scrollbar-color:#c8bfa8 transparent}
  body{
    font-family:"Noto Sans SC","PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--xuan);color:var(--shui);min-height:100vh;
  }

  .top{position:sticky;top:0;z-index:100;background:var(--xuan);box-shadow:0 2px 14px rgba(0,0,0,.10)}
  .header{
    background:linear-gradient(120deg,#22303f,#2f4460 55%,#3a5270);
    padding:13px 18px 11px;
  }
  .h-top{display:flex;align-items:center;gap:12px;margin-bottom:10px}
  .back{
    color:var(--xuan);text-decoration:none;font-size:20px;line-height:1;
    width:30px;height:30px;display:flex;align-items:center;justify-content:center;
    border-radius:8px;flex-shrink:0;transition:background .2s;
  }
  .back:hover{background:rgba(255,255,255,.1)}
  .h-title{font-size:17px;font-weight:700;color:var(--xuan);letter-spacing:2px;flex:1;white-space:nowrap;overflow:hidden;display:flex;align-items:baseline;gap:10px}
  .h-title span{color:var(--zhu-light)}
  .h-time{font-size:11px;color:rgba(255,255,255,.55);font-weight:400;letter-spacing:0}
  .h-btn{
    border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.08);
    color:#fff;border-radius:8px;padding:7px 14px;font-size:12px;cursor:pointer;
    display:flex;align-items:center;gap:6px;transition:all .2s;white-space:nowrap;letter-spacing:1px;
  }
  .h-btn:hover{background:rgba(255,255,255,.16)}
  .h-btn:disabled{opacity:.45;cursor:default}
  .h-btn .sp{width:12px;height:12px;border:2px solid rgba(255,255,255,.35);border-top-color:#fff;border-radius:50%;animation:rot 1s linear infinite;display:none}
  .h-btn.loading .sp{display:inline-block}
  .h-btn.on{background:var(--zhu-light);border-color:var(--zhu-light)}
  @keyframes rot{to{transform:rotate(360deg)}}
  .search-bar{padding:0}
  .search-bar input{
    width:100%;padding:8px 12px;border:1px solid rgba(255,255,255,.15);border-radius:8px;
    background:rgba(255,255,255,.09);color:#fff;font-size:13px;outline:none;transition:border-color .2s;
  }
  .search-bar input::placeholder{color:rgba(255,255,255,.38)}
  .search-bar input:focus{border-color:var(--zhu-light)}

  .nav{max-width:860px;margin:0 auto;padding:10px 18px 12px}
  .cats{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:10px}
  .cats::-webkit-scrollbar{display:none}
  .cat{
    flex-shrink:0;padding:7px 16px;border-radius:20px;font-size:13px;font-weight:500;cursor:pointer;
    background:#fff;color:var(--shui-light);border:1px solid var(--line);
    transition:all .18s;display:flex;align-items:center;gap:6px;
  }
  .cat:hover{border-color:var(--zhu);color:var(--zhu)}
  .cat.act{background:var(--shui);color:#fff;border-color:var(--shui);box-shadow:0 3px 10px rgba(44,62,80,.25)}
  .cat .cnt{font-size:11px;opacity:.55}
  .cat.act .cnt{opacity:.65}

  .srcs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-top:10px;border-top:1px dashed var(--line)}
  .srcs::-webkit-scrollbar{display:none}
  .src{
    flex-shrink:0;padding:6px 12px;border-radius:16px;font-size:12px;cursor:pointer;
    background:#fff;color:var(--shui-light);border:1px solid var(--line);
    transition:all .18s;display:flex;align-items:center;gap:6px;
  }
  .src:hover{border-color:var(--shui-light);transform:translateY(-1px)}
  .src .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
  .src .cnt{font-size:11px;opacity:.5}
  .src.act{color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(0,0,0,.16)}
  .src.act .cnt{opacity:.8}

  .main{padding:4px 18px 48px;max-width:860px;margin:0 auto}
  .meta{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--muted);padding:12px 2px 8px;flex-wrap:wrap}
  .meta .dot{width:4px;height:4px;border-radius:50%;background:var(--zhu);opacity:.6}
  .sort-grp{margin-left:auto;display:flex;gap:6px}
  .pill{font-size:11px;padding:3px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--muted);cursor:pointer;transition:all .18s;letter-spacing:1px}
  .pill:hover{color:var(--zhu);border-color:var(--zhu)}
  .pill.on{background:var(--zhu-light);border-color:var(--zhu-light);color:#fff}

  .sec{margin-bottom:20px}
  .sec-title{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--shui);padding:2px 2px 0}
  .sec-title .bar{width:4px;height:14px;border-radius:2px;background:var(--zhu);flex-shrink:0}
  .sec-title .cnt{font-size:11px;color:var(--muted);font-weight:400;flex:1}
  .sec-title .more{font-size:11px;color:var(--zhu-light);border:none;background:none;cursor:pointer;padding:4px 8px;border-radius:8px;font-weight:500;letter-spacing:1px}
  .sec-title .more:hover{background:var(--zhu-soft)}
  .sec-items{display:flex;flex-direction:column;gap:9px}

  .morebtn{display:block;margin:16px auto 4px;padding:9px 24px;border-radius:20px;border:1px solid var(--line);background:#fff;color:var(--shui-light);font-size:12px;letter-spacing:1px;cursor:pointer;transition:all .2s}
  .morebtn:hover{border-color:var(--zhu);color:var(--zhu);box-shadow:0 4px 12px rgba(44,62,80,.08)}

  #srcs.closed .src:not(.toggle){display:none}
  .src.toggle{background:#f3ecdb;font-weight:600}

  .list{display:flex;flex-direction:column;gap:9px}
  .item{
    display:flex;align-items:flex-start;gap:11px;background:#fff;border-radius:12px;
    padding:12px 14px;cursor:pointer;text-decoration:none;color:inherit;
    border:1px solid rgba(0,0,0,.05);box-shadow:0 1px 4px rgba(44,62,80,.06);
    transition:transform .15s,box-shadow .2s,border-color .2s;
  }
  .item:hover{transform:translateY(-2px);box-shadow:0 8px 20px rgba(44,62,80,.12);border-color:rgba(44,62,80,.16)}
  .rank{
    width:28px;height:28px;border-radius:9px;flex-shrink:0;display:flex;align-items:center;justify-content:center;
    font-size:12px;font-weight:700;color:var(--muted);background:#f0ece0;margin-top:1px;
  }
  .item:nth-child(1) .rank{background:linear-gradient(135deg,#C0392B,#A93226);color:#fff}
  .item:nth-child(2) .rank{background:linear-gradient(135deg,#e67e22,#d35400);color:#fff}
  .item:nth-child(3) .rank{background:linear-gradient(135deg,#f1c40f,#B8860B);color:#fff}
  .item-body{flex:1;min-width:0}
  .item-title{font-size:14px;line-height:1.5;color:#333A45;word-break:break-word}
  .tr-badge{display:inline-block;font-size:9px;line-height:1;padding:2px 5px;border-radius:6px;background:var(--zhu-soft);color:var(--zhu);margin-left:7px;vertical-align:2px;letter-spacing:1px;font-weight:700}
  .item:hover .item-title{color:var(--zhu)}
  .item-sub{display:flex;align-items:center;gap:7px;margin-top:7px;flex-wrap:wrap}
  .src-badge{font-size:10px;padding:2px 9px;border-radius:10px;color:#fff;letter-spacing:.5px;flex-shrink:0}
  .heat{font-size:11px;color:var(--muted)}
  .heat b{color:var(--zhu-light);font-weight:600}
  .time{font-size:11px;color:#b6ad98}

  .empty{text-align:center;color:var(--muted);padding:60px 0;font-size:13px;line-height:2}

  .foot{padding:16px 18px 40px;font-size:11px;color:#b6ad98;line-height:1.9;max-width:860px;margin:0 auto}
  .foot a{color:var(--muted);text-decoration:none}
  .foot .tag{display:inline-block;color:var(--muted);border:1px solid var(--line);border-radius:10px;padding:1px 8px;margin:0 4px 4px 0}

  @media(max-width:480px){
    .header{padding:11px 12px 9px}
    .nav{padding:9px 12px 11px}
    .main{padding:2px 12px 36px}
    .h-title{font-size:15px}
    .h-btn{font-size:11px;padding:6px 10px}
    .item{padding:10px 12px}
  }
</style>
</head>
<body>
  <div class="top">
    <div class="header">
      <div class="h-top">
        <a class="back" href="./index.html" title="返回导航">&larr;</a>
        <div style="flex:1;min-width:0">
          <div class="h-title">热点<span>聚合</span></div>
          <div class="h-time" id="updateTime">数据加载中…</div>
        </div>
        <button class="h-btn" id="trBtn" title="把英文热点翻译成中文">翻译</button>
        <button class="h-btn" id="refreshBtn" title="刷新数据">刷新</button>
      </div>
      <div class="search-bar">
        <input type="search" id="searchInput" placeholder="搜索热点关键词…" autocomplete="off">
      </div>
    </div>
    <div class="nav">
      <div class="cats" id="cats"></div>
      <div class="srcs" id="srcs"></div>
    </div>
  </div>

  <div class="main">
    <div class="meta" id="meta"></div>
    <div class="list" id="list">
      <div class="empty">正在加载热点数据…</div>
    </div>
  </div>

  <div class="foot">
    <div>数据由定时任务自动聚合自公开来源，每 30 分钟自动更新，仅供学习参考；英文热点可点顶部「翻译」一键转中文。来源：</div>
    <div id="srcTags"></div>
    <div style="margin-top:8px"><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2026024789号</a> · <a href="https://beian.mps.gov.cn/#/query/webSearch?code=42010402001734" target="_blank" rel="noreferrer">鄂公网安备42010402001734号</a></div>
  </div>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const CAT_ORDER=['综合','财经','科技','社区','国际'];
  let data=null, cat='all', src=null, query='', limit=40, sortBy='hot';
  let srcCollapsed = localStorage.getItem('news_src_collapsed')==='1';
  const DIGEST_PER_SEC=6;

  const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

  const isZh = t => /[\u4e00-\u9fff]/.test(String(t||''));
  let trOn = localStorage.getItem('news_tr_on')==='1';
  let trFail = 0, translating = false;
  let trCache = {};
  try{ trCache = JSON.parse(localStorage.getItem('news_tr_cache')||'{}')||{}; }catch(e){}
  function saveTrCache(){
    try{
      const keys=Object.keys(trCache);
      if(keys.length>600){
        keys.sort((a,b)=>(trCache[a].ts||0)-(trCache[b].ts||0));
        keys.slice(0,keys.length-600).forEach(k=>delete trCache[k]);
      }
      localStorage.setItem('news_tr_cache',JSON.stringify(trCache));
    }catch(e){}
  }
  function cachedTr(t){ const c=trCache['t:'+t]; return c&&c.t?c.t:null; }
  async function translateOne(text){
    if(cachedTr(text)) return true;
    try{
      const r=await fetch('https://api.mymemory.translated.net/get?q='+encodeURIComponent(text)+'&langpair=en%7Czh-CN');
      const j=await r.json();
      const tr=j&&j.responseData&&j.responseData.translatedText;
      if(tr && tr!==text){
        trCache['t:'+text]={t:tr,ts:Date.now()};
        saveTrCache();
        return true;
      }
    }catch(e){}
    return false;
  }
  function currentTitles(){
    if(!data) return [];
    if(src) return data.items.filter(it=>it.source===src).map(it=>it.title);
    const keys = cat==='all' ? null : srcsOf(cat);
    return mergeAll(keys).map(o=>o.item.title);
  }
  async function translateVisible(){
    if(!data || translating) return;
    const titles=[...new Set(currentTitles().filter(t=>t&&!isZh(t)))];
    const pending=titles.filter(t=>!cachedTr(t));
    const btn=$('#trBtn');
    if(!pending.length){ trFail=0; render(); return; }
    translating=true; trFail=0;
    btn.classList.add('loading'); btn.disabled=true;
    let idx=0, fail=0;
    const worker=async()=>{
      while(idx<pending.length){
        const t=pending[idx++];
        if(!(await translateOne(t))) fail++;
      }
    };
    await Promise.all([worker(),worker(),worker(),worker()]);
    translating=false; trFail=fail;
    btn.classList.remove('loading'); btn.disabled=false;
    render();
  }
  function displayTitle(it){
    if(trOn && it.title && !isZh(it.title)){
      const tr=cachedTr(it.title);
      if(tr) return tr;
    }
    return it.title;
  }

  function normTitle(t){
    return String(t||'').toLowerCase().replace(/[\s\p{P}\p{S}]+/gu,'');
  }
  function fmtTime(iso){
    if(!iso) return '';
    const d=new Date(iso); if(isNaN(d)) return '';
    const s=(Date.now()-d)/1000;
    if(s<60) return '刚刚';
    if(s<3600) return Math.floor(s/60)+' 分钟前';
    if(s<86400) return Math.floor(s/3600)+' 小时前';
    const p=n=>String(n).padStart(2,'0');
    return (d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes());
  }
  function fmtHot(h){
    if(h==null||isNaN(h)) return '';
    if(h>=1e8) return (h/1e8).toFixed(1)+'亿';
    if(h>=1e4) return (h/1e4).toFixed(1)+'万';
    return String(h);
  }
  function getSrcInfo(key){
    return (data && data.sources && data.sources[key]) || {name:key,color:'#888',category:'综合',count:0};
  }
  function catsOf(){
    const keys=Object.keys(data.sources||{});
    const present=[];
    CAT_ORDER.forEach(c=>{ if(keys.some(k=>data.sources[k].category===c)) present.push(c); });
    keys.forEach(k=>{ const c=data.sources[k].category; if(!present.includes(c)) present.push(c); });
    return present;
  }
  function srcsOf(scope){
    const keys=Object.keys(data.sources||{});
    if(scope==='all') return keys;
    return keys.filter(k=>data.sources[k].category===scope);
  }

  function mergeAll(keys){
    const seen=new Map();
    const pool=keys? data.items.filter(it=>keys.includes(it.source)) : data.items;
    for(const it of pool){
      const k=normTitle(it.title);
      if(!k) continue;
      if(seen.has(k)){
        const o=seen.get(k);
        if(!o.srcs.includes(it.source)) o.srcs.push(it.source);
        const better = (it.hot!=null) && (o.hot==null || it.hot>o.hot);
        if(better){ o.hot=it.hot; o.item=it; }
      }else{
        seen.set(k,{item:it,hot:it.hot,srcs:[it.source]});
      }
    }
    return [...seen.values()];
  }

  function sortItems(arr){
    const merged = arr.length && arr[0] && arr[0].srcs;
    arr.sort((a,b)=>{
      const ta=merged?a.item.time:a.time, tb=merged?b.item.time:b.time;
      if(sortBy==='time') return String(tb||'').localeCompare(String(ta||''));
      const ha=merged?(a.hot!=null?a.hot:-1):(a.hot!=null?a.hot:-1);
      const hb=merged?(b.hot!=null?b.hot:-1):(b.hot!=null?b.hot:-1);
      if(ha!==hb) return hb-ha;
      return String(tb||'').localeCompare(String(ta||''));
    });
    return arr;
  }
  function itemsForCurrent(){
    if(!data) return [];
    if(src){
      let arr=data.items.filter(it=>it.source===src);
      if(query) arr=arr.filter(it=>normTitle(it.title).includes(query));
      return sortItems(arr);
    }
    const keys = cat==='all' ? null : srcsOf(cat);
    let arr=mergeAll(keys);
    if(query) arr=arr.filter(o=>normTitle(o.item.title).includes(query));
    return sortItems(arr);
  }

  function renderCats(){
    const cs=catsOf();
    const counts={};
    cs.forEach(c=>{ counts[c]=srcsOf(c).reduce((n,k)=>n+(data.sources[k].count||0),0); });
    let h='<div class="cat '+(cat==='all'?'act':'')+'" onclick="APP.go(\'cat\',\'all\')">全部<span class="cnt">'+data.total+'</span></div>';
    for(const c of cs){
      h+='<div class="cat '+(cat===c?'act':'')+'" onclick="APP.go(\'cat\',\''+esc(c)+'\')">'+esc(c)+'<span class="cnt">'+counts[c]+'</span></div>';
    }
    $('#cats').innerHTML=h;
  }

  function renderSrcs(){
    const scope = cat==='all' ? 'all' : cat;
    const keys=srcsOf(scope);
    const h='<div class="src toggle" title="折叠/展开来源标签" onclick="APP.toggleSrcs()">来源 '+(srcCollapsed?'▸':'▾')+'<span class="cnt">'+keys.length+'</span></div>'+
      keys.map(k=>{
        const s=data.sources[k];
        const active = src===k;
        return '<div class="src'+(active?' act':'')+'" style="'+(active?'background:'+s.color:'')+'" onclick="APP.go(\'src\',\''+k+'\')">'+
          '<span class="dot" style="background:'+(active?'rgba(255,255,255,.85)':s.color)+'"></span>'+
          esc(s.name)+'<span class="cnt" style="'+(active?'color:rgba(255,255,255,.8)':'')+'">'+s.count+'</span></div>';
      }).join('');
    $('#srcs').innerHTML=h;
    $('#srcs').classList.toggle('closed',srcCollapsed);
  }

  function badges(o){
    const srcs=o.srcs.slice(0,3).map(k=>getSrcInfo(k));
    let h=srcs.map(s=>'<span class="src-badge" style="background:'+esc(s.color)+'">'+esc(s.name)+'</span>').join('');
    if(o.srcs.length>3) h+='<span class="src-badge" style="background:#7f8c8d">+'+ (o.srcs.length-3) +'</span>';
    return h;
  }

  function bodyHTML(o){
    const it = o.srcs ? o.item : o;
    const heat=fmtHot(o.hot!=null?o.hot:it.hot);
    const t=fmtTime(it.time);
    const wantTr = trOn && it.title && !isZh(it.title);
    const trText = wantTr ? cachedTr(it.title) : null;
    let sub = o.srcs ? badges(o)
      : '<span class="src-badge" style="background:'+esc(getSrcInfo(it.source).color)+'">'+esc(getSrcInfo(it.source).name)+'</span>';
    sub += (heat?'<span class="heat">热度 <b>'+heat+'</b></span>':'')+(t?'<span class="time">'+t+'</span>':'');
    return '<div class="item-body">'+
      '<div class="item-title"'+(wantTr?' title="'+esc(it.title)+'"':'')+'>'+esc(trText||it.title)+(trText?'<span class="tr-badge">译</span>':'')+'</div>'+
      '<div class="item-sub">'+sub+'</div></div>';
  }
  function anchor(o,inner){
    const it = o.srcs ? o.item : o;
    return '<a class="item" href="'+esc(it.url||'#')+'" target="_blank" rel="noopener">'+inner+'</a>';
  }
  function renderList(){
    const all=itemsForCurrent();
    if(!all.length){
      $('#list').innerHTML='<div class="empty">'+(query?'没有匹配「'+esc(query)+'」的热点':'该分类暂无数据')+'</div>';
      return;
    }
    const shown=all.slice(0,limit);
    let h=shown.map((o,i)=>anchor(o,'<div class="rank">'+(i+1)+'</div>'+bodyHTML(o))).join('');
    if(all.length>limit) h+='<button class="morebtn" onclick="APP.more()">加载更多（剩余 '+(all.length-limit)+' 条）</button>';
    $('#list').innerHTML=h;
  }
  function renderDigest(){
    const cats=catsOf();
    let h='';
    for(const c of cats){
      const arr=sortItems(mergeAll(srcsOf(c)));
      if(!arr.length) continue;
      const top=arr.slice(0,DIGEST_PER_SEC);
      h+='<div class="sec"><div class="sec-title"><span class="bar"></span>'+esc(c)+
        '<span class="cnt">'+arr.length+' 条</span>'+
        '<button class="more" onclick="APP.go(\'cat\',\''+esc(c)+'\')">查看全部 →</button></div>'+
        '<div class="sec-items">'+top.map(o=>anchor(o,bodyHTML(o))).join('')+'</div></div>';
    }
    $('#list').innerHTML=h||'<div class="empty">暂无数据，请稍后刷新</div>';
  }
  function render(){
    if(!data){ $('#list').innerHTML='<div class="empty">暂无数据，请稍后刷新</div>'; return; }
    renderCats(); renderSrcs();
    const digest = !src && cat==='all' && !query;
    const items=itemsForCurrent();
    const scopeName = src ? getSrcInfo(src).name : (cat==='all' ? '全网' : cat);
    const srcCount = src ? 1 : (cat==='all' ? Object.keys(data.sources).length : srcsOf(cat).length);
    let trNote='';
    if(trOn){
      const titles=[...new Set(data.items.filter(it=>it.title&&!isZh(it.title)).map(it=>it.title))];
      const done=titles.filter(t=>cachedTr(t)).length;
      trNote=' · 译 '+done+'/'+titles.length;
      if(trFail && done<titles.length) trNote+='（部分受接口限流，稍后重试）';
    }
    $('#meta').innerHTML='<span class="dot"></span>'+esc(scopeName)+'热点 · '+items.length+' 条'+(items.length&&items[0]&&items[0].srcs&&!src?' · 聚合 '+srcCount+' 个来源':'')+trNote+
      '<span class="sort-grp">'+
        '<button class="pill'+(sortBy==='hot'?' on':'')+'" onclick="APP.sort(\'hot\')">热度</button>'+
        '<button class="pill'+(sortBy==='time'?' on':'')+'" onclick="APP.sort(\'time\')">最新</button>'+
      '</span>';
    if(digest) renderDigest(); else renderList();
  }

  function setUpdated(){
    $('#updateTime').textContent = data ? '更新于 '+fmtTime(data.updated_at) : '数据加载中…';
  }

  function renderTags(){
    const keys=Object.keys(data.sources||{});
    const catMap={};
    keys.forEach(k=>{ const c=data.sources[k].category; (catMap[c]=catMap[c]||[]).push(data.sources[k].name); });
    let h='';
    Object.keys(catMap).forEach(c=>{ h+='<div><span class="tag">'+esc(c)+'</span>'+esc(catMap[c].join('、'))+'</div>'; });
    $('#srcTags').innerHTML=h;
  }

  function refresh(){
    const btn=$('#refreshBtn');
    btn.classList.add('loading'); btn.disabled=true;
    fetch('./news_data.json?t='+Date.now())
      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })
      .then(d=>{ data=d; setUpdated(); renderTags(); render(); if(trOn) translateVisible(); })
      .catch(()=>{ $('#list').innerHTML='<div class="empty">数据加载失败，请稍后重试</div>'; })
      .finally(()=>{ btn.classList.remove('loading'); btn.disabled=false; });
  }

  window.APP={
    go:function(scope,k){
      if(scope==='cat'){ cat=k; src=null; }
      else { src = (src===k ? null : k); }
      limit=40; render();
    },
    more:function(){ limit+=40; render(); },
    sort:function(s){ sortBy=s; limit=40; render(); },
    toggleSrcs:function(){
      srcCollapsed=!srcCollapsed;
      localStorage.setItem('news_src_collapsed',srcCollapsed?'1':'0');
      renderSrcs();
    }
  };

  $('#refreshBtn').addEventListener('click',refresh);
  $('#searchInput').addEventListener('input',function(){ query=this.value.trim().toLowerCase(); limit=40; render(); });

  const trBtn=$('#trBtn');
  if(trOn){ trBtn.classList.add('on'); trBtn.textContent='原文'; }
  trBtn.addEventListener('click',function(){
    trOn=!trOn;
    localStorage.setItem('news_tr_on',trOn?'1':'0');
    this.classList.toggle('on',trOn);
    this.textContent=trOn?'原文':'翻译';
    if(trOn) translateVisible(); else render();
  });

  refresh();
  setInterval(refresh,5*60*1000);
})();
</script>
</body>
</html>
