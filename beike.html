            line-height: 1.6;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif, "Noto Sans SC";
        }
        .markdown-body h1, .markdown-body h2, .markdown-body h3, .markdown-body h4, .markdown-body h5, .markdown-body h6 {
            font-family: Georgia, Cambria, "Times New Roman", "Noto Serif SC", serif;
            font-weight: bold;
            color: #8b3a3a;
            margin-top: 1.2em;
            margin-bottom: 0.6em;
        }
        .markdown-body h1 { font-size: 1.5em; }
        .markdown-body h2 { font-size: 1.3em; }
        .markdown-body h3 { font-size: 1.1em; }
        .markdown-body p { margin-bottom: 0.8em; }
        .markdown-body strong {
            color: #8b3a3a;
            font-weight: 700;
        }
        .markdown-body em {
            color: #8b7355;
        }
        .markdown-body del {
            color: #a89f91;
        }
        .markdown-body a {
            color: #8b3a3a;
            text-decoration: underline;
            text-underline-offset: 2px;
        }
        .markdown-body ul, .markdown-body ol {
            padding-left: 1.5em;
            margin-bottom: 0.8em;
        }
        .markdown-body ul { list-style-type: disc; }
        .markdown-body ol { list-style-type: decimal; }
        .markdown-body pre {
            background-color: #f5eedf;
            padding: 1em;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 0.8em;
        }
        .markdown-body code {
            background-color: #f5eedf;
            padding: 0.2em 0.4em;
            border-radius: 4px;
            font-family: monospace;
            font-size: 0.9em;
        }
        .markdown-body pre code {
            background-color: transparent;
            padding: 0;
        }
        .markdown-body blockquote {
            border-left: 4px solid #c9b896;
            padding-left: 1em;
            color: #8b7355;
            margin: 0 0 0.8em 0;
        }
        
        /* 动画效果 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .card-appear {
            animation: fadeIn 0.4s ease-out forwards;
        }
        body.has-fullscreen .card-appear {
            transform: none !important;
            animation: none !important;
        }
        
        @keyframes toastIn {
            from { transform: translate(-50%, -20px); opacity: 0; }
            to { transform: translate(-50%, 0); opacity: 1; }
        }
        .toast-animate {
            animation: toastIn 0.3s cubic-bezier(0.18, 0.89, 0.32, 1.28) forwards;
        }

        /* 滚动条美化 */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(237, 224, 204, 0.3);
        }
        ::-webkit-scrollbar-thumb {
            background: #c9b896;
            border-radius: 3px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #8b7355;
        }
    </style>

不要有表格、列表，可以有目录，目录层级格式依次是“一、（一）、1、（1）”。

{拓展}
请为上面{学段}的文章{课题}（{作者}）生成教案，要求如下：

一、教案通用要求
1. 语言简洁准确，逻辑清晰，符合教学实际，可直接用于课堂教学
2. 所有环节紧扣教学目标，体现教-学-评一体化
3. 突出学生主体地位，设计充分的学生活动与思辨环节
4. 落实立德树人根本任务，体现语文核心素养的培养
5. 精准计时，每个环节有明确的时间分配，每课时40分钟

二、基本格式与分项要求
1. 标题
格式：课文题目加副标题，副标题点明核心主线或教学立意
要求：简洁醒目，突出教学核心，体现文本特色
示例：湖心亭看雪 雪落湖心 云端寄梦

2. 教学指导思想
要求：
第一条必须明确立德树人根本任务，紧扣义务教育语文课程核心素养与对应学习任务群
包含工具性与人文性统一、学生主体地位、思维与审美并重、文化传承与当代转化五个核心维度
语言规范，符合新课标表述，不写空话套话

3. 内容分析
分四个子部分：
文本定位：明确课文版本、册次、单元、文体地位、教学价值
核心内容与层次：提炼贯穿全文的核心主线，分3到4层递进解读，每层明确对应文本内容与核心内涵
艺术特色：结合文本具体手法，如白描、欲扬先抑、细节描写等，说明其表达效果
育人价值：对应四个核心素养，说明本课在语言、思维、审美、文化方面的育人意义

4. 学情分析
分三个子部分：
已有基础：结合对应学段学生的认知特点、知识储备、能力水平、生活经验
学习难点：具体明确，不泛泛而谈，针对学生容易误解、难以理解的内容
教学对策：针对学习难点一一对应，提出具体可操作的教学方法与支架

5. 教学目标
严格按照四个核心素养维度撰写：
语言建构与运用：具体可测，明确学生需要掌握的字词、手法、语言表达能力
思维发展与提升：明确培养的思维能力，如文本细读、辩证思维、归纳概括等
审美鉴赏与创造：明确学生需要感受的美，如形象美、语言美、意境美等
文化传承与理解：明确本课需要传承的文化内涵与价值观念
要求：目标具体、可操作、可评价，不写模糊空泛的表述

6. 教学重难点
重点：学生必须掌握的基础知识、核心技能、主要内容
难点：学生难以理解的深层内涵、容易混淆的概念、需要高阶思维的内容
要求：重点与难点区分明确，不重复，难点要有对应的教学突破策略

7. 教学过程 核心部分
格式：每个环节包含环节名称、时间分配、教师活动、学生活动、设计意图
要求：
整体结构：导入新课 抛出核心主问题 自主分享 初识文本 精细品读 3到4层递进解读 核心追问 突破难点 总结拓展 回应主问题加当代延伸
核心主问题：贯穿全文，有思辨性，能统领所有教学环节
精细品读：每层紧扣文本细节，引用原文关键语句，层层深入
核心追问：直击教学难点，引导学生深度思考，升华主题
学生活动：设计自主发言、圈点批注、分组讨论、朗读感悟等多种形式
设计意图：说明每个环节的设计目的，对应教学目标与重难点

8. 作业布置
分三个层次，体现分层教学：
基础层：面向全体学生，巩固基础知识与核心内容，要求明确具体
拔高层：面向中等以上学生，提升能力，拓展思维
拓展层：面向学有余力的学生，联系生活，实现文化传承与转化
要求：作业量适中，有明确的字数、内容要求，可评价

9. 板书设计
要求：
简洁明了，逻辑清晰，突出核心主问题、教学主线、关键内容
结构对称，重点突出，便于学生记录与理解
体现教学立意，不只是知识点的罗列

10. 评价量表
分四个评价维度，每个维度对应四个等级：
第一个维度 文本分析
优秀：精准赏析2处以上细节，紧扣教学主线，理解深层内涵
良好：赏析1处细节，理清内容脉络，基本理解核心内容
合格：能找到相关细节，内容梳理较浅
待改进：无细节引用，分析脱离文本

第二个维度 观点表达
优秀：观点鲜明，逻辑清晰，有自己的独特见解
良好：观点明确，逻辑通顺，能说明核心观点
合格：观点较模糊，表达基本通顺
待改进：观点混乱，理解存在偏差

第三个维度 文化理解
优秀：准确理解文化内涵，能联系生活谈当代价值
良好：基本理解文化内涵，有一定的思考
合格：对文化内涵有初步认知
待改进：对文化内涵理解有误或未提及

第四个维度 作业完成
优秀：按时完成，字数达标，内容准确有深度
