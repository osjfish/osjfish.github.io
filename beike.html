            教案: `{原文}

请为上面{学段}的文章{课题}（{作者}）生成教案，要求如下：

一、教案通用要求
1. 语言简洁准确，逻辑清晰，符合教学实际，可直接用于课堂教学
2. 所有环节紧扣教学目标，体现教-学-评一体化
3. 突出学生主体地位，设计充分的学生活动与思辨环节
4. 落实立德树人根本任务，体现语文核心素养的培养
5. 精准计时，每个环节有明确的时间分配，每课时40分钟

二、基本格式与分项要求
1. 标题
格式：课文题目加副标题，副标题点明核心主线或教学立意
要求：简洁醒目，突出教学核心，体现文本特色
示例：湖心亭看雪 雪落湖心 云端寄梦

2. 教学指导思想
要求：
第一条必须明确立德树人根本任务，紧扣义务教育语文课程核心素养与对应学习任务群
包含工具性与人文性统一、学生主体地位、思维与审美并重、文化传承与当代转化五个核心维度
语言规范，符合新课标表述，不写空话套话

3. 内容分析
分四个子部分：
文本定位：明确课文版本、册次、单元、文体地位、教学价值
核心内容与层次：提炼贯穿全文的核心主线，分3到4层递进解读，每层明确对应文本内容与核心内涵
艺术特色：结合文本具体手法，如白描、欲扬先抑、细节描写等，说明其表达效果
育人价值：对应四个核心素养，说明本课在语言、思维、审美、文化方面的育人意义

4. 学情分析
分三个子部分：
已有基础：结合对应学段学生的认知特点、知识储备、能力水平、生活经验
学习难点：具体明确，不泛泛而谈，针对学生容易误解、难以理解的内容
教学对策：针对学习难点一一对应，提出具体可操作的教学方法与支架

5. 教学目标
严格按照四个核心素养维度撰写：
语言建构与运用：具体可测，明确学生需要掌握的字词、手法、语言表达能力
思维发展与提升：明确培养的思维能力，如文本细读、辩证思维、归纳概括等
审美鉴赏与创造：明确学生需要感受的美，如形象美、语言美、意境美等
文化传承与理解：明确本课需要传承的文化内涵与价值观念
要求：目标具体、可操作、可评价，不写模糊空泛的表述

6. 教学重难点
重点：学生必须掌握的基础知识、核心技能、主要内容
难点：学生难以理解的深层内涵、容易混淆的概念、需要高阶思维的内容
要求：重点与难点区分明确，不重复，难点要有对应的教学突破策略

7. 教学过程 核心部分
格式：每个环节包含环节名称、时间分配、教师活动、学生活动、设计意图
要求：
整体结构：导入新课 抛出核心主问题 自主分享 初识文本 精细品读 3到4层递进解读 核心追问 突破难点 总结拓展 回应主问题加当代延伸
核心主问题：贯穿全文，有思辨性，能统领所有教学环节
精细品读：每层紧扣文本细节，引用原文关键语句，层层深入
核心追问：直击教学难点，引导学生深度思考，升华主题
学生活动：设计自主发言、圈点批注、分组讨论、朗读感悟等多种形式
设计意图：说明每个环节的设计目的，对应教学目标与重难点

8. 作业布置
分三个层次，体现分层教学：
基础层：面向全体学生，巩固基础知识与核心内容，要求明确具体
拔高层：面向中等以上学生，提升能力，拓展思维
拓展层：面向学有余力的学生，联系生活，实现文化传承与转化
要求：作业量适中，有明确的字数、内容要求，可评价

9. 板书设计
要求：
简洁明了，逻辑清晰，突出核心主问题、教学主线、关键内容
结构对称，重点突出，便于学生记录与理解
体现教学立意，不只是知识点的罗列

10. 评价量表
分四个评价维度，每个维度对应四个等级：
第一个维度 文本分析
优秀：精准赏析2处以上细节，紧扣教学主线，理解深层内涵
良好：赏析1处细节，理清内容脉络，基本理解核心内容
合格：能找到相关细节，内容梳理较浅
待改进：无细节引用，分析脱离文本

第二个维度 观点表达
优秀：观点鲜明，逻辑清晰，有自己的独特见解
良好：观点明确，逻辑通顺，能说明核心观点
合格：观点较模糊，表达基本通顺
待改进：观点混乱，理解存在偏差

第三个维度 文化理解
优秀：准确理解文化内涵，能联系生活谈当代价值
良好：基本理解文化内涵，有一定的思考
合格：对文化内涵有初步认知
待改进：对文化内涵理解有误或未提及

第四个维度 作业完成
优秀：按时完成，字数达标，内容准确有深度
良好：按时完成，字数基本达标，内容较完整
合格：基本完成，字数不符，内容较简单
待改进：未完成或抄袭他人作业

        const buildTOC = (text) => {
            const lines = text.split('\n');
            const toc = [];
            let hasTOC = false;
            lines.forEach(line => {
                if (line.trim() === '[TOC]') hasTOC = true;
                const match = line.match(/^(#{1,6})\s+(.+)$/);
                if (match) {
                    const level = match[1].length;
                    const title = match[2];
                    const indent = '    '.repeat(level - 1);
                    toc.push(`${indent}- ${title}`);
                }
            });
            if (!hasTOC || toc.length === 0) return text;
            return text.replace('[TOC]', toc.join('\n'));
        };

        const ensurePrecomposedPinyin = (str) => {
            if (typeof str !== 'string') return str;
            let res = str.normalize('NFC');
            // Explicitly map standard combining accents or spacer macrons to precomposed characters
            const replacements = [
                // First Tone (Macron, \u0304 or spacing \u02C9, or standard \u00AF)
                { regex: /a[\u0304\u02C9\u00AF]/g, rep: 'ā' },
                { regex: /e[\u0304\u02C9\u00AF]/g, rep: 'ē' },
                { regex: /i[\u0304\u02C9\u00AF]/g, rep: 'ī' },
                { regex: /o[\u0304\u02C9\u00AF]/g, rep: 'ō' },
                { regex: /u[\u0304\u02C9\u00AF]/g, rep: 'ū' },
                { regex: /ü[\u0304\u02C9\u00AF]/g, rep: 'ǖ' },
                { regex: /u\u0308[\u0304\u02C9\u00AF]/g, rep: 'ǖ' },
                { regex: /v[\u0304\u02C9\u00AF]/g, rep: 'ǖ' },
                
                { regex: /A[\u0304\u02C9\u00AF]/g, rep: 'Ā' },
                { regex: /E[\u0304\u02C9\u00AF]/g, rep: 'Ē' },
                { regex: /I[\u0304\u02C9\u00AF]/g, rep: 'Ī' },
                { regex: /O[\u0304\u02C9\u00AF]/g, rep: 'Ō' },
                { regex: /U[\u0304\u02C9\u00AF]/g, rep: 'Ū' },
                { regex: /Ü[\u0304\u02C9\u00AF]/g, rep: 'Ǖ' },
                { regex: /U\u0308[\u0304\u02C9\u00AF]/g, rep: 'Ǖ' },
                { regex: /V[\u0304\u02C9\u00AF]/g, rep: 'Ǖ' },

                // Second Tone (Acute, \u0301)
                { regex: /a\u0301/g, rep: 'á' },
                { regex: /e\u0301/g, rep: 'é' },
                { regex: /i\u0301/g, rep: 'í' },
                { regex: /o\u0301/g, rep: 'ó' },
                { regex: /u\u0301/g, rep: 'ú' },
                { regex: /ü\u0301/g, rep: 'ǘ' },
                { regex: /u\u0308\u0301/g, rep: 'ǘ' },
                { regex: /v\u0301/g, rep: 'ǘ' },

                { regex: /A\u0301/g, rep: 'Á' },
                { regex: /E\u0301/g, rep: 'É' },
                { regex: /I\u0301/g, rep: 'Í' },
                { regex: /O\u0301/g, rep: 'Ó' },
                { regex: /U\u0301/g, rep: 'Ú' },

                // Third Tone (Caron, \u030c)
                { regex: /a\u030c/g, rep: 'ǎ' },
                { regex: /e\u030c/g, rep: 'ě' },
                { regex: /i\u030c/g, rep: 'ǐ' },
                { regex: /o\u030c/g, rep: 'ǒ' },
                { regex: /u\u030c/g, rep: 'ǔ' },
                { regex: /ü\u030c/g, rep: 'ǚ' },
                { regex: /u\u0308\u030c/g, rep: 'ǚ' },
                { regex: /v\u030c/g, rep: 'ǚ' },

                { regex: /A\u030c/g, rep: 'Ǎ' },
                { regex: /E\u030c/g, rep: 'Ě' },
                { regex: /I\u030c/g, rep: 'Ǐ' },
                { regex: /O\u030c/g, rep: 'Ǒ' },
                { regex: /U\u030c/g, rep: 'Ǔ' },

                // Fourth Tone (Grave, \u0300)
                { regex: /a\u0300/g, rep: 'à' },
                { regex: /e\u0300/g, rep: 'è' },
                { regex: /i\u0300/g, rep: 'ì' },
                { regex: /o\u0300/g, rep: 'ò' },
                { regex: /u\u0300/g, rep: 'ù' },
                { regex: /ü\u0300/g, rep: 'ǜ' },
                { regex: /u\u0308\u0300/g, rep: 'ǜ' },
                { regex: /v\u0300/g, rep: 'ǜ' },

                { regex: /A\u0300/g, rep: 'À' },
                { regex: /E\u0300/g, rep: 'È' },
                { regex: /I\u0300/g, rep: 'Ì' },
                { regex: /O\u0300/g, rep: 'Ò' },
                { regex: /U\u0300/g, rep: 'Ù' }
            ];

            replacements.forEach(({ regex, rep }) => {
                res = res.replace(regex, rep);
            });
            return res;
        };

        const cleanHtml = (text) => {
            if (!text || typeof text !== 'string') return '';
            let clean = text.trim();
            clean = clean.replace(/^```(html)?\s*/i, '');
            clean = clean.replace(/```\s*$/, '');
            return clean.trim();
        };

        const MarkdownEditorPane = ({ section, content, onChange, onClear, onFormat, onGenerate, isGenerating, showToast }) => {
            const [isFullscreen, setIsFullscreen] = useState(false);
            const [mode, setMode] = useState('preview'); // 'edit' | 'preview'
            const [showCopyMenu, setShowCopyMenu] = useState(false);
            
            const textareaRef = React.useRef(null);
            const previewContainerRef = React.useRef(null);

            useEffect(() => {
                if (isFullscreen) {
                    document.body.style.overflow = 'hidden';
                    document.body.classList.add('has-fullscreen');
                } else {
                    document.body.style.overflow = '';
                    document.body.classList.remove('has-fullscreen');
                }
                return () => { 
                    document.body.style.overflow = ''; 
                    document.body.classList.remove('has-fullscreen');
                };
            }, [isFullscreen]);

            const [prevGenerating, setPrevGenerating] = useState(isGenerating);

            useEffect(() => {
                if (prevGenerating && !isGenerating && content) {
                    setMode('preview');
                }
                setPrevGenerating(isGenerating);
            }, [isGenerating, content, prevGenerating]);

            const headings = useMemo(() => {
                const text = content || '';
                const lines = text.split('\n');
                const list = [];
                const hasMarkdown = lines.some(line => /^(#{1,6})\s+(.+)$/.test(line));
                
                lines.forEach((line, index) => {
                    const trimmed = line.trim();
                    if (trimmed.length === 0 || trimmed.length > 80) return;
                    
                    const mdMatch = line.match(/^(#{1,6})\s+(.+)$/);
                    if (mdMatch) {
                        const depth = mdMatch[1].length;
                        const title = mdMatch[2].trim();
                        const charIndex = lines.slice(0, index).join('\n').length + (index > 0 ? 1 : 0);
                        list.push({
                            id: `h-md-${list.length}`,
                            type: 'md',
                            depth,
                            title,
                            charIndex,
                            length: line.length
                        });
                        return;
                    }
                    
                    if (!hasMarkdown) {
                        const cnMatch1 = trimmed.match(/^([一二三四五六七八九十百一]+[、])\s*(.+)$/);
                        if (cnMatch1) {
                            const title = cnMatch1[1] + cnMatch1[2].trim();
                            const charIndex = lines.slice(0, index).join('\n').length + (index > 0 ? 1 : 0);
                            list.push({
                                id: `h-cn1-${list.length}`,
                                type: 'cn1',
                                depth: 1,
                                title,
                                charIndex,
                                length: line.length
                            });
                            return;
                        }
                        
                        const cnMatch2 = trimmed.match(/^([（\(][一二三四五六七八九十百一]+[）\)])\s*(.+)$/);
                        if (cnMatch2) {
                            const title = cnMatch2[1] + cnMatch2[2].trim();
                            const charIndex = lines.slice(0, index).join('\n').length + (index > 0 ? 1 : 0);
                            list.push({
                                id: `h-cn2-${list.length}`,
                                type: 'cn2',
                                depth: 2,
                                title,
                                charIndex,
                                length: line.length
                            });
                            return;
                        }
                    }
                });
                return list;
            }, [content]);

            const getMarkdownHTML = (text) => {
                if (!text) return '<div class="text-[#8b7355] opacity-50 italic">暂无内容，请点击「编辑」输入或点击「生成」</div>';
                let t = typeof text === 'string' ? ensurePrecomposedPinyin(text) : text;
                t = buildTOC(t);
                
                const renderer = new marked.Renderer();
                renderer.heading = function(...args) {
                    let hText = '';
                    let depth = 1;
                    if (args[0] && typeof args[0] === 'object') {
                        hText = args[0].text || '';
                        depth = args[0].depth || 1;
                    } else {
                        hText = args[0] || '';
                        depth = args[1] || 1;
                    }
                    const cleanText = hText.replace(/<[^>]*>/g, '');
                    const id = 'heading-' + cleanText.trim().replace(/[^a-zA-Z0-9\u4e00-\u9fa5]+/g, '-').toLowerCase();
                    return `<h${depth} id="${id}">${hText}</h${depth}>`;
                };

                const html = marked.parse(t, { renderer, breaks: true });
                return DOMPurify.sanitize(html, { ADD_ATTR: ['class', 'target', 'id'] });
            };

            const handleHeadingClick = (heading) => {
                if (mode === 'edit') {
                    if (textareaRef.current) {
                        textareaRef.current.focus();
                        const pos = heading.charIndex;
                        textareaRef.current.setSelectionRange(pos, pos + heading.length);
                        
                        // Scroll textarea
                        const totalChars = (content || '').length || 1;
                        const scrollRatio = pos / totalChars;
                        textareaRef.current.scrollTop = textareaRef.current.scrollHeight * scrollRatio - (textareaRef.current.clientHeight / 3);
                    }
                } else {
                    if (previewContainerRef.current) {
                        let element = null;
                        if (heading.type === 'md') {
                            const safeTitle = heading.title.replace(/<[^>]*>/g, '');
                            const id = 'heading-' + safeTitle.trim().replace(/[^a-zA-Z0-9\u4e00-\u9fa5]+/g, '-').toLowerCase();
                            element = previewContainerRef.current.querySelector('#' + id);
                        }
                        if (!element) {
                            const elements = Array.from(previewContainerRef.current.querySelectorAll('h1, h2, h3, h4, h5, h6, p, div, li, span'));
                            element = elements.find(el => {
                                const text = (el.textContent || '').trim();
                                return text === heading.title || text.includes(heading.title);
                            });
                        }
                        if (element) {
                            element.scrollIntoView({ behavior: 'smooth', block: 'center' });
                        }
                    }
                }
            };

            const handleCopy = async (type) => {
                try {
                    if (type === 'markdown') {
                        await navigator.clipboard.writeText(content || '');
                        showToast('已复制 Markdown 纯文本');
                    } else if (type === 'plain') {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = getMarkdownHTML(content || '');
                        const text = tempDiv.innerText || tempDiv.textContent;
                        await navigator.clipboard.writeText(text);
                        showToast('已复制纯文本（去除 Markdown 符号）');
                    } else if (type === 'rich') {
                        const tempDiv = document.createElement('div');
                        tempDiv.innerHTML = getMarkdownHTML(content || '');
                        if (navigator.clipboard.write) {
                            const blobHtml = new Blob([tempDiv.innerHTML], { type: 'text/html' });
                            const blobText = new Blob([tempDiv.innerText || tempDiv.textContent], { type: 'text/plain' });
                            const item = new window.ClipboardItem({
                                'text/html': blobHtml,
                                'text/plain': blobText
                            });
                            await navigator.clipboard.write([item]);
                            showToast('已复制富文本');
                        } else {
                            await navigator.clipboard.writeText(tempDiv.innerText || tempDiv.textContent);
                            showToast('当前浏览器不支持富文本复制，已降级复制为纯文本');
                        }
                    }
                } catch(e) {
                    console.error(e);
                    showToast('复制失败：' + e.message, 'error');
                }
                setShowCopyMenu(false);
            };

            const wrapClass = isFullscreen 
                ? "fixed inset-0 z-[100] bg-[#fdf6ec] p-6 flex flex-col"
                : "flex flex-col h-[400px] bg-[#fffaf4] p-4 rounded-xl border border-[#ddd0c0]";

            return (
                <div className={wrapClass}>
                    <div className={`flex flex-col xl:flex-row justify-between items-start xl:items-center gap-2 xl:gap-0 mb-3 ${isFullscreen ? 'border-b border-[#ddd0c0] pb-4' : ''}`}>
                       <div className="flex items-center justify-between w-full xl:w-auto gap-3">
                           <h3 className="font-serif font-bold text-[#8b3a3a] text-lg">{section}</h3>
                           <div className="flex bg-[#ede0cc]/40 rounded-lg p-1 border border-[#ddd0c0]/50">
                               <button onClick={() => setMode('edit')} className={`px-3 py-1 text-xs rounded-md font-bold transition-all ${mode === 'edit' ? 'bg-white text-[#8b3a3a] shadow-sm' : 'text-[#8b7355] hover:bg-[#fffaf4]'}`}>
                                   编辑
                               </button>
                               <button onClick={() => setMode('preview')} className={`px-3 py-1 text-xs rounded-md font-bold transition-all ${mode === 'preview' ? 'bg-white text-[#8b3a3a] shadow-sm' : 'text-[#8b7355] hover:bg-[#fffaf4]'}`}>
                                   预览
                               </button>
                           </div>
                       </div>
                       
                       <div className="flex flex-wrap gap-1.5 xl:gap-2 relative w-full xl:w-auto justify-end">
                           <button onClick={() => setIsFullscreen(!isFullscreen)} className="px-2 xl:px-3 py-1 text-xs rounded-lg border border-[#ddd0c0] text-[#8b7355] hover:bg-[#ede0cc] transition-all flex items-center gap-1">
                               <Icon name={isFullscreen ? "Minimize" : "Maximize"} className="w-3.5 h-3.5" />
                               <span className="hidden sm:inline">{isFullscreen ? '退出' : '全屏'}</span>
                           </button>

                           {section === '课件' && (
                               <button onClick={() => {
                                   const blob = new Blob([cleanHtml(content)], { type: 'text/html;charset=utf-8' });
                                   const url = URL.createObjectURL(blob);
                                   const a = document.createElement('a');
                                   a.href = url;
                                   a.download = `课件_${new Date().toISOString().slice(0, 10)}.html`;
                                   a.click();
                                   URL.revokeObjectURL(url);
                               }} className="px-2 xl:px-3 py-1 text-xs rounded-lg border border-[#a63d40]/30 bg-[#fffaf4] text-[#a63d40] hover:bg-[#a63d40]/10 transition-all flex items-center gap-1">
                                   <Icon name="Download" className="w-3.5 h-3.5" />
                                   <span className="hidden sm:inline">导出HTML</span>
                               </button>
                           )}
                           
                           {section !== '课件' && (
                               <div className="relative">
                                   <button onClick={() => setShowCopyMenu(!showCopyMenu)} className="px-2 xl:px-3 py-1 text-xs rounded-lg border border-[#ddd0c0] text-[#8b7355] hover:bg-[#ede0cc] transition-all flex items-center gap-1">
                                       复制 <Icon name="ChevronDown" className="w-3.5 h-3.5" />
                                   </button>
                               {showCopyMenu && (
                                   <div className="absolute right-0 mt-2 w-48 bg-white border border-[#ddd0c0] rounded-lg shadow-xl z-50 overflow-hidden">
                                       <button onClick={() => handleCopy('markdown')} className="w-full text-left px-4 py-2 text-xs text-[#5c3d2e] hover:bg-[#fffaf4] border-b border-[#ddd0c0]/50">复制 Markdown</button>
                                       <button onClick={() => handleCopy('rich')} className="w-full text-left px-4 py-2 text-xs text-[#5c3d2e] hover:bg-[#fffaf4] border-b border-[#ddd0c0]/50">复制带格式的富文本</button>
                                       <button onClick={() => handleCopy('plain')} className="w-full text-left px-4 py-2 text-xs text-[#5c3d2e] hover:bg-[#fffaf4]">复制无符号纯文本</button>
                                   </div>
                               )}
                           </div>
                           )}
        
                           <button onClick={onClear} className="px-2 xl:px-3 py-1 text-xs rounded-lg border border-[#ddd0c0] text-[#8b7355] hover:bg-[#ede0cc] transition-all">清空</button>
                           {section !== '课件' && (
                               <button onClick={onFormat} className="px-2 xl:px-3 py-1 text-xs rounded-lg border border-[#ddd0c0] text-[#8b7355] hover:bg-[#ede0cc] transition-all">整理</button>
                           )}
                           <button onClick={onGenerate} disabled={isGenerating} className="px-2 xl:px-3 py-1 text-xs rounded-lg border border-[#8b3a3a] text-[#8b3a3a] hover:bg-[#8b3a3a] hover:text-white transition-all flex items-center gap-1">
                               {isGenerating ? <Icon name="Loader2" className="animate-spin w-3.5 h-3.5" /> : <Icon name="Sparkles" className="w-3.5 h-3.5" />}
                               生成
                           </button>
                       </div>
                    </div>
                    
                    <div className="flex-grow flex relative overflow-hidden bg-white border border-[#ddd0c0] rounded-lg">
                        <div className="flex-grow relative h-full">
                            {mode === 'edit' ? (
                               <textarea 
                                   ref={textareaRef}
                                   className="w-full h-full p-4 text-sm focus:ring-1 focus:ring-[#8b3a3a] outline-none resize-none bg-transparent absolute inset-0 font-mono text-[#3d2b1f]" 
                                   value={content || ''} 
                                   onChange={e => onChange(e.target.value)} 
                                   placeholder={`在这里输入或生成${section}内容...`}
                               />
                            ) : section === '课件' ? (
                               <iframe
                                   className="w-full h-full border-0 absolute inset-0 bg-white"
                                   srcDoc={cleanHtml(content) || '<div style="color:#8b7355; opacity:0.5; font-style:italic; padding:1rem;">暂无课件内容，请点击「编辑」输入或点击「生成」</div>'}
                                   sandbox="allow-scripts"
                               />
                            ) : (
                               <div 
                                   ref={previewContainerRef}
                                   className="w-full h-full p-4 text-sm overflow-y-auto markdown-body text-[#3d2b1f] absolute inset-0 text-justify"
                                   dangerouslySetInnerHTML={{ __html: getMarkdownHTML(content) }}
                               />
                            )}
                        </div>

                        {isFullscreen && headings.length > 0 && (
                            <div className="w-56 md:w-64 shrink-0 border-l border-[#ddd0c0]/80 bg-[#fffaf4]/60 p-4 flex flex-col h-full select-none overflow-y-auto font-sans">
                                <div className="text-xs font-serif font-bold text-[#8b3a3a] uppercase tracking-wider mb-3 pb-1 border-b border-[#ddd0c0]/50 flex items-center gap-1.5 shrink-0">
                                    <Icon name="BookOpen" className="w-3.5 h-3.5" />
                                    <span>大纲目录</span>
                                </div>
                                <div className="flex-grow overflow-y-auto space-y-1.5 pr-1">
                                    {headings.map(h => {
                                        const depthClass = h.depth === 1 ? 'font-medium pl-0 text-sm text-[#5c3d2e]' :
                                                           h.depth === 2 ? 'pl-3 text-xs text-[#5c3d2e] opacity-90' :
                                                           h.depth === 3 ? 'pl-6 text-xs text-[#8b7355]' :
                                                           'pl-9 text-[11px] text-[#8b7355] opacity-80';
                                        return (
                                            <button
                                                key={h.id}
                                                onClick={() => handleHeadingClick(h)}
                                                className={`w-full text-left truncate py-1.5 px-2 rounded-lg hover:bg-[#8b3a3a]/5 hover:text-[#8b3a3a] transition-all cursor-pointer ${depthClass}`}
                                                title={h.title}
                                            >
                                                {h.title}
                                            </button>
                                        );
                                    })}
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        function App() {
            const [lessons, setLessons] = useState([]);
            const [selectedLessonId, setSelectedLessonId] = useState(null);
            const [aiConfig, setAiConfig] = useState({
                provider: 'deepseek',
                deepSeekApiKey: '',
                deepSeekModel: 'deepseek-v4-flash',
                doubaoApiKey: '',
                doubaoEndpoint: '',
                dsTemperature: 0.3,
                dsMaxTokens: 384000,
                dsEnableThinking: false,
                dsReasoningEffort: 'high',
                prompts: { ...INITIAL_PROMPTS },
                promptSets: [{ id: 'default', name: '默认提示词', prompts: { ...INITIAL_PROMPTS } }],
                activePromptSetId: 'default'
            });

            const [showSettings, setShowSettings] = useState(false);
            const [showSidebar, setShowSidebar] = useState(true);
            const [generatingSection, setGeneratingSection] = useState(null);
            const [deleteConfirmId, setDeleteConfirmId] = useState(null);
            const [toasts, setToasts] = useState([]);
            
            const [confirmClear, setConfirmClear] = useState({ show: false, section: null });
            const [promptSetConfirm, setPromptSetConfirm] = useState({ show: false, action: null, id: null });
            const [resetConfirm, setResetConfirm] = useState({ show: false, step: 1, userInput: '' });
            const [generatingModal, setGeneratingModal] = useState({ show: false, content: '', section: '', title: '', isGenerating: false });
            const isGlobalGeneratingRef = React.useRef(false);
            const abortControllerRef = React.useRef(null);
            const modalContentRef = React.useRef(null);

            React.useEffect(() => {
                if (modalContentRef.current) {
                    modalContentRef.current.scrollTop = modalContentRef.current.scrollHeight;
                }
            }, [generatingModal.content]);

            const currentMaxLimit = 384000;

           
            const [searchQuery, setSearchQuery] = useState('');
            const [searchScopes, setSearchScopes] = useState(["课题", "作者"]);
            const [selectedTags, setSelectedTags] = useState([]);
            const [tagMatchMode, setTagMatchMode] = useState('OR');

           
            const tags = useMemo(() => {
                if (!Array.isArray(lessons)) return [];
                const allTags = lessons.flatMap(l => {
                    if (!l || !l.type) return [];
                    return l.type.split(/[\s,，;；、.。]+/).filter(Boolean);
                });
                return Array.from(new Set(allTags));
            }, [lessons]);

           
            const deleteConfirmLessonTitle = useMemo(() => {
                if (!deleteConfirmId || !Array.isArray(lessons)) return '';
                const l = lessons.find(x => x.id === deleteConfirmId);
                return l ? l.title : '';
            }, [lessons, deleteConfirmId]);

           
            const filteredLessons = useMemo(() => {
                if (!Array.isArray(lessons)) return [];
                return lessons.filter(lesson => {
                    if (!lesson) return false;
                    
                    let matchesSearch = true;
                    if (searchQuery.trim() !== '') {
                        matchesSearch = false;
                        const query = searchQuery.toLowerCase();
                        
                        for (const scope of searchScopes) {
                            if (scope === '课题' && (lesson.title || '').toLowerCase().includes(query)) {
                                matchesSearch = true;
                                break;
                            }
                            if (scope === '作者' && (lesson.author || '').toLowerCase().includes(query)) {
                                matchesSearch = true;
                                break;
                            }
                            if (scope === '学段' && (lesson.source || '').toLowerCase().includes(query)) {
                                matchesSearch = true;
                                break;
                            }
                            if (scope === '标签' && (lesson.type || '').toLowerCase().includes(query)) {
                                matchesSearch = true;
                                break;
                            }
                            if (lesson.content) {
                                if (scope === '原文' && (lesson.content['原文'] || '').toLowerCase().includes(query)) {
                                    matchesSearch = true;
                                    break;
                                }
                                if (scope === '注释' && (lesson.content['注释'] || '').toLowerCase().includes(query)) {
                                    matchesSearch = true;
                                    break;
                                }

            const executeStreamCompletion = async (provider, apiKey, aiConfig, formattedPrompt, onChunk, signal) => {
                let url = '';
                let body = {
                    messages: [{ role: 'user', content: formattedPrompt }],
                    temperature: aiConfig.dsTemperature !== undefined ? Number(aiConfig.dsTemperature) : 0.6,
                    stream: true
                };

                if (provider === 'deepseek') {
                    url = 'https://api.deepseek.com/chat/completions';
                    const selectedModel = aiConfig.deepSeekModel || 'deepseek-v4-flash';
                    const isPro = selectedModel === 'deepseek-v4-pro';
                    const temp = aiConfig.dsTemperature !== undefined ? Number(aiConfig.dsTemperature) : (isPro ? 0.6 : 0.3);
                    
                    body = { ...body, model: selectedModel, temperature: temp };
                    if (aiConfig.dsMaxTokens) body.max_tokens = Number(aiConfig.dsMaxTokens);
                } else if (provider === 'doubao') {
                    url = 'https://ark.cn-beijing.volces.com/api/v3/chat/completions';
                    body.model = aiConfig.doubaoEndpoint;
                }

                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${apiKey}` },
                    body: JSON.stringify(body),
                    signal
                });

                if (!response.ok) {
                    const errText = await response.text();
                    try {
                        const errJson = JSON.parse(errText);
                        throw new Error(errJson.error?.message || errText);
                    } catch(e) {
                        throw new Error(`HTTP ${response.status}: ${errText}`);
                    }
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let contentText = '';
                let reasoningText = '';
                let buffer = '';

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    buffer += decoder.decode(value, { stream: true });
                    const lines = buffer.split('\n');
                    buffer = lines.pop(); 
                    
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (trimmed.startsWith('data:') && trimmed !== 'data: [DONE]') {
                            try {
                                const data = JSON.parse(trimmed.slice(5).trim());
                                const delta = data.choices?.[0]?.delta?.content || '';
                                const reasoning = data.choices?.[0]?.delta?.reasoning_content || '';
                                if (reasoning) {
                                    reasoningText += reasoning;
                                }
                                if (delta) {
                                    contentText += delta;
                                }
                                if (reasoning || delta) {
                                    const combined = reasoningText ? `<think>\n${reasoningText}\n</think>\n\n${contentText}` : contentText;
                                    onChunk(combined);
                                }
                            } catch(e) {}
                        }
                    }
                }
                // Strip manual think blocks if any in contentText just to be safe
                return contentText.replace(/<think>[\s\S]*?<\/think>/gi, '').trim();
            };

            const generateContent = async (section) => {

            const globalGenerateAll = async () => {

                // Keep a local tracking copy to read synchronously

                try {

                        for (let s = 0; s < sections.length; s++) {

                            if (!isGlobalGeneratingRef.current) {

                            let currentContent = lesson.content[section] || '';

                            if (!currentContent || currentContent.trim() === '') {
                                setGeneratingModal(prev => ({ ...prev, content: `正在生成：[${lesson.title}] - ${section}...\n\n`, title: `一键生成 (课程进度 ${i+1}/${workingLessons.length})` }));
                                
                                const promptTemplate = aiConfig.prompts[section] || '';
                                let formattedPrompt = promptTemplate
                                    .replace(/\{课题\}/g, lesson.title || '无标题')
                                    .replace(/\{作者\}/g, lesson.author || '无作者')
                                    .replace(/\{学段\}/g, lesson.source || '无来源')
                                    .replace(/\{标签\}/g, lesson.type || '无类型')
                                    .replace(/\{原文\}/g, lesson.content['原文'] || '暂无原文内容')
                                    .replace(/\{注释\}/g, lesson.content['注释'] || '暂无注释内容')
                                    .replace(/\{拓展\}/g, lesson.content['拓展'] || '暂无拓展内容')
                                    .replace(/\{教案\}/g, lesson.content['教案'] || '暂无教案内容')
                                    .replace(/\{课件\}/g, lesson.content['课件'] || '暂无课件内容')
                                    .replace(/\{练习\}/g, lesson.content['练习'] || '暂无练习内容');

                                const fullText = await executeStreamCompletion(provider, apiKey, aiConfig, formattedPrompt, (text) => {
                                    setGeneratingModal(prev => ({ ...prev, content: `正在生成：[${lesson.title}] - ${section}...\n\n${text}` }));
                                }, abortController.signal);
                                
                                // Update working state for the next loops
                                let processedText = fullText;
                                if (section === '课件' && typeof processedText === 'string') {
                                    processedText = cleanHtml(processedText);
                                }
                                lesson.content[section] = processedText;
                                
                                // Update UI state incrementally
                                setLessons(prev => prev.map(l => l.id === lesson.id ? { ...l, content: { ...l.content, [section]: processedText } } : l));

                                        <button 
                                            onClick={() => {
                                                if (abortControllerRef.current) abortControllerRef.current.abort();
                                                isGlobalGeneratingRef.current = false;
                                            }} 
                                            className="px-3 py-1 text-xs text-red-600 border border-red-200 rounded hover:bg-red-50 transition-all font-bold"
                                        >
                                            中止生成
                                        </button>
                                    )}
                                    {!generatingModal.isGenerating && (
                                        <button onClick={() => setGeneratingModal({ show: false, content: '', section: '', title: '', isGenerating: false })} className="p-1 hover:bg-[#ede0cc] rounded text-[#8b3a3a]"><Icon name="X" /></button>
                                    )}
                                </div>
                                <div ref={modalContentRef} className="flex-grow p-6 overflow-y-auto bg-[#fffaf4] whitespace-pre-wrap font-sans text-sm text-[#3d2b1f] leading-relaxed relative">
                                    {generatingModal.content}
                                    {generatingModal.isGenerating && (
                                        <span className="inline-block w-2.5 h-4 ml-1 bg-[#8b3a3a] animate-pulse"></span>
                                    )}
                                </div>
                                <div className="p-4 border-t border-[#ddd0c0] bg-[#ede0cc]/40 flex justify-end shrink-0">
                                    <button 
                                        onClick={() => setGeneratingModal({ show: false, content: '', section: '', title: '', isGenerating: false })}
                                        className={`px-6 py-2 rounded-xl text-sm font-semibold transition-all shadow-md ${generatingModal.isGenerating ? 'bg-[#c9b896] text-[#fffaf4] cursor-not-allowed opacity-70' : 'bg-[#8b3a3a] text-white hover:bg-[#a64545]'}`}
                                        disabled={generatingModal.isGenerating}
                                    >
                                        关闭
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
