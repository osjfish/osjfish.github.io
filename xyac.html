        // --- 提示词模块 ---
        const PROMPT_TEMPLATES = {
            ANALYSIS: (topic) => `你是一位语文中考作文审题专家，请使用最科学、严密的 KQ-XYAC 审题立意系统对作文题【${topic}】进行深度拆解。
你的任务是输出 6 个部分，**严禁使用任何 Markdown 格式符号**。
请严格按照以下各部分的逻辑进行输出，每个部分开始前用 [SECTION_NAME] 标记（如 [K]）：

[K] 客观境遇：点明题目涵盖的不可逆转的客观现实。强调这种背景如何让接下来的行为更具价值。
[Q] 核心前提：揭示行为 A 成立的隐性基础（例如：自信的前提是有能力）。
[X] 现状对比：分析行为 A 发生前的缺失状态，对比发生后的理想状态。
[Y] 核心理法：详细解释价值实现的逻辑链条。重点阐证“行为 A 产生价值 C”的必然性。
[A] 行动路径：建议写作中如何具体化 A 的 2-3 个核心细节动作。
[C] 价值重塑：阐述达成 C 状态后，对个人内核或精神成长的深意。

注意：严禁在正文中出现英文字母或“客观境遇”等术语作为代词。不要回复任何无关内容，纯文本回复。`,

            MATERIALS: (topic) => `你是一位中考作文素材专家。请为作文题【${topic}】提供精准的素材支撑。
你的任务是输出以下 3 个部分，请务必每类下位素材各生成 5 个，**各素材之间必须用空行隔开，严禁任何 Markdown 格式符号**。

**【核心锚点指令】**：
1. **精准对准**：素材必须精准扣住作文题的核心意旨，遵循行动路径（A）的要求，并落脚于价值重塑（C）的目标。
2. **严控无关**：严禁出现与题意无关或强行攀扯的案例。
3. **分层推荐**：包含生活场景、权威历史、跨界案例。允许包含 1-2 个反例。

请按以下标记输出：
[MAT_LIFE]
中学生生活情境素材（学习成长、校园社交、家庭生活）。要求：情感真实、属性下位、细节具体。
[MAT_HISTORY]
历史与名人素材（权威、有出处）。要求：深刻阐述人物如何践行核心行动路径（A）。
[MAT_CROSS]
跨界启发素材（科技、社会或自然界运行逻辑）。`,

            REFRESH_ITEM: (topic, key, label, extraInstructions = "") => {
                const baseInstructions = `你是一位中考作文专家。当前作文题为【${topic}】。
请针对该题目，仅提供【${label}】部分的内容。
要求：
1. **【精准扣题】**：必须精准扣住作文题的核心意旨，严格遵循行动路径（A）要求，落脚于价值重塑（C）。
2. **【严控攀扯】**：严禁出现与题意无关内容。
3. **【文章质量】**：语言自然流畅且富有深度。
${extraInstructions ? `4. **【用户补充要求】**：${extraInstructions}\n` : ""}
5. 严禁使用任何 Markdown 标记或排版符号。
6. 严禁出现逻辑术语标签或英文字母。
7. 不要回复任何无关内容，纯文本回复。`;

                if (['K', 'Q', 'X', 'Y', 'A', 'C'].includes(key)) {
                    return `${baseInstructions}
请直接输出该部分的内容解析文字（约 120 字），不要带标签名。`;
                }
                if (key === 'MAT_LIFE') {
                    return `${baseInstructions}
请提供 5 个【中学生生活情境素材】。选材优先学习、成长、校园社交、家庭生活。包含动作细节，严禁使用题干案例。**各素材间用空行隔开。**`;
                }
                if (key === 'MAT_HISTORY' || key === 'MAT_CROSS') {
                    const subLabel = label === '历史文化素材' ? '历史与名人素材' : '跨界启发素材';
                    return `${baseInstructions}
请提供 5 个【${subLabel}】。事例必须权威有据，严禁小事，突出行动至价值的转化过程。**各素材间用空行隔开。**`;
                }
                if (key === 'NARRATIVE') {
                    return `${baseInstructions}
请创作一篇【记叙文范文】。
- 选材：校园、家庭、成长场景。避开题干案例，共鸣感强。
- 叙事：起于起笔展现缺失困境（X），落实于符合行动细节（A），收于价值升华重塑（C）。
- 风格：道理化盐入水，严禁技术术语，字数 700-800 字。`;
                }
                if (key === 'ARGUMENTATIVE') {
                    return `${baseInstructions}
请创作一篇【议论文范文】。
- 核心：论证严密，深刻阐述理法逻辑。
- 论据：包含两个权威历史/名家事例（禁止身边小事），独立成段，详细阐述具体的“怎样做”（A）。
- 要求：严禁提及题干事例，严禁术语标签，字数 700-800 字。`;
                }
                return baseInstructions;
            },

            ESSAYS: (topic) => `你是一位中考作文满分范文专家。请为作文题【${topic}】创作两篇高质量范文。

共同要求：
1. **【精准扣题】**：必须精准扣住作文题干的核心意旨，严格遵循行动路径（A）要求，落脚于价值重塑（C）。
2. **【严禁无关】**：严禁出现与题意无关内容或强行攀扯。
3. **【精简无扰】**：语言自然流畅，纯粹文学作品。不要包含 Markdown 字符，不要出现逻辑字母（K/A等）。

【记叙文注意事项】
- 选材：优先中学生常见的学习、成长、校园社交、家庭生活。避开题干案例。
- 叙事：起笔展现现状缺失（X），行文落实符合核心内涵的细节动作（A），收笔升华为内核重塑（C）。
- 逻辑：将逻辑链条无痕融入情节（化盐入水）。
- 字数：严格控制在 700-800 字之间。

【议论文注意事项】
- 论证：论证严密，结构清晰，深刻阐述理法。
- 论据：包含且仅包含两个具体事例论证（各占一段）。事例须权威、有出处（如历史人物），禁止身边小事。论证要具体（A）。
- 字数：严格控制在 700-800 字之间。

请按照以下标记输出：
[NARRATIVE]
（记叙文全文）
[ARGUMENTATIVE]
（议论文全文）`,

            COMBINED_EXTERNAL: (topic) => `你是一位顶尖作文专家。请针对作文题【${topic || "请在此处输入作文题"}】完成以下三项任务。**请注意，在任何回复中严禁使用任何标题、加粗、列表等排版标记符号（如 #, ##, **, - 等）**。

第一部分：审题深度拆解
你需要按顺序深度拆解以下六个核心要素，每个要素前用 【要素名称】 格式标注：
【客观境遇】：点明题目涵盖的不可逆转的客观现实。
【核心前提】：揭示行为成立的隐性基础。
【现状对比】：分析核心行为发生前后的状态变化。
【核心理法】：详细解释价值实现的理法逻辑链条。
【行动路径】：建议写作中具体的动作落实细节。
【价值重塑】：阐述目标达成后的深层意义。
注意：各要素的正文内严禁出现任何英文字母（K/Q/X/Y/A/C）。

第二部分：材料支撑
分类提供以下 3 个部分（每类下位素材务必各生成5个，**各素材之间必须用空行隔开**）：
**【锚定要求】**：所有素材必须**紧扣 A（行动路径）的具象细节**，并**导向 C（价值重塑）的任务目标**。
**【严控无关与攀扯】**：支撑题意的部分**严禁出现与题意无关的内容**，严禁选取不合适的材料强行攀扯到题意上。
**【反例开放指令】**：在生成 5 个素材中，**允许包含 1-2 个反例**（即展现未遵循核心理法或行动路径导致的负面后果），以增强论证的对比厚度。
[MAT_LIFE]
中学生生活情境素材（具体的校园或家庭场景）。**要求：内容详实、属性下位，包含具体动作、语言描写及细节呈现。**
[MAT_HISTORY]
历史/社会/名人素材。**要求：包含具体事例情节、金句引用或名言化用，避免泛泛而谈。**
[MAT_CROSS]
跨界启发性案例。**要求：具体描写案例的运行过程或核心瞬间细节。**

第三部分：满分范文
请提供下方的两篇范文：
[NARRATIVE]
【记叙文范文】
[ARGUMENTATIVE]
【议论文范文】
要求：
1. **【题意深度一致】**：范文必须深刻体现并扣住作文题的中心思想，**必须高度契合行动路径（A）并最终指向价值重塑（C）**。
2. **【选材优先与禁令】**：记叙文选材应优先从学习生活、家庭成长等中学生高频场景切入；同时必须完全避开作文题干中提供的具体事例及其细节。
3. **【议论文专项要求】**：**必须包含且只包含两个具体事例论证，各占一个段落。事例必须权威、有出处（如历史/名人素材），严禁使用身边小事。论据必须强力支撑 A->C 的转化过程。严禁提及题干事例。**
4. **【文字绝对净空指令】**：**范文正文中严禁出现任何字母（K/Q/X/Y/A/C）或“客观境遇”等逻辑术语。** 必须写成纯粹的、无干扰的文学作品。
5. **【强制复核】**：输出前自检，若文章中含有 K/A 等标注，则必须删除重写。**【字数强制限制】：每篇范文字数必须严格控制在 700-800 字之间。**

当前作文题为：${topic || "（请在下方输入或粘贴你的作文题目）"}`
        };

        function App() {
            const [topic, setTopic] = useState(() => localStorage.getItem("xyac_topic_cache") || "");
            const [config, setConfig] = useState(() => {
                const defaultConf = { 
                    currentProvider: "deepseek",
                    providers: {
                        deepseek: { apiKey: "", model: "deepseek-v4-flash" }, kimi: { apiKey: "" }, zhipu: { apiKey: "" },
                        qwen: { apiKey: "" }, baidu: { apiKey: "" },
                        doubao: { apiKey: "", endpointId: "" }, ollama: { apiKey: "", ollamaModel: "qwen2" }
                    }
                };
                try {
                    const saved = localStorage.getItem("xyac_standalone_config_v2");
                    return saved ? JSON.parse(saved) : defaultConf;
                } catch (e) { return defaultConf; }
            });

            const [isLoading, setIsLoading] = useState({ 
                analysis: false, materials: false, essays: false,
                K: false, Q: false, X: false, Y: false, A: false, C: false,
                MAT_LIFE: false, MAT_HISTORY: false, MAT_CROSS: false,
                NARRATIVE: false, ARGUMENTATIVE: false
            });
            const [data, setData] = useState(() => {
                try {
                    const saved = localStorage.getItem("xyac_data_cache_v2");
                    return saved ? JSON.parse(saved) : { analysis: null, materials: null, essays: null };
                } catch (e) { return { analysis: null, materials: null, essays: null }; }
            });
            const [showSettings, setShowSettings] = useState(false);
            const [showArchives, setShowArchives] = useState(false);
            const [archives, setArchives] = useState(() => {
                try {
                    const saved = localStorage.getItem("xyac_archives_v1");
                    return saved ? JSON.parse(saved) : [];
                } catch (e) { return []; }
            });
            const [selectedArchiveIds, setSelectedArchiveIds] = useState([]);
            const [toast, setToast] = useState(null);
            const [genStatus, setGenStatus] = useState(null); // { steps: [] }

            useEffect(() => {
                localStorage.setItem("xyac_archives_v1", JSON.stringify(archives));
            }, [archives]);
            const [modal, setModal] = useState(null); // { title, content, actions }

            useEffect(() => { localStorage.setItem("xyac_topic_cache", topic); }, [topic]);
            useEffect(() => { localStorage.setItem("xyac_standalone_config_v2", JSON.stringify(config)); }, [config]);
            useEffect(() => { localStorage.setItem("xyac_data_cache_v2", JSON.stringify(data)); }, [data]);

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(null), 2000);
            };

            const showAlert = (title, content) => {
                setModal({
                    title,
                    content,
                    actions: [{ label: "确定", type: "primary", onClick: () => setModal(null) }]
                });
            };

            const callAI = async (prompt, onChunk = null) => {
                const provider = config.currentProvider;
                const creds = config.providers[provider];
                if (!creds.apiKey && provider !== 'ollama') throw new Error(`请先设置 ${provider} 的 API Key`);

                let endpoint = "", model = "";
                let headers = { "Content-Type": "application/json" };
                if (creds.apiKey) headers["Authorization"] = `Bearer ${creds.apiKey}`;

                switch (provider) {
                    case "deepseek": endpoint = "https://api.deepseek.com/chat/completions"; model = creds.model || "deepseek-v4-flash"; break;
                    case "kimi": endpoint = "https://api.moonshot.cn/v1/chat/completions"; model = "moonshot-v1-8k"; break;
                    case "zhipu": endpoint = "https://open.bigmodel.cn/api/paas/v4/chat/completions"; model = "glm-4"; break;
                    case "qwen": endpoint = "https://dashscope.aliyuncs.com/compatible-mode/v1/chat/completions"; model = "qwen-plus"; break;
                    case "baidu": endpoint = "https://qianfan.baidubce.com/v2/chat/completions"; model = "ernie-4.0-8k-latest"; break;
                    case "doubao": endpoint = "https://ark.cn-beijing.volces.com/api/v3/chat/completions"; model = creds.endpointId; break;
                    case "ollama": endpoint = "http://127.0.0.1:11434/v1/chat/completions"; model = creds.ollamaModel || "qwen2"; break;
                }

                const body = { 
                    model, 
                    messages: [{ role: "user", content: prompt }], 
                    temperature: 0.7,
                    stream: !!onChunk
                };

                const res = await fetch(endpoint, {
                    method: "POST", headers, body: JSON.stringify(body)
                });
                
                if (!res.ok) {
                    const errData = await res.json().catch(() => ({}));
                    throw new Error(errData.error?.message || "接口访问失败");
                }

                if (!onChunk) {
                    const json = await res.json();
                    return json.choices[0].message.content;
                }

                const reader = res.body.getReader();
                const decoder = new TextDecoder("utf-8");
                let fullText = "";
                let reasoningText = "";

                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    
                    const chunk = decoder.decode(value, { stream: true });
                    const lines = chunk.split("\n");
                    
                    for (const line of lines) {
                        const trimmed = line.trim();
                        if (!trimmed || !trimmed.startsWith("data: ")) continue;
                        const dataStr = trimmed.slice(6);
                        if (dataStr === "[DONE]") continue;
                        
                        try {
                            const data = JSON.parse(dataStr);
                            const delta = data.choices[0]?.delta || {};
                            const content = delta.content || "";
                            const reasoning = delta.reasoning_content || delta.reasoning || "";
                            
                            if (reasoning) {
                                reasoningText += reasoning;
                                onChunk(fullText, reasoningText);
                            }
                            if (content) {
                                fullText += content;
                                onChunk(fullText, reasoningText);
                            }
                        } catch (e) {}
                    }
                }
                return fullText;
            };

            const runTask = async (type, subKey = null, label = "", extraInstructions = "") => {
                if (!topic.trim()) return showAlert("提示", "请输入作文题");
                
                const loadingKey = subKey || type;
                setIsLoading(prev => ({ ...prev, [loadingKey]: true }));
                
                const stepLabel = label || (subKey ? `${type === 'analysis' ? '核心要素' : (type === 'materials' ? '素材' : '范文')}：${subKey}` : type);
                
                setGenStatus(prev => {
                    const newStep = { id: loadingKey, label: stepLabel, status: 'running', preview: "", reasoning: "" };
                    if (!prev) return { steps: [newStep] };
                    const existing = prev.steps.find(s => s.id === loadingKey);
                    if (existing) {
                        return { ...prev, steps: prev.steps.map(s => s.id === loadingKey ? newStep : s) };
                    }
                    return { ...prev, steps: [...prev.steps, newStep] };
                });
                
                try {
                    let finalContent = "";
                    const onChunk = (accumulated, reasoning) => {
                        setGenStatus(prev => {
                            if (!prev) return prev;
                            return {
                                ...prev,
                                steps: prev.steps.map(s => s.id === loadingKey ? { ...s, preview: accumulated, reasoning: reasoning } : s)
                            };
                        });
                    };

                    if (subKey) {
                        finalContent = await callAI(PROMPT_TEMPLATES.REFRESH_ITEM(topic, subKey, label, extraInstructions), onChunk);
                        setData(prev => ({ 
                            ...prev, 
                            [type]: { ...prev[type], [subKey]: finalContent } 
                        }));
                    } else {
                        finalContent = await callAI(PROMPT_TEMPLATES[type.toUpperCase()](topic), onChunk);
                        const parts = parseContent(finalContent);
                        setData(prev => ({ ...prev, [type]: { ...prev[type], ...parts } }));
                    }

                    setGenStatus(prev => ({
                        ...prev,
                        steps: prev.steps.map(s => s.id === loadingKey ? { ...s, status: 'done', preview: finalContent } : s)
                    }));
                } catch (err) {
                    setGenStatus(prev => ({
                        ...prev,
                        steps: prev.steps.map(s => s.id === loadingKey ? { ...s, status: 'error' } : s)
                    }));
                    if (!genStatus) showAlert("生成失败", err.message);
                } finally {
                    setIsLoading(prev => ({ ...prev, [loadingKey]: false }));
                }
            };

                const result = {};
                markers.forEach(m => {
                    const regex = new RegExp(`\\[${m}\\]([\\s\\S]*?)(?=\\[|$)`, 'i');
                    const match = text.match(regex);
                    if (match) result[m] = match[1].trim();

                                border: { bottom: { color: "e2ded0", space: 1, style: BorderStyle.SINGLE, size: 6 } }
                            }));
                            ['K', 'Q', 'X', 'Y', 'A', 'C'].forEach(k => {
                                const labels = { K:'K 客观境遇', Q:'Q 核心前提', X:'X 现状对比', Y:'Y 核心理法', A:'A 行动路径', C:'C 价值重塑'};
                                if (archive.data.analysis[k]) {
                                    reportChildren.push(new Paragraph({ children: [new TextRun({ text: labels[k], bold: true, size: 26, color: "963530" })], spacing: { before: 200, after: 100 } }));
                                    archive.data.analysis[k].split('\n').filter(l=>l).forEach(line => {
                                        reportChildren.push(new Paragraph({ children: [new TextRun({ text: line.trim(), size: 24 })], indent: { firstLine: 480 }, spacing: { before: 120, after: 120, line: 360 } }));
                                    });
                                }
                            });
                        }

                        if (archive.data.materials) {
                            reportChildren.push(new Paragraph({
                                children: [new TextRun({ text: "二、 材料支撑", bold: true, size: 32, color: "2d5a52" })],
                                spacing: { before: 400, after: 200 },
                                border: { bottom: { color: "e2ded0", space: 1, style: BorderStyle.SINGLE, size: 6 } }
                            }));
                            if (archive.data.materials.MATERIALS) {
                                archive.data.materials.MATERIALS.split('\n').filter(l=>l).forEach(line => {
                                    reportChildren.push(new Paragraph({ children: [new TextRun({ text: line.trim(), size: 24 })], indent: { firstLine: 480 }, spacing: { before: 120, after: 120, line: 360 } }));
                                });
                            } else {
                                const mLabels = { MAT_LIFE: "【中学生生活情境素材】", MAT_HISTORY: "【历史与文化素材】", MAT_CROSS: "【跨界启发素材】" };
                                ['MAT_LIFE', 'MAT_HISTORY', 'MAT_CROSS'].forEach(mk => {
                                    if (archive.data.materials[mk]) {
                                        reportChildren.push(new Paragraph({ children: [new TextRun({ text: mLabels[mk], bold: true, size: 26, color: "963530" })], spacing: { before: 200, after: 100 } }));
                                        archive.data.materials[mk].split('\n').filter(l=>l).forEach(line => {
                                            reportChildren.push(new Paragraph({ children: [new TextRun({ text: line.trim(), size: 24 })], indent: { firstLine: 480 }, spacing: { before: 120, after: 120, line: 360 } }));
                                        });
                                    }
                                });
                            }
                        }

                        if (archive.data.essays) {
                            reportChildren.push(new Paragraph({
                                children: [new TextRun({ text: "三、 优秀范文", bold: true, size: 32, color: "2d5a52" })],
                                spacing: { before: 400, after: 200 },
                                border: { bottom: { color: "e2ded0", space: 1, style: BorderStyle.SINGLE, size: 6 } }
                            }));
                            ['NARRATIVE', 'ARGUMENTATIVE'].forEach(k => {
                                reportChildren.push(new Paragraph({ children: [new TextRun({ text: k==='NARRATIVE'?'【记叙文】':'【议论文】', bold: true, size: 28, color: "2d5a52" })], spacing: { before: 200, after: 100 } }));
                                archive.data.essays[k].split('\n').filter(l=>l).forEach(line => {
                                    reportChildren.push(new Paragraph({ children: [new TextRun({ text: line.trim(), size: 24 })], indent: { firstLine: 480 }, spacing: { before: 120, after: 120, line: 360 } }));
                                });
                            });
                        }

                        allChildren.push(...reportChildren);
                        if (index < selected.length - 1) {
                            allChildren.push(new Paragraph({ children: [new PageBreak()] }));
                        }
                    });

                    const doc = new Document({
                        sections: [{
                            properties: { page: { margin: { top: 1440, bottom: 1440, left: 1440, right: 1440 } } },
                            footers: {
                                default: new Footer({
                                    children: [new Paragraph({ alignment: AlignmentType.CENTER, children: [new TextRun({ text: "第 ", size: 18 }), new TextRun({ children: [PageNumber.CURRENT] }), new TextRun({ text: " 页 / 共 " }), new TextRun({ children: [PageNumber.TOTAL_PAGES] }), new TextRun({ text: " 页" })] })]
                                })
                            },
                            children: allChildren
                        }]
                    });
                    const blob = await Packer.toBlob(doc);
                    saveAs(blob, `批量作文报告_${selected.length}篇.docx`);
                    showToast("批量导出成功");
                } catch (e) {
                    showAlert("批量导出失败", e.message);
                }
            };

            const copyFull = () => {
                let full = `【作文分析报告】\n\n【作文题】\n${topic}\n\n`;
                if(data.analysis) {
                    full += "【一、审题立意】\n";
                    ['K', 'Q', 'X', 'Y', 'A', 'C'].forEach(k => {
                        if (data.analysis[k]) full += `[${k}] ${data.analysis[k]}\n`;
                    });
                    full += "\n";
                }
                if(data.materials) {
                    full += "【二、材料支撑】\n";
                    if (data.materials.MATERIALS) {
                        full += data.materials.MATERIALS + "\n\n";
                    } else {
                        const mLabels = { MAT_LIFE: "【中学生生活情境素材】", MAT_HISTORY: "【历史与文化素材】", MAT_CROSS: "【跨界启发素材】" };
                        ['MAT_LIFE', 'MAT_HISTORY', 'MAT_CROSS'].forEach(mk => {
                            if (data.materials[mk]) full += `${mLabels[mk]}\n${data.materials[mk]}\n\n`;
                        });
                    }
                }
                if(data.essays) full += `【三、优秀范文】\n[记叙文]\n${data.essays.NARRATIVE}\n\n[议论文]\n${data.essays.ARGUMENTATIVE}`;
                copyText(full);
            };

            const copyAIPrompt = () => {
                const prompt = PROMPT_TEMPLATES.COMBINED_EXTERNAL(topic);
                copyText(prompt);
            };

            const ResultBox = ({ label, content, onRefresh, loading, onUpdate }) => {
                const [isEditing, setIsEditing] = useState(false);
                const [editValue, setEditValue] = useState(content);

                useEffect(() => { setEditValue(content); }, [content]);

                const handleSave = () => {
                    if (onUpdate) onUpdate(editValue);
                    setIsEditing(false);
                    showToast("内容已保存");
                };

                const handleRefreshClick = () => {
                    if (!onRefresh) return;
                    
                    let userTip = "";
                    setModal({
                        title: `重新生成：${label}`,
                        content: (
                            <div className="space-y-4">
                                <p className="text-sm text-slate-500">你可以输入额外的要求来指导生成方向（可选）：</p>
                                <textarea 
                                    className="w-full border rounded-xl p-4 h-32 text-sm focus:ring-2 focus:ring-[#2d5a52]/40 outline-none resize-none"
                                    placeholder="例如：侧重亲情描写、增加历史厚度、语气更激昂一些..."
                                    onChange={(e) => { userTip = e.target.value; }}
                                />
                            </div>
                        ),
                        actions: [
                            { 
                                label: "立即重新生成", 
                                type: "primary", 
                                onClick: () => {
                                    onRefresh(userTip);
                                    setModal(null);
                                } 
                            },
                            { label: "取消", type: "ghost", onClick: () => setModal(null) }
                        ]
                    });
                };

                return (
                    <div className="group relative space-y-2">
                        <div className="flex justify-between items-center pr-1">
                            <label className="text-sm font-bold text-[#2d5a52] tracking-widest pl-2 border-l-4 border-[#963530]">{label}</label>
                            <div className="flex items-center space-x-2 opacity-0 group-hover:opacity-100 transition-opacity">
                                {isEditing ? (
                                    <>
                                        <button onClick={handleSave} className="p-1 text-emerald-600 hover:text-emerald-700" title="确认修改"><Icon name="check" className="w-4 h-4"/></button>
                                        <button onClick={() => { setIsEditing(false); setEditValue(content); }} className="p-1 text-slate-400 hover:text-slate-600" title="取消"><Icon name="x" className="w-4 h-4"/></button>
                                    </>
                                ) : (
                                    <>
                                        <button onClick={() => setIsEditing(true)} className="p-1 hover:text-[#2d5a52]" title="直接编辑此段落"><Icon name="edit" className="w-3.5 h-3.5"/></button>
                                        <button onClick={() => copyText(content)} className="p-1 hover:text-[#963530]" title="复制内容"><Icon name="copy" className="w-3.5 h-3.5"/></button>
                                        {onRefresh && <button onClick={handleRefreshClick} className={`p-1 hover:text-[#2d5a52] ${loading ? 'animate-spin' : ''}`} disabled={loading}><Icon name="rotate-cw" className="w-3.5 h-3.5"/></button>}
                                    </>
                                )}
                            </div>
                        </div>
                        <div className={`bg-[#fcfaf2] border border-[#e2ded0] rounded-xl p-5 text-[#2c2c2c] leading-relaxed paper-shadow min-h-[100px] relative overflow-hidden transition-all ${isEditing ? 'ring-2 ring-[#2d5a52]/20 bg-white' : ''}`}>
                            {loading && <div className="absolute inset-0 bg-white/60 flex items-center justify-center z-[5]"><div className="animate-spin text-[#2d5a52]">🌀</div></div>}
                            {isEditing ? (
                                <textarea 
                                    className="w-full bg-transparent border-none focus:ring-0 outline-none text-sm leading-relaxed p-0 h-full min-h-[220px] resize-none"
                                    value={editValue || ""}
                                    onChange={(e) => setEditValue(e.target.value)}
                                    autoFocus
                                />
                            ) : (
                                <div className="whitespace-pre-wrap">{content || "等待生成..."}</div>
                            )}
                        </div>
                    </div>
                );
            };

            const SectionHeader = ({ title, onCopy, onRefresh, loading }) => (
                <div className="flex flex-wrap sm:flex-nowrap justify-between items-center bg-[#f1eee4] px-4 sm:px-6 py-3 sm:py-4 rounded-xl border border-[#e2ded0] mb-6 gap-3">
                    <h2 className="text-lg sm:text-xl font-bold text-[#2d5a52] flex items-center whitespace-nowrap">
                        <Icon name="file-text" className="w-5 h-5 mr-2 shrink-0" />
                        {title}
                    </h2>
                    <div className="flex items-center space-x-2 sm:space-x-3 ml-auto">
                        <button onClick={onCopy} title="复制此板块" className="p-2 sm:px-3 sm:py-2 bg-white rounded-lg hover:bg-slate-50 border border-[#e2ded0] flex items-center justify-center space-x-1 min-w-[40px] h-10 transition-all active:scale-95 shadow-sm">
                            <Icon name="copy" className="w-4 h-4 text-[#2d5a52]"/>
                            <span className="hidden sm:inline text-xs font-semibold text-[#2d5a52]">复制板块</span>
                        </button>
                        <button onClick={onRefresh} className={`p-2 sm:px-3 sm:py-2 bg-white rounded-lg hover:bg-slate-50 border border-[#e2ded0] flex items-center justify-center space-x-1 min-w-[40px] h-10 transition-all active:scale-95 shadow-sm ${loading ? 'opacity-50 cursor-not-allowed' : ''}`} disabled={loading}>
                            <Icon name="rotate-cw" className={`w-4 h-4 text-[#2d5a52] ${loading ? 'animate-spin' : ''}`}/>
                            <span className="hidden sm:inline text-xs font-semibold text-[#2d5a52]">{loading ? '重构中...' : '重新生成'}</span>
                        </button>
                    </div>
                </div>
            );
            const Modal = ({ config }) => {
                if (!config) return null;
                return (
                    <div className="fixed inset-0 z-[200] flex items-center justify-center p-4">
                        <div className="absolute inset-0 bg-[#2d5a52]/40 backdrop-blur-sm animate-in fade-in" onClick={() => setModal(null)}></div>
                        <div className="relative bg-white border border-[#e2ded0] w-full max-w-3xl p-6 sm:p-8 rounded-3xl shadow-2xl animate-in zoom-in-95 fade-in duration-200 flex flex-col max-h-[90vh]">
                            <h3 className="text-2xl font-bold font-heading text-[#2d5a52] mb-4 shrink-0">{config.title}</h3>
                            <div className="flex-1 overflow-y-auto mb-6 pr-2 custom-scrollbar">
                                {typeof config.content === 'string' ? (
                                    <p className="text-slate-600 leading-relaxed">{config.content}</p>
                                ) : config.content}
                            </div>
                            <div className="flex flex-col gap-3 shrink-0">
                                {config.actions.map((act, idx) => (
                                    <button
                                        key={idx}
                                        onClick={act.onClick}
                                        className={`py-3 px-6 rounded-xl font-bold transition-all ${
                                            act.type === 'primary' ? 'bg-[#2d5a52] text-white hover:opacity-90' :
                                            act.type === 'danger' ? 'bg-[#963530] text-white hover:opacity-90' :
                                            act.type === 'secondary' ? 'bg-[#f1eee4] text-[#2d5a52] border border-[#e2ded0] hover:bg-[#e2ded0]' :
                                            'text-slate-400 hover:text-slate-600'
                                        }`}
                                    >
                                        {act.label}
                                    </button>
                                ))}
                            </div>
                        </div>
                    </div>
                );
            };

            const GenerationModal = ({ status, onClose }) => {
                if (!status) return null;
                const isAllDone = status.steps.every(s => s.status === 'done' || s.status === 'error');

                return (
                    <div className="fixed inset-0 z-[300] flex items-center justify-center p-4">
                        <div className="absolute inset-0 bg-[#2d5a52]/60 backdrop-blur-md animate-in fade-in" onClick={isAllDone ? onClose : null}></div>
                        <div className="relative bg-white border border-[#e2ded0] w-full max-w-md p-8 rounded-3xl shadow-2xl animate-in zoom-in-95 fade-in duration-300 flex flex-col">
                            <div className="flex items-center space-x-3 mb-6">
                                <div className="p-3 bg-[#2d5a52]/10 rounded-2xl">
                                    {isAllDone ? (
                                        <Icon name="check-circle" className="w-8 h-8 text-[#2d5a52]" />
                                    ) : (
                                        <div className="w-8 h-8 flex items-center justify-center">
                                            <div className="w-full h-full border-4 border-[#2d5a52]/20 border-t-[#2d5a52] rounded-full animate-spin"></div>
                                        </div>
                                    )}
                                </div>
                                <div className="flex-1">
                                    <h3 className="text-xl font-bold text-[#2d5a52]">{isAllDone ? "方案构建完成" : "正在深度解析中"}</h3>
                                    <p className="text-xs text-slate-400 font-medium">请稍候，专家正在为您构建满分方案</p>
                                </div>
                                {isAllDone && <button onClick={onClose} className="p-2 hover:bg-slate-100 rounded-full transition-colors text-slate-400"><Icon name="x" className="w-5 h-5"/></button>}
                            </div>

                            <div className="space-y-4 mb-8">
                                {status.steps.map((step, idx) => {
                                    const StepItem = ({ s, i }) => {
                                        return (
                                            <div className="bg-[#fcfaf2] border border-[#e2ded0] rounded-2xl transition-all overflow-hidden shadow-sm">
                                                <div className="flex items-center justify-between p-4 bg-[#f1eee4]/50 border-b border-[#e2ded0]/50 text-sm">
                                                    <div className="flex items-center space-x-3">
                                                        <div className={`w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${
                                                            s.status === 'done' ? 'bg-[#2d5a52] text-white' :
                                                            s.status === 'running' ? 'bg-[#2d5a52]/20 text-[#2d5a52] animate-pulse' :
                                                            s.status === 'error' ? 'bg-[#963530] text-white' :
                                                            'bg-slate-100 text-slate-400'
                                                        }`}>
                                                            {s.status === 'done' ? <Icon name="check" className="w-3.5 h-3.5"/> : 
                                                             s.status === 'error' ? <Icon name="alert-circle" className="w-3.5 h-3.5"/> : (i + 1)}
                                                        </div>
                                                        <span className={`font-semibold ${s.status === 'running' ? 'text-[#2d5a52]' : 'text-slate-600'}`}>{s.label}</span>
                                                    </div>
                                                    <div className="flex items-center">
                                                        {s.status === 'running' && <div className="flex space-x-1"><div className="w-1.5 h-1.5 bg-[#2d5a52] rounded-full animate-bounce [animation-delay:-0.3s]"></div><div className="w-1.5 h-1.5 bg-[#2d5a52] rounded-full animate-bounce [animation-delay:-0.15s]"></div><div className="w-1.5 h-1.5 bg-[#2d5a52] rounded-full animate-bounce"></div></div>}
                                                        {s.status === 'done' && <span className="text-[10px] text-[#2d5a52] font-bold bg-[#2d5a52]/10 px-2 py-0.5 rounded tracking-tighter">SUCCESS</span>}
                                                        {s.status === 'error' && <span className="text-[10px] text-[#963530] font-bold bg-[#963530]/10 px-2 py-0.5 rounded tracking-tighter">FAILED</span>}
                                                    </div>
                                                </div>
                                                {s.status === 'running' && (
                                                    <div className="p-3 bg-white/50 h-32 overflow-hidden flex flex-col-reverse">
                                                        <div className="flex flex-col space-y-4">
                                                            {!s.preview && !s.reasoning ? (
                                                                <div className="py-8 flex flex-col items-center justify-center text-xs text-slate-400 animate-pulse italic">
                                                                    <Icon name="edit-3" className="w-3.5 h-3.5 mb-2" />
                                                                    <span>链接大模型中...</span>
                                                                </div>
                                                            ) : (
                                                                <>
                                                                    {s.reasoning && (
                                                                        <div className="bg-[#f1eee4]/40 p-3 rounded-lg border-l-2 border-[#2d5a52]/30">
                                                                            <div className="flex items-center text-[10px] text-[#2d5a52] font-bold mb-2 opacity-60">
                                                                                <Icon name="sparkles" className="w-3 h-3 mr-1" />
                                                                                <span>思考深度解析中...</span>
                                                                            </div>
                                                                            <p className="text-[11px] text-slate-400 italic leading-relaxed whitespace-pre-wrap">
                                                                                {s.reasoning}
                                                                            </p>
                                                                        </div>
                                                                    )}
                                                                    {s.preview && (
                                                                        <div className="bg-[#2d5a52]/5 p-3 rounded-lg border-l-2 border-[#2d5a52]">
                                                                            <div className="flex items-center text-[10px] text-[#2d5a52] font-bold mb-2">
                                                                                <Icon name="pen-tool" className="w-3 h-3 mr-1" />
                                                                                <span>正在同步成文...</span>
                                                                            </div>
                                                                            <p className="text-[11px] text-[#2d5a52] leading-relaxed font-mono whitespace-pre-wrap">
                                                                                “ {s.preview} ”
                                                                            </p>
                                                                        </div>
                                                                    )}
                                                                </>
                                                            )}
                                                        </div>
                                                    </div>
                                                )}
                                                {s.status === 'done' && (
                                                    <div className="p-3 bg-white/50 max-h-24 overflow-hidden relative">
                                                        <p className="text-[11px] text-slate-500 line-clamp-3 leading-relaxed font-mono whitespace-pre-wrap italic">
                                                            “ {(s.preview || "").substring(0, 150)}{(s.preview && s.preview.length > 150) ? "..." : ""} ”
                                                        </p>
                                                        <div className="absolute inset-x-0 bottom-0 h-6 bg-gradient-to-t from-white/80 to-transparent"></div>
                                                    </div>
                                                )}
                                            </div>
                                        );
                                    };
                                    return <StepItem key={idx} s={step} i={idx} />;
                                })}
                            </div>

                            {isAllDone && (
                                <button onClick={onClose} className="w-full py-4 bg-[#2d5a52] text-white rounded-2xl font-bold shadow-lg shadow-[#2d5a52]/20 hover:opacity-90 active:scale-95 transition-all">
                                    进入查看结果
                                </button>
                            )}
                        </div>
                    </div>
                );
            };

            return (
                <div className="max-w-4xl mx-auto px-4 py-12 relative">
                    <header className="text-center mb-12 space-y-4">
                        <h1 className="text-4xl font-bold tracking-tight font-heading">
                            作文分析
                        </h1>
                        <div className="flex items-center justify-center space-x-6">
                            <button onClick={() => setShowArchives(true)} className="inline-flex items-center text-slate-500 hover:text-[#2d5a52] transition-colors font-medium">
                                <Icon name="history" className="w-4 h-4 mr-1.5" />
                                历史归档
                            </button>
                            <button onClick={() => setShowSettings(!showSettings)} className="inline-flex items-center text-slate-500 hover:text-[#2d5a52] transition-colors font-medium">
                                <Icon name="settings" className="w-4 h-4 mr-1.5" />
                                设置
                            </button>
                        </div>
                    </header>

                    <main className="space-y-12">
                        {showSettings && (
                            <div className="bg-white/50 border rounded-xl p-6 border-dashed border-[#e2ded0] grid grid-cols-1 md:grid-cols-2 gap-6 scale-95 origin-top animate-in fade-in zoom-in-95">
                                <div className="space-y-2">
                                    <label className="text-sm font-semibold text-[#2d5a52]">服务商</label>
                                    <select className="w-full border rounded-lg px-3 py-2 bg-white/50" value={config.currentProvider} onChange={(e) => setConfig({...config, currentProvider: e.target.value})}>
                                        <option value="deepseek">DeepSeek</option>
                                        <option value="kimi">Kimi</option>
                                        <option value="zhipu">智谱 AI</option>
                                        <option value="qwen">通义千问</option>
                                        <option value="baidu">文心一言</option>
                                        <option value="doubao">豆包</option>
                                        <option value="ollama">Ollama</option>
                                    </select>
                                </div>
                                <div className="space-y-2">
                                    <label className="text-sm font-semibold text-[#2d5a52]">
                                        {config.currentProvider === 'doubao' ? 'API Key (Access Key)' : 'API Key'}
                                    </label>
                                    <input type="password" placeholder="输入 API Key..." className="w-full border rounded-lg px-3 py-2" value={config.providers[config.currentProvider].apiKey} onChange={(e) => setConfig({...config, providers: {...config.providers, [config.currentProvider]: {...config.providers[config.currentProvider], apiKey: e.target.value}}})} />
                                </div>
                                {config.currentProvider === 'deepseek' && (
                                    <div className="space-y-2">
                                        <label className="text-sm font-semibold text-[#2d5a52]">模型选择</label>
                                        <select className="w-full border rounded-lg px-3 py-2" value={config.providers.deepseek.model || "deepseek-v4-flash"} onChange={(e) => setConfig({...config, providers: {...config.providers, deepseek: {...config.providers.deepseek, model: e.target.value}}})}>
                                            <option value="deepseek-v4-flash">DeepSeek V4 Flash (默认)</option>
                                            <option value="deepseek-v4-pro">DeepSeek V4 Pro (深入思考)</option>
                                        </select>
                                    </div>
                                )}
                                {config.currentProvider === 'doubao' && (
                                    <div className="space-y-2">
                                        <label className="text-sm font-semibold text-[#2d5a52]">推理接入点 ID (Endpoint ID)</label>
                                        <input type="text" placeholder="ep-2024..." className="w-full border rounded-lg px-3 py-2" value={config.providers.doubao.endpointId} onChange={(e) => setConfig({...config, providers: {...config.providers, doubao: {...config.providers.doubao, endpointId: e.target.value}}})} />
                                    </div>
                                )}
                                {config.currentProvider === 'ollama' && (
                                    <div className="space-y-2">
                                        <label className="text-sm font-semibold text-[#2d5a52]">模型名称</label>
                                        <input type="text" placeholder="qwen2, llama3..." className="w-full border rounded-lg px-3 py-2" value={config.providers.ollama.ollamaModel} onChange={(e) => setConfig({...config, providers: {...config.providers, ollama: {...config.providers.ollama, ollamaModel: e.target.value}}})} />
                                    </div>
                                )}
                                <div className="md:col-span-2 pt-4 flex justify-end border-t border-[#e2ded0] mt-4">
                                    <button 
                                        onClick={() => {
                                            setShowSettings(false);
                                            showToast("配置已成功持久化保存");
                                        }} 
                                        className="px-8 py-3 bg-[#2d5a52] text-white rounded-xl font-bold hover:bg-[#1f3d38] active:scale-95 transition-all shadow-lg shadow-[#2d5a52]/30 flex items-center space-x-2 ring-2 ring-emerald-100 ring-offset-2"
                                    >
                                        <Icon name="check" className="w-5 h-5" />
                                        <span>保存设置</span>
                                    </button>
                                </div>
                            </div>
                        )}

                        <div className="space-y-4">
                            <textarea className="w-full border rounded-2xl p-4 sm:p-6 h-24 text-lg border-[#e2ded0] bg-white shadow-sm transition-all focus:ring-2 focus:ring-[#2d5a52]/40 outline-none" placeholder="输入作文题目..." value={topic} onChange={(e) => setTopic(e.target.value)} />
                            <div className="grid grid-cols-1 gap-3">
                                <div className="flex flex-col sm:flex-row gap-3">
                                    <button onClick={handleAnalyzeAll} disabled={Object.values(isLoading).some(v => v)} className="sm:flex-[3] w-full bg-[#2d5a52] text-white rounded-xl h-14 sm:h-16 text-lg sm:text-xl font-bold flex items-center justify-center hover:opacity-90 active:scale-95 transition-all shadow-lg shadow-[#2d5a52]/10 px-4 min-h-[3.5rem]">
                                        {Object.values(isLoading).some(v => v) ? "正在全速生成..." : "一键开启 AI 深度拆解"}
                                    </button>
                                    <button onClick={copyAIPrompt} className="sm:flex-1 w-full bg-[#f1eee4] text-[#2d5a52] border border-[#e2ded0] rounded-xl h-14 sm:h-16 flex items-center justify-center space-x-2 hover:bg-[#e2ded0] transition-all active:scale-95 shrink-0 px-4 font-semibold text-sm sm:text-base min-h-[3.5rem]">
                                        <Icon name="message-square" className="w-5 h-5"/>
                                        <span>复制 AI 指令</span>
                                    </button>
                                </div>
                                {(data.analysis || data.materials || data.essays) && (
                                    <div className="grid grid-cols-8 gap-2">
                                        <button onClick={saveToArchive} className="col-span-2 bg-[#2d5a52]/10 text-[#2d5a52] rounded-xl hover:bg-[#2d5a52]/20 border border-[#2d5a52]/20 flex items-center justify-center space-x-1 sm:space-x-2 h-14 sm:h-16 transition-all active:scale-95 shadow-sm overflow-hidden" title="保存到历史归档">
                                            <Icon name="save" className="w-5 h-5 flex-shrink-0"/>
                                            <span className="font-semibold text-sm sm:text-base whitespace-nowrap">全文存档</span>
                                        </button>
                                        <button onClick={copyFull} className="col-span-2 bg-white border border-[#e2ded0] text-[#2d5a52] rounded-xl hover:bg-slate-50 flex items-center justify-center space-x-1 sm:space-x-2 h-14 sm:h-16 transition-all active:scale-95 shadow-sm overflow-hidden" title="复制完整报告内容">
                                            <Icon name="copy" className="w-5 h-5 flex-shrink-0"/>
                                            <span className="font-semibold text-sm sm:text-base whitespace-nowrap">全文复制</span>
                                        </button>
                                        <button onClick={() => exportWord()} className="col-span-3 bg-[#963530] text-white rounded-xl hover:opacity-90 flex items-center justify-center space-x-1 sm:space-x-2 h-14 sm:h-16 transition-all active:scale-95 shadow-sm overflow-hidden">
                                            <Icon name="file-text" className="w-5 h-5 flex-shrink-0"/>
                                            <span className="font-semibold text-sm sm:text-base whitespace-nowrap">导出 Word</span>
                                        </button>
                                        <button onClick={clearAllData} className="col-span-1 bg-white text-slate-400 hover:text-[#963530] border border-[#e2ded0] rounded-xl hover:bg-slate-50 flex items-center justify-center h-14 sm:h-16 transition-all active:scale-95 shadow-sm overflow-hidden" title="清空当前所有内容">
                                            <Icon name="trash" className="w-5 h-5 flex-shrink-0"/>
                                        </button>
                                    </div>
                                )}
                            </div>
                        </div>

                        {/* Analysis Section */}
                        {data.analysis && (
                            <div className="animate-in fade-in slide-in-from-bottom-4">
                                <SectionHeader title="审题立意" onRefresh={() => runTask('analysis')} onCopy={() => copyText(Object.values(data.analysis).join('\n'))} loading={isLoading.analysis} />
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                    {['K', 'Q', 'X', 'Y', 'A', 'C'].map(k => (
                                        <ResultBox 
                                            key={k} 
                                            label={({K:'K · 客观境遇', Q:'Q · 核心前提', X:'X · 现状对比', Y:'Y · 核心理法', A:'A · 行动路径', C:'C · 价值重塑'}[k])} 
                                            content={data.analysis[k]} 
                                            onUpdate={(val) => setData(prev => ({...prev, analysis: {...prev.analysis, [k]: val}}))} 
                                            onRefresh={(tip) => runTask('analysis', k, ({K:'客观境遇 K', Q:'核心前提 Q', X:'现状对比 X', Y:'核心理法 Y', A:'行动路径 A', C:'价值重塑 C'}[k]), tip)}
                                            loading={isLoading[k]}
                                        />
                                    ))}
                                </div>
                            </div>
                        )}

                        {/* Materials Section */}
                        {data.materials && (
                            <div className="animate-in fade-in slide-in-from-bottom-4">
                                <SectionHeader title="材料支撑" onRefresh={() => runTask('materials')} onCopy={() => copyText(`${data.materials.MAT_LIFE}\n${data.materials.MAT_HISTORY}\n${data.materials.MAT_CROSS}`)} loading={isLoading.materials} />
                                <div className="space-y-6">
                                    <ResultBox 
                                        label="生活情境素材"
                                        content={data.materials.MAT_LIFE} 
                                        onUpdate={(val) => setData(prev => ({...prev, materials: {...prev.materials, MAT_LIFE: val}}))}
                                        onRefresh={(tip) => runTask('materials', 'MAT_LIFE', '生活情境素材', tip)}
                                        loading={isLoading.MAT_LIFE}
                                    />
                                    <ResultBox 
                                        label="历史文化素材"
                                        content={data.materials.MAT_HISTORY} 
                                        onUpdate={(val) => setData(prev => ({...prev, materials: {...prev.materials, MAT_HISTORY: val}}))}
                                        onRefresh={(tip) => runTask('materials', 'MAT_HISTORY', '历史文化素材', tip)}
                                        loading={isLoading.MAT_HISTORY}
                                    />
                                    <ResultBox 
                                        label="跨界启发素材"
                                        content={data.materials.MAT_CROSS} 
                                        onUpdate={(val) => setData(prev => ({...prev, materials: {...prev.materials, MAT_CROSS: val}}))}
                                        onRefresh={(tip) => runTask('materials', 'MAT_CROSS', '跨界启发素材', tip)}
                                        loading={isLoading.MAT_CROSS}
                                    />
                                </div>
                            </div>
                        )}

                        {/* Essays Section */}
                        {data.essays && (
                            <div className="animate-in fade-in slide-in-from-bottom-4 pb-12">
                                <SectionHeader title="优秀范文" onRefresh={() => runTask('essays')} onCopy={() => copyText(`[记叙文]\n${data.essays.NARRATIVE}\n\n[议论文]\n${data.essays.ARGUMENTATIVE}`)} loading={isLoading.essays} />
                                <div className="space-y-8">
                                    <ResultBox 
                                        label="记叙文" 
                                        content={data.essays.NARRATIVE} 
                                        onUpdate={(val) => setData(prev => ({...prev, essays: {...prev.essays, NARRATIVE: val}}))}
                                        onRefresh={(tip) => runTask('essays', 'NARRATIVE', '记叙文', tip)}
                                        loading={isLoading.NARRATIVE}
                                    />
                                    <ResultBox 
                                        label="议论文" 
                                        content={data.essays.ARGUMENTATIVE} 
                                        onUpdate={(val) => setData(prev => ({...prev, essays: {...prev.essays, ARGUMENTATIVE: val}}))}
                                        onRefresh={(tip) => runTask('essays', 'ARGUMENTATIVE', '议论文', tip)}
                                        loading={isLoading.ARGUMENTATIVE}
                                    />
                                </div>
                            </div>
                        )}

                        {/* Archive Modal */}
                        {showArchives && (
                            <div className="fixed inset-0 bg-black/40 flex items-center justify-center z-[120] p-4 animate-in fade-in duration-200">
                                <div className="bg-[#fcfaf2] w-full max-w-4xl max-h-[85vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden border border-[#e2ded0]">
                                    <div className="px-6 py-4 border-b border-[#e2ded0] flex items-center justify-between bg-[#f1eee4]">
                                        <div className="flex items-center space-x-3">
                                            <Icon name="archive" className="w-6 h-6 text-[#2d5a52]" />
                                            <h2 className="text-xl font-bold text-[#2d5a52]">历史归档</h2>
                                            <span className="text-xs bg-[#2d5a52]/10 text-[#2d5a52] px-2 py-0.5 rounded-full font-semibold">{archives.length} 条记录</span>
                                        </div>
                                        <button onClick={() => { setShowArchives(false); setSelectedArchiveIds([]); }} className="p-2 hover:bg-[#e2ded0] rounded-full transition-colors">
                                            <Icon name="x" className="w-6 h-6 text-slate-500" />
                                        </button>
                                    </div>

                                    <div className="flex-1 overflow-y-auto p-4 sm:p-6 space-y-3">
                                        {archives.length === 0 ? (
                                            <div className="h-60 flex flex-col items-center justify-center text-slate-400 space-y-4">
                                                <Icon name="archive" className="w-12 h-12 opacity-20" />
                                                <p>暂无归档内容，请在主页点击“存归档”</p>
                                            </div>
                                        ) : (
                                            archives.map(archive => (
                                                <div key={archive.id} className={`group border rounded-xl p-4 flex flex-col sm:flex-row items-start sm:items-center justify-between gap-4 transition-all hover:border-[#2d5a52] hover:bg-white paper-shadow ${selectedArchiveIds.includes(archive.id) ? 'bg-white border-[#2d5a52] ring-2 ring-[#2d5a52]/10' : 'bg-white/50 border-[#e2ded0]'}`}>
                                                    <div className="flex items-start space-x-4 flex-1 min-w-0">
                                                        <button onClick={() => toggleArchiveSelection(archive.id)} className={`mt-1 flex-shrink-0 transition-colors ${selectedArchiveIds.includes(archive.id) ? 'text-[#2d5a52]' : 'text-slate-300 hover:text-slate-400'}`}>
                                                            <Icon name={selectedArchiveIds.includes(archive.id) ? "check-square" : "square"} className="w-6 h-6" />
                                                        </button>
                        <div className="min-w-0 flex-1 cursor-pointer" onClick={() => loadArchive(archive)}>
                            <h3 className="font-bold text-[#2c2c2c] truncate text-lg">{archive.topic}</h3>
                            <div className="flex items-center space-x-3 text-xs text-slate-400 mt-1">
                                <span>{new Date(archive.timestamp).toLocaleString()}</span>
                                <span className="bg-slate-100 px-1.5 py-0.5 rounded italic">
                                    {[archive.data.analysis && '审题', archive.data.materials && '材料', archive.data.essays && '范文'].filter(Boolean).join(' · ')}
                                </span>
                            </div>
                        </div>
                    </div>
                    <div className="flex items-center space-x-2 w-full sm:w-auto justify-end">
                        <button onClick={() => loadArchive(archive)} className="p-2 text-[#2d5a52] hover:bg-[#2d5a52]/10 rounded-lg flex items-center space-x-1" title="载入到草稿区">
                            <Icon name="rotate-cw" className="w-4 h-4" />
                            <span className="text-sm font-medium">载入</span>
                        </button>
                        <button onClick={() => editArchiveContent(archive)} className="p-2 text-blue-600 hover:bg-blue-50 rounded-lg flex items-center space-x-1" title="修改归档所有内容">
                            <Icon name="edit" className="w-4 h-4" />
                            <span className="text-sm font-medium">编辑内容</span>
                        </button>
                        <button onClick={() => deleteArchive(archive.id)} className="p-2 text-slate-400 hover:text-[#963530] hover:bg-[#963530]/10 rounded-lg" title="删除记录">
                            <Icon name="trash" className="w-4 h-4" />
                        </button>
                    </div>
                                                </div>
                                            ))
                                        )}
                                    </div>

                                    {archives.length > 0 && (
                                        <div className="px-6 py-4 border-t border-[#e2ded0] bg-[#f1eee4] flex items-center justify-between">
                                            <div className="flex items-center space-x-4 text-sm font-medium">
                                <button onClick={() => setSelectedArchiveIds(selectedArchiveIds.length === archives.length ? [] : archives.map(a => a.id))} className="text-[#2d5a52] hover:underline whitespace-nowrap">
                                                    {selectedArchiveIds.length === archives.length ? "取消全选" : "全选"}
                                                </button>
                                                <span className="text-slate-500 whitespace-nowrap">已选 {selectedArchiveIds.length} 项</span>
                                            </div>
                                            <div className="flex items-center space-x-3">
                                                <button onClick={batchDeleteArchives} disabled={selectedArchiveIds.length === 0} className={`px-4 py-2 rounded-lg text-sm font-bold flex items-center space-x-2 transition-all ${selectedArchiveIds.length === 0 ? 'bg-slate-200 text-slate-400' : 'bg-white text-[#963530] border border-[#963530]/20 hover:bg-[#963530]/5 active:scale-95'}`}>
                                                    <Icon name="trash" className="w-4 h-4" />
                                                    <span>批量删除</span>
                                                </button>
                                                <button onClick={batchExportWord} disabled={selectedArchiveIds.length === 0} className={`px-5 py-2 rounded-lg text-sm font-bold flex items-center space-x-2 transition-all shadow-md ${selectedArchiveIds.length === 0 ? 'bg-slate-300 text-white' : 'bg-[#963530] text-white hover:opacity-90 active:scale-95'}`}>
                                                    <Icon name="package" className="w-4 h-4" />
                                                    <span>批量导出 Word</span>
                                                </button>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}
                    </main>

                    <Modal config={modal} />
                    <GenerationModal status={genStatus} onClose={() => setGenStatus(null)} />
                    {/* Toast */}
                    {toast && <div className="fixed top-12 left-1/2 -translate-x-1/2 bg-[#2d5a52] text-white px-8 py-3 rounded-full shadow-2xl z-[210] animate-in slide-in-from-top-4 duration-300 transition-all font-semibold whitespace-nowrap">{toast}</div>}
                </div>
            );
        }


        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
