<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>计时闹钟</title>
<style>
:root{--bg:#f8f9fa;--text:#212529;--muted:#6c757d;--accent:#000;--card-bg:#fff;--danger:#dc3545;--success:#198754;--border:#dee2e6;--shadow:rgba(0,0,0,.05);--warning:#e67e22;--blue:#3498db}
[data-theme="dark"]{--bg:#121212;--text:#e9ecef;--muted:#adb5bd;--accent:#fff;--card-bg:#1e1e1e;--danger:#ff4d4d;--success:#2ecc71;--border:#333;--shadow:rgba(0,0,0,.3);--warning:#f39c12;--blue:#5dade2}
[data-theme="dark"] input::-webkit-calendar-picker-indicator{filter:invert(1)}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
body{background-color:var(--bg);color:var(--text);display:flex;justify-content:center;align-items:flex-start;min-height:100vh;padding:16px}
.container{width:100%;max-width:450px;text-align:center}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem}
.header-right{display:flex;align-items:center;gap:6px}
.clock-display{font-size:3.5rem;font-weight:700;margin-bottom:.2rem;letter-spacing:0;font-feature-settings:"tnum";-moz-font-feature-settings:"tnum"}
.date-display{font-size:.9rem;color:var(--muted);margin-bottom:1rem}
.card{background:var(--card-bg);padding:1rem;border-radius:16px;box-shadow:0 6px 20px var(--shadow);margin-bottom:.8rem;border:1px solid var(--border);text-align:left}
.card-title{font-weight:700;font-size:.9rem;margin-bottom:.6rem}
.input-group{display:flex;flex-direction:column;gap:10px}
.time-input-wrapper{display:flex;align-items:center;gap:8px}
input[type="text"],input[type="time"],input[type="number"],select{padding:8px;border:1px solid var(--border);border-radius:8px;font-size:.9rem;background:var(--bg);color:var(--text);outline:none;flex:1}
.quick-add{display:grid;grid-template-columns:repeat(4,1fr);gap:5px}
.quick-btn{padding:6px;font-size:.75rem;background:var(--border);color:var(--text);border-radius:6px;font-weight:500}
button{padding:8px 14px;background:var(--accent);color:var(--card-bg);border:none;border-radius:8px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:5px;font-size:.85rem}
button.secondary{background:var(--border);color:var(--text)}
button.danger{background:var(--danger);color:#fff}
button.success{background:var(--success);color:#fff}
button.warning{background:var(--warning);color:#fff}
button.blue{background:var(--blue);color:#fff}
.icon-btn{background:transparent;color:var(--text);padding:6px;border-radius:50%;font-size:1.1rem;border:none}
.icon-btn:hover{background:rgba(128,128,128,.1)}
.timer-display{font-size:4rem;font-weight:700;letter-spacing:0;margin:8px 0;text-align:center;transition:color .3s;font-feature-settings:"tnum";-moz-font-feature-settings:"tnum"}
.timer-display.warning{color:var(--warning)}
.timer-display.danger{color:var(--danger);animation:timerPulse 1s infinite}
@keyframes timerPulse{0%,100%{opacity:1}50%{opacity:.5}}
.timer-status{text-align:center;font-size:.8rem;color:var(--muted);margin-bottom:8px}
.timer-presets{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;margin-bottom:8px}
.preset-btn{padding:6px 3px;font-size:.75rem;background:var(--border);color:var(--text);border-radius:6px;font-weight:500}
.preset-btn.active{background:var(--accent);color:var(--card-bg)}
.timer-controls{display:flex;gap:6px;justify-content:center}
.timer-controls button{flex:1;padding:10px;font-size:.85rem}
.timer-progress{width:100%;height:5px;background:var(--border);border-radius:3px;margin:8px 0;overflow:hidden}
.timer-progress-bar{height:100%;background:var(--accent);border-radius:3px;transition:width 1s linear,background-color .3s}
.timer-progress-bar.warning{background:var(--warning)}
.timer-progress-bar.danger{background:var(--danger)}
.timer-meta{display:flex;justify-content:space-between;font-size:.72rem;color:var(--muted)}
.switch{position:relative;display:inline-block;width:36px;height:20px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0}
.slider{position:absolute;cursor:pointer;top:0;left:0;right:0;bottom:0;background-color:var(--border);transition:.3s;border-radius:20px}
.slider:before{position:absolute;content:"";height:14px;width:14px;left:3px;bottom:3px;background-color:#fff;transition:.3s;border-radius:50%}
input:checked+.slider{background-color:var(--success)}
input:checked+.slider:before{transform:translateX(16px)}
.tab-bar{display:flex;background:var(--border);border-radius:8px;overflow:hidden;margin-bottom:.8rem}
.tab-btn{flex:1;padding:7px;font-size:.78rem;background:transparent;color:var(--muted);border-radius:0;font-weight:600;position:relative}
.tab-btn.active{background:var(--accent);color:var(--card-bg)}
.tab-btn .running-dot{position:absolute;top:3px;right:6px;width:6px;height:6px;border-radius:50%;background:var(--danger);display:none}
.tab-btn.has-running .running-dot{display:block}
.tab-content{display:none}.tab-content.active{display:block}
.exam-mode-toggle{display:flex;align-items:center;gap:8px;margin-bottom:10px;padding:6px 10px;background:var(--bg);border-radius:8px;font-size:.82rem}
.exam-fields{display:none;flex-direction:column;gap:8px;margin-top:8px}.exam-fields.show{display:flex}
.field-row{display:flex;align-items:center;gap:8px}
.field-label{font-size:.78rem;color:var(--muted);min-width:56px}
.field-row select,.field-row input{font-size:.85rem;padding:7px}
.pomodoro-phase{text-align:center;font-size:.9rem;font-weight:700;margin-bottom:4px}
.pomodoro-sessions{text-align:center;font-size:.75rem;color:var(--muted);margin-top:4px}
.empty-state{text-align:center;color:var(--muted);padding:1rem 0;font-size:.8rem}
.volume-control{display:flex;align-items:center;gap:6px;margin-top:6px}
.volume-control input[type="range"]{flex:1}
.audio-hint{position:fixed;top:0;left:0;width:100%;background:var(--danger);color:#fff;padding:8px;text-align:center;font-size:.85rem;font-weight:600;z-index:2000;cursor:pointer;display:none}
/* scroll picker */
.scroll-picker{display:flex;gap:6px;justify-content:center}
.picker-box{position:relative}
.picker-box::after{content:'';position:absolute;left:0;right:0;top:50%;height:32px;transform:translateY(-50%);border-top:1px solid var(--border);border-bottom:1px solid var(--border);pointer-events:none}
.picker-col{width:60px;height:60px;overflow-y:auto;scroll-snap-type:y mandatory;-webkit-overflow-scrolling:touch;-webkit-mask-image:linear-gradient(180deg,transparent 0,#000 28%,#000 72%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 28%,#000 72%,transparent 100%);user-select:none;-webkit-user-select:none;cursor:grab}
.picker-col:active{cursor:grabbing}
.picker-col::-webkit-scrollbar{width:0}
.picker-item{height:32px;display:flex;align-items:center;justify-content:center;font-size:.95rem;font-weight:500;color:var(--muted);scroll-snap-align:center;transition:color .15s}
.picker-item.selected{color:var(--text);font-weight:700}
.picker-label{font-size:.7rem;color:var(--muted);text-align:center;margin-bottom:3px}
/* overlay */
.overlay{position:fixed;top:0;left:0;width:100vw;height:100vh;background:var(--bg);display:none;flex-direction:column;justify-content:center;align-items:center;z-index:1000;padding:2rem;overflow-y:auto;overflow-x:hidden}
.overlay.active{display:flex}
.overlay-title{font-size:2rem;font-weight:800;margin-bottom:.8rem}
.overlay-time{font-size:1.5rem;margin-bottom:2rem;color:var(--muted)}
.overlay-controls{display:flex;gap:16px}
.alarm-list{margin-top:.4rem}
.alarm-item{display:flex;justify-content:space-between;align-items:center;padding:.6rem;background:var(--bg);border-radius:10px;margin-bottom:.4rem;border:1px solid transparent}
.alarm-item.disabled{opacity:.5;filter:grayscale(.5)}
.alarm-info{display:flex;flex-direction:column;gap:1px}
.alarm-time{font-size:1.1rem;font-weight:800;line-height:1}
.alarm-label{font-size:.72rem;color:var(--muted)}
.alarm-countdown{font-size:.65rem;color:var(--success);font-weight:600;margin-top:1px}
.alarm-controls{display:flex;align-items:center;gap:8px}
/* exam fullscreen */
.exam-fs .exam-fs-time{font-size:clamp(2.5rem,18vw,14rem);font-weight:700;letter-spacing:0;line-height:1.1;white-space:nowrap;text-align:center;font-feature-settings:"tnum";-moz-font-feature-settings:"tnum"}
.exam-fs .exam-fs-label{font-size:clamp(1rem,5vw,3.5rem);font-weight:600;margin-bottom:10px}
.exam-fs .exam-fs-current{font-size:clamp(1rem,5vw,4rem);color:var(--muted);margin-top:20px;font-weight:400;white-space:nowrap}
.exam-fs .exam-fs-info{font-size:clamp(.8rem,4vw,2.5rem);color:var(--muted);margin:10px 0;white-space:nowrap}
.exam-fs .exam-fs-progress{width:80%;max-width:500px;height:clamp(6px,1.5vw,18px);background:var(--border);border-radius:10px;overflow:hidden;margin:15px 0}
.exam-fs .exam-fs-progress-bar{height:100%;background:var(--accent);border-radius:10px;transition:width 1s linear}
.exam-fs .exam-fs-btn{padding:clamp(10px,3vw,28px) clamp(20px,6vw,60px);font-size:clamp(1rem,4vw,2.8rem);border-radius:12px}

.pom-fs .pom-fs-phase{font-size:clamp(1rem,5vw,4rem);font-weight:700;margin-bottom:10px}
.pom-fs .pom-fs-time{font-size:clamp(2.5rem,18vw,16rem);font-weight:700;letter-spacing:0;line-height:1.1;white-space:nowrap;text-align:center;font-feature-settings:"tnum";-moz-font-feature-settings:"tnum"}
.pom-fs .pom-fs-sessions{font-size:clamp(.8rem,4vw,2.5rem);color:var(--muted);margin-top:15px;white-space:nowrap}
.pom-fs .pom-fs-progress{width:80%;max-width:500px;height:clamp(6px,1.5vw,18px);background:var(--border);border-radius:10px;overflow:hidden;margin:15px 0}
.pom-fs .pom-fs-progress-bar{height:100%;background:var(--accent);border-radius:10px;transition:width 1s linear}
.pom-fs .pom-fs-btn{padding:clamp(10px,3vw,28px) clamp(20px,6vw,60px);font-size:clamp(1rem,4vw,2.8rem);border-radius:12px}
/* settings panel */
.settings-panel{position:fixed;top:0;right:0;width:280px;max-width:85vw;height:100%;background:var(--card-bg);box-shadow:-4px 0 20px rgba(0,0,0,.15);z-index:1500;padding:20px;transform:translateX(100%);transition:transform .3s}
.settings-panel.open{transform:translateX(0)}
.settings-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.3);z-index:1499;display:none}
.settings-overlay.open{display:block}
.settings-panel h3{font-size:1rem;margin-bottom:16px;font-weight:700}
.settings-row{margin-bottom:14px}
.settings-row label{display:block;font-size:.8rem;color:var(--muted);margin-bottom:4px}
.settings-row select,.settings-row input[type="range"]{width:100%}
@media(max-width:480px){.clock-display{font-size:2.5rem}.timer-display{font-size:2.8rem}.overlay{padding:1rem}.exam-fs .exam-fs-time{font-size:clamp(2rem,22vw,8rem)}.pom-fs .pom-fs-time{font-size:clamp(2rem,22vw,10rem)}}
@media(max-height:500px){.exam-fs .exam-fs-time{font-size:clamp(2rem,18vw,8rem)}.pom-fs .pom-fs-time{font-size:clamp(2rem,18vw,10rem)}}
@media(orientation:landscape) and (max-height:500px){.overlay{padding:.8rem}.exam-fs .exam-fs-label{margin-bottom:2px}.exam-fs .exam-fs-current{margin-top:5px}.exam-fs .exam-fs-info{margin:5px 0}.exam-fs .exam-fs-progress{margin:5px 0}.exam-fs .exam-fs-btn{margin-top:8px;padding:8px 24px}.pom-fs .pom-fs-phase{margin-bottom:2px}.pom-fs .pom-fs-sessions{margin-top:5px}.pom-fs .pom-fs-progress{margin:5px 0}.pom-fs .pom-fs-btn{margin-top:8px;padding:8px 24px}}
</style>
</head>
<body>
<div id="audioHint" class="audio-hint" onclick="activateAudio()">浏览器已限制音频，请点击此处激活</div>
<div class="container">
    <div class="header">
        <h2 style="font-weight:800;letter-spacing:-1px">计时闹钟</h2>
        <div class="header-right">
            <button class="icon-btn" onclick="openSettings()" title="设置">&#9881;</button>
            <button class="icon-btn" onclick="toggleTheme()" id="themeBtn">&#127769;</button>
        </div>
    </div>
    <div id="clock" class="clock-display">00:00:00</div>
    <div id="date" class="date-display"></div>
    <div class="tab-bar">
        <button class="tab-btn active" onclick="switchTab('alarm')">闹钟<span class="running-dot"></span></button>
        <button class="tab-btn" onclick="switchTab('timer')">计时器<span class="running-dot"></span></button>
        <button class="tab-btn" onclick="switchTab('pomodoro')">番茄钟<span class="running-dot"></span></button>
    </div>

    <!-- 闹钟 -->
    <div id="tab-alarm" class="tab-content active">
        <div class="card">
            <div class="exam-mode-toggle">
                <label class="switch"><input type="checkbox" id="examModeToggle" onchange="toggleExamMode()"><span class="slider"></span></label>
                <span>考试模式</span>
            </div>
            <div id="normalAlarm">
                <div class="input-group">
                    <input type="text" id="alarmLabel" placeholder="闹钟标签">
                    <div class="scroll-picker" id="alarmTimePicker">
                        <div>
                            <div class="picker-label">时</div>
                            <div class="picker-box"><div class="picker-col" id="alarmPickerH" data-type="hour"></div></div>
                        </div>
                        <div>
                            <div class="picker-label">分</div>
                            <div class="picker-box"><div class="picker-col" id="alarmPickerM" data-type="minute"></div></div>
                        </div>
                    </div>
                    <button onclick="addAlarm()" style="padding:10px">添加</button>
                    <div class="quick-add">
                        <button class="quick-btn" onclick="adjustTime(5)">+5分</button>
                        <button class="quick-btn" onclick="adjustTime(10)">+10分</button>
                        <button class="quick-btn" onclick="adjustTime(30)">+30分</button>
                        <button class="quick-btn" onclick="adjustTime(60)">+1小时</button>
                    </div>
                </div>
            </div>
            <div id="examFields" class="exam-fields">
                <div class="field-row"><span class="field-label">开始时间</span>
                    <div class="scroll-picker" id="examStartPicker" style="flex:1;justify-content:flex-start">
                        <div>
                            <div class="picker-label">时</div>
                            <div class="picker-box"><div class="picker-col" id="examPickerH" data-type="hour"></div></div>
                        </div>
                        <div>
                            <div class="picker-label">分</div>
                            <div class="picker-box"><div class="picker-col" id="examPickerM" data-type="minute"></div></div>
                        </div>
                    </div>
                </div>
                <div class="field-row"><span class="field-label">考试时长</span>
                    <select id="examDurationPreset" onchange="onExamDurationPreset()">
                        <option value="30">30分钟</option><option value="45">45分钟</option><option value="60" selected>60分钟</option>
                        <option value="90">90分钟</option><option value="120">120分钟</option><option value="150">150分钟</option>
                        <option value="180">180分钟</option><option value="custom">自定义...</option>
                    </select>
                </div>
                <div id="examCustomDurRow" class="field-row" style="display:none"><span class="field-label">自定义</span><input type="number" id="examCustomDuration" placeholder="分钟" min="1" max="600" style="flex:1"><span style="font-size:.8rem;color:var(--muted)">分钟</span></div>
                <div class="field-row"><span class="field-label">结束前提醒</span>
                    <select id="examWarning"><option value="0">不提醒</option><option value="5">5分钟前</option><option value="10">10分钟前</option><option value="15" selected>15分钟前</option></select>
                </div>
                <button class="success" style="width:100%;padding:10px;margin-top:4px" onclick="startExam()">开始考试（全屏）</button>
            </div>
        </div>
        <div class="card">
            <div class="card-title">我的闹钟</div>
            <div id="alarmList" class="alarm-list"></div>
        </div>
    </div>

    <!-- 计时器 -->
    <div id="tab-timer" class="tab-content">
        <div class="card">
            <div id="timerStatus" class="timer-status">选择时长开始计时</div>
            <div id="timerDisplay" class="timer-display">00:00:00</div>
            <div class="timer-progress"><div id="timerProgressBar" class="timer-progress-bar" style="width:100%"></div></div>
            <div class="timer-meta"><span id="timerElapsed">已用 00:00:00</span><span id="timerRemaining">剩余 00:00:00</span></div>
            <div style="margin-top:10px">
                <div class="timer-presets">
                    <button class="preset-btn" onclick="setTimer(1,this)">1分钟</button>
                    <button class="preset-btn" onclick="setTimer(5,this)">5分钟</button>
                    <button class="preset-btn" onclick="setTimer(15,this)">15分钟</button>
                    <button class="preset-btn" onclick="setTimer(30,this)">30分钟</button>
                    <button class="preset-btn" onclick="setTimer(45,this)">45分钟</button>
                    <button class="preset-btn" onclick="setTimer(60,this)">60分钟</button>
                </div>
                <div class="time-input-wrapper" style="margin-bottom:8px">
                    <input type="number" id="customMinutes" placeholder="自定义(分钟)" min="1" max="600" style="text-align:center">
                    <button class="secondary" onclick="setCustomTimer()">设置</button>
                </div>
            </div>
            <div class="timer-controls">
                <button id="timerStartBtn" class="success" onclick="startTimer()">开始</button>
                <button id="timerPauseBtn" class="warning" onclick="pauseTimer()" style="display:none">暂停</button>
                <button class="secondary" onclick="resetTimer()">重置</button>
            </div>
        </div>
    </div>

    <!-- 番茄钟 -->
    <div id="tab-pomodoro" class="tab-content">
        <div class="card">
            <div style="display:flex;gap:6px;margin-bottom:10px">
                <button class="preset-btn active" id="pomModeWork" onclick="switchPomMode('work')" style="flex:1">专注</button>
                <button class="preset-btn" id="pomModeBreak" onclick="switchPomMode('break')" style="flex:1">短休</button>
                <button class="preset-btn" id="pomModeLongBreak" onclick="switchPomMode('longBreak')" style="flex:1">长休</button>
            </div>
            <div id="pomPhase" class="pomodoro-phase">专注时间</div>
            <div id="pomDisplay" class="timer-display">25:00</div>
            <div class="timer-progress"><div id="pomProgressBar" class="timer-progress-bar" style="width:100%"></div></div>
            <div id="pomSessions" class="pomodoro-sessions">已完成 0 个番茄</div>
            <div id="pomSetInfo" class="pomodoro-sessions" style="margin-top:2px"></div>
            <div style="margin-top:10px">
                <div class="timer-presets">
                    <button class="preset-btn" onclick="setPomodoro(25,5,15,this)">25/5/15</button>
                    <button class="preset-btn" onclick="setPomodoro(30,5,15,this)">30/5/15</button>
                    <button class="preset-btn" onclick="setPomodoro(45,10,20,this)">45/10/20</button>
                </div>
                <div style="display:flex;gap:6px;margin-bottom:8px">
                    <div style="flex:1"><div style="font-size:.7rem;color:var(--muted);margin-bottom:3px">专注(分)</div><input type="number" id="pomWorkMin" value="25" min="1" max="120" style="width:100%;text-align:center"></div>
                    <div style="flex:1"><div style="font-size:.7rem;color:var(--muted);margin-bottom:3px">短休(分)</div><input type="number" id="pomBreakMin" value="5" min="1" max="30" style="width:100%;text-align:center"></div>
                    <div style="flex:1"><div style="font-size:.7rem;color:var(--muted);margin-bottom:3px">长休(分)</div><input type="number" id="pomLongBreakMin" value="15" min="1" max="60" style="width:100%;text-align:center"></div>
                </div>
            </div>
            <div class="timer-controls">
                <button id="pomStartBtn" class="success" onclick="startPomodoro()">开始</button>
                <button id="pomPauseBtn" class="warning" onclick="pausePomodoro()" style="display:none">暂停</button>
                <button class="secondary" onclick="resetPomodoro()">重置</button>
                <button class="blue" onclick="fullscreenPomodoro()" style="flex:none;width:auto;padding:8px 16px">全屏</button>
            </div>
        </div>
    </div>
</div>

<!-- 响铃 overlay -->
<div id="ringingOverlay" class="overlay">
    <div id="overlayLabel" class="overlay-title">时间到！</div>
    <div id="ringingTime" class="overlay-time"></div>
    <div class="overlay-controls"><button onclick="stopRinging()" class="danger" style="padding:12px 36px;font-size:1rem;font-weight:700">停止</button></div>
</div>

<!-- 考试全屏 -->
<div id="examOverlay" class="overlay exam-fs">
    <div id="examFsLabel" class="exam-fs-label">距开考还有</div>
    <div id="examFsTime" class="exam-fs-time">00:00:00</div>
    <div id="examFsInfo" class="exam-fs-info"></div>
    <div class="exam-fs-progress"><div id="examFsProgressBar" class="exam-fs-progress-bar" style="width:100%"></div></div>
    <div id="examFsCurrent" class="exam-fs-current"></div>
    <button onclick="exitExam()" class="secondary exam-fs-btn" style="margin-top:20px">退出考试</button>
</div>

<!-- 番茄钟全屏 -->
<div id="pomOverlay" class="overlay pom-fs">
    <div id="pomFsPhase" class="pom-fs-phase">专注时间</div>
    <div id="pomFsTime" class="pom-fs-time">25:00</div>
    <div class="pom-fs-progress"><div id="pomFsProgressBar" class="pom-fs-progress-bar" style="width:100%"></div></div>

<script>
(function(){
var lastTimeString="";
var state={theme:localStorage.getItem('theme')||'light',alarms:JSON.parse(localStorage.getItem('alarms'))||[],ringtone:localStorage.getItem('ringtone')||'ding',volume:parseFloat(localStorage.getItem('volume'))||0.5,isRinging:false};
var timer={totalSeconds:0,remainingSeconds:0,elapsedSeconds:0,interval:null,running:false,finished:false};
var pom={totalSeconds:0,remainingSeconds:0,interval:null,running:false,phase:'work',workMin:25,breakMin:5,longBreakMin:15,sessions:0,setCount:0,finished:false,_fsInterval:null,endTime:0,autoStartBreak:true};
var exam={running:false,interval:null,endTime:0,startTime:0,warningMin:15,warningSent:false,duration:0};
var ringTimer=null;
var alarmPicker=null,examPicker=null,alarmTimeValue='',examStartValue='';

function switchTab(tab){document.querySelectorAll('.tab-btn').forEach(function(b){b.classList.remove('active')});document.querySelectorAll('.tab-content').forEach(function(c){c.classList.remove('active')});document.querySelector('.tab-btn[onclick="switchTab(\''+tab+'\')"]').classList.add('active');document.getElementById('tab-'+tab).classList.add('active')}
function updateTabIndicators(){var tabs=document.querySelectorAll('.tab-btn');tabs.forEach(function(t){t.classList.remove('has-running')});if(state.isRinging||exam.running)tabs[0].classList.add('has-running');if(timer.running)tabs[1].classList.add('has-running');if(pom.running)tabs[2].classList.add('has-running')}
function isAnyRunning(){return state.isRinging||exam.running||timer.running||pom.running}

var audioCtx=null,oscillator=null,osc2=null,heartbeatOsc=null,isTesting=false;
function startHeartbeat(){if(!audioCtx||heartbeatOsc)return;try{heartbeatOsc=audioCtx.createOscillator();var g=audioCtx.createGain();heartbeatOsc.type='sine';heartbeatOsc.frequency.setValueAtTime(20,audioCtx.currentTime);g.gain.setValueAtTime(.001,audioCtx.currentTime);heartbeatOsc.connect(g);g.connect(audioCtx.destination);heartbeatOsc.start()}catch(e){}}

function startBeep(type,isChime){
    type=type||state.ringtone;activateAudio();
    if(oscillator){try{oscillator.stop()}catch(e){}oscillator=null}
    if(osc2){try{osc2.stop()}catch(e){}osc2=null}
    var bv=state.volume;oscillator=audioCtx.createOscillator();
    var mg=audioCtx.createGain();mg.gain.setValueAtTime(bv,audioCtx.currentTime);
    oscillator.connect(mg);mg.connect(audioCtx.destination);
    if(type==='ding'){
        oscillator.type='sine';
        for(var i=0;i<3;i++){var t=audioCtx.currentTime+i*0.35;oscillator.frequency.setValueAtTime(880,t);mg.gain.setValueAtTime(0,t);mg.gain.linearRampToValueAtTime(bv*.7,t+.01);mg.gain.exponentialRampToValueAtTime(.001,t+.25)}
        oscillator.start();oscillator.stop(audioCtx.currentTime+1.2);
    }else if(type==='melody'){
        var notes=[523.25,587.33,659.25,783.99,880,783.99,659.25,587.33];
        oscillator.type='sine';
        for(var i=0;i<40;i++){var t=audioCtx.currentTime+i*.35;oscillator.frequency.setValueAtTime(notes[i%notes.length],t);mg.gain.setValueAtTime(0,t);mg.gain.linearRampToValueAtTime(bv*.55,t+.04);mg.gain.exponentialRampToValueAtTime(.001,t+.3)}
        oscillator.start();oscillator.stop(audioCtx.currentTime+14);
    }else if(type==='crystal'){
        oscillator.type='sine';
        osc2=audioCtx.createOscillator();osc2.type='sine';
        var mg2=audioCtx.createGain();mg2.gain.setValueAtTime(bv*.35,audioCtx.currentTime);
        osc2.connect(mg2);mg2.connect(audioCtx.destination);
        var chords=[[523.25,659.25],[659.25,783.99],[783.99,1046.5],[659.25,523.25]];
        for(var i=0;i<30;i++){var t=audioCtx.currentTime+i*.7;var ch=chords[i%chords.length];oscillator.frequency.setValueAtTime(ch[0],t);osc2.frequency.setValueAtTime(ch[1],t);mg.gain.setValueAtTime(0,t);mg.gain.linearRampToValueAtTime(bv*.45,t+.02);mg.gain.exponentialRampToValueAtTime(.001,t+.6);mg2.gain.setValueAtTime(0,t);mg2.gain.linearRampToValueAtTime(bv*.25,t+.02);mg2.gain.exponentialRampToValueAtTime(.001,t+.6)}
        oscillator.start();osc2.start();oscillator.stop(audioCtx.currentTime+21);osc2.stop(audioCtx.currentTime+21);
    }
}
function playDing(){startBeep('ding',true)}
function stopBeep(){if(oscillator){try{oscillator.stop()}catch(e){}oscillator=null}if(osc2){try{osc2.stop()}catch(e){}osc2=null}}
function testRingtone(){if(isTesting){stopBeep();isTesting=false;document.getElementById('testBtn').textContent='试听';return}isTesting=true;document.getElementById('testBtn').textContent='停止';startBeep();setTimeout(function(){if(isTesting){stopBeep();isTesting=false;document.getElementById('testBtn').textContent='试听'}},3000)}
function updateRingtone(){state.ringtone=document.getElementById('ringtoneSelect').value;localStorage.setItem('ringtone',state.ringtone)}
function updateVolume(){state.volume=parseFloat(document.getElementById('volumeSlider').value);localStorage.setItem('volume',state.volume)}
function openSettings(){document.getElementById('settingsPanel').classList.add('open');document.getElementById('settingsOverlay').classList.add('open')}
function closeSettings(){document.getElementById('settingsPanel').classList.remove('open');document.getElementById('settingsOverlay').classList.remove('open')}

function updateClock(){
    var now=new Date(),h=String(now.getHours()).padStart(2,'0'),m=String(now.getMinutes()).padStart(2,'0'),s=String(now.getSeconds()).padStart(2,'0'),ct=h+':'+m+':'+s;
    document.getElementById('clock').textContent=ct;
    document.getElementById('date').textContent=now.toLocaleDateString('zh-CN',{year:'numeric',month:'long',day:'numeric',weekday:'long'});
    if(!audioCtx||audioCtx.state==='suspended')document.getElementById('audioHint').style.display='block';
    else document.getElementById('audioHint').style.display='none';
    if(!lastTimeString){lastTimeString=ct;return}
    if(s==='00')renderAlarms();
    state.alarms.forEach(function(a){if(!a.enabled)return;var at=a.time,triggered=false;if(ct>=lastTimeString){if(at>lastTimeString&&at<=ct)triggered=true}else{if(at>lastTimeString||at<=ct)triggered=true}if(triggered&&!state.isRinging)ring(a.label||'闹钟',a.time,300000)});
    lastTimeString=ct;
    updateTabIndicators();
    if(exam.running)updateExamFs();
    if(pom.running)updatePomFs();
}

/* exam mode */
function toggleExamMode(){var on=document.getElementById('examModeToggle').checked;document.getElementById('normalAlarm').style.display=on?'none':'block';document.getElementById('examFields').classList.toggle('show',on);if(on){var now=new Date();examStartValue=String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');examPicker.setVal(examStartValue)}}
function onExamDurationPreset(){var v=document.getElementById('examDurationPreset').value;document.getElementById('examCustomDurRow').style.display=v==='custom'?'flex':'none'}
function getExamDuration(){var v=document.getElementById('examDurationPreset').value;return v==='custom'?parseInt(document.getElementById('examCustomDuration').value)||60:parseInt(v)}
function startExam(){
    var st=examStartValue;if(!st)return;
    var dur=getExamDuration();var warn=parseInt(document.getElementById('examWarning').value);
    var parts=st.split(':').map(Number);var now=new Date();
    var startDT=new Date(now.getFullYear(),now.getMonth(),now.getDate(),parts[0],parts[1],0);
    var endDT=new Date(startDT.getTime()+dur*60000);
    exam={running:true,interval:null,endTime:endDT.getTime(),startTime:startDT.getTime(),warningMin:warn,warningSent:false,duration:dur};
    document.getElementById('examOverlay').classList.add('active');
    updateExamFs();
    exam.interval=setInterval(function(){
        var now=Date.now();
        if(now<exam.startTime){
            /* pre-exam */
        }else if(now<exam.endTime){
            /* during exam */
            if(!exam.warningSent&&exam.warningMin>0&&(exam.endTime-now)<=exam.warningMin*60000){exam.warningSent=true;playDing()}
        }else{
            /* exam over */
            clearInterval(exam.interval);exam.running=false;document.getElementById('examOverlay').classList.remove('active');ring('考试时间到','请停止作答',10000);return;
        }
        updateExamFs();
    },500);
    try{var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}
}
function updateExamFs(){
    var now=Date.now(),label=document.getElementById('examFsLabel'),time=document.getElementById('examFsTime'),info=document.getElementById('examFsInfo'),pb=document.getElementById('examFsProgressBar'),cur=document.getElementById('examFsCurrent');
    if(now<exam.startTime){
        var rem=exam.startTime-now;label.textContent='距开考还有';
        time.textContent=formatFull(rem);info.textContent='考试时长 '+exam.duration+'分钟';
        pb.style.width='100%';pb.style.background='var(--accent)';cur.textContent='';
    }else if(now<exam.endTime){
        var rem=exam.endTime-now;label.textContent='考试剩余';
        time.textContent=formatFull(rem);info.textContent='考试时长 '+exam.duration+'分钟';
        var progress=(rem/(exam.duration*60000))*100;pb.style.width=progress+'%';
        if(rem<=60000)pb.style.background='var(--danger)';else if(rem<=300000)pb.style.background='var(--warning)';else pb.style.background='var(--accent)';
        var n=new Date();cur.textContent='当前 '+String(n.getHours()).padStart(2,'0')+':'+String(n.getMinutes()).padStart(2,'0')+':'+String(n.getSeconds()).padStart(2,'0');
    }else{
        label.textContent='考试结束';time.textContent='00:00:00';info.textContent='';pb.style.width='0%';cur.textContent='';
    }
}
function exitExam(){if(exam.interval)clearInterval(exam.interval);exam.running=false;document.getElementById('examOverlay').classList.remove('active');try{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}catch(e){}updateTabIndicators()}

/* alarm */
function makePicker(col,items,onChange){
    var ITEM=32,PAD=14;
    col.innerHTML='<div style="height:'+PAD+'px"></div>'+items.map(function(v){return '<div class="picker-item" data-val="'+v+'">'+v+'</div>'}).join('')+'<div style="height:'+PAD+'px"></div>';
    var els=col.querySelectorAll('.picker-item');
    function nearestIdx(){
        return Math.max(0,Math.min(items.length-1,Math.round(col.scrollTop/ITEM)));
    }
    function setVal(v){
        var idx=items.indexOf(v);
        if(idx<0)return;
        for(var i=0;i<els.length;i++)els[i].classList.remove('selected');
        els[idx].classList.add('selected');
        col.scrollTop=idx*ITEM;
    }
    var deb=null;
    var wheelAcc=0;
    var dragTop=0,dragY=0,dragging=false;
    col.addEventListener('mousedown',function(e){
        if(e.button!==0)return;
        e.preventDefault();
        dragging=true;dragY=e.clientY;dragTop=col.scrollTop;
        col.style.scrollSnapType='none';
        function move(ev){
            if(!dragging)return;
            col.scrollTop=dragTop+(ev.clientY-dragY);
        }
        function up(){
            dragging=false;
            document.removeEventListener('mousemove',move);
            document.removeEventListener('mouseup',up);
            col.style.scrollSnapType='';
        }
        document.addEventListener('mousemove',move);
        document.addEventListener('mouseup',up);
    });
    col.addEventListener('wheel',function(e){
        if(!e.deltaY)return;
        e.preventDefault();
        var dy=e.deltaY;
        if(Math.abs(dy)>=50){
            var steps=Math.max(1,Math.round(Math.abs(dy)/100))*Math.sign(dy);
            col.scrollTop+=steps*ITEM;
            wheelAcc=0;
        }else{
            wheelAcc+=dy;
            while(wheelAcc>=ITEM){col.scrollTop+=ITEM;wheelAcc-=ITEM}
            while(wheelAcc<=-ITEM){col.scrollTop-=ITEM;wheelAcc+=ITEM}
        }
    },{passive:false});
    col.addEventListener('scroll',function(){
        if(deb)clearTimeout(deb);
        deb=setTimeout(function(){
            var idx=nearestIdx();
            for(var i=0;i<els.length;i++)els[i].classList.toggle('selected',i===idx);
            onChange();
        },50);
    },{passive:true});
    return {setVal:setVal,getVal:function(){return items[nearestIdx()]}};
}
function initTimePicker(picker,onChange){
    var hours=[],mins=[],h,m;
    for(h=0;h<24;h++)hours.push(String(h).padStart(2,'0'));
    for(m=0;m<60;m++)mins.push(String(m).padStart(2,'0'));
    var H=makePicker(picker.querySelector('[data-type="hour"]'),hours,onChange);
    var M=makePicker(picker.querySelector('[data-type="minute"]'),mins,onChange);
    return {setVal:function(v,animate){var p=String(v).split(':');H.setVal(p[0]);M.setVal(p[1])},getVal:function(){return H.getVal()+':'+M.getVal()}};
}
function adjustTime(minutes){var p=alarmTimeValue.split(':');var d=new Date();d.setHours(parseInt(p[0]),parseInt(p[1])+minutes,0);alarmTimeValue=String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');alarmPicker.setVal(alarmTimeValue)}
function addAlarm(){var li=document.getElementById('alarmLabel'),t=alarmTimeValue;if(!t)return;if(t.split(':').length===2)t+=':00';state.alarms.push({id:Date.now(),time:t,label:li.value||'闹钟',enabled:true});saveAlarms();renderAlarms();li.value=''}
function toggleAlarm(id){var a=state.alarms.find(function(x){return x.id===id});if(a){a.enabled=!a.enabled;saveAlarms()}}
function deleteAlarm(id){state.alarms=state.alarms.filter(function(x){return x.id!==id});saveAlarms();renderAlarms()}
function saveAlarms(){localStorage.setItem('alarms',JSON.stringify(state.alarms))}
function renderAlarms(){
    var list=document.getElementById('alarmList');
    if(state.alarms.length===0){list.innerHTML='<div class="empty-state">暂无闹钟，点击上方添加</div>';return}
    var now=new Date(),cs=now.getHours()*3600+now.getMinutes()*60+now.getSeconds();
    var awd=state.alarms.filter(function(a){return!a.isSnooze}).map(function(a){var p=a.time.split(':').map(Number),as_=p[0]*3600+p[1]*60+(p[2]||0),d=as_-cs;if(d<=0)d+=86400;var c={};for(var k in a)c[k]=a[k];c.diff=d;return c});
    awd.sort(function(a,b){return a.diff-b.diff});
    list.innerHTML=awd.map(function(a){var h=Math.floor(a.diff/3600),mi=Math.floor((a.diff%3600)/60);var ct_=a.enabled?'还有 '+(h>0?h+'小时':'')+mi+'分钟响铃':'已暂停';return '<div class="alarm-item '+(a.enabled?'':'disabled')+'"><div class="alarm-info"><span class="alarm-time">'+a.time+'</span><span class="alarm-label">'+a.label+'</span><span class="alarm-countdown">'+ct_+'</span></div><div class="alarm-controls"><label class="switch"><input type="checkbox" '+(a.enabled?'checked':'')+' onchange="toggleAlarm('+a.id+')"><span class="slider"></span></label><button class="danger" onclick="deleteAlarm('+a.id+')" style="padding:4px 7px;font-size:.68rem">删除</button></div></div>'}).join('');
}
function ring(label,time,maxMs){state.isRinging=true;document.getElementById('overlayLabel').textContent=label;document.getElementById('ringingTime').textContent=time||'';document.getElementById('ringingOverlay').classList.add('active');if('vibrate' in navigator)navigator.vibrate([500,300,500,300,500]);startBeep();if(ringTimer)clearTimeout(ringTimer);if(maxMs)ringTimer=setTimeout(function(){if(state.isRinging)stopRinging()},maxMs)}
function stopRinging(){state.isRinging=false;document.getElementById('ringingOverlay').classList.remove('active');stopBeep();if('vibrate' in navigator)navigator.vibrate(0);if(ringTimer){clearTimeout(ringTimer);ringTimer=null}updateTabIndicators()}

/* timer */
function setTimer(minutes,btn){if(timer.running)return;timer.totalSeconds=minutes*60;timer.remainingSeconds=timer.totalSeconds;timer.elapsedSeconds=0;timer.finished=false;updateTimerDisplay();document.querySelectorAll('#tab-timer .preset-btn').forEach(function(b){b.classList.remove('active')});if(btn)btn.classList.add('active')}
function setCustomTimer(){var inp=document.getElementById('customMinutes'),mins=parseInt(inp.value);if(!mins||mins<1)return;setTimer(mins,null);inp.value=''}
function updateTimerDisplay(){
    var d=document.getElementById('timerDisplay'),st=document.getElementById('timerStatus'),el=document.getElementById('timerElapsed'),rm=document.getElementById('timerRemaining'),pb=document.getElementById('timerProgressBar');
    if(timer.finished){d.textContent='00:00:00';d.className='timer-display danger';st.textContent='时间到！';pb.style.width='0%';pb.className='timer-progress-bar danger';el.textContent='已用 '+formatTime(timer.totalSeconds);rm.textContent='剩余 00:00:00';return}
    var secs=timer.running?timer.remainingSeconds:timer.totalSeconds;d.textContent=formatTime(secs);
    if(timer.running&&timer.remainingSeconds<=60){d.className='timer-display danger';pb.className='timer-progress-bar danger'}
    else if(timer.running&&timer.remainingSeconds<=300){d.className='timer-display warning';pb.className='timer-progress-bar warning'}
    else{d.className='timer-display';pb.className='timer-progress-bar'}
    st.textContent=timer.running?'计时中...':timer.totalSeconds>0?'已设置，点击开始':'选择时长开始计时';
    pb.style.width=(timer.totalSeconds>0?(timer.remainingSeconds/timer.totalSeconds)*100:100)+'%';
    el.textContent='已用 '+formatTime(timer.elapsedSeconds);rm.textContent='剩余 '+formatTime(timer.remainingSeconds);
}
function formatTime(ts){return String(Math.floor(ts/3600)).padStart(2,'0')+':'+String(Math.floor((ts%3600)/60)).padStart(2,'0')+':'+String(ts%60).padStart(2,'0')}
function formatFull(ms){var s=Math.floor(ms/1000);return String(Math.floor(s/3600)).padStart(2,'0')+':'+String(Math.floor((s%3600)/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function startTimer(){if(timer.totalSeconds<=0||timer.finished)return;timer.running=true;document.getElementById('timerStartBtn').style.display='none';document.getElementById('timerPauseBtn').style.display='inline-flex';timer.interval=setInterval(function(){timer.remainingSeconds--;timer.elapsedSeconds++;updateTimerDisplay();if(timer.remainingSeconds<=0){clearInterval(timer.interval);timer.running=false;timer.finished=true;document.getElementById('timerStartBtn').style.display='inline-flex';document.getElementById('timerPauseBtn').style.display='none';updateTimerDisplay();ring('计时结束','',10000)}},1000)}
function pauseTimer(){if(!timer.running)return;clearInterval(timer.interval);timer.running=false;document.getElementById('timerStartBtn').style.display='inline-flex';document.getElementById('timerPauseBtn').style.display='none';updateTimerDisplay();updateTabIndicators()}
function resetTimer(){clearInterval(timer.interval);timer.running=false;timer.finished=false;timer.totalSeconds=0;timer.remainingSeconds=0;timer.elapsedSeconds=0;document.getElementById('timerStartBtn').style.display='inline-flex';document.getElementById('timerPauseBtn').style.display='none';document.querySelectorAll('#tab-timer .preset-btn').forEach(function(b){b.classList.remove('active')});updateTimerDisplay();updateTabIndicators()}

/* pomodoro */
function switchPomMode(mode){
    if(pom.running){clearInterval(pom.interval);pom.running=false}
    pom.phase=mode;
    pom.workMin=parseInt(document.getElementById('pomWorkMin').value)||25;
    pom.breakMin=parseInt(document.getElementById('pomBreakMin').value)||5;
    pom.longBreakMin=parseInt(document.getElementById('pomLongBreakMin').value)||15;
    if(mode==='work'){pom.totalSeconds=pom.workMin*60}
    else if(mode==='break'){pom.totalSeconds=pom.breakMin*60}
    else{pom.totalSeconds=pom.longBreakMin*60}
    pom.remainingSeconds=pom.totalSeconds;pom.finished=false;
    document.getElementById('pomStartBtn').style.display='inline-flex';
    document.getElementById('pomPauseBtn').style.display='none';
    document.getElementById('pomModeWork').className=mode==='work'?'preset-btn active':'preset-btn';
    document.getElementById('pomModeBreak').className=mode==='break'?'preset-btn active':'preset-btn';
    document.getElementById('pomModeLongBreak').className=mode==='longBreak'?'preset-btn active':'preset-btn';
    updatePomDisplay();updateTabTitle();
}
function setPomodoro(work,break_,longBreak,btn){if(pom.running)return;pom.workMin=work;pom.breakMin=break_;pom.longBreakMin=longBreak||15;pom.sessions=0;pom.setCount=0;pom.phase='work';pom.totalSeconds=work*60;pom.remainingSeconds=pom.totalSeconds;pom.finished=false;document.getElementById('pomWorkMin').value=work;document.getElementById('pomBreakMin').value=break_;document.getElementById('pomLongBreakMin').value=pom.longBreakMin;updatePomDisplay();document.querySelectorAll('#tab-pomodoro .timer-presets .preset-btn').forEach(function(b){b.classList.remove('active')});if(btn)btn.classList.add('active')}
function updatePomDisplay(){
    var d=document.getElementById('pomDisplay'),ph=document.getElementById('pomPhase'),pb=document.getElementById('pomProgressBar'),ss=document.getElementById('pomSessions'),si=document.getElementById('pomSetInfo');
    d.textContent=formatTimeP(pom.remainingSeconds);
    if(pom.phase==='work'){ph.textContent='专注时间';ph.style.color='var(--danger)'}
    else if(pom.phase==='break'){ph.textContent='短休息';ph.style.color='var(--success)'}
    else{ph.textContent='长休息';ph.style.color='var(--blue)'}
    var progress=pom.totalSeconds>0?(pom.remainingSeconds/pom.totalSeconds)*100:100;pb.style.width=progress+'%';
    if(pom.running&&pom.remainingSeconds<=60){pb.className='timer-progress-bar danger';d.className='timer-display danger'}
    else if(pom.running&&pom.remainingSeconds<=300){pb.className='timer-progress-bar warning';d.className='timer-display warning'}
    else{d.className='timer-display';pb.className='timer-progress-bar'}
    ss.textContent='已完成 '+pom.sessions+' 个番茄';
    si.textContent='当前组 '+Math.min(pom.setCount+1,4)+'/4';
    updateTabTitle();
}
function updateTabTitle(){
    if(pom.running||pom.remainingSeconds>0){
        var secs=pom.remainingSeconds;
        var phaseText=pom.phase==='work'?'专注':pom.phase==='break'?'短休':'长休';
        document.title=formatTimeP(secs)+' - '+phaseText+' | 考试计时';
    }
}
function formatTimeP(ts){return String(Math.floor(ts/60)).padStart(2,'0')+':'+String(ts%60).padStart(2,'0')}
function startPomodoro(){
    pom.workMin=parseInt(document.getElementById('pomWorkMin').value)||25;
    pom.breakMin=parseInt(document.getElementById('pomBreakMin').value)||5;
    pom.longBreakMin=parseInt(document.getElementById('pomLongBreakMin').value)||15;
    if(pom.totalSeconds<=0||pom.finished){
        pom.phase='work';pom.totalSeconds=pom.workMin*60;pom.remainingSeconds=pom.totalSeconds;
        document.getElementById('pomModeWork').className='preset-btn active';
        document.getElementById('pomModeBreak').className='preset-btn';
        document.getElementById('pomModeLongBreak').className='preset-btn';
    }
    pom.running=true;pom.endTime=Date.now()+pom.remainingSeconds*1000;
    document.getElementById('pomStartBtn').style.display='none';
    document.getElementById('pomPauseBtn').style.display='inline-flex';
    pom.interval=setInterval(function(){
        var remain=Math.max(0,Math.ceil((pom.endTime-Date.now())/1000));
        pom.remainingSeconds=remain;updatePomDisplay();
        if(remain<=0){clearInterval(pom.interval);pom.running=false;
            if(pom.phase==='work'){
                pom.sessions++;pom.setCount++;
                if(pom.setCount>=4){
                    pom.phase='longBreak';pom.totalSeconds=pom.longBreakMin*60;pom.remainingSeconds=pom.totalSeconds;
                    document.getElementById('pomModeLongBreak').className='preset-btn active';
                    document.getElementById('pomModeWork').className='preset-btn';
                    ring('完成4个番茄','长休息一下',10000);
                }else{
                    pom.phase='break';pom.totalSeconds=pom.breakMin*60;pom.remainingSeconds=pom.totalSeconds;
                    document.getElementById('pomModeBreak').className='preset-btn active';
                    document.getElementById('pomModeWork').className='preset-btn';
                    ring('专注结束','休息一下',10000);
                }
                if(pom.autoStartBreak){pom.endTime=Date.now()+pom.remainingSeconds*1000;startPomodoro()}
            }else if(pom.phase==='break'){
                pom.phase='work';pom.totalSeconds=pom.workMin*60;pom.remainingSeconds=pom.totalSeconds;
                document.getElementById('pomModeWork').className='preset-btn active';
                document.getElementById('pomModeBreak').className='preset-btn';
                ring('休息结束','开始下一个番茄',10000);
                if(pom.autoStartBreak){pom.endTime=Date.now()+pom.remainingSeconds*1000;startPomodoro()}
            }else{
                pom.phase='work';pom.setCount=0;pom.totalSeconds=pom.workMin*60;pom.remainingSeconds=pom.totalSeconds;
                document.getElementById('pomModeWork').className='preset-btn active';
                document.getElementById('pomModeLongBreak').className='preset-btn';
                ring('长休息结束','继续加油',10000);
                if(pom.autoStartBreak){pom.endTime=Date.now()+pom.remainingSeconds*1000;startPomodoro()}
            }
            document.getElementById('pomStartBtn').style.display='inline-flex';
            document.getElementById('pomPauseBtn').style.display='none';
        }
    },1000);
}
function pausePomodoro(){if(!pom.running)return;clearInterval(pom.interval);pom.running=false;document.getElementById('pomStartBtn').style.display='inline-flex';document.getElementById('pomPauseBtn').style.display='none';updatePomDisplay();updateTabIndicators()}
function resetPomodoro(){clearInterval(pom.interval);pom.running=false;pom.finished=false;pom.phase='work';pom.totalSeconds=0;pom.remainingSeconds=0;pom.sessions=0;pom.setCount=0;document.getElementById('pomStartBtn').style.display='inline-flex';document.getElementById('pomPauseBtn').style.display='none';document.getElementById('pomModeWork').className='preset-btn active';document.getElementById('pomModeBreak').className='preset-btn';document.getElementById('pomModeLongBreak').className='preset-btn';updatePomDisplay();updateTabIndicators();document.title='考试计时闹钟'}
function fullscreenPomodoro(){
    document.getElementById('pomOverlay').classList.add('active');
    updatePomFs();
    if(pom._fsInterval)clearInterval(pom._fsInterval);
    pom._fsInterval=setInterval(function(){if(!pom.running){clearInterval(pom._fsInterval);return}updatePomFs()},500);
    try{var el=document.documentElement;if(el.requestFullscreen)el.requestFullscreen();else if(el.webkitRequestFullscreen)el.webkitRequestFullscreen()}catch(e){}
}
function updatePomFs(){
    var ph=document.getElementById('pomFsPhase');
    if(pom.phase==='work'){ph.textContent='专注时间';ph.style.color='var(--danger)'}
    else if(pom.phase==='break'){ph.textContent='短休息';ph.style.color='var(--success)'}
    else{ph.textContent='长休息';ph.style.color='var(--blue)'}
    document.getElementById('pomFsTime').textContent=formatTimeP(pom.remainingSeconds);
    document.getElementById('pomFsSessions').textContent='已完成 '+pom.sessions+' 个番茄 · 当前组 '+Math.min(pom.setCount+1,4)+'/4';
    var progress=pom.totalSeconds>0?(pom.remainingSeconds/pom.totalSeconds)*100:100;
    var pb=document.getElementById('pomFsProgressBar');pb.style.width=progress+'%';
    if(pom.running&&pom.remainingSeconds<=60)pb.style.background='var(--danger)';
    else if(pom.running&&pom.remainingSeconds<=300)pb.style.background='var(--warning)';
    else pb.style.background='var(--accent)';
}
function exitPomFs(){if(pom._fsInterval)clearInterval(pom._fsInterval);try{if(document.exitFullscreen)document.exitFullscreen();else if(document.webkitExitFullscreen)document.webkitExitFullscreen()}catch(e){}document.getElementById('pomOverlay').classList.remove('active')}

function toggleTheme(){state.theme=state.theme==='light'?'dark':'light';document.documentElement.setAttribute('data-theme',state.theme);localStorage.setItem('theme',state.theme);document.getElementById('themeBtn').textContent=state.theme==='light'?'\u{1F319}':'\u2600\uFE0F'}

/* init */
document.documentElement.setAttribute('data-theme',state.theme);
document.getElementById('themeBtn').textContent=state.theme==='light'?'\u{1F319}':'\u2600\uFE0F';
document.getElementById('ringtoneSelect').value=state.ringtone;
document.getElementById('volumeSlider').value=state.volume;
var io=new Date();
var initTime=String(io.getHours()).padStart(2,'0')+':'+String(io.getMinutes()).padStart(2,'0');
alarmTimeValue=initTime;examStartValue=initTime;
alarmPicker=initTimePicker(document.getElementById('alarmTimePicker'),function(){alarmTimeValue=alarmPicker.getVal()});
examPicker=initTimePicker(document.getElementById('examStartPicker'),function(){examStartValue=examPicker.getVal()});
alarmPicker.setVal(initTime);examPicker.setVal(initTime);
renderAlarms();updateTimerDisplay();updatePomDisplay();setInterval(updateClock,1000);updateClock();
window.addEventListener('keydown',function(e){if(state.isRinging&&e.code==='Escape'){e.preventDefault();stopRinging()}});
var wakeLock=null;
async function requestWakeLock(){try{if('wakeLock' in navigator){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',function(){wakeLock=null})}}catch(err){if(err.name!=='NotAllowedError')console.error(err.name+', '+err.message)}}
function activateAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended'){audioCtx.resume().then(function(){startHeartbeat();requestWakeLock()})}else{startHeartbeat();requestWakeLock()}}
document.body.addEventListener('mousedown',activateAudio);document.body.addEventListener('keydown',activateAudio);document.body.addEventListener('touchstart',activateAudio);

window.switchTab=switchTab;window.setTimer=setTimer;window.setCustomTimer=setCustomTimer;window.startTimer=startTimer;window.pauseTimer=pauseTimer;window.resetTimer=resetTimer;
window.adjustTime=adjustTime;window.addAlarm=addAlarm;window.toggleAlarm=toggleAlarm;window.deleteAlarm=deleteAlarm;
window.toggleExamMode=toggleExamMode;window.onExamDurationPreset=onExamDurationPreset;window.startExam=startExam;window.exitExam=exitExam;
window.setPomodoro=setPomodoro;window.startPomodoro=startPomodoro;window.pausePomodoro=pausePomodoro;window.resetPomodoro=resetPomodoro;window.fullscreenPomodoro=fullscreenPomodoro;window.exitPomFs=exitPomFs;window.switchPomMode=switchPomMode;
window.toggleTheme=toggleTheme;window.testRingtone=testRingtone;window.updateRingtone=updateRingtone;window.updateVolume=updateVolume;
window.stopRinging=stopRinging;window.activateAudio=activateAudio;window.openSettings=openSettings;window.closeSettings=closeSettings;
})();
</script>
