<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>智能体</title>
    <style>
        *{box-sizing:border-box}
        html,body{height:100%}
        body{
            margin:0;background:#0b0e14;color:#e7ecf3;overflow:hidden;
            font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
            -webkit-font-smoothing:antialiased;
        }
        :root{
            --bg:#0b0e14;--panel:#131722;--panel2:#1a2030;--hover:#1f2738;
            --border:#242c3d;--border2:#31405c;
            --text:#e7ecf3;--muted:#8fa0b5;
            --accent:#22d3ee;--accent2:#6366f1;
            --grad:linear-gradient(135deg,#22d3ee,#6366f1);
            --danger:#f87171;--radius:14px;
        }
        button{font:inherit;color:inherit;background:none;border:none;cursor:pointer;padding:0}
        input,textarea,select{font:inherit;color:var(--text);background:#0d1220;border:1px solid var(--border);border-radius:10px;padding:9px 12px;outline:none;width:100%}
        input:focus,textarea:focus,select:focus{border-color:var(--accent)}
        textarea{resize:none}
        ::placeholder{color:#5b6b82}
        ::-webkit-scrollbar{width:8px;height:8px}
        ::-webkit-scrollbar-track{background:transparent}
        ::-webkit-scrollbar-thumb{background:#2c3648;border-radius:8px}
        ::-webkit-scrollbar-thumb:hover{background:#3a4a64}
        .app{display:flex;height:100vh;width:100vw;background:var(--bg)}
        .backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);backdrop-filter:blur(2px);z-index:40}

        .icon-btn{display:inline-flex;align-items:center;justify-content:center;padding:8px;border-radius:10px;color:var(--muted);transition:background .15s,color .15s}
        .icon-btn:hover{background:var(--hover);color:var(--text)}
        .icon-btn.active{background:var(--hover);color:var(--accent)}
        .icon-btn.on{background:linear-gradient(135deg,rgba(34,211,238,.2),rgba(99,102,241,.2));color:var(--accent)}

        .btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 14px;border-radius:10px;font-size:13px;color:var(--muted);border:1px solid var(--border);transition:color .15s,border-color .15s,background .15s}
        .btn:hover{color:var(--text);border-color:var(--border2);background:var(--hover)}
        .btn-primary{background:var(--grad);color:#fff;border:none;font-weight:600}
        .btn-primary:hover{filter:brightness(1.15);color:#fff}
        .btn-primary:disabled{opacity:.4;cursor:not-allowed;filter:none}
        .btn-danger-text{color:var(--danger)}

        .side{width:264px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:fixed;left:0;top:0;z-index:50;transform:translateX(-100%);transition:transform .25s ease;visibility:hidden}
        .side.open{transform:translateX(0);visibility:visible}
        .side-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
        .side-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;letter-spacing:.3px}
        .side-title .grad-dot{width:9px;height:9px;border-radius:50%;background:var(--grad);box-shadow:0 0 12px rgba(34,211,238,.8)}
        .side-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:6px}
        .agent-item{width:100%;text-align:left;padding:11px 12px;border-radius:12px;border:1px solid transparent;transition:background .15s,border-color .15s;cursor:pointer}
        .agent-item:hover{background:var(--hover)}
        .agent-item.active{background:var(--panel2);border-color:var(--border2)}
        .agent-item .name{font-size:13px;font-weight:600;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .agent-item .meta{font-size:11px;color:var(--muted);margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .agent-item .meta .warn{color:var(--danger)}
        .side-foot{padding:12px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:8px}
        .side-foot .row{display:flex;gap:8px}
        .side-foot .row .btn{flex:1}
        .empty-hint{font-size:12px;color:var(--muted);text-align:center;padding:36px 12px;line-height:1.9}

        .main{flex:1;min-width:0;display:flex;flex-direction:column;height:100vh;background:var(--bg)}
        .chat-head{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border);background:var(--panel);flex-shrink:0}
        .chat-head .left{display:flex;align-items:center;gap:10px;min-width:0}
        .chat-head .titles{min-width:0}
        .chat-head .titles h2{margin:0;font-size:16px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        .chat-head .titles .sub{display:flex;align-items:center;gap:6px;margin-top:3px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden}
        .pill{display:inline-flex;align-items:center;padding:2px 8px;border-radius:20px;font-size:10.5px;background:rgba(34,211,238,.12);color:#7dd3fc;border:1px solid rgba(34,211,238,.25);white-space:nowrap}
        .chat-head .right{display:flex;align-items:center;gap:4px;flex-shrink:0}
        .chat-head .right .btn .lbl{display:none}
        .chat-body{flex:1;overflow-y:auto;padding:20px 14px 30px}
        .msgs{max-width:820px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
        .banner{font-size:12px;color:var(--muted);background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:10px 14px;line-height:1.7}
        .banner b{color:var(--accent)}
        .msg-row{display:flex;width:100%;scroll-margin-top:90px}
        .msg-row.user{justify-content:flex-end}
        .msg-row.ai{justify-content:flex-start}
        .msg-row .ck{display:flex;align-items:center;padding:0 6px;flex-shrink:0}
        .msg-row.user .ck{order:-1}
        .msg-row .ck input{width:16px;height:16px;accent-color:var(--accent);cursor:pointer}
        .bubble{position:relative;padding:11px 14px;border-radius:16px;font-size:14px;line-height:1.75;max-width:86%;word-break:break-word;white-space:pre-wrap}
        .msg-row.user .bubble{background:var(--grad);color:#fff;border-bottom-right-radius:5px}
        .msg-row.ai .bubble{background:var(--panel);border:1px solid var(--border);border-bottom-left-radius:5px}
        .copy-btn{position:absolute;top:-11px;right:10px;opacity:0;transition:opacity .15s;padding:5px 7px;border-radius:8px;background:var(--panel2);border:1px solid var(--border2);color:var(--muted)}
        .msg-row.ai:hover .copy-btn{opacity:1}
        .copy-btn:hover{color:var(--accent)}
        .thinking{margin-bottom:10px;font-size:12px;background:rgba(13,18,32,.6);border:1px solid var(--border);border-radius:10px;overflow:hidden}
        .thinking summary{cursor:pointer;padding:8px 12px;color:var(--muted);display:flex;align-items:center;gap:7px;user-select:none;list-style:none}
        .thinking summary::-webkit-details-marker{display:none}
        .thinking summary .t{color:var(--accent)}
        .thinking .body{margin:0 10px 10px;padding:10px;border-top:1px solid var(--border);color:var(--muted);max-height:260px;overflow-y:auto;white-space:pre-wrap;line-height:1.7}
        .typing{color:var(--muted);font-size:13px;font-style:italic;padding:10px 14px;background:var(--panel);border:1px solid var(--border);border-radius:16px;border-bottom-left-radius:5px;display:inline-block}

        .select-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 14px;background:var(--panel);border-top:1px solid var(--border);flex-shrink:0}
        .select-bar .count{font-size:13px;color:var(--muted)}
        .select-bar .acts{display:flex;gap:8px}
        .select-bar .acts .btn{padding:7px 12px}

        .input-bar{padding:12px 14px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--border);background:var(--panel);flex-shrink:0}
        .input-wrap{max-width:820px;margin:0 auto;display:flex;align-items:flex-end;gap:8px;background:#0d1220;border:1px solid var(--border);border-radius:16px;padding:8px;transition:border-color .15s,box-shadow .15s}
        .input-wrap:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px rgba(34,211,238,.12)}
        .input-wrap textarea{flex:1;border:none;background:transparent;padding:6px;max-height:160px;min-height:42px;font-size:14px;line-height:1.6}
        .input-wrap textarea:focus{border:none}
        .send-btn{width:40px;height:40px;flex-shrink:0;border-radius:12px;background:var(--grad);color:#fff;display:flex;align-items:center;justify-content:center;transition:filter .15s}
        .send-btn:hover{filter:brightness(1.15)}
        .send-btn:disabled{opacity:.35;cursor:not-allowed;filter:none}

        .toc{width:240px;flex-shrink:0;background:var(--panel);border-left:1px solid var(--border);display:flex;flex-direction:column;height:100vh;position:fixed;right:0;top:0;z-index:50;transform:translateX(100%);transition:transform .25s ease;visibility:hidden}
        .toc.open{transform:translateX(0);visibility:visible}
        .toc-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border)}
        .toc-head h3{margin:0;font-size:13px;font-weight:700;display:flex;align-items:center;gap:7px}
        .toc-list{flex:1;overflow-y:auto;padding:10px;display:flex;flex-direction:column;gap:4px}
        .toc-item{width:100%;text-align:left;padding:9px 10px;border-radius:10px;cursor:pointer;transition:background .12s;border:1px solid transparent}
        .toc-item:hover{background:var(--hover);border-color:var(--border)}
        .toc-item .t1{font-size:10.5px;color:var(--muted);margin-bottom:3px}
        .toc-item .t2{font-size:12px;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

        .modal{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:12px;background:rgba(4,7,12,.6);backdrop-filter:blur(3px)}
        .modal-card{width:100%;max-width:640px;max-height:92vh;background:var(--panel);border:1px solid var(--border2);border-radius:18px;box-shadow:0 24px 80px rgba(0,0,0,.55);display:flex;flex-direction:column;overflow:hidden;animation:pop .18s ease}
        @keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
        .modal-card.sm{max-width:520px}
        .modal-head{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--border)}
        .modal-head h3{margin:0;font-size:16px;font-weight:700}
        .modal-body{padding:18px 20px;overflow-y:auto;display:flex;flex-direction:column;gap:16px}
        .modal-foot{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-top:1px solid var(--border);gap:10px}
        .modal-foot .acts{display:flex;gap:10px;margin-left:auto}
        .field .fl{display:flex;align-items:baseline;gap:6px;margin-bottom:7px;font-size:13px;font-weight:600}
        .field .fl .hint{font-size:11px;color:var(--muted);font-weight:400}
        .grid2{display:grid;grid-template-columns:1fr;gap:14px}
        .provider-card{border:1px solid var(--border);border-radius:14px;padding:14px;background:var(--panel2);display:flex;flex-direction:column;gap:12px}
        .provider-card .ph{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:700}
        .provider-card .ph .note{margin-left:auto;font-size:10px;font-weight:400;color:var(--muted)}
        .model-row{display:flex;flex-direction:column;gap:6px;background:#0d1220;border:1px solid var(--border);border-radius:10px;padding:8px;position:relative}
        .model-row .mrow{display:flex;gap:6px;align-items:center}
        .model-row .mrow input{flex:1;min-width:0}
        .model-row .mrow .icon-btn{flex-shrink:0;padding:6px}
        .model-row .adv{margin-top:4px}
        .model-row .adv summary{font-size:10.5px;color:var(--muted);cursor:pointer;user-select:none}
        .add-model-btn{align-self:flex-start;display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:9px;border:1px dashed var(--border2);color:var(--muted);font-size:12px;transition:color .15s,border-color .15s}
        .add-model-btn:hover{color:var(--accent);border-color:var(--accent)}
        .hint-note{font-size:10.5px;color:var(--muted);line-height:1.7}
        .hint-top{font-size:12px;color:var(--muted);line-height:1.8}

        .toast{position:fixed;top:14px;left:50%;transform:translateX(-50%);z-index:300;display:flex;align-items:center;gap:8px;padding:10px 18px;border-radius:999px;font-size:13px;color:#fff;box-shadow:0 12px 40px rgba(0,0,0,.5);animation:drop .2s ease;max-width:88vw}
        .toast.err{background:rgba(248,113,113,.95)}
        .toast.ok{background:rgba(20,26,40,.95);border:1px solid var(--border2)}
        .toast .tt{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
        @keyframes drop{from{opacity:0;transform:translateX(-50%) translateY(-10px)}to{opacity:1;transform:translateX(-50%)}}
        .empty-main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--muted);gap:14px}
        .empty-main .menu-btn{position:absolute;top:16px;left:16px;padding:10px;background:var(--panel);border:1px solid var(--border);border-radius:999px}
        .empty-main p{font-size:13px;margin:0}
        .confirm-box{background:var(--panel);border:1px solid var(--border2);border-radius:18px;max-width:380px;width:100%;padding:26px 24px;text-align:center;box-shadow:0 24px 80px rgba(0,0,0,.55);animation:pop .18s ease}
        .confirm-box .ic{width:52px;height:52px;margin:0 auto 14px;border-radius:50%;background:rgba(248,113,113,.12);color:var(--danger);display:flex;align-items:center;justify-content:center}
        .confirm-box h4{margin:0 0 8px;font-size:16px}
        .confirm-box p{font-size:12.5px;color:var(--muted);line-height:1.8;margin:0 0 20px}
        .confirm-box .acts{display:flex;justify-content:center;gap:10px}

        @media (min-width:768px){
            .side{position:static;transform:none;visibility:visible}
            .chat-head .right .btn .lbl{display:inline}
            .msgs{padding:0 8px}
        }
        @media (min-width:1280px){
            .toc{position:static;transform:none;visibility:visible}
            .toc .toc-close{display:none}
        }
        @media (max-width:767px){
            .grid2{grid-template-columns:1fr}
            .bubble{max-width:92%}
            .modal{padding:8px}
            .modal-card{max-height:96vh}
            .modal-head{padding:13px 16px}
            .modal-body{padding:14px 16px}
            .modal-foot{padding:12px 16px}
            .chat-body{padding:16px 10px 24px}
        }
    </style>
</head>
<body>
    <div id="root"></div>
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback, memo } = React;

        // ============ 提供商配置（路径与说明，2026-08） ============
        const PROVIDERS = {
            deepseek: { label: 'DeepSeek', baseUrl: 'https://api.deepseek.com', defaultModels: [{ label: 'flash', id: 'deepseek-v4-flash', params: '' }, { label: 'pro', id: 'deepseek-v4-pro', params: '' }], note: '申请 Key：platform.deepseek.com' },
            doubao: { label: '豆包 (火山方舟)', baseUrl: 'https://ark.cn-beijing.volces.com/api/v3', defaultModels: [], note: '模型 ID 填「推理接入点 ID（ep-xxxx）」或开通的模型 ID（如 doubao-seed-2-1-pro-260628）。Key 在 console.volcengine.com/ark 申请' },
            qwen: { label: '千问 (阿里云百炼)', baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1', defaultModels: [], note: '模型 ID 填百炼模型名（如 qwen3.8-max）。Key 在 bailian.console.aliyun.com 申请' },
            xiaomi: { label: '小米 MiMo', baseUrl: 'https://api.xiaomimimo.com/v1', defaultModels: [], note: '模型 ID 填 mimo-v2.5-pro 等（V2 系列已下线）。Key 在 platform.xiaomimimo.com 申请' },
            glm: { label: 'GLM (智谱)', baseUrl: 'https://open.bigmodel.cn/api/paas/v4', defaultModels: [], note: '模型 ID 填 glm-5.2 等。Key 在 bigmodel.cn 申请' },
            kimi: { label: 'Kimi (月之暗面)', baseUrl: 'https://api.moonshot.cn/v1', defaultModels: [], note: '模型 ID 填 kimi-k3 等。Key 在 platform.kimi.com 申请' },
            minimax: { label: 'MiniMax', baseUrl: 'https://api.minimax.io/v1', defaultModels: [], note: '模型 ID 填 MiniMax-M3 等。国内账号请将 Base URL 改为 api.minimaxi.com' },
            ollama: { label: 'Ollama (本地)', baseUrl: 'http://localhost:11434/v1', defaultModels: [], note: '模型 ID 填本地模型标签（如 qwen3:32b），本地运行 ollama serve 后无需 API Key' },
            custom: { label: '自定义 (OpenAI 兼容)', baseUrl: '', defaultModels: [], note: '任意兼容 OpenAI 格式的服务，填写 Base URL 与模型 ID' }
        };

        const DEFAULT_PROVIDERS = {};
        for (const [k, v] of Object.entries(PROVIDERS)) {
            DEFAULT_PROVIDERS[k] = { apiKey: '', baseUrl: v.baseUrl, models: (v.defaultModels || []).map(m => ({ ...m })) };
        }

        const STORAGE_KEY = 'agent_chat_state_v2';
        const OLD_KEY = 'agent_chat_state_v1';
        const LEGACY_KEY = 'deepseek_chat_state_standalone';

        function normalizeModels(arr, fallback) {
            const norm = (m) => {
                if (typeof m === 'string') return { label: m, id: m, params: '' };
                const label = (m && (m.label || m.name)) || '';
                const id = (m && (m.id || m.label || m.name)) || '';
                return { label, id, params: (m && m.params) || '' };
            };
            if (!Array.isArray(arr) || !arr.length) return (fallback || []).map(norm).filter(m => m.id);
            return arr.map(norm).filter(m => m.id && m.label);
        }

        function normalizeState(s) {
            const providers = {};
            for (const k of Object.keys(PROVIDERS)) {
                const p = (s && s.providers && s.providers[k]) || {};
                providers[k] = {
                    apiKey: p.apiKey || '',
                    baseUrl: p.baseUrl || PROVIDERS[k].baseUrl,
                    models: normalizeModels(p.models, PROVIDERS[k].defaultModels)
                };
            }
            return {
                providers,
                agents: Array.isArray(s && s.agents) ? s.agents : [],
                activeAgentId: (s && s.activeAgentId) || null,
                chats: (s && s.chats) || {}
            };
        }

        function loadInitialState() {
            try {
                const saved = localStorage.getItem(STORAGE_KEY);
                if (saved) return normalizeState(JSON.parse(saved));
                const old = localStorage.getItem(OLD_KEY);
                if (old) return normalizeState(JSON.parse(old));
                const legacy = JSON.parse(localStorage.getItem(LEGACY_KEY) || 'null');
                if (legacy && Array.isArray(legacy.characters)) {
                    return normalizeState({
                        providers: { deepseek: { apiKey: legacy.apiKey || '' } },
                        agents: legacy.characters.map(c => ({
                            id: c.id,
                            name: c.name,
                            provider: 'deepseek',
                            model: legacy.model || 'deepseek-v4-flash',
                            systemPrompt: c.traits || '',
                            temperature: null
                        })),
                        activeAgentId: legacy.activeCharacterId,
                        chats: legacy.chats || {}
                    });
                }
            } catch (e) {}
            return normalizeState(null);
        }

        async function copyText(text, showNotice) {
            try {
                await navigator.clipboard.writeText(text);
                showNotice('已复制到剪贴板');
            } catch (e) {
                try {
                    const ta = document.createElement('textarea');
                    ta.value = text;
                    ta.style.position = 'fixed';
                    ta.style.opacity = '0';
                    document.body.appendChild(ta);
                    ta.select();
                    document.execCommand('copy');
                    ta.remove();
                    showNotice('已复制到剪贴板');
                } catch (err) {
                    showNotice('复制失败', 'error');
                }
            }
        }

        // ============ 内联 SVG 图标（零外部依赖） ============
        const ICONS = {
            sparkles: '<path d="M9.94 15.5a2 2 0 0 0-1.44-1.44l-6.13-1.58a.5.5 0 0 1 0-.96L8.5 9.94a2 2 0 0 0 1.44-1.44l1.58-6.13a.5.5 0 0 1 .96 0l1.58 6.13a2 2 0 0 0 1.44 1.44l6.13 1.58a.5.5 0 0 1 0 .96l-6.13 1.58a2 2 0 0 0-1.44 1.44l-1.58 6.13a.5.5 0 0 1-.96 0z"/><path d="M20 3v4M22 5h-4"/>',
            userPlus: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M19 8v6M22 11h-6"/>',
            upload: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m17 8-5-5-5 5"/><path d="M12 3v12"/>',
            download: '<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
            sliders: '<path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3"/><path d="M14 2v4M8 10v4M16 18v4"/>',
            eraser: '<path d="m7 21-4.3-4.3c-1-1-1-2.5 0-3.4l9.6-9.6c1-1 2.5-1 3.4 0l5.6 5.6c1 1 1 2.5 0 3.4L13 21"/><path d="M22 21H7M5 11l9 9"/>',
            listChecks: '<path d="m3 17 2 2 4-4M3 7l2 2 4-4M13 6h8M13 12h8M13 18h8"/>',
            listTree: '<path d="M21 12h-8M21 6H8M21 18h-8"/><path d="M8 6h-2a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h2"/>',
            x: '<path d="M18 6 6 18M6 6l12 12"/>',
            edit: '<path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.12 2.12 0 0 1 3 3L12 15l-4 1 1-4Z"/>',
            copy: '<rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>',
            send: '<path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/>',
            zap: '<path d="M13 2 3 14h9l-1 8 10-12h-9l1-8z"/>',
            key: '<path d="m21 2-2 2m-7.6 7.6a5.5 5.5 0 1 1-7.78 7.78 5.5 5.5 0 0 1 7.78-7.78zm0 0L15.5 7.5m0 0 3 3L22 7l-3-3m-3.5 3.5L19 4"/>',
            wrench: '<path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>',
            plus: '<path d="M12 5v14M5 12h14"/>',
            alertTriangle: '<path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3Z"/><path d="M12 9v4M12 17h.01"/>',
            alertCircle: '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>',
            info: '<circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>',
            panelLeftClose: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M16 15l-3-3 3-3"/>',
            panelLeftOpen: '<rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18M14 9l3 3-3 3"/>',
            trash: '<path d="M3 6h18M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2M10 11v6M14 11v6"/>',
            chevronDown: '<path d="m6 9 6 6 6-6"/>',
            check: '<path d="M20 6 9 17l-5-5"/>'
        };

        const Icon = ({ name, size = 18, className = '', sw = 2 }) => (
            <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth={sw} strokeLinecap="round" strokeLinejoin="round" className={className} dangerouslySetInnerHTML={{ __html: ICONS[name] || '' }} />
        );

        const Toast = memo(function Toast({ message, type, onClose }) {
            useEffect(() => {
                const t = setTimeout(onClose, 3200);
                return () => clearTimeout(t);
            }, [onClose]);
            return (
                <div className={`toast ${type === 'error' ? 'err' : 'ok'}`}>
                    <Icon name={type === 'error' ? 'alertCircle' : 'check'} size={15} />
                    <span className="tt">{message}</span>
                </div>
            );
        });

        function App() {
            const [state, setState] = useState(loadInitialState);
            const [isSideOpen, setIsSideOpen] = useState(window.innerWidth > 768);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [editingAgent, setEditingAgent] = useState(undefined);
            const [notice, setNotice] = useState(null);

            const showNotice = useCallback((message, type = 'info') => setNotice({ message, type }), []);

            // 移动端：弹窗关闭后收起侧边栏，避免遮挡主区域
            const prevEditingRef = useRef(editingAgent);
            useEffect(() => {
                if (prevEditingRef.current !== undefined && editingAgent === undefined && window.innerWidth < 768) {
                    setIsSideOpen(false);
                }
                prevEditingRef.current = editingAgent;
            }, [editingAgent]);

            // 防抖保存：流式输出期间不频繁写 localStorage
            const saveTimer = useRef(null);
            useEffect(() => {
                clearTimeout(saveTimer.current);
                saveTimer.current = setTimeout(() => {
                    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
                }, 400);
                return () => clearTimeout(saveTimer.current);
            }, [state]);

            const updateState = useCallback((updates) => setState(prev => ({ ...prev, ...updates })), []);

            const activeAgent = state.agents.find(a => a.id === state.activeAgentId) || null;

            return (
                <div className="app">
                    {notice && <Toast message={notice.message} type={notice.type} onClose={() => setNotice(null)} />}

                    {isSideOpen && (
                        <div className="backdrop" onClick={() => setIsSideOpen(false)} />
                    )}

                    <Sidebar
                        state={state}
                        updateState={updateState}
                        isOpen={isSideOpen}
                        onOpenSettings={() => setIsSettingsOpen(true)}
                        onOpenAgentEditor={() => setEditingAgent(null)}
                        showNotice={showNotice}
                    />

                    <ChatArea
                        state={state}
                        activeAgent={activeAgent}
                        updateState={updateState}
                        onToggleSidebar={() => setIsSideOpen(!isSideOpen)}
                        onEditAgent={(agent) => setEditingAgent(agent)}
                        showNotice={showNotice}
                    />

                    {isSettingsOpen && (
                        <SettingsModal
                            state={state}
                            updateState={updateState}
                            onClose={() => setIsSettingsOpen(false)}
                            showNotice={showNotice}
                        />
                    )}

                    {editingAgent !== undefined && (
                        <AgentModal
                            state={state}
                            updateState={updateState}
                            editingAgent={editingAgent}
                            onClose={() => setEditingAgent(undefined)}
                            showNotice={showNotice}
                        />
                    )}
                </div>
            );
        }

        const Sidebar = memo(function Sidebar({ state, updateState, isOpen, onOpenSettings, onOpenAgentEditor, showNotice }) {
            const [confirmReset, setConfirmReset] = useState(false);

            const handleExport = () => {
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = '智能体备份.json';
                a.click();
                showNotice('备份已下载');
            };

            const handleImport = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        if (!parsed.agents || !parsed.providers) throw new Error('bad');
                        updateState(normalizeState(parsed));
                        showNotice('数据导入成功');
                    } catch (err) {
                        showNotice('解析失败，文件格式错误', 'error');
                    }
                };
                reader.readAsText(file);
            };

            return (
                <>
                    <aside className={`side ${isOpen ? 'open' : ''}`}>
                        <div className="side-head">
                            <div className="side-title">
                                <span className="grad-dot"></span>
                                <span>智能体</span>
                            </div>
                            <button className="icon-btn" onClick={onOpenAgentEditor} title="新建智能体">
                                <Icon name="userPlus" size={18} />
                            </button>
                        </div>

                        <div className="side-list">
                            {state.agents.length === 0 && (
                                <div className="empty-hint">
                                    还没有智能体
                                    <br />点击右上角 + 创建一个
                                </div>
                            )}
                            {state.agents.map(agent => {
                                const meta = PROVIDERS[agent.provider];
                                const prov = state.providers[agent.provider];
                                const missingKey = agent.provider !== 'ollama' && agent.provider !== 'custom' && !prov?.apiKey;
                                const modelNames = (prov?.models || []).map(m => m.id);
                                const missingModel = !modelNames.includes(agent.model);
                                const label = (prov?.models || []).find(m => m.id === agent.model)?.label || agent.model;
                                return (
                                    <button
                                        key={agent.id}
                                        className={`agent-item ${state.activeAgentId === agent.id ? 'active' : ''}`}
                                        onClick={() => updateState({ activeAgentId: agent.id })}
                                    >
                                        <div className="name">{agent.name}</div>
                                        <div className="meta">
                                            {meta ? meta.label : agent.provider} · {label}
                                            {missingKey && <span className="warn"> · 未配置 Key</span>}
                                            {missingModel && !missingKey && <span className="warn"> · 模型缺失</span>}
                                        </div>
                                    </button>
                                );
                            })}
                        </div>

                        <div className="side-foot">
                            <div className="row">
                                <button className="btn" onClick={() => document.getElementById('import-input').click()}>
                                    <Icon name="upload" size={14} /> 导入
                                </button>
                                <button className="btn" onClick={handleExport}>
                                    <Icon name="download" size={14} /> 导出
                                </button>
                            </div>
                            <input id="import-input" type="file" className="hidden" style={{ display: 'none' }} accept=".json" onChange={handleImport} />
                            <button className="btn" onClick={onOpenSettings}>
                                <Icon name="sliders" size={14} /> API 设置
                            </button>
                            <button className="btn" onClick={() => setConfirmReset(true)}>
                                <Icon name="eraser" size={14} /> 初始化数据
                            </button>
                        </div>
                    </aside>

                    {confirmReset && (
                        <div className="modal" onClick={() => setConfirmReset(false)}>
                            <div className="confirm-box" onClick={e => e.stopPropagation()}>
                                <div className="ic"><Icon name="alertTriangle" size={26} /></div>
                                <h4>确认初始化？</h4>
                                <p>将删除全部智能体、对话记录与 API 设置，且不可恢复。</p>
                                <div className="acts">
                                    <button className="btn" onClick={() => setConfirmReset(false)}>取消</button>
                                    <button
                                        className="btn btn-primary"
                                        onClick={() => {
                                            localStorage.removeItem(STORAGE_KEY);
                                            localStorage.removeItem(OLD_KEY);
                                            location.reload();
                                        }}
                                    >
                                        确认初始化
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}
                </>
            );
        });

        const ChatArea = memo(function ChatArea({ state, activeAgent, updateState, onToggleSidebar, onEditAgent, showNotice }) {
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const [isTocOpen, setIsTocOpen] = useState(window.innerWidth >= 1280);
            const [selectMode, setSelectMode] = useState(false);
            const [selected, setSelected] = useState(new Set());
            const messagesEndRef = useRef(null);
            const messages = activeAgent ? (state.chats[activeAgent.id] || []) : [];

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isTyping]);

            const scrollToMsg = (id) => {
                document.getElementById('msg-' + id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
            };

            const handleSend = async () => {
                if (!input.trim() || !activeAgent || isTyping) return;

                const prov = state.providers[activeAgent.provider];
                const modelList = (prov && prov.models) || [];
                if (activeAgent.provider === 'ollama') {
                    // 无需 Key
                } else if (activeAgent.provider === 'custom') {
                    if (!prov?.baseUrl) return showNotice('请先在 API 设置中填写自定义服务的 Base URL', 'error');
                } else {
                    if (!prov?.apiKey) return showNotice(`请先在 API 设置中配置「${PROVIDERS[activeAgent.provider]?.label || activeAgent.provider}」的 API Key`, 'error');
                }
                if (!modelList.length) return showNotice('请先在 API 设置中为该 API 配置模型', 'error');
                const modelEntry = modelList.find(m => m.id === activeAgent.model) || modelList[0];
                const model = modelEntry.id;
                let extraParams = {};
                if (modelEntry.params && modelEntry.params.trim()) {
                    try {
                        extraParams = JSON.parse(modelEntry.params);
                    } catch (e) {
                        return showNotice(`模型「${modelEntry.label}」的请求参数 JSON 格式错误，请到 API 设置中修正`, 'error');
                    }
                }

                const userMsg = { id: Date.now().toString(), role: 'user', content: input.trim(), timestamp: Date.now() };
                const newMessages = [...messages, userMsg];

                setInput('');
                const updatedChats = { ...state.chats, [activeAgent.id]: newMessages };
                updateState({ chats: updatedChats });
                setIsTyping(true);

                try {
                    const baseUrl = (prov?.baseUrl || '').replace(/\/+$/, '');
                    const headers = { 'Content-Type': 'application/json' };
                    if (prov?.apiKey) headers['Authorization'] = `Bearer ${prov.apiKey}`;

                    const body = {
                        model,
                        messages: [
                            ...(activeAgent.systemPrompt ? [{ role: 'system', content: activeAgent.systemPrompt }] : []),
                            ...newMessages.map(m => ({ role: m.role, content: m.content }))
                        ],
                        stream: true,
                        max_tokens: 65536,
                        ...extraParams
                    };
                    if (activeAgent.temperature != null && activeAgent.provider !== 'kimi') {
                        body.temperature = activeAgent.temperature;
                    }
                    if (activeAgent.provider === 'minimax') {
                        body.reasoning_split = true;
                    }

                    const response = await fetch(`${baseUrl}/chat/completions`, {
                        method: 'POST',
                        headers,
                        body: JSON.stringify(body)
                    });

                    if (!response.ok) {
                        const errText = await response.text().catch(() => '');
                        throw new Error(`HTTP ${response.status}${errText ? '：' + errText.slice(0, 200) : ''}`);
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let assistantContent = '';
                    let assistantReasoning = '';
                    const aiMsgId = (Date.now() + 1).toString();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ') && line.trim() !== 'data: [DONE]') {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    const delta = data.choices?.[0]?.delta || {};
                                    const text = delta.content;
                                    let reason = delta.reasoning_content || delta.reasoning;
                                    if (!reason && Array.isArray(delta.reasoning_details)) {
                                        reason = delta.reasoning_details.map(x => x?.content || '').join('');
                                    }
                                    if (reason) assistantReasoning += reason;
                                    if (text || reason) {
                                        updateState({
                                            chats: {
                                                ...updatedChats,
                                                [activeAgent.id]: [
                                                    ...newMessages,
                                                    {
                                                        id: aiMsgId,
                                                        role: 'assistant',
                                                        content: assistantContent,
                                                        reasoning: assistantReasoning || undefined,
                                                        timestamp: Date.now()
                                                    }
                                                ]
                                            }
                                        });
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                } catch (err) {
                    showNotice('请求失败：' + (err.message || '请检查网络与配置'), 'error');
                } finally {
                    setIsTyping(false);
                }
            };

            const toggleSelect = (id) => {
                setSelected(prev => {
                    const next = new Set(prev);
                    if (next.has(id)) next.delete(id);
                    else next.add(id);
                    return next;
                });
            };

            const copySelected = () => {
                const items = messages.filter(m => selected.has(m.id));
                if (!items.length) return showNotice('请先勾选消息', 'error');
                const txt = items.map(m => `【${m.role === 'user' ? '用户' : 'AI'}】\n${m.content}`).join('\n\n----\n\n');
                copyText(txt, showNotice);
            };

            if (!activeAgent) {
                return (
                    <div className="empty-main flex-1">
                        <button className="icon-btn menu-btn" onClick={onToggleSidebar}>
                            <Icon name="panelLeftOpen" size={18} />
                        </button>
                        <Icon name="sparkles" size={30} className="opacity-40" />
                        <p>请在左侧选择或创建一个智能体开始对话</p>
                    </div>
                );
            }

            const meta = PROVIDERS[activeAgent.provider];
            const tocItems = messages.filter(m => m.role === 'user');
            const prov = state.providers[activeAgent.provider];
            const modelLabel = (prov?.models || []).find(m => m.id === activeAgent.model)?.label || activeAgent.model;

            return (
                <div className="main">
                    {isTocOpen && (
                        <div className="backdrop" onClick={() => setIsTocOpen(false)} />
                    )}
                    <aside className={`toc ${isTocOpen ? 'open' : ''}`}>
                        <div className="toc-head">
                            <h3><Icon name="listTree" size={15} className="accent" style={{ color: 'var(--accent)' }} /> 对话目录</h3>
                            <button className="icon-btn toc-close" onClick={() => setIsTocOpen(false)}>
                                <Icon name="x" size={15} />
                            </button>
                        </div>
                        <div className="toc-list">
                            {tocItems.length === 0 && <div className="empty-hint">暂无对话</div>}
                            {tocItems.map((m, i) => (
                                <button
                                    key={m.id}
                                    className="toc-item"
                                    onClick={() => { scrollToMsg(m.id); if (window.innerWidth < 1280) setIsTocOpen(false); }}
                                >
                                    <div className="t1">{i + 1} · {new Date(m.timestamp).toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' })}</div>
                                    <div className="t2">{m.content.length > 26 ? m.content.slice(0, 26) + '…' : m.content || '(空)'}</div>
                                </button>
                            ))}
                        </div>
                    </aside>

                    <header className="chat-head">
                        <div className="left">
                            <button className="icon-btn" onClick={onToggleSidebar} title="侧边栏">
                                <Icon name="panelLeftClose" size={18} />
                            </button>
                            <div className="titles">
                                <h2>{activeAgent.name}</h2>
                                <div className="sub">
                                    <span className="pill">{meta ? meta.label : activeAgent.provider}</span>
                                    <span>{modelLabel}</span>
                                </div>
                            </div>
                        </div>
                        <div className="right">
                            <button className={`icon-btn ${selectMode ? 'on' : ''}`} title={selectMode ? '退出多选' : '多选复制'} onClick={() => { setSelectMode(!selectMode); setSelected(new Set()); }}>
                                <Icon name="listChecks" size={17} />
                            </button>
                            <button className={`icon-btn ${isTocOpen ? 'on' : ''}`} title="对话目录" onClick={() => setIsTocOpen(!isTocOpen)}>
                                <Icon name="listTree" size={17} />
                            </button>
                            <button className="btn" onClick={() => onEditAgent(activeAgent)}>
                                <Icon name="edit" size={14} /> <span className="lbl">智能体设定</span>
                            </button>
                        </div>
                    </header>

                    <main className="chat-body">
                        <div className="msgs">
                            {activeAgent.systemPrompt && (
                                <div className="banner">
                                    <b>固定提示词：</b>{activeAgent.systemPrompt}
                                </div>
                            )}
                            {messages.map(msg => (
                                <div key={msg.id} id={`msg-${msg.id}`} className={`msg-row ${msg.role === 'user' ? 'user' : 'ai'}`}>
                                    {selectMode && (
                                        <span className="ck">
                                            <input
                                                type="checkbox"
                                                checked={selected.has(msg.id)}
                                                onChange={() => toggleSelect(msg.id)}
                                            />
                                        </span>
                                    )}
                                    <div className="bubble">
                                        {msg.role === 'assistant' && msg.reasoning && (
                                            <details className="thinking">
                                                <summary>
                                                    <Icon name="zap" size={13} className="t" />
                                                    <span className="t">思考过程</span>
                                                    <Icon name="chevronDown" size={12} />
                                                </summary>
                                                <div className="body">{msg.reasoning}</div>
                                            </details>
                                        )}
                                        {msg.content}
                                        {msg.role === 'assistant' && (
                                            <button className="copy-btn" onClick={() => copyText(msg.content, showNotice)} title="一键复制">
                                                <Icon name="copy" size={12} />
                                            </button>
                                        )}
                                    </div>
                                </div>
                            ))}
                            {isTyping && (
                                <div className="msg-row ai">
                                    <div className="typing">正在回复...</div>
                                </div>
                            )}
                            <div ref={messagesEndRef} style={{ height: 4 }} />
                        </div>
                    </main>

                    {selectMode && (
                        <div className="select-bar">
                            <span className="count">已选 {selected.size} 条</span>
                            <div className="acts">
                                <button
                                    className="btn"
                                    onClick={() => {
                                        if (selected.size === messages.length) setSelected(new Set());
                                        else setSelected(new Set(messages.map(m => m.id)));
                                    }}
                                >
                                    {selected.size === messages.length ? '取消全选' : '全选'}
                                </button>
                                <button className="btn btn-primary" disabled={!selected.size} onClick={copySelected}>
                                    <Icon name="copy" size={13} /> 复制所选
                                </button>
                                <button className="btn" onClick={() => { setSelectMode(false); setSelected(new Set()); }}>退出</button>
                            </div>
                        </div>
                    )}

                    <footer className="input-bar">
                        <div className="input-wrap">
                            <textarea
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => {
                                    if (e.key === 'Enter' && !e.shiftKey) {
                                        e.preventDefault();
                                        handleSend();
                                    }
                                }}
                                placeholder="输入消息..."
                                rows={1}
                            />
                            <button className="send-btn" onClick={handleSend} disabled={!input.trim() || isTyping} title="发送">
                                <Icon name="send" size={16} />
                            </button>
                        </div>
                    </footer>
                </div>
            );
        });

        function SettingsModal({ state, updateState, onClose, showNotice }) {
            const [providers, setProviders] = useState(() => JSON.parse(JSON.stringify(state.providers)));

            const updateProv = (key, field, value) => {
                setProviders(prev => ({ ...prev, [key]: { ...prev[key], [field]: value } }));
            };
            const updateModel = (key, idx, field, value) => {
                setProviders(prev => {
                    const next = [...(prev[key].models || [])];
                    next[idx] = { ...next[idx], [field]: value };
                    return { ...prev, [key]: { ...prev[key], models: next } };
                });
            };

            return (
                <div className="modal" onClick={onClose}>
                    <div className="modal-card" onClick={e => e.stopPropagation()}>
                        <div className="modal-head">
                            <h3>API 设置</h3>
                            <button className="icon-btn" onClick={onClose}><Icon name="x" size={17} /></button>
                        </div>
                        <div className="modal-body">
                            <p className="hint-top">
                                API Key 仅保存在浏览器本地。每个服务维护自己的模型列表：<b>显示名</b>（如 flash）用于前端下拉选择，<b>模型 ID</b>（如 deepseek-v4-flash）为实际请求标识，请求参数为可选的 JSON。
                            </p>
                            {Object.entries(PROVIDERS).map(([key, meta]) => {
                                const p = providers[key] || { apiKey: '', baseUrl: meta.baseUrl, models: [] };
                                return (
                                    <div key={key} className="provider-card">
                                        <div className="ph">
                                            <Icon name={key === 'custom' ? 'wrench' : 'key'} size={15} style={{ color: 'var(--accent)' }} />
                                            {meta.label}
                                            <span className="note">{meta.note.split('。')[0]}</span>
                                        </div>
                                        <div>
                                            <div className="fl" style={{ marginBottom: 5, fontSize: 12 }}>API Key {key === 'ollama' ? '（可留空）' : ''}</div>
                                            <input
                                                type="password"
                                                value={p.apiKey || ''}
                                                onChange={e => updateProv(key, 'apiKey', e.target.value)}
                                                placeholder={key === 'ollama' ? '无需填写' : 'sk-...'}
                                            />
                                        </div>
                                        <div>
                                            <div className="fl" style={{ marginBottom: 5, fontSize: 12 }}>Base URL</div>
                                            <input
                                                type="text"
                                                value={p.baseUrl || ''}
                                                onChange={e => updateProv(key, 'baseUrl', e.target.value)}
                                                placeholder="https://..."
                                            />
                                        </div>
                                        <div>
                                            <div className="fl" style={{ marginBottom: 5, fontSize: 12 }}>模型列表</div>
                                            <div style={{ display: 'flex', flexDirection: 'column', gap: 8 }}>
                                                {(p.models || []).map((m, i) => (
                                                    <div key={i} className="model-row">
                                                        <div className="mrow">
                                                            <input
                                                                type="text"
                                                                value={m.label || ''}
                                                                onChange={e => updateModel(key, i, 'label', e.target.value)}
                                                                placeholder="显示名，如 flash"
                                                            />
                                                            <input
                                                                type="text"
                                                                value={m.id || ''}
                                                                onChange={e => updateModel(key, i, 'id', e.target.value)}
                                                                placeholder="模型 ID，如 deepseek-v4-flash"
                                                            />
                                                            <button
                                                                className="icon-btn"
                                                                onClick={() => updateProv(key, 'models', (p.models || []).filter((_, j) => j !== i))}
                                                                title="删除该模型"
                                                            >
                                                                <Icon name="x" size={14} />
                                                            </button>
                                                        </div>
                                                        <details className="adv">
                                                            <summary>高级：请求参数（JSON，可选）</summary>
                                                            <input
                                                                type="text"
                                                                value={m.params || ''}
                                                                onChange={e => updateModel(key, i, 'params', e.target.value)}
                                                                placeholder={'如 {"thinking":{"type":"enabled"}}'}
                                                                style={{ marginTop: 6, fontSize: 11, fontFamily: 'monospace' }}
                                                            />
                                                        </details>
                                                    </div>
                                                ))}
                                                <button
                                                    className="add-model-btn"
                                                    onClick={() => updateProv(key, 'models', [...(p.models || []), { label: '', id: '', params: '' }])}
                                                >
                                                    <Icon name="plus" size={13} /> 添加模型
                                                </button>
                                            </div>
                                        </div>
                                        <p className="hint-note">{meta.note}</p>
                                    </div>
                                );
                            })}
                        </div>
                        <div className="modal-foot">
                            <button className="btn" onClick={onClose}>取消</button>
                            <div className="acts">
                                <button
                                    className="btn btn-primary"
                                    onClick={() => {
                                        const cleaned = {};
                                        for (const [k, v] of Object.entries(providers)) {
                                            cleaned[k] = {
                                                ...v,
                                                models: (v.models || []).filter(m => m.id && m.id.trim()).map(m => ({ label: m.label.trim() || m.id.trim(), id: m.id.trim(), params: (m.params || '').trim() }))
                                            };
                                        }
                                        updateState({ providers: cleaned });
                                        showNotice('API 设置已保存');
                                        onClose();
                                    }}
                                >
                                    保存设置
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        const AgentModal = memo(function AgentModal({ state, updateState, editingAgent, onClose, showNotice }) {
            const [name, setName] = useState(editingAgent?.name || '');
            const [provider, setProvider] = useState(editingAgent?.provider || 'deepseek');
            const [model, setModel] = useState(editingAgent?.model || '');
            const [systemPrompt, setSystemPrompt] = useState(editingAgent?.systemPrompt || '');
            const [temperature, setTemperature] = useState(editingAgent?.temperature != null ? String(editingAgent.temperature) : '');
            const [showConfirm, setShowConfirm] = useState(false);

            const meta = PROVIDERS[provider];
            const modelList = (state.providers[provider]?.models || []);
            const effModel = modelList.some(m => m.id === model) ? model : (modelList[0]?.id || '');
            const isCustom = provider === 'ollama' || provider === 'custom';

            const changeProvider = (p) => {
                setProvider(p);
                const list = state.providers[p]?.models || [];
                setModel(list.length ? list[0].id : '');
            };

            const handleSave = () => {
                if (!name.trim()) return showNotice('请输入智能体名称', 'error');
                if (isCustom) {
                    if (!effModel.trim()) return showNotice('请填写模型 ID', 'error');
                } else {
                    if (!modelList.length) return showNotice('请先在 API 设置中为该 API 配置模型', 'error');
                    if (!effModel) return showNotice('请选择模型', 'error');
                }

                const data = {
                    name: name.trim(),
                    provider,
                    model: effModel,
                    systemPrompt,
                    temperature: temperature === '' ? null : parseFloat(temperature)
                };

                if (editingAgent) {
                    updateState({ agents: state.agents.map(a => a.id === editingAgent.id ? { ...a, ...data } : a) });
                    showNotice('智能体已更新');
                } else {
                    const id = Date.now().toString();
                    updateState({ agents: [...state.agents, { id, ...data }], activeAgentId: id });
                    showNotice('新智能体已创建');
                }
                onClose();
            };

            const handleDelete = () => {
                const newList = state.agents.filter(a => a.id !== editingAgent.id);
                updateState({
                    agents: newList,
                    activeAgentId: state.activeAgentId === editingAgent.id ? (newList[0]?.id || null) : state.activeAgentId
                });
                showNotice('智能体已删除');
                onClose();
            };

            return (
                <div className="modal" onClick={onClose}>
                    <div className="modal-card sm" onClick={e => e.stopPropagation()}>
                        <div className="modal-head">
                            <h3>{editingAgent ? '修改智能体' : '创建智能体'}</h3>
                            <button className="icon-btn" onClick={onClose}><Icon name="x" size={17} /></button>
                        </div>
                        <div className="modal-body">
                            <div className="field">
                                <label className="fl">智能体名称</label>
                                <input value={name} onChange={e => setName(e.target.value)} placeholder="给智能体起个名字，如：代码审查助手..." />
                            </div>
                            <div className="grid2">
                                <div className="field">
                                    <label className="fl">接入 API</label>
                                    <select value={provider} onChange={e => changeProvider(e.target.value)}>
                                        {Object.entries(PROVIDERS).map(([k, v]) => (
                                            <option key={k} value={k}>{v.label}</option>
                                        ))}
                                    </select>
                                </div>
                                <div className="field">
                                    <label className="fl">模型</label>
                                    {isCustom ? (
                                        <input value={effModel} onChange={e => setModel(e.target.value)} placeholder={provider === 'ollama' ? '如 qwen3:32b' : '模型 ID（需与 Base URL 服务匹配）'} />
                                    ) : modelList.length ? (
                                        <select value={effModel} onChange={e => setModel(e.target.value)}>
                                            {modelList.map(m => <option key={m.id} value={m.id}>{m.label}</option>)}
                                        </select>
                                    ) : (
                                        <div style={{ fontSize: 12.5, color: 'var(--muted)', padding: '10px 12px', border: '1px solid var(--border)', borderRadius: 10, background: 'var(--panel2)' }}>
                                            该 API 尚未配置模型，请先到「API 设置」中填写
                                        </div>
                                    )}
                                </div>
                            </div>
                            <div className="field">
                                <label className="fl">
                                    固定提示词（系统指令）
                                    <span className="hint">每次对话都会附加给模型</span>
                                </label>
                                <textarea
                                    rows={7}
                                    value={systemPrompt}
                                    onChange={e => setSystemPrompt(e.target.value)}
                                    placeholder="例如：你是一位资深全栈工程师，擅长代码审查与性能优化。回答要求简洁、给出具体代码示例。"
                                />
                            </div>
                            <div className="field">
                                <label className="fl">
                                    温度 (Temperature)
                                    <span className="hint">留空使用 API 默认值（Kimi 思考模型不支持设置）</span>
                                </label>
                                <input
                                    type="number"
                                    min="0"
                                    max="2"
                                    step="0.1"
                                    value={temperature}
                                    onChange={e => setTemperature(e.target.value)}
                                    placeholder="0.7"
                                />
                            </div>
                        </div>
                        <div className="modal-foot">
                            {editingAgent ? (
                                <button className="btn btn-danger-text" onClick={() => setShowConfirm(true)}>删除该智能体</button>
                            ) : <span></span>}
                            <div className="acts">
                                <button className="btn" onClick={onClose}>取消</button>
                                <button className="btn btn-primary" onClick={handleSave}>保存</button>
                            </div>
                        </div>
                        {showConfirm && (
                            <div className="modal" style={{ position: 'absolute', inset: 0, background: 'rgba(4,7,12,.75)' }} onClick={() => setShowConfirm(false)}>
                                <div className="confirm-box" onClick={e => e.stopPropagation()}>
                                    <div className="ic" style={{ background: 'rgba(248,113,113,.12)', color: 'var(--danger)' }}><Icon name="trash" size={24} /></div>
                                    <h4>确认删除此智能体？</h4>
                                    <p>此操作不可恢复，「{name}」的所有对话记录也将被永久删除。</p>
                                    <div className="acts">
                                        <button className="btn" onClick={() => setShowConfirm(false)}>我不删了</button>
                                        <button className="btn btn-primary" style={{ background: 'linear-gradient(135deg,#f87171,#dc2626)' }} onClick={handleDelete}>确认删除</button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        });

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
