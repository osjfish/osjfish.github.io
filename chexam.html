<body class="bg-[#fdfbf7] text-[#3a3530] overflow-hidden">
    <div id="root"></div>

    <script>
const {
  useState,
  useEffect,
  useRef,
  useMemo
} = React;
const {
  motion,
  AnimatePresence
} = window.Motion;
const Icon = ({
  name,

}) => {
  const containerRef = useRef(null);
  useEffect(() => {
    if (containerRef.current) {
      containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width: ${size}px; height: ${size}px;"></i>`;
      if (window.lucide) {

          console.error("Lucide icon generation failed", e);
        }
      }

  }, [name, size, className]);
  return React.createElement("span", {

      height: size

};
const SECTIONS = [{
  id: 'shiyong',
  title: '一、实用类文本阅读'
}, {
  id: 'wenxue',
  title: '二、文学类文本阅读'
}, {
  id: 'mizhu',
  title: '三、名著阅读'
}, {
  id: 'gushi',
  title: '四、古诗阅读'
}, {
  id: 'wenyan',
  title: '五、文言阅读'
}, {
  id: 'yuyan',
  title: '六、语言运用'
}, {
  id: 'zuowen',
  title: '七、作文'
}];
const DEFAULT_STATE = {

  sections: SECTIONS.reduce((acc, sec) => {
    acc[sec.id] = {
      title: sec.title,
      material: '',
      exam: '',
      answer: '',
      materialPrompt: '',
      examPrompt: ''
    };

  }, {})
};
const DEFAULT_SETTINGS = {

  doubaoEndpoint: '',

  selectedModel: 'deepseek-v4-pro'
};
function Column({

}) {

    className: `flex flex-col ${colors.card} rounded-2xl border ${colors.border} overflow-hidden shadow-sm hover:shadow-md transition-all h-full group relative duration-300`
  }, React.createElement("div", {
    className: `px-4 py-2.5 ${colors.card} border-b ${colors.border} flex items-center justify-between`
  }, React.createElement("div", {
    className: "flex items-center gap-2"
  }, React.createElement("div", {
    className: `w-1 h-3 ${isDarkMode ? 'bg-[#c5a059]' : 'bg-[#8c9a8c]'} rounded-full transition-colors`

    className: `text-[10px] font-bold uppercase tracking-widest ${colors.textMuted}`
  }, title)), React.createElement("div", {
    className: "flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity"
  }, React.createElement("button", {
    onClick: onCopy,
    className: `p-1.5 ${colors.textMuted} hover:text-[#5c7a5c] ${isDarkMode ? 'hover:bg-[#2d3136]' : 'hover:bg-[#f5f8f5]'} rounded-lg transition-all`,
    title: "\u590D\u5236"
  }, React.createElement(Icon, {
    name: "copy",
    size: 14
  })), React.createElement("button", {
    onClick: onClear,
    className: `p-1.5 ${colors.textMuted} hover:text-[#a65d5d] ${isDarkMode ? 'hover:bg-[#2d3136]' : 'hover:bg-[#fdf5f5]'} rounded-lg transition-all`,
    title: "\u6E05\u7A7A"
  }, React.createElement(Icon, {
    name: "trash-2",
    size: 14
  })))), React.createElement("textarea", {
    className: `flex-1 p-4 text-[14px] leading-relaxed ${colors.text} bg-transparent placeholder:${colors.textMuted} font-medium`,
    value: value,

  }));
}
function App() {
  const [state, setState] = useState(() => {
    const saved = localStorage.getItem('exam_gen_v4_standalone');

      try {
        const parsed = JSON.parse(saved);
        if (!parsed.archives) {
          parsed.archives = [];
        }
        return parsed;
      } catch (e) {
        return {
          ...DEFAULT_STATE,
          archives: []
        };
      }
    }
    return {
      ...DEFAULT_STATE,
      archives: []
    };
  });
  const [settings, setSettings] = useState(() => {
    const saved = localStorage.getItem('exam_settings_v4_standalone');
    return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
  });
  const [isLoading, setIsLoading] = useState(false);
  const [modalType, setModalType] = useState('none');
  const [isDarkMode, setIsDarkMode] = useState(() => {
    const saved = localStorage.getItem('exam_is_dark_mode');
    return saved ? JSON.parse(saved) : false;
  });
  useEffect(() => {
    localStorage.setItem('exam_is_dark_mode', JSON.stringify(isDarkMode));
    if (isDarkMode) {
      document.documentElement.classList.add('dark');
    } else {
      document.documentElement.classList.remove('dark');
    }
  }, [isDarkMode]);
  const [confirmClearInfo, setConfirmClearInfo] = useState({
    target: '',
    label: ''
  });
  const [tempPrompt, setTempPrompt] = useState('');
  const [isSidebarOpen, setIsSidebarOpen] = useState(true);
  const [notification, setNotification] = useState(null);
  const [sidebarTab, setSidebarTab] = useState('index');
  const [selectedArchiveIds, setSelectedArchiveIds] = useState([]);
  const [viewingArchive, setViewingArchive] = useState(null);
  const [archiveToDelete, setArchiveToDelete] = useState(null);
  const [archiveSearchQuery, setArchiveSearchQuery] = useState('');
  const [archiveFilterStatus, setArchiveFilterStatus] = useState('all');
  const [archiveFilterSection, setArchiveFilterSection] = useState('all');
  const filteredArchives = (state.archives || []).filter(arc => {
    if (archiveSearchQuery.trim()) {
      const q = archiveSearchQuery.toLowerCase();
      const matchTitle = (arc.sectionTitle || '').toLowerCase().includes(q);
      const matchMaterial = (arc.material || '').toLowerCase().includes(q);
      const matchExam = (arc.exam || '').toLowerCase().includes(q);
      const matchAnswer = (arc.answer || '').toLowerCase().includes(q);
      if (!matchTitle && !matchMaterial && !matchExam && !matchAnswer) {
        return false;
      }
    }
    if (archiveFilterStatus === 'unused' && arc.used) return false;
    if (archiveFilterStatus === 'used' && !arc.used) return false;
    if (archiveFilterSection !== 'all' && arc.sectionId !== archiveFilterSection) return false;
    return true;
  });
  const archiveCurrent = () => {
    const mat = (activeData.material || '').trim();
    const exm = (activeData.exam || '').trim();
    const ans = (activeData.answer || '').trim();
    if (!mat && !exm && !ans) {
      setNotification({
        type: 'error',
        msg: '当前编辑区内容为空，无法存入档案'
      });
      return;
    }
    const newArchive = {
      id: 'arc_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
      sectionId: state.activeId,
      sectionTitle: activeData.title || SECTIONS.find(s => s.id === state.activeId).title,
      material: mat,
      exam: exm,
      answer: ans,
      timestamp: Date.now(),
      used: false
    };
    setState(prev => ({
      ...prev,
      archives: [newArchive, ...(prev.archives || [])],
      sections: {
        ...prev.sections,
        [prev.activeId]: {
          ...prev.sections[prev.activeId],
          material: '',
          exam: '',
          answer: '',
          optimizeMaterialInput: '',
          optimizeExamInput: ''
        }
      }
    }));
    setNotification({
      type: 'success',
      msg: `已将当前内容存入【${newArchive.sectionTitle}】的独立存档，并清空当前编辑区`
    });
  };
  const toggleSelectArchive = id => {
    setSelectedArchiveIds(prev => prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]);
  };
  const toggleSelectAllArchives = () => {
    const visibleIds = filteredArchives.map(a => a.id);
    const allVisibleSelected = visibleIds.every(id => selectedArchiveIds.includes(id)) && visibleIds.length > 0;
    if (allVisibleSelected) {
      setSelectedArchiveIds(prev => prev.filter(id => !visibleIds.includes(id)));
    } else {
      setSelectedArchiveIds(prev => {
        const newSelection = [...prev];
        visibleIds.forEach(id => {
          if (!newSelection.includes(id)) {
            newSelection.push(id);
          }
        });
        return newSelection;
      });
    }
  };
  const restoreArchive = arc => {
    const currentSec = state.sections[arc.sectionId];
    const hasExisting = currentSec.material.trim() || currentSec.exam.trim() || currentSec.answer.trim();
    const applyRestore = () => {
      setState(prev => ({
        ...prev,
        activeId: arc.sectionId,
        sections: {
          ...prev.sections,
          [arc.sectionId]: {
            ...prev.sections[arc.sectionId],
            material: arc.material,
            exam: arc.exam,
            answer: arc.answer
          }
        }
      }));
      setViewingArchive(null);
      setNotification({
        type: 'success',
        msg: `已恢复内容至【${arc.sectionTitle}】编辑区`
      });
    };
    if (hasExisting) {
      if (window.confirm(`【${arc.sectionTitle}】的当前编辑区不为空，恢复此条存档将覆盖现有内容。确认覆盖吗？`)) {
        applyRestore();
      }
    } else {
      applyRestore();
    }
  };
  const exportSingleArchive = arc => {
    let txt = "========================================\n";
    txt += `  试题生成助手 - 存档单个文件导出\n`;
    txt += `  题材大题：${arc.sectionTitle}\n`;
    txt += `  导出时间：${new Date(arc.timestamp).toLocaleString()}\n`;
    txt += "========================================\n\n";
    if (arc.material && arc.material.trim()) {
      txt += "【阅读材料】\n";
      txt += arc.material.trim() + "\n\n";
    }
    if (arc.exam && arc.exam.trim()) {
      txt += "【试题内容】\n";
      txt += arc.exam.trim() + "\n\n";
    }
    if (arc.answer && arc.answer.trim()) {
      txt += "【参考答案与解析】\n";
      txt += arc.answer.trim() + "\n\n";
    }
    const blob = new Blob([txt], {
      type: 'text/plain;charset=utf-8'
    });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `单个存档_${arc.sectionTitle.replace(/\s+/g, '_')}_${new Date(arc.timestamp).toISOString().slice(0, 10)}.txt`;
    link.click();
    setNotification({
      type: 'success',
      msg: '单个试题导出成功'
    });
  };
  const deleteSingleArchive = id => {
    setState(prev => ({
      ...prev,
      archives: (prev.archives || []).filter(a => a.id !== id)
    }));
    setSelectedArchiveIds(prev => prev.filter(x => x !== id));
    setArchiveToDelete(null);
    setViewingArchive(null);
    setNotification({
      type: 'success',
      msg: '已成功删除该条试题存档'
    });
  };
  const assembleAndExport = () => {
    if (selectedArchiveIds.length === 0) {
      setNotification({
        type: 'error',
        msg: '请先勾选需要拼卷的试题！'
      });
      return;
    }
    const selectedArchives = (state.archives || []).filter(a => selectedArchiveIds.includes(a.id));
    const sortedSelected = [...selectedArchives].sort((a, b) => {
      const idxA = SECTIONS.findIndex(s => s.id === a.sectionId);
      const idxB = SECTIONS.findIndex(s => s.id === b.sectionId);
      return idxA - idxB;
    });
    let paperTxt = "========================================\n";
    paperTxt += "         全 新 拼 卷 语 文 试 卷\n";
    paperTxt += "========================================\n\n";
    let answerTxt = "\n\n========================================\n";
    answerTxt += "       拼 卷 试 题 参 考 答 案 与 解 析\n";
    answerTxt += "========================================\n\n";
    sortedSelected.forEach((arc, index) => {
      paperTxt += `【第 ${index + 1} 部分：${arc.sectionTitle}】\n\n`;
      if (arc.material && arc.material.trim()) {
        paperTxt += "【阅读材料】\n";
        paperTxt += arc.material.trim() + "\n\n";
      }
      if (arc.exam && arc.exam.trim()) {
        paperTxt += "【试题内容】\n";
        paperTxt += arc.exam.trim() + "\n\n";
      }
      if (arc.answer && arc.answer.trim()) {
        answerTxt += `【第 ${index + 1} 部分：${arc.sectionTitle} 答案解析】\n`;
        answerTxt += arc.answer.trim() + "\n\n";
      }
      paperTxt += "----------------------------------------\n\n";
    });
    const finalContent = paperTxt + answerTxt;
    const blob = new Blob([finalContent], {
      type: 'text/plain;charset=utf-8'
    });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `语文拼卷试卷_${new Date().toLocaleDateString()}.txt`;
    link.click();
    setState(prev => {
      const updatedArchives = (prev.archives || []).map(a => {
        if (selectedArchiveIds.includes(a.id)) {
          return {
            ...a,
            used: true
          };
        }
        return a;
      });
      return {
        ...prev,
        archives: updatedArchives
      };
    });
    setNotification({
      type: 'success',
      msg: '拼卷导出成功！已选试题自动标记为“已使用”'
    });
  };
  const deleteUsedArchives = () => {
    setState(prev => ({
      ...prev,
      archives: (prev.archives || []).filter(a => !a.used)
    }));
    setSelectedArchiveIds(prev => prev.filter(id => {
      const arc = (state.archives || []).find(a => a.id === id);
      return arc ? !arc.used : false;
    }));
    setModalType('none');
    setNotification({
      type: 'success',
      msg: '已成功删除所有被标记为已使用的存档记录'
    });
  };
  const colors = {
    bg: isDarkMode ? 'bg-[#1a1c1e]' : 'bg-[#f8f6f2]',
    mainBg: isDarkMode ? 'bg-[#121416]' : 'bg-[#f4f2ed]',
    card: isDarkMode ? 'bg-[#24272a]' : 'bg-[#fefdfb]',
    sidebar: isDarkMode ? 'bg-[#1e2124]' : 'bg-[#fefdfb]',
    border: isDarkMode ? 'border-[#2d3136]' : 'border-[#ece7e0]',
    text: isDarkMode ? 'text-[#d1d1d1]' : 'text-[#3a3530]',
    textMuted: isDarkMode ? 'text-[#8e9196]' : 'text-[#a8a095]',
    input: isDarkMode ? 'bg-[#2d3136]' : 'bg-[#f8f6f2]'
  };
  useEffect(() => {
    localStorage.setItem('exam_is_dark_mode', JSON.stringify(isDarkMode));
    if (isDarkMode) {
      document.documentElement.classList.add('dark');
      document.body.className = 'bg-[#121416] overflow-hidden';
    } else {
      document.documentElement.classList.remove('dark');
      document.body.className = 'bg-[#fdfbf7] overflow-hidden';
    }
  }, [isDarkMode]);
  const [generatingState, setGeneratingState] = useState({
    reasoning: '',
    content: '',
    type: 'material'
  });
  const copyToClipboard = text => {
    if (!text || text.trim() === '') {
      setNotification({
        type: 'error',
        msg: '没有内容可复制'
      });
      return;
    }
    const fallbackCopy = content => {
      const textArea = document.createElement("textarea");
      textArea.value = content;
      textArea.style.position = "fixed";
      textArea.style.left = "-9999px";
      textArea.style.top = "0";
      document.body.appendChild(textArea);
      textArea.focus();
      textArea.select();
      try {
        const successful = document.execCommand('copy');
        if (successful) setNotification({
          type: 'success',
          msg: '复制成功'
        });else throw new Error();
      } catch (err) {
        setNotification({
          type: 'error',
          msg: '复制失败'
        });
      }
      document.body.removeChild(textArea);
    };
    if (!navigator.clipboard) {
      fallbackCopy(text);
      return;
    }
    navigator.clipboard.writeText(text).then(() => {
      setNotification({
        type: 'success',
        msg: '复制成功'
      });
    }).catch(() => {
      fallbackCopy(text);
    });
  };
  const triggerClear = (target, label) => {
    if (target === 'all' || target === 'global_all') {
      setConfirmClearInfo({
        target,
        label
      });
      setModalType('clear_confirm');
      return;
    }
    if (!activeData[target]) return;
    setConfirmClearInfo({
      target,
      label
    });
    setModalType('clear_confirm');
  };
  const triggerGenerateAll = () => {
    if (isLoading) return;
    const isDeepSeek = settings.apiType === 'deepseek';
    if (isDeepSeek ? !settings.deepseekKey : !settings.doubaoKey || !settings.doubaoEndpoint) {
      setNotification({
        type: 'error',
        msg: '请先完成接口配置'
      });
      setModalType('settings');
      return;
    }
    setModalType('generate_all_confirm');
  };
  const startGenerateAll = async () => {
    setModalType('generating');
    setIsLoading(true);
    setNotification({
      type: 'success',
      msg: '开始一键生成全套试卷...'
    });
    for (const sec of SECTIONS) {
      const currentData = state.sections[sec.id];
      if (currentData.exam && currentData.exam.trim() !== '') continue;
      setState(prev => ({
        ...prev,
        activeId: sec.id
      }));
      try {
        setGeneratingState({
          reasoning: '',
          content: '',
          type: 'material'
        });
        const mPrompt = currentData.materialPrompt || `请根据要求生成一篇适合“${currentData.title || sec.title}”的材料。`;
        const materialResult = await handleAICall(mPrompt, update => setGeneratingState(prev => ({
          ...prev,
          ...update
        })));
        if (materialResult && materialResult !== 'CONFIG_MISSING') {
          setGeneratingState({
            reasoning: '',
            content: '',
            type: 'exam'
          });
          const ePrompt = currentData.examPrompt || `请根据材料生成“${currentData.title || sec.title}”对应的试题和答案。请严格分为 [试题部分] 和 [答案与解析部分]。`;
          const prompt = `你是一个专业的试题生成程序。请严格执行以下任务：\n\n【材料内容】：\n${materialResult}\n\n【用户生成要求】：\n${ePrompt}\n\n【输出规范】：\n你必须将输出内容严格分为两个部分：\n\n[试题部分]\n(在这里输出试题内容)\n\n[答案与解析部分]\n(在这里输出对应的答案和解析)`;
          const examResult = await handleAICall(prompt, update => setGeneratingState(prev => ({
            ...prev,
            ...update
          })));
          if (examResult && examResult !== 'CONFIG_MISSING') {
            const parsed = parseContent(examResult);
            if (parsed) {
              updateSectionById(sec.id, {
                material: materialResult,
                exam: parsed.exam,
                answer: parsed.answer
              });
            } else {
              updateSectionById(sec.id, {
                material: materialResult,
                exam: examResult,
                answer: "AI未按格式输出，请手动分离。"
              });
            }
          }
        }
      } catch (err) {
        console.error(`生成 ${sec.title} 失败:`, err);
      }
    }
    setIsLoading(false);
    setModalType('none');
    setNotification({
      type: 'success',
      msg: '全套试卷生成流程结束（已跳过原有内容的题型）'
    });
  };
  const handleOptimize = async target => {
    const isDeepSeek = settings.apiType === 'deepseek';
    if (isDeepSeek ? !settings.deepseekKey : !settings.doubaoKey || !settings.doubaoEndpoint) {
      setNotification({
        type: 'error',
        msg: '请先完成接口配置'
      });
      setModalType('settings');
      return;
    }
    setModalType('generating');
    setIsLoading(true);
    const basePrompt = target === 'material' ? activeData.materialPrompt : activeData.examPrompt;
    const specialRequirement = target === 'material' ? activeData.optimizeMaterialInput || '' : activeData.optimizeExamInput || '';
    const specialRequirementTrimmed = specialRequirement.trim();
    const finalRequirement = specialRequirementTrimmed ? `你必须同时满足以下【基础生成要求】和【此次优化的特殊要求】进行改写：\n\n【基础生成要求】：\n${basePrompt}\n\n【此次优化的特殊要求】：\n${specialRequirementTrimmed}` : basePrompt;
    let prompt = '';
    if (target === 'material') {
      setGeneratingState({
        reasoning: '',
        content: '',
        type: 'material'
