<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>试题生成助手</title>
    <!-- 库文件 CDN -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class'
        };
        (function() {
            const saved = localStorage.getItem('exam_is_dark_mode');
            if (saved && JSON.parse(saved)) {
                document.documentElement.classList.add('dark');
            }
        })();
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;900&display=swap');
        body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; transition: background-color 0.3s ease; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #d1d5db; border-radius: 10px; }
        .dark ::-webkit-scrollbar-thumb { background: #3f444a; }
        .dark ::-webkit-scrollbar-track { background: #1a1c1e; }
        textarea { border: none; outline: none !important; resize: none; }
        .modal-backdrop{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:1rem;background:rgba(0,0,0,.12);backdrop-filter:blur(4px);opacity:0;pointer-events:none;transition:opacity .2s ease}
        .modal-backdrop.show{opacity:1;pointer-events:auto}
        .modal-box{transform:scale(.92) translateY(12px);opacity:0;transition:transform .25s cubic-bezier(.34,1.56,.64,1),opacity .2s ease}
        .modal-backdrop.show .modal-box{transform:scale(1) translateY(0);opacity:1}
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .7; } }
    </style>
</head>
<body class="bg-[#fdfbf7] text-[#3a3530] overflow-hidden">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;
        const { motion, AnimatePresence } = window.Motion;

        // --- Lucide Icon Helper ---
        const Icon = ({ name, size = 20, className = "" }) => {
            const containerRef = useRef(null);
            useEffect(() => {
                if (containerRef.current) {
                    containerRef.current.innerHTML = `<i data-lucide="${name}" class="${className}" style="width: ${size}px; height: ${size}px;"></i>`;
                    if (window.lucide) {
                        try {
                            window.lucide.createIcons();
                        } catch (e) {
                            console.error("Lucide icon generation failed", e);
                        }
                    }
                }
            }, [name, size, className]);
            return <span ref={containerRef} className="inline-flex items-center justify-center shrink-0" style={{ width: size, height: size }}></span>;
        };

        // --- Config ---
        const SECTIONS = [
            { id: 'shiyong', title: '一、实用类文本阅读' },
            { id: 'wenxue', title: '二、文学类文本阅读' },
            { id: 'mizhu', title: '三、名著阅读' },
            { id: 'gushi', title: '四、古诗阅读' },
            { id: 'wenyan', title: '五、文言阅读' },
            { id: 'yuyan', title: '六、语言运用' },
            { id: 'zuowen', title: '七、作文' },
        ];

        const DEFAULT_STATE = {
            activeId: 'shiyong',
            sections: SECTIONS.reduce((acc, sec) => {
                acc[sec.id] = { title: sec.title, material: '', exam: '', answer: '', materialPrompt: '', examPrompt: '' };
                return acc;
            }, {}),
        };

        const DEFAULT_SETTINGS = {
            deepseekKey: '',
            doubaoKey: '',
            doubaoEndpoint: '',
            apiType: 'deepseek',
            selectedModel: 'deepseek-v4-pro',
        };

        // --- Components ---
        function Column({ title, value, onChange, placeholder, onCopy, onClear, isDarkMode, colors }) {
            return (
                <section className={`flex flex-col ${colors.card} rounded-2xl border ${colors.border} overflow-hidden shadow-sm hover:shadow-md transition-all h-full group relative duration-300`}>
                    <div className={`px-4 py-2.5 ${colors.card} border-b ${colors.border} flex items-center justify-between`}>
                        <div className="flex items-center gap-2">
                            <div className={`w-1 h-3 ${isDarkMode ? 'bg-[#c5a059]' : 'bg-[#8c9a8c]'} rounded-full transition-colors`} />
                            <h2 className={`text-[10px] font-bold uppercase tracking-widest ${colors.textMuted}`}>{title}</h2>
                        </div>
                        <div className="flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                            <button 
                                onClick={onCopy} 
                                className={`p-1.5 ${colors.textMuted} hover:text-[#5c7a5c] ${isDarkMode ? 'hover:bg-[#2d3136]' : 'hover:bg-[#f5f8f5]'} rounded-lg transition-all`}
                                title="复制"
                            >
                                <Icon name="copy" size={14} />
                            </button>
                            <button 
                                onClick={onClear} 
                                className={`p-1.5 ${colors.textMuted} hover:text-[#a65d5d] ${isDarkMode ? 'hover:bg-[#2d3136]' : 'hover:bg-[#fdf5f5]'} rounded-lg transition-all`}
                                title="清空"
                            >
                                <Icon name="trash-2" size={14} />
                            </button>
                        </div>
                    </div>
                    <textarea 
                        className={`flex-1 p-4 text-[14px] leading-relaxed ${colors.text} bg-transparent placeholder:${colors.textMuted} font-medium`}
                        value={value} 
                        onChange={e => onChange(e.target.value)} 
                        placeholder={placeholder} 
                    />
                </section>
            );
        }

        // --- Main App ---
        function App() {
            const [state, setState] = useState(() => {
                const saved = localStorage.getItem('exam_gen_v4_standalone');
                if (saved) {
                    try {
                        const parsed = JSON.parse(saved);
                        if (!parsed.archives) {
                            parsed.archives = [];
                        }
                        return parsed;
                    } catch (e) {
                        return { ...DEFAULT_STATE, archives: [] };
                    }
                }
                return { ...DEFAULT_STATE, archives: [] };
            });

            const [settings, setSettings] = useState(() => {
                const saved = localStorage.getItem('exam_settings_v4_standalone');
                return saved ? JSON.parse(saved) : DEFAULT_SETTINGS;
            });

            const [isLoading, setIsLoading] = useState(false);
            const [modalType, setModalType] = useState('none');
            const [isDarkMode, setIsDarkMode] = useState(() => {
                const saved = localStorage.getItem('exam_is_dark_mode');
                return saved ? JSON.parse(saved) : false;
            });

            useEffect(() => {
                localStorage.setItem('exam_is_dark_mode', JSON.stringify(isDarkMode));
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                } else {
                    document.documentElement.classList.remove('dark');
                }
            }, [isDarkMode]);

            const [confirmClearInfo, setConfirmClearInfo] = useState({ target: '', label: '' }); // label for display, target for key
            const [tempPrompt, setTempPrompt] = useState('');
            const [isSidebarOpen, setIsSidebarOpen] = useState(true);
            const [notification, setNotification] = useState(null);

            // Archiving and assembly state
            const [sidebarTab, setSidebarTab] = useState('index'); // 'index' or 'archive'
            const [selectedArchiveIds, setSelectedArchiveIds] = useState([]);
            const [viewingArchive, setViewingArchive] = useState(null);
            const [archiveToDelete, setArchiveToDelete] = useState(null);

            // Searching and Filtering states for archives
            const [archiveSearchQuery, setArchiveSearchQuery] = useState('');
            const [archiveFilterStatus, setArchiveFilterStatus] = useState('all'); // 'all', 'unused', 'used'
            const [archiveFilterSection, setArchiveFilterSection] = useState('all'); // 'all', or a specific sectionId

            // Dynamically computed filtered archives list
            const filteredArchives = (state.archives || []).filter(arc => {
                if (archiveSearchQuery.trim()) {
                    const q = archiveSearchQuery.toLowerCase();
                    const matchTitle = (arc.sectionTitle || '').toLowerCase().includes(q);
                    const matchMaterial = (arc.material || '').toLowerCase().includes(q);
                    const matchExam = (arc.exam || '').toLowerCase().includes(q);
                    const matchAnswer = (arc.answer || '').toLowerCase().includes(q);
                    if (!matchTitle && !matchMaterial && !matchExam && !matchAnswer) {
                        return false;
                    }
                }
                if (archiveFilterStatus === 'unused' && arc.used) return false;
                if (archiveFilterStatus === 'used' && !arc.used) return false;
                if (archiveFilterSection !== 'all' && arc.sectionId !== archiveFilterSection) return false;
                return true;
            });

            // Helper methods for archiving & assembly
            const archiveCurrent = () => {
                const mat = (activeData.material || '').trim();
                const exm = (activeData.exam || '').trim();
                const ans = (activeData.answer || '').trim();
                
                if (!mat && !exm && !ans) {
                    setNotification({ type: 'error', msg: '当前编辑区内容为空，无法存入档案' });
                    return;
                }

                const newArchive = {
                    id: 'arc_' + Date.now() + '_' + Math.random().toString(36).substring(2, 7),
                    sectionId: state.activeId,
                    sectionTitle: activeData.title || SECTIONS.find(s => s.id === state.activeId).title,
                    material: mat,
                    exam: exm,
                    answer: ans,
                    timestamp: Date.now(),
                    used: false
                };

                setState(prev => ({
                    ...prev,
                    archives: [newArchive, ...(prev.archives || [])],
                    sections: {
                        ...prev.sections,
                        [prev.activeId]: {
                            ...prev.sections[prev.activeId],
                            material: '',
                            exam: '',
                            answer: '',
                            optimizeMaterialInput: '',
                            optimizeExamInput: ''
                        }
                    }
                }));

                setNotification({ type: 'success', msg: `已将当前内容存入【${newArchive.sectionTitle}】的独立存档，并清空当前编辑区` });
            };

            const toggleSelectArchive = (id) => {
                setSelectedArchiveIds(prev => 
                    prev.includes(id) ? prev.filter(x => x !== id) : [...prev, id]
                );
            };

            const toggleSelectAllArchives = () => {
                const visibleIds = filteredArchives.map(a => a.id);
                const allVisibleSelected = visibleIds.every(id => selectedArchiveIds.includes(id)) && visibleIds.length > 0;
                
                if (allVisibleSelected) {
                    setSelectedArchiveIds(prev => prev.filter(id => !visibleIds.includes(id)));
                } else {
                    setSelectedArchiveIds(prev => {
                        const newSelection = [...prev];
                        visibleIds.forEach(id => {
                            if (!newSelection.includes(id)) {
                                newSelection.push(id);
                            }
                        });
                        return newSelection;
                    });
                }
            };

            const restoreArchive = (arc) => {
                const currentSec = state.sections[arc.sectionId];
                const hasExisting = currentSec.material.trim() || currentSec.exam.trim() || currentSec.answer.trim();
                
                const applyRestore = () => {
                    setState(prev => ({
                        ...prev,
                        activeId: arc.sectionId,
                        sections: {
                            ...prev.sections,
                            [arc.sectionId]: {
                                ...prev.sections[arc.sectionId],
                                material: arc.material,
                                exam: arc.exam,
                                answer: arc.answer
                            }
                        }
                    }));
                    setViewingArchive(null);
                    setNotification({ type: 'success', msg: `已恢复内容至【${arc.sectionTitle}】编辑区` });
                };

                if (hasExisting) {
                    if (window.confirm(`【${arc.sectionTitle}】的当前编辑区不为空，恢复此条存档将覆盖现有内容。确认覆盖吗？`)) {
                        applyRestore();
                    }
                } else {
                    applyRestore();
                }
            };

            const exportSingleArchive = (arc) => {
                let txt = "========================================\n";
                txt += `  试题生成助手 - 存档单个文件导出\n`;
                txt += `  题材大题：${arc.sectionTitle}\n`;
                txt += `  导出时间：${new Date(arc.timestamp).toLocaleString()}\n`;
                txt += "========================================\n\n";

                if (arc.material && arc.material.trim()) {
                    txt += "【阅读材料】\n";
                    txt += arc.material.trim() + "\n\n";
                }
                if (arc.exam && arc.exam.trim()) {
                    txt += "【试题内容】\n";
                    txt += arc.exam.trim() + "\n\n";
                }
                if (arc.answer && arc.answer.trim()) {
                    txt += "【参考答案与解析】\n";
                    txt += arc.answer.trim() + "\n\n";
                }

                const blob = new Blob([txt], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `单个存档_${arc.sectionTitle.replace(/\s+/g, '_')}_${new Date(arc.timestamp).toISOString().slice(0,10)}.txt`;
                link.click();
                setNotification({ type: 'success', msg: '单个试题导出成功' });
            };

            const deleteSingleArchive = (id) => {
                setState(prev => ({
                    ...prev,
                    archives: (prev.archives || []).filter(a => a.id !== id)
                }));
                setSelectedArchiveIds(prev => prev.filter(x => x !== id));
                setArchiveToDelete(null);
                setViewingArchive(null);
                setNotification({ type: 'success', msg: '已成功删除该条试题存档' });
            };

            const assembleAndExport = () => {
                if (selectedArchiveIds.length === 0) {
                    setNotification({ type: 'error', msg: '请先勾选需要拼卷的试题！' });
                    return;
                }

                const selectedArchives = (state.archives || []).filter(a => selectedArchiveIds.includes(a.id));
                const sortedSelected = [...selectedArchives].sort((a, b) => {
                    const idxA = SECTIONS.findIndex(s => s.id === a.sectionId);
                    const idxB = SECTIONS.findIndex(s => s.id === b.sectionId);
                    return idxA - idxB;
                });

                let paperTxt = "========================================\n";
                paperTxt += "         全 新 拼 卷 语 文 试 卷\n";
                paperTxt += "========================================\n\n";

                let answerTxt = "\n\n========================================\n";
                answerTxt += "       拼 卷 试 题 参 考 答 案 与 解 析\n";
                answerTxt += "========================================\n\n";

                sortedSelected.forEach((arc, index) => {
                    paperTxt += `【第 ${index + 1} 部分：${arc.sectionTitle}】\n\n`;
                    
                    if (arc.material && arc.material.trim()) {
                        paperTxt += "【阅读材料】\n";
                        paperTxt += arc.material.trim() + "\n\n";
                    }

                    if (arc.exam && arc.exam.trim()) {
                        paperTxt += "【试题内容】\n";
                        paperTxt += arc.exam.trim() + "\n\n";
                    }

                    if (arc.answer && arc.answer.trim()) {
                        answerTxt += `【第 ${index + 1} 部分：${arc.sectionTitle} 答案解析】\n`;
                        answerTxt += arc.answer.trim() + "\n\n";
                    }

                    paperTxt += "----------------------------------------\n\n";
                });

                const finalContent = paperTxt + answerTxt;
                const blob = new Blob([finalContent], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `语文拼卷试卷_${new Date().toLocaleDateString()}.txt`;
                link.click();

                // 标记为已使用 (used: true)
                setState(prev => {
                    const updatedArchives = (prev.archives || []).map(a => {
                        if (selectedArchiveIds.includes(a.id)) {
                            return { ...a, used: true };
                        }
                        return a;
                    });
                    return { ...prev, archives: updatedArchives };
                });

                setNotification({ type: 'success', msg: '拼卷导出成功！已选试题自动标记为“已使用”' });
            };

            const deleteUsedArchives = () => {
                setState(prev => ({
                    ...prev,
                    archives: (prev.archives || []).filter(a => !a.used)
                }));
                setSelectedArchiveIds(prev => prev.filter(id => {
                    const arc = (state.archives || []).find(a => a.id === id);
                    return arc ? !arc.used : false;
                }));
                setModalType('none');
                setNotification({ type: 'success', msg: '已成功删除所有被标记为已使用的存档记录' });
            };

            // Theme colors mapping
            const colors = {
                bg: isDarkMode ? 'bg-[#1a1c1e]' : 'bg-[#f8f6f2]',
                mainBg: isDarkMode ? 'bg-[#121416]' : 'bg-[#f4f2ed]',
                card: isDarkMode ? 'bg-[#24272a]' : 'bg-[#fefdfb]',
                sidebar: isDarkMode ? 'bg-[#1e2124]' : 'bg-[#fefdfb]',
                border: isDarkMode ? 'border-[#2d3136]' : 'border-[#ece7e0]',
                text: isDarkMode ? 'text-[#d1d1d1]' : 'text-[#3a3530]',
                textMuted: isDarkMode ? 'text-[#8e9196]' : 'text-[#a8a095]',
                input: isDarkMode ? 'bg-[#2d3136]' : 'bg-[#f8f6f2]'
            };

            useEffect(() => {
                localStorage.setItem('exam_is_dark_mode', JSON.stringify(isDarkMode));
                if (isDarkMode) {
                    document.documentElement.classList.add('dark');
                    document.body.className = 'bg-[#121416] overflow-hidden';
                } else {
                    document.documentElement.classList.remove('dark');
                    document.body.className = 'bg-[#fdfbf7] overflow-hidden';
                }
            }, [isDarkMode]);

            // 实时生成状态
            const [generatingState, setGeneratingState] = useState({
                reasoning: '',
                content: '',
                type: 'material' // 'material' or 'exam'
            });

            const copyToClipboard = (text) => {
                if (!text || text.trim() === '') {
                    setNotification({ type: 'error', msg: '没有内容可复制' });
                    return;
                }

                const fallbackCopy = (content) => {
                    const textArea = document.createElement("textarea");
                    textArea.value = content;
                    textArea.style.position = "fixed";
                    textArea.style.left = "-9999px";
                    textArea.style.top = "0";
                    document.body.appendChild(textArea);
                    textArea.focus();
                    textArea.select();
                    try {
                        const successful = document.execCommand('copy');
                        if (successful) setNotification({ type: 'success', msg: '复制成功' });
                        else throw new Error();
                    } catch (err) {
                        setNotification({ type: 'error', msg: '复制失败' });
                    }
                    document.body.removeChild(textArea);
                };

                if (!navigator.clipboard) {
                    fallbackCopy(text);
                    return;
                }

                navigator.clipboard.writeText(text).then(() => {
                    setNotification({ type: 'success', msg: '复制成功' });
                }).catch(() => {
                    fallbackCopy(text);
                });
            };

            const triggerClear = (target, label) => {
                // 如果是清空当前大题或全套，直接允许弹出确认框
                if (target === 'all' || target === 'global_all') {
                    setConfirmClearInfo({ target, label });
                    setModalType('clear_confirm');
                    return;
                }
                // 否则检查具体字段是否有内容
                if (!activeData[target]) return;
                setConfirmClearInfo({ target, label });
                setModalType('clear_confirm');
            };

            const triggerGenerateAll = () => {
                if (isLoading) return;
                const isDeepSeek = settings.apiType === 'deepseek';
                if (isDeepSeek ? !settings.deepseekKey : (!settings.doubaoKey || !settings.doubaoEndpoint)) {
                    setNotification({ type: 'error', msg: '请先完成接口配置' });
                    setModalType('settings');
                    return;
                }
                setModalType('generate_all_confirm');
            };

            const startGenerateAll = async () => {
                setModalType('generating');
                setIsLoading(true);
                setNotification({ type: 'success', msg: '开始一键生成全套试卷...' });

                for (const sec of SECTIONS) {
                    const currentData = state.sections[sec.id];
                    if (currentData.exam && currentData.exam.trim() !== '') continue;

                    setState(prev => ({ ...prev, activeId: sec.id }));
                    
                    try {
                        // 1. 生成材料
                        setGeneratingState({ reasoning: '', content: '', type: 'material' });
                        const mPrompt = currentData.materialPrompt || `请根据要求生成一篇适合“${currentData.title || sec.title}”的材料。`;
                        
                        const materialResult = await handleAICall(
                            mPrompt,
                            (update) => setGeneratingState(prev => ({ ...prev, ...update }))
                        );

                        if (materialResult && materialResult !== 'CONFIG_MISSING') {
                            // 2. 生成试题
                            setGeneratingState({ reasoning: '', content: '', type: 'exam' });
                            const ePrompt = currentData.examPrompt || `请根据材料生成“${currentData.title || sec.title}”对应的试题和答案。请严格分为 [试题部分] 和 [答案与解析部分]。`;
                            const prompt = `你是一个专业的试题生成程序。请严格执行以下任务：\n\n【材料内容】：\n${materialResult}\n\n【用户生成要求】：\n${ePrompt}\n\n【输出规范】：\n你必须将输出内容严格分为两个部分：\n\n[试题部分]\n(在这里输出试题内容)\n\n[答案与解析部分]\n(在这里输出对应的答案和解析)`;
                            
                            const examResult = await handleAICall(
                                prompt,
                                (update) => setGeneratingState(prev => ({ ...prev, ...update }))
                            );

                            if (examResult && examResult !== 'CONFIG_MISSING') {
                                const parsed = parseContent(examResult);
                                if (parsed) {
                                    updateSectionById(sec.id, { material: materialResult, exam: parsed.exam, answer: parsed.answer });
                                } else {
                                    updateSectionById(sec.id, { material: materialResult, exam: examResult, answer: "AI未按格式输出，请手动分离。" });
                                }
                            }
                        }
                    } catch (err) {
                        console.error(`生成 ${sec.title} 失败:`, err);
                    }
                }

                setIsLoading(false);
                setModalType('none');
                setNotification({ type: 'success', msg: '全套试卷生成流程结束（已跳过原有内容的题型）' });
            };

            const handleOptimize = async (target) => {
                const isDeepSeek = settings.apiType === 'deepseek';
                if (isDeepSeek ? !settings.deepseekKey : (!settings.doubaoKey || !settings.doubaoEndpoint)) {
                    setNotification({ type: 'error', msg: '请先完成接口配置' });
                    setModalType('settings');
                    return;
                }

                setModalType('generating');
                setIsLoading(true);

                const basePrompt = target === 'material' ? activeData.materialPrompt : activeData.examPrompt;
                const specialRequirement = target === 'material' ? (activeData.optimizeMaterialInput || '') : (activeData.optimizeExamInput || '');
                const specialRequirementTrimmed = specialRequirement.trim();
                const finalRequirement = specialRequirementTrimmed 
                    ? `你必须同时满足以下【基础生成要求】和【此次优化的特殊要求】进行改写：\n\n【基础生成要求】：\n${basePrompt}\n\n【此次优化的特殊要求】：\n${specialRequirementTrimmed}`
                    : basePrompt;

                let prompt = '';
                if (target === 'material') {
                    setGeneratingState({ reasoning: '', content: '', type: 'material' });
                    prompt = `你是一个专业的语文老师。请根据以下要求优化改写现有的“${activeData.title}”材料内容。
【现有材料内容】：
${activeData.material}

【优化/改写要求】：
${finalRequirement}

请直接输出优化后的完整材料内容。`;
                } else {
                    setGeneratingState({ reasoning: '', content: '', type: 'exam' });
                    prompt = `你是一个专业的试题生成程序。请根据以下要求优化改写现有的试题和答案。
【阅读材料】：
${activeData.material}

【现有试题】：
${activeData.exam}

【现有答案】：
${activeData.answer}

【优化/改写要求】：
${finalRequirement}

【输出规范】：
你必须将输出内容严格分为两个部分：
[试题部分]
(优化后的完整试题)

[答案与解析部分]
(优化后的完整答案和解析)`;
                }

                const result = await handleAICall(prompt, (update) => setGeneratingState(prev => ({ ...prev, ...update })));
                
                if (result) {
                    if (target === 'material') {
                        updateSection({ material: result });
                    } else {
                        const parsed = parseContent(result);
                        if (parsed) {
                            updateSection({ exam: parsed.exam, answer: parsed.answer });
                        } else {
                            updateSection({ exam: result, answer: "AI未按格式输出，请手动分离。" });
                        }
                    }
                    if (target === 'material') {
                        updateSection({ optimizeMaterialInput: '' });
                    } else {
                        updateSection({ optimizeExamInput: '' });
                    }
                    setTimeout(() => setModalType('none'), 500);
                }
                setIsLoading(false);
            };

            const updateSectionById = (id, updates) => {
                setState(prev => ({
                    ...prev,
                    sections: {
                        ...prev.sections,
                        [id]: { ...prev.sections[id], ...updates }
                    }
                }));
            };

            const parseContent = (text) => {
                const examRegex = /(?:\[|\【||\*\*\[|\*\*【)?\s*试题部分\s*(?:\]|\】|\]\*\*|\】\*\*)?/;
                const answerRegex = /(?:\[|\【||\*\*\[|\*\*【)?\s*答案[与及]解析部分\s*(?:\]|\】|\]\*\*|\】\*\*)?/;
                let examPos = text.search(examRegex);
                let answerPos = text.search(answerRegex);

                if (answerPos === -1) {
                    const lines = text.split('\n');
                    let secondFour = -1;
                    let count = 0;
                    for(let i=0; i<lines.length; i++) {
                        if(/^4[\.．]/.test(lines[i].trim())) {
                            count++;
                            if(count === 2) { secondFour = i; break; }
                        }
                    }
                    if (secondFour !== -1) {
                        return {
                            exam: lines.slice(0, secondFour).join('\n').replace(examRegex, '').trim(),
                            answer: lines.slice(secondFour).join('\n').trim()
                        };
                    }
                }

                if (examPos !== -1 && answerPos !== -1) {
                    return {
                        exam: text.substring(examPos, answerPos).replace(examRegex, '').trim(),
                        answer: text.substring(answerPos).replace(answerRegex, '').trim()
                    };
                }
                
                if (answerPos !== -1) {
                    return {
                        exam: text.substring(0, answerPos).replace(examRegex, '').trim(),
                        answer: text.substring(answerPos).replace(answerRegex, '').trim()
                    };
                }
                return null;
            };

            useEffect(() => { localStorage.setItem('exam_gen_v4_standalone', JSON.stringify(state)); }, [state]);
            useEffect(() => { localStorage.setItem('exam_settings_v4_standalone', JSON.stringify(settings)); }, [settings]);

            const activeData = state.sections[state.activeId];

            const updateSection = (updates) => {
                setState(prev => ({
                    ...prev,
                    sections: { ...prev.sections, [prev.activeId]: { ...prev.sections[prev.activeId], ...updates } }
                }));
            };

            const handleAICall = async (fullPrompt, onUpdate) => {
                const isDeepSeek = settings.apiType === 'deepseek';
                const apiKey = isDeepSeek ? settings.deepseekKey : settings.doubaoKey;
                const endpoint = isDeepSeek 
                    ? 'https://api.deepseek.com/v1/chat/completions' 
                    : 'https://ark.cn-beijing.volces.com/api/v3/chat/completions';
                
                if (!apiKey) {
                    setNotification({ type: 'error', msg: `请先在设置中填写 ${isDeepSeek ? 'DeepSeek' : '豆包'} API Key` });
                    return 'CONFIG_MISSING';
                }

                if (!isDeepSeek && !settings.doubaoEndpoint) {
                    setNotification({ type: 'error', msg: '请先在设置中填写豆包推理接入点 ID' });
                    return 'CONFIG_MISSING';
                }

                try {
                    const response = await fetch(endpoint, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${apiKey}`
                        },
                        body: JSON.stringify({
                            model: isDeepSeek ? settings.selectedModel : settings.doubaoEndpoint,
                            messages: [
                                { role: 'system', content: '你是一个专业的教育试题生成助手。' },
                                { role: 'user', content: fullPrompt }
                            ],
                            temperature: 0.7,
                            stream: true
                        })
                    });

                    if (!response.ok) {
                        const err = await response.json();
                        throw new Error(err.error?.message || '请求失败');
                    }

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let fullContent = '';
                    let fullReasoning = '';

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;

                        const chunk = decoder.decode(value, { stream: true });
                        const lines = chunk.split('\n');
                        
                        for (const line of lines) {
                            const trimmedLine = line.trim();
                            if (trimmedLine.startsWith('data: ') && trimmedLine !== 'data: [DONE]') {
                                try {
                                    const json = JSON.parse(trimmedLine.substring(6));
                                    const delta = json.choices[0].delta;
                                    
                                    if (delta.reasoning_content) {
                                        fullReasoning += delta.reasoning_content;
                                        onUpdate({ reasoning: fullReasoning, content: fullContent });
                                    }
                                    if (delta.content) {
                                        fullContent += delta.content;
                                        onUpdate({ reasoning: fullReasoning, content: fullContent });
                                    }
                                } catch (e) {}
                            }
                        }
                    }

                    return fullContent;
                } catch (error) {
                    setNotification({ type: 'error', msg: `接口错误: ${error.message}` });
                    return null;
                }
            };

            const generateMaterial = async () => {
                if (activeData.material.trim()) {
                    setNotification({ type: 'error', msg: '材料区已有内容，请先清空后再生成' });
                    return;
                }
                if (!tempPrompt.trim()) return setNotification({ type: 'error', msg: '请输入生成材料的要求' });
                
                const isDeepSeek = settings.apiType === 'deepseek';
                if (isDeepSeek ? !settings.deepseekKey : (!settings.doubaoKey || !settings.doubaoEndpoint)) {
                    setNotification({ type: 'error', msg: '请先完成接口配置' });
                    setModalType('settings');
                    return;
                }

                setModalType('generating');
                setGeneratingState({ reasoning: '', content: '', type: 'material' });
                setIsLoading(true);

                const result = await handleAICall(
                    `请根据要求生成一篇适合“${activeData.title}”的材料：\n\n${tempPrompt}`,
                    (update) => setGeneratingState(prev => ({ ...prev, ...update }))
                );
                
                if (result === 'CONFIG_MISSING') {
                    setModalType('settings');
                } else if (result) {
                    updateSection({ material: result });
                    setTimeout(() => setModalType('none'), 500);
                } else {
                    setModalType(current => current === 'settings' ? 'settings' : 'none');
                }
                setIsLoading(false);
            };

            const generateExam = async () => {
                if (activeData.exam.trim() || activeData.answer.trim()) {
                    setNotification({ type: 'error', msg: '试题区或答案区已有内容，请先清空' });
                    return;
                }
                if (!activeData.material.trim()) return setNotification({ type: 'error', msg: '请先提供材料' });
                if (!tempPrompt.trim()) return setNotification({ type: 'error', msg: '请输入生成试题的要求' });
                
                const isDeepSeek = settings.apiType === 'deepseek';
                if (isDeepSeek ? !settings.deepseekKey : (!settings.doubaoKey || !settings.doubaoEndpoint)) {
                    setNotification({ type: 'error', msg: '请先完成接口配置' });
                    setModalType('settings');
                    return;
                }

                setModalType('generating');
                setGeneratingState({ reasoning: '', content: '', type: 'exam' });
                setIsLoading(true);

                const prompt = `你是一个专业的试题生成程序。请严格执行以下任务：

【材料内容】：
${activeData.material}

【用户生成要求】：
${tempPrompt}

【输出规范】：
你必须将输出内容严格分为两个部分。为了使程序能够识别，请务必在这两部分之前分别加上以下标记：

[试题部分]
(在这里输出你生成的4道试题内容)

[答案与解析部分]
(在这里输出对应的答案和解析)

注意：请确保标记准确无误，直接开始输出即可。`;
                
                const result = await handleAICall(
                    prompt,
                    (update) => setGeneratingState(prev => ({ ...prev, ...update }))
                );

                if (result === 'CONFIG_MISSING') {
                    setModalType('settings');
                } else if (result) {
                    const parseContent = (text) => {
                        const examRegex = /(?:\[|\【||\*\*\[|\*\*【)?\s*试题部分\s*(?:\]|\】|\]\*\*|\】\*\*)?/;
                        const answerRegex = /(?:\[|\【||\*\*\[|\*\*【)?\s*答案[与及]解析部分\s*(?:\]|\】|\]\*\*|\】\*\*)?/;
                        let examPos = text.search(examRegex);
                        let answerPos = text.search(answerRegex);

                        if (answerPos === -1) {
                            const lines = text.split('\n');
                            let secondFour = -1;
                            let count = 0;
                            for(let i=0; i<lines.length; i++) {
                                if(/^4[\.．]/.test(lines[i].trim())) {
                                    count++;
                                    if(count === 2) { secondFour = i; break; }
                                }
                            }
                            if (secondFour !== -1) {
                                return {
                                    exam: lines.slice(0, secondFour).join('\n').replace(examRegex, '').trim(),
                                    answer: lines.slice(secondFour).join('\n').trim()
                                };
                            }
                        }

                        if (examPos !== -1 && answerPos !== -1) {
                            return {
                                exam: text.substring(examPos, answerPos).replace(examRegex, '').trim(),
                                answer: text.substring(answerPos).replace(answerRegex, '').trim()
                            };
                        }
                        
                        if (answerPos !== -1) {
                            return {
                                exam: text.substring(0, answerPos).replace(examRegex, '').trim(),
                                answer: text.substring(answerPos).replace(answerRegex, '').trim()
                            };
                        }
                        return null;
                    };

                    const parsed = parseContent(result);
                    if (parsed) {
                        updateSection({ exam: parsed.exam, answer: parsed.answer });
                    } else {
                        updateSection({ exam: result, answer: "AI未按格式输出，请手动分离。" });
                    }
                    setTimeout(() => setModalType('none'), 500);
                } else {
                    setModalType(current => current === 'settings' ? 'settings' : 'none');
                }
                setIsLoading(false);
            };

            const exportData = () => {
                const promptData = {};
                // 只导入/导出提示词配置，保持轻量和安全
                Object.keys(state.sections).forEach(id => {
                    promptData[id] = {
                        title: state.sections[id].title || SECTIONS.find(s => s.id === id).title,
                        materialPrompt: state.sections[id].materialPrompt || '',
                        examPrompt: state.sections[id].examPrompt || ''
                    };
                });
                const blob = new Blob([JSON.stringify(promptData, null, 2)], { type: 'application/json' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `提示词配置备份_${new Date().toLocaleDateString()}.json`;
                link.click();
            };

            const importData = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const imported = JSON.parse(event.target.result);
                        const newSections = { ...state.sections };
                        Object.keys(imported).forEach(id => {
                            if (newSections[id]) {
                                newSections[id].title = imported[id].title || newSections[id].title;
                                newSections[id].materialPrompt = imported[id].materialPrompt || '';
                                newSections[id].examPrompt = imported[id].examPrompt || '';
                            }
                        });
                        setState(prev => ({ ...prev, sections: newSections }));
                        setNotification({ type: 'success', msg: '提示词导入成功' });
                    } catch { setNotification({ type: 'error', msg: '格式错误' }); }
                };
                reader.readAsText(file);
                e.target.value = '';
            };

            const exportToTxt = () => {
                let textContent = "==============================\n";
                textContent += "      语 文 试 卷 (全 套)\n";
                textContent += "==============================\n\n";

                let hasContent = false;
                let answerContent = "\n\n==============================\n";
                answerContent += "      参 考 答 案 与 解 析\n";
                answerContent += "==============================\n\n";

                SECTIONS.forEach((sec) => {
                    const data = state.sections[sec.id];
                    if (data.material.trim() || data.exam.trim()) {
                        hasContent = true;
                        textContent += `【${data.title || sec.title}】\n\n`;
                        
                        if (data.material.trim()) {
                            textContent += "【阅读材料】\n";
                            textContent += data.material.trim() + "\n\n";
                        }

                        if (data.exam.trim()) {
                            textContent += "【试题内容】\n";
                            textContent += data.exam.trim() + "\n\n";
                        }

                        if (data.answer.trim()) {
                            answerContent += `【${data.title || sec.title} 答案】\n`;
                            answerContent += data.answer.trim() + "\n\n";
                        }
                        
                        textContent += "------------------------------\n\n";
                    }
                });

                if (!hasContent) {
                    setNotification({ type: 'error', msg: '当前没有任何已生成的试题内容，无法生成试卷' });
                    return;
                }

                const finalContent = textContent + answerContent;
                const blob = new Blob([finalContent], { type: 'text/plain;charset=utf-8' });
                const link = document.createElement('a');
                link.href = URL.createObjectURL(blob);
                link.download = `语文试卷全套_${new Date().toLocaleDateString()}.txt`;
                link.click();
                setNotification({ type: 'success', msg: '试卷 TXT 文档导出成功' });
            };

            useEffect(() => {
                if (notification) {
                    const timer = setTimeout(() => setNotification(null), 3000);
                    return () => clearTimeout(timer);
                }
            }, [notification]);

            return (
                <div className={`flex h-screen ${colors.bg} ${colors.text} overflow-hidden relative transition-colors duration-300`}>
                    {/* Sidebar Mobile Backdrop */}
                    <AnimatePresence>
                        {isSidebarOpen && (
                            <motion.div 
                                initial={{ opacity: 0 }}
                                animate={{ opacity: 1 }}
                                exit={{ opacity: 0 }}
                                onClick={() => setIsSidebarOpen(false)}
                                className="fixed inset-0 bg-black/20 backdrop-blur-[1px] z-[40] md:hidden"
                            />
                        )}
                    </AnimatePresence>

                    {/* Sidebar */}
                    <motion.aside 
                        initial={false}
                        animate={{ 
                            x: isSidebarOpen ? 0 : (window.innerWidth < 768 ? -280 : 0),
                            width: isSidebarOpen ? 280 : (window.innerWidth < 768 ? 280 : 0)
                        }}
                        transition={{ type: 'spring', damping: 25, stiffness: 200 }}
                        className={`${colors.sidebar} ${colors.border} border-r flex flex-col fixed md:relative h-full z-[50] shadow-xl md:shadow-none overflow-hidden transition-colors duration-300`}
                    >
                        <div className="w-[280px] h-full flex flex-col shrink-0">
                            <div className={`p-6 flex items-center justify-between border-b ${colors.border}`}>
                                <h1 className={`font-bold text-xl ${colors.text}`}>试题生成助手</h1>
                                <div className="flex gap-2">
                                    <button 
                                        onClick={() => setIsDarkMode(!isDarkMode)} 
                                        className={`p-2 rounded-lg transition-all ${isDarkMode ? 'text-[#c5a059] hover:text-[#e5c079]' : 'text-[#a8a095] hover:text-[#5c7a5c]'} hover:scale-110`}
                                        title={isDarkMode ? "切换到白天模式" : "切换到黑夜模式"}
                                    >
                                        <Icon name={isDarkMode ? "sun" : "moon"} size={18} />
                                    </button>
                                    <button onClick={() => setModalType('settings')} className={`p-2 ${colors.textMuted} hover:text-[#5c7a5c] hover:scale-110 transition-all`} title="接口设置"><Icon name="settings" /></button>
                                    <button onClick={() => setIsSidebarOpen(false)} className={`p-2 ${colors.textMuted} hover:text-[#a65d5d] md:hidden`}><Icon name="x" /></button>
                                </div>

                                >
                                    <Icon name="list" size={13} />
                                    试题分类
                                </button>
                                <button 
                                    onClick={() => setSidebarTab('archive')} 
                                    className={`flex-1 py-3 text-xs font-bold text-center transition-all flex items-center justify-center gap-1.5 ${sidebarTab === 'archive' ? (isDarkMode ? 'bg-[#2d3136] text-[#c5a059] border-b-2 border-[#c5a059]' : 'bg-[#ece7e0] text-[#3a3530]') : colors.textMuted + ' hover:opacity-85'}`}
                                >
                                    <Icon name="archive" size={13} />
                                    存档与拼卷
                                    {(state.archives || []).length > 0 && (
                                        <span className="ml-1 px-1.5 py-0.5 bg-red-500 text-white rounded-full text-[9px] font-black scale-90">
                                            {(state.archives || []).length}
                                        </span>
                                    )}
                                </button>
                            </div>

                            {sidebarTab === 'index' ? (
                                <>
                                    <div className="px-3 mt-6 mb-2 shrink-0">

                                            <label className={`flex-1 py-2 ${colors.textMuted} ${isDarkMode ? 'hover:bg-white/5' : 'hover:bg-[#f8f6f2]'} rounded-lg border ${colors.border} flex items-center justify-center gap-1 cursor-pointer`}>导入提示词<input type="file" onChange={importData} className="hidden" /></label>

                                                    <span>{filteredArchives.length > 0 && filteredArchives.every(item => selectedArchiveIds.includes(item.id)) ? "取消全选" : "全选当前"}</span>

                                                        }
                                                    }} 
                                                    className={`w-full h-[60vh] p-6 ${colors.input} border ${colors.border} rounded-2xl resize-none font-medium ${colors.text} placeholder:${colors.textMuted} outline-none focus:border-[#a8a095] transition-all`} 
                                                    placeholder="输入生成指令..." 
                                                    autoFocus 
                                                />
                                                <div className="flex gap-4 mt-6">
                                                    <button onClick={() => setModalType('none')} className={`flex-1 py-3 ${colors.textMuted} font-bold rounded-xl hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors`}>取消</button>
                                                    <button onClick={modalType.includes('material') ? generateMaterial : generateExam} className="flex-1 py-3 bg-[#5c7a5c] text-white font-bold rounded-xl hover:bg-[#526a52] transition-all">确认并执行</button>
                                                </div>
                                            </div>
                                        )}
                                        {modalType === 'generating' && (
                                            <div className={`p-8 w-full max-w-5xl h-[85vh] flex flex-col ${colors.card}`}>
                                                <div className="flex items-center justify-between mb-8">
                                                    <div className="flex items-center gap-4">
                                                        <div className="w-12 h-12 bg-[#5c7a5c] rounded-2xl flex items-center justify-center text-white animate-pulse shadow-sm shadow-[#5c7a5c]/20">
                                                            <Icon name="sparkles" size={24} />
                                                        </div>
                                                        <div>
                                                            <h3 className={`text-xl font-bold ${colors.text}`}>正在为您生成...</h3>
                                                            <p className={`text-[10px] ${colors.textMuted} font-bold uppercase tracking-[0.2em]`}>{settings.apiType === 'deepseek' ? 'DeepSeek' : 'Doubao AI'} 实时处理中</p>
                                                        </div>
                                                    </div>
                                                    <div className={`px-5 py-2 ${isDarkMode ? 'bg-[#2d3136] text-[#c5a059]' : 'bg-[#f5f8f5] text-[#5c7a5c]'} rounded-full text-[10px] font-black flex items-center gap-2 border ${isDarkMode ? 'border-[#c5a059]/20' : 'border-[#5c7a5c]/10'}`}>
                                                        <div className={`w-1.5 h-1.5 ${isDarkMode ? 'bg-[#c5a059]' : 'bg-[#5c7a5c]'} rounded-full animate-ping`} />
                                                        正在生成中...
                                                    </div>
                                                </div>

                                                <div className="flex-1 grid grid-cols-1 lg:grid-cols-2 gap-8 min-h-0">
                                                    {/* Reasoning Section */}
                                                    <div className={`flex flex-col ${colors.input} rounded-2xl border ${colors.border} overflow-hidden`}>
                                                        <div className={`px-4 py-3 border-b ${colors.border} flex items-center gap-2 ${isDarkMode ? 'bg-black/20' : 'bg-[#fdfbf7]/50'}`}>
                                                            <Icon name="brain" size={14} className="text-[#c5a059]" />
                                                            <span className={`text-[10px] font-black ${colors.textMuted} uppercase tracking-widest`}>思考逻辑 (Reasoning)</span>
                                                        </div>
                                                        <div className={`flex-1 p-6 overflow-y-auto text-sm ${isDarkMode ? 'text-gray-400' : 'text-[#8a8075]'} italic leading-relaxed font-serif`}>
                                                            {generatingState.reasoning || "正在思考..."}
                                                            {!generatingState.content && <span className="inline-block w-1 h-4 bg-[#c5a059] ml-1 animate-pulse" />}
                                                        </div>
                                                    </div>

                                                    {/* Content Section */}
                                                    <div className={`flex flex-col ${isDarkMode ? 'bg-[#1a1c1e]' : 'bg-[#f5f8fa]'} rounded-2xl border ${isDarkMode ? 'border-[#2d3136]' : 'border-[#e8eff2]'} overflow-hidden`}>
                                                        <div className={`px-4 py-3 border-b ${isDarkMode ? 'border-[#2d3136]' : 'border-[#e8eff2]'} flex items-center gap-2 ${isDarkMode ? 'bg-black/20' : 'bg-white/50'}`}>
                                                            <Icon name="file-text" size={14} className="text-[#4a6a78]" />
                                                            <span className={`text-[10px] font-black ${isDarkMode ? 'text-gray-500' : 'text-[#8a9aa5]'} uppercase tracking-widest`}>生成内容 (Content)</span>
                                                        </div>
                                                        <div className={`flex-1 p-6 overflow-y-auto text-[15px] ${colors.text} leading-relaxed font-medium whitespace-pre-wrap`}>
                                                            {generatingState.content || "等待生成..."}
                                                            {generatingState.content && <span className="inline-block w-1 h-4 bg-[#4a6a78] ml-1 animate-pulse" />}
                                                        </div>
                                                    </div>
                                                </div>
                                                
                                                <div className="mt-6 flex justify-end">
                                                    <p className="text-[10px] text-[#d8d0c5] font-bold italic">💡 生成完成后将自动保存。</p>
                                                </div>
                                            </div>
                                        )}
                                        {(modalType === 'optimize_material' || modalType === 'optimize_exam') && (
                                            <div className="p-8">
                                                <div className="flex items-center gap-4 mb-8">
                                                    <div className={`w-14 h-14 rounded-2xl flex items-center justify-center ${modalType === 'optimize_material' ? (isDarkMode ? 'bg-[#2d3d2d] text-[#c5a059]' : 'bg-[#f5f8f5] text-[#5c7a5c]') : (isDarkMode ? 'bg-[#24343a] text-[#c5a059]' : 'bg-[#f5f8fa] text-[#4a6a78]')}`}>
                                                        <Icon name="wand" size={28} />
                                                    </div>
                                                    <div>
                                                        <h3 className={`text-xl font-bold ${colors.text}`}>
                                                            {modalType === 'optimize_material' ? '优化材料内容' : '优化试题与答案'}
                                                        </h3>
                                                        <p className={`text-sm ${colors.textMuted} font-medium mt-1`}>请输入您的具体修改或优化要求，由 AI 进行相应调整</p>
                                                    </div>
                                                </div>
                                                
                                                <div className={`${colors.input} rounded-3xl p-1 mb-8 border ${colors.border}`}>
                                                    <textarea 
                                                        className={`w-full h-48 p-6 bg-transparent text-[15px] ${colors.text} font-medium placeholder:${colors.textMuted} outline-none`}
                                                        placeholder="例如：请缩减篇幅、修改措辞、或者增加特定考点的题目..."
                                                        value={modalType === 'optimize_material' ? (activeData.optimizeMaterialInput || '') : (activeData.optimizeExamInput || '')}
                                                        onChange={e => {
                                                            if (modalType === 'optimize_material') {
                                                                updateSection({ optimizeMaterialInput: e.target.value });
                                                            } else {
                                                                updateSection({ optimizeExamInput: e.target.value });
                                                            }
                                                        }}
                                                        autoFocus
                                                    />
                                                </div>

                                                <div className="flex gap-4">
                                                    <button onClick={() => setModalType('none')} className={`px-10 py-4 ${colors.textMuted} font-bold hover:bg-gray-100 dark:hover:bg-gray-800 rounded-2xl transition-all`}>取消</button>
                                                    <button 
                                                        onClick={() => handleOptimize(modalType === 'optimize_material' ? 'material' : 'exam')}
                                                        className={`flex-1 py-4 text-white font-bold rounded-2xl shadow-lg transition-all active:scale-95 ${modalType === 'optimize_material' ? 'bg-[#5c7a5c] hover:bg-[#526a52] shadow-[#5c7a5c]/20' : 'bg-[#4a6a78] hover:bg-[#3a5666] shadow-[#4a6a78]/20'}`}
                                                    >
                                                        确定并开始优化
                                                    </button>
                                                </div>
                                            </div>
                                        )}

                                        {modalType === 'generate_all_confirm' && (
                                            <div className={`p-10 text-center ${colors.text}`}>
                                                <div className={`w-20 h-20 ${isDarkMode ? 'bg-[#24343a] text-[#c5a059]' : 'bg-[#f5f8fa] text-[#4a6a78]'} rounded-3xl flex items-center justify-center mx-auto mb-6`}><Icon name="sparkles" size={40} /></div>
                                                <h3 className="text-2xl font-bold mb-3">确认开始全套生成？</h3>
                                                <p className={`${colors.textMuted} mb-8 font-medium text-sm leading-relaxed max-w-md mx-auto`}>系统将按目录顺序依次生成所有<span className="text-[#4a6a78] font-bold underline decoration-dotted">尚未完成</span>的试题。此过程请勿关闭窗口。</p>
                                                <div className="flex gap-4 max-w-sm mx-auto">
                                                    <button onClick={() => setModalType('none')} className={`flex-1 py-3.5 ${colors.input} ${colors.textMuted} rounded-2xl font-bold transition-colors hover:brightness-95`}>取消</button>
                                                    <button 
                                                        onClick={startGenerateAll} 
                                                        className="flex-1 py-3.5 bg-[#4a6a78] text-white rounded-2xl font-bold shadow-lg shadow-[#4a6a78]/20 transition-all hover:bg-[#3a5666] active:scale-95"
                                                    >立即开始</button>
                                                </div>
                                            </div>
                                        )}

                                        {modalType === 'clear_confirm' && (
                                            <div className={`p-10 text-center ${colors.text}`}>
                                                <div className={`w-20 h-20 ${isDarkMode ? 'bg-red-900/20 text-red-400' : 'bg-red-50 text-red-500'} rounded-3xl flex items-center justify-center mx-auto mb-6`}><Icon name="rotate-ccw" size={40} /></div>
                                                <h3 className="text-2xl font-bold mb-3">确认清空内容？</h3>
                                                <p className={`${colors.textMuted} mb-8 font-medium text-sm leading-relaxed`}>确定要清空 <span className="text-red-500 font-bold underline underline-offset-4">{confirmClearInfo.label}</span> 吗？<br/>此操作无法找回，请谨慎操作。</p>
                                                <div className="flex gap-4 max-w-sm mx-auto">
                                                    <button onClick={() => setModalType('none')} className={`flex-1 py-3.5 ${colors.input} ${colors.textMuted} rounded-2xl font-bold transition-colors hover:brightness-95`}>取消</button>
                                                    <button 
                                                        onClick={() => { 
                                                            if (confirmClearInfo.target === 'global_all') {
                                                                setState(prev => {
                                                                    const newSections = { ...prev.sections };
                                                                    Object.keys(newSections).forEach(id => {
                                                                        newSections[id] = {
                                                                            ...newSections[id],
                                                                            material: '',
                                                                            exam: '',
                                                                            answer: ''
                                                                        };
                                                                    });
                                                                    return { ...prev, sections: newSections };
                                                                });
                                                            } else if (confirmClearInfo.target === 'all') {
                                                                updateSection({ material: '', exam: '', answer: '' });
                                                            } else {
                                                                updateSection({ [confirmClearInfo.target]: '' });
                                                            }
                                                            setModalType('none'); 
                                                            setNotification({ type: 'success', msg: '已成功清空内容' });
                                                        }} 
                                                        className="flex-1 py-3.5 bg-red-600 text-white rounded-2xl font-bold shadow-lg shadow-red-100 transition-all hover:bg-red-700 active:scale-95"
                                                    >确认清空</button>
                                                </div>
                                            </div>
                                        )}

                                        {modalType === 'confirm_delete_used' && (
                                            <div className={`p-10 text-center ${colors.text}`}>
                                                <div className={`w-20 h-20 ${isDarkMode ? 'bg-red-900/20 text-red-400' : 'bg-red-50 text-red-500'} rounded-3xl flex items-center justify-center mx-auto mb-6`}><Icon name="alert-triangle" size={40} /></div>
                                                <h3 className="text-2xl font-bold mb-3">确认删除所有已使用存档？</h3>
                                                <p className={`${colors.textMuted} mb-8 font-medium text-sm leading-relaxed max-w-md mx-auto`}>您确定要清除所有已被勾选并成功进行过“拼卷导出”（标记为<strong>【已使用】</strong>）的试卷存档吗？此操作无法恢复，请谨慎操作。</p>
                                                <div className="flex gap-4 max-w-sm mx-auto">
                                                    <button onClick={() => setModalType('none')} className={`flex-1 py-3.5 ${colors.input} ${colors.textMuted} rounded-2xl font-bold transition-colors hover:brightness-95`}>取消</button>
                                                    <button 
                                                        onClick={deleteUsedArchives} 
                                                        className="flex-1 py-3.5 bg-red-600 text-white rounded-2xl font-bold shadow-lg shadow-red-100 transition-all hover:bg-red-700 active:scale-95"
                                                    >确认删除</button>
                                                </div>
                                            </div>
                                        )}

                                        {modalType === 'confirm_delete_single_archive' && archiveToDelete && (
                                            <div className={`p-10 text-center ${colors.text}`}>
                                                <div className={`w-20 h-20 ${isDarkMode ? 'bg-red-900/20 text-red-400' : 'bg-red-50 text-red-500'} rounded-3xl flex items-center justify-center mx-auto mb-6`}><Icon name="trash-2" size={40} /></div>
                                                <h3 className="text-2xl font-bold mb-3">确认删除该试题记录？</h3>
                                                <p className={`${colors.textMuted} mb-8 font-medium text-sm leading-relaxed max-w-md mx-auto`}>确定要将类别为 <strong>【{archiveToDelete.sectionTitle}】</strong> 下的单条试卷存档从数据库中移除吗？此操作不可逆。</p>
                                                <div className="flex gap-4 max-w-sm mx-auto">
                                                    <button onClick={() => { setModalType('none'); setArchiveToDelete(null); }} className={`flex-1 py-3.5 ${colors.input} ${colors.textMuted} rounded-2xl font-bold transition-colors hover:brightness-95`}>取消</button>
                                                    <button 
                                                        onClick={() => deleteSingleArchive(archiveToDelete.id)} 
                                                        className="flex-1 py-3.5 bg-red-600 text-white rounded-2xl font-bold shadow-lg shadow-red-100 transition-all hover:bg-red-700 active:scale-95"
                                                    >确认删除</button>
                                                </div>
                                            </div>
                                        )}

                                        {modalType === 'view_archive_details' && viewingArchive && (
                                            <div className={`p-6 md:p-8 w-full max-w-5xl h-[85vh] flex flex-col ${colors.card}`}>
                                                <div className="flex items-center justify-between mb-6 shrink-0">
                                                    <div className="flex items-center gap-3">
                                                        <span className="px-2.5 py-1 rounded-lg text-xs font-black tracking-wider uppercase bg-[#ece7e0] text-[#3a3530] dark:bg-gray-800 dark:text-gray-300">
                                                            {viewingArchive.sectionTitle}
                                                        </span>
                                                        <h3 className={`text-lg md:text-xl font-bold ${colors.text}`}>存档详细查看</h3>
                                                        <span className={`text-[10px] md:text-xs ${colors.textMuted} hidden sm:inline`}>
                                                            存档时间：{new Date(viewingArchive.timestamp).toLocaleString()}
                                                        </span>
                                                    </div>
                                                    <button 
                                                        onClick={() => { setModalType('none'); setViewingArchive(null); }}
                                                        className={`p-2 rounded-lg ${colors.textMuted} hover:bg-red-50 dark:hover:bg-red-950/20 hover:text-red-500 transition-all`}
                                                        title="关闭"
                                                    >
                                                        <Icon name="x" size={18} />
                                                    </button>
                                                </div>

                                                <div className="flex-1 grid grid-cols-1 md:grid-cols-3 gap-4 min-h-0 overflow-y-auto pb-4">
                                                    {/* Material Panel */}
                                                    <div className={`p-4 rounded-2xl border ${colors.border} ${colors.input} flex flex-col h-[30vh] md:h-full`}>
                                                        <span className={`text-[11px] font-black tracking-[0.1em] text-amber-600 dark:text-amber-500 uppercase mb-3 block`}>材料内容 (Material)</span>
                                                        <div className={`flex-1 overflow-y-auto text-sm leading-relaxed ${colors.text} whitespace-pre-wrap select-all bg-white/20 dark:bg-black/10 p-3 rounded-xl border border-dashed ${colors.border} font-mono`}>
                                                            {viewingArchive.material || "暂无材料内容"}
                                                        </div>
                                                    </div>

                                                    {/* Exam Panel */}
                                                    <div className={`p-4 rounded-2xl border ${colors.border} ${colors.input} flex flex-col h-[30vh] md:h-full`}>
                                                        <span className={`text-[11px] font-black tracking-[0.1em] text-blue-600 dark:text-blue-400 uppercase mb-3 block`}>试题内容 (Exam)</span>
                                                        <div className={`flex-1 overflow-y-auto text-sm leading-relaxed ${colors.text} whitespace-pre-wrap select-all bg-white/20 dark:bg-black/10 p-3 rounded-xl border border-dashed ${colors.border} font-mono`}>
                                                            {viewingArchive.exam || "暂无试题内容"}
                                                        </div>
                                                    </div>

                                                    {/* Answer Panel */}
                                                    <div className={`p-4 rounded-2xl border ${colors.border} ${colors.input} flex flex-col h-[30vh] md:h-full`}>
                                                        <span className={`text-[11px] font-black tracking-[0.1em] text-emerald-600 dark:text-emerald-500 uppercase mb-3 block`}>答案解析 (Answer & Analysis)</span>
                                                        <div className={`flex-1 overflow-y-auto text-sm leading-relaxed ${colors.text} whitespace-pre-wrap select-all bg-white/20 dark:bg-black/10 p-3 rounded-xl border border-dashed ${colors.border} font-mono`}>
                                                            {viewingArchive.answer || "暂无答案与解析内容"}
                                                        </div>
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between mt-4 border-t pt-4 shrink-0">
                                                    <div className="flex gap-2">
                                                        <button 
                                                            onClick={() => restoreArchive(viewingArchive)}
                                                            className={`px-4 py-2 bg-[#4a6a78] text-white font-bold rounded-xl text-xs flex items-center gap-1 hover:bg-[#3a5a68] transition-all`}
                                                        >
                                                            <Icon name="folder-up" size={14} />
                                                            恢复至编辑区
                                                        </button>
                                                        <button 
                                                            onClick={() => exportSingleArchive(viewingArchive)}
                                                            className={`px-4 py-2 border ${colors.border} ${colors.textMuted} hover:text-[#5c7a5c] font-bold rounded-xl text-xs flex items-center gap-1 hover:bg-gray-50 dark:hover:bg-gray-800 transition-all`}
                                                        >
                                                            <Icon name="download" size={14} />
                                                            导出单个 (TXT)
                                                        </button>
                                                    </div>
                                                    <button 
                                                        onClick={() => { setModalType('none'); setViewingArchive(null); }}
                                                        className={`px-4 py-2 ${colors.input} ${colors.text} hover:bg-gray-100 dark:hover:bg-gray-800 font-bold rounded-xl text-xs transition-colors`}
                                                    >
                                                        关闭窗口
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                </div>
                            </div>
                        )}

                        {/* Notification */ }
                        <AnimatePresence>
                            {notification && (
                                <motion.div initial={{ y: 50, opacity: 0 }} animate={{ y: 0, opacity: 1 }} exit={{ y: 50, opacity: 0 }} className={`fixed bottom-12 left-1/2 -translate-x-1/2 px-8 py-3.5 rounded-full shadow-2xl z-[150] flex items-center gap-3 font-bold ${colors.card} border ${notification.type === 'error' ? (isDarkMode ? 'text-red-400 border-red-900/30 bg-red-900/10' : 'text-red-600 border-red-50') : (isDarkMode ? 'text-[#c5a059] border-[#c5a059]/20 bg-[#c5a059]/10' : 'text-[#5c7a5c] border-[#f5f8f5]')}`}>
                                    <Icon name={notification.type === 'error' ? "alert-circle" : "check-circle"} size={18} />
                                    <span>{notification.msg}</span>
                                    <button onClick={() => setNotification(null)} className={`ml-4 ${colors.textMuted} hover:text-[#5c7a5c]`}><Icon name="x" size={14} /></button>
                                </motion.div>
                            )}
                        </AnimatePresence>
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
