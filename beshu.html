<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>班级背书进度管理</title>
<style>
:root{
  --bg:#f4f1ea; --bg-soft:#ece7db; --card:#fffdf9;
  --primary:#3a5a78; --primary-dark:#2c455c; --accent:#b8472f;
  --green:#5a7d5a; --text:#2b2b2b; --muted:#8a8578;
  --border:#ddd6c8; --radius:10px;
  --serif:"KaiTi","STKaiti","SimSun","Songti SC","Noto Serif SC",serif;
  --sans:"PingFang SC","Microsoft YaHei","Hiragino Sans GB",sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--sans);background:var(--bg);color:var(--text);min-height:100vh;
  background-image:radial-gradient(circle at 12% 8%,rgba(58,90,120,.05),transparent 42%),radial-gradient(circle at 88% 92%,rgba(184,71,47,.05),transparent 42%)}
.container{max-width:1100px;margin:0 auto;padding:16px}
header{display:flex;align-items:center;justify-content:space-between;padding:14px 0 18px;flex-wrap:wrap;gap:10px;border-bottom:2px solid var(--border);position:relative}
header::after{content:"";position:absolute;left:0;bottom:-2px;width:180px;height:3px;background:var(--accent)}
header h1{font-family:var(--serif);font-size:24px;letter-spacing:3px;font-weight:700;color:var(--accent)}
.hdr-btns{display:flex;gap:8px}
.tabs{display:flex;gap:6px;margin:16px 0;background:var(--card);padding:5px;border-radius:var(--radius);border:1px solid var(--border);flex-wrap:wrap}
.tab{flex:1;min-width:110px;padding:10px;text-align:center;border-radius:7px;cursor:pointer;font-size:15px;color:var(--muted);transition:.2s;font-family:var(--serif);letter-spacing:1px}
.tab.active{background:var(--primary);color:#fff;font-weight:600}
.card{background:var(--card);border-radius:var(--radius);padding:16px;margin-bottom:14px;border:1px solid var(--border);box-shadow:0 2px 8px rgba(43,43,43,.04)}
.card h3{font-family:var(--serif);font-size:17px;margin-bottom:12px;letter-spacing:1px;position:relative;padding-left:12px}
.card h3::before{content:"";position:absolute;left:0;top:2px;bottom:2px;width:3px;background:var(--accent);border-radius:2px}
.btn{display:inline-block;padding:9px 18px;border:none;border-radius:7px;background:var(--primary);color:#fff;font-size:14px;cursor:pointer;transition:.2s;white-space:nowrap;font-family:var(--sans)}
.btn:hover{background:var(--primary-dark)}
.btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--border)}
.btn.ghost:hover{color:var(--primary);border-color:var(--primary)}
.btn.green{background:var(--green)}
.btn.red{background:var(--accent)}
.btn.sm{padding:5px 12px;font-size:13px}
input,textarea,select{width:100%;padding:10px;border:1px solid var(--border);border-radius:7px;font-size:14px;font-family:inherit;background:#fff}
input:focus,textarea:focus,select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px rgba(58,90,120,.12)}
textarea{min-height:90px;resize:vertical}
label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.row{display:flex;gap:10px;flex-wrap:wrap}
.row>*{flex:1;min-width:140px}
.empty{text-align:center;color:var(--muted);padding:26px;font-size:14px}
.hidden{display:none}
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--text);color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;z-index:99;opacity:0;transition:.3s;pointer-events:none}
.toast.show{opacity:1}
/* 班级选择 */
.class-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.class-chip{padding:8px 16px;border-radius:20px;background:var(--card);border:1px solid var(--border);cursor:pointer;font-size:14px;transition:.2s}
.class-chip:hover{border-color:var(--primary)}
.class-chip.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 学生列表 */
.student-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.student-chip{display:flex;align-items:center;justify-content:space-between;gap:6px;padding:8px 12px;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;font-size:14px}
.student-chip .del{cursor:pointer;color:var(--muted);font-size:16px;padding:0 4px}
.student-chip .del:hover{color:var(--accent)}
.student-chip .exp{cursor:pointer;font-size:12px;color:var(--primary);white-space:nowrap;padding:2px 8px;border:1px solid var(--border);border-radius:5px;background:var(--card);transition:.2s}
.student-chip .exp:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 进度表 */
.table-wrap{overflow-x:auto}
table.grid{border-collapse:collapse;width:100%;font-size:14px}
table.grid th,table.grid td{border:1px solid var(--border);padding:6px 8px;text-align:center}
table.grid th{background:var(--bg-soft);font-weight:600;position:sticky;top:0;font-family:var(--serif)}
table.grid td.student{text-align:left;font-weight:600;white-space:nowrap;position:sticky;left:0;background:var(--card);z-index:1}
.mini-exp{cursor:pointer;font-size:12px;color:var(--primary);margin-left:6px;padding:1px 7px;border:1px solid var(--border);border-radius:5px;background:var(--bg-soft);vertical-align:middle}
.mini-exp:hover{background:var(--primary);color:#fff;border-color:var(--primary)}
.cell{cursor:pointer;user-select:none;min-width:52px;font-weight:700;transition:.15s}
.cell:hover{outline:2px solid var(--primary);outline-offset:-2px}
.cell.s0{color:#b0a99a;background:#f7f4ee}
.cell.s1{color:#8f2f1c;background:#f3d9d0}
.cell.s2{color:#9a5a1e;background:#f6e4c8}
.cell.s3{color:#8a6d1a;background:#f2ecc4}
.cell.s4{color:#3d5a3d;background:#dce8d5}
.cell.s5{color:#fff;background:var(--green)}
.legend{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:10px;font-size:13px;color:var(--muted);align-items:center}
.legend .sw{display:inline-block;width:14px;height:14px;border-radius:3px;vertical-align:-2px;margin-right:4px}
/* 统计 */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:12px}
.stat{background:var(--card);border-radius:var(--radius);padding:14px;text-align:center;border:1px solid var(--border);box-shadow:0 2px 8px rgba(43,43,43,.04)}
.stat .num{font-size:28px;font-weight:700;color:var(--primary);font-family:var(--serif)}
.stat .label{font-size:13px;color:var(--muted);margin-top:4px}
.bar-wrap{background:var(--bg-soft);border-radius:6px;height:10px;overflow:hidden;margin-top:6px}
.bar{height:100%;background:var(--green);border-radius:6px;transition:width .4s}
table.stat-tbl{width:100%;border-collapse:collapse;font-size:14px}
table.stat-tbl th,table.stat-tbl td{border:1px solid var(--border);padding:8px;text-align:center}
table.stat-tbl th{background:var(--bg-soft);font-family:var(--serif)}
table.stat-tbl td.name{text-align:left;font-weight:600}
.hint{font-size:13px;color:var(--muted);margin-top:8px}
/* 评分选择器 */
.picker-mask{position:fixed;inset:0;background:rgba(43,43,43,.45);display:none;align-items:center;justify-content:center;z-index:50}
.picker-mask.show{display:flex}
.picker{background:var(--card);border-radius:var(--radius);padding:18px;width:90%;max-width:420px;border:1px solid var(--border)}
.picker-title{font-size:15px;font-weight:600;margin-bottom:14px;text-align:center;font-family:var(--serif);letter-spacing:1px}
.picker-opts{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.popt{border:none;border-radius:7px;padding:12px 4px;font-size:20px;font-weight:700;cursor:pointer;color:#fff;line-height:1.2}
.popt small{font-size:11px;font-weight:400;opacity:.9}
.popt.s0{background:#9a9384}
.popt.s1{background:#b8472f}
.popt.s2{background:#c98a3a}
.popt.s3{background:#c2a53a}
.popt.s4{background:#6f9a6f}
.popt.s5{background:var(--green)}
/* 标签 chip */
.tag-chip{display:inline-block;padding:2px 10px;border-radius:20px;background:var(--bg-soft);border:1px solid var(--border);font-size:12px;color:var(--muted);white-space:nowrap}
/* 标签筛选条 */
.tagbar{display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:12px;padding:10px 12px;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px}
.tagbar-label{font-size:13px;color:var(--muted);margin-right:4px;font-family:var(--serif)}
.tagfilter{border:1px solid var(--border);background:var(--card);padding:5px 12px;border-radius:20px;font-size:13px;cursor:pointer;color:var(--text);transition:.2s;white-space:nowrap}
.tagfilter:hover{border-color:var(--primary);color:var(--primary)}
.tagfilter.active{background:var(--primary);color:#fff;border-color:var(--primary)}
/* 应用内弹窗 */
.modal-mask{position:fixed;inset:0;background:rgba(43,43,43,.45);display:none;align-items:center;justify-content:center;z-index:60}
.modal-mask.show{display:flex}
.modal-box{background:var(--card);border-radius:var(--radius);padding:20px;width:90%;max-width:440px;border:1px solid var(--border);box-shadow:0 8px 30px rgba(0,0,0,.15)}
.modal-box h3{font-family:var(--serif);font-size:17px;margin-bottom:12px;letter-spacing:1px}
.modal-box .mbody{font-size:14px;color:var(--text);line-height:1.7;margin-bottom:16px}
.modal-box .mfoot{display:flex;gap:10px;justify-content:flex-end}
.modal-box label{margin-bottom:4px}
.modal-box input,.modal-box textarea{margin-bottom:10px}
/* 模式切换 */
.mode-toggle{display:inline-flex;background:var(--bg-soft);border:1px solid var(--border);border-radius:8px;padding:3px}
.mode-btn{border:none;background:transparent;padding:7px 14px;font-size:13px;cursor:pointer;color:var(--muted);border-radius:6px;transition:.2s;font-family:var(--sans)}
.mode-btn.active{background:var(--primary);color:#fff}
/* 分页 */
.pager{display:flex;gap:6px;align-items:center;justify-content:center;margin-top:12px;flex-wrap:wrap}
.pager button{border:1px solid var(--border);background:var(--card);padding:6px 12px;border-radius:6px;cursor:pointer;font-size:13px}
.pager button.active{background:var(--primary);color:#fff;border-color:var(--primary)}
.pager button:disabled{opacity:.4;cursor:not-allowed}
.pager .info{font-size:13px;color:var(--muted);margin:0 6px}
/* 单课文打分 */
.single-text-bar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.single-text-bar select{max-width:280px}
.single-list{display:flex;flex-direction:column;gap:8px}
.single-row{display:flex;align-items:center;gap:10px;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg-soft)}
.single-row .sname{flex:1;font-weight:600;font-size:15px}
.single-row .stars{display:flex;gap:4px}
.single-row .star{width:38px;height:38px;border:none;border-radius:7px;font-size:18px;font-weight:700;cursor:pointer;color:#fff;transition:.15s}
.single-row .star.s0{background:#9a9384}
.single-row .star.s1{background:#b8472f}
.single-row .star.s2{background:#c98a3a}
.single-row .star.s3{background:#c2a53a}
.single-row .star.s4{background:#6f9a6f}
.single-row .star.s5{background:var(--green)}
.single-row .star.off{opacity:.35}
/* 进度表表头/整行 */
table.grid th.colhead{cursor:pointer}
table.grid th.colhead:hover{background:#e2ddd0}
table.grid td.rowall{cursor:pointer;font-weight:700;color:var(--primary);background:var(--bg-soft)}
table.grid td.rowall:hover{background:#e2ddd0}
/* ===== 响应式 ===== */
@media (max-width:768px){
  .container{padding:10px}
  header h1{font-size:20px}
  .tabs{gap:4px;padding:4px}
  .tab{min-width:0;padding:8px 4px;font-size:13px}
  .card{padding:12px}
  .row>*{min-width:100%}
  .stats-grid{grid-template-columns:repeat(2,1fr)}
  .stat .num{font-size:22px}
  .student-grid{grid-template-columns:repeat(auto-fill,minmax(130px,1fr))}
  .picker-opts{grid-template-columns:repeat(3,1fr)}
  .hdr-btns .btn{padding:7px 10px;font-size:12px}
}
@media (max-width:480px){
  .tab{font-size:12px;padding:7px 2px}
  .picker-opts{grid-template-columns:repeat(3,1fr)}
  .popt{font-size:18px;padding:10px 2px}
}
</style>
</head>
<body>
<div class="container">
<header>
  <h1>班级背书<span>进度管理</span></h1>
  <div class="hdr-btns">
    <button class="btn ghost sm" onclick="exportData()">导出备份</button>
    <button class="btn ghost sm" onclick="document.getElementById('import-file').click()">导入</button>
    <input type="file" id="import-file" accept=".json" style="display:none" onchange="importData(event)">
  </div>
</header>

<div class="tabs">
  <div class="tab active" data-tab="progress" onclick="switchTab('progress')">进度记录</div>
  <div class="tab" data-tab="students" onclick="switchTab('students')">班级与学生</div>
  <div class="tab" data-tab="texts" onclick="switchTab('texts')">课文清单</div>
  <div class="tab" data-tab="stats" onclick="switchTab('stats')">统计</div>
  <div class="tab" data-tab="log" onclick="switchTab('log')">操作日志</div>
</div>

<!-- 进度记录 -->
<div id="page-progress">
  <div class="class-bar" id="class-bar"></div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <h3 style="margin:0">进度记录（点击打分：0 未开始 → 5 满分）</h3>
      <div style="display:flex;gap:8px;flex-wrap:wrap">
        <button class="btn sm" onclick="exportCSV()">导出 Excel</button>
        <button class="btn sm" onclick="exportAllCSV()">导出全部班级</button>
        <button class="btn sm ghost" onclick="printTable()">打印</button>
      </div>
    </div>
    <div style="display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;align-items:center">
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-grid" onclick="setMode('grid')">全班总表</button>
        <button class="mode-btn" id="mode-single" onclick="setMode('single')">单课文打分</button>
      </div>
      <input id="text-search" placeholder="搜索课文…" style="max-width:220px;margin:0" oninput="onSearch()">
    </div>
    <div class="tagbar" id="tagbar-progress"></div>
    <div class="legend">
      <span><span class="sw" style="background:#f7f4ee;border:1px solid #ddd"></span>0 未开始</span>
      <span><span class="sw" style="background:#f3d9d0"></span>1</span>
      <span><span class="sw" style="background:#f6e4c8"></span>2</span>
      <span><span class="sw" style="background:#f2ecc4"></span>3</span>
      <span><span class="sw" style="background:#dce8d5"></span>4</span>
      <span><span class="sw" style="background:#5a7d5a"></span>5 满分</span>
    </div>
    <div id="progress-area"></div>
  </div>
</div>

<!-- 班级与学生 -->
<div id="page-students" class="hidden">
  <div class="card">
    <h3>添加班级</h3>
    <div class="row">
      <div style="flex:2"><input id="new-class" placeholder="如：初一(3)班"></div>
      <div style="flex:0;min-width:auto"><button class="btn" onclick="addClass()">添加</button></div>
    </div>
  </div>
  <div class="card">
    <h3>班级列表</h3>
    <div id="class-list"></div>
  </div>
  <div class="card" id="student-edit-card" style="display:none">
    <h3 id="student-edit-title">管理学生</h3>
    <label>批量添加（每行一个名字，或用逗号/空格分隔）</label>
    <textarea id="bulk-students" placeholder="张三&#10;李四&#10;王五"></textarea>
    <button class="btn" onclick="addStudents()">添加学生</button>
    <div style="margin-top:14px">
      <div class="student-grid" id="student-grid"></div>
    </div>
  </div>
</div>

<!-- 课文清单 -->
<div id="page-texts" class="hidden">
  <div class="card">
    <h3>添加课文</h3>
    <div class="row">
      <div style="flex:2"><label>课文标题</label><input id="new-text" placeholder="如：《岳阳楼记》"></div>
      <div style="flex:1"><label>标签（可多个，用逗号/空格分隔）</label><input id="new-text-tags" placeholder="如：九上 第三单元 文言文"></div>
      <div style="flex:0;min-width:auto;align-self:flex-end"><button class="btn" onclick="addText()">添加</button></div>
    </div>
    <div class="hint">课文对所有班级通用。一篇课文可打多个标签（如年级、单元、体裁），清单与下拉框按首个标签分组。</div>
  </div>
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <h3 style="margin:0">课文清单</h3>
      <button class="btn sm ghost" onclick="presetTexts()">预置统编版初中必背课文</button>
    </div>
    <div class="tagbar" id="tagbar-texts"></div>
    <div id="text-list"></div>
  </div>
</div>

<!-- 统计 -->
<div id="page-stats" class="hidden">
  <div class="class-bar" id="class-bar-stats"></div>
  <div class="tagbar" id="tagbar-stats"></div>
  <div class="stats-grid" style="margin-bottom:14px">
    <div class="stat"><div class="num" id="st-students">0</div><div class="label">学生数</div></div>
    <div class="stat"><div class="num" id="st-texts">0</div><div class="label">课文数</div></div>
    <div class="stat"><div class="num" id="st-avg">-</div><div class="label">全班平均分</div></div>
    <div class="stat"><div class="num" id="st-done">0</div><div class="label">满分(5星)人次</div></div>
  </div>
  <div class="card">
    <h3>各课文掌握情况</h3>
    <div id="stat-texts"></div>
  </div>
  <div class="card">
    <h3>学生排名（按平均分）</h3>
    <div id="stat-students"></div>
  </div>
</div>

<!-- 操作日志 -->
<div id="page-log" class="hidden">
  <div class="card">
    <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:12px">
      <h3 style="margin:0">操作日志</h3>
      <div style="display:flex;gap:8px">
        <button class="btn sm ghost" onclick="exportLog()">导出日志</button>
        <button class="btn sm red" onclick="clearLog()">清空日志</button>
      </div>
    </div>
    <div id="log-area"></div>
  </div>
</div>
</div>

<!-- 评分选择器 -->
<div class="picker-mask" id="picker-mask" onclick="if(event.target===this)closePicker()">
  <div class="picker">
    <div class="picker-title" id="picker-title"></div>
    <div class="picker-opts">
      <button class="popt s0" onclick="pick(0)">0<br><small>未开始</small></button>
      <button class="popt s1" onclick="pick(1)">1</button>
      <button class="popt s2" onclick="pick(2)">2</button>
      <button class="popt s3" onclick="pick(3)">3</button>
      <button class="popt s4" onclick="pick(4)">4</button>
      <button class="popt s5" onclick="pick(5)">5<br><small>满分</small></button>
    </div>
    <button class="btn ghost sm" style="width:100%;margin-top:12px" onclick="closePicker()">取消</button>
  </div>
</div>

<!-- 通用确认弹窗 -->
<div class="modal-mask" id="confirm-mask" onclick="if(event.target===this)closeConfirm()">
  <div class="modal-box">
    <h3 id="confirm-title">确认</h3>
    <div class="mbody" id="confirm-msg"></div>
    <div class="mfoot">
      <button class="btn ghost" onclick="closeConfirm()">取消</button>
      <button class="btn red" id="confirm-ok">确定</button>
    </div>
  </div>
</div>

<!-- 课文编辑弹窗 -->
<div class="modal-mask" id="text-edit-mask" onclick="if(event.target===this)closeTextEditor()">
  <div class="modal-box">
    <h3 id="text-edit-title">编辑课文</h3>
    <label>课文标题</label>
    <input id="te-title" placeholder="如：《岳阳楼记》">
    <label>标签（可多个，用逗号/空格分隔）</label>
    <input id="te-tags" placeholder="如：九上 第三单元 文言文">
    <div class="mfoot">
      <button class="btn ghost" onclick="closeTextEditor()">取消</button>
      <button class="btn" onclick="saveTextEditor()">保存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const KEY='beishu_class_v1';
let data=load();
let activeClassId=data.classes[0]?.id||null;
let activeTab='progress';

// 统编版初中必背古诗文（课内 + 课外诵读）
const PRESET_TEXTS=[
  {unit:'七上·第一单元',title:'观沧海'},
  {unit:'七上·第一单元',title:'闻王昌龄左迁龙标遥有此寄'},
  {unit:'七上·第一单元',title:'次北固山下'},

function load(){
  let d=null;
  try{
    d=JSON.parse(localStorage.getItem(KEY));
    if(d&&Array.isArray(d.classes)){
      if(!Array.isArray(d.texts))d.texts=[];
      if(!d.progress||typeof d.progress!=='object')d.progress={};
      // 迁移：旧 unit 单值 → tags 数组
      d.texts.forEach(t=>{
        if(!Array.isArray(t.tags)){
          t.tags=t.unit?[t.unit]:[];
          delete t.unit;
        }
      });
      return d;
    }
  }catch(e){}
  return{classes:[],texts:[],progress:{}};
}
function textTags(t){return Array.isArray(t.tags)?t.tags:[];}
function textTagStr(t){return textTags(t).join('、');}
function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2000);}
function activeClass(){return data.classes.find(c=>c.id===activeClassId);}
function pkey(cid,sid,tid){return cid+'_'+sid+'_'+tid;}
function getStars(cid,sid,tid){return data.progress[pkey(cid,sid,tid)]||0;}
function setStars(cid,sid,tid,v){data.progress[pkey(cid,sid,tid)]=v;save();}
function log(action,detail){
  if(!data.log)data.log=[];
  data.log.unshift({time:new Date().toISOString(),action,detail});
  if(data.log.length>500)data.log=data.log.slice(0,500);
  save();
}

function switchTab(name){
  activeTab=name;
  document.querySelectorAll('.tab').forEach(t=>t.classList.toggle('active',t.dataset.tab===name));
  ['progress','students','texts','stats','log'].forEach(p=>document.getElementById('page-'+p).classList.toggle('hidden',p!==name));
  renderAll();
}

// ===== 班级 =====
function addClass(){
  const name=document.getElementById('new-class').value.trim();
  if(!name){toast('请输入班级名');return;}
  if(data.classes.some(c=>c.name===name)){toast('该班级已存在');return;}
  const c={id:uid(),name,students:[]};
  data.classes.push(c);
  if(!activeClassId)activeClassId=c.id;
  document.getElementById('new-class').value='';
  log('添加班级',name);save();renderAll();toast('已添加班级');
}
function delClass(id){
  const c=data.classes.find(x=>x.id===id);
  showConfirm('删除班级','删除「'+c.name+'」及其所有学生进度？',function(){
    Object.keys(data.progress).forEach(k=>{if(k.startsWith(id+'_'))delete data.progress[k];});
    data.classes=data.classes.filter(x=>x.id!==id);
    if(activeClassId===id)activeClassId=data.classes[0]?.id||null;
    log('删除班级',c.name);save();renderAll();toast('已删除');
  });
}
function selectClass(id){activeClassId=id;renderAll();}

// ===== 学生 =====
function addStudents(){
  const c=activeClass();
  if(!c){toast('请先选择班级');return;}
  const raw=document.getElementById('bulk-students').value;
  const names=raw.split(/[\n,，\s]+/).map(s=>s.trim()).filter(Boolean);
  if(!names.length){toast('请输入学生姓名');return;}
  let added=0;
  names.forEach(n=>{
    if(!c.students.some(s=>s.name===n)){c.students.push({id:uid(),name:n});added++;}
  });
  document.getElementById('bulk-students').value='';
  log('添加学生',`${c.name}：${names.join('、')}`);save();renderAll();toast(`已添加 ${added} 名学生`);
}
function delStudent(id){
  const c=activeClass();
  const s=c.students.find(x=>x.id===id);
  c.students=c.students.filter(x=>x.id!==id);
  Object.keys(data.progress).forEach(k=>{if(k.includes('_'+id+'_'))delete data.progress[k];});
  log('删除学生',`${c.name}：${s?s.name:id}`);save();renderAll();
}

function addText(){
  const title=document.getElementById('new-text').value.trim();
  const tags=parseTags(document.getElementById('new-text-tags').value);
  if(!title){toast('请输入课文名');return;}
  if(data.texts.some(t=>t.title===title)){toast('该课文已存在');return;}
  data.texts.push({id:uid(),title,tags});
  document.getElementById('new-text').value='';
  document.getElementById('new-text-tags').value='';
  log('添加课文',(tags.length?tags.join('、')+' / ':'')+title);save();renderAll();toast('已添加课文');
}
function parseTags(raw){
  return String(raw).split(/[\n,，、;；\s]+/).map(s=>s.trim()).filter(Boolean);
}
function delText(id){
  const t=data.texts.find(x=>x.id===id);
  showConfirm('删除课文','删除「'+(t?t.title:id)+'」及其所有相关进度？',function(){
    data.texts=data.texts.filter(t=>t.id!==id);
    Object.keys(data.progress).forEach(k=>{if(k.endsWith('_'+id))delete data.progress[k];});
    log('删除课文',t?t.title:id);save();renderAll();toast('已删除');
  });
}

function presetTexts(){
  const doPreset=function(){
    let added=0;
    PRESET_TEXTS.forEach(p=>{
      if(!data.texts.some(t=>t.title===p.title)){
        data.texts.push({id:uid(),title:p.title,tags:[p.unit]});

    log('预置课文','统编版初中必背古诗文，新增 '+added+' 篇');
    save();renderAll();toast(added?('已预置，新增 '+added+' 篇'):'统编版必背篇目已全部存在');

  }else{
    doPreset();
  }
}

// ===== 进度表 =====
let progressMode='grid';
let searchText='';
let pageStart=0;
let pageTotal=1;
const PAGE_SIZE=15;

function setMode(m){
  progressMode=m;
  document.getElementById('mode-grid').classList.toggle('active',m==='grid');
  document.getElementById('mode-single').classList.toggle('active',m==='single');
  pageStart=0;
  renderProgress();
}
function onSearch(){
  searchText=document.getElementById('text-search').value.trim().toLowerCase();
  pageStart=0;
  renderProgress();
}
function goToPage(delta){
  const total=filteredTexts().length;
  const pages=Math.ceil(total/PAGE_SIZE);
  let cur=Math.floor(pageStart/PAGE_SIZE);
  cur+=delta;
  if(cur<0)cur=0;
  if(cur>=pages)cur=pages-1;
  pageStart=cur*PAGE_SIZE;
  renderProgress();
}
let activeTag='';
function allTags(){
  const set=new Set();
  data.texts.forEach(t=>textTags(t).forEach(g=>set.add(g)));
  return [...set].sort((a,b)=>a.localeCompare(b,'zh'));
}
function setTagFilter(tag){
  activeTag=(activeTag===tag)?'':tag;
  pageStart=0;
  renderAll();
}
function renderTagBar(id){
  const el=document.getElementById(id);
  if(!el)return;
  const tags=allTags();
  if(!tags.length){el.innerHTML='<span class="tagbar-label">暂无标签</span>';return;}
  el.innerHTML='<span class="tagbar-label">标签筛选</span>'
    +`<button class="tagfilter ${activeTag===''?'active':''}" onclick="setTagFilter('')">全部</button>`
    +tags.map(g=>`<button class="tagfilter ${activeTag===g?'active':''}" onclick="setTagFilter('${esc(g)}')">${esc(g)}</button>`).join('');
}
function filteredTexts(){
  return data.texts.filter(t=>{
    if(activeTag&&!textTags(t).includes(activeTag))return false;
    if(searchText&&!(t.title.toLowerCase().includes(searchText)||textTags(t).some(g=>g.toLowerCase().includes(searchText))))return false;
    return true;
  });
}
function renderProgress(){
  const bar=document.getElementById('class-bar');
  bar.innerHTML=data.classes.map(c=>
    `<div class="class-chip ${c.id===activeClassId?'active':''}" onclick="selectClass('${c.id}')">${esc(c.name)}</div>`
  ).join('')||'<span style="color:var(--muted)">还没有班级，去「班级与学生」添加</span>';

  const area=document.getElementById('progress-area');
  const c=activeClass();
  if(!c||!c.students.length||!data.texts.length){
    area.innerHTML='<div class="empty">需要至少 1 个学生 和 1 篇课文 才能记录进度</div>';
    return;
  }
  if(progressMode==='single')renderSingleMode(area,c);
  else renderGridMode(area,c);
}
function renderGridMode(area,c){
  const texts=filteredTexts();
  if(!texts.length){area.innerHTML='<div class="empty">没有匹配的课文</div>';return;}
  const totalPages=Math.ceil(texts.length/PAGE_SIZE);
  pageTotal=totalPages;
  if(pageStart>=totalPages*PAGE_SIZE)pageStart=0;
  const pageTexts=texts.slice(pageStart,pageStart+PAGE_SIZE);
  let html='<div class="table-wrap"><table class="grid"><thead><tr><th>学生</th>';
  pageTexts.forEach(t=>html+=`<th class="colhead" title="点击整列设置" onclick="openPicker({type:'col',cid:'${c.id}',tid:'${t.id}'})">${esc(t.title)}</th>`);
  html+=`<th class="colhead" title="点击整行设置" onclick="openPicker({type:'allrow',cid:'${c.id}'})">整行</th></tr></thead><tbody>`;
  c.students.forEach(s=>{
    html+=`<tr><td class="student">${esc(s.name)}<span class="mini-exp" title="导出该生" onclick="exportStudent('${c.id}','${s.id}')">导出</span></td>`;
    pageTexts.forEach(t=>{
      const v=getStars(c.id,s.id,t.id);
      html+=`<td class="cell s${v}" onclick="openPicker({type:'cell',cid:'${c.id}',sid:'${s.id}',tid:'${t.id}'})">${v||'·'}</td>`;
    });
    html+=`<td class="rowall" onclick="openPicker({type:'row',cid:'${c.id}',sid:'${s.id}'})">→</td></tr>`;
  });
  html+='</tbody></table></div>';
  if(totalPages>1){
    const cur=Math.floor(pageStart/PAGE_SIZE);
    const atStart=cur===0;
    const atEnd=cur>=totalPages-1;
    html+=`<div class="pager">
      <button ${atStart?'disabled':''} onclick="goToPage(-${totalPages})">首页</button>
      <button ${atStart?'disabled':''} onclick="goToPage(-1)">上一页</button>
      <span class="info">${cur+1} / ${totalPages} 页（共 ${texts.length} 篇）</span>
      <button ${atEnd?'disabled':''} onclick="goToPage(1)">下一页</button>
      <button ${atEnd?'disabled':''} onclick="goToPage(${totalPages})">末页</button>
    </div>`;
  }
  area.innerHTML=html;
}
function renderSingleMode(area,c){
  const texts=filteredTexts();
  if(!texts.length){area.innerHTML='<div class="empty">没有匹配的课文</div>';return;}
  const selId=data._singleTextId&&texts.find(t=>t.id===data._singleTextId)?data._singleTextId:texts[0].id;
  data._singleTextId=selId;
  const t=data.texts.find(x=>x.id===selId);
  let html=`<div class="single-text-bar">
    <select onchange="data._singleTextId=this.value;renderProgress()">`;
  const groups={};
  texts.forEach(x=>{const u=(textTags(x)[0])||'未分组';(groups[u]=groups[u]||[]).push(x);});
  Object.keys(groups).sort((a,b)=>a==='未分组'?1:b==='未分组'?-1:a.localeCompare(b,'zh')).forEach(u=>{
    html+=`<optgroup label="${esc(u)}">`;
    groups[u].forEach(x=>html+=`<option value="${x.id}" ${x.id===selId?'selected':''}>${esc(x.title)}</option>`);
    html+='</optgroup>';
  });
  html+=`</select>
    <button class="btn sm" onclick="openPicker({type:'col',cid:'${c.id}',tid:'${selId}'})">全班统一打分</button>
  </div>
  <div class="single-list">`;
  c.students.forEach(s=>{
    const v=getStars(c.id,s.id,selId);
    html+=`<div class="single-row">
      <span class="sname">${esc(s.name)}</span>
      <div class="stars">`;
    for(let i=0;i<=5;i++){
      html+=`<button class="star s${i} ${i>v?'off':''}" onclick="setStars('${c.id}','${s.id}','${selId}',${i});log('评分','${esc(t.title)} · ${esc(s.name)} → ${i} 星');renderProgress()">${i}</button>`;
    }
    html+=`</div></div>`;
  });
  html+='</div>';
  area.innerHTML=html;
}

let pickerCtx=null;
function openPicker(ctx){
  pickerCtx=ctx;
  const c=activeClass();
  let title='';
  if(ctx.type==='cell'){
    const s=c.students.find(x=>x.id===ctx.sid);
    const t=data.texts.find(x=>x.id===ctx.tid);
    title=`${s.name} · ${t.title}`;
  }else if(ctx.type==='col'){
    const t=data.texts.find(x=>x.id===ctx.tid);
    title=`整列：${t.title}（全班）`;
  }else if(ctx.type==='row'){
    const s=c.students.find(x=>x.id===ctx.sid);
    title=`整行：${s.name}（全部课文）`;
  }else if(ctx.type==='allrow'){
    title=`全班 · 全部课文`;
  }
  document.getElementById('picker-title').textContent=title;
  document.getElementById('picker-mask').classList.add('show');
}
function closePicker(){document.getElementById('picker-mask').classList.remove('show');pickerCtx=null;}
function pick(v){
  if(!pickerCtx)return;
  const ctx=pickerCtx;
  const title=document.getElementById('picker-title').textContent;
  if(ctx.type==='cell'){
    setStars(ctx.cid,ctx.sid,ctx.tid,v);
  }else if(ctx.type==='col'){
    const c=activeClass();
    c.students.forEach(s=>setStars(ctx.cid,s.id,ctx.tid,v));
  }else if(ctx.type==='row'){
    data.texts.forEach(t=>setStars(ctx.cid,ctx.sid,t.id,v));
  }else if(ctx.type==='allrow'){
    const c=activeClass();
    c.students.forEach(s=>data.texts.forEach(t=>setStars(ctx.cid,s.id,t.id,v)));
  }
  log('评分',`${title} → ${v} 星`);
  closePicker();
  renderProgress();
  if(activeTab==='stats')renderStats();
}

// ===== 应用内弹窗 =====
let confirmCb=null;
function showConfirm(title,msg,cb){
  document.getElementById('confirm-title').textContent=title;
  document.getElementById('confirm-msg').textContent=msg;
  confirmCb=cb;
  document.getElementById('confirm-mask').classList.add('show');
}
function closeConfirm(){
  document.getElementById('confirm-mask').classList.remove('show');
  confirmCb=null;
}
document.getElementById('confirm-ok').addEventListener('click',function(){
  const cb=confirmCb;
  closeConfirm();
  if(cb)cb();
});
let editingTextId=null;
function openTextEditor(t){
  editingTextId=t.id;
  document.getElementById('te-title').value=t.title;
  document.getElementById('te-tags').value=textTags(t).join('，');
  document.getElementById('text-edit-mask').classList.add('show');
}
function closeTextEditor(){
  document.getElementById('text-edit-mask').classList.remove('show');
  editingTextId=null;
}
function saveTextEditor(){
  const t=data.texts.find(x=>x.id===editingTextId);
  if(!t)return;
  const title=document.getElementById('te-title').value.trim();
  const tags=parseTags(document.getElementById('te-tags').value);
  if(!title){toast('标题不能为空');return;}
  if(data.texts.some(x=>x.id!==editingTextId&&x.title===title)){toast('该标题已存在');return;}
  t.title=title;t.tags=tags;
  log('编辑课文',(tags.length?tags.join('、')+' / ':'')+title);
  closeTextEditor();save();renderAll();toast('已更新');
}

// ===== 统计 =====
function renderStats(){
  const bar=document.getElementById('class-bar-stats');
  bar.innerHTML=data.classes.map(c=>
    `<div class="class-chip ${c.id===activeClassId?'active':''}" onclick="selectClass('${c.id}')">${esc(c.name)}</div>`
  ).join('')||'<span style="color:var(--muted)">还没有班级</span>';

  const c=activeClass();
  const texts=filteredTexts();
  if(!c||!c.students.length||!texts.length){
    document.getElementById('st-students').textContent=c?c.students.length:0;
    document.getElementById('st-texts').textContent=texts.length;
    document.getElementById('st-avg').textContent='-';
    document.getElementById('st-done').textContent='0';
    document.getElementById('stat-texts').innerHTML='<div class="empty">暂无数据</div>';
    document.getElementById('stat-students').innerHTML='<div class="empty">暂无数据</div>';
    return;
  }
  const S=c.students.length,T=texts.length;
  let totalSum=0,done5=0;
  // 每课文
  const textStats=texts.map(t=>{
    let sum=0,cnt5=0,cnt0=0;
    c.students.forEach(s=>{
      const v=getStars(c.id,s.id,t.id);
      sum+=v;
      if(v===5)cnt5++;
      if(v===0)cnt0++;
    });
    totalSum+=sum;done5+=cnt5;
    return{t,sum,avg:sum/S,cnt5,cnt0};
  });
  // 每学生
  const stuStats=c.students.map(s=>{
    let sum=0;
    texts.forEach(t=>sum+=getStars(c.id,s.id,t.id));
    return{s,avg:sum/T};
  }).sort((a,b)=>b.avg-a.avg);

  document.getElementById('st-students').textContent=S;
  document.getElementById('st-texts').textContent=T;
  document.getElementById('st-avg').textContent=(totalSum/(S*T)).toFixed(2);
  document.getElementById('st-done').textContent=done5;

  document.getElementById('stat-texts').innerHTML=textStats.map(x=>{
    const pct=Math.round(x.cnt5/S*100);
    return `<div style="margin-bottom:12px">
      <div style="display:flex;justify-content:space-between;font-size:14px">
        <span style="font-weight:600">${esc(x.t.title)}</span>
        <span style="color:var(--muted)">平均 ${x.avg.toFixed(1)} · 满分 ${x.cnt5} 人 · 未开始 ${x.cnt0} 人</span>
      </div>
      <div class="bar-wrap"><div class="bar" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');

  document.getElementById('stat-students').innerHTML=`<table class="stat-tbl">
    <thead><tr><th>排名</th><th>学生</th><th>平均分</th><th>满分篇数</th></tr></thead>
    <tbody>${stuStats.map((x,i)=>{
      const cnt5=texts.filter(t=>getStars(c.id,x.s.id,t.id)===5).length;
      return `<tr><td>${i+1}</td><td class="name">${esc(x.s.name)}</td><td>${x.avg.toFixed(2)}</td><td>${cnt5}</td></tr>`;
    }).join('')}</tbody></table>`;
}

// ===== 渲染其余 =====
function renderClasses(){
  const list=document.getElementById('class-list');
  if(!data.classes.length){list.innerHTML='<div class="empty">还没有班级，先在上方添加</div>';return;}
  list.innerHTML=data.classes.map(c=>
    `<div style="display:flex;justify-content:space-between;align-items:center;padding:10px;border:1px solid var(--border);border-radius:8px;margin-bottom:8px">
      <span style="font-weight:600">${esc(c.name)} <span style="color:var(--muted);font-size:13px">（${c.students.length} 人）</span></span>
      <div style="display:flex;gap:6px">
        <button class="btn sm ghost" onclick="selectClass('${c.id}');switchTab('students')">管理学生</button>
        <button class="btn sm red" onclick="delClass('${c.id}')">删除</button>
      </div>
    </div>`
  ).join('');
  // 当前班学生
  const c=activeClass();
  const card=document.getElementById('student-edit-card');
  if(c&&c.students.length){
    card.style.display='block';
    document.getElementById('student-edit-title').textContent=`${c.name} 的学生（${c.students.length}）`;
    document.getElementById('student-grid').innerHTML=c.students.map(s=>
      `<div class="student-chip"><span>${esc(s.name)}</span><span style="display:flex;gap:4px;align-items:center"><button class="exp" onclick="exportStudent('${c.id}','${s.id}')">导出</button><span class="del" onclick="delStudent('${s.id}')">×</span></span></div>`
    ).join('');
  }else if(c){
    card.style.display='block';
    document.getElementById('student-edit-title').textContent=`${c.name} 的学生（0）`;
    document.getElementById('student-grid').innerHTML='<div class="empty">还没有学生</div>';
  }else{
    card.style.display='none';
  }
}
function renderTexts(){
  const list=document.getElementById('text-list');
  const texts=filteredTexts();
  if(!texts.length){list.innerHTML='<div class="empty">'+(data.texts.length?'没有匹配的课文':'还没有课文，先在上方添加')+'</div>';return;}
  const groups={};
  texts.forEach(t=>{
    const tags=textTags(t);
    const u=tags[0]||'未分组';
    (groups[u]=groups[u]||[]).push(t);
  });
  const order=Object.keys(groups).sort((a,b)=>a==='未分组'?1:b==='未分组'?-1:a.localeCompare(b,'zh'));
  list.innerHTML=order.map(u=>
    `<div style="margin-bottom:14px">
      <div style="font-family:var(--serif);font-size:15px;font-weight:700;color:var(--primary);margin-bottom:8px;padding-left:10px;border-left:3px solid var(--accent)">${esc(u)} <span style="color:var(--muted);font-size:13px;font-weight:400">（${groups[u].length} 篇）</span></div>
      ${groups[u].map(t=>{
        const tags=textTags(t);
        const chips=tags.map(g=>`<span class="tag-chip">${esc(g)}</span>`).join('');
        return `<div style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border:1px solid var(--border);border-radius:8px;margin-bottom:6px;gap:8px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap"><span style="font-weight:600">${esc(t.title)}</span>${chips}</div>
          <div style="display:flex;gap:6px">
            <button class="btn sm ghost" onclick="editText('${t.id}')">编辑</button>
            <button class="btn sm red" onclick="delText('${t.id}')">删除</button>
          </div>
        </div>`;
      }).join('')}
    </div>`
  ).join('');
}
function renderLog(){
  const area=document.getElementById('log-area');
  const logs=data.log||[];
  if(!logs.length){area.innerHTML='<div class="empty">暂无操作记录</div>';return;}
  area.innerHTML=`<table class="stat-tbl">
    <thead><tr><th style="width:150px">时间</th><th style="width:90px">操作</th><th>详情</th></tr></thead>
    <tbody>${logs.map(l=>{
      const d=new Date(l.time);
      const ts=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')+':'+String(d.getSeconds()).padStart(2,'0');
      return `<tr><td>${ts}</td><td>${esc(l.action)}</td><td class="name">${esc(l.detail||'')}</td></tr>`;
    }).join('')}</tbody></table>`;
}
function clearLog(){
  showConfirm('清空日志','确定清空全部操作日志？',function(){
    data.log=[];save();renderLog();toast('已清空');
  });
}
function exportLog(){
  const logs=data.log||[];
  if(!logs.length){toast('暂无日志可导出');return;}
  const rows=[['时间','操作','详情']];
  logs.forEach(l=>{
    const d=new Date(l.time);
    rows.push([d.toLocaleString('zh-CN'),l.action,l.detail||'']);
  });
  downloadCSV(rows,`操作日志_${new Date().toISOString().slice(0,10)}.csv`);
  toast('已导出日志');
}
function renderAll(){
  renderTagBar('tagbar-progress');
  renderTagBar('tagbar-texts');
  renderTagBar('tagbar-stats');
  renderProgress();
  renderClasses();
  renderTexts();
  if(activeTab==='stats')renderStats();
  if(activeTab==='log')renderLog();
}

// ===== 导入导出 =====
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download='背书进度_'+new Date().toISOString().slice(0,10)+'.json';
  a.click();
  log('导出备份','JSON 全量备份');toast('已导出');
}
function importData(e){
  const f=e.target.files[0];
  if(!f)return;
  const r=new FileReader();
  r.onload=()=>{
    try{
      const d=JSON.parse(r.result);
      if(!d.classes||!d.texts)throw 0;
      showConfirm('导入数据','导入将覆盖当前数据，确定？',function(){
        data=d;activeClassId=data.classes[0]?.id||null;
        log('导入数据','JSON 备份导入，覆盖原数据');save();renderAll();toast('导入成功');
      });
    }catch(err){toast('文件格式错误');}
  };
  r.readAsText(f);
  e.target.value='';
}

// ===== 导出 Excel / 打印 =====
function csvCell(v){
  v=String(v);
  if(/[",\n]/.test(v))v='"'+v.replace(/"/g,'""')+'"';
  return v;
}
function classRows(c){
  const rows=[];
  rows.push(['班级',c.name]);
  rows.push(['导出日期',new Date().toISOString().slice(0,10)]);
  rows.push([]);
  rows.push(['学生',...data.texts.map(t=>t.title),'平均分','满分篇数']);
  c.students.forEach(s=>{
    const vals=data.texts.map(t=>getStars(c.id,s.id,t.id));
    const avg=(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2);
    const cnt5=vals.filter(v=>v===5).length;
    rows.push([s.name,...vals,avg,cnt5]);
  });
  const allAvg=(data.texts.map(t=>c.students.reduce((a,s)=>a+getStars(c.id,s.id,t.id),0)/c.students.length).reduce((a,b)=>a+b,0)/data.texts.length).toFixed(2);
  rows.push(['全班平均',...data.texts.map(t=>(c.students.reduce((a,s)=>a+getStars(c.id,s.id,t.id),0)/c.students.length).toFixed(2)),allAvg,'']);
  return rows;
}
function downloadCSV(rows,filename){
  const csv='\uFEFF'+rows.map(r=>r.map(csvCell).join(',')).join('\r\n');
  const blob=new Blob([csv],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=filename;
  a.click();
}
function exportCSV(){
  const c=activeClass();
  if(!c||!c.students.length||!data.texts.length){toast('没有可导出的进度数据');return;}
  downloadCSV(classRows(c),`背书进度_${c.name}_${new Date().toISOString().slice(0,10)}.csv`);
  toast('已导出，用 Excel/WPS 打开即可');
}
function exportStudent(cid,sid){
  const c=data.classes.find(x=>x.id===cid);
  const s=c&&c.students.find(x=>x.id===sid);
  if(!c||!s||!data.texts.length){toast('没有可导出的数据');return;}
  const rows=[];
  rows.push(['学生',s.name]);
  rows.push(['班级',c.name]);
  rows.push(['导出日期',new Date().toISOString().slice(0,10)]);
  rows.push([]);
  rows.push(['课文','评分']);
  data.texts.forEach(t=>rows.push([t.title,getStars(cid,sid,t.id)]));
  const vals=data.texts.map(t=>getStars(cid,sid,t.id));
  rows.push([]);
  rows.push(['平均分',(vals.reduce((a,b)=>a+b,0)/vals.length).toFixed(2)]);
  rows.push(['满分篇数',vals.filter(v=>v===5).length]);
  rows.push(['未开始篇数',vals.filter(v=>v===0).length]);
  downloadCSV(rows,`背书情况_${s.name}_${new Date().toISOString().slice(0,10)}.csv`);
  toast(`已导出 ${s.name} 的背书情况`);
}
function exportAllCSV(){
  const valid=data.classes.filter(c=>c.students.length);
  if(!valid.length||!data.texts.length){toast('没有可导出的进度数据');return;}
  const rows=[];
  valid.forEach((c,i)=>{
    if(i>0)rows.push([]);
    rows.push(...classRows(c));
  });
  downloadCSV(rows,`背书进度_全部班级_${new Date().toISOString().slice(0,10)}.csv`);
  toast(`已导出 ${valid.length} 个班级`);
}
function printTable(){
  const c=activeClass();
  if(!c||!c.students.length||!data.texts.length){toast('没有可打印的进度数据');return;}
  const w=window.open('','_blank');
  const head=data.texts.map(t=>`<th>${esc(t.title)}</th>`).join('');
  const body=c.students.map(s=>{
    const cells=data.texts.map(t=>{
      const v=getStars(c.id,s.id,t.id);
      return `<td style="text-align:center">${v||'·'}</td>`;
    }).join('');
    return `<tr><td style="text-align:left;font-weight:600">${esc(s.name)}</td>${cells}</tr>`;
  }).join('');
  w.document.write(`<html><head><meta charset="utf-8"><title>${esc(c.name)} 背书进度</title>
    <style>body{font-family:"Microsoft YaHei",sans-serif;padding:20px}
    h2{margin-bottom:4px}p{color:#666;font-size:13px;margin-bottom:14px}
    table{border-collapse:collapse;width:100%;font-size:13px}
    th,td{border:1px solid #999;padding:6px 8px}th{background:#eee}
    @media print{.noprint{display:none}}</style></head>
    <body>
    <h2>${esc(c.name)} 背书进度表</h2>
    <p>导出日期：${new Date().toISOString().slice(0,10)}　评分：0 未开始 → 5 满分</p>
    <table><thead><tr><th>学生</th>${head}</tr></thead><tbody>${body}</tbody></table>
    <p class="noprint" style="margin-top:16px"><button onclick="window.print()" style="padding:8px 16px">打印</button></p>
    <script>window.onload=function(){window.print()}<\/script>
    </body></html>`);
  w.document.close();
}

renderAll();
</script>
