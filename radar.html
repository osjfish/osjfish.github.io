
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>学生评价雷达图批量生成系统</title>
    
    <!-- 核心库 (UMD 版本) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 功能库 -->
    <script src="https://unpkg.com/prop-types@15.8.1/prop-types.min.js"></script>
    <script src="https://unpkg.com/recharts@2.12.7/umd/Recharts.js"></script>
    <script src="https://unpkg.com/xlsx/dist/xlsx.full.min.js"></script>
    <script src="https://unpkg.com/jszip@3.10.1/dist/jszip.min.js"></script>
    <script src="https://unpkg.com/file-saver@2.0.5/dist/FileSaver.min.js"></script>
    <script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
        .recharts-polar-grid-concentric-path { stroke: #e2e8f0; }
        .recharts-polar-grid-angle-line { stroke: #e2e8f0; }
    </style>
<link rel="stylesheet" href="/index.css">
</head>
<body class="bg-slate-50 min-h-screen text-slate-900">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;
        const { 
            Radar, RadarChart, PolarGrid, PolarAngleAxis, PolarRadiusAxis, ResponsiveContainer 
        } = window.Recharts;

        // 图标组件 (SVG 路径)
        const UploadIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-12 h-12">
                <path strokeLinecap="round" strokeLinejoin="round" d="M12 16.5V9.75m0 0l3 3m-3-3l-3 3M6.75 19.5a4.5 4.5 0 01-1.41-8.775 5.25 5.25 0 0110.233-2.33 3 3 0 013.758 3.848A3.752 3.752 0 0118 19.5H6.75z" />
            </svg>
        );

        const DownloadIcon = () => (
            <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={1.5} stroke="currentColor" className="w-5 h-5">
                <path strokeLinecap="round" strokeLinejoin="round" d="M3 16.5v2.25A2.25 2.25 0 005.25 21h13.5A2.25 2.25 0 0021 18.75V16.5M7.5 12l4.5 4.5m0 0l4.5-4.5M12 3v13.5" />
            </svg>
        );

        const LEVEL_MAP = { '卓越': 4, '笃学': 3, '敏行': 2, '精勤': 1 };
        const NON_SUBJECT_COLS = ['姓名', '班级'];

        function App() {
            const [students, setStudents] = useState([]);
            const [isProcessing, setIsProcessing] = useState(false);
            const [progress, setProgress] = useState(0);

            const handleFileUpload = (e) => {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = (evt) => {
                    const data = new Uint8Array(evt.target.result);
                    const workbook = XLSX.read(data, { type: 'array' });
                    const wsname = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[wsname];
                    const json = XLSX.utils.sheet_to_json(worksheet);

                    const parsed = json.map(row => {
                        const subjects = [];
                        for (const key of Object.keys(row)) {
                            if (!NON_SUBJECT_COLS.includes(key)) {
                                const level = row[key];
                                if (level && LEVEL_MAP.hasOwnProperty(level)) {
                                    subjects.push({
                                        subject: key,
                                        level: level,
                                        value: LEVEL_MAP[level]
                                    });
                                }
                            }
                        }
                        return {
                            name: row['姓名'] || '未知',
                            className: row['班级'] || '默认班级',
                            subjects: subjects
                        };
                    });
                    setStudents(parsed);
                };
                reader.readAsArrayBuffer(file);
            };

            const handleBatchExport = async () => {
                if (students.length === 0) return;
                setIsProcessing(true);
                const zip = new JSZip();

                try {
                    for (let i = 0; i < students.length; i++) {
                        const student = students[i];
                        setProgress(Math.round(((i + 1) / students.length) * 100));
                        
                        const element = document.getElementById(`student-card-${i}`);
                        if (element) {
                            // 截图处理
                            const dataUrl = await htmlToImage.toPng(element, { 
                                backgroundColor: '#ffffff',
                                pixelRatio: 2
                            });
                            const base64Data = dataUrl.split(',')[1];
                            zip.file(`${student.name}_${student.className}.png`, base64Data, { base64: true });
                        }
                    }

                    const content = await zip.generateAsync({ type: 'blob' });
                    saveAs(content, `雷达图批量导出_${Date.now()}.zip`);
                } catch (err) {
                    console.error(err);
                    alert("导出失败，请检查数据格式。");
                } finally {
                    setIsProcessing(false);
                    setProgress(0);
                }
            };

            return (
                <div className="max-w-7xl mx-auto px-4 py-12">
                    <header className="mb-12 text-center">
                        <h1 className="text-4xl font-extrabold text-slate-900 mb-4">学生素质雷达图生成器</h1>
                        <div className="flex justify-center gap-6 font-bold text-sm">
                            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-red-500"></span> 卓越 (4档)</span>
                            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-orange-500"></span> 笃学 (3档)</span>
                            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-blue-500"></span> 敏行 (2档)</span>
                            <span className="flex items-center gap-1"><span className="w-3 h-3 rounded-full bg-green-500"></span> 精勤 (1档)</span>
                        </div>
                    </header>

                    <div className="bg-white rounded-2xl shadow-xl p-8 mb-10 border border-slate-100 flex flex-col md:flex-row items-center gap-8">
                        <label className="flex-1 w-full h-40 border-2 border-dashed border-slate-300 rounded-xl flex flex-col items-center justify-center cursor-pointer hover:bg-slate-50 transition-colors">
                            <UploadIcon />
                            <span className="mt-2 text-slate-500 font-medium">点击或拖拽上传 Excel</span>
                            <input type="file" className="hidden" accept=".xlsx,.xls" onChange={handleFileUpload} />
                        </label>
                        <div className="flex-1 text-sm text-slate-500 leading-relaxed space-y-2">
                            <p className="font-bold text-slate-700">上传格式说明</p>
                            <ul className="list-disc pl-4 space-y-1">
                                <li>第一行为表头，须包含 <b>姓名</b>、<b>班级</b> 及学科列（如语文、数学等），学科列名可自定义</li>
                                <li>每行代表一名学生，学科列填写档位：<b className="text-red-500">卓越</b> / <b className="text-orange-500">笃学</b> / <b className="text-blue-500">敏行</b> / <b className="text-green-500">精勤</b></li>
                                <li>空值或未填写的学科将自动隐藏</li>
                                <li>支持 .xlsx / .xls 格式</li>
                            </ul>
                        </div>

                        <button 
                            onClick={handleBatchExport}
                            disabled={students.length === 0 || isProcessing}
                            className={`px-10 py-5 rounded-xl text-white font-bold flex items-center gap-3 shadow-lg transition-transform active:scale-95 ${
                                students.length === 0 || isProcessing ? 'bg-slate-300 cursor-not-allowed' : 'bg-indigo-600 hover:bg-indigo-700'
                            }`}
                        >
                            {isProcessing ? `正在打包 ${progress}%` : <><DownloadIcon /> 批量导出图片 ({students.length})</>}
                        </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8">
                        {students.map((student, idx) => (
                            <div key={idx} id={`student-card-${idx}`} className="bg-white p-8 rounded-3xl shadow-sm border border-slate-100">
                                <div className="flex justify-between items-start mb-6">
                                    <div>
                                        <h3 className="text-2xl font-black text-slate-800">{student.name}</h3>
                                        <p className="text-slate-400 font-medium">{student.className}</p>
                                    </div>
                                    <div className="text-[10px] bg-slate-100 text-slate-400 px-3 py-1 rounded-full font-black tracking-widest uppercase">Radar Chart</div>
                                </div>

                                <div className="h-64 w-full mb-6">
                                    <ResponsiveContainer>
                                        <RadarChart data={student.subjects}>
                                            <PolarGrid stroke="#f1f5f9" />
                                            <PolarAngleAxis dataKey="subject" tick={{ fill: '#94a3b8', fontSize: 12, fontWeight: 600 }} />
                                            <PolarRadiusAxis domain={[0, 4]} tickCount={5} tick={false} axisLine={false} />
                                            <Radar
                                                dataKey="value"
                                                stroke="#6366f1"
                                                fill="#6366f1"
                                                fillOpacity={0.5}
                                            />
                                        </RadarChart>
                                    </ResponsiveContainer>
                                </div>

                                {student.subjects.length > 0 && (
                                    <div className="flex flex-wrap gap-3 pt-6 border-t border-slate-50">
                                        {student.subjects.map((s, i) => (
                                            <div key={i} className="text-center min-w-[3.5rem]">
                                                <div className="text-[10px] text-slate-400 mb-1 font-bold">{s.subject}</div>
                                                <div className={`text-xs font-black ${
                                                    s.level === '卓越' ? 'text-red-500' : s.level === '笃学' ? 'text-orange-500' : s.level === '敏行' ? 'text-blue-500' : 'text-green-500'
                                                }`}>{s.level}</div>
                                            </div>
                                        ))}
                                    </div>
                                )}
                            </div>
                        ))}
                    </div>

                    {students.length === 0 && (
                        <div className="text-center py-32 bg-white rounded-3xl border-2 border-dashed border-slate-100">
                            <p className="text-slate-300 font-medium text-lg">等待数据导入...</p>
                        </div>
                    )}
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
<script type="module" src="/index.tsx"></script>
</body>
</html>
