<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="沸点 — 多平台热榜聚合阅读">
<meta name="theme-color" content="#0a0b0f" id="metaTheme">
<title>沸点 · 今日热榜聚合</title>
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32"><circle cx="16" cy="16" r="13" fill="%23e6b655"/><circle cx="16" cy="16" r="5.5" fill="%230a0b0f"/></svg>'>
<style>
:root{
  --sans:"PingFang SC","HarmonyOS Sans SC","MiSans","Microsoft YaHei UI","Microsoft YaHei",system-ui,-apple-system,"Segoe UI",sans-serif;
  --serif:Georgia,"Times New Roman","Source Han Serif SC",serif;
}
html[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0a0b0f;--bg2:#0d0f15;--card:#12141c;--card-hi:#171a24;--glass:rgba(12,13,19,.82);
  --line:rgba(255,255,255,.07);--line-hi:rgba(255,255,255,.14);
  --tx:#eceef4;--tx2:#a4abb9;--tx3:#676e80;
  --gold:#e6b655;--gold-bg:rgba(230,182,85,.1);--blue:#7cc4f5;--green:#5fd6a4;--red:#ff6b66;
  --r1:#f6c957;--r2:#ccd3e2;--r3:#df9c66;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 30px -14px rgba(0,0,0,.6);
  --mark:#e6b65533;
}
html[data-theme="light"]{
  color-scheme:light;
  --bg:#f5f4ef;--bg2:#eeede7;--card:#ffffff;--card-hi:#fbfaf6;--glass:rgba(250,249,245,.85);
  --line:rgba(25,28,38,.09);--line-hi:rgba(25,28,38,.18);
  --tx:#20242e;--tx2:#59617a;--tx3:#98a0b3;
  --gold:#a97a1d;--gold-bg:rgba(169,122,29,.09);--blue:#2f7fd0;--green:#189a68;--red:#d84a44;
  --r1:#c0890e;--r2:#8b92a4;--r3:#bb6f39;
  --shadow:0 1px 2px rgba(30,32,40,.06),0 10px 26px -16px rgba(30,32,40,.22);
  --mark:#e6b65559;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{font-size:15px}
body{
  font-family:var(--sans);background:var(--bg);color:var(--tx);
  line-height:1.55;min-height:100vh;overflow-x:hidden;
  transition:background .25s,color .25s;
}
body::before{
  content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(52rem 26rem at 12% -8%,rgba(230,182,85,.07),transparent 60%),
    radial-gradient(46rem 24rem at 88% -6%,rgba(124,196,245,.05),transparent 60%);
}
html[data-theme="light"] body::before{
  background:
    radial-gradient(52rem 26rem at 12% -8%,rgba(169,122,29,.06),transparent 60%),
    radial-gradient(46rem 24rem at 88% -6%,rgba(47,127,208,.05),transparent 60%);
}
::selection{background:var(--gold);color:#111}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line-hi);border-radius:99px;border:2px solid transparent;background-clip:content-box}
::-webkit-scrollbar-track{background:transparent}
svg{width:1.1em;height:1.1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none;display:block}
button{font-family:inherit;background:none;border:0;color:inherit;cursor:pointer}
input,textarea,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:inherit;text-decoration:none}
mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}

.header{
  position:sticky;top:0;z-index:50;
  background:var(--glass);backdrop-filter:blur(18px) saturate(1.5);-webkit-backdrop-filter:blur(18px) saturate(1.5);
  border-bottom:1px solid var(--line);
}
.header-in{max-width:1440px;margin:0 auto;padding:0 clamp(14px,2.5vw,28px);height:58px;display:flex;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:9px;font-weight:700;font-size:1.12rem;letter-spacing:.02em;flex:none}
.brand-dot{width:9px;height:9px;border-radius:50%;background:var(--gold);position:relative;flex:none}
.brand-dot::after{content:"";position:absolute;inset:-4px;border-radius:50%;border:1.5px solid var(--gold);opacity:.6;animation:pulse 2.2s ease-out infinite}
@keyframes pulse{0%{transform:scale(.5);opacity:.7}70%,100%{transform:scale(1.35);opacity:0}}
.brand em{font-style:normal;color:var(--tx3);font-weight:500;font-size:.78rem;margin-left:2px;letter-spacing:.08em}
.searchwrap{flex:1;max-width:430px;position:relative;display:flex}
.searchwrap>svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--tx3)}
#q{
  width:100%;height:36px;padding:0 34px 0 35px;border-radius:10px;border:1px solid var(--line);
  background:var(--card);outline:none;font-size:.86rem;color:var(--tx);
  transition:border-color .15s,background .15s;
}
#q:focus{border-color:var(--gold);background:var(--card-hi)}
#q::placeholder{color:var(--tx3)}
.qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:24px;height:24px;border-radius:6px;color:var(--tx3);display:none;align-items:center;justify-content:center}
.qclear:hover{background:var(--line);color:var(--tx)}
.spacer{flex:1}
.updated{font-size:.76rem;color:var(--tx3);white-space:nowrap;display:flex;align-items:center;gap:6px}
.icbtn{
  width:36px;height:36px;border-radius:10px;display:inline-flex;align-items:center;justify-content:center;
  color:var(--tx2);transition:background .15s,color .15s,transform .1s;flex:none;position:relative;
}
.icbtn:hover{background:var(--line);color:var(--tx)}
.icbtn:active{transform:scale(.92)}
.icbtn svg{width:19px;height:19px}
.icbtn.spin svg{animation:rot .8s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}

.layout{max-width:1440px;margin:0 auto;padding:20px clamp(14px,2.5vw,28px) 90px;display:grid;grid-template-columns:212px minmax(0,1fr);gap:24px;align-items:start}
.sidebar{position:sticky;top:78px;display:flex;flex-direction:column;gap:22px}
.side-group h4{font-size:.72rem;font-weight:600;color:var(--tx3);letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px;padding-left:4px}
.side-nav{display:flex;flex-direction:column;gap:2px}
.side-item{
  display:flex;align-items:center;gap:10px;padding:8px 11px;border-radius:10px;font-size:.9rem;
  color:var(--tx2);transition:background .15s,color .15s;text-align:left;width:100%;
}
.side-item svg{width:17px;height:17px;color:var(--tx3);transition:color .15s}
.side-item:hover{background:var(--line);color:var(--tx)}
.side-item.on{background:var(--gold-bg);color:var(--gold);font-weight:600}
.side-item.on svg{color:var(--gold)}
.side-item .cnt{
  margin-left:auto;font-size:.7rem;font-weight:600;min-width:20px;height:19px;padding:0 6px;
  border-radius:99px;background:var(--line);color:var(--tx2);
  display:inline-flex;align-items:center;justify-content:center;
}
.side-item.on .cnt{background:var(--gold);color:#141210}
.side-stats{padding:12px 4px 0;font-size:.74rem;color:var(--tx3);border-top:1px solid var(--line);line-height:2}

.toolbar{display:flex;align-items:center;gap:10px;flex-wrap:nowrap;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.toolbar::-webkit-scrollbar{display:none}
.seg{
  display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:3px;gap:2px;flex:none;
}
.seg button{
  display:inline-flex;align-items:center;gap:6px;height:31px;padding:0 12px;border-radius:8px;
  font-size:.82rem;color:var(--tx2);transition:all .15s;white-space:nowrap;
}
.seg button svg{width:15px;height:15px}
.seg button:hover{color:var(--tx)}
.seg button.on{background:var(--gold);color:#161310;font-weight:600;box-shadow:0 2px 8px -2px rgba(230,182,85,.45)}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;flex:1}
.chips::-webkit-scrollbar{display:none}
.chip{
  flex:none;height:31px;padding:0 13px;border-radius:99px;border:1px solid var(--line);
  font-size:.8rem;color:var(--tx2);display:inline-flex;align-items:center;gap:6px;background:var(--card);
  transition:all .15s;white-space:nowrap;
}
.chip:hover{border-color:var(--line-hi);color:var(--tx)}
.chip.on{background:var(--tx);border-color:var(--tx);color:var(--bg);font-weight:600}
.tgl{
  flex:none;display:inline-flex;align-items:center;gap:7px;height:31px;padding:0 12px;border-radius:99px;
  border:1px solid var(--line);background:var(--card);font-size:.8rem;color:var(--tx2);white-space:nowrap;transition:all .15s;
}
.tgl svg{width:14px;height:14px}
.tgl.on{color:var(--gold);border-color:var(--gold);background:var(--gold-bg)}

.content{min-height:300px}

.row{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;
  transition:background .13s;position:relative;
}
.row:hover{background:var(--card)}
.rk{
  font-family:var(--serif);font-size:1.02rem;font-weight:600;color:var(--tx3);width:26px;flex:none;
  text-align:center;font-style:italic;
}
.rk-1{color:var(--r1)}.rk-2{color:var(--r2)}.rk-3{color:var(--r3)}
.rk-1,.rk-2,.rk-3{font-size:1.18em}
.row-main{flex:1;min-width:0}
.row-link{
  font-size:.94rem;line-height:1.45;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  cursor:pointer;word-break:break-all;
}
.row-link:hover{color:var(--gold)}
.row-meta{display:flex;align-items:center;gap:7px;margin-top:3px;font-size:.74rem;color:var(--tx3)}
.dot{width:7px;height:7px;border-radius:50%;background:var(--c,#888);flex:none}
.row-meta b{font-weight:500;color:var(--tx3);font-variant-numeric:tabular-nums}
.row-meta i{font-style:normal;opacity:.5}
.row.is-read .row-link{color:var(--tx3);text-decoration-color:var(--tx3)}
.row.is-read .dot{opacity:.35}
.row-acts{display:flex;gap:2px;opacity:0;transition:opacity .15s;flex:none}
.row:hover .row-acts,.row:focus-within .row-acts{opacity:1}
@media (hover:none){
  .row-acts{opacity:.45}
  .row:active .row-acts{opacity:1}
  .frow .row-acts{opacity:.45}
  .frow:active .row-acts{opacity:1}
}
@media (hover:none) and (pointer:coarse){
  .act{width:34px;height:34px}
  .side-item{padding:10px 12px}
  .bn-item{padding:6px 0}
}
.act{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--tx3);transition:all .13s}
.act svg{width:16px;height:16px}
.act:hover{background:var(--line);color:var(--tx)}
.act.on{color:var(--gold)}
.act.on:hover{color:var(--gold)}
.flow-sep{margin:2px 0 10px 38px;border-bottom:1px dashed var(--line);opacity:.6}

.board-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.bcard{
  background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px 15px 9px;
  box-shadow:var(--shadow);content-visibility:auto;contain-intrinsic-size:auto 480px;
  transition:border-color .15s,transform .15s;
}
.bcard:hover{border-color:var(--line-hi)}
.bcard-h{display:flex;align-items:center;gap:9px;padding-bottom:11px;border-bottom:1px solid var(--line);margin-bottom:5px}
.bcard-h .dot{width:9px;height:9px}
.bcard-t{font-weight:700;font-size:.98rem}
.bcard-sub{font-size:.72rem;color:var(--tx3)}
.bcard-n{margin-left:auto;font-size:.72rem;color:var(--tx3);font-variant-numeric:tabular-nums}
.bcard .row{padding:7.5px 4px;border-radius:9px}
.bcard .row:hover{background:var(--card-hi)}
.bcard-more{
  width:100%;text-align:center;padding:9px 0 5px;font-size:.78rem;color:var(--tx3);
  display:flex;align-items:center;justify-content:center;gap:5px;transition:color .15s;border-radius:8px;
}
.bcard-more:hover{color:var(--gold)}
.bcard-more svg{width:14px;height:14px;transition:transform .2s}
.bcard-more.open svg{transform:rotate(180deg)}
.bcard-fail{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 0 20px;color:var(--tx3);font-size:.83rem}
.retry{
  padding:6px 16px;border-radius:99px;border:1px solid var(--line-hi);font-size:.8rem;color:var(--tx2);transition:all .15s;
}
.retry:hover{border-color:var(--gold);color:var(--gold)}

.focus-pills{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:16px}
.focus-pills::-webkit-scrollbar{display:none}
.fpill{
  flex:none;height:36px;padding:0 15px;border-radius:11px;border:1px solid var(--line);background:var(--card);
  display:inline-flex;align-items:center;gap:8px;font-size:.87rem;color:var(--tx2);transition:all .15s;white-space:nowrap;
}
.fpill .dot{width:8px;height:8px}
.fpill:hover{border-color:var(--line-hi);color:var(--tx)}
.fpill.on{background:var(--tx);border-color:var(--tx);color:var(--bg);font-weight:600}
.focus-head{display:flex;align-items:baseline;gap:10px;margin-bottom:6px;padding:0 12px}
.focus-head h2{font-size:1.25rem;font-weight:800}
.focus-head span{font-size:.76rem;color:var(--tx3)}
.frow{display:flex;gap:14px;padding:13px 12px;border-radius:14px;transition:background .13s;align-items:flex-start}
.frow:hover{background:var(--card)}
.frow .rk{font-size:1.5rem;width:44px;padding-top:1px}
.frow .row-main{padding-top:2px}
.frow .row-link{font-size:1.02rem;-webkit-line-clamp:3}
.frow-desc{font-size:.8rem;color:var(--tx3);margin-top:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.frow:hover .row-acts,.frow:focus-within .row-acts{opacity:1}
.frow .row-link:hover{color:var(--gold)}
.frow.is-read .row-link{color:var(--tx3)}
.frow.is-read .dot{opacity:.35}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}

.drawer-mask{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:80;opacity:0;pointer-events:none;transition:opacity .22s}
.drawer{
  position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);z-index:81;
  background:var(--bg2);border-left:1px solid var(--line);
  transform:translateX(102%);transition:transform .24s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column;
}
body.drawer-open .drawer-mask{opacity:1;pointer-events:auto}
body.drawer-open .drawer{transform:none}
.drawer-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.drawer-h h3{font-size:1.02rem;font-weight:700;display:flex;align-items:center;gap:8px}
.drawer-h h3 svg{width:18px;height:18px;color:var(--gold)}
.drawer-h .n{font-size:.74rem;color:var(--tx3)}
.drawer-h .grow{flex:1}
.txbtn{font-size:.78rem;color:var(--tx3);padding:6px 10px;border-radius:8px;transition:all .15s;display:inline-flex;align-items:center;gap:5px}
.txbtn svg{width:14px;height:14px}
.txbtn:hover{color:var(--tx);background:var(--line)}
.txbtn.danger:hover{color:var(--red)}
.drawer-list{flex:1;overflow-y:auto;padding:10px 12px 24px}
.ditem{display:flex;gap:10px;padding:11px 10px;border-radius:12px;align-items:flex-start;transition:background .13s}
.ditem:hover{background:var(--card)}
.ditem-body{flex:1;min-width:0}
.ditem-link{font-size:.89rem;line-height:1.5;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;cursor:pointer;word-break:break-all}
.ditem-link:hover{color:var(--gold)}
.ditem-meta{display:flex;align-items:center;gap:7px;font-size:.72rem;color:var(--tx3);margin-top:4px}
.dempty{display:flex;flex-direction:column;align-items:center;gap:12px;padding:70px 20px;color:var(--tx3);font-size:.86rem;text-align:center}
.dempty svg{width:44px;height:44px;opacity:.4;stroke-width:1.2}

.overlay{position:fixed;inset:0;z-index:90;background:rgba(0,0,0,.5);backdrop-filter:blur(3px);display:flex;align-items:center;justify-content:center;padding:16px;opacity:0;pointer-events:none;transition:opacity .2s}
.overlay.open{opacity:1;pointer-events:auto}
.modal{
  width:min(560px,100%);max-height:min(84vh,760px);background:var(--bg2);border:1px solid var(--line);
  border-radius:20px;box-shadow:0 24px 70px -20px rgba(0,0,0,.55);
  transform:translateY(14px) scale(.985);transition:transform .22s cubic-bezier(.32,.72,.28,1);
  display:flex;flex-direction:column;
}
.overlay.open .modal{transform:none}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:17px 20px 13px;border-bottom:1px solid var(--line)}
.modal-h h3{font-size:1.04rem;font-weight:700}
.modal-b{overflow-y:auto;padding:8px 20px 20px}
.sec{padding:15px 0;border-bottom:1px solid var(--line)}
.sec:last-child{border-bottom:0}
.sec-t{font-size:.78rem;font-weight:700;color:var(--tx2);letter-spacing:.05em;margin-bottom:11px}
.set-row{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:7px 0}
.set-row label{font-size:.9rem}
.set-row small{display:block;color:var(--tx3);font-size:.75rem;margin-top:1px}
select.mini{
  height:33px;border-radius:9px;border:1px solid var(--line);background:var(--card);color:var(--tx);
  padding:0 9px;font-size:.83rem;outline:none;cursor:pointer;
}
select.mini:focus{border-color:var(--gold)}
.theme-seg{display:inline-flex;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.theme-seg button{height:28px;padding:0 12px;border-radius:7px;font-size:.79rem;color:var(--tx2);display:inline-flex;align-items:center;gap:5px}
.theme-seg button.on{background:var(--gold);color:#161310;font-weight:600}
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:7px}
.plat-check{
  display:flex;align-items:center;gap:8px;padding:8px 10px;border:1px solid var(--line);border-radius:10px;
  font-size:.83rem;color:var(--tx2);cursor:pointer;transition:all .13s;user-select:none;
}
.plat-check:hover{border-color:var(--line-hi)}
.plat-check:has(input:checked){border-color:var(--gold);background:var(--gold-bg);color:var(--tx)}
.plat-check input{accent-color:var(--gold);width:15px;height:15px;flex:none}
textarea.words{
  width:100%;min-height:86px;resize:vertical;border:1px solid var(--line);border-radius:11px;background:var(--card);
  padding:10px 12px;font-size:.84rem;line-height:1.7;outline:none;color:var(--tx);
}
textarea.words:focus{border-color:var(--gold)}
.hint{font-size:.73rem;color:var(--tx3);margin-top:8px;line-height:1.7}
.btnrow{display:flex;gap:9px;flex-wrap:wrap}
.btn{
  height:34px;padding:0 15px;border-radius:10px;border:1px solid var(--line);background:var(--card);
  font-size:.82rem;color:var(--tx2);display:inline-flex;align-items:center;gap:6px;transition:all .15s;
}
.btn svg{width:15px;height:15px}
.btn:hover{color:var(--tx);border-color:var(--line-hi)}
.btn.warn:hover{color:var(--red);border-color:var(--red)}
.btn.primary{background:var(--gold);border-color:var(--gold);color:#161310;font-weight:600}
.btn.primary:hover{filter:brightness(1.07);color:#161310}

.toast-wrap{position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:120;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:max-content;max-width:90vw}
.toast{
  background:var(--card);border:1px solid var(--line-hi);color:var(--tx);border-radius:12px;
  padding:9px 16px;font-size:.83rem;box-shadow:var(--shadow);
  display:flex;align-items:center;gap:8px;animation:tin .22s cubic-bezier(.3,1.2,.4,1);
}
.toast svg{width:15px;height:15px;color:var(--gold)}
@keyframes tin{from{opacity:0;transform:translateY(-9px) scale(.95)}}
.toast.out{animation:tout .25s forwards}
@keyframes tout{to{opacity:0;transform:translateY(-9px)}}

.skel-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}
.skel{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px}
.sk{border-radius:8px;background:linear-gradient(100deg,var(--line) 40%,var(--line-hi) 50%,var(--line) 60%);background-size:200% 100%;animation:shim 1.3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
.sk-t{height:15px;width:42%;margin-bottom:14px}
.sk-l{height:12px;margin:9px 0}

.state-panel svg{width:46px;height:46px;opacity:.4;stroke-width:1.2}

.bottomnav{display:none}
.footer{max-width:1440px;margin:0 auto;padding:10px clamp(14px,2.5vw,28px) 30px;color:var(--tx3);font-size:.73rem;display:flex;gap:14px;flex-wrap:wrap}
kbd{
  font-family:ui-monospace,Consolas,monospace;font-size:.68rem;border:1px solid var(--line-hi);

@media (max-width:1023px){
  .layout{grid-template-columns:1fr;gap:0;padding-top:14px}
  .sidebar{display:none}
  .board-grid{grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
}

  .drawer{width:min(380px,100vw)}

  .tgl{height:28px;padding:0 9px;font-size:.76rem}
  .tgl svg{width:12px;height:12px}
  .board-grid{grid-template-columns:1fr;gap:10px}
  .skel-grid{grid-template-columns:1fr}
  .bcard{border-radius:14px;padding:12px 11px 7px}
  .bcard-h{gap:7px;padding-bottom:9px}
  .bcard-t{font-size:.92rem}
  .bcard .row{padding:5px 2px;border-radius:7px}
  .bcard .row .rk{font-size:.88rem;width:22px}

  .rk{font-size:.92rem;width:22px}
  .row-link{font-size:.88rem}

  .focus-pills{gap:6px;padding-bottom:12px}

  .bottomnav{

  .theme-seg button{height:26px;padding:0 10px;font-size:.76rem;border-radius:6px}
  .toast{padding:8px 14px;font-size:.8rem;border-radius:10px}
}

<header class="header">
  <div class="header-in">
    <div class="brand"><span class="brand-dot"></span>沸点<em>HOT AGGREGATOR</em></div>
    <div class="searchwrap">
      <svg><use href="#i-search"/></svg>
      <input id="q" type="search" placeholder="跨榜单搜索…  按 / 聚焦" autocomplete="off" enterkeyhint="search">

        <button class="side-item" data-action="view" data-v="board"><svg><use href="#i-grid"/></svg>板块墙</button>
        <button class="side-item" data-action="view" data-v="focus"><svg><use href="#i-focus"/></svg>聚焦阅读</button>
      </nav>
    </div>
    <div class="side-group">
      <h4>我的</h4>

        <button class="side-item" data-action="drawer" data-k="later"><svg><use href="#i-clock"/></svg>稍后读<span class="cnt" id="cntLater">0</span></button>
        <button class="side-item" data-action="hide-read-toggle" id="sideHideRead"><svg><use href="#i-eye-off"/></svg>隐藏已读</button>

    <div class="toolbar">

</div>

      </div>
    </div>
  </div>
</div>

<script>
"use strict";
const API = "https://uapis.cn/api/v1/misc/hotboard?type=";
const CATS = [
  ["all","全部"],["news","要闻"],["social","社交"],["video","视频"],
  ["tech","科技"],["community","社区"],["game","游戏"],["reading","阅读"]
];
const SOURCES = [
  {id:"weibo",   name:"微博",     cat:"social",    color:"#ff6b35", sub:"热搜榜"},
  {id:"zhihu",   name:"知乎",     cat:"social",    color:"#5a9cf8", sub:"热榜"},
  {id:"douyin",  name:"抖音",     cat:"video",     color:"#fe2c55", sub:"热点榜"},
  {id:"kuaishou",name:"快手",     cat:"video",     color:"#ff7e12", sub:"热榜"},
  {id:"bilibili",name:"哔哩哔哩", cat:"video",     color:"#37a5e0", sub:"热门"},
  {id:"baidu",   name:"百度",     cat:"news",      color:"#4a7df0", sub:"热搜"},
  {id:"toutiao", name:"今日头条", cat:"news",      color:"#f04142", sub:"热榜"},
  {id:"thepaper",name:"澎湃新闻", cat:"news",      color:"#8a63f2", sub:"热榜"},
  {id:"tieba",   name:"贴吧",     cat:"social",    color:"#e0662a", sub:"热议"},
  {id:"hupu",    name:"虎扑",     cat:"community", color:"#d03a2b", sub:"步行街"},
  {id:"ithome",  name:"IT之家",   cat:"tech",      color:"#2bb5a0", sub:"热榜"},
  {id:"36kr",    name:"36氪",     cat:"tech",      color:"#2f7bf6", sub:"快讯"},
  {id:"juejin",  name:"稀土掘金", cat:"tech",      color:"#1e80ff", sub:"热榜"},
  {id:"sspai",   name:"少数派",   cat:"tech",      color:"#c2453f", sub:"热榜"},
  {id:"weread",  name:"微信读书", cat:"reading",   color:"#3a9e72", sub:"飙升"},
  {id:"lol",     name:"英雄联盟", cat:"game",      color:"#c8aa6e", sub:"公告"},
  {id:"genshin", name:"原神",     cat:"game",      color:"#dfa959", sub:"资讯"}
];
const DEFAULT_ON = ["weibo","zhihu","douyin","baidu","toutiao","bilibili","ithome","36kr","juejin","hupu","thepaper","sspai"];
const PAGE = 70;

const store = {
  get(k,d){ try{ const v = localStorage.getItem("boil."+k); return v==null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k,v){ try{ localStorage.setItem("boil."+k, JSON.stringify(v)); }catch(e){} }
};

let S = Object.assign(
  { theme:"auto", interval:10, flowPer:12, enabled:null, block:[], hideRead:false },
  store.get("settings", {})
);
S.enabled = new Set(Array.isArray(S.enabled) && S.enabled.length ? S.enabled : DEFAULT_ON);

let fav    = store.get("fav", {});
let later  = store.get("later", {});
let readMap= store.get("read", {});

const State = {
  boards:{}, lastTs: store.get("ts", 0), fetching:false,
  view:"flow", focusId:S.enabled.values().next().value || "weibo",
  cat:"all", q:"", page:1
};
const REG = new Map();
let BLOCK_RE = null;

const $  = s => document.querySelector(s);
const $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s??"").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function hurl(u){ let h=5381; for(let i=0;i<u.length;i++) h=(h*33 ^ u.charCodeAt(i))>>>0; return h.toString(36); }
function debounce(fn,ms){ let t; return (...a)=>{ clearTimeout(t); t=setTimeout(()=>fn(...a),ms); }; }
function fmtHot(h){
  if(!h) return "";
  const m = /^(\d+(?:\.\d+)?)(.*)$/.exec(String(h).trim());
  if(!m) return String(h);
  const n = parseFloat(m[1]); const unit = m[2]||"";
  if(unit) return n>=10000 && !unit.trim() ? (n/10000).toFixed(1)+"万"+unit : String(h);
  return n>=100000000 ? (n/100000000).toFixed(1)+"亿" : n>=10000 ? (n/10000).toFixed(1)+"万" : m[1];
}
function fmtAgo(ts){
  if(!ts) return "—";
  const d = Date.now()-ts;
  if(d<60e3) return "刚刚";
  if(d<3600e3) return Math.floor(d/60e3)+" 分钟前";
  if(d<86400e3) return Math.floor(d/3600e3)+" 小时前";
  return Math.floor(d/86400e3)+" 天前";
}
function compileBlock(){
  const ws = S.block.map(w=>w.trim()).filter(Boolean);
  BLOCK_RE = ws.length ? new RegExp(ws.map(w=>w.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).join("|"),"i") : null;
  const el=$("#blockHint"); if(el) el.textContent = ws.length ? `已配置 ${ws.length} 个屏蔽词` : "未配置屏蔽词";
}
compileBlock();

function toast(msg, icon){
  const w=$("#toastWrap");
  const t=document.createElement("div");
  t.className="toast";
  t.innerHTML=(icon?`<svg><use href="#i-${icon}"/></svg>`:"")+esc(msg);
  w.appendChild(t);
  setTimeout(()=>{ t.classList.add("out"); setTimeout(()=>t.remove(),260); },2200);
}

function saveSettings(){ store.set("settings", Object.assign({},S,{enabled:[...S.enabled]})); }
function pruneRead(){
  const ks=Object.keys(readMap);
  if(ks.length<=4000) return;
  ks.sort((a,b)=>readMap[b]-readMap[a]);
  readMap={}; for(const k of ks.slice(0,3500)) readMap[k]=1;
  store.set("read", readMap);
}
function isRead(u){ return !!readMap[hurl(u)]; }
function markRead(u){ const k=hurl(u); if(!readMap[k]){ readMap[k]=Date.now(); pruneRead(); store.set("read", readMap);} }

function activeSources(){
  return SOURCES.filter(s=>{
    if(!S.enabled.has(s.id)) return false;
    if(State.cat!=="all" && s.cat!==State.cat) return false;
    return true;
  });
}
function board(id){ return State.boards[id] || {status:"idle", items:[], ts:0}; }

function visibleItems(items){
  const q=State.q.trim().toLowerCase();
  const out=[];
  for(const it of items){
    if(BLOCK_RE && BLOCK_RE.test(it.t)) continue;
    if(S.hideRead && isRead(it.u)) continue;
    if(q && !it.t.toLowerCase().includes(q)) continue;
    out.push(it);
  }
  return out;
}

async function fetchBoard(src){
  const ctrl=new AbortController();
  const t=setTimeout(()=>ctrl.abort(), 15000);
  try{
    const r=await fetch(API+src.id, {signal:ctrl.signal});
    if(!r.ok) throw new Error(r.status);
    const j=await r.json();
    const list=(j.list||[]).map((it,i)=> it&&it.title&&it.url ? {i:it.index||(i+1), t:String(it.title), u:String(it.url), h:fmtHot(it.hot_value||""), d:it.extra&&(it.extra.desc||it.extra.author)||""} : null).filter(Boolean);
    if(!list.length) throw new Error("empty");
    return {id:src.id, ok:true, items:list, ts:Date.now()};
  }catch(e){ return {id:src.id, ok:false}; }
  finally{ clearTimeout(t); }
}

async function refresh(){
  if(State.fetching) return;
  const srcs=SOURCES.filter(s=>S.enabled.has(s.id));
  if(!srcs.length){ render(); return; }
  State.fetching=true;
  $("#btnRefresh").classList.add("spin");
  srcs.forEach(s=>{ State.boards[s.id]={...board(s.id), status:"loading"}; });
  if(State.view==="board" || !State.lastTs) render();
  const rs=await Promise.allSettled(srcs.map(fetchBoard));
  let ok=0;
  for(const r of rs){
    const v=r.status==="fulfilled"?r.value:r.reason;
    const b=v&&v.ok ? {status:"ok",items:v.items,ts:v.ts} : {status:"fail",items:[],ts:0};
    State.boards[v.id]=b; if(v.ok) ok++;
  }
  State.fetching=false;
  $("#btnRefresh").classList.remove("spin");
  if(ok>0){
    State.lastTs=Date.now();
    store.set("ts",State.lastTs);
    const cache={ts:State.lastTs,boards:{}};
    for(const s of srcs) if(State.boards[s.id].status==="ok") cache.boards[s.id]={items:State.boards[s.id].items, ts:State.boards[s.id].ts};
    store.set("cache",cache);
    toast(`已更新 ${ok}/${srcs.length} 个榜单`,"check");
  }else{
    toast("网络异常，更新失败，请稍后重试","alert");
  }
  resetTimer();
  updateRel();
  render();
}

let timer=null;
function resetTimer(){
  clearInterval(timer);
  const m=+S.interval||0;
  if(m>0) timer=setInterval(()=>{ if(!document.hidden && navigator.onLine!==false) refresh(); }, m*60000);
}
document.addEventListener("visibilitychange",()=>{
  if(!document.hidden){
    const limit=Math.min((+S.interval||10)*60000, 10*60000);
    if(Date.now()-State.lastTs>limit) refresh();
  }
});

function loadCache(){
  const c=store.get("cache",null);
  if(c&&c.boards){
    for(const [id,b] of Object.entries(c.boards)){
      if(b&&Array.isArray(b.items)&&b.items.length) State.boards[id]={status:"ok",items:b.items,ts:b.ts||c.ts};
    }
  }
}

function rowHTML(it,src,compact){
  const key=hurl(it.u);
  it._sid=src.id;
  REG.set(key,it);
  const f=!!fav[it.u], l=!!later[it.u], r=isRead(it.u);
  return `<div class="row${r?" is-read":""}">
    <span class="rk rk-${it.i<=3?it.i:""}">${it.i}</span>
    <div class="row-main">
      <a class="row-link" href="${esc(it.u)}" target="_blank" rel="noopener noreferrer nofollow" data-k="${key}">${hl(it.t)}</a>
      ${compact?`<div class="row-meta"><span class="dot" style="--c:${src.color}"></span>${esc(src.name)}${it.h?`<i>·</i><b>${esc(it.h)}</b>`:""}</div>`:(it.h?`<div class="row-meta"><b>${esc(it.h)}</b>${it.d?`<i>·</i><span>${esc(String(it.d).slice(0,40))}</span>`:""}</div>`:"")}
    </div>
    <div class="row-acts">
      <button class="act${f?" on":""}" data-action="fav" data-k="${key}" title="${f?"取消收藏":"收藏"}"><svg><use href="#i-star"/></svg></button>
      <button class="act${l?" on":""}" data-action="later" data-k="${key}" title="${l?"移出稍后读":"稍后阅读"}"><svg><use href="#i-clock"/></svg></button>
    </div>
  </div>`;
}
function hl(t){
  const e=esc(t);
  const k=State.q.trim();
  if(!k) return e;
  try{ return e.replace(new RegExp("("+k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+")","gi"),"<mark>$1</mark>"); }
  catch(err){ return e; }
}

function buildFlow(){
  const lists=activeSources().map(s=>({s,items:visibleItems(board(s.id).items).slice(0,S.flowPer)})).filter(l=>l.items.length);
  const max=Math.max(0,...lists.map(l=>l.items.length));
  const arr=[];
  for(let i=0;i<max;i++) for(const l of lists){ const it=l.items[i]; if(it) arr.push({it,s:l.s}); }
  return arr;
}

function renderSkeleton(){
  $("#content").innerHTML=`<div class="skel-grid">${'<div class="skel"><div class="sk sk-t"></div>'+Array.from({length:7},()=>'<div class="sk sk-l"></div>').join("")+"</div>"}</div>`;
}
function renderError(){
  $("#content").innerHTML=`<div class="state-panel"><svg><use href="#i-alert"/></svg><div>榜单加载失败<br>请检查网络后重试</div><button class="retry" data-action="refresh">重新加载</button></div>`;
}

let io=null;
function renderFlow(){
  const flow=buildFlow();
  if(!flow.length){
    $("#content").innerHTML = State.q.trim()
      ? `<div class="empty-q"><svg style="width:34px;height:34px;opacity:.4"><use href="#i-search"/></svg>没有匹配「${esc(State.q)}」的内容</div>`
      : `<div class="state-panel"><svg><use href="#i-flow"/></svg><div>暂无内容<br>请确认已启用平台或点击刷新</div><button class="retry" data-action="refresh">立即刷新</button></div>`;
    return;
  }
  State.page=Math.max(1,+State.page||1);
  const slice=flow.slice(0, State.page*PAGE);
  let html="";
  for(const {it,s} of slice) html+=rowHTML(it,s,true)+'<div class="flow-sep"></div>';
  if(flow.length>slice.length) html+='<div id="sentinel" style="height:8px"></div>';
  $("#content").innerHTML=`<div class="flow-list">${html}</div>`;
  if(io) io.disconnect();
  const sn=$("#sentinel");
  if(sn) io=new IntersectionObserver(es=>{ if(es.some(e=>e.isIntersecting)){ State.page++; io.disconnect(); io=null; renderFlowPreserve(); } },{rootMargin:"900px"}).observe(sn);
}
function renderFlowPreserve(){
  const y=window.scrollY;
  renderFlow();
  window.scrollTo({top:y});
}

function renderBoards(){
  const srcs=activeSources();
  if(!srcs.length){ $("#content").innerHTML='<div class="state-panel"><svg><use href="#i-grid"/></svg>当前分类下没有启用的平台</div>'; return; }
  let html='<div class="board-grid">';
  for(const s of srcs){
    const b=board(s.id);
    const vis=visibleItems(b.items);
    if(b.status==="fail"){
      html+=`<div class="bcard"><div class="bcard-h"><span class="dot" style="--c:${s.color}"></span><span class="bcard-t">${esc(s.name)}</span><span class="bcard-sub">${esc(s.sub)}</span><span class="bcard-n">不可用</span></div><div class="bcard-fail">暂时无法获取该榜单<button class="retry" data-action="retry" data-id="${s.id}">重试</button></div></div>`;
      continue;
    }
    if(!vis.length){
      html+=`<div class="bcard"><div class="bcard-h"><span class="dot" style="--c:${s.color}"></span><span class="bcard-t">${esc(s.name)}</span><span class="bcard-sub">${esc(s.sub)}</span><span class="bcard-n">${State.q.trim()?"无匹配":b.status==="loading"?"加载中…":"暂无"}</span></div></div>`;
      continue;
    }
    const N=12;
    const rows=(b.expanded?vis:vis.slice(0,N)).map(it=>rowHTML(it,s,false)).join("");
    html+=`<div class="bcard">
      <div class="bcard-h"><span class="dot" style="--c:${s.color}"></span><span class="bcard-t">${esc(s.name)}</span><span class="bcard-sub">${esc(s.sub)}</span><span class="bcard-n">${vis.length} 条 · ${fmtAgo(b.ts)}</span></div>
      ${rows}
      ${vis.length>N?`<button class="bcard-more${b.expanded?" open":""}" data-action="expand-board" data-id="${s.id}">${b.expanded?"收起":"展开全部 "+vis.length+" 条"}<svg><use href="#i-chev-d"/></svg></button>`:""}
    </div>`;
  }
  $("#content").innerHTML=html+"</div>";
}

function renderFocus(){
  const srcs=activeSources();
  if(!srcs.length){ $("#content").innerHTML='<div class="state-panel"><svg><use href="#i-focus"/></svg>当前分类下没有启用的平台</div>'; return; }
  if(!srcs.find(s=>s.id===State.focusId)) State.focusId=srcs[0].id;
  const cur=srcs.find(s=>s.id===State.focusId);
  const pills=srcs.map(s=>`<button class="fpill${s.id===State.focusId?" on":""}" data-action="focus-set" data-id="${s.id}"><span class="dot" style="--c:${s.color}"></span>${esc(s.name)}</button>`).join("");
  const b=board(cur.id);
  const vis=visibleItems(b.items);
  let body="";
  if(b.status==="fail"){
    body=`<div class="state-panel"><svg><use href="#i-alert"/></svg>暂时无法获取「${esc(cur.name)}」榜单<button class="retry" data-action="retry" data-id="${cur.id}">重试</button></div>`;
  }else if(!vis.length){
    body=b.status==="loading"
      ? `<div class="skel">${Array.from({length:9},()=>'<div class="sk sk-l"></div>').join("")}</div>`
      : `<div class="empty-q">该榜单暂无可显示的内容</div>`;
  }else{
    body=vis.map(it=>rowHTML(it,cur,false).replace('class="row','class="frow')).join("");
  }
  $("#content").innerHTML=`<div class="focus-pills">${pills}</div><div class="focus-head"><h2 style="color:${esc(cur.color)}">${esc(cur.name)} · ${esc(cur.sub)}</h2><span>${vis.length?`${vis.length} 条 · 更新于 ${fmtAgo(b.ts)}`:""}</span></div>${body}`;
}

function renderStats(){
  const srcs=SOURCES.filter(s=>S.enabled.has(s.id));
  let total=0,on=0;
  for(const s of srcs){ const b=board(s.id); if(b.status==="ok"){on++; total+=visibleItems(b.items).length;} }
  $("#sideStats").innerHTML=`已启用 ${srcs.length} 个平台<br>在线 ${on} · 共 ${total} 条内容<br>上次更新 ${fmtAgo(State.lastTs)}`;
}
function renderCounts(){
  const nf=Object.keys(fav).length, nl=Object.keys(later).length;
  $("#cntFav").textContent=nf; $("#cntLater").textContent=nl;
  const bf=$("#bnCntFav"), bl=$("#bnCntLater");

}
function syncViewUI(){
  $$("#viewSeg button").forEach(b=>b.classList.toggle("on",b.dataset.v===State.view));
  $$("#sideViews .side-item").forEach(b=>b.classList.toggle("on",b.dataset.v===State.view));
  $$(".bn-item[data-v]").forEach(b=>b.classList.toggle("on",b.dataset.v===State.view));

}
function render(){

  else renderFocus();

  obj[url]=extra; store.set(key,obj); toast(msgOn,key==="fav"?"star":"clock"); return true;

const settingsOpen=()=>$("#settingsOverlay").classList.add("open");
const settingsClose=()=>$("#settingsOverlay").classList.remove("open");

  $("#selInterval").value=String(S.interval);

  compileBlock();

function applyTheme(){

  const t=dark?"dark":"light";
  document.documentElement.dataset.theme=t;
  $("#metaTheme").content = dark?"#0a0b0f":"#f5f4ef";
  $("#themeIcon").innerHTML='<use href="#i-'+(dark?"sun":"moon")+'"/>';
}
matchMedia("(prefers-color-scheme: dark)").addEventListener("change",()=>{ if(S.theme==="auto") applyTheme(); });

function updateRel(){
  $$(".js-rel").forEach(el=>el.textContent=fmtAgo(State.lastTs));
}

function exportJSON(data,name){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:"application/json"});
  const a=document.createElement("a");
  a.href=URL.createObjectURL(blob);
  a.download=name;
  a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),3000);
}

document.addEventListener("click",e=>{
  const link=e.target.closest("a[data-k]");
  if(link){
    const it=REG.get(link.dataset.k);
    if(it){
      markRead(it.u);
      const row=link.closest(".row,.frow");
      if(row) row.classList.add("is-read");
      const dl=link.closest(".ditem");
      if(dl && State.drawerKind==="later"){ removeFrom(later,it.u,"later"); renderDrawer(); renderCounts(); return; }
    }
  }
  const el=e.target.closest("[data-action]");
  if(!el) return;
  const act=el.dataset.action;

  switch(act){
    case "refresh": refresh(); break;
    case "retry":{
      const s=SOURCES.find(x=>x.id===el.dataset.id);
      if(s&&!State.fetching){
        fetchBoard(s).then(r=>{
          State.boards[s.id]=r.ok?{status:"ok",items:r.items,ts:r.ts}:{status:"fail",items:[],ts:0};
          if(r.ok){ State.lastTs=Math.max(State.lastTs,r.ts); store.set("ts",State.lastTs); }
          render(); updateRel();
          toast(r.ok?`「${s.name}」已恢复`:`「${s.name}」仍然失败`, r.ok?"check":"alert");
        });
      }
      break;
    }
    case "view":
      State.view=el.dataset.v; State.page=1;
      closeDrawer();
      if(State.view==="focus"){
        const srcs=activeSources();
        if(srcs.length&&!srcs.find(s=>s.id===State.focusId)) State.focusId=srcs[0].id;
      }
      render();
      break;
    case "focus-set": State.focusId=el.dataset.id; renderFocus(); syncViewUI(); break;
    case "expand-board":{ const b=State.boards[el.dataset.id]; if(b){ b.expanded=!b.expanded; const y=window.scrollY; renderBoards(); window.scrollTo({top:y}); } break; }
    case "cat": State.cat=el.dataset.c; State.page=1; renderCatChips(); render(); break;
    case "hide-read-toggle":
      S.hideRead=!S.hideRead; saveSettings();
      State.page=1; render();
      toast(S.hideRead?"已隐藏已读内容":"已显示全部内容","eye-off");
      break;
    case "fav":{
      const it=REG.get(el.dataset.k);
      if(it) favAction(it,el);
      break;
    }
    case "later":{
      const it=REG.get(el.dataset.k);
      if(it) toggleLater(it);
      break;
    }
    case "drawer": openDrawer(el.dataset.k); break;
    case "close-drawer": closeDrawer(); break;
    case "remove-from":{
      const kind=el.dataset.kind, url=el.dataset.u;
      removeFrom(kind==="fav"?fav:later,url,kind);
      renderDrawer(); renderCounts();
      break;
    }
    case "clear-list":{
      const kind=State.drawerKind;
      if(el.dataset.confirm){
        const obj=kind==="fav"?fav:later;
        const n=Object.keys(obj).length;
        obj={}; store.set(kind,obj);
        if(kind==="fav")fav=obj; else later=obj;
        renderDrawer(); renderCounts();
        el.textContent="清空"; delete el.dataset.confirm;
        toast(`已清空 ${n} 条记录`,"trash");
      }else{
        el.dataset.confirm="1"; el.textContent="确认清空？";
        setTimeout(()=>{ if(el.isConnected){ el.textContent="清空"; delete el.dataset.confirm; } },2600);
      }
      break;
    }
    case "export-list":{
      const kind=State.drawerKind;
      const obj=kind==="fav"?fav:later;
      const entries=Object.entries(obj).map(([u,it])=>({title:it.t,url:it.u,source:it.s,savedAt:new Date(it.c).toISOString()}));
      if(!entries.length){ toast("列表为空","alert"); break; }
      exportJSON(entries,`boiling-${kind}-${new Date().toISOString().slice(0,10)}.json`);
      toast(`已导出 ${entries.length} 条`,"export");
      break;
    }
    case "settings": syncSettingsUI(); settingsOpen(); break;
    case "close-settings": settingsClose(); break;
    case "set-theme":
      S.theme=el.dataset.t; saveSettings(); applyTheme(); syncSettingsUI();
      break;
    case "theme-cycle":
      { const order=["auto","dark","light"]; const next=order[(order.indexOf(S.theme)+1)%3];
        S.theme=next; saveSettings(); applyTheme();
        toast(next==="auto"?"跟随系统主题":next==="dark"?"深色模式":"浅色模式", next==="dark"?"moon":"sun");
      }
      break;
    case "save-block":
      S.block=$("#taWords").value.split(/\n+/).map(x=>x.trim()).filter(Boolean);
      saveSettings(); compileBlock(); render();
      toast(BLOCK_RE?"屏蔽词已生效":"屏蔽词已清空","check");
      break;
    case "clear-read":
      readMap={}; store.set("read",readMap);
      render(); toast("已清除全部已读记录","check");
      break;
    case "export-all":
      exportJSON({favorites:fav,readLater:later,exportedAt:new Date().toISOString()},"boiling-all-data.json");
      toast("已导出全部数据","export");
      break;
    case "reset-all":
      if(el.dataset.confirm){
        ["settings","fav","later","read","cache","ts"].forEach(k=>localStorage.removeItem("boil."+k));
        location.reload();
      }else{
        el.dataset.confirm="1"; el.innerHTML='<svg><use href="#i-alert"/></svg>再次点击确认重置';
        setTimeout(()=>{ if(el.isConnected){ delete el.dataset.confirm; el.innerHTML='<svg><use href="#i-trash"/></svg>重置全部数据'; } },2800);
      }
      break;
    case "clear-q": $("#q").value=""; State.q=""; $("#qclear").style.display="none"; render(); break;
  }
});

function renderCatChips(){
  $("#catChips").innerHTML=CATS.map(([id,label])=>`<button class="chip${State.cat===id?" on":""}" data-action="cat" data-c="${id}">${label}</button>`).join("");
}

function favAction(it,btn){
  const src=SOURCES.find(s=>s.id===it._sid);
  const rec={u:it.u,t:it.t,s:src?src.name:"",c:Date.now()};
  if(fav[it.u]){ delete fav[it.u]; store.set("fav",fav); btn&&btn.classList.remove("on"); toast("已取消收藏"); }
  else{ fav[it.u]=rec; store.set("fav",fav); btn&&btn.classList.add("on"); toast("已加入收藏","star"); }
  renderCounts();
}
function toggleLater(it){
  const src=SOURCES.find(s=>s.id===it._sid);
  const rec={u:it.u,t:it.t,s:src?src.name:"",c:Date.now()};
  if(later[it.u]){ delete later[it.u]; store.set("later",later); toast("已移出稍后读"); }
  else{ later[it.u]=rec; store.set("later",later); toast("已加入稍后读","clock"); }
  document.querySelectorAll(`.act[data-action="later"][data-k="${hurl(it.u)}"]`).forEach(b=>b.classList.toggle("on",!!later[it.u]));
  renderCounts();
}
function removeFrom(obj,url,kind){
  if(obj[url]){ delete obj[url]; store.set(kind,obj); renderCounts(); }
}

document.addEventListener("change",e=>{
  const p=e.target.closest("[data-plat]");
  if(p){
    if(p.checked) S.enabled.add(p.dataset.plat); else S.enabled.delete(p.dataset.plat);
    saveSettings();
    const srcs=activeSources();
    if(!srcs.find(s=>s.id===State.focusId)&&srcs.length) State.focusId=srcs[0].id;
    State.page=1;
    render();
    toast(`已启用 ${S.enabled.size} 个平台`,"check");
    return;
  }
  if(e.target.id==="selInterval"){
    S.interval=+e.target.value; saveSettings(); resetTimer();
    toast(S.interval>0?`将每 ${S.interval} 分钟自动更新`:"已关闭定时更新","clock");
  }
  if(e.target.id==="selFlowPer"){ S.flowPer=+e.target.value; saveSettings(); if(State.view==="flow") render(); }
});

$("#q").addEventListener("input",debounce(e=>{
  State.q=e.target.value;
  $("#qclear").style.display=State.q?"flex":"none";
  State.page=1;
  REG.clear();
  if(State.view==="flow") renderFlow(); else if(State.view==="board") renderBoards(); else renderFocus();
},180));

document.addEventListener("keydown",e=>{
  if(e.target.matches("input,textarea,select")){ if(e.key==="Escape") e.target.blur(); return; }
  if(e.metaKey||e.ctrlKey||e.altKey) return;
  if(e.key==="/"){ e.preventDefault(); $("#q").focus(); }
  else if(e.key.toLowerCase()==="r"){ e.preventDefault(); refresh(); }
  else if(e.key==="1"){ State.view="flow"; State.page=1; render(); }
  else if(e.key==="2"){ State.view="board"; State.page=1; render(); }
  else if(e.key==="3"){ State.view="focus"; State.page=1; render(); }
  else if(e.key==="Escape"){ settingsClose(); closeDrawer(); }
});

$("#settingsOverlay").addEventListener("click",e=>{ if(e.target.id==="settingsOverlay") settingsClose(); });

setInterval(updateRel,20000);

renderCatChips();
applyTheme();
loadCache();
if(Object.keys(State.boards).length){
  render();
  updateRel();
}else{
  renderSkeleton();
}
refresh();
resetTimer();
renderCounts();
</script>
</body>
</html>
