const playSound = type => {
  try {
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    if (type === 'hit') {
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'block') {
      osc.type = 'square';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.1);
    } else if (type === 'buff') {
      osc.type = 'sine';
      osc.frequency.setValueAtTime(400, audioCtx.currentTime);
      osc.frequency.linearRampToValueAtTime(600, audioCtx.currentTime + 0.1);
      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.2);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.2);
    } else if (type === 'relic' || type === 'victory') {
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(440, audioCtx.currentTime);
      osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1);
      osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.5);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }
  } catch (e) {
    // Audio failed
  }
};

const dealDamage = (state, amount, times = 1) => {
  let ns = {
    ...state,
    player: {
      ...state.player
    },
    enemy: {
      ...state.enemy
    },
    history: [...state.history],
    animations: [...state.animations]
  };
  let totalDmg = 0;

  // 遗物：苦痛之锤 (伤害提升 25%)
  const dmgMultiplier = ns.relics.some(r => r.effectType === 'damage_boost_cost_hp') ? 1.25 : 1;
  const enemyTrait = ENEMIES.find(e => e.name === ns.enemyName)?.trait || '';
  // 遗物：钢笔尖 (伤害翻倍)
  const penNibMultiplier = ns.penNibActive ? 2 : 1;
  if (ns.penNibActive) ns.penNibActive = false;
  for (let i = 0; i < times; i++) {
    let dmg = Math.floor((amount + ns.player.strength) * dmgMultiplier * penNibMultiplier);
    if (ns.player.weak > 0) dmg = Math.floor(dmg * 0.75);

    // 遗物：纸蛙 (易伤提升)
    const vulnMultiplier = ns.relics.some(r => r.effectType === 'paper_frog') ? 1.75 : 1.5;
    if (ns.enemy.vulnerable > 0) dmg = Math.floor(dmg * vulnMultiplier);

    // 怪物特性：残影 (受到攻击时35%概率闪避)
    if (enemyTrait.includes('残影') && Math.random() < 0.35) {
      ns.animations.push({ id: generateId(), type: 'status', value: '闪避!', target: 'enemy' });
      ns.history = ['【特性】幻影刺客瞬移躲避了攻击！', ...ns.history];
      continue;
    }
    // 怪物特性：隐匿 (每3回合免疫一次攻击)
    if (enemyTrait.includes('隐匿') && ns.turn % 3 === 0 && !ns.enemyFlags.includes('隐匿已触发')) {
      ns.enemyFlags = [...ns.enemyFlags, '隐匿已触发'];
      ns.animations.push({ id: generateId(), type: 'status', value: '闪避!', target: 'enemy' });
      ns.history = ['【隐匿】刺客隐入暗影，免疫了攻击！', ...ns.history];
      continue;
    }

    // 怪物特性：坚不可摧 (单次伤害不超过 15)
    if (enemyTrait.includes('坚不可摧')) dmg = Math.min(dmg, 15);

    if (ns.enemy.block >= dmg) {
      ns.enemy.block -= dmg;
      ns.animations.push({
        id: generateId(),
        type: 'block',
        value: `-${dmg}`,
        target: 'enemy'
      });
    } else {
      const remains = dmg - ns.enemy.block;
      ns.enemy.block = 0;
      ns.enemy.hp = Math.max(0, ns.enemy.hp - remains);
      totalDmg += remains;
      ns.animations.push({
        id: generateId(),
        type: 'damage',
        value: `-${remains}`,
        target: 'enemy'
      });
      ns.animations.push({
        id: generateId(),
        type: 'shake',
        value: '',
        target: 'enemy'
      });
    }
    if (dmg > 0) {
      if (enemyTrait.includes('激怒')) {
        ns.enemy.strength += 1;
        ns.animations.push({
          id: generateId(),
          type: 'status',
          value: '力量 +1',
          target: 'enemy'
        });
      }
      if (enemyTrait.includes('荆棘') || enemyTrait.includes('尖刺')) {
        let reflect = enemyTrait.includes('荆棘') ? 3 : Math.floor(dmg * 0.5);

        // 先抵消格挡
        if (ns.player.block > 0) {
          const blockTaken = Math.min(ns.player.block, reflect);
          ns.player.block -= blockTaken;
          reflect -= blockTaken;
          ns.animations.push({
            id: generateId(),
            type: 'block',
            value: `-${blockTaken}`,
            target: 'player'
          });
        }

        // 剩余伤害扣除血量
        if (reflect > 0) {
          ns.player.hp = Math.max(0, ns.player.hp - reflect);
          ns.animations.push({
            id: generateId(),
            type: 'damage',
            value: `-${reflect}`,
            target: 'player'
          });
        }
        ns.history = [`【特性】反弹伤害生效，扣除格挡/血量`, ...ns.history];
      }
      if (enemyTrait.includes('受击时玩家可能随机丢弃手牌') && Math.random() < 0.2 && ns.hand.length > 0) {
        const idx = Math.floor(Math.random() * ns.hand.length);
        const card = ns.hand[idx];
        ns.hand.splice(idx, 1);
        ns.discard.push(card);
        ns.history = [`【特性】腐蚀使你丢弃了 ${card.name}`, ...ns.history];
      }
    }
  }
  ns.history = [`造成了 ${totalDmg} 点伤害`, ...ns.history];
  // 怪物特性：吞噬 (血量每减少20%吞噬一张遗物)
  if (enemyTrait.includes('吞噬') && ns.relics && ns.relics.length > 0) {
    const hpPercent = ns.enemy.hp / ns.enemy.maxHp;
    const consumedKey = '吞噬_已触发_' + Math.ceil((1 - hpPercent) * 5);
    if (!ns.enemyFlags.includes(consumedKey) && hpPercent < 1) {
      const relicIdx = Math.floor(Math.random() * ns.relics.length);
      const consumedRelic = ns.relics.splice(relicIdx, 1)[0];
      if (consumedRelic) {
        ns.enemyFlags = [...ns.enemyFlags, consumedKey];
        ns.history = ['【吞噬】深渊爬行者吞噬了你的遗物: ' + consumedRelic.name + '！', ...ns.history];
      }
    }
  }
  return ns;
};
const addBlock = (state, amount) => {
  const ns = {
    ...state,
    player: {
      ...state.player
    },
    history: [...state.history],
    animations: [...state.animations]
  };
  // 怪物特性：威慑 - 护甲效果减少25%
  const trait = ns.enemyName ? (ENEMIES.find(e => e.name === ns.enemyName)?.trait || '') : '';
  if (trait.includes('威慑')) amount = Math.floor(amount * 0.75);
  ns.player.block += amount;
  ns.animations.push({
    id: generateId(),
    type: 'status_block',
    value: `+${amount}`,
    target: 'player'
  });
  ns.history = [`获得了 ${amount} 点格挡`, ...ns.history];
  return ns;
};
const applyStatus = (state, target, status, amount, label) => {
  const ns = {
    ...state,
    player: {
      ...state.player
    },
    enemy: {
      ...state.enemy
    },
    history: [...state.history],
    animations: [...state.animations]
  };
  // 遗物：皇家药水 (施加状态时额外多施加1层)
  if (ns.relics && ns.relics.some(r => r.effectType === 'status_extra_stack')) amount += 1;
  ns[target][status] += amount;
  ns.animations.push({
    id: generateId(),
    type: 'status',
    value: `${label} +${amount}`,
    target
  });
  ns.history = [`施加了 ${amount} 层${label}`, ...ns.history];
  return ns;
};
const drawCards = (state, count) => {
  let ns = {
    ...state,
    deck: [...state.deck],
    hand: [...state.hand],
    discard: [...state.discard],
    history: [...state.history]
  };
  let drawn = 0;
  for (let i = 0; i < count; i++) {
    if (ns.deck.length === 0) {
      if (ns.discard.length === 0) break;
      ns.deck = shuffle(ns.discard);
      ns.discard = [];
    }
    if (ns.hand.length >= 10) break;
    const c = ns.deck.pop();
    if (c && !ns.hand.some(h => h.id === c.id)) {
      ns.hand.push(c);
      drawn++;
    }
  }
  ns.history = [`抽了 ${drawn} 张牌`, ...ns.history];
  return ns;
};
const getTypeColor = type => {
  switch (type) {
    case '攻击':
      return 'bg-red-600';
    case '防御':
      return 'bg-blue-600';
    case '增益':
      return 'bg-amber-600';
    case '减益':
      return 'bg-purple-600';
    case '毒术':
      return 'bg-emerald-600';
    default:
      return 'bg-slate-600';
  }
};

  });
};

const generateRewards = (enemyLevel, floor) => {
  try {
    let maxRarity = 2;
    if (enemyLevel === '劲敌') maxRarity = 3;
    if (['精英', '首领', '魔王'].includes(enemyLevel)) maxRarity = 4;
    const eligibleCards = ALL_CARDS.filter(cardFactory => {
      const testCard = cardFactory();
      return testCard && testCard.rarity <= maxRarity;
    });
    const selectedFactories = sampleSize(eligibleCards, 3);
    return selectedFactories.map(factory => factory());
  } catch(e) {
    console.error('generateRewards failed:', e);
    return [];
  }
};
