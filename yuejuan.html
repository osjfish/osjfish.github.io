/* ============================================================
   第三段：识别管线（二值化/锚点/单应/同步条/OMR/主观题切割）
   ============================================================ */

/* ---------- 图像加载 ---------- */
async function blobCanvas(blob,maxLong){
  const img=await createImageBitmap(blob);
  const scale=Math.min(1,maxLong/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  return {cv:cv,scale:scale,srcW:img.width,srcH:img.height};
}
async function pdfToCanvases(file,maxLong){
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  const out=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i);
    const vp=pg.getViewport({scale:1});
    /* PDF 是矢量内容：必须按目标分辨率渲染（A4 在 72dpi 下仅 595×842pt），
       不能像位图一样封顶在 1——否则整份 PDF 永远按 72dpi 输出，切割图模糊、锚点识别退化 */
    const scale=maxLong/Math.max(vp.width,vp.height);
    const vp2=pg.getViewport({scale:scale});
    const cv=document.createElement('canvas');cv.width=Math.round(vp2.width);cv.height=Math.round(vp2.height);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:ctx,viewport:vp2}).promise;
    out.push(cv);
  }
  return out;
}
async function filesToCanvases(files,maxLong){
  const out=[];
  for(const f of Array.from(files||[])){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name||'')){
      const pages=await pdfToCanvases(f,maxLong);
      pages.forEach(function(cv){out.push({cv:cv,file:f.name,pageNo:out.length+1})});
    }else{
      const r=await blobCanvas(f,maxLong);
      out.push({cv:r.cv,file:f.name,pageNo:out.length+1});
    }
  }
  return out;
}

/* ---------- 灰度与自适应二值化 ---------- */
function toGray(cv){
  const w=cv.width,h=cv.height;
  const d=cv.getContext('2d').getImageData(0,0,w,h).data;
  const gray=new Uint8Array(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++)gray[j]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;
  return {gray:gray,w:w,h:h};
}
function binarize(gray,w,h,k,win){
  const I=new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++){
    let rowSum=0;
    const yc=(y+1)*(w+1),yp=y*(w+1);
    for(let x=0;x<w;x++){
      rowSum+=gray[y*w+x];
      I[yc+x+1]=I[yp+x+1]+rowSum;
    }
  }
  const bin=new Uint8Array(w*h);
  for(let y=0;y<h;y++){
    const y0=Math.max(0,y-win),y1=Math.min(h-1,y+win);
    for(let x=0;x<w;x++){
      const x0=Math.max(0,x-win),x1=Math.min(w-1,x+win);
      const sum=I[(y1+1)*(w+1)+x1+1]-I[y0*(w+1)+x1+1]-I[(y1+1)*(w+1)+x0]+I[y0*(w+1)+x0];
      const m=sum/((y1-y0+1)*(x1-x0+1));
      bin[y*w+x]=gray[y*w+x]<m*k?1:0;
    }
  }
  return bin;
}

/* ---------- 全局四角锚点（通用：照片带背景、未充满画面、倾斜） ---------- */
function globalSolids(bin,w,h,minArea,maxArea){
  const vis=new Uint8Array(w*h);
  const out=[];
  const step=3;
  for(let y=1;y<h-1;y+=step)for(let x=1;x<w-1;x+=step){
    if(!bin[y*w+x]||vis[y*w+x])continue;
    /* BFS */
    let area=0,sx=0,sy=0,mx=x,Mx=x,my=y,My=y;
    const stack=[x,y];vis[y*w+x]=1;
    while(stack.length){
      const py=stack.pop(),px2=stack.pop();
      area++;sx+=px2;sy+=py;
      if(px2<mx)mx=px2;if(px2>Mx)Mx=px2;if(py<my)my=py;if(py>My)My=py;
      if(px2+1<w&&!vis[py*w+px2+1]&&bin[py*w+px2+1]){vis[py*w+px2+1]=1;stack.push(px2+1,py);}
      if(px2-1>0&&!vis[py*w+px2-1]&&bin[py*w+px2-1]){vis[py*w+px2-1]=1;stack.push(px2-1,py);}
      if(py+1<h&&!vis[(py+1)*w+px2]&&bin[(py+1)*w+px2]){vis[(py+1)*w+px2]=1;stack.push(px2,py+1);}
      if(py-1>0&&!vis[(py-1)*w+px2]&&bin[(py-1)*w+px2]){vis[(py-1)*w+px2]=1;stack.push(px2,py-1);}
    }
    const bw2=Mx-mx+1,bh2=My-my+1;
    if(area<minArea||area>maxArea)continue;
    const asp=bw2/bh2;
    if(asp<0.7||asp>1.4)continue;
    const sol=area/(bw2*bh2);
    /* JPEG 噪声会在实心黑块内产生空洞（自适应阈值在黑块内塌陷），solidity 可能降到 0.65 左右；
       干扰图形（边框环/L形）远低于此，0.6 有充足余量 */
    if(sol<0.6)continue;
    /* 排除噪点：相对面积过滤 */
    out.push({x:sx/area,y:sy/area,area:area,w:bw2,h:bh2,cx:mx+Mx>>1,cy:my+My>>1});
  }
  return out;
}
function pickQuad(cands){
  if(!cands||cands.length<4)return null;
  cands=cands.slice().sort(function(a,b){return b.area-a.area}).slice(0,10);
  const dist=function(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)};
  let best=null;
  for(let i=0;i<cands.length;i++)for(let j=i+1;j<cands.length;j++)for(let k=j+1;k<cands.length;k++)for(let l=k+1;l<cands.length;l++){
    const C=[cands[i],cands[j],cands[k],cands[l]];
    /* 面积同量级硬约束：四角必须都是大锚（5mm 小锚面积约为大锚 31%，混入则 ratio>2.6）
       小锚混配会把“大锚 mm 坐标↔小锚像素”配进单应，导致切割图纵横比例失真（格子变扁） */
    let aMin=Infinity,aMax=0;
    for(let ci=0;ci<4;ci++){const ar=C[ci].area;if(ar<aMin)aMin=ar;if(ar>aMax)aMax=ar;}
    if(aMax>aMin*2.6)continue;
    let TL=C[0];
    let TR=C[0];
    let BR=C[0];
    let BL=C[0];
    C.forEach(function(c){
      if(c.x+c.y<TL.x+TL.y)TL=c;
      if(c.x-c.y>TR.x-TR.y)TR=c;
      if(c.x+c.y>BR.x+BR.y)BR=c;
      if(c.x-c.y<BL.x-BL.y)BL=c;
    });
    if(TL===TR||TL===BR||TL===BL||TR===BR||TR===BL||BR===BL)continue;
    const wT=dist(TL,TR),wB=dist(BL,BR),hL=dist(TL,BL),hR=dist(TR,BR);
    if(wT<30||wB<30||hL<30||hR<30)continue;
    if(wT/wB<0.65||wT/wB>1.55)continue;
    if(hL/hR<0.65||hL/hR>1.55)continue;
    const asp=(wT+wB)/(hL+hR);
    if(asp<0.5||asp>1.8)continue;
    const score=wT*wB*hL*hR;
    if(!best||score>best.score)best={score:score,TL:TL,TR:TR,BR:BR,BL:BL,wT:wT,wB:wB,hL:hL,hR:hR};
  }
  return best;
}

function pickTriSmart(cands){
  if(!cands||cands.length<4)return null;
  const areas=cands.map(function(c){return c.area}).sort(function(a,b){return b-a});
  const bigA=areas[0];
  const bigs=cands.filter(function(c){return c.area>=bigA*0.5});
  const smalls=cands.filter(function(c){return c.area<bigA*0.5&&c.area>=bigA*0.08});
  if(bigs.length<3||smalls.length<2)return null;
  const dist=function(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)};
  const sL=smalls.reduce(function(a,b){return b.x<a.x?b:a});
  const sR=smalls.reduce(function(a,b){return b.x>a.x?b:a});
  let TLbig=null,TRbig=null;
  bigs.forEach(function(b){
    const dl=dist(b,sL),dr=dist(b,sR);
    if(!TLbig||dl<dist(TLbig,sL))TLbig=b;
    if(!TRbig||dr<dist(TRbig,sR))TRbig=b;
  });
  if(TLbig===TRbig)return null;
  const third=bigs.find(function(b){return b!==TLbig&&b!==TRbig});
  if(!third)return null;
  const top={x:TRbig.x-TLbig.x,y:TRbig.y-TLbig.y};
  const rel={x:third.x-TLbig.x,y:third.y-TLbig.y};
  const cross=top.x*rel.y-top.y*rel.x;
  const isLeft=cross<0;
  const roleTpl=isLeft?3:2; /* 模板序：0 TL,1 TR,2 BR,3 BL */
  if(isLeft){
    /* TL TR BL */
    const wT=dist(TLbig,TRbig),hL=dist(TLbig,third);
    if(wT/hL<0.5||wT/hL>0.95)return null;
    return {pts:[TLbig,TRbig,{x:TRbig.x+third.x-TLbig.x,y:TRbig.y+third.y-TLbig.y},third],tplIdx:[0,1,3],tri:true};
  }else{
    const wT=dist(TLbig,TRbig),hR=dist(TRbig,third);
    if(wT/hR<0.5||wT/hR>0.95)return null;
    return {pts:[TLbig,TRbig,third,{x:TLbig.x+third.x-TRbig.x,y:TLbig.y+third.y-TRbig.y}],tplIdx:[0,1,2],tri:true};
  }
}
function detectAnchorsGlobal(bin,w,h){
  const lo=Math.round(w*0.010),hi=Math.round(w*0.042);
  const cands=globalSolids(bin,w,h,lo*lo*0.35,hi*hi*2.2);
  const q=pickQuad(cands);
  if(q)return {pts:[q.TL,q.TR,q.BR,q.BL],tri:false};
  const t3=pickTriSmart(cands);
  if(t3)return t3;
  return null;
}
/* ---------- 连通域找实心锚点 ---------- */
function findSolid(bin,w,h,cx,cy,halfX,halfY,minA,maxA,minSol){
  const x0=Math.max(1,Math.floor(cx-halfX)),x1=Math.min(w-2,Math.ceil(cx+halfX));
  const y0=Math.max(1,Math.floor(cy-halfY)),y1=Math.min(h-2,Math.ceil(cy+halfY));
  if(x0>x1||y0>y1)return null;
  const W=x1-x0+1;
  const vis=new Uint8Array(W*(y1-y0+1));
  let best=null;
  for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){
    const idx=(yy-y0)*W+(xx-x0);
    if(vis[idx]||!bin[yy*w+xx])continue;
    let area=0,sx=0,sy=0,mx=xx,Mx=xx,my=yy,My=yy;
    const stack=[xx,yy];vis[idx]=1;
    while(stack.length){
      const py=stack.pop(),px2=stack.pop();
      area++;sx+=px2;sy+=py;
      if(px2<mx)mx=px2;if(px2>Mx)Mx=px2;if(py<my)my=py;if(py>My)My=py;
      if(px2+1<=x1&&!vis[(py-y0)*W+(px2+1-x0)]&&bin[py*w+px2+1]){vis[(py-y0)*W+(px2+1-x0)]=1;stack.push(px2+1,py);}
      if(px2-1>=x0&&!vis[(py-y0)*W+(px2-1-x0)]&&bin[py*w+px2-1]){vis[(py-y0)*W+(px2-1-x0)]=1;stack.push(px2-1,py);}
      if(py+1<=y1&&!vis[(py+1-y0)*W+(px2-x0)]&&bin[(py+1)*w+px2]){vis[(py+1-y0)*W+(px2-x0)]=1;stack.push(px2,py+1);}
      if(py-1>=y0&&!vis[(py-1-y0)*W+(px2-x0)]&&bin[(py-1)*w+px2]){vis[(py-1-y0)*W+(px2-x0)]=1;stack.push(px2,py-1);}
    }
    const bw2=Mx-mx+1,bh2=My-my+1;
    if(area<minA||area>maxA)continue;
    const asp=bw2/bh2;
    if(asp<0.7||asp>1.4)continue;
    const sol=area/(bw2*bh2);
    if(sol<minSol)continue;
    if(!best||area>best.area)best={x:sx/area,y:sy/area,area:area,w:bw2,h:bh2};
  }
  return best;
}
function detectAnchors(bin,w,h,page,sX,sY){
  const pts=[null,null,null,null],smallPts=[null,null],warn=[];
  page.anchors.forEach(function(a,i){
    const cx=(a.x+a.s/2)*sX,cy=(a.y+a.s/2)*sY;
    const halfX=a.s*sX*2.4,halfY=a.s*sY*2.4;
    const theory=(a.s*0.667*sX)*(a.s*0.667*sY);
    const r=findSolid(bin,w,h,cx,cy,halfX,halfY,theory*0.45,theory*2.1,0.6);
    if(r){if(i<4)pts[i]={x:r.x,y:r.y};else smallPts[i-4]={x:r.x,y:r.y};}
    else warn.push('锚点'+(i+1)+'未找到');
  });
  return {pts:pts,small:smallPts,warn:warn};
}

/* ---------- 单应 DLT ---------- */
function gaussSolve(A,b,n){
  const M=[];
  for(let i=0;i<n;i++){
    const row=new Array(n+1);
    for(let j=0;j<n;j++)row[j]=A[i][j];
    row[n]=b[i];M.push(row);
  }
  for(let col=0;col<n;col++){
    let piv=col;
    for(let r=col+1;r<n;r++)if(Math.abs(M[r][col])>Math.abs(M[piv][col]))piv=r;
    if(piv!==col){const t=M[col];M[col]=M[piv];M[piv]=t;}
    const d=M[col][col]||1e-12;
    for(let j=col;j<n+1;j++)M[col][j]/=d;
    for(let r=0;r<n;r++){
      if(r===col)continue;
      const f=M[r][col];if(!f)continue;
      for(let j=col;j<n+1;j++)M[r][j]-=f*M[col][j];
    }
  }
  return M.map(function(row){return row[n]});
}
function solveHomo(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){
    const x=src[i].x,y=src[i].y,u=dst[i].x,v=dst[i].y;
    A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);
  }
  const h=gaussSolve(A,b,8);
  const map=function(x,y){
    const den=h[6]*x+h[7]*y+1;
    return {x:(h[0]*x+h[1]*y+h[2])/den,y:(h[3]*x+h[4]*y+h[5])/den};
  };
  map.h=h;map.src=src;map.dst=dst;
  return map;
}

/* ---------- OMR 采样 ---------- */
function inkRatio(bin,w,h,cx,cy,r){
  const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(w-1,Math.ceil(cx+r));
  const y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(h-1,Math.ceil(cy+r));
  if(x0>x1||y0>y1)return 0;
  let cnt=0,total=0;
  const r2=r*r;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const dx=x-cx,dy=y-cy;
    if(dx*dx+dy*dy<=r2){total++;if(bin[y*w+x])cnt++;}
  }
  return total?cnt/total:0;
}
/* 同步条行检测：对每个预期行位置，在 x±2mm 竖窗内找黑色横段质心 */
function detectRowMarks(bin,w,h,expPx,smm){
  const marks=[];
  expPx.forEach(function(exp,idx){
    const mm=smm;
    const y0=Math.round(exp.y-mm*4.2),y1=Math.round(exp.y+mm*4.2);
    const x0=Math.round(exp.x-mm*2),x1=Math.round(exp.x+mm*2);
    const minRun=Math.max(3,Math.round(mm*0.8)),maxRun=Math.round(mm*3.6);
    let runY=null,runLen=0,best=null,widthMax=0;
    for(let y=y0;y<=y1;y++){
      let c=0;
      for(let x=x0;x<=x1;x++)if(bin[y*w+x])c++;
      if(c>=4){if(runY===null)runY=y;runLen++;if(c>widthMax)widthMax=c;}
      else{
        if(runLen>=minRun&&runLen<=maxRun&&widthMax>=5){
          const center=runY+(runLen-1)/2;
          if(best===null||Math.abs(center-exp.y)<Math.abs(best-exp.y))best=center;
        }
        runY=null;runLen=0;widthMax=0;
      }
    }
    if(runLen>=minRun&&runLen<=maxRun&&widthMax>=5){
      const center=runY+(runLen-1)/2;
      if(best===null||Math.abs(center-exp.y)<Math.abs(best-exp.y))best=center;
    }
    marks.push(best);
  });
  return marks;
}
function rowDeltas(marks,expYs){
  const n=expYs.length,deltas=new Array(n).fill(null);
  for(let i=0;i<n;i++)if(marks[i]!=null)deltas[i]=marks[i]-expYs[i];
  for(let i=0;i<n;i++){
    if(deltas[i]!=null)continue;
    for(let j=1;j<n;j++){
      const k=i-j,l=i+j;
      if(k>=0&&deltas[k]!=null){deltas[i]=deltas[k];break}
      if(l<n&&deltas[l]!=null){deltas[i]=deltas[l];break}
    }
  }
  return deltas;
}

/* Otsu 页面自适应阈值：对全部涂点 ink 聚类，取代固定 0.45/0.25（弱光/墨色偏浅更稳） */
function otsuInkThreshold(vals){
  const V=101,hist=new Uint32Array(V);
  let sum=0,n=0;
  for(let i=0;i<vals.length;i++){
    let k=Math.round(vals[i]*V-0.5);
    if(k<0)k=0;if(k>=V)k=V-1;
    hist[k]++;sum+=k;n++;
  }
  if(n<8)return null;
  let wB=0,sumB=0,best=0,bestT=-1;
  for(let t=0;t<V;t++){
    wB+=hist[t];
    if(!wB)continue;
    const wF=n-wB;
    if(!wF)break;
    sumB+=t*hist[t];
    const mB=sumB/wB,mF=(sum-sumB)/wF;
    const between=wB*wF*(mB-mF)*(mB-mF);
    if(between>best){best=between;bestT=t;}
  }
  if(bestT<0)return null;
  return bestT/V;
}
/* 均匀边框墨量判定：涂点自带的边框+字母在软化渲染下会整体抬升墨量，
   若所有中间档墨量彼此接近（无突出者）且都低于 阈值+0.15，视为未填而非模糊 */
function uniformBand(mids,low){
  if(mids.length<2)return false;
  let mx=-1,mn=2;
  for(const x of mids){if(x.ink>mx)mx=x.ink;if(x.ink<mn)mn=x.ink;}
  return (mx-mn)<0.12 && mx<low+0.15;
}
function judgeQuestion(inks,high,low){
  const hs=[],mids=[];
  inks.forEach(function(x){if(x.ink>=high)hs.push(x);else if(x.ink>low)mids.push(x)});
  if(hs.length===1)return {verdict:'OK',choice:String(hs[0].c)};
  if(hs.length>1)return {verdict:'MULTI',choice:hs.map(function(x){return String(x.c)}).sort().join('')};
  if(mids.length){
    if(uniformBand(mids,low))return {verdict:'BLANK',choice:null};
    return {verdict:'REVIEW',choice:null};
  }
  return {verdict:'BLANK',choice:null};
}
function judgeDigit(inks,high,low){
  const hs=inks.filter(function(x){return x.ink>=high});
  const mids=inks.filter(function(x){return x.ink>low&&x.ink<high});
  if(hs.length===1)return {digit:String(hs[0].c),ok:true};
  if(hs.length>1)return {digit:null,ok:false,reason:'多涂'};
  if(mids.length){
    if(uniformBand(mids,low))return {digit:null,ok:false,reason:'空白'};
    return {digit:null,ok:false,reason:'模糊'};
  }
  return {digit:null,ok:false,reason:'空白'};
}

/* ---------- 二维码读取 ---------- */
function qrFromCanvas(cv){
  try{
    if(typeof jsQR!=='function')return null;
    const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height);
    const r=jsQR(d.data,cv.width,cv.height,{inversionAttempts:'dontInvert'});
    return r&&r.data?r.data:null;
  }catch(e){return null}
}
async function qrFromCrop(cv,H,qr,smm){
  try{
    if(!qr||typeof jsQR!=='function')return null;
    const mg=qr.size*0.03;
    const outW=Math.min(560,Math.max(300,Math.round(qr.size*15)));
    const oc=cropViaH(cv,H,qr.x-mg,qr.y-mg,qr.size+2*mg,qr.size+2*mg,outW);
    const d=oc.getContext('2d').getImageData(0,0,oc.width,oc.height);
    const r=jsQR(d.data,oc.width,oc.height);
    return r&&r.data?r.data:null;
  }catch(e){return null}
}


/* 透视校正采样：以单应/仿射把版式矩形(mm)直接映射采样（主观题切割 / QR 裁剪通用） */
/* 轻量 USM 锐化（十字核）：低分辨率源被放大时补偿边缘软化 */
function sharpenImageData(d,w,h,amount){
  const s=new Uint8ClampedArray(d);
  for(let y=1;y<h-1;y++){
    let i=(y*w+1)*4;
    for(let x=1;x<w-1;x++,i+=4){
      for(let ch=0;ch<3;ch++){
        const c=s[i+ch];
        const blur=(s[i+ch-4]+s[i+ch+4]+s[i+ch-w*4]+s[i+ch+w*4]+4*c)/8;
        const v=c+amount*(c-blur);
        d[i+ch]=v<0?0:(v>255?255:v);
      }
    }
  }
}
function cropViaH(cv,H,x0,y0,wmm,hmm,outW,sharpen){
  /* sharpen: 0=不锐化（二维码读码用），0.4=常规轻度，0.85=源被放大时的补偿强度 */
  sharpen=sharpen||0;
  outW=outW||Math.round(wmm*9);
  const outH=Math.max(8,Math.round(outW*hmm/wmm));
  const oc=document.createElement('canvas');oc.width=outW;oc.height=outH;
  const octx=oc.getContext('2d');
  const od=octx.createImageData(outW,outH);
  const o=od.data;
  const ictx=cv.getContext('2d');
  const id=ictx.getImageData(0,0,cv.width,cv.height);
  const d=id.data,sw=cv.width,sh=cv.height;
  for(let vy=0;vy<outH;vy++){
    const v=vy/(outH-1||1);
    const my=y0+v*hmm;
    for(let ux=0;ux<outW;ux++){
      const u=ux/(outW-1||1);
      const p=H(x0+u*wmm,my);
      const oi=(vy*outW+ux)*4;
      /* 双线性采样：低分辨率扫描放大到统一宽度时保持平滑 */
      const fx=p.x-0.5, fy=p.y-0.5;
      const x1=Math.floor(fx), y1=Math.floor(fy);
      if(fx<-1||fy<-1||x1>=sw||y1>=sh){o[oi]=255;o[oi+1]=255;o[oi+2]=255;o[oi+3]=255;continue;}
      const dx=fx-x1, dy=fy-y1;
      const x2=x1+1, y2=y1+1;
      const cx1=x1<0?0:x1, cx2=x2>=sw?sw-1:x2, cy1=y1<0?0:y1, cy2=y2>=sh?sh-1:y2;
      const i11=(cy1*sw+cx1)*4, i21=(cy1*sw+cx2)*4, i12=(cy2*sw+cx1)*4, i22=(cy2*sw+cx2)*4;
      const w11=(1-dx)*(1-dy), w21=dx*(1-dy), w12=(1-dx)*dy, w22=dx*dy;
      o[oi]  =d[i11]*w11  +d[i21]*w21  +d[i12]*w12  +d[i22]*w22;
      o[oi+1]=d[i11+1]*w11+d[i21+1]*w21+d[i12+1]*w12+d[i22+1]*w22;
      o[oi+2]=d[i11+2]*w11+d[i21+2]*w21+d[i12+2]*w12+d[i22+2]*w22;
      o[oi+3]=255;
    }
  }
  if(sharpen>0)sharpenImageData(od.data,outW,outH,sharpen);
  octx.putImageData(od,0,0);
  return oc;
}
/* ---------- 切割图格距自检：纵/横线周期比异常=识别几何各向异性（“格子变扁”的定量检测） ---------- */
function gridPitchRatio(cv,expColPx,expRowPx){
  try{
    const w=cv.width,h=cv.height;
    const d=cv.getContext('2d').getImageData(0,0,w,h).data;
    const x0=(w*0.12)|0,x1=(w*0.88)|0,y0=(h*0.08)|0,y1=(h*0.92)|0;
    const dark=new Uint8Array(w*h);
    for(let i=0,j=0;i<d.length;i+=4,j++)dark[j]=((d[i]*3+d[i+1]*5+d[i+2]*2)/10)<205?1:0;
    function profV(){const n=new Int32Array(w);for(let x=0;x<w;x++){let c=0;for(let y=y0;y<y1;y++)c+=dark[y*w+x];n[x]=c;}return n;}
    function profH(){const n=new Int32Array(h);for(let y=0;y<h;y++){let c=0;for(let x=x0;x<x1;x++)c+=dark[y*w+x];n[y]=c;}return n;}
    /* 宽窗口互相关（平均绝对差最小=周期匹配），并加“偏离期望”惩罚：
       窗口覆盖 [0.42exp,1.6exp]——均匀压扁（如 0.55）时真周期仍在窗口内，
       惩罚项让期望附近的周期优先，抑制斜线分裂产生的半周期伪峰 */
    function peakPitch(n,exp){
      if(!exp||exp<6)return 0;
      let tot=0,c=0;
      for(let i=0;i<n.length;i++){tot+=n[i];c++;}
      if((tot/c)<1)return 0;
      const lo=Math.max(6,Math.floor(exp*0.42)),hi=Math.min(n.length-3,Math.ceil(exp*1.6));
      let best=0,bv=Infinity;
      for(let dd=lo;dd<=hi;dd++){
        let s=0,c2=0;
        for(let i=dd;i<n.length;i++){s+=Math.abs(n[i]-n[i-dd]);c2++;}
        if(c2)s/=c2;
        const score=s*(1+0.5*Math.abs(dd/exp-1));
        if(score<bv){bv=score;best=dd;}
      }
      return best||0;
    }
    const px=peakPitch(profV(),expColPx),py=peakPitch(profH(),expRowPx);
    if(!px||!py)return null;
    return {rel:(px/expColPx)/(py/expRowPx),px:px,py:py};
  }catch(e){return null}
}
function gridAbnormal(cc,sb){
  if(sb.type!=='grid-cn'||!sb.cols)return false;
  /* 行/格过少（如续题末尾仅 1-2 行）时周期无法可靠测量，跳过判定避免误报 */
  if(sb.rows<3)return false;
  const cellW=Math.min(8,(sb.w-12)/sb.cols);
  const ppm=cc.width/(sb.w+2.4);
  const expRow=(sb.rowH||9.2)*ppm;
  if(cc.height<expRow*2.5)return false;
  const r=gridPitchRatio(cc,cellW*ppm,expRow);
  return r?(r.rel<0.8||r.rel>1.3):false;
}
/* ---------- 格线锚定重排：检测 crop 内实际纵横线位置，将其重排到期望格距 ----------
   修「格子变扁/行距不符」：不依赖均匀压缩假设，逐线锚定（同时修复均匀与非均匀比例失配）。
   返回值：修正后 canvas（宽松保护：修正幅度超过 [0.55,1.8] 视为测量异常，返回 null） */
function realignGrid(cc,sb){
  if(sb.type!=='grid-cn'||!sb.cols)return null;
  if(sb.rows<3)return null;
  try{
    const cellW=Math.min(8,(sb.w-12)/sb.cols);
    const ppm=cc.width/(sb.w+2.4);
    const expCol=cellW*ppm, expRow=(sb.rowH||9.2)*ppm;
    const w=cvWt(cc),h=cvHt(cc);
    const d=cc.getContext('2d').getImageData(0,0,w,h).data;
    const x0=(w*0.14)|0,x1=(w*0.86)|0,y0=(h*0.06)|0,y1=(h*0.94)|0;
    const dark=new Uint8Array(w*h);
    for(let i=0,j=0;i<d.length;i+=4,j++)dark[j]=((d[i]*3+d[i+1]*5+d[i+2]*2)/10)<205?1:0;
    function linePositions(vert,expPitch){
      const len=vert?w:h,n=new Int32Array(len);
      if(vert){for(let x=0;x<w;x++){let c=0;for(let y=y0;y<y1;y++)c+=dark[y*w+x];n[x]=c;}}
      else{for(let y=0;y<h;y++){let c=0;for(let x=x0;x<x1;x++)c+=dark[y*w+x];n[y]=c;}}
      let tot=0;for(let i=0;i<len;i++)tot+=n[i];
      const mean=tot/len;
      if(mean<1)return null;
      /* 阈值不能基于均值：横线在每一列都有贡献，会把均值/地板抬高到阈值之上，
         导致线条之间的空白位也成"峰"（实测假周期≈真周期一半，自愈反而拉歪）。
         改用 中位数(地板) 与 峰值(线) 的中点：仅真正的格线可过 */
      let mx=0;for(let i=0;i<len;i++)if(n[i]>mx)mx=n[i];
      const sorted=Array.from(n).sort(function(a,b){return a-b});
      const median=sorted[len>>1];
      const th=Math.max(4,(median+mx)*0.25);
      const pos=[];
      for(let i=2;i<len-2;i++){
        if(n[i]>=th&&n[i]>=n[i-1]&&n[i]>=n[i+1]&&n[i]>=n[i-2]&&n[i]>=n[i+2]){
          if(pos.length===0||i-pos[pos.length-1]>Math.max(4,expPitch*0.5))pos.push(i);
          else if(n[i]>n[pos[pos.length-1]])pos[pos.length-1]=i;
        }
      }
      return pos;
    }
    function stretch(positions,exp){
      if(!positions||positions.length<3)return 0;
      const delta=exp;
      const real=(positions[positions.length-1]-positions[0])/(positions.length-1);
      if(Math.abs(real-delta)/delta<0.06)return 1; /* 已合格 */
      if(real/delta<0.5||real/delta>1.9)return 0; /* 异常值保护 */
      return real/delta;
    }
    const rows=linePositions(false,expRow), cols=linePositions(true,expCol);
    const ratioY=stretch(rows,expRow), ratioX=stretch(cols,expCol);
    if(!ratioY&&!ratioX)return null;
    const ky=ratioY?1/ratioY:1, kx=ratioX?1/ratioX:1; /* 实测行距偏小→放大 */
    if(Math.abs(ky-1)<0.06&&Math.abs(kx-1)<0.06)return null;
    const W=Math.max(8,Math.round(w*kx)),H=Math.max(8,Math.round(h*ky));
    const oc=document.createElement('canvas');oc.width=W;oc.height=H;
    const g=oc.getContext('2d');
    g.imageSmoothingEnabled=true;g.imageSmoothingQuality='high';
    g.drawImage(cc,0,0,W,H);
    return oc;
  }catch(e){return null}
}
function cvWt(cv){return cv.width}
function cvHt(cv){return cv.height}
/* ---------- 透视/梯形切块（主观题裁剪用，双线性逆映射） ---------- */
function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function cropQuad(cv,corners,outW,outH){
  const c=corners;
  const wpx=(dist(c[0],c[1])+dist(c[2],c[3]))/2;
  const hpx=(dist(c[0],c[3])+dist(c[1],c[2]))/2;
  outW=outW||Math.round(wpx);outH=outH||Math.round(hpx);
  const oc=document.createElement('canvas');oc.width=outW;oc.height=outH;
  const octx=oc.getContext('2d');
  const ictx=cv.getContext('2d');
  const img=ictx.getImageData(0,0,cv.width,cv.height);
  const d=img.data,sw=cv.width,sh=cv.height;
  const od=octx.createImageData(outW,outH);
  const o=od.data;
  for(let vy=0;vy<outH;vy++){
    const v=vy/(outH-1||1);
    for(let ux=0;ux<outW;ux++){
      const u=ux/(outW-1||1);
      const px2=(1-v)*((1-u)*c[0].x+u*c[1].x)+v*((1-u)*c[3].x+u*c[2].x);
      const py2=(1-v)*((1-u)*c[0].y+u*c[1].y)+v*((1-u)*c[3].y+u*c[2].y);
      const sx2=Math.round(px2),sy2=Math.round(py2);
      const si=(sy2*sw+sx2)*4;
      const oi=(vy*outW+ux)*4;
      if(sx2>=0&&sx2<sw&&sy2>=0&&sy2<sh){
        o[oi]=d[si];o[oi+1]=d[si+1];o[oi+2]=d[si+2];o[oi+3]=255;
      }else{o[oi]=255;o[oi+1]=255;o[oi+2]=255;o[oi+3]=255;}
    }
  }
  octx.putImageData(od,0,0);
  return oc;
}
function canvasToJpeg(cv,q){
  return new Promise(function(res){
    try{cv.toBlob(function(b){res(b)},'image/jpeg',q||0.88)}catch(e){res(null)}
  });
}
function canvasToThumb(cv,maxW){
  const sc=Math.min(1,maxW/(cv.width||1));
  const oc=document.createElement('canvas');
  oc.width=Math.max(1,Math.round(cv.width*sc));
  oc.height=Math.max(1,Math.round(cv.height*sc));
  oc.getContext('2d').drawImage(cv,0,0,oc.width,oc.height);
  return oc;
}
function canvasDataURL(cv,q){
  const cnv=document.createElement('canvas');
  cnv.width=cv.width;cnv.height=cv.height;
  cnv.getContext('2d').drawImage(cv,0,0);
  return cnv.toDataURL('image/jpeg',q||0.85);
}
/* Blob 对象 URL 缓存（复用同一 Blob，避免每次渲染重复 createObjectURL 泄漏） */
const __blobUrls=new WeakMap();
function blobURL(b){
  if(!b)return '';
  let u=__blobUrls.get(b);
  if(!u){u=URL.createObjectURL(b);__blobUrls.set(b,u);}
  return u;
}
/* 记录被替换的 Blob URL 并释放（旧图不再被引用时调用） */
function releaseBlobURL(b){
  if(!b)return;
  const u=__blobUrls.get(b);
  if(u){try{URL.revokeObjectURL(u)}catch(e){}__blobUrls.delete(b);}
}

/* ---------- 单页识别 ---------- */
async function recognizeCanvas(cv,layout,pageIdx,opts){
  opts=opts||{};
  const page=layout.pages[pageIdx];
  const sX=cv.width/page.w,sY=cv.height/page.h;
  const smm=(sX+sY)/2;
  const gray=toGray(cv);
  /* 明暗自适应拉伸（2%-98% 分位），提升低照/逆光手机照片的二值化稳定性 */
  try{
    const G=gray.gray,hist=new Uint32Array(256);
    for(let i=0;i<G.length;i++)hist[G[i]]++;
    const total=G.length;let acc=0,lo=0,hi=255;
    for(let v=0;v<256;v++){acc+=hist[v];if(acc>total*0.02){lo=v;break}}
    acc=0;
    for(let v=255;v>=0;v--){acc+=hist[v];if(acc>total*0.02){hi=v;break}}
    if(hi-lo>40&&lo<180){
      const range=hi-lo;
      for(let i=0;i<G.length;i++)G[i]=G[i]<=lo?0:(G[i]>=hi?255:Math.round((G[i]-lo)*255/range));
    }
  }catch(e){}
  const bin=binarize(gray.gray,gray.w,gray.h,omr.k,omr.win);
  const flags=[];
  /* 源分辨率过低会同时影响判读与切割图清晰度，明确告警以便重拍 */
  if(smm<5)flags.push('扫描分辨率偏低（约'+Math.round(smm*25.4)+'dpi）：建议用 150dpi 以上扫描，或手机拍摄时选原图上传');
  let qrData=null,qrFound=false,layoutSlice=null;
  /* 尝试读取二维码（先整页后裁剪） */
  const qrRaw=qrFromCanvas(cv);
  if(qrRaw){try{layoutSlice=await qrParsePayload(qrRaw);qrFound=true}catch(e){}}
  if(layoutSlice&&layoutSlice.minimal){
    try{
      const mtpl=await dbGet('templates',layoutSlice.tplId);
      if(mtpl){
        const ml=layoutTemplate(mtpl);
        const pgSel=ml.pages[Math.min(pageIdx,ml.pages.length-1)];
        if(layoutSlice.hash){
          const hm=await layoutHash(ml,mtpl,pgSel);
          if(hm&&hm!==layoutSlice.hash)flags.push('模板与打印版式不一致（版式指纹不匹配）：卡面可能来自旧版本模板，请核对或按当前模板重新打印');
        }
        layoutSlice=pgSel;
      }else{
        layoutSlice=null;
        flags.push('未找到二维码中的模板（已按当前考试模板解析）');
      }
    }catch(e){layoutSlice=null}
  }
  /* 锚点检测：先全局搜索四角（兼容照片背景/未充满画面/倾斜），再用预期位置窗口兜底 */
  const geometry=layoutSlice||page;
  let detGlobal=null;
  if(opts.noGlobal!==true){try{detGlobal=detectAnchorsGlobal(bin,cv.width,cv.height)}catch(e){}}
  let det=null,pts=null,usedSmall=false,globalUsed=false,smallIdx=[-1,-1,-1,-1];
  if(detGlobal){
    pts=detGlobal.pts;
    globalUsed=true;
  }else{
    det=detectAnchors(bin,cv.width,cv.height,geometry,sX,sY);
    pts=det?det.pts:null;
  }
  if(!pts)pts=[null,null,null,null];
  const detWarn=det?det.warn:[];
  /* 手动锚点优先（重定位救失败页），必须先于“定位失败”判定 */
  if(opts.manualPts&&opts.manualPts.length>=4){
    pts=opts.manualPts.slice(0,4).map(function(p){return {x:p.x,y:p.y}});
  }else{
    if(pts.filter(function(p){return p}).length<4){
      /* 用两个小锚 + 两点外推补角：记录每个角实际来自哪个锚点（大锚0-3/小锚4-5），
         求解单应时按真实 mm 源配对，避免用小锚像素配大锚 mm 导致纵横比例失真 */
      let haveB=pts.map(function(p){return !!p});
      const small=det?det.small:[null,null];
      if((haveB[0]===false||haveB[3]===false)&&small[0]){
        if(!pts[0]){pts[0]={x:small[0].x,y:small[0].y};smallIdx[0]=4;}
        if(!pts[3]){pts[3]={x:small[0].x,y:small[0].y};smallIdx[3]=4;}
        usedSmall=true;
      }
      if((haveB[1]===false||haveB[2]===false)&&small[1]){
        if(!pts[1]){pts[1]={x:small[1].x,y:small[1].y};smallIdx[1]=5;}
        if(!pts[2]){pts[2]={x:small[1].x,y:small[1].y};smallIdx[2]=5;}
        usedSmall=true;
      }
    }
  }
  let okCount=pts.filter(function(p){return p}).length;
  if(okCount<4){return {ok:false,status:'locate_fail',regFlags:[],flags:['定位失败：锚点不足('+okCount+'/4)（照片请平正拍摄、四角完整可见）'],warn:detWarn}}
  /* 退化组合拒绝：同一个小锚被占两个角时 mm 源重复、单应无解——不再容忍“静默压扁”输出 */
  if(usedSmall&&!opts.manualPts){
    if((smallIdx[0]>=0&&smallIdx[3]>=0&&smallIdx[0]===smallIdx[3])||(smallIdx[1]>=0&&smallIdx[2]>=0&&smallIdx[1]===smallIdx[2])){
      return {ok:false,status:'locate_fail',regFlags:[],flags:['定位失败：同一侧上/下两个定位点均缺失，无法唯一确定版式——请确保四角定位点完整可见，或使用手动重定位'],warn:detWarn};
    }
  }
  /* 四点形状校验：宽高比须与版式接近，防止退化组合（如两侧都用同一小锚顶替）静默输出错位结果 */
  const qW=(Math.hypot(pts[0].x-pts[1].x,pts[0].y-pts[1].y)+Math.hypot(pts[3].x-pts[2].x,pts[3].y-pts[2].y))/2;
  const qH=(Math.hypot(pts[0].x-pts[3].x,pts[0].y-pts[3].y)+Math.hypot(pts[1].x-pts[2].x,pts[1].y-pts[2].y))/2;
  const qAsp=qW/Math.max(1,qH), tAsp=page.w/page.h;
  if(qAsp<tAsp*0.6||qAsp>tAsp*1.6){
    return {ok:false,status:'locate_fail',regFlags:[],flags:['定位校验未通过：四点构成的形状与版式不符（请检查定位点是否被遮挡或印刷不清）'],warn:detWarn};
  }
  /* 按实际来源配对 mm 源：小锚顶替的角用锚点4/5的坐标参与单应，杜绝“配错源”造成的纵横比例失真 */
  const srcPts=[0,1,2,3].map(function(i){
    const ai=smallIdx[i]>=0?smallIdx[i]:i;
    const a=geometry.anchors[ai];
    return {x:a.x+a.s/2,y:a.y+a.s/2};
  });
  let H=null;
  if(detGlobal&&detGlobal.tri&&detGlobal.tplIdx){
    const ti=detGlobal.tplIdx;
    H=solveAffine([srcPts[ti[0]],srcPts[ti[1]],srcPts[ti[2]]],
      [{x:pts[ti[0]].x,y:pts[ti[0]].y},{x:pts[ti[1]].x,y:pts[ti[1]].y},{x:pts[ti[2]].x,y:pts[ti[2]].y}]);
    H.affine=true;
    flags.push('仅识别到 3 个定位点（第4角自动外推，透视较大时可能有少许偏差）');
  }else{
    H=solveHomo(srcPts,pts.map(function(p){return {x:p.x,y:p.y}}));
  }
  /* 全局匹配的模板一致性校验：用 2 个小锚验证，防止桌面杂物拼成的假四边形被当成答题卡。
     窗口收紧到小锚尺寸（垂直 ±0.55s，避开 10mm 外的大锚），真实投影误差仅 0.3-1mm，
     错位四边形会产生 >10mm 的残差，4mm 判线两侧都有充足余量 */
  if(globalUsed&&geometry.anchors[4]&&geometry.anchors[5]){
    let checked=0,bad=0;
    [geometry.anchors[4],geometry.anchors[5]].forEach(function(a){
      const e=H(a.x+a.s/2,a.y+a.s/2);
      const theory=(a.s*0.667*sX)*(a.s*0.667*sY);
      const r=findSolid(bin,cv.width,cv.height,e.x,e.y,a.s*sX*1.1,a.s*sY*0.55,theory*0.45,theory*1.7,0.6);
      if(r){
        checked++;
        const d=Math.sqrt((r.x-e.x)*(r.x-e.x)+(r.y-e.y)*(r.y-e.y))/smm;
        if(d>4)bad++;
      }
    });
    if(checked>=1&&bad===checked){
      return {ok:false,status:'locate_fail',regFlags:[],
        flags:['定位校验未通过：定位点与版式不符（画面中可能混入杂物，请调整拍摄角度/距离后重试）'],warn:detWarn};
    }
  }
  /* 小锚残差校验（全局匹配下跳过） */
  const smallRef=det?det.small:[null,null];
  if(!globalUsed&&geometry.anchors[4]&&geometry.anchors[5]&&smallRef[0]&&smallRef[1]){
    const e1=H(geometry.anchors[4].x+geometry.anchors[4].s/2,geometry.anchors[4].y+geometry.anchors[4].s/2);
    const e2=H(geometry.anchors[5].x+geometry.anchors[5].s/2,geometry.anchors[5].y+geometry.anchors[5].s/2);
    const d1=Math.sqrt((e1.x-smallRef[0].x)*(e1.x-smallRef[0].x)+(e1.y-smallRef[0].y)*(e1.y-smallRef[0].y))/smm;
    const d2=Math.sqrt((e2.x-smallRef[1].x)*(e2.x-smallRef[1].x)+(e2.y-smallRef[1].y)*(e2.y-smallRef[1].y))/smm;
    if(d1>1.8||d2>1.8)flags.push('版式异常：小锚残差'+d1.toFixed(2)+'/'+d2.toFixed(2)+'mm（建议重扫）');
  }
  /* 裁剪二维码增强识别 */
  if(!qrFound){
    const cropData=await qrFromCrop(cv,H,geometry.qr||page.qr,smm);
    if(cropData){try{layoutSlice=await qrParsePayload(cropData);qrFound=true}catch(e){}}
  }
  const pg2=layoutSlice||page;
  const reg=pg2.reg||null;
  const regDigitsN=(pg2.regDigits!=null)?pg2.regDigits:page.regDigits;
  /* 考号识别（含同步条行校正；无考号区页面跳过并向组装阶段沿用上一页考号） */
  let studentNo='',regFlags=[],regPts=[],regDBG={marks:null,deltas:null,expY:null,tx:0};
  let allInks=[];   /* 全页涂点 ink 收集（页面级自适应阈值） */
  if(!reg){
    regFlags=['本页无考号区'];
  }
  for(let c=0;reg&&c<regDigitsN;c++){
    const cx=reg.x+c*reg.colW;
    const timingX=cx+reg.colW+0.7;
    const expMarks=reg.rowsY.map(function(ry){return H(timingX,ry)});
    const marks=detectRowMarks(bin,cv.width,cv.height,expMarks,smm);
    const deltas=rowDeltas(marks,expMarks.map(function(m){return m.y}));
    if(c===0){regDBG={marks:marks,deltas:deltas,expY:expMarks.map(function(m){return m.y}),tx:timingX};}
    const inks=[];
    for(let dg=0;dg<10;dg++){
      const bxmm=reg.x+c*reg.colW+(reg.colW-reg.bubble)/2+reg.bubble/2;
      const p=H(bxmm,reg.rowsY[dg]);
      const ink=inkRatio(bin,cv.width,cv.height,p.x,p.y+deltas[dg],Math.max(2,reg.bubble/2*smm*0.8));
      inks.push({c:String(dg),ink:ink});
      allInks.push(ink);
    }
    regPts.push({c:c,j:null,inks:inks,raw:true});
  }
  /* 考号判定在下方回填阶段统一进行并按需标记“考号异常” */
  /* 考号人工改判覆盖 */
  if(opts&&opts.regOverride){
    studentNo=String(opts.regOverride).trim();
    regFlags=['考号经人工改判为 '+studentNo];
  }
  /* 客观题 OMR */
  const perQ=[];
  const syncMiss=[];
  pg2.groups.forEach(function(g){
    const gx0=g.x0,gid=g.label;
    const expTiming=gx0-2.2;
    const expMarks=[];
    for(let r=0;r<g.rows;r++)expMarks.push(H(expTiming,g.y0+2.5+r*g.dy));
    const marks=detectRowMarks(bin,cv.width,cv.height,expMarks,smm);
    let miss=marks.filter(function(m){return m===null}).length;
    syncMiss.push({miss:miss,rows:g.rows,label:gid});
    if(miss>=Math.max(2,g.rows*0.4))flags.push(gid+'同步条缺失'+miss+'条');
    const deltas=rowDeltas(marks,expMarks.map(function(m){return m.y}));
    for(let rr=0;rr<g.rows;rr++){
      for(let c=0;c<g.cols;c++){
        const qn=g.first+c*g.rows+rr;
        if(qn>g.first+g.count-1)continue;
        const rowYmm=g.y0+2.5+rr*g.dy;
        if(deltas[rr]===null)continue;
        const inks=[];
        const nOpts=groupQChoices(g,qn);
        for(let ch=0;ch<nOpts;ch++){
          const qg=qBubbleGeom(g,qn,ch);
          const bxmm=g.x0+c*g.dxq+(qg.bx-g.x0);
          const p=H(bxmm,rowYmm);
          const ink=inkRatio(bin,cv.width,cv.height,p.x,p.y+deltas[rr],Math.max(2,qg.bw/2*smm*0.8));
          inks.push({c:String.fromCharCode(65+ch),ink:ink});
          allInks.push(ink);
        }
        perQ.push({qno:qn,raw:inks});
      }
    }
  });
  /* 所有组的同步条全部/大面积缺失 → 几何几乎必然错位（如被杂物四边形欺骗、拍错页），按定位失败处理，绝不静默输出 */
  if(syncMiss.length&&syncMiss.every(function(s){return s.miss>=Math.max(2,s.rows*0.4)})){
    return {ok:false,status:'locate_fail',regFlags:[],
      flags:['定位校验未通过：所有同步条均未找到（画面与版式严重不符，可能混入杂物或拍错页，请重拍）'],warn:detWarn};
  }
  /* 页面级自适应阈值（Otsu 聚类）：仅当“空白簇/填涂簇”清晰可分时启用，
     且阈值围绕两簇均值构造，保证空白涂点（边框+字母墨量约 0.15-0.25）不被划入模糊区 */
  let inkHigh=omr.inkHigh,inkLow=omr.inkLow;
  try{
    const t=otsuInkThreshold(allInks);
    if(t!=null){
      const below=[],above=[];
      for(const v of allInks)(v<t?below:above).push(v);
      if(below.length>=8&&above.length>=1){
        const mean=function(a){let s=0;for(const x of a)s+=x;return s/a.length};
        const m0=mean(below),m1=mean(above);
        if(m1-m0>=0.25&&m0<=0.35&&m1>=0.45){
          inkLow=Math.max(omr.inkLow,Math.min(0.35,m0+0.08));
          inkHigh=Math.max(inkLow+0.1,Math.max(omr.inkHigh,Math.min(0.9,m1-0.12)));
        }
      }
    }
  }catch(e){}
  /* 客观题判定回填（≥2 涂点按 MULTI 记，多选由判分阶段按答案集合比对） */
  for(const qi of perQ){
    const j=judgeQuestion(qi.raw,inkHigh,inkLow);
    qi.choice=j.choice;
    qi.verdict=j.verdict;
    qi.inks=qi.raw.map(function(x){return Math.round(x.ink*100)/100});
    delete qi.raw;
  }
  /* 考号判定回填 */
  let no2='';
  regPts.forEach(function(rp){
    const j=judgeDigit(rp.inks,inkHigh,inkLow);
    rp.j=j;delete rp.raw;
    if(j.ok)no2+=j.digit;
    else no2+=(j.reason==='空白'?'_':'?');
  });
  if(reg)studentNo=no2;
  if(reg&&(!studentNo||studentNo.indexOf('_')>=0||studentNo.indexOf('?')>=0))regFlags.push('考号异常（'+studentNo+'）');
  /* 主观题切割 */
  const crops=[];
  for(const sb of pg2.subjective){
    /* 切割按源图原生分辨率 1:1 采样（不发虚）；拼接对齐由显示层等宽缩放保证。
       常规轻度锐化提升线条观感；源区域像素不足（如 PDF 内嵌低清图被放大渲染）时加大锐化补偿 */
    const outW=Math.round(Math.min(1440,Math.max(420,(sb.w+2.4)*Math.min(12,smm*1.05))));
    const srcRegionPx=(sb.w+2.4)*smm;
    const cc=cropViaH(cv,H,sb.x-1.2,sb.y-1.2,sb.w+2.4,sb.h+2.4,outW, outW>srcRegionPx*1.15?0.85:0.4);
    crops.push({qno:sb.qno,part:sb.part||0,score:sb.score,cv:cc});
  }
  /* 切割图格距自检：网格题纵/横线周期异常（“格子变扁”）→ 全局定位可疑 → 换“预期位置窗口”定位重试；
     仍异常 → 按实测格线周期重采样自愈（覆盖打印/导入环节造成的均匀压扁） */
  let gridBad=false;
  for(let gi=0;gi<pg2.subjective.length&&gi<crops.length;gi++){
    if(gridAbnormal(crops[gi].cv,pg2.subjective[gi])){gridBad=true;break;}
  }
  if(gridBad){
    if(!opts.noGlobal&&globalUsed){
      const r2=await recognizeCanvas(cv,layout,pageIdx,Object.assign({},opts,{noGlobal:true}));
      if(r2.ok&&r2.crops){
        let ok2=true;
        for(let gi=0;gi<pg2.subjective.length&&gi<r2.crops.length;gi++){
          if(gridAbnormal(r2.crops[gi].cv,pg2.subjective[gi])){ok2=false;break;}
        }
        if(ok2){
          r2.flags=(['全局定位导致切割纵横比例异常，已改用预期位置定位重试']).concat(r2.flags);
          return r2;
        }
      }
      flags.push('切割图纵横比例异常，改用预期位置定位仍未通过——已按格线周期自动校正；若仍偏斜请检查四角锚点或使用手动重定位');
    }else{
      flags.push('切割图纵横比例异常（预期位置定位）：已按格线周期自动校正；若仍偏斜请检查锚点或使用手动重定位');
    }
    for(let gi=0;gi<pg2.subjective.length&&gi<crops.length;gi++){
      const fix=realignGrid(crops[gi].cv,pg2.subjective[gi]);
      if(fix)crops[gi].cv=fix;
    }
  }
  return {ok:true,status:'ok',H:H,geometry:pg2,sX:sX,sY:sY,smm:smm,
    qrFound:qrFound,qrLayout:!!layoutSlice,
    studentNo:studentNo,regFlags:regFlags,regPts:regPts,perQ:perQ,crops:crops,flags:flags,warn:detWarn,globalAnchors:globalUsed,
    dbg:{regMarks:regDBG&&regDBG.marks,regDeltas:regDBG&&regDBG.deltas,regExpY:regDBG&&regDBG.expY,anchorPts:pts,timingX0:regDBG&&regDBG.tx}};
}

/* ---------- 扫描主流程（上传文件或模拟） ---------- */
async function scanExamPages(exam,files,onProgress,forcePage){
  const tpl=await dbGet('templates',exam.templateId);
  if(!tpl)throw new Error('模板不存在');
  const layout=layoutTemplate(tpl);
  const items=await filesToCanvases(files,2600);
  const results=[];
  let idx=0,lastNo='';
  for(const it of items){
    const pageIdx=(forcePage!=null&&forcePage>0)?Math.min(layout.pages.length-1,forcePage-1):Math.min(layout.pages.length-1,(it.pageNo||1)-1);
    let res;
    try{res=await recognizeCanvas(it.cv,layout,pageIdx,{})}
    catch(err){
      results.push({id:uid('pg_'),examId:exam.id,studentNo:'',pageNo:it.pageNo,blob:null,thumb:'',
        meta:{status:'error',qrFound:false,flags:['图像解析异常：'+(err.message||String(err))],perQ:[],regFlags:[],
          layoutW:layout.w,layoutH:layout.h,pageIdx:pageIdx,srcFile:it.file||'',srcW:it.cv.width,srcH:it.cv.height}});
      if(onProgress)onProgress(++idx,items.length,it);
      continue;
    }
    const blob=await canvasToJpeg(it.cv,0.88);
    /* 无考号区页面：沿用本批上一识别页的考号（页序即学生分组） */
    if(!res.studentNo&&lastNo)res.studentNo=lastNo;
    if(res.studentNo)lastNo=res.studentNo;
    const pageRec={id:uid('pg_'),examId:exam.id,studentNo:res.studentNo||'',pageNo:it.pageNo,
      blob:blob,thumb:canvasDataURL(canvasToThumb(it.cv,220),0.7),
      meta:{status:res.status,qrFound:res.qrFound,flags:res.flags.concat(res.regFlags),
        perQ:res.perQ,regFlags:res.regFlags,regPts:res.regPts,layoutW:layout.w,layoutH:layout.h,pageIdx:pageIdx,
        H:res.H?res.H.h:null,srcFile:it.file||'',srcW:it.cv.width,srcH:it.cv.height}};
    await dbPut('pages',pageRec);
    /* 主观题裁剪入库 */
    if(res.crops){
      for(const cp of res.crops){
        const cid=exam.id+'|'+res.studentNo+'|'+cp.qno+'|'+cp.part;
        const blob2=await canvasToJpeg(cp.cv,0.85);
        const old=await dbGet('crops',cid);
        await dbPut('crops',{id:cid,examId:exam.id,exam_q:exam.id+'|'+cp.qno,pageId:pageRec.id,
          studentNo:res.studentNo,qno:cp.qno,part:cp.part,score:cp.score,
          blob:blob2,thumb:canvasDataURL(canvasToThumb(cp.cv,160),0.7),
          scoreVal:old&&old.scoreVal!=null?old.scoreVal:null,aiScore:old&&old.aiScore!=null?old.aiScore:null,
          aiReason:old&&old.aiReason||'',marked:old&&old.marked||null,markedBy:old&&old.markedBy||'',flag:old&&old.flag||''});
      }
    }
    results.push(pageRec);
    idx++;
    if(onProgress)onProgress(idx,items.length,it);
  }
  return results;
}

/* ---------- 考试数据汇总 ---------- */
async function examData(examId){
  const exam=await dbGet('exams',examId);
  const pages=await dbByIdx('pages','byExam',examId);
  const crops=await dbByIdx('crops','byExam',examId);
  const revs=await dbByIdx('revs','byExam',examId);
  const students=exam?await dbByIdx('students','byClass',exam.classId):[];
  return {exam:exam,pages:pages,crops:crops,revs:revs,students:students};
}
async function examMeta(exam){
  if(!exam)return null;
  const tpl=await dbGet('templates',exam.templateId);
  if(!tpl)return null;
  const layout=layoutTemplate(tpl);
  const choiceQnos=[];
  const subjList=[];
  const seen={};
  layout.pages.forEach(function(p){
    p.groups.forEach(function(g){
      for(let q=g.first;q<g.first+g.count;q++)choiceQnos.push(q);
    });
    p.subjective.forEach(function(sb){
      if(!seen[sb.qno]){
        seen[sb.qno]=true;
        /* 考试级满分覆盖模板默认（向导中可改），全链路计分/统计/AI 统一以 examMeta 输出为准 */
        const exSc=(exam&&exam.subjective&&exam.subjective[sb.qno]&&Number(exam.subjective[sb.qno].score)>0)?Number(exam.subjective[sb.qno].score):sb.score;
        subjList.push({qno:sb.qno,score:exSc,type:sb.type,parts:[]});
      }
      subjList.find(function(s){return s.qno===sb.qno}).parts.push({pi:p.footer.n-1,part:sb.part,rows:sb.rows});
    });
  });
  const choiceOpts={};
  layout.pages.forEach(function(p){p.groups.forEach(function(g){
    for(let q=g.first;q<g.first+g.count;q++)choiceOpts[q]=groupQChoices(g,q);
  })});
  return {tpl:tpl,layout:layout,choiceQnos:choiceQnos,subjList:subjList,choiceOpts:choiceOpts};
}
async function examReviewCount(examId){
  const {exam,pages,revs}=await examData(examId);
  const examDataX={qMulti:exam&&exam.qMulti};
  const items={locate:[],reg:[],q:[]};
  pages.forEach(function(p){
    const m=p.meta||{};
    if(m.status!=='ok')items.locate.push(p);
    const flags=(m.flags||[]).join('|');
    if(flags.indexOf('考号异常')>=0)items.reg.push(p);
    if(m.status==='ok'&&m.perQ){
      (m.perQ).forEach(function(q){
        const ov=revs.find(function(r){return r.studentNo===p.studentNo&&r.qno===q.qno&&r.type==='q'});
        const isMultiQ=examDataX&&examDataX.qMulti&&examDataX.qMulti[q.qno];
        const needRev=(q.verdict==='REVIEW')||(!isMultiQ&&q.verdict==='MULTI');
        if(!ov&&needRev)items.q.push({studentNo:p.studentNo,qno:q.qno,inks:q.inks,verdict:q.verdict,choice:q.choice});
      });
    }
  });
  return items;
}

/* 批量状态：游标挑取元数据（不加载页图/裁剪图 blob），逐场统计 */
const __pagePick=function(p){return {id:p.id,examId:p.examId,pageNo:p.pageNo,studentNo:p.studentNo,meta:p.meta}};
const __cropPick=function(c){return {id:c.id,examId:c.examId,studentNo:c.studentNo,qno:c.qno,scoreVal:c.scoreVal,flag:c.flag,markedBy:c.markedBy}};
async function examStatusMap(examIds){
  const exams=await dbAll('exams');
  const subjCache={};
  async function subjOf(ex){
    if(subjCache[ex.templateId])return subjCache[ex.templateId];
    const m=await examMeta(ex);
    const l=m?m.subjList:[];
    subjCache[ex.templateId]=l;
    return l;
  }
  const map={};
  for(const ex of exams){
    const pages=await dbCollect('pages','byExam',ex.id,__pagePick);
    const crops=await dbCollect('crops','byExam',ex.id,__cropPick);
    const revs=await dbCollect('revs','byExam',ex.id);
    const rev={locate:[],reg:[],q:[]};
    pages.forEach(function(p){
      const m=p.meta||{};
      if(m.status!=='ok')rev.locate.push(p);
      const flags=(m.flags||[]).join('|');
      if(flags.indexOf('考号异常')>=0)rev.reg.push(p);
      if(m.status==='ok'&&m.perQ){
        (m.perQ).forEach(function(q){
          const ov=revs.find(function(r){return r.studentNo===p.studentNo&&r.qno===q.qno&&r.type==='q'});
          const isMultiQ=ex.qMulti&&ex.qMulti[q.qno];
          const need=(q.verdict==='REVIEW')||(!isMultiQ&&q.verdict==='MULTI');
          if(!ov&&need)rev.q.push({studentNo:p.studentNo,qno:q.qno,inks:q.inks,verdict:q.verdict,choice:q.choice});
        });
      }
    });
    let gradDone=0,gradTotal=0;
    let subjList=[];
    try{subjList=await subjOf(ex);}catch(e){subjList=[];} /* 单场模板异常不影响其他考试状态 */
    for(const sq of subjList){
      const done=crops.some(function(c){return String(c.qno)===String(sq.qno)&&c.scoreVal!=null});
      gradTotal++;if(done)gradDone++;
    }
    let badgeTxt,labelTxt;
    if(!pages.length){badgeTxt=badge('warn','待扫描');labelTxt='尚未扫描';}
    else if(rev.locate.length||rev.reg.length||rev.q.length){badgeTxt=badge('err','待复核 '+(rev.locate.length+rev.reg.length+rev.q.length));labelTxt='有项目待复核';}
    else if(subjList.length&&gradDone<gradTotal){badgeTxt=badge('info','阅卷中');labelTxt='主观题待阅';}
    else{badgeTxt=badge('ok','已完成');labelTxt='已完成';}
    map[ex.id]={badge:badgeTxt,label:labelTxt,rev:rev};
  }
  return map;
}
async function examStatusLabel(examId){
  const {exam,pages}=await examData(examId);
  if(!exam)return {badge:badge('gray','—'),label:'—'};
  const rev=await examReviewCount(examId);
  const meta=await examMeta(exam);
  let gradDone=0,gradTotal=0;
  if(meta){
    for(const sq of meta.subjList){
      const crops=(await dbByIdx('crops','byExamQ',examId+'|'+sq.qno)).filter(function(c){return c.scoreVal!=null});
      gradTotal=gradTotal+1;
      if(crops.length)gradDone=gradDone+1;
    }
  }
  if(!pages.length)return {badge:badge('warn','待扫描'),label:'尚未扫描'};
  if(rev.locate.length||rev.reg.length||rev.q.length)return {badge:badge('err','待复核 '+(rev.locate.length+rev.reg.length+rev.q.length)),label:'有项目待复核，先在「扫描识别」处理'};
  if(meta&&meta.subjList.length&&gradDone<gradTotal)return {badge:badge('info','阅卷中'),label:'主观题待阅'};
  return {badge:badge('ok','已完成'),label:'考试已完成'};
}

    const p=presetTemplates()[parseInt(el.dataset.i,10)];
    const t=newTemplate(p.name);
    Object.assign(t,JSON.parse(JSON.stringify(p)));
    t.id=uid('tpl_');t.createdAt=today();

  'tpl-edit-cancel':function(){ui.tplEdit=null;renderTpl()},
  'tpl-save':async function(el){
    const t=await dbGet('templates',el.dataset.id);
    try{
      /* 题号校验：全卷统一阿拉伯编号，主客观同号也视为冲突（会重复排版、重复录答案） */
      const qs=normalizeQuestions(t);
      const seen={},dups=[];
      qs.forEach(function(q){
        if(q.t==='obj'||q.qno){
          const k='q'+q.qno;
          if(seen[k])dups.push((q.t==='obj'?'客观 ':'主观 ')+q.qno);
          seen[k]=true;
        }
      });
      if(dups.length){
        const ok=await dlgConfirm('题号重复','以下题号在清单中重复：<b>'+esc(dups.join('、'))+'</b><br>重复题目会被重复排版、重复录答案，建议先修改题号。','仍要保存');
        if(!ok)return;
      }
      const lay=layoutTemplate(t);
      await dbPut('templates',t);
      toast('已保存：'+lay.pages.length+' 页 / '+qs.filter(function(q){return q.t==='obj'}).length+' 道客观题 / '+qs.filter(function(q){return q.t==='subj'}).length+' 道主观题'+(dups.length?('（含 '+dups.length+' 个重复题号）'):''),'ok');
    }catch(err){toast('排版校验失败：'+err.message,'err')}
    renderTpl();
  },

    const box=$('tplPrevBox');

    if(!q)return;
    const f=el.dataset.f;
    if(el.type==='checkbox'){q[f]=el.checked;}
    else if(el.type==='number'){
      const v=parseFloat(el.value);
      if(f==='qno'&&q.t==='obj')q.qno=Math.max(1,Math.round(v)||1);
      else if(f==='choices')q.choices=Math.max(2,Math.min(6,Math.round(v)||4));
      else if(f==='score')q.score=Math.max(0,Number.isFinite(v)?v:0);
      else if(f==='cols')q.cols=Math.max(10,Math.min(40,Math.round(v)||20));
      else if(f==='count')q.count=(Number.isFinite(v)&&v>0)?Math.round(v):null;
      else if(f==='rows')q.rows=Math.max(1,Math.round(v)||1);
      else q[f]=v;
    }
    else q[f]=el.value;
    await dbPut('templates',t);
  },

    await dbPut('templates',t);
  }
});
/* 文件输入统一在渲染时绑定 */
function bindFileInput(id,fn){
  const f=$(id);
  if(f&&!f.dataset.bound){
    f.dataset.bound='1';
    f.addEventListener('change',function(){
      /* 立即快照文件后再清空，避免 FileList（活对象）被清空后变 0 */
      if(f.files&&f.files.length){
        var snap=Array.prototype.slice.call(f.files||[]);
        fn(snap,f);
      }
      f.value='';
    });
  }
}

async function importStudentsExcel(file,classId){
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    /* 表头映射：兼容「姓名/考号/性别/备注」任意顺序（仿 Pro《考生信息表》） */
    let hi=0;
    for(let i=0;i<Math.min(rows.length,5);i++){if(/姓名/.test(String(rows[i][0]||'')+String(rows[i][1]||'')+String(rows[i][2]||''))){hi=i;break}}
    const head=rows[hi]||[];
    const ci={name:-1,no:-1,note:-1,sex:-1};
    head.forEach(function(v,j){
      const s=String(v||'');
      if(/姓名/.test(s)&&ci.name<0)ci.name=j;
      else if(/考号|学号|编号/.test(s)&&ci.no<0)ci.no=j;
      else if(/性别/.test(s))ci.sex=j;
      else if(/备注|说明/.test(s))ci.note=j;
    });
    if(ci.name<0||ci.no<0){
      toast('导入失败：文件未包含「姓名」或「考号」列（请使用《考生信息表.xlsx》模板）','err');
      return;
    }
    const existing=await dbByIdx('students','byClass',classId);
    const byNo={};existing.forEach(function(s){if(s.no)byNo[String(s.no)]=s});
    let added=0,numbad=0,updated=0;
    for(let i=hi+1;i<rows.length;i++){
      const r=rows[i];
      const name=String(r[ci.name]==null?'':r[ci.name]).trim();
      const no=String(r[ci.no]==null?'':r[ci.no]).trim();
      const note=(ci.note>=0?String(r[ci.note]||'').trim():'')||(ci.sex>=0?String(r[ci.sex]||'').trim():'');
      if(!name&&!no)continue;
      if(!name){numbad++;continue}
      if(!no){numbad++;continue}
      const ex=byNo[String(no)];
      if(ex){ex.name=name;ex.note=note||ex.note;await dbPut('students',ex);updated++;}
      else{
        const rec={id:uid('stu_'),classId:classId,no:no,name:name,note:note};
        await dbPut('students',rec);
        byNo[String(no)]=rec;
        added++;
      }
      if(added+updated>=400){toast('单次最多导入 400 人，已处理 400 行（其余忽略）','ok');break}
    }
    toast('Excel 导入完成：新增 '+added+' 人，更新 '+updated+' 人'+(numbad?('，跳过 '+numbad+' 行缺姓名/考号'):''),'ok');
    renderCls();
  }catch(err){toast('Excel 导入失败：'+err.message,'err')}
}

async function examWizardOpen(examId){
  const classes=await dbAll('classes');
  const tpls=await dbAll('templates');
  if(!classes.length){toast('请先创建班级','err');go('class');return}
  if(!tpls.length){toast('请先创建答题卡模板','err');go('tpl');return}
  const ex=examId?await dbGet('exams',examId):null;
  wiz={examId:examId,step:1,
    name:ex?ex.name:('期中考试 '+today()),
    classId:ex?ex.classId:classes[0].id,
    templateId:ex?ex.templateId:tpls[0].id,
    perScore:ex?ex.perScore:null,
    answers:ex?JSON.parse(JSON.stringify(ex.answers||{})):{},
    perQScore:ex&&ex.perQScore?JSON.parse(JSON.stringify(ex.perQScore)):{},
    multi:ex&&ex.qMulti?JSON.parse(JSON.stringify(ex.qMulti)):{},
    subjective:ex?JSON.parse(JSON.stringify(ex.subjective||{})):{}
  };
  wizRender();
}
async function wizRender(){

      +'<div><label class="f-lb">班级</label><select class="inp" id="wizClass">'
      +classes.map(function(c){return '<option value="'+c.id+'"'+(c.id===wiz.classId?' selected':'')+'>'+esc(c.name)+'</option>'}).join('')+'</select></div>'
      +'<div><label class="f-lb">答题卡模板</label><select class="inp" id="wizTpl">'
      +tpls.map(function(t){return '<option value="'+t.id+'"'+(t.id===wiz.templateId?' selected':'')+'>'+esc(t.name)+'</option>'}).join('')+'</select></div>'
      +'<div><label class="f-lb">客观题每题分值（可覆盖模板默认）</label><input class="inp" id="wizPerScore" type="number" step="0.5" value="'+esc(wiz.perScore)+'"></div>'
      +'</div>'
      +'<div class="tip" style="margin-top:10px">模板：'+esc(tpl.name)+'（'+meta.choiceQnos.length+' 道客观题，'+meta.subjList.map(function(s){return esc(s.qno)}).join('、')+' 等主观题区）</div>';
  }else if(wiz.step===2){
    const answers=wiz.answers;
    let cells='';
    meta.choiceQnos.forEach(function(qn,i){
      const a=answers[qn]||'';
      const aArr=Array.isArray(a)?a:((a&&!wiz.multi[qn])?[a]:[]);
      const isMulti=!!(wiz.multi&&wiz.multi[qn]);
      const nOpt=(meta.choiceOpts&&meta.choiceOpts[qn])||4;
      let opts='';
      for(let ci=0;ci<nOpt;ci++){
        const L=String.fromCharCode(65+ci);
        opts+='<span class="opt'+((aArr.indexOf(L)>=0)?' on':'')+'" data-act="wiz-ans" data-q="'+qn+'" data-v="'+L+'">'+L+'</span>';
      }
      const qs=(wiz.perQScore&&wiz.perQScore[qn]!=null)?wiz.perQScore[qn]:'';
      
      cells+='<div class="qcell"><div class="qn">第 '+qn+' 题<input class="inp" style="width:46px;padding:2px 4px;margin-left:6px" data-on="wiz-qscore" data-q="'+qn+'" type="number" step="0.5" min="0" value="'+esc(qs)+'" title="本题分值（留空=默认）"><button class="btn btn-sm'+(isMulti?' btn-p':'')+'" data-act="wiz-multi" data-q="'+qn+'" style="margin-left:4px;padding:2px 6px">'+(isMulti?'多选':'单选')+'</button></div><div class="opts">'+opts+'</div></div>';
    });
    let subjHtml='';
    meta.subjList.forEach(function(sq){
      const sc=wiz.subjective[sq.qno]||{score:sq.score,points:'',answer:''};
      subjHtml+='<div class="card" style="margin-top:10px"><h3>主观题 '+esc(String(sq.qno))+'（'+(sq.parts.length>1?sq.parts.length+' 部分，':'')+'满分 '+esc(sc.score)+' 分）</h3>'
        +'<div class="f-grid">'
        +'<div><label class="f-lb">满分</label><input class="inp" data-on="wiz-sub" data-q="'+esc(sq.qno)+'" data-f="score" type="number" step="0.5" value="'+esc(sc.score)+'"></div>'
        +'<div style="grid-column:1/-1"><label class="f-lb">评分要点（AI 辅助阅卷必填，逐条写明扣分点）</label>'
        +'<textarea class="inp" rows="2" data-on="wiz-sub" data-q="'+esc(sq.qno)+'" data-f="points">'+esc(sc.points)+'</textarea></div>'
        +'<div style="grid-column:1/-1"><label class="f-lb">参考答案（可选）</label>'
        +'<textarea class="inp" rows="2" data-on="wiz-sub" data-q="'+esc(sq.qno)+'" data-f="answer">'+esc(sc.answer)+'</textarea></div>'
        +'</div></div>';
    });
    body='<div class="kv" style="margin-bottom:8px">点击选项循环切换：空 → A → B → C → D → 空；共 '+meta.choiceQnos.length+' 道客观题</div>'
      +'<div class="qgrid">'+cells+'</div>'+subjHtml;
  }else{
    const cls=classes.find(function(c){return c.id===wiz.classId});
    const ansN=Object.keys(wiz.answers).length;
    body='<div class="kv" style="line-height:2">'
      +'<b>考试：</b>'+esc(wiz.name)+'<br>'
      +'<b>班级：</b>'+esc(cls?cls.name:'')+'　<b>模板：</b>'+esc(tpl.name)+'<br>'
      +(wiz.multi&&Object.keys(wiz.multi).length?'<span class="kv">多选 '+Object.keys(wiz.multi).length+' 题</span>　':'')
  +'<b>客观题：</b>'+meta.choiceQnos.length+' 题，已录 '+ansN+' 题，'+(wiz.perQScore&&Object.keys(wiz.perQScore).length?('其中 '+Object.keys(wiz.perQScore).length+' 题自定义分值'):('每题 '+esc(wiz.perScore)+' 分'))+'<br>'
      +'<b>主观题：</b>'+meta.subjList.map(function(s){
        const sc=wiz.subjective[s.qno]||{};
        return esc(String(s.qno))+'（'+esc(sc.score!=null?sc.score:s.score)+'分'+(sc.points?'·已写评分要点':'·<span style="color:var(--danger)">缺评分要点</span>')+'）';
      }).join('　')+'<br>'
      +'<b>流程：</b>保存后 → 「扫描识别」上传扫描件 → 复核 → 阅卷 → 成绩</div>';
  }
  const foot=''+'<button class="btn" data-act="wiz-cancel">取消</button>'
    +(wiz.step>1?'<button class="btn" data-act="wiz-prev">← 上一步</button>':'')
    +(wiz.step<3?'<button class="btn btn-p" data-act="wiz-next">下一步 →</button>':'')
    +(wiz.step===3?'<button class="btn btn-p" data-act="wiz-save">保存考试</button>':'');
  dlg(body,{title:(wiz.examId?'编辑考试':'新建考试')+' · 第 '+wiz.step+'/3 步',foot:foot,wide:true});
  afterRender(function(){
    const n=$('wizName'),c=$('wizClass'),tp=$('wizTpl'),ps=$('wizPerScore');
    if(n)n.addEventListener('input',function(){wiz.name=n.value});
    if(c)c.addEventListener('change',function(){wiz.classId=c.value});
    if(tp)tp.addEventListener('change',function(){wiz.templateId=tp.value;wiz.perScore=null;wizRender()});
    if(ps)ps.addEventListener('input',function(){wiz.perScore=parseFloat(ps.value)||0});
  });
}
Object.assign(ACTS,{
  'wiz-cancel':function(){wiz=null;dlgClose();renderExam()},
  'wiz-next':function(){wiz.step++;wizRender()},
  'wiz-prev':function(){wiz.step--;wizRender()},
  'wiz-ans':async function(el){
    const qn=el.dataset.q;
    const v=el.dataset.v;
    if(wiz.multi&&wiz.multi[qn]){
      const arr=Array.isArray(wiz.answers[qn])?wiz.answers[qn].slice():[];
      const i=arr.indexOf(v);
      if(i>=0)arr.splice(i,1);else arr.push(v);
      arr.sort();
      if(arr.length)wiz.answers[qn]=arr;else delete wiz.answers[qn];
    }else{
      const cur=wiz.answers[qn];
      if(Array.isArray(cur))wiz.answers[qn]=v;
      else if(cur===v)delete wiz.answers[qn];
      else wiz.answers[qn]=v;
    }
    const cell=el.closest('.qcell');
    if(cell){
      cell.querySelectorAll('.opt').forEach(function(o){
        const cur2=wiz.answers[qn];
        const on=Array.isArray(cur2)?cur2.indexOf(o.dataset.v)>=0:cur2===o.dataset.v;
        o.classList.toggle('on',on);
      });
    }
  },
  'wiz-multi':function(el){
    const qn=el.dataset.q;
    if(!wiz.multi)wiz.multi={};
    wiz.multi[qn]=!wiz.multi[qn];
    if(!wiz.multi[qn]){delete wiz.multi[qn];delete wiz.answers[qn];}
    wizRender();
  },
  'wiz-qscore':function(el){
    const q=el.dataset.q;
    if(!wiz.perQScore)wiz.perQScore={};
    const v=parseFloat(el.value);
    if(Number.isFinite(v)&&v>0)wiz.perQScore[q]=Math.round(v*2)/2;
    else delete wiz.perQScore[q];
  },
  'wiz-sub':function(el){
    const q=el.dataset.q;
    const f=el.dataset.f;
    if(!wiz.subjective[q])wiz.subjective[q]={score:0,points:'',answer:''};
    wiz.subjective[q][f]=f==='score'?(parseFloat(el.value)||0):el.value;
  },
  'wiz-save':async function(){
    if(!wiz.name.trim()){toast('请填写考试名称','err');return}
    const ex=wiz.examId?await dbGet('exams',wiz.examId):null;
    const classes=await dbAll('classes');
    const tpls=await dbAll('templates');
    const cls=classes.find(function(c){return c.id===wiz.classId});
    const tpl=tpls.find(function(t){return t.id===wiz.templateId});
    const ansN=Object.keys(wiz.answers).length;
    const meta=await examMeta({templateId:wiz.templateId});
    if(ansN<meta.choiceQnos.length){
      const ok=await dlgConfirm('答案未录完','客观题共 '+meta.choiceQnos.length+' 题，当前只录了 '+ansN+' 题。<br>未录答案的题目将判为「错/空白」，确定继续保存？','仍要保存');
      if(!ok)return;
    }
    const rec=ex||{id:uid('exm_')};
    rec.name=wiz.name.trim();
    rec.classId=wiz.classId;
    rec.className=cls?cls.name:'';
    rec.templateId=wiz.templateId;
    rec.templateName=tpl?tpl.name:'';
    rec.perScore=wiz.perScore||meta.layout.perScore||2;
    rec.answers=wiz.answers;
    rec.perQScore=(wiz.perQScore&&Object.keys(wiz.perQScore).length)?wiz.perQScore:null;
    rec.qMulti=(wiz.multi&&Object.keys(wiz.multi).length)?wiz.multi:null;
    rec.subjective=wiz.subjective;
    rec.createdAt=ex?ex.createdAt:today();
    await dbPut('exams',rec);
    wiz=null;
    dlgClose();
    toast('考试已保存','ok');
    renderExam();
  }
});

/* ---------- 相机拍摄（对标 Pro：取景框+实时锚点反馈；4点即拍） ---------- */
let shotStream=null,shotTimer=null,shotBusy=false,shotAuto=true,shotStable=0;
function shotStop(){
  if(shotTimer){clearInterval(shotTimer);shotTimer=null;}
  if(shotStream){try{shotStream.getTracks().forEach(function(t){t.stop()})}catch(e){}
    shotStream=null;}
}
function shotDetectOnce(video,ov){
  try{
    const w=video.videoWidth,h=video.videoHeight;
    if(!w||!h)return;
    const k=640/Math.max(w,h);
    const fw=Math.round(w*k),fh=Math.round(h*k);
    const cv=document.createElement('canvas');cv.width=fw;cv.height=fh;
    const ctx=cv.getContext('2d');
    ctx.drawImage(video,0,0,fw,fh);
    const gray=toGray(cv);
    const bin=binarize(gray.gray,graysW(gray),graysH(gray),0.75,15);
    const det=detectAnchorsGlobal(bin,fw,fh);
    const o=ov.getContext('2d');
    o.clearRect(0,0,ov.width,ov.height);
    const ox=ov.width/fw,oy=ov.height/fh;
    if(det){
      const n=det.tri?3:4;
      o.strokeStyle=det.tri?'#e6913c':'#25b968';
      o.lineWidth=3;
      det.pts.forEach(function(pt){
        o.strokeRect(pt.x*ox-8,pt.y*oy-8,16,16);
      });
      shotStatus('已找到 '+n+' 个定位点'+(det.tri?'（缺一角，自动外推）':'')+'，保持稳定',det.tri?'warn':'ok');
      if(!det.tri&&shotAuto&&!shotBusy){
        /* 连续 2 帧检测到才自动拍摄，避免移动中抢拍 */
        shotStable++;
        if(shotStable>=2)shotCapture();
      }else if(det.tri)shotStable=0;
    }else{
      shotStable=0;
      o.strokeStyle='rgba(120,220,140,.6)';
      o.lineWidth=2;
      o.strokeRect(ov.width*0.08,ov.height*0.08,ov.width*0.84,ov.height*0.84);
      shotStatus('请将答题卡四角对准绿框（背景/倾斜不影响自动定位）','');
    }
  }catch(e){}
}
function graysW(g){return g.w}
function graysH(g){return g.h}
function shotStatus(txt,cls){
  const el=$('shotStatusTxt');
  if(el){el.textContent=txt;el.className='kv'+(cls?' bd-'+cls:'');}
}
function shotCapture(){
  const video=$('shotVideo');
  if(!video||shotBusy)return;
  shotBusy=true;
  try{
    const MAXL=2400;
    const w=video.videoWidth,h=video.videoHeight;
    if(!w||!h){shotBusy=false;return}
    const k=Math.min(1,MAXL/Math.max(w,h));
    const cv=document.createElement('canvas');
    cv.width=Math.round(w*k);cv.height=Math.round(h*k);
    cv.getContext('2d').drawImage(video,0,0,cv.width,cv.height);
    cv.toBlob(function(blob){
      const file=new File([blob],'camera_'+Date.now()+'.jpg',{type:'image/jpeg'});
      shotStop();dlgClose();
      setTimeout(function(){runScanUpload([file]);setTimeout(function(){scanCtx&&scanCtx.running},0)},120);
      shotBusy=false;
    },'image/jpeg',0.9);
  }catch(e){
    shotStop();dlgClose();toast('拍摄失败：'+(e.message||String(e)),'err');shotBusy=false;
  }
}

function pagesEst(files){

  }
  return n;

/* ---------- 识别框选可视化（参照 Pro：绿框=已识别，红框=未识别/不清晰） ---------- */
async function pageMarkedImage(p){
  try{
    const ex=await dbGet('exams',p.examId);
    if(!ex)return null;
    const tpl=await dbGet('templates',ex.templateId);
    if(!tpl||!p.meta||!p.meta.H)return null;
    const layout=layoutTemplate(tpl);
    const page=layout.pages[p.meta.pageIdx||0];
    /* 必须按识别时的原始长边（2200）加载，H 矩阵坐标才是同一像素空间 */
    const {cv}=await blobCanvas(p.blob,2200);
    const hh=p.meta.H;
    const H=function(x,y){const den=hh[6]*x+hh[7]*y+1;return {x:(hh[0]*x+hh[1]*y+hh[2])/den,y:(hh[3]*x+hh[4]*y+hh[5])/den}};
    const ctx=cv.getContext('2d');
    const mmPx=function(m){return m*(cv.width/page.w)};
    const colorOf=function(ink){
      if(ink>=omr.inkHigh)return 'rgba(28,150,70,.55)';
      if(ink>omr.inkLow)return 'rgba(220,70,40,.6)';
      return 'rgba(110,110,110,.25)';
    };
    const mark=function(cxmm,cymm,wmm,hmm,ink,accent){
      const p1=H(cxmm-wmm/2,cymm),p2=H(cxmm+wmm/2,cymm);
      const pw=Math.max(6,Math.abs(p2.x-p1.x)),ph=Math.max(6,Math.abs(p2.y-p1.y));
      ctx.fillStyle=colorOf(ink);
      ctx.fillRect(p1.x,p1.y- ph/2,pw,ph);
      ctx.lineWidth=Math.max(1.5,cv.width/900);
      ctx.strokeStyle=accent||colorOf(ink);
      ctx.strokeRect(p1.x,p1.y-ph/2,pw,ph);
    };
    const perQmap={};
    (p.meta.perQ||[]).forEach(function(q){perQmap[q.qno]=q});
    page.groups.forEach(function(g){
      for(let r=0;r<g.rows;r++)for(let c=0;c<g.cols;c++){
        const qn=g.first+c*g.rows+r;
        if(qn>g.first+g.count-1)continue;
        const q=perQmap[qn];
        if(!q)continue;
        const rowY=g.y0+2.5+r*g.dy;
        const nOpts=groupQChoices(g,qn);
        for(let ch=0;ch<nOpts;ch++){
          const qg=qBubbleGeom(g,qn,ch);
          const bx=g.x0+c*g.dxq+(qg.bx-g.x0);
          const ink=(q.inks&&q.inks[ch]!=null)?q.inks[ch]:0;
          mark(bx,rowY,qg.bw,qg.bh,ink,(q.choice&&q.choice.indexOf(String.fromCharCode(65+ch))>=0)?'rgba(10,90,40,.95)':'');
        }
      }
    });
    if(page.reg&&p.meta.regPts){
      const reg=page.reg;
      (p.meta.regPts||[]).forEach(function(rp){
        const c=rp.c;
        if(c==null)return;
        (rp.inks||[]).forEach(function(dg){
          const bx=reg.x+c*reg.colW+(reg.colW-reg.bubble)/2+reg.bubble/2;
          mark(bx,reg.rowsY[dg.c],reg.bubble,reg.bubble,dg.ink,(rp.j&&rp.j.ok&&rp.j.digit===dg.c)?'rgba(10,90,40,.95)':'');
        });
      });
    }
    return cv.toDataURL('image/jpeg',0.85);
  }catch(e){return null}
}

/* 重识别单页：更新 page 记录 + 重建该页主观题裁剪 */
async function redoPage(p,cv,layout,opts){
  const res=await recognizeCanvas(cv,layout,p.meta.pageIdx||0,opts);
  /* 本次自动识别考号异常（或为空）时沿用原考号，避免批量重识别冲掉人工改判 */
  const badRead=!res.studentNo||res.studentNo.indexOf('_')>=0||res.studentNo.indexOf('?')>=0;
  const oldClean=p.studentNo&&p.studentNo.indexOf('_')<0&&p.studentNo.indexOf('?')<0;
  if(badRead&&oldClean){res.studentNo=p.studentNo;res.regFlags=['沿用原考号 '+p.studentNo+'（本次自动识别未读出）'];}
  const blob=await canvasToJpeg(cv,0.88);
  const oldNo=p.studentNo;
  p.studentNo=res.studentNo||'';
  p.blob=p.blob;
  p.meta={status:res.status,qrFound:res.qrFound,flags:res.flags.concat(res.regFlags),
    perQ:res.perQ,regFlags:res.regFlags,regPts:res.regPts,layoutW:res.geometry.w,layoutH:res.geometry.h,
    pageIdx:p.meta.pageIdx,srcFile:p.meta.srcFile||'重新识别',srcW:p.meta.srcW,srcH:p.meta.srcH,H:res.H?res.H.h:null};
  await dbPut('pages',p);
  /* 考号变更时，迁移该生的人工改判记录，避免复核记录变成孤儿 */
  if(oldNo&&p.studentNo&&oldNo!==p.studentNo){
    const revsAll=await dbByIdx('revs','byExam',p.examId);
    for(const r of revsAll){
      if(r.studentNo===oldNo){
        await dbDel('revs',r.id);
        r.studentNo=p.studentNo;
        r.id=p.examId+'|'+p.studentNo+'|'+(r.type==='q'?'q'+r.qno:String(r.qno));
        await dbPut('revs',r);
      }
    }
  }
  /* 删除该页旧裁剪（按 pageId 级联，覆盖主观题多部分） */
  const crops=await dbByIdx('crops','byExam',p.examId);
  await dbDelMany('crops',crops.filter(function(c){return c.pageId===p.id}).map(function(c){return c.id}));
  /* 新裁剪 */
  if(res.crops)for(const cp of res.crops){
    const cid=p.examId+'|'+res.studentNo+'|'+cp.qno+'|'+cp.part;
    const old=await dbGet('crops',cid);
    await dbPut('crops',{id:cid,examId:p.examId,exam_q:p.examId+'|'+cp.qno,pageId:p.id,studentNo:res.studentNo,
      qno:cp.qno,part:cp.part,score:cp.score,blob:await canvasToJpeg(cp.cv,0.85),
      thumb:canvasDataURL(canvasToThumb(cp.cv,160),0.7),
      scoreVal:old&&old.scoreVal!=null?old.scoreVal:null,aiScore:old&&old.aiScore!=null?old.aiScore:null,
      aiReason:old&&old.aiReason||'',marked:old&&old.marked||null,markedBy:old&&old.markedBy||'',flag:old&&old.flag||''});
  }
  return res;
}

async function renderGrade(){
  const examsAll=await dbAll('exams');
  const exams=examsAll.slice().sort(function(a,b){return (b.createdAt||'').localeCompare(a.createdAt||'')});
  if(!ui.gradeExam||!(exams.find(function(e){return e.id===ui.gradeExam})))ui.gradeExam=exams.length?exams[0].id:null;
  if(!ui.gradeExam){
    $('page').innerHTML='<div class="card">'+emptyBox('📋','没有考试。请先创建考试并扫描识别，生成主观题裁剪图。')
      +'<button class="btn btn-p" data-act="go-exam">去创建考试</button></div>';
    return;
  }
  const ex=await dbGet('exams',ui.gradeExam);
  if(!gradeCtx||gradeCtx.examId!==ex.id){gradeCtx=null;ui.gradeQno=null;}
  if(!ui.gradeQno){
    const meta=await examMeta(ex);
    if(!meta){$('page').innerHTML='<div class="card">'+emptyBox('⚠️','该考试使用的答题卡模板不存在或已删除。')+'</div>';return}
    const cropsAll=await dbByIdx('crops','byExam',ex.id);
    const crops=cropsAll;
    let html='<div class="card"><h3>当前考试</h3><div class="f-row">'
      +'<select class="inp" style="width:220px" data-on="grade-pick">'
      +exams.map(function(e){return '<option value="'+e.id+'"'+(e.id===ex.id?' selected':'')+'>'+esc(e.name)+'</option>'}).join('')+'</select>'
      +'<span class="tip">按主观题逐题阅卷；每小题对应一份裁剪图，打分即存。</span></div></div>';
    html+='<div class="card"><h3>主观题进度</h3>';
    if(!meta.subjList.length){html+=emptyBox('','该模板没有主观题区，无需人工阅卷，直接到「成绩分析」查看。');}
    else{
      for(const sq of meta.subjList){
        const list=crops.filter(function(c){return String(c.qno)===String(sq.qno)});
        const done=list.filter(function(c){return c.scoreVal!=null}).length;
        const avg=list.length&&list.filter(function(c){return c.scoreVal!=null}).length? (list.reduce(function(a,c){return a+(c.scoreVal||0)},0)/Math.max(1,list.filter(function(c){return c.scoreVal!=null}).length)) : 0;
        const unique={};list.forEach(function(c){unique[c.studentNo]=1});
        const total=Object.keys(unique).length;
        html+='<div class="scan-item"><div style="flex:1;min-width:220px">'
          +'<div style="font-weight:700">题 '+esc(String(sq.qno))+'（满分 '+esc(sq.score)+' 分'+(sq.parts.length>1?' · '+sq.parts.length+' 部分':'')+'）</div>'
          +'<div class="kv">已阅 '+done+' / '+total+' 份　·　平均分 '+avg.toFixed(1)+'</div>'
          +'</div>'
          +'<div style="width:160px"><div class="progress"><div style="width:'+(total?Math.round(done/total*100):0)+'%"></div></div></div>'
          +'<button class="btn btn-s btn-p" data-act="grade-open-q" data-q="'+esc(String(sq.qno))+'">开始阅卷</button>'
          +'<button class="btn btn-s btn-o" data-act="grade-ai-batch-open" data-q="'+esc(String(sq.qno))+'">AI 预阅未评分</button>'
          +'</div>';
      }
    }
    html+='</div>';
    $('page').innerHTML=html;
    return;
  }
  await renderGradeView(ex);
}

function gradeShuffle(){
  const a=gradeCtx.order.slice();
  if(gradeCtx.shuffle){
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      const t=a[i];a[i]=a[j];a[j]=t;
    }
  }
  gradeCtx.order=a;
}

  const meta=await examMeta(ex);

  const no=gradeCtx.order[gradeCtx.idx];

async function gradeSetScoreLocal(studentNo,v){
  const ex=await dbGet('exams',ui.gradeExam);
  const cropsAll=await dbByIdx('crops','byExam',ex.id);
  const list=cropsAll.filter(function(c){return c.studentNo===studentNo&&String(c.qno)===String(gradeCtx.qno)}).sort(function(a,b){return a.part-b.part});
  for(const c of list){
    c.scoreVal=v;
    c.markedBy='manual';
    c.flag=(v==null)?'':c.flag;
    if(c.marked)releaseBlobURL(c.marked);
    c.marked=(v!=null)?await cropMarkedImage(c,v):null;
    await dbPut('crops',c);
  }
}
async function gradeToggleFlag(flag){

  for(const c of list){
    c.flag=(flag==='F'&&c.flag==='F')?'':(flag==='G'&&c.flag==='G')?'':flag;
    await dbPut('crops',c);

}
async function cropMarkedImage(crop,w){
  try{
    const img=await createImageBitmap(crop.blob);
    const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;

    ctx.font='bold '+fs+'px Arial,sans-serif';
    const tw=ctx.measureText(txt).width;

    const bx=cv.width-tw-pad*2-14,by=cv.height-fs-pad*2-12;
    ctx.fillStyle='rgba(20,25,32,.78)';

    ctx.fill();

    ctx.fillText(txt,bx+pad,by+(fs+pad*1.2)/2);

  }catch(e){return null}
}

async function computeScorebook(examId){
  const {exam,pages,crops,revs,students}=await examData(examId);
  if(!exam)return null;
  const meta=await examMeta(exam);
  if(!meta)return {error:'模板不存在或已删除，无法计算成绩',exam:exam,meta:null,rows:[],perQStat:{},perScore:0};
  const perScore=exam.perScore||meta.layout.perScore||2;
  const scoreOf=function(qn){
    if(exam.perQScore&&exam.perQScore[qn]!=null)return exam.perQScore[qn];
    return perScore;
  };
  const byNo={};
  pages.forEach(function(p){
    const no=p.studentNo||'(未识别)';
    if(!byNo[no])byNo[no]={pages:[],perQ:{}};
    byNo[no].pages.push(p);
    (p.meta&&p.meta.perQ||[]).forEach(function(q){
      const cur=byNo[no].perQ[q.qno];
      if(!cur)byNo[no].perQ[q.qno]=q;
      else if(cur.verdict==='REVIEW'&&q.verdict!=='REVIEW')byNo[no].perQ[q.qno]=q;
    });
  });
  const studentByNo={};
  students.forEach(function(s){studentByNo[String(s.no)]=s});
  const noSet={};
  students.forEach(function(s){noSet[String(s.no)]=true});
  Object.keys(byNo).forEach(function(no){if(byNo[no]&&byNo[no].pages.length)noSet[no]=true});
  const rows=[];
  Object.keys(noSet).forEach(function(no){
    const st=studentByNo[no];
    const src=byNo[no];
    const absent=!src||!src.pages.length;
    const obj={};let objScore=0;
    meta.choiceQnos.forEach(function(qn){
      const q=(src&&src.perQ[qn])||{verdict:'NOREC'};
      const ov=revs.find(function(r){return r.studentNo===no&&r.qno===qn&&r.type==='q'});
      const verdict=ov?ov.verdict:q.verdict;
      const choice=ov?ov.choice:q.choice;
      let tf;
      if(verdict==='OK'||verdict==='MULTI'){
        /* 单选答案=单字母；多选答案=数组；集合比对，全对才得满分 */
        const rawAns=(exam.answers||{})[qn];
        const ansArr=rawAns==null?[]:(Array.isArray(rawAns)?rawAns.map(function(s){return String(s).toUpperCase()}):String(rawAns).toUpperCase().split(''));
        const selArr=choice?String(choice).split(''):[];
        const same=(ansArr.length===selArr.length)&&ansArr.slice().sort().join('')===selArr.slice().sort().join('');
        tf=same&&ansArr.length?'RIGHT':'WRONG';
      }else tf=verdict;
      if(tf==='RIGHT')objScore+=scoreOf(qn);
      obj[qn]={verdict:tf,choice:choice,full:scoreOf(qn)};
    });
    const subj={};let subjScore=0,subjGraded=0;
    meta.subjList.forEach(function(sq){
      const cs=crops.filter(function(c){return c.studentNo===no&&String(c.qno)===String(sq.qno)}).sort(function(a,b){return a.part-b.part});
      const score=cs.length?cs[0].scoreVal:null;
      subj[sq.qno]={score:score,full:sq.score,ai:cs.length?cs[0].aiScore:null,marked:cs.length?cs[0].marked:null};
      if(score!=null){subjScore+=score;subjGraded++;}
    });
    rows.push({no:no,name:st?st.name:'（未匹配名单）',note:st?st.note:'',absent:absent,
      obj:obj,objScore:objScore,subj:subj,subjScore:subjScore,subjGraded:subjGraded,
      total:objScore+subjScore});
  });
  rows.sort(function(a,b){return (b.total-a.total)||String(a.no).localeCompare(String(b.no))});
  rows.forEach(function(r,i){r.rank=i+1});
  const perQStat={};
  meta.choiceQnos.forEach(function(qn){
    const s={ok:0,wrong:0,blank:0,multi:0,review:0,norec:0,n:0,rate:0,dist:{}};
    rows.forEach(function(r){
      if(r.absent)return; /* 得分率按实考人数统计，缺考不计入分母 */
      const v=r.obj[qn];
      if(!v)return;
      s.n++;
      if(v.verdict==='RIGHT')s.ok++;
      else if(v.verdict==='WRONG'){s.wrong++;const c=v.choice||'?';s.dist[c]=(s.dist[c]||0)+1;}
      else if(v.verdict==='BLANK')s.blank++;
      else if(v.verdict==='MULTI')s.multi++;
      else if(v.verdict==='REVIEW')s.review++;
      else s.norec++;
    });
    s.rate=s.n?s.ok/s.n:0;
    perQStat[qn]=s;
  });
    const objFull=meta.choiceQnos.reduce(function(a,qn){return a+scoreOf(qn)},0);
  return {exam:exam,meta:meta,rows:rows,perQStat:perQStat,perScore:perScore,objFull:objFull,scoreOf:scoreOf};
}

function max0(book){
  let t=0;
  book.meta.subjList.forEach(function(s){t+=s.score});
  return t+book.objFull;
}
function drawTotalHist(full,rows){
  const cv=$('totalHist');
  if(!cv)return;
  const w=cv.width=cv.clientWidth||560,h=cv.height=150;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const bins=12,data=new Array(bins).fill(0);
  rows.forEach(function(r){
    if(r.absent)return;
    const b=Math.min(bins-1,Math.floor(r.total/Math.max(1,full)*bins));
    data[b]++;
  });
  const maxC=Math.max(1,Math.max.apply(null,data));
  const bw=w/bins*0.7;
  ctx.fillStyle='#33507A';
  data.forEach(function(c,i){
    const x=i*(w/bins)+(w/bins-bw)/2;
    const bh=c/maxC*(h-36);
    ctx.fillRect(x,h-26-bh,bw,bh);
    ctx.fillStyle='#5A4E3C';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(Math.round((i+0.5)/bins*full),x+bw/2,h-12);
  });
  ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillText('总分分布（横轴=分数段）',6,14);
}
function drawPassDonut(full,rows){
  const cv=$('passDonut');
  if(!cv)return;
  const w=cv.width=cv.clientWidth<260?260:cv.clientWidth,h=cv.height=150;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const good=rows.filter(function(r){return !r.absent&&r.total>=full*0.8}).length;
  const well=rows.filter(function(r){return !r.absent&&r.total>=full*0.7&&r.total<full*0.8}).length;
  const pass=rows.filter(function(r){return !r.absent&&r.total>=full*0.6&&r.total<full*0.7}).length;
  const fail=rows.filter(function(r){return !r.absent&&r.total<full*0.6}).length;
  const total=good+well+pass+fail;
  if(!total){ctx.fillStyle='#999';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('暂无成绩',w/2,h/2);return}
  const cx=w/2,cy=h/2,R=Math.min(w,h)/2-12;
  const segs=[[good,'#1F8A70'],[well,'#33507A'],[pass,'#B8860B'],[fail,'#B8B2A6']];
  let a=-Math.PI/2;
  segs.forEach(function(sg){
    const frac=sg[0]/total;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,a,a+frac*Math.PI*2);
    ctx.fillStyle=sg[1];
    ctx.fill();
    a+=frac*Math.PI*2;
  });
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,R*0.58,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2C3E50';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillText(total+' 人',cx,cy-2);
  ctx.fillStyle='#999';ctx.font='10px sans-serif';
  ctx.fillText('参评',cx,cy+13);
  ctx.fillStyle='#666';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('优秀'+good+'　良好'+well+'　合格'+pass+'　待合格'+fail,cx,h-4);
}
