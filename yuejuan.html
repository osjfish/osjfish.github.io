const sleep2=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
async function withRetry(fn){
  let last=null;
  for(let attempt=1;attempt<=2;attempt++){
    try{return await fn()}
    catch(e){
      last=e;
      if(e.name==='AbortError')throw e;
      const msg=String(e.message||'');
      const retriable=/429|5\d\d|Failed to fetch|network error|timeout|ECONN|socket|abort/i.test(msg);
      if(!retriable||attempt>=2)throw e;
      await sleep2(2000*attempt);
    }
  }
  throw last;
}
function ensureAI(){
  const provider=ai.provider;
  const key=(ai.keys[provider]||'').trim();
  if(!key){toast('请先在「设置 → AI 服务」中填写 API Key','err');return false}
  const url=provider==='custom'?(ai.customUrl||'').trim():PROVIDERS[provider].url;
  if(!url){toast('自定义服务需填写接口地址','err');return false}
  return true;
}
async function callVision(prompt,images,signal){
  const provider=ai.provider;
  const url=provider==='custom'?(ai.customUrl||'').trim():PROVIDERS[provider].url;
  const key=(ai.keys[provider]||'').trim();
  const model=(ai.models[provider]||'').trim()||PROVIDERS[provider].models[0];
  const messages=[
    {role:'system',content:'你是一位经验丰富、认真负责的阅卷老师。评分时，你是执行主流阅卷标准的严格阅卷人：每一分都必须有卷面依据，发现错误必须扣分，不得因"整体印象尚可"而免扣具体问题。所有输出使用简体中文。'},
    {role:'user',content:images.length?[{type:'text',text:prompt},...images.map(function(u){return {type:'image_url',image_url:{url:u}}})]:prompt}
  ];
  const res=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:model,messages:messages,temperature:ai.temp||0.35,max_tokens:ai.maxTokens||4096,stream:false}),
    signal:signal||undefined
  });
  if(!res.ok){
    let msg='HTTP '+res.status;
    try{const j=await res.json();msg=j.error&&(j.error.message||j.error.msg)||j.msg||JSON.stringify(j).slice(0,200)||msg}catch(e){}
    throw new Error(msg);
  }
  const data=await res.json();
  const c=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
  if(!c)throw new Error('接口未返回内容');
  return c;
}
function parseResult(text){
  let s=String(text).trim();
  s=s.replace(/^\`\`\`(?:json)?\s*/i,'').replace(/\s*\`\`\`$/,'');
  const a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<=a)throw new Error('AI 返回内容不是 JSON：'+s.slice(0,120));
  let obj;
  try{obj=JSON.parse(s.slice(a,b+1))}
  catch(e){
    const fixed=s.slice(a,b+1).replace(/,\s*([}\]])/g,'$1').replace(/[\u201c\u201d]/g,'"');
    try{obj=JSON.parse(fixed)}catch(e2){throw new Error('JSON 解析失败：'+s.slice(0,120))}
  }
  if(typeof obj!=='object'||obj===null)throw new Error('AI 返回内容不是对象');
  return obj;
}
async function cropToDataURL(crop,maxW,q){
  const img=await createImageBitmap(crop.blob);
  const sc=Math.min(1,maxW/(img.width||1));
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(img.width*sc));
  cv.height=Math.max(1,Math.round(img.height*sc));
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',q||0.82);
}
async function aiSuggestItem(ex,parts,qno,ctl){
  if(!ensureAI())throw new Error('先配置 AI');
  const meta=await examMeta(ex);
  const sq=meta.subjList.find(function(s){return String(s.qno)===String(qno)});
  const full=sq?sq.score:100;
  const subjMeta=(ex.subjective||{})[qno]||{score:full,points:'',answer:''};
  const level=IMG_LEVELS[ai.imgLevel]||IMG_LEVELS.std;
  const images=[];
  for(const p of parts)images.push(await cropToDataURL(p,level.w,level.q));
  const strictMap={loose:'宽松',std:'适中',strict:'严格'};
  const strictLine=(omr.aiStrict&&omr.aiStrict!=='std')?('\n（本场严格度：'+strictMap[omr.aiStrict]+'档，请按该档把握扣分尺度）'):'';
  const prompt='【题目】第 '+qno+' 题（'+(sq?sq.type:'')+'）\n'
    +'【满分】'+full+' 分\n'
    +'【评分要点】'+((subjMeta.points||'').trim()||'（未提供，请按主流标准）')+'\n'
    +'【参考答案】'+((subjMeta.answer||'').trim()||'（未提供）')+'\n'
    +'【评分规则】\n'
    +'1. 先通读作答，把所有问题逐条列全（错别字、病句、计算错误、步骤缺失、漏答未答、未按要求等），不许遗漏、不许美化；\n'
    +'2. 评分采用"从满分往下扣"：每处问题按评分要点扣除对应分数，注明扣分原因；'+strictLine+'\n'
    +'3. 得分可以有小数，不得为凑整抬高分数；每一处扣分都要能在卷面上指出来；\n'
    +'4. 若要点中各维度标有分值，必须按维度给分（dimScores），总分为各维度之和。\n'
    +'【输出要求】只输出 JSON：{"problems":"问题清单","dimScores":{"维度":分}|null,"score":数字,"reason":"一句话总评"}，不要其他文字。';
  const content=await withRetry(function(){return callVision(prompt,images,ctl?ctl.signal:undefined)});
  const d=parseResult(content);
  let score=d.score;
  if(d.dimScores&&typeof d.dimScores==='object'){
    let s=0,has=false;
    for(const k in d.dimScores){has=true;s+=Number(d.dimScores[k])||0;}
    if(has&&Number.isFinite(s)&&s>=0)score=s;
  }
  return {score:Number.isFinite(Number(score))?Number(score):null,reason:d.reason||'',
    problems:d.problems||'',dimScores:d.dimScores||null,full:full};
}
async function aiSuggestExam(examId,studentNo,qno){
  const ex=await dbGet('exams',examId);
  const cropsAll=await dbByIdx('crops','byExam',examId);
  const parts=cropsAll.filter(function(c){return c.studentNo===studentNo&&String(c.qno)===String(qno)}).sort(function(a,b){return a.part-b.part});
  return aiSuggestItem(ex,parts,qno,null);
}

    ai.keys[ai.provider]=$('aiKey').value.trim();
    const p=ai.provider,m=$('aiModelCustom').value.trim()||$('aiModel').value;
    const url=p==='custom'?$('aiCustomUrl').value.trim():PROVIDERS[p].url;
    if(!url){toast('请填写接口地址','err');return}

      });
      if(!res.ok){const j=await res.json().catch(function(){return null});throw new Error((j&&(j.error&&j.error.message||j.msg))||('HTTP '+res.status));}
      const d=await res.json();
      const c=d.choices&&d.choices[0]&&d.choices[0].message&&d.choices[0].message.content;

async function backupExport(includeBlobs){
  try{
    toast('正在打包数据…');
    const pages=await dbAll('pages');
    const crops=await dbAll('crops');
    const head={app:'yuejuan',v:1,exportedAt:timestamp(),
      data:{classes:await dbAll('classes'),students:await dbAll('students'),templates:await dbAll('templates'),exams:await dbAll('exams')},
      revs:await dbAll('revs')};
    if(!includeBlobs){
      const pack={app:head.app,v:1,exportedAt:head.exportedAt,data:head.data,revs:head.revs,
        pages:pages.map(function(p){return {id:p.id,examId:p.examId,pageNo:p.pageNo,studentNo:p.studentNo,meta:p.meta}}),
        crops:crops.map(function(c){return {id:c.id,examId:c.examId,pageId:c.pageId||'',studentNo:c.studentNo,qno:c.qno,part:c.part,score:c.score,scoreVal:c.scoreVal,aiScore:c.aiScore,aiReason:c.aiReason,flag:c.flag,markedBy:c.markedBy}})};
      download('智能阅卷备份_'+tsName()+'.json',JSON.stringify(pack),'application/json;charset=utf-8');
      toast('备份已导出','ok');
      return;
    }
    /* 完整备份：分块构造 JSON 并直接组装 Blob，避免把数百 MB 一次 stringify 成单个巨型字符串 */
    const b64p=function(blob){return new Promise(function(res){if(!blob)return res(null);const fr=new FileReader();fr.onload=function(){res(String(fr.result||'').split(',')[1]||'')};fr.onerror=function(){res(null)};fr.readAsDataURL(blob);})};
    const chunks=['{"app":"yuejuan","v":1,"exportedAt":'+JSON.stringify(head.exportedAt)+',"data":'+JSON.stringify(head.data)+',"revs":'+JSON.stringify(head.revs)+',"pages":['];
    let first=true;
    for(const p of pages){
      chunks.push((first?'':',')+JSON.stringify({id:p.id,examId:p.examId,pageNo:p.pageNo,studentNo:p.studentNo,meta:p.meta,b64:await b64p(p.blob),thumb:p.thumb||''}));
      first=false;
    }
    chunks.push('],"crops":[');
    first=true;
    for(const c of crops){
      chunks.push((first?'':',')+JSON.stringify({id:c.id,examId:c.examId,pageId:c.pageId||'',studentNo:c.studentNo,qno:c.qno,part:c.part,score:c.score,
        scoreVal:c.scoreVal,aiScore:c.aiScore,aiReason:c.aiReason,flag:c.flag,markedBy:c.markedBy,thumb:c.thumb||'',
        b64:await b64p(c.blob),markedB64:await b64p(c.marked)}));
      first=false;
    }
    chunks.push(']}');
    download('智能阅卷备份_'+tsName()+'.json',new Blob(chunks,{type:'application/json;charset=utf-8'}),'application/json;charset=utf-8');
    toast('备份已导出','ok');
  }catch(err){toast('导出失败：'+err.message,'err')}
}
async function backupImport(file){
  try{
    toast('解析备份…');
    const obj=JSON.parse(await file.text());
    if(obj.app!=='yuejuan')throw new Error('不是本系统的备份文件');
    const ok=await dlgConfirm('导入备份','导入将<b>覆盖现有全部数据</b>（班级/学生/模板/考试/识别/判分）。目标环境已有数据会丢失，确定？','覆盖导入');
    if(!ok)return;
    for(const s of ['classes','students','templates','exams','pages','crops','revs'])await dbClear(s);
    for(const k of ['classes','students','templates','exams'])for(const it of (obj.data[k]||[]))await dbPut(k,it);
    for(const r of (obj.revs||[]))await dbPut('revs',r);
    /* 恢复扫描页/裁剪图（完整备份按 base64 还原；最小备份仅还原元数据/判分） */
    const full=obj.pages&&obj.pages.length&&obj.pages[0].b64;
    if(obj.pages)for(const p of obj.pages){
      await dbPut('pages',{id:p.id,examId:p.examId,pageNo:p.pageNo,studentNo:p.studentNo||'',meta:p.meta||{},
        blob:full&&p.b64?await b64ToBlob(p.b64):null,thumb:full&&p.thumb||''});
    }
    if(obj.crops)for(const c of obj.crops){
      await dbPut('crops',{id:c.id,examId:c.examId,exam_q:c.examId+'|'+c.qno,pageId:c.pageId||'',
        studentNo:c.studentNo||'',qno:c.qno,part:c.part||0,score:c.score,
        scoreVal:c.scoreVal!=null?c.scoreVal:null,aiScore:c.aiScore!=null?c.aiScore:null,
        aiReason:c.aiReason||'',flag:c.flag||'',markedBy:c.markedBy||'',
        blob:full&&c.b64?await b64ToBlob(c.b64):null,marked:full&&c.markedB64?await b64ToBlob(c.markedB64):null,
        thumb:full&&c.thumb||''});
    }
    toast('导入完成（'+((obj.data&&obj.data.students||[]).length)+' 名学生 / '+(obj.data.exams||[]).length+' 场考试'
      +(full?' · 已恢复扫描图':' · 未含扫描图（可重扫）')+'）','ok');
    go('home');
  }catch(err){toast('导入失败：'+err.message,'err')}
}
