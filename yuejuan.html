/* 把某页的裁剪图归属迁移到新考号（改判后保证阅卷/成绩能看到这些作答） */
async function reassignPageCrops(examId,pageId,newNo){
  const crops=await dbByIdx('crops','byExam',examId);
  const list=crops.filter(function(c){return c.pageId===pageId&&c.studentNo!==newNo});
  let n=0;
  for(const c of list){
    const nid=examId+'|'+newNo+'|'+c.qno+'|'+c.part;
    if(nid===c.id)continue;
    const img=await getBlob(c.id),mk=await getBlob(c.id+'|mk'),th=await getBlob(c.id+'|t');
    const rec=Object.assign({},c,{id:nid,studentNo:newNo,exam_q:examId+'|'+c.qno});
    await dbPut('crops',rec);
    if(img)await putBlob(nid,img);
    if(mk)await putBlob(nid+'|mk',mk);
    if(th)await putBlob(nid+'|t',th);
    await dbDel('crops',c.id);
    await delBlob(c.id);await delBlob(c.id+'|mk');await delBlob(c.id+'|t');
    n++;
  }
  return n;
}
/* 考号改判后：把同一份答题卡的续页（其后、页码递增、且无有效考号）一并归属该考号。
   按创建顺序（id 含时间戳）向后走，页码回到第 1 页或遇到已归属考号的页即停（那是新的一份）。
   同时把这些续页的裁剪图归属一并迁移，否则阅卷/成绩里看不到它们的作答。
   另：单张/拍照逐张上传时若续页先于首页上传（乱序），也向前回溯认领——仅限「无有效考号且页码>1」的
   相邻页，遇到页码为 1（另一份卡的开头）或已归属考号即停，避免跨学生误并。 */
async function propagateRegOverride(p,no){
  const okNo=function(v){return v&&v.indexOf('_')<0&&v.indexOf('?')<0};
  const pages=await dbByIdx('pages','byExam',p.examId);
  const sorted=pages.slice().sort(function(a,b){return String(a.id).localeCompare(String(b.id))});
  const at=sorted.findIndex(function(x){return x.id===p.id});
  if(at<0)return 0;
  let n=0;
  const claim=async function(q){
    q.studentNo=no;
    q.meta=q.meta||{};
    q.meta.regFlags=['考号沿用首页改判（'+no+'）'];
    await dbPut('pages',q);
    await reassignPageCrops(q.examId,q.id,no);
    n++;
  };
  /* 向后：页码递增（2,3,4…） */
  let cur=p.pageNo||1;
  for(let i=at+1;i<sorted.length;i++){
    const q=sorted[i];
    if(okNo(q.studentNo))break;      /* 已归属别的考号 → 新的一份，停止 */
    if(!((q.pageNo||1)>cur))break;   /* 页码未递增（回到第 1 页）→ 新的一份，停止 */
    cur=q.pageNo||cur;
    await claim(q);
  }
  /* 向前：逐张上传时续页可能先于首页入批（乱序/补传首页），回溯认领其前面无考号且页码>1 的相邻页；
     遇到页码回到第 1 页（另一份卡的开头）或已归属考号的页即停 */
  for(let i=at-1;i>=0;i--){
    const q=sorted[i];
    if(okNo(q.studentNo))break;
    if((q.pageNo||1)<=1)break;
    await claim(q);
  }
  return n;
}
/* 全卷 AI：把所有主观题的未评分作答一次跑完（writeScore=false 仅预评；true 直接写入成绩）。
   二次确认 + 整体进度 + 可中途停止。 */
async function runAIWholeExam(ex,writeScore){
  const meta=await examMeta(ex);
  if(!meta)  {toast('该考试的答题卡模板不存在或已删除','err');return}
  if(!meta.subjList.length){toast('该模板没有主观题，无需 AI 评阅','ok');return}
  let cropsAll=await dbByIdx('crops','byExam',ex.id);
  /* 收集所有主观题未评分项 */
  const jobs=[];
  meta.subjList.forEach(function(sq){
    const list=cropsAll.filter(function(c){return String(c.qno)===String(sq.qno)});
    const seen={};
    list.forEach(function(c){
      if(c.scoreVal==null&&!seen[c.studentNo]){
        seen[c.studentNo]=1;
        jobs.push({qno:sq.qno,full:sq.score,no:c.studentNo,
          parts:list.filter(function(x){return x.studentNo===c.studentNo}).sort(function(a,b){return a.part-b.part})});
      }
    });
  });
  if(!jobs.length){toast('全卷主观题没有未评分项','ok');return}
  const withAI=jobs.filter(function(j){return j.parts[0].aiScore!=null}).length;
  const needCall=jobs.length-withAI;
  if(needCall>0&&!ensureAI())return;
  const title=writeScore?'全卷 AI 给分':'全卷 AI 预评';
  const det=writeScore
    ?('将按 AI 建议分直接写入成绩：已有建议的 '+withAI+' 份直接采用，未预评的 '+needCall+' 份先调用 AI 再写入。')
    :('将为 '+jobs.length+' 份未评分作答生成 AI 建议分（'+meta.subjList.length+' 道主观题，不写入成绩）。');
  /* 第一次确认 */
  const ok1=await dlgConfirm(title,'题量：'+meta.subjList.length+' 道主观题、'+jobs.length+' 份未评分作答（已有 AI 建议 '+withAI+' 份）。<br>'+det+'<br>调用量较大、耗时较长，可中途停止。','继续');
  if(!ok1)return;
  /* 第二次确认（不可撤销/大量调用） */
  const ok2=await dlgConfirm('最后确认',writeScore
      ?('确定把 '+withAI+' 份已有建议直接写入成绩'+(needCall?('，并调用 AI 评阅剩余 '+needCall+' 份'):'（不再调用 AI）')+'？<br>写入后可在阅卷台逐份手改。')
      :('确定开始全卷 AI 预评？将调用 AI '+jobs.length+' 次（2 路并发）。'),'确定执行');
  if(!ok2)return;
  dlg('<div class="prog-line"><span id="aiAllTxt">AI 分析中 0/'+jobs.length+'</span></div>'
    +'<div class="progress"><div id="aiAllBar" style="width:0%"></div></div>'
    +'<div class="tip" id="aiAllLog"></div>',
    {title:title+' · '+esc(ex.name),foot:'<button class="btn btn-d" data-act="ai-batch-stop">停止</button>'});
  const ctl={signal:{aborted:false}};
  const ac=new AbortController();
  ctl.signal=ac.signal;
  window.__yjAiAllAbort=function(){try{ac.abort()}catch(e){}};
  let next=0,doneN=0,byQ={};
  async function worker(){
    while(!ac.signal.aborted){
      const i=next;next++;
      if(i>=jobs.length)break;
      const j=jobs[i];
      try{
        let score=null;
        if(writeScore&&j.parts[0].aiScore!=null){
          score=Math.min(j.full,Math.max(0,Number(j.parts[0].aiScore)||0));
        }else{
          const r=await aiSuggestItem(ex,j.parts,j.qno,{signal:ac.signal});
          score=r.score!=null?(Math.min(j.full,Math.max(0,Number(r.score)||0))):null;
          if(!writeScore&&score!=null){
            const reason=(r.reason||'')+'\n【问题】'+(r.problems||'');
            for(const c of j.parts){c.aiScore=score;c.aiReason=reason;await dbPut('crops',c);}
          }
        }
        if(writeScore&&score!=null)await gradeSetScoreLocal(j.no,score,'ai',j.qno);
        doneN++;byQ[j.qno]=(byQ[j.qno]||0)+1;
        const t1=$('aiAllTxt');
        if(t1)t1.textContent='AI 分析中 '+(i+1)+'/'+jobs.length+'（题'+j.qno+' '+esc(j.no)+' → '+(score!=null?score+' 分':'无建议')+'）';
        const b1=$('aiAllBar');
        if(b1)b1.style.width=Math.round((i+1)/jobs.length*100)+'%';
      }catch(err){
        if(err.name!=='AbortError'){
          const lg=$('aiAllLog');
          if(lg)lg.textContent='题'+j.qno+' '+j.no+' 出错：'+(err.message||String(err));
        }
        const b1=$('aiAllBar');
        if(b1)b1.style.width=Math.round((i+1)/jobs.length*100)+'%';
      }
    }
  }
  await Promise.all([worker(),worker()]);
  const stopped=ac.signal.aborted;
  const lg=$('aiAllLog');
  if(lg)lg.textContent=(stopped?'已停止':'完成')+'：本次处理 '+doneN+' 份';
  toast((stopped?'已停止，':'')+'全卷 AI '+(writeScore?'给分':'预评')+'完成：'+doneN+' 份'+(writeScore?'已写入成绩':''),stopped?'':'ok');
  if(!stopped)setTimeout(dlgClose,1200); else dlgClose();
  renderGrade();
}
/* 重识别单页：更新 page 记录 + 重建该页主观题裁剪 */
async function redoPage(p,cv,layout,opts){
  opts=opts||{};
  /* 未显式指定页时自动匹配页号（修正历史错配的页：如把续页当首页扫出来的记录）；
     显式指定 manualPts 时页号必须固定，否则手动锚点与版式不符 */
  let res,pageIdx=opts.pageIdx;
  if(pageIdx==null&&!opts.manualPts&&layout.pages.length>1){
    let hasQR=false;
    try{hasQR=!!qrFromCanvas(cv)}catch(e){}
    const wq=[],nq=[];
    layout.pages.forEach(function(pg,i){(pg.qr?wq:nq).push(i)});
    const pref=p.meta&&p.meta.pageIdx;
    const grp=hasQR?wq:nq;
    const at=grp.indexOf(pref);
    if(at>0){grp.splice(at,1);grp.unshift(pref)} /* 原页号优先尝试，多数情况一次命中 */
    const order=hasQR?wq.concat(nq):nq.concat(wq);
    for(const pi of order){
      res=await recognizeCanvas(cv,layout,pi,opts);
      pageIdx=pi;
      if(res.status==='ok')break;
    }
  }else{
    /* 页号钳制在版式范围内：历史记录/模板改版后 pageIdx 可能越界，越界会取到 undefined 版式而抛错 */
    const maxIdx=Math.max(0,layout.pages.length-1);
    pageIdx=(pageIdx==null)?(Math.min(maxIdx,p.meta.pageIdx||0)):Math.min(maxIdx,pageIdx);
    res=await recognizeCanvas(cv,layout,pageIdx,opts);
  }
  /* 人工改判优先：识别失败（定位失败/解析异常）时也要保留用户显式指定的考号 */
  if(opts.regOverride)res.studentNo=String(opts.regOverride).trim();
  /* 本次自动识别考号异常（或为空）时沿用原考号，避免批量重识别冲掉人工改判 */
  const badRead=!res.studentNo||res.studentNo.indexOf('_')>=0||res.studentNo.indexOf('?')>=0;
  const oldClean=p.studentNo&&p.studentNo.indexOf('_')<0&&p.studentNo.indexOf('?')<0;
  if(badRead&&oldClean){res.studentNo=p.studentNo;res.regFlags=['沿用原考号 '+p.studentNo+'（本次自动识别未读出）'];}
  else if(!res.studentNo){
    /* 续页无考号区：沿用该考试最近识别出的考号（覆盖分次上传与批量重识别两种情形） */
    let lno='';
    try{lno=localStorage.getItem('yj_lastno_'+p.examId)||''}catch(e){}
    if(lno){res.studentNo=lno;res.regFlags=['本页无考号区，沿用考号 '+lno];}
  }
  const blob=await canvasToJpeg(cv,0.88);
  const oldNo=p.studentNo;
  p.studentNo=res.studentNo||'';
  if(res.detectedPageNo)p.pageNo=res.detectedPageNo;
  p.meta={status:res.status,qrFound:res.qrFound,flags:res.flags.concat(res.regFlags),
    perQ:res.perQ,regFlags:res.regFlags,regPts:res.regPts,layoutW:res.geometry?res.geometry.w:p.meta.layoutW,
    layoutH:res.geometry?res.geometry.h:p.meta.layoutH,
    pageIdx:pageIdx,filePage:p.meta.filePage,srcFile:p.meta.srcFile||'重新识别',srcW:p.meta.srcW,srcH:p.meta.srcH,H:res.H?res.H.h:null};
  await dbPut('pages',p);
  await putBlob(p.id,blob);
  /* 考号变更时，迁移该生的人工改判记录，避免复核记录变成孤儿 */
  if(oldNo&&p.studentNo&&oldNo!==p.studentNo){
    const revsAll=await dbByIdx('revs','byExam',p.examId);
    for(const r of revsAll){
      if(r.studentNo===oldNo){
        await dbDel('revs',r.id);
        r.studentNo=p.studentNo;
        r.id=p.examId+'|'+p.studentNo+'|'+(r.type==='q'?'q'+r.qno:String(r.qno));
        await dbPut('revs',r);
      }
    }
  }
  /* 删除该页旧裁剪（按 pageId 级联，覆盖主观题多部分） */
  const crops=await dbByIdx('crops','byExam',p.examId);
  const deadCrops=crops.filter(function(c){return c.pageId===p.id});
  await dbDelMany('crops',deadCrops.map(function(c){return c.id}));
  for(const dc of deadCrops){await delBlob(dc.id);await delBlob(dc.id+'|mk');await delBlob(dc.id+'|t');}
  /* 新裁剪 */
  if(res.crops)for(const cp of res.crops){
    const cid=p.examId+'|'+res.studentNo+'|'+cp.qno+'|'+cp.part;
    const old=await dbGet('crops',cid);
    const cblob=await canvasToJpeg(cp.cv,0.85);
    await dbPut('crops',{id:cid,examId:p.examId,exam_q:p.examId+'|'+cp.qno,pageId:p.id,studentNo:res.studentNo,
      qno:cp.qno,part:cp.part,score:cp.score,
      hasThumb:1,
      scoreVal:old&&old.scoreVal!=null?old.scoreVal:null,aiScore:old&&old.aiScore!=null?old.aiScore:null,
      aiReason:old&&old.aiReason||'',marked:old&&old.marked||null,markedBy:old&&old.markedBy||'',flag:old&&old.flag||''});
    await putBlob(cid,cblob);
    const thb3=dataURLToBlob(canvasDataURL(canvasToThumb(cp.cv,160),0.7));
    if(thb3)await putBlob(cid+'|t',thb3);
  }
  return res;
}

function gradeShuffle(){
  const a=gradeCtx.order.slice();
  if(gradeCtx.shuffle){
    for(let i=a.length-1;i>0;i--){
      const j=Math.floor(Math.random()*(i+1));
      const t=a[i];a[i]=a[j];a[j]=t;
    }
  }
  gradeCtx.order=a;
}

/* AI 批量执行器：writeScore=false 仅生成建议分（预阅）；true 则把建议分直接写入成绩
   （已有建议的份直接采用不再调 AI，未预阅的份先调用 AI 再写入），评分来源记为 'ai' */
async function runAIPredBatch(ex,q,writeScore){
  const cropsAll=await dbByIdx('crops','byExam',ex.id);
  const list=cropsAll.filter(function(c){return String(c.qno)===String(q)});
  const todo=[];
  const seen={};
  list.forEach(function(c){
    if(c.scoreVal==null&&!seen[c.studentNo]){
      seen[c.studentNo]=1;
      todo.push({no:c.studentNo,parts:list.filter(function(x){return x.studentNo===c.studentNo}).sort(function(a,b){return a.part-b.part})});
    }
  });
  if(!todo.length){toast('该题没有未评分项','ok');return}
  const needCall=writeScore?todo.filter(function(t){return t.parts[0].aiScore==null}).length:todo.length;
  if(needCall>0&&!ensureAI())return;
  if(!writeScore){
    const ok=await dlgConfirm('AI 批量预阅','将对「题 '+esc(String(q))+'」的 '+todo.length+' 份未评分裁剪图调用 AI 建议分（2 路并发，可中途停止）。<br>建议先确认「设置」中的 AI 服务与评分要点。','开始');
    if(!ok)return;
  }
  dlgClose();
  if(!gradeCtx||gradeCtx.qno!==q){ui.gradeQno=q;gradeCtx={examId:ex.id,qno:q,shuffle:false,order:todo.map(function(t){return t.no}),idx:0,buf:'',abort:new AbortController()};}
  if(!gradeCtx.abort)gradeCtx.abort=new AbortController();
  const ctl=gradeCtx.abort;
  dlg('<div class="prog-line"><span id="aiBatchTxt">AI 分析中 0/'+todo.length+'</span></div><div class="progress"><div id="aiBatchBar" style="width:0%"></div></div><div class="tip" id="aiBatchLog"></div>',{
    title:(writeScore?'AI 给分':'AI 批量预阅')+' · 题 '+esc(String(q)),
    foot:'<button class="btn btn-d" data-act="ai-batch-stop">停止</button>'
  });
  let next=0;
  async function worker(){
    while(!ctl.signal.aborted){
      /* 同步段先认领下标再 await，避免两个 worker 重复处理/漏处理 */
      const i=next;next++;
      if(i>=todo.length)break;
      const it=todo[i];
      try{
        const full=it.parts[0].score;
        let score=null,reason='',probs='';
        if(writeScore&&it.parts[0].aiScore!=null){
          score=Math.min(full,Math.max(0,Number(it.parts[0].aiScore)||0));   /* 已预阅：直接采用建议分 */
        }else{
          const r=await aiSuggestItem(ex,it.parts,q,ctl);
          score=r.score!=null?(Math.min(full,Math.max(0,Number(r.score)||0))):null;
          reason=(r.reason||'')+'\n【问题】'+(r.problems||'');
        }
        if(score!=null){
          for(const c of it.parts){
            if(reason)c.aiReason=reason;
            c.aiScore=score;
            if(!writeScore)await dbPut('crops',c);
          }
          if(writeScore)await gradeSetScoreLocal(it.no,score,'ai');
        }
        doneN++;
        const t1=$('aiBatchTxt');
        if(t1)t1.textContent='AI 分析中 '+(i+1)+'/'+todo.length+'（'+esc(it.no)+' → '+(score!=null?score+' 分':'无建议')+'）';
        const b1=$('aiBatchBar');
        if(b1)b1.style.width=Math.round((i+1)/todo.length*100)+'%';
      }catch(err){
        if(err.name!=='AbortError'){const lg=$('aiBatchLog');if(lg)lg.textContent='出错：'+err.message;}
        const b1=$('aiBatchBar');if(b1)b1.style.width=Math.round((i+1)/todo.length*100)+'%';
      }
    }
  }
  let doneN=0;
  await Promise.all([worker(),worker()]);
  if(!ctl.signal.aborted){
    const lg=$('aiBatchLog');if(lg)lg.textContent='完成';
    toast(writeScore?('AI 给分完成（'+doneN+' 份已写入成绩）'):('AI 预阅完成（'+doneN+' 份建议）'),'ok');
    setTimeout(dlgClose,900);
    if(writeScore){if(await gradeCheckComplete({q:1,all:1}))return;}
    renderGrade();
  }
}
async function gradeSetScoreLocal(studentNo,v,by,qnoOverride){

  for(const c of list){

      c.marked=null;
      await delBlob(c.id+'|mk');
    }

    await dbPut('crops',c);
  }
}
/* ---------- 可缩放图片查看器（阅卷放大看图用）----------
   滚轮/双指缩放（以指针位置为锚点）、拖拽平移、双击在 1:1 与“适应窗口”间切换。
   用于看清模糊字迹、笔顺与勾画细节。 */
function imageViewer(url,title){
  dlg('<div id="ivWrap" style="position:relative;overflow:hidden;height:74vh;background:#1b1f24;border-radius:10px;cursor:grab;touch-action:none">'
    +'<img id="ivImg" src="'+url+'" draggable="false" style="position:absolute;left:0;top:0;transform-origin:0 0;user-select:none;-webkit-user-drag:none;will-change:transform;image-rendering:auto">'
    +'<div id="ivInfo" style="position:absolute;left:8px;bottom:6px;color:#e2e8f0;background:rgba(0,0,0,.5);padding:2px 8px;border-radius:6px;font-size:12px"></div>'
    +'</div>',
    {title:(title||'查看图片'),wide:true,
     foot:'<span class="kv" style="flex:1;text-align:left">滚轮 / 双指缩放 · 拖拽平移 · 双击切换 1:1 与适应窗口</span>'
       +'<button class="btn btn-s" data-act="iv-out">−</button>'
       +'<button class="btn btn-s" data-act="iv-in">＋</button>'
       +'<button class="btn btn-s" data-act="iv-reset">适应窗口</button>'
       +'<button class="btn" data-act="dlg-close">关闭</button>'});
  const wrap=$('ivWrap'),img=$('ivImg'),info=$('ivInfo');
  const st={scale:1,tx:0,ty:0,fit:1,nat:[1,1]};
  function apply(){
    img.style.transform='translate('+st.tx+'px,'+st.ty+'px) scale('+st.scale+')';
    if(info)info.textContent=Math.round(st.scale/st.fit*100)+'%';
  }
  function fitView(){
    const ww=wrap.clientWidth||600,wh=wrap.clientHeight||400;
    const f=Math.min(ww/st.nat[0],wh/st.nat[1]);
    st.fit=f;st.scale=f;
    st.tx=(ww-st.nat[0]*f)/2;
    st.ty=(wh-st.nat[1]*f)/2;
    apply();
  }
  function zoomAt(cx,cy,factor){
    const ns=Math.max(st.fit*0.25,Math.min(st.fit*16,st.scale*factor));
    const k=ns/st.scale;
    st.tx=cx-(cx-st.tx)*k;
    st.ty=cy-(cy-st.ty)*k;
    st.scale=ns;
    apply();
  }
  function ready(){
    const nw=img.naturalWidth||img.width||1,nh=img.naturalHeight||img.height||1;
    st.nat=[nw,nh];fitView();
  }
  img.addEventListener('load',ready);
  if(img.complete&&img.naturalWidth)ready();
  /* 滚轮缩放（以指针为锚点） */
  wrap.addEventListener('wheel',function(e){
    e.preventDefault();
    const r=wrap.getBoundingClientRect();
    zoomAt(e.clientX-r.left,e.clientY-r.top,e.deltaY<0?1.15:1/1.15);
  },{passive:false});
  /* 指针拖拽平移 + 双指缩放 */
  const pts=new Map();
  let pinch=null;
  wrap.addEventListener('pointerdown',function(e){
    try{wrap.setPointerCapture(e.pointerId)}catch(x){}
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    if(pts.size===2){
      const a=[...pts.values()];
      pinch={d:Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y),scale:st.scale};
    }
    wrap.style.cursor='grabbing';
  });
  wrap.addEventListener('pointermove',function(e){
    if(!pts.has(e.pointerId))return;
    const prev=pts.get(e.pointerId);
    pts.set(e.pointerId,{x:e.clientX,y:e.clientY});
    const r=wrap.getBoundingClientRect();
    if(pts.size===1&&!pinch){
      st.tx+=e.clientX-prev.x;
      st.ty+=e.clientY-prev.y;
      apply();
    }else if(pts.size===2&&pinch){
      const a=[...pts.values()];
      const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y);
      if(pinch.d>4){
        const cx=(a[0].x+a[1].x)/2-r.left, cy=(a[0].y+a[1].y)/2-r.top;
        const want=Math.max(st.fit*0.25,Math.min(st.fit*16,pinch.scale*d/pinch.d));
        zoomAt(cx,cy,want/st.scale);
      }
    }
  });
  const up=function(e){pts.delete(e.pointerId);if(pts.size<2)pinch=null;if(!pts.size)wrap.style.cursor='grab';};
  wrap.addEventListener('pointerup',up);
  wrap.addEventListener('pointercancel',up);
  /* 双击：适应窗口 ↔ 1:1（以双击点为中心） */
  wrap.addEventListener('dblclick',function(e){
    const r=wrap.getBoundingClientRect();
    const cx=e.clientX-r.left,cy=e.clientY-r.top;
    if(st.scale>st.fit*1.05)fitView();
    else zoomAt(cx,cy,(st.fit>0?1/st.fit:1));
  });
  /* 按钮缩放：以视图中心为锚点 */
  const btn=function(f){
    return function(){zoomAt(wrap.clientWidth/2,wrap.clientHeight/2,f)};
  };
  ACTS['iv-in']=btn(1.25);
  ACTS['iv-out']=btn(1/1.25);
  ACTS['iv-reset']=function(){fitView()};
  setTimeout(function(){if(!img.naturalWidth)ready()},80);
}

/* ---------- 图像增强（阅卷时提升模糊件可读性）----------
   level 1 轻度：分位数拉伸 + 轻锐化；level 2 强力：更窄的拉伸区间 + 强锐化（针对拍照发灰/发虚） */
function enhanceImageData(ctx,w,h,level){
  const img=ctx.getImageData(0,0,w,h),d=img.data;
  const n=w*h;
  const hist=new Uint32Array(256);
  const gray=new Uint8Array(n);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    const g=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;
    gray[j]=g;hist[g]++;
  }
  let acc=0,lo=0,hi=255;
  const cut=n*(level>=2?0.05:0.02);
  for(let v=0;v<256;v++){acc+=hist[v];if(acc>cut){lo=v;break}}
  acc=0;
  for(let v=255;v>=0;v--){acc+=hist[v];if(acc>cut){hi=v;break}}
  if(hi-lo<40){lo=Math.max(0,lo-12);hi=Math.min(255,hi+12)}
  const range=Math.max(1,hi-lo);
  for(let i=0,j=0;i<d.length;i+=4,j++){
    let v=(gray[j]-lo)*255/range;
    v=v<0?0:(v>255?255:v);
    d[i]=d[i+1]=d[i+2]=v;d[i+3]=255;
  }
  sharpenImageData(d,w,h,level>=2?0.75:0.35);
  ctx.putImageData(img,0,0);
}
const __enhCache=new Map();
async function enhanceCropURL(id,blob,level){
  const key=id+'|e'+level;
  if(__enhCache.has(key))return __enhCache.get(key);
  try{
    const bmp=await createImageBitmap(blob);
    const cv=document.createElement('canvas');cv.width=bmp.width;cv.height=bmp.height;
    const ctx=cv.getContext('2d');ctx.drawImage(bmp,0,0);
    enhanceImageData(ctx,bmp.width,bmp.height,level);
    const url=await new Promise(function(res){cv.toBlob(function(b){res(b?URL.createObjectURL(b):'')},'image/jpeg',0.92)});
    if(!url)return blobURL(id,blob);
    if(__enhCache.size>40){
      const k=__enhCache.keys().next().value;
      try{URL.revokeObjectURL(__enhCache.get(k))}catch(e){}
      __enhCache.delete(k);
    }
    __enhCache.set(key,url);
    return url;
  }catch(e){return blobURL(id,blob)}
}
async function cropMarkedImage(crop,w,blob){
  try{
    const img=await createImageBitmap(blob||await getBlob(crop.id));
    const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
    const ctx=cv.getContext('2d');ctx.drawImage(img,0,0);
    const fs=Math.max(28,Math.round(img.width*0.075));
    const txt=String(w)+'/'+crop.score;
    ctx.font='bold '+fs+'px Arial,sans-serif';
    const tw=ctx.measureText(txt).width;
    const pad=fs*0.7;
    const bx=cv.width-tw-pad*2-14,by=cv.height-fs-pad*2-12;
    ctx.fillStyle='rgba(20,25,32,.78)';
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(bx,by,tw+pad*2,fs+pad*1.2,10);else ctx.rect(bx,by,tw+pad*2,fs+pad*1.2);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.textBaseline='middle';ctx.textAlign='left';
    ctx.fillText(txt,bx+pad,by+(fs+pad*1.2)/2);
    return await canvasToJpeg(cv,0.85);
  }catch(e){return null}
}

    const full=sq?sq.score:100;
    const pre=await gradeUnscoredCount();
    await gradeSetScoreLocal(gradeCtx.order[gradeCtx.idx],Math.min(full,Math.max(0,v)));
    /* 写分后自动跳到下一份（最后一份停留原地；可在面板关闭自动跳转） */
    if(gradePref.autoNext&&gradeCtx.idx<gradeCtx.order.length-1){gradeCtx.idx++;gradeCtx.buf='';}
    if(await gradeCheckComplete(pre))return;
    renderGrade();
  },
  'grade-clear-score':async function(){
    await gradeSetScoreLocal(gradeCtx.order[gradeCtx.idx],null);
    renderGrade();
  },
  /* 给分步长：下拉选择预设值；选“自定义”时用旁边的数字框 */
  'grade-step':function(el){
    if(el.value==='custom'){
      const inp=$('gradeStepCustom');
      if(inp){inp.focus();inp.select();}
      return;
    }
    const v=parseFloat(el.value);
    if(Number.isFinite(v)&&v>0){gradePref.step=v;saveJSON(LS_GRADE,gradePref);renderGrade();}
  },
  'grade-step-custom':function(el){
    const v=parseFloat(el.value);
    if(Number.isFinite(v)&&v>=0.5){
      gradePref.step=Math.min(10,Math.round(v*2)/2);   /* 步长最少 0.5，按 0.5 取整 */
      saveJSON(LS_GRADE,gradePref);
      renderGrade();   /* 重新生成快捷分按钮（按钮集合随步长变化） */
    }else if(el.value!==''){toast('步长最少 0.5','err')}
  },
  /* 图像增强档位：仅影响阅卷台显示，便于看清模糊字迹 */
  'grade-enhance':function(el){
    gradePref.enhance=parseInt(el.value,10)||0;
    saveJSON(LS_GRADE,gradePref);
    renderGrade();
  },
  /* 按步长加减当前分（未评分时从 0 起步，结果夹在 0~满分之间） */
  'grade-step-adjust':async function(el){
    /* 保留处理器：按钮区不再放置 ±步长按钮，但历史快捷入口/扩展仍可调用 */
    const dir=parseFloat(el.dataset.dir)||1;
    const d=Number(gradePref.step)||0.5;
    const no=gradeCtx.order[gradeCtx.idx];
    if(no==null)return;
    const ex=await dbGet('exams',ui.gradeExam);
    const meta=await gradeMeta(ex);
    const sq=meta&&meta.subjList.find(function(s){return String(s.qno)===String(gradeCtx.qno)});
    const full=sq?sq.score:100;
    const cropsAll=await dbByIdx('crops','byExam',ex.id);
    const ps=cropsAll.filter(function(c){return c.studentNo===no&&String(c.qno)===String(gradeCtx.qno)});
    const cur=(ps.length&&ps[0].scoreVal!=null)?Number(ps[0].scoreVal):0;
    let v=Math.round((cur+dir*d)*100)/100;
    v=Math.max(0,Math.min(full,v));
    const pre=await gradeUnscoredCount();
    await gradeSetScoreLocal(no,v);
    if(await gradeCheckComplete(pre))return;
    renderGrade();
  }
});

/* ============================================================
   第六段(2)：成绩计算 / 分析图表 / 导出
   ============================================================ */
async function computeScorebook(examId){
  const {exam,pages,crops,revs,students}=await examData(examId);
  if(!exam)return null;
  const meta=await examMeta(exam);
  if(!meta)return {error:'模板不存在或已删除，无法计算成绩',exam:exam,meta:null,rows:[],perQStat:{},perScore:0};
  /* 逐题分值：考试内设定 > 模板中该题分值 > 2（不再使用统一分值） */
  const scoreOf=function(qn){
    if(exam.perQScore&&exam.perQScore[qn]!=null){const v=Number(exam.perQScore[qn]);if(Number.isFinite(v)&&v>=0)return v}
    if(meta.choiceScores&&meta.choiceScores[qn]!=null)return meta.choiceScores[qn];
    return 3;
  };
  const perScore=(meta.choiceQnos.length?scoreOf(meta.choiceQnos[0]):3);
  const byNo={};
  pages.forEach(function(p){
    const no=p.studentNo||'(未识别)';
    if(!byNo[no])byNo[no]={pages:[],perQ:{}};
    byNo[no].pages.push(p);
    (p.meta&&p.meta.perQ||[]).forEach(function(q){
      const cur=byNo[no].perQ[q.qno];
      if(!cur)byNo[no].perQ[q.qno]=q;
      else if(cur.verdict==='REVIEW'&&q.verdict!=='REVIEW')byNo[no].perQ[q.qno]=q;
    });
  });
  const studentByNo={};
  students.forEach(function(s){studentByNo[String(s.no)]=s});
  const noSet={};
  students.forEach(function(s){noSet[String(s.no)]=true});
  Object.keys(byNo).forEach(function(no){if(byNo[no]&&byNo[no].pages.length)noSet[no]=true});
  const rows=[];
  Object.keys(noSet).forEach(function(no){
    const st=studentByNo[no];
    const src=byNo[no];
    const absent=!src||!src.pages.length;
    const obj={};let objScore=0;
    meta.choiceQnos.forEach(function(qn){
      const q=(src&&src.perQ[qn])||{verdict:'NOREC'};
      const ov=revs.find(function(r){return r.studentNo===no&&r.qno===qn&&r.type==='q'});
      const verdict=ov?ov.verdict:q.verdict;
      const choice=ov?ov.choice:q.choice;
      let tf;
      if(verdict==='OK'||verdict==='MULTI'){
        /* 单选答案=单字母；多选答案=数组；集合比对，全对才得满分 */
        const rawAns=(exam.answers||{})[qn];
        const ansArr=rawAns==null?[]:(Array.isArray(rawAns)?rawAns.map(function(s){return String(s).toUpperCase()}):String(rawAns).toUpperCase().split(''));
        const selArr=choice?String(choice).split(''):[];
        const same=(ansArr.length===selArr.length)&&ansArr.slice().sort().join('')===selArr.slice().sort().join('');
        tf=same&&ansArr.length?'RIGHT':'WRONG';
      }else tf=verdict;
      if(tf==='RIGHT')objScore+=scoreOf(qn);
      obj[qn]={verdict:tf,choice:choice,full:scoreOf(qn)};
    });
    const subj={};let subjScore=0,subjGraded=0;
    meta.subjList.forEach(function(sq){
      const cs=crops.filter(function(c){return c.studentNo===no&&String(c.qno)===String(sq.qno)}).sort(function(a,b){return a.part-b.part});
      const score=cs.length?cs[0].scoreVal:null;
      subj[sq.qno]={score:score,full:sq.score,ai:cs.length?cs[0].aiScore:null,marked:cs.length?cs[0].marked:null,cropId:cs.length?cs[0].id:null};
      if(score!=null){subjScore+=score;subjGraded++;}
    });
    rows.push({no:no,name:st?st.name:'（未匹配名单）',note:st?st.note:'',absent:absent,
      obj:obj,objScore:objScore,subj:subj,subjScore:subjScore,subjGraded:subjGraded,
      total:objScore+subjScore});
  });
  rows.sort(function(a,b){return (b.total-a.total)||String(a.no).localeCompare(String(b.no))});
  rows.forEach(function(r,i){r.rank=i+1});
  const perQStat={};
  meta.choiceQnos.forEach(function(qn){
    const s={ok:0,wrong:0,blank:0,multi:0,review:0,norec:0,n:0,rate:0,dist:{}};
    rows.forEach(function(r){
      if(r.absent)return; /* 得分率按实考人数统计，缺考不计入分母 */
      const v=r.obj[qn];
      if(!v)return;
      s.n++;
      if(v.verdict==='RIGHT')s.ok++;
      else if(v.verdict==='WRONG'){s.wrong++;const c=v.choice||'?';s.dist[c]=(s.dist[c]||0)+1;}
      else if(v.verdict==='BLANK')s.blank++;
      else if(v.verdict==='MULTI')s.multi++;
      else if(v.verdict==='REVIEW')s.review++;
      else s.norec++;
    });
    s.rate=s.n?s.ok/s.n:0;
    perQStat[qn]=s;
  });
    const objFull=meta.choiceQnos.reduce(function(a,qn){return a+scoreOf(qn)},0);
  /* 每题满分（客观题：考试覆盖→模板→默认；主观题：examMeta 已含考试级覆盖） */
  const fullOf={};
  meta.choiceQnos.forEach(function(qn){fullOf[qn]=scoreOf(qn)});
  meta.subjList.forEach(function(sq){fullOf[sq.qno]=sq.score});
  const isObj=function(qn){return meta.choiceQnos.indexOf(qn)>=0};
  /* 某生某题实得分（供大题汇总；未阅按 0 计入） */
  const scoreOfStu=function(r,qn){
    if(isObj(qn))return (r.obj[qn]&&r.obj[qn].verdict==='RIGHT')?fullOf[qn]:0;
    const v=r.subj[qn];return (v&&v.score!=null)?Number(v.score):0;
  };
  /* 主观题逐题统计（供排序、讲评与按题导出） */
  const subjStat={};
  meta.subjList.forEach(function(sq){
    const s={graded:0,sum:0,full:sq.score,avg:0,rate:0,perfect:0,zero:0,ai:0,n:0};
    rows.forEach(function(r){
      if(r.absent)return;
      const v=r.subj[sq.qno];if(!v)return;
      s.n++;
      if(v.ai!=null)s.ai++;
      if(v.score!=null){const sv=Number(v.score);s.graded++;s.sum+=sv;if(sv>=sq.score)s.perfect++;if(sv<=0)s.zero++;}
    });
    s.avg=s.graded?s.sum/s.graded:0;
    s.rate=s.full>0?(s.avg/s.full):0;
    subjStat[sq.qno]=s;
  });
  /* 大题维度：按模板的大题结构汇总其小题（讲评时先看大题整体掌握情况） */
  const tpl=await dbGet('templates',exam.templateId);
  const sections=[];
  if(tpl){
    normalizeSections(tpl).forEach(function(sec){
      const qnos=(sec.items||[]).map(function(it){return it.qno}).filter(function(qn){return fullOf[qn]!=null});
      if(!qnos.length)return;
      const full=qnos.reduce(function(a,qn){return a+(fullOf[qn]||0)},0);
      let sum=0,stN=0;
      rows.forEach(function(r){
        if(r.absent)return;
        stN++;qnos.forEach(function(qn){sum+=scoreOfStu(r,qn)});
      });
      const avg=stN?sum/stN:0;
      sections.push({title:sec.title||'（未命名大题）',qnos:qnos,count:qnos.length,full:full,avg:avg,
        rate:full>0?(avg/full):0,n:stN});
    });
  }
  /* 逐题分析统一表（客观+主观），供「按得分率排序」与按题导出 */
  const itemStats=meta.choiceQnos.map(function(qn){
    const s=perQStat[qn];
    return {qno:qn,subj:false,kind:(meta.choiceKinds&&meta.choiceKinds[qn])||'single',full:scoreOf(qn),
      avg:s.rate*scoreOf(qn),rate:s.rate,n:s.n,ok:s.ok,wrong:s.wrong,blank:s.blank,multi:s.multi,review:s.review,dist:s.dist};
  }).concat(meta.subjList.map(function(sq){
    const s=subjStat[sq.qno];
    return {qno:sq.qno,subj:true,kind:sq.type||'subj',full:sq.score,avg:s.avg,rate:s.rate,n:s.graded,
      graded:s.graded,total:s.n,perfect:s.perfect,zero:s.zero,ai:s.ai};
  }));
  itemStats.sort(function(a,b){return (Number(a.qno)||0)-(Number(b.qno)||0)});
  return {exam:exam,meta:meta,rows:rows,perQStat:perQStat,perScore:perScore,objFull:objFull,scoreOf:scoreOf,
    subjStat:subjStat,sections:sections,itemStats:itemStats,
    subjFull:meta.subjList.reduce(function(a,s){return a+s.score},0)};
}

function max0(book){
  let t=0;
  book.meta.subjList.forEach(function(s){t+=s.score});
  return t+book.objFull;
}
function drawTotalHist(full,rows){
  const cv=$('totalHist');
  if(!cv)return;
  const w=cv.width=cv.clientWidth||560,h=cv.height=150;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const bins=12,data=new Array(bins).fill(0);
  rows.forEach(function(r){
    if(r.absent)return;
    const b=Math.min(bins-1,Math.floor(r.total/Math.max(1,full)*bins));
    data[b]++;
  });
  const maxC=Math.max(1,Math.max.apply(null,data));
  const bw=w/bins*0.7;
  ctx.fillStyle='#33507A';
  data.forEach(function(c,i){
    const x=i*(w/bins)+(w/bins-bw)/2;
    const bh=c/maxC*(h-36);
    ctx.fillRect(x,h-26-bh,bw,bh);
    ctx.fillStyle='#5A4E3C';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(Math.round((i+0.5)/bins*full),x+bw/2,h-12);
  });
  ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillText('总分分布（横轴=分数段）',6,14);
}
function drawPassDonut(full,rows){
  const cv=$('passDonut');
  if(!cv)return;
  const w=cv.width=cv.clientWidth<260?260:cv.clientWidth,h=cv.height=150;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const T=th();
  const exL=T.ex, goodL=T.good, passL=T.pass;
  const good=rows.filter(function(r){return !r.absent&&r.total>=exL}).length;
  const well=rows.filter(function(r){return !r.absent&&r.total>=goodL&&r.total<exL}).length;
  const pass=rows.filter(function(r){return !r.absent&&r.total>=passL&&r.total<goodL}).length;
  const fail=rows.filter(function(r){return !r.absent&&r.total<passL}).length;
  const total=good+well+pass+fail;
  if(!total){ctx.fillStyle='#999';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('暂无成绩',w/2,h/2);return}
  const cx=w/2,cy=h/2,R=Math.min(w,h)/2-12;
  const segs=[[good,'#1F8A70'],[well,'#33507A'],[pass,'#B8860B'],[fail,'#B8B2A6']];
  let a=-Math.PI/2;
  segs.forEach(function(sg){
    const frac=sg[0]/total;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,a,a+frac*Math.PI*2);
    ctx.fillStyle=sg[1];
    ctx.fill();
    a+=frac*Math.PI*2;
  });
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,R*0.58,0,Math.PI*2);ctx.fill();
  ctx.fillStyle='#2C3E50';ctx.font='bold 14px sans-serif';ctx.textAlign='center';
  ctx.fillText(total+' 人',cx,cy-2);
  ctx.fillStyle='#999';ctx.font='10px sans-serif';
  ctx.fillText('参评',cx,cy+13);
  ctx.fillStyle='#666';ctx.font='11px sans-serif';ctx.textAlign='center';
  ctx.fillText('优秀'+good+'　良好'+well+'　合格'+pass+'　待合格'+fail,cx,h-4);
}

/* 用 JSZip 直接拼最小 OOXML 包（无需额外库）：A4、窄边距、表格紧凑、标题行带底色 */
const DX_ESC=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')};
function dxRun(text,o){
  o=o||{};
  const rPr='<w:rPr>'+(o.b?'<w:b/>':'')+(o.i?'<w:i/>':'')
    +'<w:rFonts w:ascii="Calibri" w:eastAsia="Microsoft YaHei" w:hAnsi="Calibri"/>'
    +(o.color?('<w:color w:val="'+o.color+'"/>'):'')
    +'<w:sz w:val="'+(o.sz||18)+'"/><w:szCs w:val="'+(o.sz||18)+'"/></w:rPr>';
  return '<w:r>'+rPr+'<w:t xml:space="preserve">'+DX_ESC(text)+'</w:t></w:r>';
}
function dxPara(runs,o){
  o=o||{};
  const pPr='<w:pPr><w:spacing w:before="'+(o.before||0)+'" w:after="'+(o.after!=null?o.after:60)+'" w:line="'+(o.line||240)+'" w:lineRule="auto"/>'
    +'<w:jc w:val="'+(o.align||'left')+'"/>'
    +(o.border?('<w:pBdr><w:bottom w:val="single" w:sz="6" w:space="2" w:color="'+o.border+'"/></w:pBdr>'):'')
    +'</w:pPr>';
  const rs=Array.isArray(runs)?runs.join(''):dxRun(runs,o);
  return '<w:p>'+pPr+rs+'</w:p>';
}
function dxCell(c,w){
  const o=Object.assign({},c);
  const tcPr='<w:tcPr><w:tcW w:w="'+(w||o.w||1500)+'" w:type="dxa"/>'
    +(o.gridSpan?('<w:gridSpan w:val="'+o.gridSpan+'"/>'):'')
    +(o.shd?('<w:shd w:val="clear" w:color="auto" w:fill="'+o.shd+'"/>'):'')
    +'<w:vAlign w:val="center"/></w:tcPr>';
  return '<w:tc>'+tcPr+'<w:p><w:pPr><w:spacing w:before="0" w:after="0" w:line="240" w:lineRule="auto"/><w:jc w:val="'+(o.align||'left')+'"/></w:pPr>'
    +dxRun(o.t,{b:o.b,sz:o.sz||18,color:o.color,i:o.i})+'</w:p></w:tc>';
}
function dxTable(rows,widths){
  const total=widths.reduce(function(a,b){return a+b},0);
  const grid=widths.map(function(w){return '<w:gridCol w:w="'+w+'"/>'}).join('');
  const bd='<w:tblBorders>'
    +['top','left','bottom','right','insideH','insideV'].map(function(k){
      return '<w:'+k+' w:val="single" w:sz="4" w:space="0" w:color="D8D2C6"/>'}).join('')
    +'</w:tblBorders>';
  let xml='<w:tbl><w:tblPr><w:tblW w:w="'+total+'" w:type="dxa"/>'+bd
    +'<w:tblLayout w:type="fixed"/>'
    +'<w:tblCellMar><w:top w:w="20" w:type="dxa"/><w:left w:w="70" w:type="dxa"/><w:bottom w:w="20" w:type="dxa"/><w:right w:w="70" w:type="dxa"/></w:tblCellMar>'
    +'</w:tblPr><w:tblGrid>'+grid+'</w:tblGrid>';
  rows.forEach(function(r){
    xml+='<w:tr>';
    let ci=0;
    r.forEach(function(c){
      const span=c.gridSpan||1;
      let w=0;for(let i=ci;i<ci+span&&i<widths.length;i++)w+=widths[i];
      ci+=span;
      xml+=dxCell(c,w);
    });
    xml+='</w:tr>';
  });
  return xml+'</w:tbl>';
}
async function docxDownload(fileName,bodyXml){
  const CT='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'

    +'<Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/>'
    +'<Default Extension="xml" ContentType="application/xml"/>'
    +'<Override PartName="/word/document.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml"/>'
    +'<Override PartName="/word/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml"/>'
    +'</Types>';
  const RELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="word/document.xml"/>'
    +'</Relationships>';
  const DRELS='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships">'
    +'<Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/>'
    +'</Relationships>';
  const STYLES='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:styles xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main">'
    +'<w:docDefaults><w:rPrDefault><w:rPr><w:rFonts w:ascii="Calibri" w:eastAsia="Microsoft YaHei" w:hAnsi="Calibri"/><w:sz w:val="18"/><w:szCs w:val="18"/></w:rPr></w:rPrDefault>'
    +'<w:pPrDefault><w:pPr><w:spacing w:after="0" w:line="240" w:lineRule="auto"/></w:pPr></w:pPrDefault></w:docDefaults></w:styles>';
  const DOC='<?xml version="1.0" encoding="UTF-8" standalone="yes"?>'
    +'<w:document xmlns:w="http://schemas.openxmlformats.org/wordprocessingml/2006/main"><w:body>'+bodyXml
    +'<w:sectPr><w:pgSz w:w="11906" w:h="16838"/>'
    +'<w:pgMar w:top="850" w:right="850" w:bottom="850" w:left="850" w:header="0" w:footer="0" w:gutter="0"/></w:sectPr>'
    +'</w:body></w:document>';
  if(typeof JSZip==='undefined'){toast('打包组件未加载：lib/jszip.min.js','err');return}
  const zip=new JSZip();
  zip.file('[Content_Types].xml',CT);
  zip.folder('_rels').file('.rels',RELS);
  const wd=zip.folder('word');
  wd.file('document.xml',DOC);
  wd.file('styles.xml',STYLES);
  wd.folder('_rels').file('document.xml.rels',DRELS);
  const blob=await zip.generateAsync({type:'blob',mimeType:'application/vnd.openxmlformats-officedocument.wordprocessingml.document',compression:'DEFLATE'});
  download(fileName,blob);
}

    meta.subjList.forEach(function(sq){
      const sub=r.subj[sq.qno]||{};
      const st=book.subjStat[sq.qno]||{avg:0};
      const sv=(sub.score!=null)?Number(sub.score):null;
      const rt=(sv!=null&&sq.score)?(sv/sq.score):0;
      const d=(sv!=null)?(sv-st.avg):null;
      const c=(sv==null)?'9AA3AE':(rt*100>=T.exPct?'1F8A70':(rt*100>=T.passPct?'B8860B':'C0392B'));

        {t:String(sq.score),align:'center'},
        {t:(sv!=null?String(sv):'未阅'),align:'center',b:1,color:c},
        {t:(sv!=null?pct(rt):'—'),align:'center',color:c},
        {t:st.avg.toFixed(1),align:'center'},
        {t:(d!=null?(sign(d)+arrow(d)):'—')+((sub.ai!=null)?('　AI建议 '+sub.ai):''),align:'center',color:(d!=null&&d<0)?'C0392B':null}]);
    });
    parts.push(dxTable(rows,[1400,1200,1200,1400,1800,3206]));
    parts.push(dxPara('',{after:80}));
  }
  /* 需重点加强：低于班级平均且失分较多的题 */
  const weak=[];
  (book.itemStats||[]).forEach(function(it){
    let got,avgIt=it.avg;
    if(it.subj){const v=r.subj[it.qno];got=(v&&v.score!=null)?Number(v.score):null;}
    else{got=(r.obj[it.qno]&&r.obj[it.qno].verdict==='RIGHT')?(book.scoreOf(it.qno)||0):0;}
    if(got==null)return;
    const gap=avgIt-got;
    if(gap>0.05||it.rate*100<T.passPct){
      weak.push({qno:it.qno,subj:it.subj,full:it.full,got:got,avg:avgIt,gap:gap,rate:it.rate,
        title:it.subj?('主观题 '+it.qno):((it.kind==='multi'?'多选题 ':'单选题 ')+it.qno)});
    }
  });
  weak.sort(function(a,b){return b.gap-a.gap||(a.rate-b.rate)});
  const top=weak.slice(0,6);
  parts.push(dxPara([dxRun('四、需重点加强',{b:1,sz:20,color:'8A6D3B'})],{after:40}));
  if(!top.length){
    parts.push(dxPara([dxRun('本次考试各题均达到或超过班级平均水平，继续保持。',{sz:17,color:'1F8A70'})],{after:150}));
  }else{
    const rows=[[{t:'题目',b:1,shd:'F2EEE6'},{t:'你的得分',b:1,align:'center',shd:'F2EEE6'},
      {t:'班级平均',b:1,align:'center',shd:'F2EEE6'},{t:'差距',b:1,align:'center',shd:'F2EEE6'},
      {t:'建议',b:1,shd:'F2EEE6'}]];
    top.forEach(function(wk){
      const advice=wk.subj
        ?('对照评分要点重做本题并请老师面批；重点检查：'+(wk.rate*100<T.passPct?'答题要点是否齐全、表述是否规范':'细节表述与卷面'))
        :(wk.gap>=wk.full*0.5?('重做本题：先写出正确解法再核对，并整理进错题本'):('核对错因（是知识点不清还是审题/涂卡失误），做 2 道同类题巩固'));
      rows.push([{t:wk.title+'（满分'+wk.full+'）'},
        {t:String(Math.round(wk.got*10)/10),align:'center',b:1,color:'C0392B'},
        {t:wk.avg.toFixed(1),align:'center'},
        {t:('-'+Math.round(wk.gap*10)/10),align:'center',color:'C0392B'},
        {t:advice,sz:16}]);
    });
    parts.push(dxTable(rows,[1900,1100,1200,1000,W-5200]));
    parts.push(dxPara('',{after:120}));
  }
  /* 寄语与签字 */
  parts.push(dxPara([dxRun('教师寄语：',{b:1,sz:17,color:'8A6D3B'})],{after:30}));
  const diffTxt=(diff>=0)?('总分高于班级平均 '+Math.abs(diff).toFixed(1)+' 分，'):('总分低于班级平均 '+Math.abs(diff).toFixed(1)+' 分，');
  const adviceTxt=(r.total>=T.ex)?'整体掌握扎实，注意保持并挑战更高目标。'
    :(r.total>=T.pass?'基础尚可，按上面「需重点加强」逐项突破即可提升。':'基础还比较薄弱，建议先从基础题和大题得分点抓起，逐题过关。');
  parts.push(dxPara([dxRun('　　本次考试'+diffTxt,{sz:17}),dxRun(adviceTxt,{sz:17})],{after:200}));

  const name=(r.name&&r.name.indexOf('（未匹配')<0)?r.name:('考号'+r.no);
  await docxDownload('成绩报告_'+name+'_'+(r.no||'')+'_'+ex.name+'_'+tsName()+'.docx',parts.join(''));

/* 考试级分数线：以「具体分数」设定优秀/良好/合格（老师按该次考试难度在「成绩分析」页设置）。
   未设置时按全卷满分的 80%/70%/60% 自动给出默认值。
   返回绝对分数线（分）+ 折算百分比（供逐题/大题按得分率比较） */
function examThresholdsOf(ex,fullMarks){
  const F=(Number(fullMarks)>0)?Number(fullMarks):100;
  const pick=function(v,frac){
    const def=Math.round(F*frac*10)/10;
    if(v==null||v==='')return def;          /* 未设置(null/空) → 用默认比例，不能当成 0 */
    const n=Number(v);
    if(Number.isFinite(n)&&n>=0&&n<=F)return Math.round(n*10)/10;
    return def;
  };
  let ex2=pick(ex&&ex.thEx,0.8);
  let good2=pick(ex&&ex.thGood,0.7);
  let pass2=pick(ex&&ex.thPass,0.6);
  /* 保证 合格 < 良好 < 优秀 */
  if(good2>=ex2)good2=Math.max(0,Math.round((ex2-1)*10)/10);
  if(pass2>=good2)pass2=Math.max(0,Math.round((good2-1)*10)/10);
  return {full:F,ex:ex2,good:good2,pass:pass2,
    exPct:F?ex2/F*100:0,goodPct:F?good2/F*100:0,passPct:F?pass2/F*100:0};
}
/* 按总分（分）给等级 */
function gradeLevelOf(total,th){
  return total>=th.ex?['优秀','1F8A70']:(total>=th.good?['良好','33507A']:(total>=th.pass?['合格','B8860B']:['待合格','C0392B']));
}
/* 运行时分数线（打开成绩分析时按该场考试设定；其它页读取时用默认满分的比例） */
let __th=examThresholdsOf(null,100);
function th(){return __th}
/* 成绩导出 */
Object.assign(ACTS,{
  'score-pick':async function(el){ui.scoreExam=el.value;renderScore()},
  /* 应用分数线（分）：校验后写入考试并立即重绘（统计/分布/报告/讲评同步生效） */
  'score-th-apply':async function(){
    const ex=await dbGet('exams',ui.scoreExam);
    if(!ex){toast('请先选择考试','err');return}
    const book=await computeScorebook(ex.id);
    if(!book||!book.meta){toast('模板缺失，无法设置分数线','err');return}
    const full=book.objFull+book.subjFull;
    const gv=function(id){const e=$(id);return e?parseFloat(e.value):NaN};
    const a=gv('thEx'),b=gv('thGood'),c=gv('thPass');
    if(![a,b,c].every(Number.isFinite)){toast('请填写有效的分数线','err');renderScore();return}
    if(!(c<b&&b<a&&a<=full&&c>=0)){
      toast('分数线需满足：合格 < 良好 < 优秀，且不超过全卷满分 '+full+' 分','err');
      renderScore();return;
    }
    ex.thEx=Math.round(a*10)/10;ex.thGood=Math.round(b*10)/10;ex.thPass=Math.round(c*10)/10;
    await dbPut('exams',ex);
    toast('分数线已更新：优秀≥'+ex.thEx+'　良好≥'+ex.thGood+'　合格≥'+ex.thPass+' 分','ok');

const sleep2=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
async function withRetry(fn){
  let last=null;
  for(let attempt=1;attempt<=2;attempt++){
    try{return await fn()}
    catch(e){
      last=e;
      if(e.name==='AbortError')throw e;
      const msg=String(e.message||'');
      const retriable=/429|5\d\d|Failed to fetch|network error|timeout|ECONN|socket|abort/i.test(msg);
      if(!retriable||attempt>=2)throw e;
      await sleep2(2000*attempt);
    }
  }
  throw last;
}
function ensureAI(){
  const provider=ai.provider;
  const key=(ai.keys[provider]||'').trim();
  if(!key){toast('请先在「设置 → AI 服务」中填写 API Key','err');return false}
  const url=provider==='custom'?(ai.customUrl||'').trim():PROVIDERS[provider].url;
  if(!url){toast('自定义服务需填写接口地址','err');return false}
  return true;
}
async function callVision(prompt,images,signal){
  const provider=ai.provider;
  const url=provider==='custom'?(ai.customUrl||'').trim():PROVIDERS[provider].url;
  const key=(ai.keys[provider]||'').trim();
  const model=(ai.models[provider]||'').trim()||PROVIDERS[provider].models[0];
  const messages=[
    {role:'system',content:'你是一位经验丰富、认真负责的阅卷老师。评分时，你是执行主流阅卷标准的严格阅卷人：每一分都必须有卷面依据，发现错误必须扣分，不得因"整体印象尚可"而免扣具体问题。所有输出使用简体中文。'},
    {role:'user',content:images.length?[{type:'text',text:prompt},...images.map(function(u){return {type:'image_url',image_url:{url:u}}})]:prompt}
  ];
  const res=await fetch(url,{
    method:'POST',
    headers:{'Content-Type':'application/json','Authorization':'Bearer '+key},
    body:JSON.stringify({model:model,messages:messages,temperature:ai.temp||0.35,max_tokens:ai.maxTokens||4096,stream:false}),
    signal:signal||AbortSignal.timeout(120000)   /* 无外部中止时 120s 超时：接口不通/网络挂起不再无限等待 */
  });
  if(!res.ok){
    let msg='HTTP '+res.status;
    try{const j=await res.json();msg=j.error&&(j.error.message||j.error.msg)||j.msg||JSON.stringify(j).slice(0,200)||msg}catch(e){}
    throw new Error(msg);
  }
  const data=await res.json();
  const c=data.choices&&data.choices[0]&&data.choices[0].message&&data.choices[0].message.content;
  if(!c)throw new Error('接口未返回内容');
  return c;
}
function parseResult(text){
  let s=String(text).trim();
  s=s.replace(/^\`\`\`(?:json)?\s*/i,'').replace(/\s*\`\`\`$/,'');
  const a=s.indexOf('{'),b=s.lastIndexOf('}');
  if(a<0||b<=a)throw new Error('AI 返回内容不是 JSON：'+s.slice(0,120));
  let obj;
  try{obj=JSON.parse(s.slice(a,b+1))}
  catch(e){
    const fixed=s.slice(a,b+1).replace(/,\s*([}\]])/g,'$1');
    try{obj=JSON.parse(fixed)}catch(e2){
      /* AI 常在字符串值里写未转义的英文双引号（如引用评分要点「空白即满分」）——
         状态机修复：字符串内部的引号若其后不是合法的值结束符（,} ]）则视为内容，替换为「 */
      const repaired=(function(t){
        let out='',inStr=false;
        for(let i=0;i<t.length;i++){
          const ch=t[i];
          if(ch==='\u201c'||ch==='\u201d')ch='\"';
          if(ch!=='\"'){out+=ch;continue}
          if(!inStr){inStr=true;out+=ch;continue}
          let j=i+1;while(j<t.length&&(t[j]===' '||t[j]==='\n'||t[j]==='\r'||t[j]==='\t'))j++;
          const nx=t[j];
          if(nx===','||nx===':'||nx==='}'||nx===']'||nx===undefined){inStr=false;out+=ch}
          else out+='」';
        }
        return out;
      })(fixed);
      try{obj=JSON.parse(repaired)}catch(e3){throw new Error('JSON 解析失败：'+s.slice(0,120))}
    }
  }
  if(typeof obj!=='object'||obj===null)throw new Error('AI 返回内容不是对象');
  return obj;
}
async function cropToDataURL(crop,maxW,q,blob){
  const img=await createImageBitmap(blob||await getBlob(crop.id));
  const sc=Math.min(1,maxW/(img.width||1));
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(img.width*sc));
  cv.height=Math.max(1,Math.round(img.height*sc));
  cv.getContext('2d').drawImage(img,0,0,cv.width,cv.height);
  return cv.toDataURL('image/jpeg',q||0.82);
}
async function aiSuggestItem(ex,parts,qno,ctl){
  if(!ensureAI())throw new Error('先配置 AI');
  const meta=await examMeta(ex);
  if(!meta)throw new Error('该考试的答题卡模板不存在或已删除');
  const sq=meta.subjList.find(function(s){return String(s.qno)===String(qno)});
  const full=sq?sq.score:100;
  const subjMeta=(ex.subjective||{})[qno]||{score:full,points:'',answer:''};
  const level=IMG_LEVELS[ai.imgLevel]||IMG_LEVELS.std;
  const images=[];
  for(const p of parts)images.push(await cropToDataURL(p,level.w,level.q,await getBlob(p.id)));
  const strictMap={loose:'宽松',std:'适中',strict:'严格'};
  const strictLine=(omr.aiStrict&&omr.aiStrict!=='std')?('\n（本场严格度：'+strictMap[omr.aiStrict]+'档，请按该档把握扣分尺度）'):'';
  const prompt='【题目】第 '+qno+' 题（'+(sq?sq.type:'')+'）\n'
    +'【满分】'+full+' 分\n'
    +'【评分要点】'+((subjMeta.points||'').trim()||'（未提供，请按主流标准）')+'\n'
    +'【参考答案】'+((subjMeta.answer||'').trim()||'（未提供）')+'\n'
    +'【评分规则】\n'
    +'1. 先通读作答，把所有问题逐条列全（错别字、病句、计算错误、步骤缺失、漏答未答、未按要求等），不许遗漏、不许美化；\n'
    +'2. 评分采用"从满分往下扣"：每处问题按评分要点扣除对应分数，注明扣分原因；'+strictLine+'\n'
    +'3. 得分可以有小数，不得为凑整抬高分数；每一处扣分都要能在卷面上指出来；\n'
    +'4. 若要点中各维度标有分值，必须按维度给分（dimScores），总分为各维度之和。\n'
    +'【输出要求】只输出 JSON：{"problems":"问题清单","dimScores":{"维度":分}|null,"score":数字,"reason":"一句话总评"}，不要其他文字；字符串值内不要出现英文双引号，引用要点时请用「」。';
  const content=await withRetry(function(){return callVision(prompt,images,ctl?ctl.signal:undefined)});
  const d=parseResult(content);
  let score=d.score;
  if(d.dimScores&&typeof d.dimScores==='object'){
    let s=0,has=false;
    for(const k in d.dimScores){has=true;s+=Number(d.dimScores[k])||0;}
    if(has&&Number.isFinite(s)&&s>=0)score=s;
  }
  return {score:Number.isFinite(Number(score))?Number(score):null,reason:d.reason||'',
    problems:d.problems||'',dimScores:d.dimScores||null,full:full};
}
async function aiSuggestExam(examId,studentNo,qno){
  const ex=await dbGet('exams',examId);
  const cropsAll=await dbByIdx('crops','byExam',examId);
  const parts=cropsAll.filter(function(c){return c.studentNo===studentNo&&String(c.qno)===String(qno)}).sort(function(a,b){return a.part-b.part});
  return aiSuggestItem(ex,parts,qno,null);
}

/* 打包进度提示（复用单个 toast 元素，避免刷屏） */
let __packToast=null;
function packProg(txt){
  if(!__packToast){__packToast=document.createElement('div');__packToast.className='toast';$('toasts').appendChild(__packToast);}
  __packToast.textContent=txt;
}
function packProgEnd(){if(__packToast){try{__packToast.remove()}catch(e){}__packToast=null}}
function zipSafe(id){return String(id).replace(/[^A-Za-z0-9_-]/g,'_')}
async function backupExport(includeBlobs){
  try{
    toast('正在打包数据…');
    const data={classes:await dbAll('classes'),students:await dbAll('students'),templates:await dbAll('templates'),exams:await dbAll('exams')};
    const revs=await dbAll('revs');
    const pages=await dbAll('pages');
    const crops=await dbAll('crops');
    if(!includeBlobs){
      const pack={app:'yuejuan',v:1,exportedAt:timestamp(),data:data,revs:revs,
        pages:pages.map(function(p){return {id:p.id,examId:p.examId,pageNo:p.pageNo,studentNo:p.studentNo,meta:p.meta}}),
        crops:crops.map(function(c){return {id:c.id,examId:c.examId,pageId:c.pageId||'',studentNo:c.studentNo,qno:c.qno,part:c.part,score:c.score,scoreVal:c.scoreVal,aiScore:c.aiScore,aiReason:c.aiReason,flag:c.flag,markedBy:c.markedBy}})};
      download('智能阅卷备份_'+tsName()+'.json',JSON.stringify(pack),'application/json;charset=utf-8');
      toast('备份已导出（不含扫描图）','ok');
      return;
    }
    /* 完整备份：ZIP（manifest.json + 二进制图片），避免 base64 把内存翻 1.4 倍 */
    if(typeof JSZip==='undefined')throw new Error('打包组件未加载：lib/jszip.min.js');
    const man={app:'yuejuan',v:2,exportedAt:timestamp(),data:data,revs:revs,pages:[],crops:[]};
    const zip=new JSZip();
    const total=pages.length+crops.length;let done=0;
    const tick=function(){done++;if(done%5===0||done===total)packProg('正在打包 '+done+'/'+total)};
    for(const p of pages){
      const rec={id:p.id,examId:p.examId,pageNo:p.pageNo,studentNo:p.studentNo||'',meta:p.meta||{}};
      const b=await getBlob(p.id);
      if(b){rec.img='pages/'+zipSafe(p.id)+'.jpg';zip.file(rec.img,b)}
      const th=await getBlob(p.id+'|t');
      if(th){rec.thumb='pages/'+zipSafe(p.id)+'.t.jpg';zip.file(rec.thumb,th)}
      man.pages.push(rec);tick();
    }
    for(const c of crops){
      const rec={id:c.id,examId:c.examId,pageId:c.pageId||'',studentNo:c.studentNo||'',qno:c.qno,part:c.part||0,score:c.score,
        scoreVal:c.scoreVal!=null?c.scoreVal:null,aiScore:c.aiScore!=null?c.aiScore:null,aiReason:c.aiReason||'',
        flag:c.flag||'',markedBy:c.markedBy||'',marked:c.marked||null};
      const b=await getBlob(c.id);
      if(b){rec.img='crops/'+zipSafe(c.id)+'.jpg';zip.file(rec.img,b)}
      const mk=await getBlob(c.id+'|mk');
      if(mk){rec.markedImg='crops/'+zipSafe(c.id)+'.mk.jpg';zip.file(rec.markedImg,mk)}
      const th=await getBlob(c.id+'|t');
      if(th){rec.thumb='crops/'+zipSafe(c.id)+'.t.jpg';zip.file(rec.thumb,th)}
      man.crops.push(rec);tick();
    }
    zip.file('manifest.json',JSON.stringify(man));
    const blob=await zip.generateAsync({type:'blob',compression:'STORE'},function(m){packProg('正在压缩 '+Math.round((m&&m.percent)||0)+'%')});
    packProgEnd();
    download('智能阅卷备份_'+tsName()+'.zip',blob,'application/zip');
    toast('完整备份已导出（ZIP）','ok');
  }catch(err){packProgEnd();toast('导出失败：'+err.message,'err')}
}
async function backupImport(file){
  try{
    if(!file)return;
    toast('解析备份…');
    let isZip=/\.zip$/i.test(file.name||'');
    if(!isZip){
      try{const hb=new Uint8Array(await file.slice(0,2).arrayBuffer());isZip=hb[0]===0x50&&hb[1]===0x4b}catch(e){}
    }
    const ok=await dlgConfirm('导入备份','导入将<b>覆盖现有全部数据</b>（班级/学生/模板/考试/识别/判分）。目标环境已有数据会丢失，确定？','覆盖导入');
    if(!ok)return;
    let obj=null,zip=null;
    if(isZip){
      if(typeof JSZip==='undefined')throw new Error('打包组件未加载：lib/jszip.min.js');
      zip=await JSZip.loadAsync(file);
      const mf=zip.file('manifest.json');
      if(!mf)throw new Error('ZIP 备份缺少 manifest.json');
      obj=JSON.parse(await mf.async('string'));
    }else{
      obj=JSON.parse(await file.text());
    }
    if(obj.app!=='yuejuan')throw new Error('不是本系统的备份文件');
    for(const s of ['classes','students','templates','exams','pages','crops','revs','blobs'])await dbClear(s);
    for(const k of ['classes','students','templates','exams'])for(const it of ((obj.data&&obj.data[k])||[]))await dbPut(k,it);
    for(const r of (obj.revs||[]))await dbPut('revs',r);
    /* ZIP：图片按二进制还原；JSON：兼容旧版 base64（b64/markedB64/thumb dataURL） */
    const zp=async function(path){
      if(!zip||!path)return null;
      const f=zip.file(path);if(!f)return null;
      try{return await f.async('blob')}catch(e){return null}
    };
    const thumbOf=function(rec){return zip?zp(rec.thumb):(typeof rec.thumb==='string'&&rec.thumb.indexOf('data:')===0?dataURLToBlob(rec.thumb):null)};
    let withImg=0;
    for(const p of (obj.pages||[])){
      const t=await thumbOf(p);
      await dbPut('pages',{id:p.id,examId:p.examId,pageNo:p.pageNo,studentNo:p.studentNo||'',meta:p.meta||{},hasThumb:t?1:null});
      const b=zip?await zp(p.img):(p.b64?b64ToBlob(p.b64):null);
      if(b){await putBlob(p.id,b);withImg++}
      if(t)await putBlob(p.id+'|t',t);
    }
    for(const c of (obj.crops||[])){
      const t=await thumbOf(c);
      const m=zip?await zp(c.markedImg):(c.markedB64?b64ToBlob(c.markedB64):null);
      await dbPut('crops',{id:c.id,examId:c.examId,exam_q:c.examId+'|'+c.qno,pageId:c.pageId||'',
        studentNo:c.studentNo||'',qno:c.qno,part:c.part||0,score:c.score,
        scoreVal:c.scoreVal!=null?c.scoreVal:null,aiScore:c.aiScore!=null?c.aiScore:null,
        aiReason:c.aiReason||'',flag:c.flag||'',markedBy:c.markedBy||'',
        marked:m?1:(c.marked||null),hasThumb:t?1:null});
      const b=zip?await zp(c.img):(c.b64?b64ToBlob(c.b64):null);
      if(b){await putBlob(c.id,b);withImg++}
      if(m)await putBlob(c.id+'|mk',m);
      if(t)await putBlob(c.id+'|t',t);
    }
    toast('导入完成（'+((obj.data&&obj.data.students)||[]).length+' 名学生 / '+((obj.data&&obj.data.exams)||[]).length+' 场考试'
      +(withImg?' · 已恢复 '+withImg+' 张扫描图':' · 未含扫描图（可重扫）')+'）','ok');
    go('home');
  }catch(err){toast('导入失败：'+err.message,'err')}
}
