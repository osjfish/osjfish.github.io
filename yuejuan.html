<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--category:教育-->
<title>智能阅卷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --zhu:#A93226;--zhu2:#C0392B;--zhu3:#7B241C;
  --bg:#F6F4EF;--card:#FFFFFF;--txt:#2C3E50;--txt2:#6B7A8C;
  --line:#E5E0D8;--gold:#B8860B;--green:#1F8A70;--blue:#33507A;--purple:#7A4E9E;
  --warn:#B45309;--danger:#B8453A;
}
html,body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);height:100%;font-size:14px}
.sj-app{display:flex;min-height:100vh}
/* ===== 侧栏 ===== */
.sj-side{width:200px;background:linear-gradient(180deg,#26303F,#1B2430);color:#fff;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:50}
.sj-logo{padding:20px 16px 14px;font-size:17px;font-weight:700;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.08)}
.sj-logo b{color:#E6A23C}
.sj-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sj-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:#C8D1DC;font-size:14px;margin-bottom:2px;transition:.18s}
.sj-nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sj-nav-item.on{background:var(--zhu);color:#fff;box-shadow:0 3px 10px rgba(169,50,38,.4)}
.sj-nav-item .ic{width:20px;text-align:center;font-size:15px}
.sj-side-foot{padding:12px 16px;font-size:11px;color:#7F8C9B;line-height:1.6;border-top:1px solid rgba(255,255,255,.08)}
/* ===== 主区 ===== */
.sj-main{flex:1;margin-left:200px;padding:0 26px 40px;min-width:0}
.sj-top{position:sticky;top:0;z-index:40;background:rgba(246,244,239,.92);backdrop-filter:blur(8px);padding:16px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.sj-title{font-size:20px;font-weight:700}
.sj-title small{font-weight:400;color:var(--txt2);font-size:12.5px;margin-left:10px}
.sj-topbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sj-page{max-width:1180px}
/* ===== 通用 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(44,62,80,.05)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:3px;height:14px;background:var(--zhu);border-radius:2px}
.card .tip{color:var(--txt2);font-size:12.5px;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#C9BFB0;background:#FBF9F5}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--zhu);border-color:var(--zhu);color:#fff}
.btn-p:hover{background:var(--zhu2);border-color:var(--zhu2)}
.btn-g{background:var(--green);border-color:var(--green);color:#fff}
.btn-g:hover{background:#187A64}
.btn-b{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-b:hover{background:#2B4467}
.btn-o{background:#fff;border-color:var(--gold);color:var(--gold)}
.btn-d{background:#fff;border-color:#E8C4BE;color:var(--danger)}
.btn-d:hover{background:#FBF1EF}
.btn-s{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.inp,select.inp,textarea.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:var(--txt);outline:none;font-family:inherit}
.inp:focus{border-color:var(--zhu);box-shadow:0 0 0 2px rgba(169,50,38,.08)}
textarea.inp{resize:vertical;line-height:1.6}
label.f-lb{display:block;font-size:12.5px;color:var(--txt2);margin:10px 0 4px}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}
.f-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{background:#F4F0E8;color:#5A4E3C;font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.tbl td{padding:8px 10px;border-bottom:1px solid #EFEAE2;vertical-align:middle}
table.tbl tr:hover td{background:#FBF8F3}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.bd-ok{background:#E3F2EC;color:#1A6B54}.bd-warn{background:#FCF0DD;color:#9A6110}
.bd-err{background:#FBE7E4;color:#B03A2E}.bd-info{background:#E6EDF7;color:#2B4467}
.bd-gray{background:#EEF0F2;color:#5B6570}.bd-purple{background:#F0E7F8;color:#64348F}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:#F4F0E8;border:1px solid var(--line);font-size:12px;color:#5A4E3C;margin:2px 4px 2px 0;cursor:pointer}
.chip.on{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.chip.gray.on{background:#5B6570;border-color:#5B6570}
.kv{font-size:12.5px;color:var(--txt2)}
.kv b{color:var(--txt)}
.empty{padding:36px;text-align:center;color:var(--txt2);font-size:13px}
.empty .big{font-size:34px;margin-bottom:8px}
.progress{width:100%;background:#EDE8DF;border-radius:99px;height:10px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--zhu),#E67E22);border-radius:99px;transition:width .2s}
/* ===== 考试卡片 ===== */
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.exam-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px;display:flex;flex-direction:column;gap:9px;transition:.18s}
.exam-card:hover{box-shadow:0 6px 18px rgba(44,62,80,.09);transform:translateY(-2px)}
.exam-card .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.exam-card .meta{font-size:12.5px;color:var(--txt2);line-height:1.7}
.exam-card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
/* ===== 统计 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .n{font-size:24px;font-weight:800;color:var(--zhu)}
.stat .l{font-size:12px;color:var(--txt2);margin-top:2px}
/* ===== 答案录入 ===== */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.qcell{border:1px solid var(--line);border-radius:9px;padding:7px;background:#FCFAF6}
.qcell .qn{font-size:12px;color:var(--txt2);margin-bottom:5px}
.qcell .opts{display:flex;gap:4px}
.qcell .opt{flex:1;padding:3px 0;text-align:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff;font-size:12.5px;font-weight:700;color:#98A5B0}
.qcell .opt.on{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.qcell .opt.dim{opacity:.35}
/* ===== 图表 ===== */
.chart-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:hidden}
.chart-box .ct{font-size:13px;font-weight:600;margin-bottom:6px;color:#5A4E3C}
/* ===== 阅卷台 ===== */
.gwrap{display:flex;gap:14px;align-items:flex-start}
.gimg{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;text-align:center}
.gimg img{max-width:100%;max-height:70vh;border-radius:6px;cursor:zoom-in}
.gside{width:250px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.gscore{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.gscore .gs{padding:8px 0;text-align:center;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;background:#fff}
.gscore .gs:hover{border-color:var(--zhu)}
.gscore .gs.on{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.gscore .gs.dim{opacity:.4}
.gthumbs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.gthumbs .gt{flex-shrink:0;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:2px}
.gthumbs .gt.on{border-color:var(--zhu)}
.gthumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;display:block}
.prog-line{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;color:var(--txt2)}
/* ===== 模式框 ===== */
.m-overlay{position:fixed;inset:0;background:rgba(20,25,32,.55);z-index:200;align-items:center;justify-content:center;padding:20px;display:none}
.m-overlay:not([hidden]){display:flex}
.m-box{background:#fff;border-radius:14px;max-width:min(860px,94vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-title{font-size:16px;font-weight:700}
.m-x{border:none;background:none;font-size:18px;cursor:pointer;color:var(--txt2);padding:4px}
.m-x:hover{color:var(--zhu)}
.m-body{padding:16px 18px;overflow-y:auto}
.m-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* ===== 提示 ===== */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#26303F;color:#fff;padding:9px 18px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .25s}
.toast.err{background:var(--danger)}.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* ===== 扫描结果 ===== */
.scan-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scan-item img{width:52px;height:52px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
/* ===== 预览画布 ===== */
.preview-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:center;overflow:auto;max-height:75vh}
.preview-box canvas{max-width:100%;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff}
.marked-badge{position:absolute;right:8px;bottom:8px;background:rgba(20,25,32,.82);color:#fff;padding:4px 12px;border-radius:8px;font-weight:800;font-size:15px}
.tpl-thumb{width:110px;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.review-plot{position:relative;display:inline-block}
/* ===== 响应式 ===== */
@media(max-width:900px){
  .sj-side{width:60px}
  .sj-side .sj-logo span,.sj-nav-item span.tx,.sj-side-foot{display:none}
  .sj-nav-item{justify-content:center;padding:12px 4px}
  .sj-main{margin-left:60px;padding:0 10px 30px}
  .gwrap{flex-direction:column}
  .gside{width:100%}
}
</style>
</head>
<body>
<div class="sj-app">
  <aside class="sj-side">
    <div class="sj-logo">📝 <b>智能阅卷</b></div>
    <nav class="sj-nav" id="nav"></nav>
    <div class="sj-side-foot">数据存于本地浏览器<br>请定期在「设置」导出备份<br><span style="color:#E6A23C">支持生成答题卡 → 扫描识别<br>→ 按题阅卷 → 成绩分析</span></div>
  </aside>
  <main class="sj-main">
    <header class="sj-top">
      <div class="sj-title" id="pageTitle"></div>
      <div class="sj-topbtns" id="topBtns"></div>
    </header>
    <section class="sj-page" id="page"></section>
  </main>
</div>
<div class="m-overlay" id="mOverlay" hidden><div class="m-box" id="mBox"></div></div>
<div class="toasts" id="toasts"></div>

<script src="./lib/pdf.min.js"></script>
<script>
try{pdfjsLib.GlobalWorkerOptions.workerSrc='./lib/pdf.worker.min.js';}catch(e){}
</script>
<script src="./lib/jspdf.umd.min.js"></script>
<script src="./lib/qrcode.js"></script>
<script src="./lib/jsQR.js"></script>
<script src="./lib/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
/* ============================================================
   智能阅卷 · 网页版
   依据：答题卡助手 Pro v4.3.0 逆向分析（Apps/阅卷系统技术方案.md）
   功能：答题卡生成/打印PDF → 扫描识别(OMR) → 主观题切割 → 按题阅卷(+AI) → 成绩分析导出
   数据：IndexedDB（本地优先，可导出备份）
   ============================================================ */

/* ---------- 小工具 ---------- */
const $=function(id){return document.getElementById(String(id).replace(/^#/,''))};
const esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')};
const uid=function(p){return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
const sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
const today=function(){const d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const timestamp=function(){const d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
const tsName=function(){const d=new Date(),p=function(n){return String(n).padStart(2,'0')};return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())};
const now=function(){return Date.now()};
function toast(msg,type){
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=String(msg);
  $('toasts').appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='.3s';setTimeout(function(){t.remove()},300)},2600);
}
function download(name,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function copyText(t){
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制到剪贴板')}catch(e){toast('复制失败','err')}
  ta.remove();
}
function loadJSON(key,sub){
  try{const s=JSON.parse(localStorage.getItem(key)||'null');return sub?(s&&s[sub]!=null?s[sub]:null):(s||null)}catch(e){return null}
}
function saveJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}

/* ---------- 常数 ---------- */
const PAPER={A4:[210,297],A3:[297,420],B4:[257,364],'8K':[260,368]};
const PAPER_NAMES={A4:'A4（210×297mm）',A3:'A3（297×420mm）',B4:'B4（257×364mm）','8K':'8开（260×368mm）'};
const NOTE_TEXT='1.严禁在答题卡图像定位点周围区域做任何涂写或标记，否则答题卡作废，不计成绩。2.应保持答题卡的清洁，不得折叠、污染、破损等，不得在答题卡上写与题目无关的内容。3.填涂时要做到深、满、匀，即涂准位置，涂深颜色，涂满选项的方框，整个答题卡的所有涂点要涂的基本一致；涂错时用橡皮擦干净，且不造成答题卡破损。4.主观题作答请在对应区域内书写，超出答题框的内容可能无法评阅。';
const VERDICT_NAMES={RIGHT:'对',WRONG:'错',BLANK:'空白',MULTI:'多涂',REVIEW:'待复核',OK:'已涂'};
const PROVIDERS={
  deepseek:{label:'DeepSeek（视觉）',url:'https://api.deepseek.com/chat/completions',models:['deepseek-v4-flash-vision-exp'],keyUrl:'platform.deepseek.com'},
  doubao:{label:'豆包（火山方舟）',url:'https://ark.cn-beijing.volces.com/api/v3/chat/completions',models:['doubao-seed-1-6-vision-250815','doubao-1-5-vision-pro-32k-250115'],keyUrl:'console.volcengine.com/ark'},
  glm:{label:'GLM（智谱）',url:'https://open.bigmodel.cn/api/paas/v4/chat/completions',models:['glm-4.5v','glm-4v-plus-0111','glm-4v-flash-241112'],keyUrl:'open.bigmodel.cn'},
  custom:{label:'自定义（OpenAI 兼容）',url:'',models:[],keyUrl:'使用支持图片输入的任一 OpenAI 兼容接口'}
};
const IMG_LEVELS={lite:{w:800,q:0.72,label:'省流'},std:{w:900,q:0.82,label:'标准'},hd:{w:1200,q:0.9,label:'高清'}};
const LS_AI='yj_ai',LS_OMR='yj_omr',LS_UI='yj_ui';

function defaultAI(){
  return {provider:'deepseek',keys:{},models:{},customUrl:'',temp:0.35,maxTokens:4096,imgLevel:'std'};
}
function defaultOMR(){
  return {k:0.75,win:15,inkHigh:0.45,inkLow:0.25,sens:'std'};
}
let omr=Object.assign(defaultOMR(),loadJSON(LS_OMR)||{});
let ai=Object.assign(defaultAI(),loadJSON(LS_AI)||{});

/* ---------- 状态 ---------- */
let ui={tab:'home',tplEdit:null,clsCur:null,examCur:null,scanExam:null,scanRun:null,gradeExam:null,gradeQno:null,scoreExam:null};
let scanCtx=null;   // 扫描会话 {examId, total, done, status, logs}

/* ---------- IndexedDB ---------- */
const DB_NAME='yuejuan_db',DB_VER=1;
let db=null;
function openDB(){
  return new Promise(function(res,rej){
    if(db)return res(db);
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(ev){
      const d=req.result;
      if(!d.objectStoreNames.contains('classes'))d.createObjectStore('classes',{keyPath:'id'});
      if(!d.objectStoreNames.contains('students')){const s=d.createObjectStore('students',{keyPath:'id'});s.createIndex('byClass','classId');}
      if(!d.objectStoreNames.contains('templates'))d.createObjectStore('templates',{keyPath:'id'});
      if(!d.objectStoreNames.contains('exams'))d.createObjectStore('exams',{keyPath:'id'});
      if(!d.objectStoreNames.contains('pages')){const s=d.createObjectStore('pages',{keyPath:'id'});s.createIndex('byExam','examId');}
      if(!d.objectStoreNames.contains('crops')){const s=d.createObjectStore('crops',{keyPath:'id'});s.createIndex('byExamQ','exam_q');}
      if(!d.objectStoreNames.contains('revs'))d.createObjectStore('revs',{keyPath:'id'});
    };
    req.onsuccess=function(){db=req.result;res(db)};
    req.onerror=function(){rej(req.error)};
  });
}
function reqp(req){return new Promise(function(res,rej){req.onsuccess=function(){res(req.result)};req.onerror=function(){rej(req.error)}})}
const dbPut=async function(store,obj){const t=db.transaction(store,'readwrite');await reqp(t.objectStore(store).put(obj))};
const dbGet=async function(store,key){const t=db.transaction(store,'readonly');return reqp(t.objectStore(store).get(key))};
const dbAll=async function(store){const t=db.transaction(store,'readonly');return reqp(t.objectStore(store).getAll())};
const dbByIdx=async function(store,idx,val){const t=db.transaction(store,'readonly');return reqp(t.objectStore(store).index(idx).getAll(val))};
const dbDel=async function(store,key){const t=db.transaction(store,'readwrite');await reqp(t.objectStore(store).delete(key))};
const dbClear=async function(store){const t=db.transaction(store,'readwrite');await reqp(t.objectStore(store).clear())};

/* ---------- 模态框 ---------- */
let mResolve=null;
function dlg(html,opts){
  opts=opts||{};
  const box=$('mBox');
  box.innerHTML='<div class="m-head"><div class="m-title">'+esc(opts.title||'')+'</div><button class="m-x" data-act="dlg-close">✕</button></div>'
    +'<div class="m-body">'+html+'</div>'
    +(opts.foot?'<div class="m-foot">'+opts.foot+'</div>':'');
  $('mOverlay').hidden=false;

/* ---------- 版式布局（mm 坐标系，确定性输出） ---------- */
function paperWH(tpl){
  const p=PAPER[tpl.paper]||PAPER.A4;
  if(tpl.orient==='landscape')return {w:p[1],h:p[0]};
  return {w:p[0],h:p[1]};
}
function layoutTemplate(tpl){
  const wh=paperWH(tpl), w=wh.w, h=wh.h;
  const M=14, contentW=w-2*M;
  const big=9, sm=5;
  const anchors=[
    {x:12-big/2,y:12-big/2,s:big},
    {x:w-12-big/2,y:12-big/2,s:big},
    {x:w-12-big/2,y:h-12-big/2,s:big},
    {x:12-big/2,y:h-12-big/2,s:big},
    {x:12-sm/2,y:22-sm/2,s:sm},
    {x:w-12-sm/2,y:22-sm/2,s:sm}
  ];
  const regDigits=Math.max(4,Math.min(9,tpl.regDigits||5));
  const colW=11, regW=regDigits*colW, regX=Math.round((w-regW)/2);
  const regRowsY=[];
  for(let i=0;i<10;i++)regRowsY.push(45.6+i*4.4);
  const reg={x:regX,y:33,colW:colW,grid:8,rowsY:regRowsY,bubble:3.2,dy:4.4,
    numY:30.6,labelY:26.8,boxTop:24.5,label:'准 考 证 号'};
  const pages=[];
  const contentTop=94, contentBottom=h-36;
  const qr={x:w-48,y:36,size:30};

  const regEvery=(tpl.regEveryPage===true);
  function newPage(pi){
    return {w:w,h:h,title:(tpl.title||'答题卡'),info:(pi===0&&tpl.showInfo!==false)?{x:M,y:33,w:44,h:54.6}:null,
      notes:null,
      reg:(pi===0||regEvery)?reg:null,regDigits:regDigits,groups:[],subjective:[],qr:(pi===0)?qr:null,anchors:anchors,footer:{n:pi+1,m:0}};
  }
  /* 无考号区页面顶部从 38mm 开始（标题下方），避免大片空白；首页 94mm */
  const pageTopFor=function(pi){return (pi===0||regEvery)?contentTop:38};
  let pg=newPage(0); pages.push(pg);
  let curY=pageTopFor(0);
  function pageBreak(need){ if(curY+need<=contentBottom)return; pg=newPage(pages.length); pages.push(pg); curY=pageTopFor(pages.length-1); }
  function forcePage(){ pg=newPage(pages.length); pages.push(pg); curY=pageTopFor(pages.length-1); }
  /* 选择题组（超高自动拆分为多个子组跨页，题号连续） */
  const maxRowsPerPage=Math.max(1,Math.floor((contentBottom-contentTop-13)/5));
  (tpl.choiceGroups||[]).forEach(function(gp){
    const choices=Math.max(2,Math.min(6,gp.choices||4));
    const total=Math.max(1,Math.min(200,gp.count||20));
    const cellW=10;
    let cols=Math.max(1,Math.min(total,gp.cols||0));
    if(!gp.cols){cols=Math.max(1,Math.floor((contentW-6)/(cellW+choices*7.0+1)));}
    cols=Math.min(cols,total);
    const x0=M+6, gridW=contentW-12;
    const dxq=gridW/cols;
    const dxc=Math.max(3.5,(dxq-cellW)/choices);
    const label=(gp.label||('一、选择题'))+'';
    let qFirst=gp.first||1, remaining=total, part=0;
    while(remaining>0){
      const rows=Math.min(remaining,Math.max(1,Math.min(Math.ceil(remaining/cols),maxRowsPerPage)));
      const subCount=Math.min(remaining,rows*cols);
      const hNeed=7+rows*5+6;
      pageBreak(hNeed);
      const g={first:qFirst,count:subCount,choices:choices,cols:cols,rows:rows,
        x0:x0,y0:curY+7,dxq:dxq,dy:5,dxc:dxc,size:[4.2,2.8],timing:{dx:-2,w:1,h:2},label:label+(part>0?'（续）':'')};
      pg.groups.push(g);
      curY+=hNeed;
      qFirst+=subCount;remaining-=subCount;part++;
    }
  });
  /* 主观题（超出页面自动分页切分） */
  (tpl.subjective||[]).forEach(function(sub){
    const type=sub.type||'lines';
    const cols=(type==='grid-cn')?Math.max(10,Math.min(40,sub.cols||20)):null;
    const rowH=(type==='grid-cn')?(Math.min(8,166/cols)+1.2):(type==='grid-en')?5:8;
    const headH=(type==='grid-cn'&&sub.titleLine)?13:0;
    const totalRows=(type==='grid-cn'&&sub.count)?Math.max(1,Math.ceil(sub.count/cols)):Math.max(1,sub.rows||3);
    const fullMax=Math.max(1,Math.floor((contentBottom-((regEvery)?contentTop:38)-13)/rowH));
    /* 分页：每页尽量填满（首页按剩余空间，之后每页按整页容量，不做均衡拆分） */
    let remaining=totalRows, part=0, partRowStart=0;
    while(remaining>0){
      const avail=contentBottom-curY-13;
      let take;
      if(avail>=rowH){
        take=Math.min(remaining,Math.floor(avail/rowH));
      }else{
        forcePage();
        take=Math.min(remaining,fullMax);
      }
      const partHead=(part===0)?headH:0;
      const boxH=take*rowH+6+partHead;
      const sx=M+2, sw=contentW-4, sy=curY+7;
      pg.subjective.push({qno:sub.qno||('主观'+(part+1)),score:sub.score||10,type:type,rows:take,rowH:rowH,
        cols:cols,rowStart:partRowStart,headH:partHead,
        part:part,label:(sub.label||'主观题')+(part>0?'（续第'+(part+1)+'部分）':''),x:sx,y:sy,w:sw,h:boxH});
      remaining-=take; part++; partRowStart+=take;
      curY+=13+boxH;
    }
  });
  pages.forEach(function(p,i){p.footer.n=i+1;p.footer.m=pages.length});
  return {w:w,h:h,pages:pages,regDigits:regDigits,perScore:tpl.perScore||2,id:tpl.id||'',name:tpl.name||''};
}

/* ---------- mm→px 渲染 ---------- */
function renderPageCanvas(tpl,layout,page,dpi,qrCv){
  const px=function(m){return m*dpi/25.4};
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(px(page.w)));
  cv.height=Math.max(1,Math.round(px(page.h)));
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  /* 锚点：外白框(0.4mm线) + 内实心方块 */
  page.anchors.forEach(function(a){
    const outer=a.s, inner=a.s*0.667;
    ctx.fillStyle='#fff';
    ctx.fillRect(px(a.x),px(a.y),px(outer),px(outer));
    ctx.strokeStyle='#000';ctx.lineWidth=Math.max(1,px(0.4));
    ctx.strokeRect(px(a.x)+ctx.lineWidth/2,px(a.y)+ctx.lineWidth/2,px(outer)-ctx.lineWidth,px(outer)-ctx.lineWidth);
    ctx.fillStyle='#000';
    const off=(outer-inner)/2;
    ctx.fillRect(px(a.x+off),px(a.y+off),px(inner),px(inner));
  });
  /* 标题 */
  ctx.fillStyle='#000';
  ctx.font='bold '+Math.max(10,Math.round(px(5.6)))+'px "Microsoft YaHei",sans-serif';
  ctx.fillText(page.title,px(page.w/2),px(21));
  /* 姓名/班级/座位号 */
  if(page.info){
    const r=page.info;
    ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.7,px(0.25));
    ctx.strokeRect(px(r.x),px(r.y),px(r.w),px(r.h));
    const rows=[['姓名',8.5],['班级',20],['座位号',31.5]];
    ctx.font=Math.max(9,Math.round(px(3.3)))+'px "Microsoft YaHei",sans-serif';
    rows.forEach(function(rd){
      ctx.textAlign='left';
      ctx.fillText(rd[0],px(r.x+3.2),px(r.y+rd[1]));
      ctx.beginPath();ctx.moveTo(px(r.x+16),px(r.y+rd[1]+3.4));ctx.lineTo(px(r.x+r.w-3.5),px(r.y+rd[1]+3.4));
      ctx.lineWidth=Math.max(0.7,px(0.28));ctx.strokeStyle='#555';ctx.stroke();
    });
  }
  /* 注意事项 */
  if(page.notes){
    const r=page.notes;
    ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.7,px(0.25));
    ctx.strokeRect(px(r.x),px(r.y),px(r.w),px(r.h));
    ctx.textAlign='left';ctx.font=Math.max(6,Math.round(px(2.4)))+'px "Microsoft YaHei",sans-serif';
    ctx.fillStyle='#333';
    let y=r.y+5;
    const full=NOTE_TEXT;
    let line='',li=0;
    for(let i=0;i<full.length;i++){
      if((line.length+1)*2.4>r.w-5&&line){ctx.fillText(line,px(r.x+2.5),px(y));y+=3.3;if(y>r.y+r.h-2.5)break;line='';}
      line+=full[i];
    }
    if(line)ctx.fillText(line,px(r.x+2.5),px(y));
  }
  /* 考号区（仅首页；如需每页可开启模板选项） */
  const reg=page.reg;
  if(!reg){
    ctx.textAlign='center';
  }else{
  ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.7,px(0.25));
  ctx.strokeRect(px(reg.x-2.5),px(reg.boxTop),px(regDigitsW(reg,page)+5),px(regBottom(reg)-reg.boxTop+3.4));
  /* 列序号 */
  ctx.font=Math.max(7,Math.round(px(2.3)))+'px "Microsoft YaHei",sans-serif';
  ctx.fillStyle='#777';ctx.textAlign='center';
  for(let c=0;c<pageRegDigits(reg,page);c++){
    const cx=reg.x+c*reg.colW;
    ctx.fillText(String(c+1),px(cx+reg.colW/2),px(reg.numY));
  }
  /* 标题「准 考 证 号」 */
  ctx.fillStyle='#000';ctx.font=Math.max(9,Math.round(px(3.1)))+'px "Microsoft YaHei",sans-serif';
  ctx.fillText(reg.label,px(reg.x+regDigitsW(reg,page)/2),px(reg.labelY));
  for(let c=0;c<pageRegDigits(reg,page);c++){
    const cx=reg.x+c*reg.colW;
    ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.7,px(0.25));
    ctx.strokeRect(px(cx+(reg.colW-reg.grid)/2),px(reg.y),px(reg.grid),px(reg.grid));
  }
  reg.rowsY.forEach(function(ry,i){
    for(let c=0;c<pageRegDigits(reg,page);c++){
      const cx=reg.x+c*reg.colW+(reg.colW-reg.bubble)/2;
      ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.6,px(0.2));
      ctx.strokeRect(px(cx),px(ry-reg.bubble/2),px(reg.bubble),px(reg.bubble));
      ctx.font=Math.max(6,Math.round(px(2.2)))+'px "Microsoft YaHei",sans-serif';
      ctx.fillStyle='#333';
      ctx.fillText(String(i),px(cx+reg.bubble/2),px(ry));
    }
    /* 每位数字右侧同步条 */
    ctx.fillStyle='#000';
    for(let c=0;c<pageRegDigits(reg,page);c++){
      const cx=reg.x+c*reg.colW+reg.colW+0.7;
      ctx.fillRect(px(cx-0.4),px(ry-1),px(0.8),px(2));
    }
  });
  }
  ctx.textAlign='center';
  /* 选择题组 */
  page.groups.forEach(function(g){
    ctx.strokeStyle='#555';ctx.lineWidth=Math.max(0.7,px(0.3));
    ctx.strokeRect(px(g.x0-3),px(g.y0-2),px((g.dxq*g.cols)+6),px(g.rows*g.dy+4));
    ctx.fillStyle='#000';
    ctx.font='bold '+Math.max(8,Math.round(px(3.6)))+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillText(g.label+'（每题'+(pagePerScore(tpl,layout,page))+'分）',px(g.x0),px(g.y0-4.5));
    ctx.textAlign='center';
    for(let c=0;c<g.cols;c++){
      const xc=g.x0+c*g.dxq;
      for(let r=0;r<g.rows;r++){
        const qn=g.first+c*g.rows+r;
        if(qn>g.first+g.count-1)break;
        const rowY=g.y0+2.5+r*g.dy;
        ctx.font='bold '+Math.max(7,Math.round(px(2.8)))+'px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#000';
        ctx.fillText(String(qn),px(xc+4),px(rowY));
        for(let ch=0;ch<g.choices;ch++){
          const bx=xc+9+ch*g.dxc;
          const bw=g.size[0],bh=g.size[1];
          ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.6,px(0.18));
          ctx.strokeRect(px(bx),px(rowY-bh/2),px(bw),px(bh));
          ctx.font=Math.max(6,Math.round(px(2.3)))+'px Arial,sans-serif';
          ctx.fillStyle='#444';
          ctx.fillText(String.fromCharCode(65+ch),px(bx+bw/2),px(rowY+0.1));
        }
        /* 行同步条 */
        ctx.fillStyle='#000';
        ctx.fillRect(px(g.x0-2.2),px(rowY-1),px(1),px(2));
      }
    }
  });
  /* 主观题区 */
  page.subjective.forEach(function(sb){
    ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.8,px(0.35));
    ctx.strokeRect(px(sb.x),px(sb.y),px(sb.w),px(sb.h));
    ctx.fillStyle='#000';ctx.font='bold '+Math.max(8,Math.round(px(3.6)))+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillText(sb.label+'（'+sb.score+'分）',px(sb.x),px(sb.y-4.5));
    const innerW=sb.w-12;
    if(sb.type==='lines'){
      ctx.strokeStyle='#999';ctx.lineWidth=Math.max(0.6,px(0.2));
      for(let i=0;i<sb.rows;i++){
        const ly=sb.y+4+i*sb.rowH+2;
        ctx.beginPath();ctx.moveTo(px(sb.x+5),px(ly));ctx.lineTo(px(sb.x+sb.w-5),px(ly));ctx.stroke();
      }
    }else if(sb.type==='grid-cn'){
      const cols=Math.max(10,Math.min(40,sb.cols||20));
      const cell=Math.min(8,innerW/cols);
      const gw=cols*cell, gx=sb.x+(sb.w-gw)/2, gy=sb.y+4+(sb.headH||0);
      if(sb.headH){
        /* 可选「题目」栏：居中、横线长约框宽一半 */
        const lineLen=(sb.w-26)/2;
        const labelW=16;
        const startX=sb.x+(sb.w-(labelW+lineLen))/2;
        ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.7,px(0.28));
        ctx.beginPath();ctx.moveTo(px(startX+labelW),px(sb.y+9.5));ctx.lineTo(px(startX+labelW+lineLen),px(sb.y+9.5));ctx.stroke();
        ctx.fillStyle='#000';ctx.font='bold '+Math.max(9,Math.round(px(3.2)))+'px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';
        ctx.fillText('题  目：',px(startX+labelW/2),px(sb.y+7));
      }
      const cellH=8, gapV=1.2, pitch=cellH+gapV;
      ctx.strokeStyle='#bbb';ctx.lineWidth=Math.max(0.5,px(0.16));
      for(let r=0;r<sb.rows;r++){
        const lineY=gy+r*pitch;
        for(let c=0;c<cols;c++){
          ctx.strokeRect(px(gx+c*cell),px(lineY),px(cell),px(cellH));
        }
      }
      /* 行与行之间的缝隙内标注：每满100字 */
      const rowBase=(sb.rowStart||0);
      ctx.fillStyle='#8a8a8a';ctx.font=Math.max(5,Math.round(px(2)))+'px "Microsoft YaHei",sans-serif';
      ctx.textAlign='left';
      for(let r=0;r<sb.rows;r++){
        const cumAfter=(rowBase+r+1)*cols;
        const k=Math.floor(cumAfter/100);
        const cumBefore=cumAfter-cols;
        if(k*100>cumBefore&&k*100<=cumAfter){
          const labelY=gy+(r+1)*pitch-gapV/2;
          ctx.fillText(String(k*100)+'字',px(gx+gw+1.2),px(labelY));
        }
      }
      ctx.textAlign='center';
    }else if(sb.type==='grid-en'){
      ctx.strokeStyle='#999';ctx.lineWidth=Math.max(0.5,px(0.18));
      for(let i=0;i<sb.rows;i++){
        const base=sb.y+4+i*sb.rowH;
        const ys=[base,base+1.4,base+2.8,base+4.2];
        ys.forEach(function(y,k){
          ctx.beginPath();ctx.moveTo(px(sb.x+4),px(y));ctx.lineTo(px(sb.x+sb.w-4),px(y));ctx.stroke();
        });
      }
    }
  });
  /* 页脚 */
  ctx.fillStyle='#000';ctx.font=Math.max(7,Math.round(px(2.8)))+'px "Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.fillText('第'+page.footer.n+'页,共'+page.footer.m+'页',px(page.w/2),px(page.h-14.5));
  /* 二维码 */
  if(qrCv&&page.qr){
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(qrCv,px(page.qr.x),px(page.qr.y),px(page.qr.size),px(page.qr.size));
  }
  ctx.textAlign='center';
  return cv;
}
function pageRegDigits(reg,page){return (page.regDigits||regDigitsOf(page))||5}
function regDigitsOf(page){return page.regDigits||5}
function regDigitsW(reg,page){return reg.colW*pageRegDigits(reg,page)}
function regBottom(reg){return reg.rowsY[9]+3.4}
function pagePerScore(tpl,layout,page){return layout.perScore||2}
function pageRegDigits2(page){return page.regDigits||5}

/* ---------- 二维码（自描述版式） ---------- */
function b64FromBytes(bytes){
  let bin='';
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  }
  return btoa(bin);
}
function bytesFromB64(b64){
  const bin=atob(b64);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return arr;
}
function b64ToBlob(b64,type){
  try{return new Blob([bytesFromB64(b64)],{type:type||'image/jpeg'})}catch(e){return null}
}
function r1(v){return Math.round(v*10)/10}
function r2(v){return Math.round(v*100)/100}
async function qrPayloadFor(layout,tpl,page){
  /* 紧凑版式：尽量压缩；超限则退化为「仅模板ID」最小模式（本地查模板，找不到走批内模板并告警） */
  const a=[];
  page.anchors.forEach(function(x){a.push(r1(x.x),r1(x.y),r1(x.s))});
  const gs=page.groups.map(function(g){
    return [g.first,g.count,g.choices,g.cols,g.rows,r1(g.x0),r1(g.y0),r2(g.dxq),r2(g.dy),r2(g.dxc),g.size[0],g.size[1]];
  });
  const ss=page.subjective.map(function(s){
    return [s.qno,s.score,s.type,s.rows,r2(s.rowH),r1(s.x),r1(s.y),r1(s.w),r1(s.h),s.part,s.cols||null,s.rowStart||0,s.headH||0];
  });
  const slice={v:1,p:tpl.paper||'A4',o:tpl.orient||'portrait',w:layout.w,h:layout.h,rd:layout.regDigits,
    ps:layout.perScore,t:page.title,id:tpl.id||'',pg:page.footer.n,np:page.footer.m,info:page.info?1:0,
    a:a,qr:page.qr?{x:r1(page.qr.x),y:r1(page.qr.y),s:page.qr.size}:null,
    r:page.reg?{x:r1(page.reg.x),y:r1(page.reg.y),dy:r2(page.reg.rowsY[1]-page.reg.rowsY[0]),ry0:r2(page.reg.rowsY[0]-page.reg.y),b:page.reg.bubble,col:page.reg.colW}:null,
    gs:gs,ss:ss};
  const json=JSON.stringify(slice);
  let payload='';
  try{
    if(typeof CompressionStream!=='undefined'&&typeof TextEncoder!=='undefined'){
      const cs=new CompressionStream('deflate-raw');
      const res=await new Response(new Blob([json]).stream().pipeThrough(cs)).blob();
      const buf=await res.arrayBuffer();
      payload='DTZ1|1|'+b64FromBytes(new Uint8Array(buf));
    }
  }catch(e){}
  if(!payload)payload='DTZ1|0|'+b64FromBytes(new TextEncoder().encode(json));
  if(payload.length<=330)return payload;
  /* 退化：最小模式（模板ID + 考号位数 + 页数） */
  return 'DTZ1|2|'+encodeURIComponent(tpl.id||'')+'|'+layout.regDigits+'|'+layout.pages.length;
}
async function qrParsePayload(data){
  data=String(data||'').trim();
  if(data.indexOf('DTZ1|')!==0)throw new Error('非本系统二维码');
  const s=data.slice(5);
  const sep=s.indexOf('|');
  const flag=s.slice(0,sep);
  if(flag==='2'){
    const rest=s.slice(sep+1).split('|');
    return {minimal:true,tplId:decodeURIComponent(rest[0]||''),regDigits:parseInt(rest[1],10)||5,pages:parseInt(rest[2],10)||1};
  }
  const b64=s.slice(sep+1);
  const bytes=bytesFromB64(b64);
  let json;
  if(flag==='1'){
    if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持解压');
    const ds=new DecompressionStream('deflate-raw');
    const blob=new Blob([bytes]);
    json=await new Response(blob.stream().pipeThrough(ds)).text();
  }else{
    json=new TextDecoder().decode(bytes);
  }
  const o=JSON.parse(json);
  if(o.gs||o.a){  /* 紧凑格式还原为页面版式 */
    const rowsY=[];
    const rdy=(o.r&&o.r.dy&&isFinite(o.r.dy))?o.r.dy:4.4;
    const ry0=(o.r&&isFinite(o.r.ry0))?o.r.ry0:12.6;
    if(o.r)for(let i=0;i<10;i++)rowsY.push(o.r.y+ry0+i*rdy);
    const page={w:o.w,h:o.h,title:o.t,info:o.info?{x:14,y:32,w:44,h:58}:null,
      notes:o.info?{x:o.w-60,y:32,w:46,h:58}:null,
      reg:o.r?{x:o.r.x,y:o.r.y,colW:o.r.col,grid:8,rowsY:rowsY,bubble:o.r.b,label:'准 考 证 号'}:null,
      regDigits:o.rd,groups:[],subjective:[],footer:{n:o.pg,m:o.np},
      anchors:[],qr:o.qr?{x:o.qr.x,y:o.qr.y,size:o.qr.s}:null};
    const fl=a=>{const out=[];for(let i=0;i<a.length;i+=3)out.push({x:a[i],y:a[i+1],s:a[i+2]});return out};
    page.anchors=fl(o.a);
    (o.gs||[]).forEach(function(g){
      page.groups.push({first:g[0],count:g[1],choices:g[2],cols:g[3],rows:g[4],
        x0:g[5],y0:g[6],dxq:g[7],dy:g[8],dxc:g[9],size:[g[10],g[11]],timing:{dx:-2.2,w:1,h:2},label:'选择题'});
    });
    (o.ss||[]).forEach(function(s){
      page.subjective.push({qno:s[0],score:s[1],type:s[2],rows:s[3],rowH:s[4],x:s[5],y:s[6],w:s[7],h:s[8],part:s[9],
        cols:s[10]||null,rowStart:s[11]||0,headH:s[12]||0,label:'主观题'});
    });
    page.perScore=o.ps;
    return page;
  }
  return o;
}
async function makeQRCanvas(payload){
  if(typeof qrcode!=='function')return null;
  try{
    const modPx=6;
    const qr=qrcode(0,'M');
    qr.addData(payload);
    qr.make();
    const n=qr.getModuleCount();
    const S=(n+8)*modPx;
    const cv=document.createElement('canvas');
    cv.width=S;cv.height=S;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);
    ctx.fillStyle='#000';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      if(qr.isDark(r,c))ctx.fillRect((c+4)*modPx,(r+4)*modPx,modPx,modPx);
    }
    return cv;
  }catch(e){console.error(e);return null}
}

/* ---------- 渲染入口（异步：先备齐各页二维码） ---------- */
async function renderPagesAsync(tpl,dpi){
  const layout=layoutTemplate(tpl);
  const qrs=[];
  for(let i=0;i<layout.pages.length;i++){
    const payload=await qrPayloadFor(layout,tpl,layout.pages[i]);
    qrs.push(await makeQRCanvas(payload));
  }
  return {layout:layout,canvases:layout.pages.map(function(p,i){return renderPageCanvas(tpl,layout,p,dpi,qrs[i])})};
}
function renderPagesSync(tpl,dpi){
  const layout=layoutTemplate(tpl);
  return {layout:layout,canvases:layout.pages.map(function(p){return renderPageCanvas(tpl,layout,p,dpi,null)})};
}

/* ---------- 图像加载 ---------- */
async function blobCanvas(blob,maxLong){
  const img=await createImageBitmap(blob);
  const scale=Math.min(1,maxLong/Math.max(img.width,img.height));
  const w=Math.max(1,Math.round(img.width*scale)),h=Math.max(1,Math.round(img.height*scale));
  const cv=document.createElement('canvas');cv.width=w;cv.height=h;
  const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,w,h);
  ctx.drawImage(img,0,0,w,h);
  return {cv:cv,scale:scale,srcW:img.width,srcH:img.height};
}
async function pdfToCanvases(file,maxLong){
  const buf=await file.arrayBuffer();
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  const out=[];
  for(let i=1;i<=doc.numPages;i++){
    const pg=await doc.getPage(i);
    const vp=pg.getViewport({scale:1});
    const scale=Math.min(1,maxLong/Math.max(vp.width,vp.height));
    const vp2=pg.getViewport({scale:scale});
    const cv=document.createElement('canvas');cv.width=Math.round(vp2.width);cv.height=Math.round(vp2.height);
    const ctx=cv.getContext('2d');ctx.fillStyle='#fff';ctx.fillRect(0,0,cv.width,cv.height);
    await pg.render({canvasContext:ctx,viewport:vp2}).promise;
    out.push(cv);
  }
  return out;
}
async function filesToCanvases(files,maxLong){
  const out=[];
  for(const f of Array.from(files||[])){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name||'')){
      const pages=await pdfToCanvases(f,maxLong);
      pages.forEach(function(cv){out.push({cv:cv,file:f.name,pageNo:out.length+1})});
    }else{
      const r=await blobCanvas(f,maxLong);
      out.push({cv:r.cv,file:f.name,pageNo:out.length+1});
    }
  }
  return out;
}

/* ---------- 灰度与自适应二值化 ---------- */
function toGray(cv){
  const w=cv.width,h=cv.height;
  const d=cv.getContext('2d').getImageData(0,0,w,h).data;
  const gray=new Uint8Array(w*h);
  for(let i=0,j=0;i<d.length;i+=4,j++)gray[j]=(d[i]*299+d[i+1]*587+d[i+2]*114)/1000|0;
  return {gray:gray,w:w,h:h};
}
function binarize(gray,w,h,k,win){
  const I=new Float64Array((w+1)*(h+1));
  for(let y=0;y<h;y++){
    let rowSum=0;
    const yc=(y+1)*(w+1),yp=y*(w+1);
    for(let x=0;x<w;x++){
      rowSum+=gray[y*w+x];
      I[yc+x+1]=I[yp+x+1]+rowSum;
    }
  }
  const bin=new Uint8Array(w*h);
  for(let y=0;y<h;y++){
    const y0=Math.max(0,y-win),y1=Math.min(h-1,y+win);
    for(let x=0;x<w;x++){
      const x0=Math.max(0,x-win),x1=Math.min(w-1,x+win);
      const sum=I[(y1+1)*(w+1)+x1+1]-I[y0*(w+1)+x1+1]-I[(y1+1)*(w+1)+x0]+I[y0*(w+1)+x0];
      const m=sum/((y1-y0+1)*(x1-x0+1));
      bin[y*w+x]=gray[y*w+x]<m*k?1:0;
    }
  }
  return bin;
}

/* ---------- 全局四角锚点（通用：照片带背景、未充满画面、倾斜） ---------- */
function globalSolids(bin,w,h,minArea,maxArea){
  const vis=new Uint8Array(w*h);
  const out=[];
  const step=3;
  for(let y=1;y<h-1;y+=step)for(let x=1;x<w-1;x+=step){
    if(!bin[y*w+x]||vis[y*w+x])continue;
    /* BFS */
    let area=0,sx=0,sy=0,mx=x,Mx=x,my=y,My=y;
    const stack=[x,y];vis[y*w+x]=1;
    while(stack.length){
      const py=stack.pop(),px2=stack.pop();
      area++;sx+=px2;sy+=py;
      if(px2<mx)mx=px2;if(px2>Mx)Mx=px2;if(py<my)my=py;if(py>My)My=py;
      if(px2+1<w&&!vis[py*w+px2+1]&&bin[py*w+px2+1]){vis[py*w+px2+1]=1;stack.push(px2+1,py);}
      if(px2-1>0&&!vis[py*w+px2-1]&&bin[py*w+px2-1]){vis[py*w+px2-1]=1;stack.push(px2-1,py);}
      if(py+1<h&&!vis[(py+1)*w+px2]&&bin[(py+1)*w+px2]){vis[(py+1)*w+px2]=1;stack.push(px2,py+1);}
      if(py-1>0&&!vis[(py-1)*w+px2]&&bin[(py-1)*w+px2]){vis[(py-1)*w+px2]=1;stack.push(px2,py-1);}
    }
    const bw2=Mx-mx+1,bh2=My-my+1;
    if(area<minArea||area>maxArea)continue;
    const asp=bw2/bh2;
    if(asp<0.7||asp>1.4)continue;
    const sol=area/(bw2*bh2);
    if(sol<0.72)continue;
    /* 排除噪点：相对面积过滤 */
    out.push({x:sx/area,y:sy/area,area:area,w:bw2,h:bh2,cx:mx+Mx>>1,cy:my+My>>1});
  }
  return out;
}
function pickQuad(cands){
  if(!cands||cands.length<4)return null;
  cands=cands.slice().sort(function(a,b){return b.area-a.area}).slice(0,10);
  const dist=function(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)};
  let best=null;
  for(let i=0;i<cands.length;i++)for(let j=i+1;j<cands.length;j++)for(let k=j+1;k<cands.length;k++)for(let l=k+1;l<cands.length;l++){
    const C=[cands[i],cands[j],cands[k],cands[l]];
    let TL=C[0];
    let TR=C[0];
    let BR=C[0];
    let BL=C[0];
    C.forEach(function(c){
      if(c.x+c.y<TL.x+TL.y)TL=c;
      if(c.x-c.y>TR.x-TR.y)TR=c;
      if(c.x+c.y>BR.x+BR.y)BR=c;
      if(c.x-c.y<BL.x-BL.y)BL=c;
    });
    if(TL===TR||TL===BR||TL===BL||TR===BR||TR===BL||BR===BL)continue;
    const wT=dist(TL,TR),wB=dist(BL,BR),hL=dist(TL,BL),hR=dist(TR,BR);
    if(wT<30||wB<30||hL<30||hR<30)continue;
    if(wT/wB<0.65||wT/wB>1.55)continue;
    if(hL/hR<0.65||hL/hR>1.55)continue;
    const asp=(wT+wB)/(hL+hR);
    if(asp<0.5||asp>1.8)continue;
    const score=wT*wB*hL*hR;
    if(!best||score>best.score)best={score:score,TL:TL,TR:TR,BR:BR,BL:BL,wT:wT,wB:wB,hL:hL,hR:hR};
  }
  return best;
}
function detectAnchorsGlobal(bin,w,h){
  const lo=Math.round(w*0.010),hi=Math.round(w*0.042);
  const cands=globalSolids(bin,w,h,lo*lo*0.35,hi*hi*2.2);
  const q=pickQuad(cands);
  if(!q)return null;
  return {pts:[q.TL,q.TR,q.BR,q.BL],wStart:q.wT,wEnd:q.wB};
}
/* ---------- 连通域找实心锚点 ---------- */
function findSolid(bin,w,h,cx,cy,halfX,halfY,minA,maxA,minSol){
  const x0=Math.max(1,Math.floor(cx-halfX)),x1=Math.min(w-2,Math.ceil(cx+halfX));
  const y0=Math.max(1,Math.floor(cy-halfY)),y1=Math.min(h-2,Math.ceil(cy+halfY));
  if(x0>x1||y0>y1)return null;
  const W=x1-x0+1;
  const vis=new Uint8Array(W*(y1-y0+1));
  let best=null;
  for(let yy=y0;yy<=y1;yy++)for(let xx=x0;xx<=x1;xx++){
    const idx=(yy-y0)*W+(xx-x0);
    if(vis[idx]||!bin[yy*w+xx])continue;
    let area=0,sx=0,sy=0,mx=xx,Mx=xx,my=yy,My=yy;
    const stack=[xx,yy];vis[idx]=1;
    while(stack.length){
      const py=stack.pop(),px2=stack.pop();
      area++;sx+=px2;sy+=py;
      if(px2<mx)mx=px2;if(px2>Mx)Mx=px2;if(py<my)my=py;if(py>My)My=py;
      if(px2+1<=x1&&!vis[(py-y0)*W+(px2+1-x0)]&&bin[py*w+px2+1]){vis[(py-y0)*W+(px2+1-x0)]=1;stack.push(px2+1,py);}
      if(px2-1>=x0&&!vis[(py-y0)*W+(px2-1-x0)]&&bin[py*w+px2-1]){vis[(py-y0)*W+(px2-1-x0)]=1;stack.push(px2-1,py);}
      if(py+1<=y1&&!vis[(py+1-y0)*W+(px2-x0)]&&bin[(py+1)*w+px2]){vis[(py+1-y0)*W+(px2-x0)]=1;stack.push(px2,py+1);}
      if(py-1>=y0&&!vis[(py-1-y0)*W+(px2-x0)]&&bin[(py-1)*w+px2]){vis[(py-1-y0)*W+(px2-x0)]=1;stack.push(px2,py-1);}
    }
    const bw2=Mx-mx+1,bh2=My-my+1;
    if(area<minA||area>maxA)continue;
    const asp=bw2/bh2;
    if(asp<0.7||asp>1.4)continue;
    const sol=area/(bw2*bh2);
    if(sol<minSol)continue;
    if(!best||area>best.area)best={x:sx/area,y:sy/area,area:area,w:bw2,h:bh2};
  }
  return best;
}
function detectAnchors(bin,w,h,page,sX,sY){
  const pts=[null,null,null,null],smallPts=[null,null],warn=[];
  page.anchors.forEach(function(a,i){
    const cx=(a.x+a.s/2)*sX,cy=(a.y+a.s/2)*sY;
    const halfX=a.s*sX*2.4,halfY=a.s*sY*2.4;
    const theory=(a.s*0.667*sX)*(a.s*0.667*sY);
    const r=findSolid(bin,w,h,cx,cy,halfX,halfY,theory*0.45,theory*2.1,0.72);
    if(r){if(i<4)pts[i]={x:r.x,y:r.y};else smallPts[i-4]={x:r.x,y:r.y};}
    else warn.push('锚点'+(i+1)+'未找到');
  });
  return {pts:pts,small:smallPts,warn:warn};
}

/* ---------- 单应 DLT ---------- */
function gaussSolve(A,b,n){
  const M=[];
  for(let i=0;i<n;i++){
    const row=new Array(n+1);
    for(let j=0;j<n;j++)row[j]=A[i][j];
    row[n]=b[i];M.push(row);
  }
  for(let col=0;col<n;col++){
    let piv=col;
    for(let r=col+1;r<n;r++)if(Math.abs(M[r][col])>Math.abs(M[piv][col]))piv=r;
    if(piv!==col){const t=M[col];M[col]=M[piv];M[piv]=t;}
    const d=M[col][col]||1e-12;
    for(let j=col;j<n+1;j++)M[col][j]/=d;
    for(let r=0;r<n;r++){
      if(r===col)continue;
      const f=M[r][col];if(!f)continue;
      for(let j=col;j<n+1;j++)M[r][j]-=f*M[col][j];
    }
  }
  return M.map(function(row){return row[n]});
}
function solveHomo(src,dst){
  const A=[],b=[];
  for(let i=0;i<4;i++){
    const x=src[i].x,y=src[i].y,u=dst[i].x,v=dst[i].y;
    A.push([x,y,1,0,0,0,-u*x,-u*y]);b.push(u);
    A.push([0,0,0,x,y,1,-v*x,-v*y]);b.push(v);
  }
  const h=gaussSolve(A,b,8);
  const map=function(x,y){
    const den=h[6]*x+h[7]*y+1;
    return {x:(h[0]*x+h[1]*y+h[2])/den,y:(h[3]*x+h[4]*y+h[5])/den};
  };
  map.h=h;map.src=src;map.dst=dst;
  return map;
}

/* ---------- OMR 采样 ---------- */
function inkRatio(bin,w,h,cx,cy,r){
  const x0=Math.max(0,Math.floor(cx-r)),x1=Math.min(w-1,Math.ceil(cx+r));
  const y0=Math.max(0,Math.floor(cy-r)),y1=Math.min(h-1,Math.ceil(cy+r));
  if(x0>x1||y0>y1)return 0;
  let cnt=0,total=0;
  const r2=r*r;
  for(let y=y0;y<=y1;y++)for(let x=x0;x<=x1;x++){
    const dx=x-cx,dy=y-cy;
    if(dx*dx+dy*dy<=r2){total++;if(bin[y*w+x])cnt++;}
  }
  return total?cnt/total:0;
}
/* 同步条行检测：对每个预期行位置，在 x±2mm 竖窗内找黑色横段质心 */
function detectRowMarks(bin,w,h,expPx,smm){
  const marks=[];
  expPx.forEach(function(exp,idx){
    const mm=smm;
    const y0=Math.round(exp.y-mm*4.2),y1=Math.round(exp.y+mm*4.2);
    const x0=Math.round(exp.x-mm*2),x1=Math.round(exp.x+mm*2);
    const minRun=Math.max(3,Math.round(mm*0.8)),maxRun=Math.round(mm*3.6);
    let runY=null,runLen=0,best=null,widthMax=0;
    for(let y=y0;y<=y1;y++){
      let c=0;
      for(let x=x0;x<=x1;x++)if(bin[y*w+x])c++;
      if(c>=4){if(runY===null)runY=y;runLen++;if(c>widthMax)widthMax=c;}
      else{
        if(runLen>=minRun&&runLen<=maxRun&&widthMax>=5){
          const center=runY+(runLen-1)/2;
          if(best===null||Math.abs(center-exp.y)<Math.abs(best-exp.y))best=center;
        }
        runY=null;runLen=0;widthMax=0;
      }
    }
    if(runLen>=minRun&&runLen<=maxRun&&widthMax>=5){
      const center=runY+(runLen-1)/2;
      if(best===null||Math.abs(center-exp.y)<Math.abs(best-exp.y))best=center;
    }
    marks.push(best);
  });
  return marks;
}
function rowDeltas(marks,expYs){
  const n=expYs.length,deltas=new Array(n).fill(null);
  for(let i=0;i<n;i++)if(marks[i]!=null)deltas[i]=marks[i]-expYs[i];
  for(let i=0;i<n;i++){
    if(deltas[i]!=null)continue;
    for(let j=1;j<n;j++){
      const k=i-j,l=i+j;
      if(k>=0&&deltas[k]!=null){deltas[i]=deltas[k];break}
      if(l<n&&deltas[l]!=null){deltas[i]=deltas[l];break}
    }
  }
  return deltas;
}
function judgeQuestion(inks,high,low){
  const hs=[],mids=[];
  inks.forEach(function(x){if(x.ink>=high)hs.push(x);else if(x.ink>low)mids.push(x)});
  if(hs.length===1)return {verdict:'OK',choice:String(hs[0].c)};
  if(hs.length>1)return {verdict:'MULTI',choice:null};
  if(mids.length)return {verdict:'REVIEW',choice:null};
  return {verdict:'BLANK',choice:null};
}
function judgeDigit(inks,high,low){
  const hs=inks.filter(function(x){return x.ink>=high});
  const mids=inks.filter(function(x){return x.ink>low&&x.ink<high});
  if(hs.length===1)return {digit:String(hs[0].c),ok:true};
  if(hs.length>1)return {digit:null,ok:false,reason:'多涂'};
  if(mids.length)return {digit:null,ok:false,reason:'模糊'};
  return {digit:null,ok:false,reason:'空白'};
}

/* ---------- 二维码读取 ---------- */
function qrFromCanvas(cv){
  try{
    if(typeof jsQR!=='function')return null;
    const d=cv.getContext('2d').getImageData(0,0,cv.width,cv.height);
    const r=jsQR(d.data,cv.width,cv.height,{inversionAttempts:'dontInvert'});
    return r&&r.data?r.data:null;
  }catch(e){return null}
}
async function qrFromCrop(cv,H,qr,smm){
  try{
    if(!qr||typeof jsQR!=='function')return null;
    const c=[H(qr.x,qr.y),H(qr.x+qr.size,qr.y),H(qr.x+qr.size,qr.y+qr.size),H(qr.x,qr.y+qr.size)];
    const margin=qr.size*0.08;
    const x0=Math.min(c[0].x,c[3].x)-margin*smm, x1=Math.max(c[1].x,c[2].x)+margin*smm;
    const y0=Math.min(c[0].y,c[1].y)-margin*smm, y1=Math.max(c[3].y,c[2].y)+margin*smm;
    const wpx=x1-x0,hpx=y1-y0;
    if(wpx<50||hpx<50||x0<-10||y0<-10||x1>cv.width+10||y1>cv.height+10)return null;
    const outW=Math.min(560,Math.max(320,Math.round(wpx*3)));
    const outH=Math.round(outW*hpx/wpx);
    const oc=document.createElement('canvas');oc.width=outW;oc.height=outH;
    const octx=oc.getContext('2d');
    octx.imageSmoothingEnabled=true;
    if(octx.imageSmoothingQuality)octx.imageSmoothingQuality='high';
    octx.drawImage(cv,x0,y0,wpx,hpx,0,0,outW,outH);
    const d=octx.getImageData(0,0,outW,outH);
    const r=jsQR(d.data,outW,outH);
    return r&&r.data?r.data:null;
  }catch(e){return null}
}

/* ---------- 透视/梯形切块（主观题裁剪用，双线性逆映射） ---------- */
function dist(a,b){const dx=a.x-b.x,dy=a.y-b.y;return Math.sqrt(dx*dx+dy*dy)}
function cropQuad(cv,corners,outW,outH){
  const c=corners;
  const wpx=(dist(c[0],c[1])+dist(c[2],c[3]))/2;
  const hpx=(dist(c[0],c[3])+dist(c[1],c[2]))/2;
  outW=outW||Math.round(wpx);outH=outH||Math.round(hpx);
  const oc=document.createElement('canvas');oc.width=outW;oc.height=outH;
  const octx=oc.getContext('2d');
  const ictx=cv.getContext('2d');
  const img=ictx.getImageData(0,0,cv.width,cv.height);
  const d=img.data,sw=cv.width,sh=cv.height;
  const od=octx.createImageData(outW,outH);
  const o=od.data;
  for(let vy=0;vy<outH;vy++){
    const v=vy/(outH-1||1);
    for(let ux=0;ux<outW;ux++){
      const u=ux/(outW-1||1);
      const px2=(1-v)*((1-u)*c[0].x+u*c[1].x)+v*((1-u)*c[3].x+u*c[2].x);
      const py2=(1-v)*((1-u)*c[0].y+u*c[1].y)+v*((1-u)*c[3].y+u*c[2].y);
      const sx2=Math.round(px2),sy2=Math.round(py2);
      const si=(sy2*sw+sx2)*4;
      const oi=(vy*outW+ux)*4;
      if(sx2>=0&&sx2<sw&&sy2>=0&&sy2<sh){
        o[oi]=d[si];o[oi+1]=d[si+1];o[oi+2]=d[si+2];o[oi+3]=255;
      }else{o[oi]=255;o[oi+1]=255;o[oi+2]=255;o[oi+3]=255;}
    }
  }
  octx.putImageData(od,0,0);
  return oc;
}
function canvasToJpeg(cv,q){
  return new Promise(function(res){
    try{cv.toBlob(function(b){res(b)},'image/jpeg',q||0.88)}catch(e){res(null)}
  });
}
function canvasToThumb(cv,maxW){
  const sc=Math.min(1,maxW/(cv.width||1));
  const oc=document.createElement('canvas');
  oc.width=Math.max(1,Math.round(cv.width*sc));
  oc.height=Math.max(1,Math.round(cv.height*sc));
  oc.getContext('2d').drawImage(cv,0,0,oc.width,oc.height);
  return oc;
}
function canvasDataURL(cv,q){
  const cnv=document.createElement('canvas');
  cnv.width=cv.width;cnv.height=cv.height;
  cnv.getContext('2d').drawImage(cv,0,0);
  return cnv.toDataURL('image/jpeg',q||0.85);
}
/* Blob 对象 URL 缓存（复用同一 Blob，避免每次渲染重复 createObjectURL 泄漏） */
const __blobUrls=new WeakMap();
function blobURL(b){
  if(!b)return '';
  let u=__blobUrls.get(b);
  if(!u){u=URL.createObjectURL(b);__blobUrls.set(b,u);}
  return u;
}

/* ---------- 单页识别 ---------- */
async function recognizeCanvas(cv,layout,pageIdx,opts){
  opts=opts||{};
  const page=layout.pages[pageIdx];
  const sX=cv.width/page.w,sY=cv.height/page.h;
  const smm=(sX+sY)/2;
  const gray=toGray(cv);
  const bin=binarize(gray.gray,gray.w,gray.h,omr.k,omr.win);
  const flags=[];
  let qrData=null,qrFound=false,layoutSlice=null;
  /* 尝试读取二维码（先整页后裁剪） */
  const qrRaw=qrFromCanvas(cv);
  if(qrRaw){try{layoutSlice=await qrParsePayload(qrRaw);qrFound=true}catch(e){}}
  if(layoutSlice&&layoutSlice.minimal){
    try{
      const mtpl=await dbGet('templates',layoutSlice.tplId);
      if(mtpl){
        const ml=layoutTemplate(mtpl);
        layoutSlice=ml.pages[Math.min(pageIdx,ml.pages.length-1)];
      }else layoutSlice=null;
    }catch(e){layoutSlice=null}
  }
  /* 锚点检测：先全局搜索四角（兼容照片背景/未充满画面/倾斜），再用预期位置窗口兜底 */
  const geometry=layoutSlice||page;
  let detGlobal=null;
  try{detGlobal=detectAnchorsGlobal(bin,cv.width,cv.height)}catch(e){}
  let det=null,pts=null,usedSmall=false,globalUsed=false;
  if(detGlobal){
    pts=detGlobal.pts;
    globalUsed=true;
  }else{
    det=detectAnchors(bin,cv.width,cv.height,geometry,sX,sY);
    pts=det?det.pts:null;
  }
  if(!pts)pts=[null,null,null,null];
  const detWarn=det?det.warn:[];
  if(pts.filter(function(p){return p}).length<4){
    /* 用两个小锚 + 两点外推补角 */
    let haveB=pts.map(function(p){return !!p});
    const small=det.small;
    if((haveB[0]===false||haveB[3]===false)&&small[0]){pts[0]=pts[0]||small[0];pts[3]=pts[3]||small[0];usedSmall=true;}
    if((haveB[1]===false||haveB[2]===false)&&small[1]){pts[1]=pts[1]||small[1];pts[2]=pts[2]||small[1];usedSmall=true;}
  }
  let okCount=pts.filter(function(p){return p}).length;
  if(okCount<4){return {ok:false,status:'locate_fail',flags:['定位失败：锚点不足('+okCount+'/4)（照片请平正拍摄、四角完整可见）'],warn:detWarn}}
  /* 手动锚点覆盖 */
  if(opts.manualPts){
    pts=opts.manualPts.slice(0,4);
    flags.push(usedSmall?'以小锚辅助定位':null);
  }
  const srcPts=geometry.anchors.slice(0,4).map(function(a){return {x:a.x+a.s/2,y:a.y+a.s/2}});
  const H=solveHomo(srcPts,pts.map(function(p){return {x:p.x,y:p.y}}));
  /* 小锚残差校验（全局匹配下跳过） */
  const smallRef=det?det.small:[null,null];
  if(!globalUsed&&geometry.anchors[4]&&geometry.anchors[5]&&smallRef[0]&&smallRef[1]){
    const e1=H(geometry.anchors[4].x+geometry.anchors[4].s/2,geometry.anchors[4].y+geometry.anchors[4].s/2);
    const e2=H(geometry.anchors[5].x+geometry.anchors[5].s/2,geometry.anchors[5].y+geometry.anchors[5].s/2);
    const d1=Math.sqrt((e1.x-smallRef[0].x)*(e1.x-smallRef[0].x)+(e1.y-smallRef[0].y)*(e1.y-smallRef[0].y))/smm;
    const d2=Math.sqrt((e2.x-smallRef[1].x)*(e2.x-smallRef[1].x)+(e2.y-smallRef[1].y)*(e2.y-smallRef[1].y))/smm;
    if(d1>1.8||d2>1.8)flags.push('版式异常：小锚残差'+d1.toFixed(2)+'/'+d2.toFixed(2)+'mm（建议重扫）');
  }
  /* 裁剪二维码增强识别 */
  if(!qrFound){
    const cropData=await qrFromCrop(cv,H,geometry.qr||page.qr,smm);
    if(cropData){try{layoutSlice=await qrParsePayload(cropData);qrFound=true}catch(e){}}
  }
  const pg2=layoutSlice||page;
  const reg=pg2.reg||null;
  const regDigitsN=(pg2.regDigits!=null)?pg2.regDigits:page.regDigits;
  /* 考号识别（含同步条行校正；无考号区页面跳过并向组装阶段沿用上一页考号） */
  let studentNo='',regFlags=[],regPts=[],regDBG={marks:null,deltas:null,expY:null,tx:0};
  if(!reg){
    regFlags=['本页无考号区'];
  }
  for(let c=0;reg&&c<regDigitsN;c++){
    const cx=reg.x+c*reg.colW;
    const timingX=cx+reg.colW+0.7;
    const expMarks=reg.rowsY.map(function(ry){return H(timingX,ry)});
    const marks=detectRowMarks(bin,cv.width,cv.height,expMarks,smm);
    const deltas=rowDeltas(marks,expMarks.map(function(m){return m.y}));
    if(c===0){regDBG={marks:marks,deltas:deltas,expY:expMarks.map(function(m){return m.y}),tx:timingX};}
    const inks=[];
    for(let dg=0;dg<10;dg++){
      const bxmm=reg.x+c*reg.colW+(reg.colW-reg.bubble)/2+reg.bubble/2;
      const p=H(bxmm,reg.rowsY[dg]);
      const ink=inkRatio(bin,cv.width,cv.height,p.x,p.y+deltas[dg],Math.max(2,reg.bubble/2*smm*0.8));
      inks.push({c:String(dg),ink:ink});
    }
    const j=judgeDigit(inks,omr.inkHigh,omr.inkLow);
    regPts.push({c:c,j:j,inks:inks});
    if(j.ok)studentNo+=j.digit;
    else{studentNo+=j.reason==='空白'?'_':'?';regFlags.push('考号第'+(c+1)+'位'+j.reason);}
  }
  if(!studentNo||studentNo.indexOf('_')>=0||studentNo.indexOf('?')>=0)regFlags.push('考号异常（'+studentNo+'）');
  /* 考号人工改判覆盖 */
  if(opts&&opts.regOverride){
    studentNo=String(opts.regOverride).trim();
    regFlags=['考号经人工改判为 '+studentNo];
  }
  /* 客观题 OMR */
  const perQ=[];
  pg2.groups.forEach(function(g){
    const gx0=g.x0,gid=g.label;
    const expTiming=gx0-2.2;
    const expMarks=[];
    for(let r=0;r<g.rows;r++)expMarks.push(H(expTiming,g.y0+2.5+r*g.dy));
    const marks=detectRowMarks(bin,cv.width,cv.height,expMarks,smm);
    let miss=marks.filter(function(m){return m===null}).length;
    if(miss>=Math.max(2,g.rows*0.4))flags.push(gid+'同步条缺失'+miss+'条');
    const deltas=rowDeltas(marks,expMarks.map(function(m){return m.y}));
    for(let rr=0;rr<g.rows;rr++){
      for(let c=0;c<g.cols;c++){
        const qn=g.first+c*g.rows+rr;
        if(qn>g.first+g.count-1)continue;
        const rowYmm=g.y0+2.5+rr*g.dy;
        if(deltas[rr]===null)continue;
        const inks=[];
        for(let ch=0;ch<g.choices;ch++){
          const bxmm=g.x0+c*g.dxq+9+ch*g.dxc+g.size[0]/2;
          const p=H(bxmm,rowYmm);
          const ink=inkRatio(bin,cv.width,cv.height,p.x,p.y+deltas[rr],Math.max(2,g.size[0]/2*smm*0.8));
          inks.push({c:String.fromCharCode(65+ch),ink:ink});
        }
        const j=judgeQuestion(inks,omr.inkHigh,omr.inkLow);
        perQ.push({qno:qn,choice:j.choice,verdict:j.verdict,
          inks:inks.map(function(x){return Math.round(x.ink*100)/100})});
      }
    }
  });
  /* 主观题切割 */
  const crops=[];
  for(const sb of pg2.subjective){
    const pad=1.2;
    const corners=[H(sb.x-pad,sb.y-pad),H(sb.x+sb.w+pad,sb.y-pad),H(sb.x+sb.w+pad,sb.y+sb.h+pad),H(sb.x-pad,sb.y+sb.h+pad)];
    const wmm=dist(corners[0],corners[1])/smm;
    const outW=Math.round(Math.min(1300,Math.max(420,wmm*10.5)));
    const cc=cropQuad(cv,corners,outW,0);
    crops.push({qno:sb.qno,part:sb.part||0,score:sb.score,cv:cc});
  }
  return {ok:true,status:'ok',H:H,geometry:pg2,sX:sX,sY:sY,smm:smm,
    qrFound:qrFound,qrLayout:!!layoutSlice,
    studentNo:studentNo,regFlags:regFlags,regPts:regPts,perQ:perQ,crops:crops,flags:flags,warn:detWarn,globalAnchors:globalUsed,
    dbg:{regMarks:regDBG&&regDBG.marks,regDeltas:regDBG&&regDBG.deltas,regExpY:regDBG&&regDBG.expY,anchorPts:pts,timingX0:regDBG&&regDBG.tx}};
}

/* ---------- 扫描主流程（上传文件或模拟） ---------- */
async function scanExamPages(exam,files,onProgress){
  const tpl=await dbGet('templates',exam.templateId);
  if(!tpl)throw new Error('模板不存在');
  const layout=layoutTemplate(tpl);
  const items=await filesToCanvases(files,2200);
  const results=[];
  let idx=0,lastNo='';
  for(const it of items){
    const pageIdx=Math.min(layout.pages.length-1,(it.pageNo||1)-1);
    let res;
    try{res=await recognizeCanvas(it.cv,layout,pageIdx,{})}
    catch(err){
      results.push({id:uid('pg_'),examId:exam.id,studentNo:'',pageNo:it.pageNo,blob:null,thumb:'',
        meta:{status:'error',qrFound:false,flags:['图像解析异常：'+(err.message||String(err))],perQ:[],regFlags:[],
          layoutW:layout.w,layoutH:layout.h,pageIdx:pageIdx,srcFile:it.file||''}});
      if(onProgress)onProgress(++idx,items.length,it);
      continue;
    }
    const blob=await canvasToJpeg(it.cv,0.88);
    /* 无考号区页面：沿用本批上一识别页的考号（页序即学生分组） */
    if(!res.studentNo&&lastNo)res.studentNo=lastNo;
    if(res.studentNo)lastNo=res.studentNo;
    const pageRec={id:uid('pg_'),examId:exam.id,studentNo:res.studentNo||'',pageNo:it.pageNo,
      blob:blob,thumb:canvasDataURL(canvasToThumb(it.cv,220),0.7),
      meta:{status:res.status,qrFound:res.qrFound,flags:res.flags.concat(res.regFlags),
        perQ:res.perQ,regFlags:res.regFlags,regPts:res.regPts,layoutW:layout.w,layoutH:layout.h,pageIdx:pageIdx,
        H:res.H?res.H.h:null,srcFile:it.file||''}};
    await dbPut('pages',pageRec);
    /* 主观题裁剪入库 */
    if(res.crops){
      for(const cp of res.crops){
        const cid=exam.id+'|'+res.studentNo+'|'+cp.qno+'|'+cp.part;
        const blob2=await canvasToJpeg(cp.cv,0.85);
        const old=await dbGet('crops',cid);
        await dbPut('crops',{id:cid,examId:exam.id,exam_q:exam.id+'|'+cp.qno,pageId:pageRec.id,
          studentNo:res.studentNo,qno:cp.qno,part:cp.part,score:cp.score,
          blob:blob2,thumb:canvasDataURL(canvasToThumb(cp.cv,160),0.7),
          scoreVal:old&&old.scoreVal!=null?old.scoreVal:null,aiScore:old&&old.aiScore!=null?old.aiScore:null,
          aiReason:old&&old.aiReason||'',marked:old&&old.marked||null,markedBy:old&&old.markedBy||'',flag:old&&old.flag||''});
      }
    }
    results.push(pageRec);
    idx++;
    if(onProgress)onProgress(idx,items.length,it);
  }
  return results;
}

/* ---------- 考试数据汇总 ---------- */
async function examData(examId){
  const exam=await dbGet('exams',examId);
  const pages=await dbByIdx('pages','byExam',examId);
  const cropsAll=await dbAll('crops');
  const crops=cropsAll.filter(function(c){return c.examId===examId});
  const revsAll=await dbAll('revs');
  const revs=revsAll.filter(function(r){return r.examId===examId});
  const students=exam?await dbByIdx('students','byClass',exam.classId):[];
  return {exam:exam,pages:pages,crops:crops,revs:revs,students:students};
}
async function examMeta(exam){
  if(!exam)return null;
  const tpl=await dbGet('templates',exam.templateId);
  if(!tpl)return null;
  const layout=layoutTemplate(tpl);
  const choiceQnos=[];
  const subjList=[];
  const seen={};
  layout.pages.forEach(function(p){
    p.groups.forEach(function(g){
      for(let q=g.first;q<g.first+g.count;q++)choiceQnos.push(q);
    });
    p.subjective.forEach(function(sb){
      if(!seen[sb.qno]){seen[sb.qno]=true;subjList.push({qno:sb.qno,score:sb.score,type:sb.type,parts:[]});}
      subjList.find(function(s){return s.qno===sb.qno}).parts.push({pi:p.footer.n-1,part:sb.part,rows:sb.rows});
    });
  });
  return {tpl:tpl,layout:layout,choiceQnos:choiceQnos,subjList:subjList};
}
async function examReviewCount(examId){
  const {exam,pages,revs}=await examData(examId);
  const items={locate:[],reg:[],q:[]};
  pages.forEach(function(p){
    const m=p.meta||{};
    if(m.status!=='ok')items.locate.push(p);
    const flags=(m.flags||[]).join('|');
    if(flags.indexOf('考号异常')>=0)items.reg.push(p);
    if(m.status==='ok'&&m.perQ){
      (m.perQ).forEach(function(q){
        const ov=revs.find(function(r){return r.studentNo===p.studentNo&&r.qno===q.qno&&r.type==='q'});
        if(!ov&&q.verdict==='REVIEW')items.q.push({studentNo:p.studentNo,qno:q.qno,inks:q.inks});
      });
    }
  });
  return items;
}
async function examStatusLabel(examId){
  const {exam,pages}=await examData(examId);
  if(!exam)return {badge:badge('gray','—'),label:'—'};
  const rev=await examReviewCount(examId);
  const meta=await examMeta(exam);
  let gradDone=0,gradTotal=0;
  if(meta){
    for(const sq of meta.subjList){
      const crops=(await dbByIdx('crops','byExamQ',examId+'|'+sq.qno)).filter(function(c){return c.scoreVal!=null});
      gradTotal=gradTotal+1;
      if(crops.length)gradDone=gradDone+1;
    }
  }
  if(!pages.length)return {badge:badge('warn','待扫描'),label:'尚未扫描'};
  if(rev.locate.length||rev.reg.length||rev.q.length)return {badge:badge('err','待复核 '+(rev.locate.length+rev.reg.length+rev.q.length)),label:'有项目待复核，先在「扫描识别」处理'};
  if(meta&&meta.subjList.length&&gradDone<gradTotal)return {badge:badge('info','阅卷中'),label:'主观题待阅'};
  return {badge:badge('ok','已完成'),label:'考试已完成'};
}

/* 文件输入统一在渲染时绑定 */
function bindFileInput(id,fn){
  const f=$(id);
  if(f&&!f.dataset.bound){
    f.dataset.bound='1';
    f.addEventListener('change',function(){
      /* 立即快照文件后再清空，避免 FileList（活对象）被清空后变 0 */
      if(f.files&&f.files.length){
        var snap=Array.prototype.slice.call(f.files||[]);
        fn(snap,f);
      }
      f.value='';
    });
  }
}

async function importStudentsExcel(file,classId){
  try{
    const buf=await file.arrayBuffer();
    const wb=XLSX.read(buf,{type:'array'});
    const ws=wb.Sheets[wb.SheetNames[0]];
    const rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:''});
    let added=0;
    for(let i=0;i<rows.length;i++){
      const r=rows[i];
      if(i===0&&(/姓名|考号/.test(String(r[0]||'')+String(r[1]||''))))continue;
      const no=String(r[1]==null?'':r[1]).trim();
      const name=String(r[0]==null?'':r[0]).trim();
      const note=String(r[2]==null?'':r[2]).trim();
      if(!name&&!no)continue;
      if(!name)continue;
      await dbPut('students',{id:uid('stu_'),classId:classId,no:no,name:name,note:note});
      added++;
    }
    toast('Excel 导入 '+added+' 名学生','ok');
    renderCls();
  }catch(err){toast('Excel 导入失败：'+err.message,'err')}
}

  }else if(wiz.step===2){
    const answers=wiz.answers;

Object.assign(ACTS,{
  'wiz-cancel':function(){wiz=null;dlgClose();renderExam()},
  'wiz-next':function(){wiz.step++;wizRender()},
  'wiz-prev':function(){wiz.step--;wizRender()},
  'wiz-ans':async function(el){
    const qn=el.dataset.q;
    const v=el.dataset.v;
    const cur=wiz.answers[qn]||'';
    if(cur===v)delete wiz.answers[qn];
    else wiz.answers[qn]=v;
    const cell=el.closest('.qcell');
    if(cell){
      cell.querySelectorAll('.opt').forEach(function(o){
        o.classList.toggle('on',wiz.answers[qn]===o.dataset.v);
      });
    }
  },
  'wiz-sub':function(el){
    const q=el.dataset.q;
    const f=el.dataset.f;
    if(!wiz.subjective[q])wiz.subjective[q]={score:0,points:'',answer:''};
    wiz.subjective[q][f]=f==='score'?(parseFloat(el.value)||0):el.value;
  },
  'wiz-save':async function(){
    if(!wiz.name.trim()){toast('请填写考试名称','err');return}
    const ex=wiz.examId?await dbGet('exams',wiz.examId):null;
    const classes=await dbAll('classes');
    const tpls=await dbAll('templates');
    const cls=classes.find(function(c){return c.id===wiz.classId});
    const tpl=tpls.find(function(t){return t.id===wiz.templateId});
    const ansN=Object.keys(wiz.answers).length;
    const meta=await examMeta({templateId:wiz.templateId});
    if(ansN<meta.choiceQnos.length){
      const ok=await dlgConfirm('答案未录完','客观题共 '+meta.choiceQnos.length+' 题，当前只录了 '+ansN+' 题。<br>未录答案的题目将判为「错/空白」，确定继续保存？','仍要保存');
      if(!ok)return;
    }
    const rec=ex||{id:uid('exm_')};
    rec.name=wiz.name.trim();
    rec.classId=wiz.classId;
    rec.className=cls?cls.name:'';
    rec.templateId=wiz.templateId;
    rec.templateName=tpl?tpl.name:'';
    rec.perScore=wiz.perScore||meta.layout.perScore||2;
    rec.answers=wiz.answers;
    rec.subjective=wiz.subjective;
    rec.createdAt=ex?ex.createdAt:today();
    await dbPut('exams',rec);
    wiz=null;
    dlgClose();
    toast('考试已保存','ok');
    renderExam();
  }
});

/* 上传文件绑定由 renderScan 内的 afterRender 完成 */
async function runScanUpload(files){
  if(scanCtx&&scanCtx.running){toast('正在扫描/识别中，请稍候','err');return}
  const ex=await dbGet('exams',ui.scanExam);
  const ok=await dlgConfirm('开始识别','将扫描/识别 '+files.length+' 个文件（'+pagesEst(files)+' 页）。识别结果与现有页面共存，同页可删除重扫。','开始');
  if(!ok)return;
  const box=$('scanProgBox');
  box.style.display='block';
  scanCtx={examId:ex.id,running:true,onProgress:function(done,total,it){
    $('scanProgBar').style.width=Math.round(done/total*100)+'%';
    $('scanProgTxt').textContent='识别中 '+done+'/'+total;
  }};
  try{
    const res=await scanExamPages(ex,files,function(done,total){
      $('scanProgBar').style.width=Math.round(done/total*100)+'%';
      $('scanProgTxt').textContent='识别中 '+done+'/'+total;
    });
    toast('识别完成：'+res.length+' 页','ok');
  }catch(err){toast('识别失败：'+err.message,'err')}
  box.style.display='none';
  scanCtx.running=false;
  renderScan();
}
function pagesEst(files){
  let n=0;
  for(const f of Array.from(files)){
    if(f.type==='application/pdf'||/\.pdf$/i.test(f.name||''))n+=3;
    else n+=1;
  }
  return n;
}

/* 重识别单页：更新 page 记录 + 重建该页主观题裁剪 */
async function redoPage(p,cv,layout,opts){
  const res=await recognizeCanvas(cv,layout,p.meta.pageIdx||0,opts);
  if(!res.studentNo&&p.studentNo){res.studentNo=p.studentNo;res.regFlags=['沿用考号 '+p.studentNo];}
  const blob=await canvasToJpeg(cv,0.88);
  const oldNo=p.studentNo;
  p.studentNo=res.studentNo||'';
  p.blob=p.blob;
  p.meta={status:res.status,qrFound:res.qrFound,flags:res.flags.concat(res.regFlags),
    perQ:res.perQ,regFlags:res.regFlags,regPts:res.regPts,layoutW:res.geometry.w,layoutH:res.geometry.h,
    pageIdx:p.meta.pageIdx,srcFile:p.meta.srcFile||'重新识别',H:res.H?res.H.h:null};
  await dbPut('pages',p);
  /* 删除该页旧裁剪（按 pageId 级联，覆盖主观题多部分） */
  const crops=await dbAll('crops');
  for(const c of crops){
    if(c.examId===p.examId&&c.pageId===p.id)await dbDel('crops',c.id);
  }
  /* 新裁剪 */
  if(res.crops)for(const cp of res.crops){
    const cid=p.examId+'|'+res.studentNo+'|'+cp.qno+'|'+cp.part;
    const old=await dbGet('crops',cid);
    await dbPut('crops',{id:cid,examId:p.examId,exam_q:p.examId+'|'+cp.qno,pageId:p.id,studentNo:res.studentNo,
      qno:cp.qno,part:cp.part,score:cp.score,blob:await canvasToJpeg(cp.cv,0.85),
      thumb:canvasDataURL(canvasToThumb(cp.cv,160),0.7),
      scoreVal:old&&old.scoreVal!=null?old.scoreVal:null,aiScore:old&&old.aiScore!=null?old.aiScore:null,
      aiReason:old&&old.aiReason||'',marked:old&&old.marked||null,markedBy:old&&old.markedBy||'',flag:old&&old.flag||''});
  }
  return res;
}

          +'<div class="kv">已阅 '+done+' / '+total+' 份　·　平均分 '+avg.toFixed(1)+'</div>'
          +'</div>'
          +'<div style="width:160px"><div class="progress"><div style="width:'+(total?Math.round(done/total*100):0)+'%"></div></div></div>'
          +'<button class="btn btn-s btn-p" data-act="grade-open-q" data-q="'+esc(String(sq.qno))+'">开始阅卷</button>'

  }
  await renderGradeView(ex);
}

function gradeShuffle(){

async function cropMarkedImage(crop,w){
  try{
    const img=await createImageBitmap(crop.blob);
    const cv=document.createElement('canvas');cv.width=img.width;cv.height=img.height;
    const ctx=cv.getContext('2d');ctx.drawImage(img,0,0);
    const fs=Math.max(28,Math.round(img.width*0.075));
    const txt=String(w)+'/'+crop.score;
    ctx.font='bold '+fs+'px Arial,sans-serif';
    const tw=ctx.measureText(txt).width;
    const pad=fs*0.7;
    const bx=cv.width-tw-pad*2-14,by=cv.height-fs-pad*2-12;
    ctx.fillStyle='rgba(20,25,32,.78)';
    ctx.beginPath();
    if(ctx.roundRect)ctx.roundRect(bx,by,tw+pad*2,fs+pad*1.2,10);else ctx.rect(bx,by,tw+pad*2,fs+pad*1.2);
    ctx.fill();
    ctx.fillStyle='#fff';
    ctx.textBaseline='middle';ctx.textAlign='left';
    ctx.fillText(txt,bx+pad,by+(fs+pad*1.2)/2);
    return await canvasToJpeg(cv,0.85);
  }catch(e){return null}
}

/* ============================================================
   第六段(2)：成绩计算 / 分析图表 / 导出
   ============================================================ */
async function computeScorebook(examId){
  const {exam,pages,crops,revs,students}=await examData(examId);
  if(!exam)return null;
  const meta=await examMeta(exam);
  if(!meta)return {error:'模板不存在或已删除，无法计算成绩',exam:exam,meta:null,rows:[],perQStat:{},perScore:0};
  const perScore=exam.perScore||meta.layout.perScore||2;
  const byNo={};
  pages.forEach(function(p){
    const no=p.studentNo||'(未识别)';
    if(!byNo[no])byNo[no]={pages:[],perQ:{}};
    byNo[no].pages.push(p);
    (p.meta&&p.meta.perQ||[]).forEach(function(q){
      const cur=byNo[no].perQ[q.qno];
      if(!cur)byNo[no].perQ[q.qno]=q;
      else if(cur.verdict==='REVIEW'&&q.verdict!=='REVIEW')byNo[no].perQ[q.qno]=q;
    });
  });
  const studentByNo={};
  students.forEach(function(s){studentByNo[String(s.no)]=s});
  const noSet={};
  students.forEach(function(s){noSet[String(s.no)]=true});
  Object.keys(byNo).forEach(function(no){if(byNo[no]&&byNo[no].pages.length)noSet[no]=true});
  const rows=[];
  Object.keys(noSet).forEach(function(no){
    const st=studentByNo[no];
    const src=byNo[no];
    const absent=!src||!src.pages.length;
    const obj={};let objScore=0;
    meta.choiceQnos.forEach(function(qn){
      const q=(src&&src.perQ[qn])||{verdict:'NOREC'};
      const ov=revs.find(function(r){return r.studentNo===no&&r.qno===qn&&r.type==='q'});
      const verdict=ov?ov.verdict:q.verdict;
      const choice=ov?ov.choice:q.choice;
      let tf;
      if(verdict==='OK'){
        const ans=String((exam.answers||{})[qn]!=null?(exam.answers[qn]):'').toUpperCase();
        tf=choice===ans?'RIGHT':'WRONG';
      }else tf=verdict;
      if(tf==='RIGHT')objScore+=perScore;
      obj[qn]={verdict:tf,choice:choice};
    });
    const subj={};let subjScore=0,subjGraded=0;
    meta.subjList.forEach(function(sq){
      const cs=crops.filter(function(c){return c.studentNo===no&&String(c.qno)===String(sq.qno)}).sort(function(a,b){return a.part-b.part});
      const score=cs.length?cs[0].scoreVal:null;
      subj[sq.qno]={score:score,full:sq.score,ai:cs.length?cs[0].aiScore:null,marked:cs.length?cs[0].marked:null};
      if(score!=null){subjScore+=score;subjGraded++;}
    });
    rows.push({no:no,name:st?st.name:'（未匹配名单）',note:st?st.note:'',absent:absent,
      obj:obj,objScore:objScore,subj:subj,subjScore:subjScore,subjGraded:subjGraded,
      total:objScore+subjScore});
  });
  rows.sort(function(a,b){return (b.total-a.total)||String(a.no).localeCompare(String(b.no))});
  rows.forEach(function(r,i){r.rank=i+1});
  const perQStat={};
  meta.choiceQnos.forEach(function(qn){
    const s={ok:0,wrong:0,blank:0,multi:0,review:0,norec:0,n:0,rate:0,dist:{}};
    rows.forEach(function(r){
      const v=r.obj[qn];
      if(!v)return;
      s.n++;
      if(v.verdict==='RIGHT')s.ok++;
      else if(v.verdict==='WRONG'){s.wrong++;const c=v.choice||'?';s.dist[c]=(s.dist[c]||0)+1;}
      else if(v.verdict==='BLANK')s.blank++;
      else if(v.verdict==='MULTI')s.multi++;
      else if(v.verdict==='REVIEW')s.review++;
      else s.norec++;
    });
    s.rate=s.n?s.ok/s.n:0;
    perQStat[qn]=s;
  });
  return {exam:exam,meta:meta,rows:rows,perQStat:perQStat,perScore:perScore};
}

  meta.choiceQnos.forEach(function(qn){

function max0(book){
  let t=0;
  book.meta.subjList.forEach(function(s){t+=s.score});
  return t+book.meta.choiceQnos.length*book.perScore;
}
function drawTotalHist(full,rows){
  const cv=$('totalHist');
  if(!cv)return;
  const w=cv.width=cv.clientWidth||560,h=cv.height=150;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const bins=12,data=new Array(bins).fill(0);
  rows.forEach(function(r){
    if(r.absent)return;
    const b=Math.min(bins-1,Math.floor(r.total/Math.max(1,full)*bins));
    data[b]++;
  });
  const maxC=Math.max(1,Math.max.apply(null,data));
  const bw=w/bins*0.7;
  ctx.fillStyle='#33507A';
  data.forEach(function(c,i){
    const x=i*(w/bins)+(w/bins-bw)/2;
    const bh=c/maxC*(h-36);
    ctx.fillRect(x,h-26-bh,bw,bh);
    ctx.fillStyle='#5A4E3C';ctx.font='10px sans-serif';ctx.textAlign='center';
    ctx.fillText(Math.round((i+0.5)/bins*full),x+bw/2,h-12);
  });
  ctx.fillStyle='#999';ctx.font='11px sans-serif';ctx.textAlign='left';
  ctx.fillText('总分分布（横轴=分数段）',6,14);
}
function drawPassDonut(full,rows){
  const cv=$('passDonut');
  if(!cv)return;
  const w=cv.width=cv.clientWidth<260?260:cv.clientWidth,h=cv.height=150;
  const ctx=cv.getContext('2d');
  ctx.clearRect(0,0,w,h);
  const good=rows.filter(function(r){return !r.absent&&r.total>=full*0.8}).length;
  const well=rows.filter(function(r){return !r.absent&&r.total>=full*0.7&&r.total<full*0.8}).length;
  const pass=rows.filter(function(r){return !r.absent&&r.total>=full*0.6&&r.total<full*0.7}).length;
  const fail=rows.filter(function(r){return !r.absent&&r.total<full*0.6}).length;
  const total=good+well+pass+fail;
  if(!total){ctx.fillStyle='#999';ctx.font='13px sans-serif';ctx.textAlign='center';ctx.fillText('暂无成绩',w/2,h/2);return}
  const cx=w/2,cy=h/2,R=Math.min(w,h)/2-12;
  const segs=[[good,'#1F8A70'],[well,'#33507A'],[pass,'#B8860B'],[fail,'#B8B2A6']];
  let a=-Math.PI/2;
  segs.forEach(function(sg){
    const frac=sg[0]/total;
    ctx.beginPath();
    ctx.moveTo(cx,cy);
    ctx.arc(cx,cy,R,a,a+frac*Math.PI*2);
    ctx.fillStyle=sg[1];
    ctx.fill();
    a+=frac*Math.PI*2;
  });
  ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(cx,cy,R*0.58,0,Math.PI*2);ctx.fill();
