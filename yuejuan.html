<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!--category:教育-->
<title>智能阅卷</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --zhu:#A93226;--zhu2:#C0392B;--zhu3:#7B241C;
  --bg:#F6F4EF;--card:#FFFFFF;--txt:#2C3E50;--txt2:#6B7A8C;
  --line:#E5E0D8;--gold:#B8860B;--green:#1F8A70;--blue:#33507A;--purple:#7A4E9E;
  --warn:#B45309;--danger:#B8453A;
}
html,body{font-family:"Noto Sans SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--txt);height:100%;font-size:14px}
.sj-app{display:flex;min-height:100vh}
/* ===== 侧栏 ===== */
.sj-side{width:200px;background:linear-gradient(180deg,#26303F,#1B2430);color:#fff;position:fixed;top:0;bottom:0;left:0;display:flex;flex-direction:column;z-index:50}
.sj-logo{padding:20px 16px 14px;font-size:17px;font-weight:700;letter-spacing:1px;border-bottom:1px solid rgba(255,255,255,.08)}
.sj-logo b{color:#E6A23C}
.sj-nav{flex:1;padding:10px 8px;overflow-y:auto}
.sj-nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:9px;cursor:pointer;color:#C8D1DC;font-size:14px;margin-bottom:2px;transition:.18s}
.sj-nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.sj-nav-item.on{background:var(--zhu);color:#fff;box-shadow:0 3px 10px rgba(169,50,38,.4)}
.sj-nav-item .sh{display:none;font-size:13px}
.sj-side-foot{padding:12px 16px;font-size:11px;color:#7F8C9B;line-height:1.6;border-top:1px solid rgba(255,255,255,.08)}
/* ===== 主区 ===== */
.sj-main{flex:1;margin-left:200px;padding:0 26px 40px;min-width:0}
.sj-top{position:sticky;top:0;z-index:40;background:rgba(246,244,239,.92);backdrop-filter:blur(8px);padding:16px 2px 10px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);margin-bottom:18px}
.sj-title{font-size:20px;font-weight:700}
.sj-title small{font-weight:400;color:var(--txt2);font-size:12.5px;margin-left:10px}
.sj-topbtns{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.sj-page{max-width:1180px}
/* ===== 通用 ===== */
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:16px;box-shadow:0 1px 3px rgba(44,62,80,.05)}
.card h3{font-size:15px;margin-bottom:12px;display:flex;align-items:center;gap:8px}
.card h3::before{content:'';width:3px;height:14px;background:var(--zhu);border-radius:2px}
.card .tip{color:var(--txt2);font-size:12.5px;line-height:1.7}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--txt);cursor:pointer;font-size:13.5px;transition:.15s;white-space:nowrap}
.btn:hover{border-color:#C9BFB0;background:#FBF9F5}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn-p{background:var(--zhu);border-color:var(--zhu);color:#fff}
.btn-p:hover{background:var(--zhu2);border-color:var(--zhu2)}
.btn-g{background:var(--green);border-color:var(--green);color:#fff}
.btn-g:hover{background:#187A64}
.btn-b{background:var(--blue);border-color:var(--blue);color:#fff}
.btn-b:hover{background:#2B4467}
.btn-o{background:#fff;border-color:var(--gold);color:var(--gold)}
.btn-d{background:#fff;border-color:#E8C4BE;color:var(--danger)}
.btn-d:hover{background:#FBF1EF}
.btn-s{padding:5px 10px;font-size:12.5px;border-radius:7px}
.btn-sm{padding:4px 9px;font-size:12px;border-radius:6px}
.inp,select.inp,textarea.inp{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;font-size:13.5px;background:#fff;color:var(--txt);outline:none;font-family:inherit}
.inp:focus{border-color:var(--zhu);box-shadow:0 0 0 2px rgba(169,50,38,.08)}
textarea.inp{resize:vertical;line-height:1.6}
label.f-lb{display:block;font-size:12.5px;color:var(--txt2);margin:10px 0 4px}
.f-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:0 14px}
.f-row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
table.tbl th{background:#F4F0E8;color:#5A4E3C;font-weight:600;text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap;position:sticky;top:0}
table.tbl td{padding:8px 10px;border-bottom:1px solid #EFEAE2;vertical-align:middle}
table.tbl tr:hover td{background:#FBF8F3}
.badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:11.5px;font-weight:600}
.bd-ok{background:#E3F2EC;color:#1A6B54}.bd-warn{background:#FCF0DD;color:#9A6110}
.bd-err{background:#FBE7E4;color:#B03A2E}.bd-info{background:#E6EDF7;color:#2B4467}
.bd-gray{background:#EEF0F2;color:#5B6570}.bd-purple{background:#F0E7F8;color:#64348F}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:99px;background:#F4F0E8;border:1px solid var(--line);font-size:12px;color:#5A4E3C;margin:2px 4px 2px 0;cursor:pointer}
.chip.on{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.chip.gray.on{background:#5B6570;border-color:#5B6570}
.kv{font-size:12.5px;color:var(--txt2)}
.kv b{color:var(--txt)}
.empty{padding:36px;text-align:center;color:var(--txt2);font-size:13px}
.empty .big{font-size:34px;margin-bottom:8px}
.progress{width:100%;background:#EDE8DF;border-radius:99px;height:10px;overflow:hidden}
.progress>div{height:100%;background:linear-gradient(90deg,var(--zhu),#E67E22);border-radius:99px;transition:width .2s}
/* ===== 考试卡片 ===== */
.exam-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px}
.exam-card{border:1px solid var(--line);border-radius:12px;background:#fff;padding:15px;display:flex;flex-direction:column;gap:9px;transition:.18s}
.exam-card:hover{box-shadow:0 6px 18px rgba(44,62,80,.09);transform:translateY(-2px)}
.exam-card .t{font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px;justify-content:space-between}
.exam-card .meta{font-size:12.5px;color:var(--txt2);line-height:1.7}
.exam-card .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;padding-top:6px}
/* ===== 统计 ===== */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.stat .n{font-size:24px;font-weight:800;color:var(--zhu)}
.stat .l{font-size:12px;color:var(--txt2);margin-top:2px}
/* ===== 答案录入 ===== */
.qgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px}
.qcell{border:1px solid var(--line);border-radius:9px;padding:7px;background:#FCFAF6}
.qcell .qn{font-size:12px;color:var(--txt2);margin-bottom:5px}
.qcell .opts{display:flex;gap:4px}
.qcell .opt{flex:1;padding:3px 0;text-align:center;border:1px solid var(--line);border-radius:6px;cursor:pointer;background:#fff;font-size:12.5px;font-weight:700;color:#98A5B0}
.qcell .opt.on{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.rev-tog.on{background:var(--zhu);border-color:var(--zhu);color:#fff}
.qcell .opt.dim{opacity:.35}
/* ===== 图表 ===== */
.chart-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;overflow:hidden}
.chart-box .ct{font-size:13px;font-weight:600;margin-bottom:6px;color:#5A4E3C}
/* ===== 阅卷台 ===== */
.gwrap{display:flex;gap:14px;align-items:flex-start}
.gimg{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;background:#fff;padding:10px;text-align:center}
.gimg img{max-width:100%;max-height:70vh;border-radius:6px;cursor:zoom-in}
.gside{width:250px;flex-shrink:0;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px}
.gscore{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:8px 0}
.gscore .gs{padding:8px 0;text-align:center;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-weight:700;font-size:14px;background:#fff}
.gscore .gs:hover{border-color:var(--zhu)}
.gscore .gs.on{background:var(--zhu);color:#fff;border-color:var(--zhu)}
.gscore .gs.dim{opacity:.4}
.gthumbs{display:flex;gap:6px;overflow-x:auto;padding:4px 0}
.gthumbs .gt{flex-shrink:0;border:2px solid transparent;border-radius:8px;cursor:pointer;padding:2px}
.gthumbs .gt.on{border-color:var(--zhu)}
.gthumbs img{width:64px;height:64px;object-fit:cover;border-radius:6px;display:block}
.prog-line{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:12.5px;color:var(--txt2)}
/* ===== 模式框 ===== */
.m-overlay{position:fixed;inset:0;background:rgba(20,25,32,.55);z-index:200;align-items:center;justify-content:center;padding:20px;display:none}
.m-overlay:not([hidden]){display:flex}
.m-box{background:#fff;border-radius:14px;max-width:min(860px,94vw);max-height:92vh;display:flex;flex-direction:column;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.m-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--line)}
.m-title{font-size:16px;font-weight:700}
.m-x{border:none;background:none;font-size:18px;cursor:pointer;color:var(--txt2);padding:4px}
.m-x:hover{color:var(--zhu)}
.m-body{padding:16px 18px;overflow-y:auto}
.m-foot{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
/* ===== 提示 ===== */
.toasts{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);z-index:400;display:flex;flex-direction:column;gap:8px;align-items:center}
.toast{background:#26303F;color:#fff;padding:9px 18px;border-radius:9px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);animation:tin .25s}
.toast.err{background:var(--danger)}.toast.ok{background:var(--green)}
@keyframes tin{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
/* ===== 扫描结果 ===== */
.scan-item{border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;background:#fff;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.scan-item img{width:52px;height:52px;object-fit:cover;border-radius:7px;border:1px solid var(--line)}
/* ===== 预览画布 ===== */
.preview-box{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;justify-content:center;overflow:auto;max-height:75vh}
.preview-box canvas{max-width:100%;height:auto;box-shadow:0 2px 10px rgba(0,0,0,.15);background:#fff}
.marked-badge{position:absolute;right:8px;bottom:8px;background:rgba(20,25,32,.82);color:#fff;padding:4px 12px;border-radius:8px;font-weight:800;font-size:15px}
.tpl-thumb{width:110px;height:auto;border:1px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.review-plot{position:relative;display:inline-block}
/* ===== 响应式 ===== */
@media(max-width:900px){
  .sj-side{width:60px}
  .sj-side .sj-logo span,.sj-nav-item span.tx,.sj-side-foot{display:none}
  .sj-nav-item span.sh{display:inline}
  .sj-nav-item{justify-content:center;padding:12px 4px}
  .sj-main{margin-left:60px;padding:0 10px 30px}
  .gwrap{flex-direction:column}
  .gside{width:100%}
}
</style>
</head>
<body>
<div class="sj-app">
  <aside class="sj-side">
    <div class="sj-logo"><b>智能阅卷</b></div>
    <nav class="sj-nav" id="nav"></nav>
    <div class="sj-side-foot">数据存于本地浏览器<br>请定期在「设置」导出备份<br><span style="color:#E6A23C">名单 → 答题卡 → 考试场次<br>→ 扫描 → 阅卷 → 成绩</span></div>
  </aside>
  <main class="sj-main">
    <header class="sj-top">
      <div class="sj-title" id="pageTitle"></div>
      <div class="sj-topbtns" id="topBtns"></div>
    </header>
    <section class="sj-page" id="page"></section>
  </main>
</div>
<div class="m-overlay" id="mOverlay" hidden><div class="m-box" id="mBox"></div></div>
<div class="toasts" id="toasts"></div>

<script src="./lib/pdf.min.js"></script>
<script>
try{pdfjsLib.GlobalWorkerOptions.workerSrc='./lib/pdf.worker.min.js';}catch(e){}
</script>
<script src="./lib/jspdf.umd.min.js"></script>
<script src="./lib/qrcode.js"></script>
<script src="./lib/jsQR.js"></script>
<script src="./lib/xlsx.full.min.js"></script>
<script>
(function(){
'use strict';
/* ============================================================
   智能阅卷 · 网页版
   依据：答题卡助手 Pro v4.3.0 逆向分析（Apps/阅卷系统技术方案.md）
   功能：答题卡生成/打印PDF → 扫描识别(OMR) → 主观题切割 → 按题阅卷(+AI) → 成绩分析导出
   数据：IndexedDB（本地优先，可导出备份）
   ============================================================ */

/* ---------- 小工具 ---------- */
const $=function(id){return document.getElementById(String(id).replace(/^#/,''))};
const esc=function(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;')};
const uid=function(p){return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,8)};
const sleep=function(ms){return new Promise(function(r){setTimeout(r,ms)})};
const today=function(){const d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())};
const timestamp=function(){const d=new Date(),p=function(n){return String(n).padStart(2,'0')};return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate())+' '+p(d.getHours())+':'+p(d.getMinutes())};
const tsName=function(){const d=new Date(),p=function(n){return String(n).padStart(2,'0')};return ''+d.getFullYear()+p(d.getMonth()+1)+p(d.getDate())+'_'+p(d.getHours())+p(d.getMinutes())};
const now=function(){return Date.now()};
function toast(msg,type){
  const t=document.createElement('div');
  t.className='toast '+(type||'');
  t.textContent=String(msg);
  $('toasts').appendChild(t);
  setTimeout(function(){t.style.opacity='0';t.style.transition='.3s';setTimeout(function(){t.remove()},300)},2600);
}
function download(name,data,mime){
  const blob=data instanceof Blob?data:new Blob([data],{type:mime||'application/octet-stream'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},1500);
}
function copyText(t){
  const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();
  try{document.execCommand('copy');toast('已复制到剪贴板')}catch(e){toast('复制失败','err')}
  ta.remove();
}
function loadJSON(key,sub){
  try{const s=JSON.parse(localStorage.getItem(key)||'null');return sub?(s&&s[sub]!=null?s[sub]:null):(s||null)}catch(e){return null}
}
function saveJSON(key,val){try{localStorage.setItem(key,JSON.stringify(val))}catch(e){}}

/* ---------- 常数 ---------- */
const PAPER={A4:[210,297],A3:[297,420],B4:[257,364],'8K':[260,368]};
const PAPER_NAMES={A4:'A4（210×297mm）',A3:'A3（297×420mm）',B4:'B4（257×364mm）','8K':'8开（260×368mm）'};
const VERDICT_NAMES={RIGHT:'对',WRONG:'错',BLANK:'空白',MULTI:'多涂',REVIEW:'待复核',OK:'已涂'};
const PROVIDERS={
  deepseek:{label:'DeepSeek（视觉）',url:'https://api.deepseek.com/chat/completions',models:['deepseek-v4-flash-vision-exp'],keyUrl:'platform.deepseek.com'},
  doubao:{label:'豆包（火山方舟）',url:'https://ark.cn-beijing.volces.com/api/v3/chat/completions',models:['doubao-seed-1-6-vision-250815','doubao-1-5-vision-pro-32k-250115'],keyUrl:'console.volcengine.com/ark'},
  glm:{label:'GLM（智谱）',url:'https://open.bigmodel.cn/api/paas/v4/chat/completions',models:['glm-4.5v','glm-4v-plus-0111','glm-4v-flash-241112'],keyUrl:'open.bigmodel.cn'},
  custom:{label:'自定义（OpenAI 兼容）',url:'',models:[],keyUrl:'使用支持图片输入的任一 OpenAI 兼容接口'}
};
const IMG_LEVELS={lite:{w:800,q:0.72,label:'省流'},std:{w:900,q:0.82,label:'标准'},hd:{w:1200,q:0.9,label:'高清'}};
const LS_AI='yj_ai',LS_OMR='yj_omr',LS_UI='yj_ui';

function defaultAI(){
  return {provider:'deepseek',keys:{},models:{},customUrl:'',temp:0.35,maxTokens:4096,imgLevel:'std'};
}
function defaultOMR(){
  return {k:0.75,win:15,inkHigh:0.45,inkLow:0.25,sens:'std'};
}
let omr=Object.assign(defaultOMR(),loadJSON(LS_OMR)||{});
let ai=Object.assign(defaultAI(),loadJSON(LS_AI)||{});

/* ---------- 状态 ---------- */
let ui={tab:'home',tplEdit:null,clsCur:null,examCur:null,scanExam:null,scanRun:null,gradeExam:null,gradeQno:null,scoreExam:null};
let scanCtx=null;   // 扫描会话 {examId, total, done, status, logs}

/* ---------- IndexedDB ---------- */
const DB_NAME='yuejuan_db',DB_VER=2;
let db=null;
function openDB(){
  return new Promise(function(res,rej){
    if(db)return res(db);
    const req=indexedDB.open(DB_NAME,DB_VER);
    req.onupgradeneeded=function(ev){
      const d=req.result;
      if(!d.objectStoreNames.contains('classes'))d.createObjectStore('classes',{keyPath:'id'});
      if(!d.objectStoreNames.contains('students')){const s=d.createObjectStore('students',{keyPath:'id'});s.createIndex('byClass','classId');}
      if(!d.objectStoreNames.contains('templates'))d.createObjectStore('templates',{keyPath:'id'});
      if(!d.objectStoreNames.contains('exams'))d.createObjectStore('exams',{keyPath:'id'});
      if(!d.objectStoreNames.contains('pages')){const s=d.createObjectStore('pages',{keyPath:'id'});s.createIndex('byExam','examId');}
      if(!d.objectStoreNames.contains('crops')){const s=d.createObjectStore('crops',{keyPath:'id'});s.createIndex('byExamQ','exam_q');s.createIndex('byExam','examId');}
      else{const s=req.transaction.objectStore('crops');if(!s.indexNames.contains('byExam'))s.createIndex('byExam','examId');}
      if(!d.objectStoreNames.contains('revs')){const s=d.createObjectStore('revs',{keyPath:'id'});s.createIndex('byExam','examId');}
      else{const s=req.transaction.objectStore('revs');if(!s.indexNames.contains('byExam'))s.createIndex('byExam','examId');}
    };
    req.onsuccess=function(){db=req.result;res(db)};
    req.onerror=function(){rej(req.error)};
  });
}
function reqp(req){return new Promise(function(res,rej){req.onsuccess=function(){res(req.result)};req.onerror=function(){rej(req.error)}})}
async function ensureDB(){if(!db)db=await openDB();return db}
const dbPut=async function(store,obj){const d=await ensureDB();const t=d.transaction(store,'readwrite');await reqp(t.objectStore(store).put(obj))};
const dbGet=async function(store,key){const d=await ensureDB();const t=d.transaction(store,'readonly');return reqp(t.objectStore(store).get(key))};
const dbAll=async function(store){const d=await ensureDB();const t=d.transaction(store,'readonly');return reqp(t.objectStore(store).getAll())};
const dbByIdx=async function(store,idx,val){const d=await ensureDB();const t=d.transaction(store,'readonly');return reqp(t.objectStore(store).index(idx).getAll(val))};
const dbDel=async function(store,key){const d=await ensureDB();const t=d.transaction(store,'readwrite');await reqp(t.objectStore(store).delete(key))};
const dbClear=async function(store){const d=await ensureDB();const t=d.transaction(store,'readwrite');await reqp(t.objectStore(store).clear())};
/* 游标逐条挑取（不把整表含图片的记录一次性读进内存） */
function dbCollect(store,idx,val,pick){
  return new Promise(function(res,rej){
    ensureDB().then(function(d){
      const rq=d.transaction(store,'readonly').objectStore(store).index(idx).openCursor(IDBKeyRange.only(val));
      const out=[];
      rq.onsuccess=function(e){const c=e.target.result;if(!c)return res(out);out.push(pick?pick(c.value):c.value);c.continue()};
      rq.onerror=function(){rej(rq.error)};
    }).catch(rej);
  });
}
function dbCount(store){
  return new Promise(function(res,rej){
    ensureDB().then(function(d){
      const rq=d.transaction(store,'readonly').objectStore(store).count();
      rq.onsuccess=function(){res(rq.result)};rq.onerror=function(){rej(rq.error)};
    }).catch(rej);
  });
}
/* 单事务批量删除 */
function dbDelMany(store,keys){
  if(!keys||!keys.length)return Promise.resolve();
  return new Promise(function(res,rej){
    ensureDB().then(function(d){
      const t=d.transaction(store,'readwrite');
      const os=t.objectStore(store);
      keys.forEach(function(k){os.delete(k)});
      t.oncomplete=function(){res()};t.onerror=function(){rej(t.error)};
    }).catch(rej);
  });
}

/* ---------- 版式布局（mm 坐标系，确定性输出） ---------- */
function paperWH(tpl){
  const p=PAPER[tpl.paper]||PAPER.A4;
  if(tpl.orient==='landscape')return {w:p[1],h:p[0]};
  return {w:p[0],h:p[1]};
}
/* 题级选项数（模板组可指定 15:5 等覆盖；默认组 choices） */
function groupQChoices(g,qn){
  if(g.choicesQ&&g.choicesQ[qn]!=null)return Math.max(2,Math.min(6,g.choicesQ[qn]));
  return g.choices;
}
/* 选项几何：数字区 11mm 后均分，气泡居中于槽位（渲染/识别统一公式） */
function qBubbleGeom(g,qn,ch){
  const n=groupQChoices(g,qn);
  const zone=g.dxq-11;
  const step=Math.max(4.6,zone/n);
  const bw=Math.min(g.size[0],step-0.8);
  return {bx:g.x0+11+ch*step+(step-bw)/2+bw/2,count:n,bw:bw,bh:g.size[1],step:step};
}
/* 题目清单归一化：新模板用 questions 逐题数组；旧模板（选择题组+主观题区）自动推导，两边兼容 */
function normalizeQuestions(tpl){
  if(Array.isArray(tpl.questions))return tpl.questions;
  const qs=[];
  (tpl.choiceGroups||[]).forEach(function(g){
    for(let q=g.first;q<g.first+g.count;q++)qs.push({t:'obj',qno:q,choices:(g.choicesQ&&g.choicesQ[q])?g.choicesQ[q]:g.choices});
  });
  (tpl.subjective||[]).forEach(function(s){qs.push({t:'subj',qno:s.qno,score:s.score,type:s.type,rows:s.rows,cols:s.cols,count:s.count,titleLine:s.titleLine,label:s.label});});
  return qs;
}
function layoutTemplate(tpl){
  const wh=paperWH(tpl), w=wh.w, h=wh.h;
  const M=14, contentW=w-2*M;
  const big=9, sm=5;
  const anchors=[
    {x:12-big/2,y:12-big/2,s:big},
    {x:w-12-big/2,y:12-big/2,s:big},
    {x:w-12-big/2,y:h-12-big/2,s:big},
    {x:12-big/2,y:h-12-big/2,s:big},
    {x:12-sm/2,y:22-sm/2,s:sm},
    {x:w-12-sm/2,y:22-sm/2,s:sm}
  ];
  const regDigits=Math.max(2,Math.min(12,tpl.regDigits||5));
  const colW=11, regW=regDigits*colW;
  const qr={x:w-52,y:34,size:34};
  /* 考号区默认居中；位数多（≥9 位）时会与左上姓名框（右缘 58mm）或右上二维码（qr.x）重叠，
     此时自动隐藏姓名框，并把考号区收进 [左边距, 二维码左侧] 内居中，避免涂点印进二维码 */
  let regX=Math.round((w-regW)/2);
  let infoHide=tpl.showInfo===false;
  if(regX-2.5<58 || regX+regW+2.5>qr.x){
    infoHide=true;
    regX=Math.round(M+Math.max(0,(qr.x-4-M-regW)/2));
  }
  const regRowsY=[];
  for(let i=0;i<10;i++)regRowsY.push(45.6+i*4.4);
  const reg={x:regX,y:33,colW:colW,grid:8,rowsY:regRowsY,bubble:3.2,dy:4.4,
    numY:30.6,labelY:26.8,boxTop:24.5,label:'准 考 证 号'};
  const pages=[];
  /* 续页顶部只留标题下方必要间距；底部留出页脚与定位点空间（内容最深到 h-19，页脚在 h-14.5），最大化利用纸面 */
  const contentTop=94, contentTopCont=31, contentBottom=h-19;

  const regEvery=(tpl.regEveryPage===true);
  function newPage(pi){
    return {w:w,h:h,title:(tpl.title||'答题卡'),info:(pi===0&&!infoHide)?{x:M,y:33,w:44,h:54.6}:null,
      reg:(pi===0||regEvery)?reg:null,regDigits:regDigits,groups:[],subjective:[],qr:(pi===0)?qr:null,anchors:anchors,footer:{n:pi+1,m:0}};
  }
  /* 无考号区页面顶部从 31mm 开始（标题下方留出组标签空间）；首页 94mm */
  const pageTopFor=function(pi){return (pi===0||regEvery)?contentTop:contentTopCont};
  let pg=newPage(0); pages.push(pg);
  let curY=pageTopFor(0);
  function pageBreak(need){ if(curY+need<=contentBottom)return; pg=newPage(pages.length); pages.push(pg); curY=pageTopFor(pages.length-1); }
  function forcePage(){ pg=newPage(pages.length); pages.push(pg); curY=pageTopFor(pages.length-1); }
  
  /* 逐题清单 → 排版：客观题自动集中到答题卡开头（题号升序，选项数相同的连续题号合为一组），主观题按清单顺序排在其后 */
  const qss=normalizeQuestions(tpl);
  const objs=qss.filter(function(q){return q.t==='obj'}).sort(function(a,b){return a.qno-b.qno});
  const objGroups=[];
  objs.forEach(function(o){
    const choices=Math.max(2,Math.min(6,o.choices||4));
    const last=objGroups[objGroups.length-1];
    if(last&&o.qno===last.first+last.count&&choices===last.choices)last.count++;
    else objGroups.push({first:o.qno,count:1,choices:choices});
  });
  objGroups.forEach(function(gp){gp.label=gp.first===gp.count+gp.first-1?('选择题（第'+gp.first+'题）'):('选择题（'+gp.first+'-'+(gp.first+gp.count-1)+'题）');});
  const subjDefs=qss.filter(function(q){return q.t==='subj'});
  /* 选择题组（超高自动拆分为多个子组跨页，题号连续） */
  const maxRowsPerPage=Math.max(1,Math.floor((contentBottom-contentTop-13)/5));
  objGroups.forEach(function(gp){
    const choices=gp.choices;
    const total=gp.count;
    const cellW=10;
    let cols=Math.max(1,Math.min(total,gp.cols||0));
    if(!gp.cols){cols=Math.max(1,Math.floor((contentW-6)/(cellW+choices*7.0+1)));}
    cols=Math.min(cols,total);
    const x0=M+6, gridW=contentW-12;
    const dxq=gridW/cols;
    const dxc=Math.max(3.5,(dxq-cellW)/choices);
    const label=gp.label;
    let qFirst=gp.first, remaining=total, part=0;
    while(remaining>0){
      const rows=Math.min(remaining,Math.max(1,Math.min(Math.ceil(remaining/cols),maxRowsPerPage)));
      const subCount=Math.min(remaining,rows*cols);
      const hNeed=7+rows*5+6;
      pageBreak(hNeed);
      const g={first:qFirst,count:subCount,choices:choices,choicesQ:gp.choicesQ||null,cols:cols,rows:rows,
        x0:x0,y0:curY+7,dxq:dxq,dy:5,dxc:dxc,size:[4.2,2.8],timing:{dx:-2,w:1,h:2},label:label+(part>0?'（续）':'')};
      pg.groups.push(g);
      curY+=hNeed;
      qFirst+=subCount;remaining-=subCount;part++;
    }
  });
  /* 主观题（按清单顺序，超出页面自动分页切分） */
  subjDefs.forEach(function(sub,si){
    const type=sub.type||'lines';
    const cols=(type==='grid-cn')?Math.max(10,Math.min(40,sub.cols||20)):null;
    const rowH=(type==='grid-cn')?(Math.min(8,166/cols)+1.2):(type==='grid-en')?5:8;
    const headH=(type==='grid-cn'&&sub.titleLine)?13:0;
    const totalRows=(type==='grid-cn'&&sub.count)?Math.max(1,Math.ceil(sub.count/cols)):Math.max(1,sub.rows||3);
    /* 分页：每页尽量填满（首页按剩余空间，之后每页按整页容量，不做均衡拆分） */
    let remaining=totalRows, part=0, partRowStart=0;
    /* 主观题默认题号按“清单中第几道主观题”编号，避免多道未命名主观题互相撞号 */
    const subjQno=sub.qno||('主观题'+(si+1));
    while(remaining>0){
      /* 可用行高空间 = 页底 contentBottom − 框顶(curY+7) − 底部内边距6 − 首部标题栏（仅首片），保证框底不越界 */
      const partHead=(part===0)?headH:0;
      const avail=contentBottom-(curY+7)-6-partHead;
      let take;
      if(avail>=rowH){
        take=Math.min(remaining,Math.floor(avail/rowH));
      }else{
        forcePage();
        take=Math.min(remaining,Math.max(1,Math.floor((contentBottom-(contentTopCont+7)-6)/rowH)));
      }
      const boxH=take*rowH+6+partHead;
      const sx=M+2, sw=contentW-4, sy=curY+7;
      pg.subjective.push({qno:subjQno,score:sub.score||10,type:type,rows:take,rowH:rowH,
        cols:cols,rowStart:partRowStart,headH:partHead,
        part:part,label:(sub.label||'主观题')+(part>0?'（续第'+(part+1)+'部分）':''),x:sx,y:sy,w:sw,h:boxH});
      remaining-=take; part++; partRowStart+=take;
      curY+=13+boxH;
    }
  });
  pages.forEach(function(p,i){p.footer.n=i+1;p.footer.m=pages.length});
  return {w:w,h:h,pages:pages,regDigits:regDigits,perScore:tpl.perScore||2,id:tpl.id||'',name:tpl.name||''};

}

/* ---------- mm→px 渲染 ---------- */
function renderPageCanvas(tpl,layout,page,dpi,qrCv){
  const px=function(m){return m*dpi/25.4};
  const cv=document.createElement('canvas');
  cv.width=Math.max(1,Math.round(px(page.w)));
  cv.height=Math.max(1,Math.round(px(page.h)));
  const ctx=cv.getContext('2d');
  ctx.fillStyle='#FFFFFF';
  ctx.fillRect(0,0,cv.width,cv.height);
  ctx.textAlign='center';ctx.textBaseline='middle';
  /* 锚点：外白框(0.4mm线) + 内实心方块 */
  page.anchors.forEach(function(a){
    const outer=a.s, inner=a.s*0.667;
    ctx.fillStyle='#fff';
    ctx.fillRect(px(a.x),px(a.y),px(outer),px(outer));
    ctx.strokeStyle='#000';ctx.lineWidth=Math.max(1,px(0.4));
    ctx.strokeRect(px(a.x)+ctx.lineWidth/2,px(a.y)+ctx.lineWidth/2,px(outer)-ctx.lineWidth,px(outer)-ctx.lineWidth);
    ctx.fillStyle='#000';
    const off=(outer-inner)/2;
    ctx.fillRect(px(a.x+off),px(a.y+off),px(inner),px(inner));
  });
  /* 标题 */
  ctx.fillStyle='#000';
  ctx.font='bold '+Math.max(10,Math.round(px(5.6)))+'px "Microsoft YaHei",sans-serif';
  ctx.fillText(page.title,px(page.w/2),px(21));
  /* 姓名/班级/座位号 */
  if(page.info){
    const r=page.info;
    ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.7,px(0.25));
    ctx.strokeRect(px(r.x),px(r.y),px(r.w),px(r.h));
    const rows=[['姓名',8.5],['班级',20],['座位号',31.5]];
    ctx.font=Math.max(9,Math.round(px(3.3)))+'px "Microsoft YaHei",sans-serif';
    rows.forEach(function(rd){
      ctx.textAlign='left';
      ctx.fillText(rd[0],px(r.x+3.2),px(r.y+rd[1]));
      ctx.beginPath();ctx.moveTo(px(r.x+16),px(r.y+rd[1]+3.4));ctx.lineTo(px(r.x+r.w-3.5),px(r.y+rd[1]+3.4));
      ctx.lineWidth=Math.max(0.7,px(0.28));ctx.strokeStyle='#555';ctx.stroke();
    });
  }
  /* 考号区（仅首页；如需每页可开启模板选项） */
  const reg=page.reg;
  if(!reg){
    ctx.textAlign='center';
  }else{
  ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.7,px(0.25));
  ctx.strokeRect(px(reg.x-2.5),px(reg.boxTop),px(regDigitsW(reg,page)+5),px(regBottom(reg)-reg.boxTop+3.4));
  /* 列序号 */
  ctx.font=Math.max(7,Math.round(px(2.3)))+'px "Microsoft YaHei",sans-serif';
  ctx.fillStyle='#777';ctx.textAlign='center';
  for(let c=0;c<pageRegDigits(reg,page);c++){
    const cx=reg.x+c*reg.colW;
    ctx.fillText(String(c+1),px(cx+reg.colW/2),px(reg.numY));
  }
  /* 标题「准 考 证 号」 */
  ctx.fillStyle='#000';ctx.font=Math.max(9,Math.round(px(3.1)))+'px "Microsoft YaHei",sans-serif';
  ctx.fillText(reg.label,px(reg.x+regDigitsW(reg,page)/2),px(reg.labelY));
  for(let c=0;c<pageRegDigits(reg,page);c++){
    const cx=reg.x+c*reg.colW;
    ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.7,px(0.25));
    ctx.strokeRect(px(cx+(reg.colW-reg.grid)/2),px(reg.y),px(reg.grid),px(reg.grid));
  }
  reg.rowsY.forEach(function(ry,i){
    for(let c=0;c<pageRegDigits(reg,page);c++){
      const cx=reg.x+c*reg.colW+(reg.colW-reg.bubble)/2;
      ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.6,px(0.2));
      ctx.strokeRect(px(cx),px(ry-reg.bubble/2),px(reg.bubble),px(reg.bubble));
      ctx.font=Math.max(6,Math.round(px(2.2)))+'px "Microsoft YaHei",sans-serif';
      ctx.fillStyle='#333';
      ctx.fillText(String(i),px(cx+reg.bubble/2),px(ry));
    }
    /* 每位数字右侧同步条 */
    ctx.fillStyle='#000';
    for(let c=0;c<pageRegDigits(reg,page);c++){
      const cx=reg.x+c*reg.colW+reg.colW+0.7;
      ctx.fillRect(px(cx-0.4),px(ry-1),px(0.8),px(2));
    }
  });
  }
  ctx.textAlign='center';
  /* 选择题组 */
  page.groups.forEach(function(g){
    ctx.strokeStyle='#555';ctx.lineWidth=Math.max(0.7,px(0.3));
    ctx.strokeRect(px(g.x0-3),px(g.y0-2),px((g.dxq*g.cols)+6),px(g.rows*g.dy+4));
    ctx.fillStyle='#000';
    ctx.font='bold '+Math.max(8,Math.round(px(3.6)))+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillText(g.label+'（每题'+(pagePerScore(tpl,layout,page))+'分）',px(g.x0),px(g.y0-4.5));
    ctx.textAlign='center';
    for(let c=0;c<g.cols;c++){
      const xc=g.x0+c*g.dxq;
      for(let r=0;r<g.rows;r++){
        const qn=g.first+c*g.rows+r;
        if(qn>g.first+g.count-1)break;
        const rowY=g.y0+2.5+r*g.dy;
        const nOpts=groupQChoices(g,qn);
        ctx.font='bold '+Math.max(7,Math.round(px(2.8)))+'px "Microsoft YaHei",sans-serif';
        ctx.fillStyle='#000';
        ctx.fillText(String(qn),px(xc+4),px(rowY));
        for(let ch=0;ch<nOpts;ch++){
          const qg=qBubbleGeom(g,qn,ch);
          const bx=xc+(qg.bx-g.x0)-qg.bw/2;
          ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.6,px(0.18));
          ctx.strokeRect(px(bx),px(rowY-qg.bh/2),px(qg.bw),px(qg.bh));
          ctx.font=Math.max(6,Math.round(px(2.3)))+'px Arial,sans-serif';
          ctx.fillStyle='#444';
          ctx.fillText(String.fromCharCode(65+ch),px(bx+qg.bw/2),px(rowY+0.1));
        }
        /* 行同步条 */
        ctx.fillStyle='#000';
        ctx.fillRect(px(g.x0-2.2),px(rowY-1),px(1),px(2));
      }
    }
  });
  /* 主观题区 */
  page.subjective.forEach(function(sb){
    ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.8,px(0.35));
    ctx.strokeRect(px(sb.x),px(sb.y),px(sb.w),px(sb.h));
    ctx.fillStyle='#000';ctx.font='bold '+Math.max(8,Math.round(px(3.6)))+'px "Microsoft YaHei",sans-serif';
    ctx.textAlign='left';
    ctx.fillText(sb.label+'（'+sb.score+'分）',px(sb.x),px(sb.y-4.5));
    const innerW=sb.w-12;
    if(sb.type==='lines'){
      ctx.strokeStyle='#999';ctx.lineWidth=Math.max(0.6,px(0.2));
      for(let i=0;i<sb.rows;i++){
        const ly=sb.y+4+i*sb.rowH+2;
        ctx.beginPath();ctx.moveTo(px(sb.x+5),px(ly));ctx.lineTo(px(sb.x+sb.w-5),px(ly));ctx.stroke();
      }
    }else if(sb.type==='grid-cn'){
      const cols=Math.max(10,Math.min(40,sb.cols||20));
      const cell=Math.min(8,innerW/cols);
      const gw=cols*cell, gx=sb.x+(sb.w-gw)/2, gy=sb.y+4+(sb.headH||0);
      if(sb.headH){
        /* 可选「题目」栏：居中、横线长约框宽一半 */
        const lineLen=(sb.w-26)/2;
        const labelW=16;
        const startX=sb.x+(sb.w-(labelW+lineLen))/2;
        ctx.strokeStyle='#000';ctx.lineWidth=Math.max(0.7,px(0.28));
        ctx.beginPath();ctx.moveTo(px(startX+labelW),px(sb.y+9.5));ctx.lineTo(px(startX+labelW+lineLen),px(sb.y+9.5));ctx.stroke();
        ctx.fillStyle='#000';ctx.font='bold '+Math.max(9,Math.round(px(3.2)))+'px "Microsoft YaHei",sans-serif';
        ctx.textAlign='center';
        ctx.fillText('题  目：',px(startX+labelW/2),px(sb.y+7));
      }
      const cellH=8, gapV=1.2, pitch=cellH+gapV;
      ctx.strokeStyle='#bbb';ctx.lineWidth=Math.max(0.5,px(0.16));
      for(let r=0;r<sb.rows;r++){
        const lineY=gy+r*pitch;
        for(let c=0;c<cols;c++){
          ctx.strokeRect(px(gx+c*cell),px(lineY),px(cell),px(cellH));
        }
      }
      /* 行与行之间的缝隙内标注：每满100字 */
      const rowBase=(sb.rowStart||0);
      ctx.fillStyle='#8a8a8a';ctx.font=Math.max(5,Math.round(px(2)))+'px "Microsoft YaHei",sans-serif';
      ctx.textAlign='left';
      for(let r=0;r<sb.rows;r++){
        const cumAfter=(rowBase+r+1)*cols;
        const k=Math.floor(cumAfter/100);
        const cumBefore=cumAfter-cols;
        if(k*100>cumBefore&&k*100<=cumAfter){
          const labelY=gy+(r+1)*pitch-gapV/2;
          ctx.fillText(String(k*100)+'字',px(gx+gw+1.2),px(labelY));
        }
      }
      ctx.textAlign='center';
    }else if(sb.type==='grid-en'){
      ctx.strokeStyle='#999';ctx.lineWidth=Math.max(0.5,px(0.18));
      for(let i=0;i<sb.rows;i++){
        const base=sb.y+4+i*sb.rowH;
        const ys=[base,base+1.4,base+2.8,base+4.2];
        ys.forEach(function(y,k){
          ctx.beginPath();ctx.moveTo(px(sb.x+4),px(y));ctx.lineTo(px(sb.x+sb.w-4),px(y));ctx.stroke();
        });
      }
    }
  });
  /* 页脚 */
  ctx.fillStyle='#000';ctx.font=Math.max(7,Math.round(px(2.8)))+'px "Microsoft YaHei",sans-serif';
  ctx.textAlign='center';
  ctx.fillText('第'+page.footer.n+'页,共'+page.footer.m+'页',px(page.w/2),px(page.h-14.5));
  /* 二维码 */
  if(qrCv&&page.qr){
    ctx.imageSmoothingEnabled=false;
    ctx.drawImage(qrCv,px(page.qr.x),px(page.qr.y),px(page.qr.size),px(page.qr.size));
  }
  ctx.textAlign='center';
  return cv;
}
function pageRegDigits(reg,page){return (page.regDigits||regDigitsOf(page))||5}
function regDigitsOf(page){return page.regDigits||5}
function regDigitsW(reg,page){return reg.colW*pageRegDigits(reg,page)}
function regBottom(reg){return reg.rowsY[9]+3.4}
function pagePerScore(tpl,layout,page){return layout.perScore||2}
function pageRegDigits2(page){return page.regDigits||5}

/* ---------- 二维码（自描述版式） ---------- */
function b64FromBytes(bytes){
  let bin='';
  const chunk=0x8000;
  for(let i=0;i<bytes.length;i+=chunk){
    bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+chunk));
  }
  return btoa(bin);
}
function bytesFromB64(b64){
  const bin=atob(b64);
  const arr=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)arr[i]=bin.charCodeAt(i);
  return arr;
}
function b64ToBlob(b64,type){
  try{return new Blob([bytesFromB64(b64)],{type:type||'image/jpeg'})}catch(e){return null}
}
function r1(v){return Math.round(v*10)/10}
function r2(v){return Math.round(v*100)/100}
function rH(v){return Math.round(v*2)/2}
async function compactSliceFor(layout,tpl,page,level){
  const a=[];
  page.anchors.forEach(function(x){
    if(level>=3){a.push(rH(x.x),rH(x.y),rH(x.s));}
    else a.push(r1(x.x),r1(x.y),r1(x.s));
  });
  const gs=page.groups.map(function(g){
    if(level>=3)return [g.first,g.count,g.choices,g.cols,g.rows,rH(g.x0),rH(g.y0),rH(g.dxq),rH(g.dy),rH(g.dxc),g.size[0],g.size[1]];
    return [g.first,g.count,g.choices,g.cols,g.rows,r1(g.x0),r1(g.y0),r2(g.dxq),r2(g.dy),r2(g.dxc),g.size[0],g.size[1]];
  });
  const ss=page.subjective.map(function(s){
    if(level>=3)return [s.qno,s.score,s.type,s.rows,rH(s.rowH),rH(s.x),rH(s.y),rH(s.w),rH(s.h),s.part,s.cols||null,s.rowStart||0,s.headH||0];
    return [s.qno,s.score,s.type,s.rows,r2(s.rowH),r1(s.x),r1(s.y),r1(s.w),r1(s.h),s.part,s.cols||null,s.rowStart||0,s.headH||0];
  });
  const slice={v:1,p:tpl.paper||'A4',o:tpl.orient||'portrait',w:layout.w,h:layout.h,rd:layout.regDigits,
    ps:layout.perScore,pg:page.footer.n,np:page.footer.m,info:page.info?1:0,
    a:a,qr:page.qr?{x:rH(page.qr.x),y:rH(page.qr.y),s:page.qr.size}:null,
    r:page.reg?{x:rH(page.reg.x),y:rH(page.reg.y),dy:r2(page.reg.rowsY[1]-page.reg.rowsY[0]),ry0:r2(page.reg.rowsY[0]-page.reg.y),b:page.reg.bubble,col:page.reg.colW}:null,
    gs:gs,ss:(level>=4)?[]:ss};
  return slice;
}

/* ---------- 二维码 v3：二进制紧凑版式（确定性几何由骨架还原，仅携带差异：选择题组+主观题区） ---------- */

/* 版式指纹：只识别“打印版与当前模板是否一致”，几何本体由模板（批内）提供 */
async function layoutHash(layout,tpl,page){
  try{
    let json='';
    const test=await compactSliceFor(layout,tpl,page,3);
    json=JSON.stringify(test);
    let h1=0x811c9dc5;
    for(let i=0;i<json.length;i++){
      h1^=json.charCodeAt(i);
      h1=(h1*0x01000193)>>>0;
    }
    return h1.toString(16);
  }catch(e){return ''}
}
function qrPackBytes(tpl,layout,page){
  const b=[];
  const P={A4:1,A3:2,B4:3,'8K':4}[tpl.paper]||1;
  b.push(1,P,tpl.orient==='landscape'?1:0,layout.regDigits,Math.round((page.perScore||layout.perScore||2)*2),
    layout.pages.length,page.footer.n,page.info?1:0,Math.round(page.w*0.5),Math.round(page.h*0.5));
  page.groups.forEach(function(g){
    b.push(g.first%256,g.count%256,g.choices,g.cols,g.rows,
      Math.min(255,Math.round(g.x0*0.75)),Math.min(255,Math.round(g.y0*0.75)),
      Math.min(255,Math.round(g.dxq*2)),Math.min(255,Math.round(g.dy*2)),Math.min(255,Math.round(g.dxc*2)),
      Math.min(255,Math.round(g.size[0]*2)),Math.min(255,Math.round(g.size[1]*2)));
    const cq=g.choicesQ?Object.keys(g.choicesQ).filter(function(k){return isFinite(k)&&g.choicesQ[k]>=2&&g.choicesQ[k]<=6}):[];
    if(cq.length){
      b.push(1,Math.min(255,cq.length));
      cq.forEach(function(k){b.push(parseInt(k,10)%256,g.choicesQ[k]);});
    }else b.push(0);
  });
  b.push(0xFF,0xFE);
  page.subjective.forEach(function(s){
    const qb=new TextEncoder().encode(String(s.qno||''));
    b.push(Math.min(qb.length,12));
    for(let k=0;k<Math.min(qb.length,12);k++)b.push(qb[k]);
    b.push(Math.min(255,Math.round(s.score*2)),
      s.type==='grid-cn'?1:(s.type==='grid-en'?2:0),
      s.rows%256,Math.min(255,Math.round(s.rowH*2)),
      Math.min(255,Math.round(s.x*0.75)),Math.min(255,Math.round(s.y*0.75)),
      Math.min(255,Math.round(s.w*0.75)),Math.min(255,Math.round(s.h*0.75)),
      s.part%256,s.cols||0,s.rowStart%256,Math.min(255,Math.round((s.headH||0)*2)));
  });
  return new Uint8Array(b);
}
function qrUnpackBytes(bytes){
  let i=0;
  function u(){return bytes[i++]}
  const v=u();
  if(v!==1)throw new Error('版本不符');
  const paper=u(),orient=u(),rd=u(),ps10=u(),np=u(),pg=u(),info=u();
  const w=u()*2,h=u()*2;
  const groups=[];
  while(i+1<bytes.length&&!(bytes[i]===255&&bytes[i+1]===254)){
    const g={first:u(),count:u(),choices:u(),cols:u(),rows:u(),
      x0:u()/0.75,y0:u()/0.75,dxq:u()/2,dy:u()/2,dxc:u()/2,
      size:[u()/2,u()/2],timing:{dx:-2,w:1,h:2},label:'选择题'};
    const tf=u();
    if(tf===1){
      const cnt=u();const cq={};
      for(let k=0;k<cnt;k++){const qn=u(),n=u();cq[qn]=n;}
      g.choicesQ=cq;
    }
    groups.push(g);
  }
  i+=2;
  const subj=[];
  const types=['lines','grid-cn','grid-en'];
  while(i<bytes.length){
    const ql=u();
    if(!(ql>0)||i+ql>bytes.length)throw new Error('二维码数据不完整（旧版载荷）');
    const qno=new TextDecoder().decode(bytes.subarray(i,i+ql));i+=ql;
    subj.push({qno:qno,score:u()/2,type:types[u()]||'lines',rows:u(),rowH:u()/2,
      x:u()/0.75,y:u()/0.75,w:u()/0.75,h:u()/0.75,
      part:u(),cols:u()||null,rowStart:u(),headH:u()/2,label:'主观题'});
  }
  return {v:1,paper:paper,orient:orient,regDigits:rd,perScore:ps10/2,pages:np,page:pg,info:info,w:w,h:h,groups:groups,subjective:subj};
}
/* 确定性骨架（与 layoutTemplate 常量一致）：锚点/考号区/二维码/信息框 */
function qrSkeleton(w,h,rd,pg,np,info){
  const big=9,sm=5;
  const anchors=[
    {x:12-big/2,y:12-big/2,s:big},{x:w-12-big/2,y:12-big/2,s:big},
    {x:w-12-big/2,y:h-12-big/2,s:big},{x:12-big/2,y:h-12-big/2,s:big},
    {x:12-sm/2,y:22-sm/2,s:sm},{x:w-12-sm/2,y:22-sm/2,s:sm}
  ];
  const regW=rd*11, regX=Math.max(14,Math.round((w-regW)/2));
  const rowsY=[];
  for(let i=0;i<10;i++)rowsY.push(45.6+i*4.4);
  const reg={x:regX,y:33,colW:11,grid:8,rowsY:rowsY,bubble:3.2,dy:4.4,
    numY:30.6,labelY:26.8,boxTop:24.5,label:'准 考 证 号'};
  return {w:w,h:h,title:'答题卡',
    info:info?{x:14,y:33,w:44,h:54.6}:null,notes:null,
    reg:reg,regDigits:rd,groups:[],subjective:[],qr:{x:w-52,y:34,size:34},
    anchors:anchors,footer:{n:pg,m:np}};
}
async function qrPayloadFor(layout,tpl,page){
  /* 最小化二维码：几何全部由模板（批内）提供，仅带 模板ID + 版式指纹 */
  return 'DTZ1|2|'+encodeURIComponent(tpl.id||'')+'|'+layout.regDigits+'|'+layout.pages.length+'|'+(await layoutHash(layout,tpl,page));
}
async function qrParsePayload(data){
  data=String(data||'').trim();
  if(data.indexOf('DTZ1|')!==0)throw new Error('非本系统二维码');
  const s=data.slice(5);
  const sep=s.indexOf('|');
  const flag=s.slice(0,sep);
  if(flag==='3'){
    const bytes=bytesFromB64(s.slice(sep+1));
    const o=qrUnpackBytes(bytes);
    const page=qrSkeleton(o.w,o.h,o.regDigits,o.page,o.pages,o.info);
    page.perScore=o.perScore;
    page.groups=o.groups;
    page.subjective=o.subjective;
    return page;
  }
  if(flag==='2'){
    const rest=s.slice(sep+1).split('|');
    return {minimal:true,tplId:decodeURIComponent(rest[0]||''),regDigits:parseInt(rest[1],10)||5,pages:parseInt(rest[2],10)||1,hash:(rest[3]||'')};
  }
  const b64=s.slice(sep+1);
  const bytes=bytesFromB64(b64);
  let json;
  if(flag==='1'){
    if(typeof DecompressionStream==='undefined')throw new Error('浏览器不支持解压');
    const ds=new DecompressionStream('deflate-raw');
    const blob=new Blob([bytes]);
    json=await new Response(blob.stream().pipeThrough(ds)).text();
  }else{
    json=new TextDecoder().decode(bytes);
  }
  const o=JSON.parse(json);
  if(o.gs||o.a){  /* 紧凑格式还原为页面版式 */
    const rowsY=[];
    const rdy=(o.r&&o.r.dy&&isFinite(o.r.dy))?o.r.dy:4.4;
    const ry0=(o.r&&isFinite(o.r.ry0))?o.r.ry0:12.6;
    if(o.r)for(let i=0;i<10;i++)rowsY.push(o.r.y+ry0+i*rdy);
    const page={w:o.w,h:o.h,title:o.t,info:o.info?{x:14,y:32,w:44,h:58}:null,
      notes:o.info?{x:o.w-60,y:32,w:46,h:58}:null,
      reg:o.r?{x:o.r.x,y:o.r.y,colW:o.r.col,grid:8,rowsY:rowsY,bubble:o.r.b,label:'准 考 证 号'}:null,
      regDigits:o.rd,groups:[],subjective:[],footer:{n:o.pg,m:o.np},
      anchors:[],qr:o.qr?{x:o.qr.x,y:o.qr.y,size:o.qr.s}:null};
    const fl=a=>{const out=[];for(let i=0;i<a.length;i+=3)out.push({x:a[i],y:a[i+1],s:a[i+2]});return out};
    page.anchors=fl(o.a);
    (o.gs||[]).forEach(function(g){
      page.groups.push({first:g[0],count:g[1],choices:g[2],cols:g[3],rows:g[4],
        x0:g[5],y0:g[6],dxq:g[7],dy:g[8],dxc:g[9],size:[g[10],g[11]],timing:{dx:-2.2,w:1,h:2},label:'选择题'});
    });
    (o.ss||[]).forEach(function(s){
      page.subjective.push({qno:s[0],score:s[1],type:s[2],rows:s[3],rowH:s[4],x:s[5],y:s[6],w:s[7],h:s[8],part:s[9],
        cols:s[10]||null,rowStart:s[11]||0,headH:s[12]||0,label:'主观题'});
    });
    page.perScore=o.ps;
    return page;
  }
  return o;
}
async function makeQRCanvas(payload){
  if(typeof qrcode!=='function')return null;
  try{
    const modPx=6;
    const qr=qrcode(0,'M');
    qr.addData(payload);
    qr.make();
    const n=qr.getModuleCount();
    const S=(n+8)*modPx;
    const cv=document.createElement('canvas');
    cv.width=S;cv.height=S;
    const ctx=cv.getContext('2d');
    ctx.fillStyle='#fff';ctx.fillRect(0,0,S,S);
    ctx.fillStyle='#000';
    for(let r=0;r<n;r++)for(let c=0;c<n;c++){
      if(qr.isDark(r,c))ctx.fillRect((c+4)*modPx,(r+4)*modPx,modPx,modPx);
    }
    return cv;
  }catch(e){console.error(e);return null}
}

/* ---------- 渲染入口（异步：先备齐各页二维码） ---------- */
async function renderPagesAsync(tpl,dpi){
  const layout=layoutTemplate(tpl);
  const qrs=[];
  for(let i=0;i<layout.pages.length;i++){
    const payload=await qrPayloadFor(layout,tpl,layout.pages[i]);
    qrs.push(await makeQRCanvas(payload));
  }
  return {layout:layout,canvases:layout.pages.map(function(p,i){return renderPageCanvas(tpl,layout,p,dpi,qrs[i])})};
}
function renderPagesSync(tpl,dpi){
  const layout=layoutTemplate(tpl);
  return {layout:layout,canvases:layout.pages.map(function(p){return renderPageCanvas(tpl,layout,p,dpi,null)})};
}

/* ---------- PDF 导出 ---------- */
async function exportTemplatePDF(tpl){
  if(typeof jspdf==='undefined'||!jspdf.jsPDF){toast('jsPDF 库未加载','err');return}
  dlg('<div class="kv">正在渲染 '+tpl.name+'（'+layoutTemplate(tpl).pages.length+' 页，300dpi）…</div>',{title:'导出 PDF'});
  try{
    const {layout,canvases}=await renderPagesAsync(tpl,300);
    const wh=paperWH(tpl);
    const pdf=new jspdf.jsPDF({orientation:wh.h>=wh.w?'portrait':'landscape',unit:'mm',format:[wh.w,wh.h],compress:false});
    canvases.forEach(function(cv,i){
      if(i>0)pdf.addPage([wh.w,wh.h],wh.h>=wh.w?'portrait':'landscape');
      pdf.addImage(cv.toDataURL('image/jpeg',0.92),'JPEG',0,0,wh.w,wh.h,undefined,'FAST');
    });
