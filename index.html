<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小应用导航</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --zhu:#A93226;
    --zhu-light:#C0392B;
    --xuan:#FDF6E3;
    --xuan-dark:#F5E6C8;
    --shui:#2C3E50;
    --shui-light:#34495E;
    --gold:#B8860B;
  }
  body{
    font-family:"Noto Sans SC",sans-serif;
    background:var(--xuan);
    min-height:100vh;
    color:var(--shui);
  }

  .header{
    background:var(--shui);
    padding:20px 24px 16px;
    position:sticky;top:0;z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .logo{font-size:20px;font-weight:700;color:var(--xuan);letter-spacing:4px}
  .logo span{color:var(--zhu);font-size:26px;margin-right:2px}


  .search-box{
    display:flex;gap:8px;align-items:center;
  }
  .search-wrap{
    flex:1;position:relative;
  }
  .search-wrap input{
    width:100%;padding:8px 12px 8px 12px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;background:rgba(255,255,255,.08);
    color:#fff;font-size:13px;outline:none;
    transition:border-color .2s;
  }
  .search-wrap input::placeholder{color:rgba(255,255,255,.35)}
  .search-wrap input:focus{border-color:var(--zhu)}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    color:rgba(255,255,255,.4);cursor:pointer;font-size:16px;
    display:none;line-height:1;
  }
  .search-clear.show{display:block}

  .main{padding:16px 24px 40px;max-width:900px;margin:0 auto}

  .section-title{
    font-size:13px;color:var(--shui-light);margin:16px 0 10px;
    display:flex;align-items:center;gap:6px;
    padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,.06);
  }
  .section-title::before{
    content:'';width:3px;height:12px;background:var(--zhu);border-radius:2px;
  }

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;
  }
  .card{
    border-radius:12px;padding:18px 12px;height:96px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;text-decoration:none;overflow:hidden;
    transition:transform .25s,box-shadow .25s,border-color .25s;
    box-shadow:0 1px 3px rgba(44,62,80,.05);
    position:relative;cursor:pointer;border:1px solid;
  }
  .card:hover{
    transform:translateY(-3px);
  }
  .cat-工作{
    background:linear-gradient(180deg,#FCFDFF,#E3EBF5);
    border-color:rgba(51,80,122,.42);
  }
  .cat-工作:hover{border-color:#33507A;box-shadow:0 8px 22px rgba(51,80,122,.22)}
  .cat-生活{
    background:linear-gradient(180deg,#FCFEFC,#E2EEE6);
    border-color:rgba(59,106,82,.44);
  }
  .cat-生活:hover{border-color:#3B6A52;box-shadow:0 8px 22px rgba(59,106,82,.22)}
  .cat-游戏{
    background:linear-gradient(180deg,#FEFDFF,#EEE7F4);
    border-color:rgba(94,74,112,.44);
  }
  .cat-游戏:hover{border-color:#5E4A70;box-shadow:0 8px 22px rgba(94,74,112,.22)}
  .cat-其他{
    background:linear-gradient(180deg,#FEFEFE,#EAEDEF);
    border-color:rgba(80,84,92,.42);
  }
  .cat-其他:hover{border-color:#50545C;box-shadow:0 8px 22px rgba(80,84,92,.22)}
  .fav-btn{
    position:absolute;top:8px;right:8px;
    width:26px;height:26px;border-radius:50%;border:none;
    background:transparent;cursor:pointer;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;color:#ccc;opacity:.55;
  }
  .fav-btn:hover{background:rgba(169,50,38,.08);color:#aaa;opacity:1}
  .fav-btn.active{color:var(--gold);opacity:1}
  .name{
    font-size:13px;font-weight:400;line-height:1.5;
    letter-spacing:.5px;word-break:break-all;
    padding:0 24px;color:#333A45;
  }
  .cat-工作 .name{color:#33507A}
  .cat-生活 .name{color:#3B6A52}
  .cat-游戏 .name{color:#5E4A70}
  .cat-其他 .name{color:#50545C}

  .history-bar{
    display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;
  }
  .history-tag{
    padding:3px 10px;border-radius:12px;font-size:11px;
    background:var(--xuan-dark);color:var(--shui-light);
    cursor:pointer;border:1px solid rgba(0,0,0,.06);
    transition:all .2s;
  }
  .history-tag:hover{border-color:var(--zhu);color:var(--zhu)}
  .history-tag .del{
    margin-left:4px;font-size:10px;color:#bbb;cursor:pointer;
  }
  .history-tag .del:hover{color:var(--zhu)}
  .history-clear{
    padding:3px 10px;border-radius:12px;font-size:11px;
    background:none;color:#bbb;cursor:pointer;border:1px solid transparent;
  }
  .history-clear:hover{color:var(--zhu);border-color:var(--zhu)}

  .empty{text-align:center;color:var(--shui-light);padding:60px 0;font-size:14px;opacity:.5}
  .footer{text-align:center;padding:20px 0 12px;font-size:11px;color:#999;line-height:2}
  .footer a{color:#999;text-decoration:none;display:inline-flex;align-items:center;gap:3px}
  .footer a:hover{color:#666}
  .footer .sep{margin:0 4px;opacity:.3}

  @media(max-width:480px){
    .header{padding:14px 16px 12px}
    .main{padding:12px 16px 32px}
    .grid{grid-template-columns:repeat(3,1fr);gap:10px}
    .card{height:96px;padding:22px 6px}
    .fav-btn{top:3px;right:3px;width:18px;height:18px;font-size:11px}
    .name{padding:0 4px;font-size:12px;line-height:1.4}
    .logo{font-size:17px;letter-spacing:2px}
    .logo span{font-size:22px}
  }
</style>
</head>
<body>
  <div class="header">
    <div class="search-box">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="搜索应用...">
        <span class="search-clear" id="searchClear">&times;</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div id="historyBar" class="history-bar" style="display:none"></div>
    <div id="content"></div>
  </div>
    <!-- ===== 访问门禁 ===== -->
  <div id="gate" style="display:none;position:fixed;inset:0;z-index:9999;background:rgba(20,26,36,.96);color:#e8ecf2;display:none;align-items:center;justify-content:center;font-family:'Noto Sans SC',sans-serif">
    <div style="background:#232b3a;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:26px 30px;width:min(360px,92vw);text-align:center">
      <div style="font-size:18px;font-weight:700;letter-spacing:2px;margin-bottom:4px">学习应用入口</div>
      <div id="gateMsg" style="font-size:12px;color:#8fa3bd;margin:10px 0;line-height:1.6"></div>
      <input id="gateInput" type="password" inputmode="numeric" placeholder="请输入访问口令"
        style="width:100%;padding:11px 12px;border:1px solid rgba(255,255,255,.18);border-radius:10px;background:rgba(255,255,255,.06);color:#fff;font-size:16px;text-align:center;letter-spacing:4px;outline:none;box-sizing:border-box">
      <div style="display:flex;gap:8px;margin-top:12px">
        <button id="gateBtn" style="flex:1;padding:10px;border:0;border-radius:10px;background:#3d6ef5;color:#fff;font-size:14px;font-weight:700;cursor:pointer">进入</button>
      </div>
      <div id="gateHint" style="font-size:10px;color:#5a6b80;margin-top:12px;cursor:pointer" onclick="gateTeacher()">· 教师入口 ·</div>
    </div>
  </div>
  <div id="gateTeacher" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(20,26,36,.96);color:#e8ecf2;align-items:center;justify-content:center;font-family:'Noto Sans SC',sans-serif">
    <div style="background:#232b3a;border:1px solid rgba(255,255,255,.14);border-radius:16px;padding:24px 26px;width:min(380px,92vw)">
      <div style="font-size:16px;font-weight:700;margin-bottom:12px">教师管理</div>
      <div style="font-size:12px;color:#8fa3bd;margin-bottom:6px">管理密码</div>
      <input id="tAdminPwd" type="password" placeholder="管理密码"
        style="width:100%;padding:10px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;font-size:14px;outline:none;box-sizing:border-box">
      <button id="tAdminBtn" style="margin-top:8px;width:100%;padding:9px;border:0;border-radius:8px;background:#3d6ef5;color:#fff;font-size:13px;font-weight:700;cursor:pointer">验证</button>
      <div id="tPanel" style="display:none;margin-top:14px">
        <div style="font-size:13px;color:#8fa3bd">当前动态口令（每30分钟更换）</div>
        <div id="tCode" style="font-size:34px;font-weight:900;letter-spacing:8px;color:#3ddc7a;margin:6px 0 12px"></div>
        <div style="font-size:12px;color:#8fa3bd;margin-bottom:4px">开放时段（24小时制，如 8:00-17:00，留空=全天）</div>
        <div style="display:flex;gap:8px;align-items:center">
          <input id="tStart" type="time" style="padding:7px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;font-size:13px">
          <span style="color:#5a6b80">至</span>
          <input id="tEnd" type="time" style="padding:7px;border:1px solid rgba(255,255,255,.18);border-radius:8px;background:rgba(255,255,255,.06);color:#fff;font-size:13px">
        </div>
        <button id="tSave" style="margin-top:8px;padding:8px 16px;border:0;border-radius:8px;background:#2ecc71;color:#fff;font-size:13px;font-weight:700;cursor:pointer">保存时段</button>
        <button id="tLog" style="margin-top:8px;margin-left:8px;padding:8px 16px;border:0;border-radius:8px;background:#575f6e;color:#fff;font-size:13px;cursor:pointer">查看使用记录</button>
        <div id="tLogBox" style="display:none;margin-top:10px;font-size:11px;color:#8fa3bd;max-height:160px;overflow-y:auto;line-height:1.7"></div>
        <div style="margin-top:10px;font-size:10px;color:#5a6b80">提示：管理密码写在页面源码中，学生可查看源码破解，仅供常规防护。</div>
      </div>
      <button id="tClose" style="margin-top:12px;width:100%;padding:8px;border:1px solid rgba(255,255,255,.2);border-radius:8px;background:transparent;color:#cfd8e3;font-size:13px;cursor:pointer">关闭</button>
    </div>
  </div>
  <script>
  // ===== 访问门禁：动态口令 + 时间窗口 + 使用记录 =====
  var GATE_KEY='nav_gate', GATE_ADMIN='nav_admin', GATE_LOG='nav_gatelog';
  var GATE_ADMIN_PWD='20260804'; // 教师管理密码（可自行修改）
  function gateGet(k){ try{return JSON.parse(localStorage.getItem(k))||null}catch(e){return null} }
  function gateSet(k,v){ localStorage.setItem(k,JSON.stringify(v)) }
  // 动态口令：基于30分钟时段+日期的混淆哈希（4位数字，每30分钟更换）
  function dynCode(){
    var slot=Math.floor(Date.now()/1800000);
    var h=slot*2654435761;
    h=(h^h>>>15)*2246822519;
    h=(h^h>>>13)*3266489917;
    h^=h>>>16;
    h=Math.abs(h)%10000;
    var s=('0000'+h).slice(-4);
    return s;
  }
  function fmtT(m){ return ('0'+Math.floor(m/60)).slice(-2)+':'+('0'+(m%60)).slice(-2) }
  function gateRecord(){
    var log=gateGet(GATE_LOG)||[];
    log.push({t:new Date().toLocaleString(),ua:navigator.userAgent.length>60?navigator.userAgent.slice(0,60):navigator.userAgent});
    if(log.length>100) log=log.slice(-100);
    gateSet(GATE_LOG,log);
  }
  function gateCheck(){
    var g=gateGet(GATE_KEY);
    // 时间窗口
    if(g&&g.start!=null&&g.end!=null){
      var d=new Date(), hm=d.getHours()*60+d.getMinutes();
      if(hm<g.start||hm>g.end) return {ok:false,msg:'当前不在开放时段（'+fmtT(g.start)+' 至 '+fmtT(g.end)+'）'};
    }
    // 当日已解锁
    if(g&&g.day===new Date().toDateString()) return {ok:true};
    return {ok:false,msg:'请输入当日访问口令（老师课前公布，30分钟一换）'};
  }
  function gateInit(){
    var r=gateCheck();
    if(r.ok){ gateRecord(); return; }
    var el=document.getElementById('gate');
    el.style.display='flex';
    document.getElementById('gateMsg').textContent=r.msg;
    document.getElementById('gateInput').focus();
    document.getElementById('gateBtn').onclick=function(){
      var v=document.getElementById('gateInput').value.trim();
      if(v===dynCode()){
        gateSet(GATE_KEY,{day:new Date().toDateString(),start:null,end:null});
        gateRecord();
        el.style.display='none';
      } else {
        document.getElementById('gateMsg').textContent='口令错误，请重试';
        document.getElementById('gateInput').value='';
        document.getElementById('gateInput').focus();
      }
    };
    document.getElementById('gateInput').addEventListener('keydown',function(e){ if(e.key==='Enter') document.getElementById('gateBtn').click(); });
  }
  function gateTeacher(){
    var el=document.getElementById('gateTeacher');
    el.style.display='flex';
    document.getElementById('tAdminPwd').focus();
  }
  document.getElementById('tAdminBtn').onclick=function(){
    if(document.getElementById('tAdminPwd').value===GATE_ADMIN_PWD){
      document.getElementById('tPanel').style.display='block';
      var upd=function(){ document.getElementById('tCode').textContent=dynCode(); };
      upd(); setInterval(upd,10000);
      var g=gateGet(GATE_KEY)||{};
      if(g.start!=null){ document.getElementById('tStart').value=fmtT(g.start); document.getElementById('tEnd').value=fmtT(g.end); }
    } else { alert('管理密码错误'); }
  };
  document.getElementById('tSave').onclick=function(){
    var s=document.getElementById('tStart').value, e=document.getElementById('tEnd').value;
    var g=gateGet(GATE_KEY)||{};
    if(s&&e){
      var sm=s.split(':').map(Number), em=e.split(':').map(Number);
      g.start=sm[0]*60+sm[1]; g.end=em[0]*60+em[1];
    } else { g.start=null; g.end=null; }
    gateSet(GATE_KEY,g);
    alert('时段已保存');
  };
  document.getElementById('tLog').onclick=function(){
    var box=document.getElementById('tLogBox');
    var log=gateGet(GATE_LOG)||[];
    box.style.display='block';
    box.innerHTML=log.length?log.map(function(x,i){return (i+1)+'. '+x.t+' - '+x.ua;}).join('<br>'):'暂无记录';
  };
  document.getElementById('tClose').onclick=function(){ document.getElementById('gateTeacher').style.display='none'; };
  document.getElementById('gateTeacher').addEventListener('click',function(e){ if(e.target.id==='gateTeacher') this.style.display='none'; });
  gateInit();
  </script>

  <div class="footer">
    <div><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2026024789号-2</a></div>
    <!-- 公安备案通过后取消注释
    <div><a href="https://beian.mps.gov.cn/#/query/webSearch?code=42010402001734" target="_blank" rel="noreferrer"><img src="https://beian.mps.gov.cn/web/assets/logo01.6189a29f.png" alt="公安备案" style="height:15px;vertical-align:-2px"> 鄂公网安备42010402001734号</a></div>
    -->
  </div>

  <script>
    const LS_KEY_FAV='nav_favorites';
    const LS_KEY_HIST='nav_history';
    let apps=[], favs=getLS(LS_KEY_FAV), history=getLS(LS_KEY_HIST);
    let searchQuery='';

    function getLS(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
    function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

    function renderHistory(){
      const bar=document.getElementById('historyBar');
      if(!history.length||searchQuery){bar.style.display='none';return}
      bar.style.display='flex';
      bar.innerHTML=history.map(h=>
        `<span class="history-tag" onclick="doSearch('${h}')">${h}<span class="del" onclick="event.stopPropagation();delHistory('${h}')">&times;</span></span>`
      ).join('')+(history.length?`<span class="history-clear" onclick="clearHistory()">清空</span>`:'');
    }

    function doSearch(q){document.getElementById('searchInput').value=q;searchQuery=q;renderApps()}
    function delHistory(h){history=history.filter(i=>i!==h);setLS(LS_KEY_HIST,history);renderHistory()}
    function clearHistory(){history=[];setLS(LS_KEY_HIST,history);renderHistory()}

    function renderApps(){
      const c=document.getElementById('content');
      renderHistory();
      let list=apps;
      if(searchQuery){
        const q=searchQuery.toLowerCase();
        list=list.filter(a=>a.name.toLowerCase().includes(q)||a.path.toLowerCase().includes(q));
      }
      if(!list.length){c.innerHTML='<div class="empty">暂无应用</div>';return}
      const catOrder=['工作','生活','游戏','其他'];
      let html='';
      const favsList=list.filter(a=>favs.includes(a.path));
      if(favsList.length&&!searchQuery){
        html+=`<div class="section-title">收藏</div><div class="grid">${favsList.map(cardHTML).join('')}</div>`;
      }
      for(const cat of catOrder){
        const items=list.filter(a=>(a.category||'其他')===cat);
        if(!items.length)continue;
        html+=`<div class="section-title">${cat} <span style="opacity:.5;font-weight:400">${items.length}</span></div><div class="grid">${items.map(cardHTML).join('')}</div>`;
      }
      c.innerHTML=html;
    }

    function cardHTML(a){
      const isFav=favs.includes(a.path);
      const cat=a.category||'其他';
      return `<div class="card cat-${cat}" onclick="window.location.href='${a.path}'">
        <button class="fav-btn ${isFav?'active':''}" onclick="event.stopPropagation();toggleFav('${a.path}')">${isFav?'&#9733;':'&#9734;'}</button>
        <div class="name">${a.name}</div>
      </div>`;
    }

    function toggleFav(p){
      if(favs.includes(p))favs=favs.filter(i=>i!==p);else favs.push(p);
      setLS(LS_KEY_FAV,favs);renderApps();
    }

    document.getElementById('searchInput').addEventListener('input',function(){
      searchQuery=this.value.trim();
      document.getElementById('searchClear').classList.toggle('show',!!searchQuery);
      renderApps();
    });
    document.getElementById('searchInput').addEventListener('keydown',function(e){
      if(e.key==='Enter'&&searchQuery){
        history=history.filter(h=>h!==searchQuery);
        history.unshift(searchQuery);
        if(history.length>10)history=history.slice(0,10);
        setLS(LS_KEY_HIST,history);renderHistory();
      }
    });
    document.getElementById('searchClear').addEventListener('click',function(){
      document.getElementById('searchInput').value='';searchQuery='';this.classList.remove('show');renderApps();
    });

    fetch('./_list.json').then(r=>r.json()).then(d=>{
      apps=d.apps||[];renderApps();
    }).catch(()=>{document.getElementById('content').innerHTML='<div class="empty">暂无应用</div>'});
  </script>
</body>
</html>
