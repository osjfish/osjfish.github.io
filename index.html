<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>小应用导航</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  :root{
    --zhu:#A93226;
    --zhu-light:#C0392B;
    --xuan:#FDF6E3;
    --xuan-dark:#F5E6C8;
    --shui:#2C3E50;
    --shui-light:#34495E;
    --gold:#B8860B;
  }
  body{
    font-family:"Noto Sans SC",sans-serif;
    background:var(--xuan);
    min-height:100vh;
    color:var(--shui);
  }

  .header{
    background:var(--shui);
    padding:20px 24px 16px;
    position:sticky;top:0;z-index:100;
    box-shadow:0 2px 12px rgba(0,0,0,.15);
  }
  .header-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
  .logo{font-size:20px;font-weight:700;color:var(--xuan);letter-spacing:4px}
  .logo span{color:var(--zhu);font-size:26px;margin-right:2px}


  .search-box{
    display:flex;gap:8px;align-items:center;
  }
  .search-wrap{
    flex:1;position:relative;
  }
  .search-wrap input{
    width:100%;padding:8px 12px 8px 12px;
    border:1px solid rgba(255,255,255,.15);
    border-radius:8px;background:rgba(255,255,255,.08);
    color:#fff;font-size:13px;outline:none;
    transition:border-color .2s;
  }
  .search-wrap input::placeholder{color:rgba(255,255,255,.35)}
  .search-wrap input:focus{border-color:var(--zhu)}
  .search-clear{
    position:absolute;right:8px;top:50%;transform:translateY(-50%);
    color:rgba(255,255,255,.4);cursor:pointer;font-size:16px;
    display:none;line-height:1;
  }
  .search-clear.show{display:block}

  .main{padding:16px 24px 40px;max-width:900px;margin:0 auto}

  .section-title{
    font-size:13px;color:var(--shui-light);margin:16px 0 10px;
    display:flex;align-items:center;gap:6px;
    padding-bottom:6px;border-bottom:1px solid rgba(0,0,0,.06);
  }
  .section-title::before{
    content:'';width:3px;height:12px;background:var(--zhu);border-radius:2px;
  }

  .grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:12px;
  }
  .card{
    border-radius:12px;padding:18px 12px;height:96px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    text-align:center;text-decoration:none;overflow:hidden;
    transition:transform .25s,box-shadow .25s,border-color .25s;
    box-shadow:0 1px 3px rgba(44,62,80,.05);
    position:relative;cursor:pointer;border:1px solid;
  }
  .card:hover{
    transform:translateY(-3px);
  }
  .cat-工作{
    background:linear-gradient(180deg,#FCFDFF,#E3EBF5);
    border-color:rgba(51,80,122,.42);
  }
  .cat-工作:hover{border-color:#33507A;box-shadow:0 8px 22px rgba(51,80,122,.22)}
  .cat-生活{
    background:linear-gradient(180deg,#FCFEFC,#E2EEE6);
    border-color:rgba(59,106,82,.44);
  }
  .cat-生活:hover{border-color:#3B6A52;box-shadow:0 8px 22px rgba(59,106,82,.22)}
  .cat-游戏{
    background:linear-gradient(180deg,#FEFDFF,#EEE7F4);
    border-color:rgba(94,74,112,.44);
  }
  .cat-游戏:hover{border-color:#5E4A70;box-shadow:0 8px 22px rgba(94,74,112,.22)}
  .cat-教育{
    background:linear-gradient(180deg,#FEFCF4,#F4E9CD);
    border-color:rgba(154,113,17,.44);
  }
  .cat-教育:hover{border-color:#9A7111;box-shadow:0 8px 22px rgba(154,113,17,.22)}
  .cat-其他{
    background:linear-gradient(180deg,#FEFEFE,#EAEDEF);
    border-color:rgba(80,84,92,.42);
  }
  .cat-其他:hover{border-color:#50545C;box-shadow:0 8px 22px rgba(80,84,92,.22)}
  .cat-演示{
    background:linear-gradient(180deg,#FFFEFC,#FCE8E0);
    border-color:rgba(169,50,38,.44);
  }
  .cat-演示:hover{border-color:#A93226;box-shadow:0 8px 22px rgba(169,50,38,.22)}
  .fav-btn{
    position:absolute;top:8px;right:8px;
    width:26px;height:26px;border-radius:50%;border:none;
    background:transparent;cursor:pointer;font-size:13px;
    display:flex;align-items:center;justify-content:center;
    transition:all .2s;color:#ccc;opacity:.55;
  }
  .fav-btn:hover{background:rgba(169,50,38,.08);color:#aaa;opacity:1}
  .fav-btn.active{color:var(--gold);opacity:1}
  .name{
    font-size:13px;font-weight:400;line-height:1.5;
    letter-spacing:.5px;word-break:break-all;
    padding:0 24px;color:#333A45;
  }
  .cat-工作 .name{color:#33507A}
  .cat-生活 .name{color:#3B6A52}
  .cat-游戏 .name{color:#5E4A70}
  .cat-教育 .name{color:#8A650D}
  .cat-其他 .name{color:#50545C}
  .cat-演示 .name{color:#A93226}

  .history-bar{
    display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;
  }
  .history-tag{
    padding:3px 10px;border-radius:12px;font-size:11px;
    background:var(--xuan-dark);color:var(--shui-light);
    cursor:pointer;border:1px solid rgba(0,0,0,.06);
    transition:all .2s;
  }
  .history-tag:hover{border-color:var(--zhu);color:var(--zhu)}
  .history-tag .del{
    margin-left:4px;font-size:10px;color:#bbb;cursor:pointer;
  }
  .history-tag .del:hover{color:var(--zhu)}
  .history-clear{
    padding:3px 10px;border-radius:12px;font-size:11px;
    background:none;color:#bbb;cursor:pointer;border:1px solid transparent;
  }
  .history-clear:hover{color:var(--zhu);border-color:var(--zhu)}

  .empty{text-align:center;color:var(--shui-light);padding:60px 0;font-size:14px;opacity:.5}
  #toast{
    position:fixed;left:50%;bottom:36px;transform:translateX(-50%) translateY(8px);
    background:var(--shui);color:#fff;font-size:12px;letter-spacing:1px;
    padding:8px 18px;border-radius:20px;box-shadow:0 4px 14px rgba(0,0,0,.2);
    opacity:0;pointer-events:none;transition:opacity .3s,transform .3s;z-index:200;
  }
  #toast.show{opacity:.95;transform:translateX(-50%) translateY(0)}
  .footer{text-align:center;padding:20px 0 12px;font-size:11px;color:#999;line-height:2.2}
  .footer div{display:flex;justify-content:center;align-items:center;gap:0;flex-wrap:wrap}
  .footer a{color:#999;text-decoration:none;display:inline-flex;align-items:center;gap:3px;flex-wrap:nowrap}
  .footer a:hover{color:#666}
  .footer .sep{margin:0 8px;opacity:.3}
  .footer img{height:15px;vertical-align:-2px}

  @media(max-width:480px){
    .header{padding:14px 16px 12px}
    .main{padding:12px 16px 32px}
    .grid{grid-template-columns:repeat(3,1fr);gap:10px}
    .card{height:96px;padding:22px 6px}
    .fav-btn{top:3px;right:3px;width:18px;height:18px;font-size:11px}
    .name{padding:0 4px;font-size:12px;line-height:1.4}
    .logo{font-size:17px;letter-spacing:2px}
    .logo span{font-size:22px}
  }
</style>
</head>
<body>
  <div class="header">
    <div class="search-box">
      <div class="search-wrap">
        <input type="text" id="searchInput" placeholder="搜索应用..." autocomplete="off">
        <span class="search-clear" id="searchClear">&times;</span>
      </div>
    </div>
  </div>

  <div class="main">
    <div id="historyBar" class="history-bar" style="display:none"></div>
    <div id="content"></div>
  </div>
  

  <div class="footer">
    <div><a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2026024789号</a> <span class="sep">|</span> <a href="https://beian.miit.gov.cn/" target="_blank" rel="noopener">鄂ICP备2026024789号-2</a></div>
    <div><a href="https://beian.mps.gov.cn/#/query/webSearch?code=42010402001734" target="_blank" rel="noreferrer"><img src="https://beian.mps.gov.cn/web/assets/logo01.6189a29f.png" alt="公安备案"> 鄂公网安备42010402001734号</a> <span class="sep">|</span> <a href="https://beian.mps.gov.cn/#/query/webSearch?code=42010402001801" target="_blank" rel="noreferrer"><img src="https://beian.mps.gov.cn/web/assets/logo01.6189a29f.png" alt="公安备案"> 鄂公网安备42010402001801号</a></div>
  </div>

  <script src="./lib/common.js"></script>
  <script>
    const LS_KEY_FAV='nav_favorites';
    const LS_KEY_HIST='nav_history';
    const LS_KEY_UNLOCK='nav_hidden_unlock';
    const UNLOCK_MS=7*24*60*60*1000;
    const { esc } = window.AppUtils;
    let apps=[], hiddenApps=[], favs=getLS(LS_KEY_FAV), history=getLS(LS_KEY_HIST);
    let searchQuery='';
    let hiddenPayload=null;

    function getLS(k){try{return JSON.parse(localStorage.getItem(k))||[]}catch(e){return[]}}
    function setLS(k,v){localStorage.setItem(k,JSON.stringify(v))}

    function isUnlocked(){
      try{
        const d=JSON.parse(localStorage.getItem(LS_KEY_UNLOCK));
        if(d&&typeof d.exp==='number'&&d.exp>Date.now())return true;
        if(d)localStorage.removeItem(LS_KEY_UNLOCK);
      }catch(e){localStorage.removeItem(LS_KEY_UNLOCK)}
      return false;
    }
    function loadHiddenCache(){
      if(!isUnlocked())return;
      try{
        const d=JSON.parse(localStorage.getItem(LS_KEY_UNLOCK));
        if(Array.isArray(d.apps))hiddenApps=d.apps;
      }catch(e){}
    }
    function b64u8(b){try{return Uint8Array.from(atob(b),c=>c.charCodeAt(0))}catch(e){return null}}
    async function tryUnlock(word){
      if(!hiddenPayload||!crypto||!crypto.subtle||!word)return false;
      try{
        const salt=b64u8(hiddenPayload.salt), iv=b64u8(hiddenPayload.iv), data=b64u8(hiddenPayload.data);
        if(!salt||!iv||!data)return false;
        const baseKey=await crypto.subtle.importKey('raw',new TextEncoder().encode(word),'PBKDF2',false,['deriveKey']);
        const key=await crypto.subtle.deriveKey(
          {name:'PBKDF2',salt:salt,iterations:hiddenPayload.iter,hash:'SHA-256'},
          baseKey,{name:'AES-GCM',length:256},false,['decrypt']);
        const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:iv},key,data);
        hiddenApps=JSON.parse(new TextDecoder().decode(pt));
        setLS(LS_KEY_UNLOCK,{exp:Date.now()+UNLOCK_MS,apps:hiddenApps});
        return true;
      }catch(e){return false}
    }

    function renderHistory(){
      const bar=document.getElementById('historyBar');
      if(!history.length||searchQuery){bar.style.display='none';return}
      bar.style.display='flex';
      // 用户输入经 esc() 转义，参数走 data-value + 事件委托，杜绝注入
      bar.innerHTML=history.map(h=>
        `<span class="history-tag" data-value="${esc(h)}">${esc(h)}<span class="del" data-value="${esc(h)}">&times;</span></span>`
      ).join('')+(history.length?`<span class="history-clear" onclick="clearHistory()">清</span>`:'');
    }

    document.getElementById('historyBar').addEventListener('click',function(e){
      const tag=e.target.closest('.history-tag');
      if(!tag)return;
      if(e.target.classList.contains('del')){delHistory(e.target.dataset.value);}
      else{doSearch(tag.dataset.value||'');}
    });
    function doSearch(q){document.getElementById('searchInput').value=q;searchQuery=q;renderApps()}
    function delHistory(h){history=history.filter(i=>i!==h);setLS(LS_KEY_HIST,history);renderHistory()}
    function clearHistory(){history=[];setLS(LS_KEY_HIST,history);renderHistory()}

    function renderApps(){
      const c=document.getElementById('content');
      renderHistory();
      const unlocked=isUnlocked();
      let list=unlocked?apps.concat(hiddenApps):apps;
      if(searchQuery){
        const q=searchQuery.toLowerCase();
        list=list.filter(a=>a.name.toLowerCase().includes(q)||a.path.toLowerCase().includes(q));
      }
      if(!list.length){c.innerHTML='<div class="empty">暂无应用</div>';return}
      const catOrder=unlocked?['工作','生活','演示','教育','游戏','其他']:['工作','生活','演示','其他'];
      let html='';
      const favsList=list.filter(a=>favs.includes(a.path));
      if(favsList.length&&!searchQuery){
        html+=`<div class="section-title">收藏</div><div class="grid">${favsList.map(cardHTML).join('')}</div>`;
      }
      for(const cat of catOrder){
        const items=list.filter(a=>(a.category||'其他')===cat);
        if(!items.length)continue;
        html+=`<div class="section-title">${cat} <span style="opacity:.5;font-weight:400">${items.length}</span></div><div class="grid">${items.map(cardHTML).join('')}</div>`;
      }
      c.innerHTML=html;
    }

    function cardHTML(a){
      const isFav=favs.includes(a.path);
      const cat=a.category||'工具';
      // name/path 来自 _list.json，仍统一转义防患未然
      return `<div class="card cat-${esc(cat)}" data-path="${esc(a.path)}">
        <button class="fav-btn ${isFav?'active':''}" data-path="${esc(a.path)}">${isFav?'&#9733;':'&#9734;'}</button>
        <div class="name">${esc(a.name)}</div>
      </div>`;
    }

    document.getElementById('content').addEventListener('click',function(e){
      const fav=e.target.closest('.fav-btn');
      if(fav){e.stopPropagation();toggleFav(fav.dataset.path);return;}
      const card=e.target.closest('.card');
      if(card&&card.dataset.path){window.location.href=card.dataset.path;}
    });

    function toggleFav(p){
      if(favs.includes(p))favs=favs.filter(i=>i!==p);else favs.push(p);
      setLS(LS_KEY_FAV,favs);renderApps();
    }

    function showToast(msg){
      let t=document.getElementById('toast');
      if(!t){t=document.createElement('div');t.id='toast';document.body.appendChild(t)}
      t.textContent=msg;t.classList.add('show');
      clearTimeout(showToast._timer);
      showToast._timer=setTimeout(()=>t.classList.remove('show'),2200);
    }

    document.getElementById('searchInput').addEventListener('input',function(){
      const val=this.value.trim();
      searchQuery=val;
      document.getElementById('searchClear').classList.toggle('show',!!searchQuery);
      renderApps();
      if(val.length>=3){
        clearTimeout(tryUnlock._t);
        tryUnlock._t=setTimeout(()=>tryUnlock(val).then(ok=>{
          if(ok){
            const inp=document.getElementById('searchInput');
            inp.value='';searchQuery='';
            document.getElementById('searchClear').classList.remove('show');
            renderApps();showToast('已解锁隐藏板块，7 天内有效');
          }
        }),300);
      }
    });
    document.getElementById('searchInput').addEventListener('keydown',function(e){
      if(e.key==='Enter'&&searchQuery){
        history=history.filter(h=>h!==searchQuery);
        history.unshift(searchQuery);
        if(history.length>10)history=history.slice(0,10);
        setLS(LS_KEY_HIST,history);renderHistory();
      }
    });
    document.getElementById('searchClear').addEventListener('click',function(){
      document.getElementById('searchInput').value='';searchQuery='';this.classList.remove('show');renderApps();
    });

    fetch('./_list.json').then(r=>r.json()).then(d=>{
      apps=d.apps||[];hiddenPayload=d.hidden||null;
      if(hiddenPayload){hiddenApps=[];loadHiddenCache();}
      renderApps();
    }).catch(()=>{document.getElementById('content').innerHTML='<div class="empty">暂无应用</div>'});
  </script>
</body>
</html>
