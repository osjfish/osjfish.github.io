<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>足球经理</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#0a0e14; color:#dfe7f2; font-family:"Segoe UI","Microsoft YaHei",sans-serif; user-select:none; }
  button { color:inherit; }
  #wrap { position:fixed; inset:0; display:flex; align-items:center; justify-content:center; }
  canvas { display:block; background:#1a8f3c; box-shadow:0 0 60px rgba(0,0,0,.6); }
  #top { position:fixed; left:50%; top:0; transform:translateX(-50%); z-index:10; display:flex; align-items:center; gap:12px;
    background:rgba(8,12,20,.9); border:1px solid rgba(255,255,255,.14); border-bottom-left-radius:12px; border-bottom-right-radius:12px;
    padding:5px 16px; font-size:13px; color:#dfe7f2; }
  #top .nm { font-weight:800; color:#3ddc7a; }
  #top .sc { font-size:20px; font-weight:900; min-width:26px; text-align:center; }
  #top .ck { color:#ffe08a; font-weight:800; min-width:54px; text-align:center; }
  #top .mt { color:#8fa3bd; font-size:11px; }
  #screen { position:fixed; inset:0; z-index:20; display:flex; justify-content:center; align-items:flex-start;
    background:radial-gradient(1200px 500px at 50% -10%, rgba(61,220,122,.05), transparent 60%), #0a0e14;
    overflow-y:auto; padding:14px 16px 40px; }
  #screen.hide { display:none; }
  #screen > .card { background:transparent; border:0; box-shadow:none; max-width:1000px; width:100%; max-height:none; padding:0; overflow:visible; }
  #screen > .card h1 { text-align:left; margin-bottom:10px; }
  #screen .tabs { justify-content:flex-start; gap:8px; margin-bottom:14px; }
  #screen .tab { border:1px solid rgba(255,255,255,.12); background:rgba(17,24,38,.7); border-radius:10px; padding:7px 16px; font-size:12px; }
  #screen .tab.sel { border-color:#3ddc7a; color:#3ddc7a; background:rgba(61,220,122,.1); }
  #screen .section-title { font-size:11px; color:#8fa3bd; margin:14px 0 6px; font-weight:800; letter-spacing:1px;
    border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:6px; }
  .hide { display:none !important; }
  /* ===== 看板布局 ===== */
  #dash { position:fixed; inset:0; z-index:15; display:flex; flex-direction:column; background:
    radial-gradient(1200px 500px at 50% -10%, rgba(61,220,122,.06), transparent 60%),
    radial-gradient(900px 400px at 90% 110%, rgba(87,200,255,.05), transparent 60%), #0a0e14;
    overflow:hidden; }
  #dash.hide { display:none; }
  .dash-top { display:flex; align-items:center; gap:10px; padding:10px 18px; flex-wrap:wrap;
    background:rgba(8,12,20,.85); border-bottom:1px solid rgba(255,255,255,.08); font-size:13px; color:#dfe7f2; z-index:2; }
  .dash-top b { font-size:16px; }
  .d-chip { background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:8px; padding:3px 10px; font-size:11px; font-weight:800; color:#cfd8e3; }
  .d-chip.green { border-color:rgba(61,220,122,.4); color:#3ddc7a; background:rgba(61,220,122,.1); }
  .d-chip.dim { color:#8fa3bd; font-weight:700; }
  .d-form { font-size:11px; color:#8fa3bd; letter-spacing:2px; }
  .d-cash { font-size:15px; font-weight:900; color:#ffd857; }
  /* 工作台：侧边栏 + 主区 */
  .dash-body { flex:1; display:flex; min-height:0; }
  .dash-side { width:164px; flex-shrink:0; padding:12px 10px; display:flex; flex-direction:column; gap:5px;
    border-right:1px solid rgba(255,255,255,.08); background:rgba(8,12,20,.55); overflow-y:auto; }
  .side-btn { cursor:pointer; text-align:left; border:1px solid rgba(255,255,255,.1); background:rgba(17,24,38,.75);
    color:#cfd8e3; border-radius:9px; padding:9px 12px; font-size:12px; font-weight:700; }
  .side-btn:hover { background:rgba(61,220,122,.12); border-color:rgba(61,220,122,.35); }
  .side-btn.sel { border-color:#3ddc7a; color:#3ddc7a; background:rgba(61,220,122,.12); }
  .side-btn .sd { display:block; font-size:9px; color:#8fa3bd; font-weight:600; margin-top:2px; }
  .dash-main { flex:1; overflow-y:auto; padding:12px 16px; min-width:0; }
  .main-view { display:none; }
  .main-view.show { display:block; }
  .main-title { font-size:16px; font-weight:900; color:#dfe7f2; letter-spacing:1px; margin-bottom:12px;
    background:linear-gradient(90deg,#57c8ff,#3ddc7a); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .main-view .p-title { margin-bottom:14px; }
  .dash-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .d-col { display:flex; flex-direction:column; gap:12px; min-width:0; }
  .panel { background:linear-gradient(180deg,rgba(17,24,38,.85),rgba(11,17,28,.85)); border:1px solid rgba(255,255,255,.1); border-radius:14px; padding:12px 14px; color:#dfe7f2;
    box-shadow:0 4px 18px rgba(0,0,0,.28), inset 0 1px 0 rgba(255,255,255,.04); }
  .panel:hover { border-color:rgba(255,255,255,.18); box-shadow:0 6px 24px rgba(0,0,0,.38); }
  .panel .p-title { font-size:11px; color:#8fa3bd; font-weight:800; letter-spacing:1px; margin-bottom:12px; display:flex; align-items:center; gap:6px;
    border-bottom:1px solid rgba(255,255,255,.08); padding-bottom:6px; }
  .panel .p-title .tag { margin-left:auto; font-size:9px; color:#8fa3bd; font-weight:600; }
  /* 资金卡 */
  .cash-big { font-size:30px; font-weight:900; color:#ffd857; line-height:1.1; }
  .cash-big small { font-size:12px; color:#8fa3bd; font-weight:700; }
  .flow-row { display:flex; align-items:center; gap:8px; margin-top:8px; font-size:11px; color:#8fa3bd; }
  .flow-bar { flex:1; height:10px; border-radius:6px; overflow:hidden; background:rgba(255,255,255,.08); display:flex; }
  .flow-in { background:linear-gradient(90deg,#2ecc71,#3ddc7a); height:100%; }
  .flow-out { background:linear-gradient(90deg,#ff6b81,#e74c3c); height:100%; }
  .fin-grid { display:grid; grid-template-columns:1fr 1fr; gap:4px 14px; margin-top:8px; font-size:11px; }
  .fin-grid .li { display:flex; justify-content:space-between; color:#8fa3bd; }
  .fin-grid .li b { color:#dfe7f2; font-weight:700; }
  .fin-grid .in b { color:#3ddc7a; }
  .fin-grid .out b { color:#ff6b81; }
  /* 本轮对阵卡 */
  .match-card { display:flex; align-items:center; gap:10px; padding:10px 0 4px; }
  .mc-side { flex:1; text-align:center; min-width:0; }
  .mc-side .nm2 { font-size:15px; font-weight:900; margin-top:3px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .mc-side .sub2 { font-size:10px; color:#8fa3bd; margin-top:2px; }
  .mc-vs { font-size:13px; font-weight:900; color:#8fa3bd; text-align:center; }
  .mc-vs .abl { font-size:11px; color:#57c8ff; }
  .home-tag { font-size:9px; font-weight:900; border-radius:4px; padding:1px 6px; background:rgba(61,220,122,.15); color:#3ddc7a; }
  .away-tag { font-size:9px; font-weight:900; border-radius:4px; padding:1px 6px; background:rgba(87,200,255,.15); color:#57c8ff; }
  .opp-info { font-size:11px; color:#8fa3bd; text-align:center; margin:6px 0 10px; line-height:1.6; }
  .opp-info b { color:#3ddc7a; }
  .btn-start { width:100%; }
  /* 积分榜 */
  .tbl { width:100%; border-collapse:collapse; font-size:11px; }
  .tbl th, .tbl td { padding:4px 3px; text-align:center; border-bottom:1px solid rgba(255,255,255,.06); }
  .tbl th { color:#8fa3bd; font-weight:600; font-size:10px; }
  .tbl .mine { color:#3ddc7a; font-weight:800; background:rgba(61,220,122,.06); }
  .tbl .pos { width:20px; font-weight:800; }
  .tbl .nm { text-align:left; }
  .zone { font-size:9px; font-weight:800; border-radius:3px; padding:0 4px; }
  .zone.champ { background:rgba(61,220,122,.2); color:#3ddc7a; }
  .zone.demote { background:rgba(255,70,90,.2); color:#ff6b81; }
  .zone.t1 { background:linear-gradient(135deg,#ffd857,#ff9f0a); color:#3a2b00; border-radius:4px; padding:1px 5px; }
  .zone.t2 { background:linear-gradient(135deg,#e3e8f0,#9aa7b8); color:#1c2430; border-radius:4px; padding:1px 5px; }
  .zone.t3 { background:linear-gradient(135deg,#e8b98a,#b06b2e); color:#2a1505; border-radius:4px; padding:1px 5px; }
  /* 本轮赛果 */
  .res-row { display:flex; align-items:center; gap:6px; font-size:11px; padding:4px 2px; border-bottom:1px solid rgba(255,255,255,.05); color:#cfd8e3; }
  .res-row .rn { flex:1; text-align:right; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .res-row .rd { flex:1; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .res-row .rs { font-weight:900; color:#3ddc7a; min-width:44px; text-align:center; }
  .res-row .rs.live { color:#ffe08a; }
  .res-row .rs.tbd { color:#5a6b80; }
  /* 消息流 */
  .news-item { font-size:11px; color:#cfd8e3; padding:5px 2px; border-bottom:1px dashed rgba(255,255,255,.06); line-height:1.5; }
  .news-item:last-child { border-bottom:0; }
  .news-item .t { color:#5a6b80; font-size:9px; margin-right:6px; }
  /* 首发面板 */
  .xi-row { display:flex; align-items:center; gap:6px; font-size:11px; padding:3px 0; }
  .xi-row .posb { width:30px; font-size:9px; font-weight:900; border-radius:4px; padding:1px 0; text-align:center; }
  .xi-row .posb.gk { background:rgba(46,204,113,.25); color:#2ecc71; }
  .xi-row .posb.df { background:rgba(61,169,255,.25); color:#57c8ff; }
  .xi-row .posb.mf { background:rgba(255,159,10,.25); color:#ff9f0a; }
  .xi-row .posb.fw { background:rgba(255,70,90,.25); color:#ff6b81; }
  .xi-row .nm3 { flex:1; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .xi-row .ab3 { font-weight:800; color:#3ddc7a; width:24px; text-align:right; }
  .xi-row .fit3 { width:44px; }
  .mbar { height:5px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; display:inline-block; vertical-align:middle; width:100%; }
  .mbar i { display:block; height:100%; background:#3ddc7a; }
  .mbar.low i { background:#ff6b81; }
  /* 底部操作条 */
  .dash-bar { display:flex; gap:8px; padding:10px 16px; background:rgba(8,12,20,.9); border-top:1px solid rgba(255,255,255,.08); overflow-x:auto; flex-shrink:0; }
  .dash-bar .btn { flex:1; white-space:nowrap; }
  /* 设施 */
  .fac-lv { font-size:12px; font-weight:900; border-radius:6px; padding:2px 9px; background:rgba(87,200,255,.15); color:#57c8ff; }
  .fac-item .btn.sm { padding:4px 10px; font-size:11px; }
  .fac-prog { width:56px; height:6px; background:rgba(255,255,255,.1); border-radius:3px; overflow:hidden; display:inline-block; }
  .fac-prog i { display:block; height:100%; background:linear-gradient(90deg,#57c8ff,#3ddc7a); }
  .fac-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .card3 { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; }
  @media (max-width:1100px){ .card3 { grid-template-columns:repeat(2,1fr); } .fac-grid { grid-template-columns:1fr; } }
  @media (max-width:760px){ .card3 { grid-template-columns:1fr; } }
  .fac-item { padding:12px 14px; background:linear-gradient(180deg,rgba(20,28,42,.9),rgba(13,19,31,.9));
    border:1px solid rgba(255,255,255,.1); border-radius:12px; box-shadow:0 3px 12px rgba(0,0,0,.25); }
  .fac-item:hover { border-color:rgba(61,220,122,.3); }
  .inv-row { display:flex; align-items:center; gap:8px; font-size:13px; padding:8px 4px; border-bottom:1px solid rgba(255,255,255,.05); flex-wrap:wrap; }
  .inv-row .inv-l { font-size:13px; font-weight:800; min-width:80px; }
  .inv-row .btn.sm { padding:4px 10px; font-size:11px; }
  @media (max-width:760px) { .fac-grid { grid-template-columns:1fr; } }
  /* 底部操作条（移动端横向） */
  @media (max-width:1100px) {
    .dash-grid { grid-template-columns:1fr 1fr; }
    .d-col:last-child { grid-column:1/-1; display:grid; grid-template-columns:1fr 1fr; }
  }
  @media (max-width:760px) {
    .dash-body { flex-direction:column; }
    .dash-side { width:100%; flex-direction:row; overflow-x:auto; border-right:0; border-bottom:1px solid rgba(255,255,255,.08); padding:8px; }
    .side-btn { flex:0 0 auto; padding:7px 12px; font-size:11px; }
    .side-btn .sd { display:none; }
    .dash-main { padding:10px; }
    .dash-grid { grid-template-columns:1fr; }
    .d-col, .d-col:last-child { grid-column:auto; display:flex; }
    .dash-top { padding:8px 10px; gap:6px; font-size:12px; }
    .dash-top b { font-size:14px; }
    .cash-big { font-size:24px; }
  }
  /* 大屏放大：工作台整体缩放，字号自然变大 */
  @media (min-width:1500px) { #dash { zoom:1.12; } }
  @media (min-width:1900px) { #dash { zoom:1.25; } }
  .card { background:linear-gradient(180deg,#111826,#0b111c); border:1px solid rgba(255,255,255,.12); border-radius:18px; padding:18px 22px; max-width:820px; width:97%; max-height:94vh; overflow-y:auto; color:#dfe7f2; }
  .card h1 { font-size:24px; letter-spacing:2px; background:linear-gradient(90deg,#57c8ff,#3ddc7a); -webkit-background-clip:text; background-clip:text; color:transparent; margin-bottom:6px; text-align:center; }
  .tabs { display:flex; gap:6px; justify-content:center; margin-bottom:12px; flex-wrap:wrap; }
  .tab { cursor:pointer; border:1px solid rgba(255,255,255,.2); background:rgba(20,28,42,.8); color:#cfd8e3; border-radius:8px; padding:6px 14px; font-size:13px; font-weight:700; }
  .tab.sel { border-color:#3ddc7a; color:#3ddc7a; background:rgba(61,220,122,.1); }
  .view { display:none; }
  .view.show { display:block; }
  .form-row { display:flex; gap:6px; justify-content:center; margin-bottom:8px; flex-wrap:wrap; }
  .fbtn { cursor:pointer; border:1px solid rgba(255,255,255,.25); background:rgba(20,28,42,.8); color:#dfe7f2; border-radius:8px; padding:5px 12px; font-size:12px; }
  .fbtn.sel { border-color:#3ddc7a; color:#3ddc7a; }
  .pitch { position:relative; width:300px; height:380px; margin:0 auto; background:linear-gradient(180deg,#2b8f47,#1f7a38); border:2px solid rgba(255,255,255,.5); border-radius:6px; }
  .slot { position:absolute; width:42px; height:42px; transform:translate(-50%,-50%); border-radius:50%; display:flex; flex-direction:column; align-items:center; justify-content:center;
    font-size:9px; font-weight:800; color:#fff; cursor:pointer; border:2px solid rgba(255,255,255,.6); background:rgba(0,0,0,.35); text-align:center; line-height:1.05; }
  .slot.empty { border-style:dashed; color:rgba(255,255,255,.4); font-size:14px; }
  .slot.gk { background:rgba(46,204,113,.55); }
  .slot.df { background:rgba(61,169,255,.45); }
  .slot.mf { background:rgba(255,159,10,.45); }
  .slot.fw { background:rgba(255,70,90,.5); }
  .squad-list { margin-top:8px; display:flex; flex-wrap:wrap; gap:5px; justify-content:center; max-height:180px; overflow-y:auto; }
  .lu-wrap { display:flex; gap:14px; align-items:flex-start; }
  .lu-left { flex:0 0 300px; }
  .lu-mid { flex:1; min-width:0; }
  .lu-right { flex:1; min-width:0; }
  .lu-col-title { font-size:12px; font-weight:800; color:#8fa3bd; margin-bottom:6px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:5px; }
  .lu-col-list { display:flex; flex-direction:column; gap:4px; max-height:440px; overflow-y:auto; }
  .lu-row { display:flex; align-items:center; gap:8px; cursor:pointer; border:1px solid rgba(255,255,255,.1); border-radius:8px;
    padding:6px 10px; font-size:12px; background:rgba(20,28,42,.8); min-width:0; }
  .lu-row:hover { background:rgba(61,220,122,.1); }
  .lu-row.sel { border-color:#ffe08a; background:rgba(255,224,138,.08); }
  .lu-row .lu-pos { width:34px; text-align:center; font-size:10px; font-weight:900; border-radius:4px; padding:2px 0; }
  .lu-row .lu-name { flex:1 1 auto; min-width:0; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lu-row .lu-pos, .lu-row .lu-ab, .lu-row .lu-age, .lu-row .lu-fit, .lu-row .lu-st, .lu-row .btn { flex:0 0 auto; }
  .lu-row .lu-ab { font-weight:900; color:#3ddc7a; width:30px; text-align:right; }
  .lu-row .lu-attr { color:#8fa3bd; font-size:10px; white-space:nowrap; }
  .lu-row .lu-age { color:#8fa3bd; font-size:10px; width:34px; text-align:center; }
  .lu-row .lu-fit { width:48px; }
  .lu-row .lu-st { font-size:9px; font-weight:800; color:#ffe08a; width:40px; text-align:center; }
  .lu-row .lu-st.sub { color:#8fa3bd; }
  .lu-row .inj { color:#ff6b81; font-weight:800; }
  /* 转会市场左右 */
  .tr-wrap { display:flex; gap:14px; align-items:flex-start; }
  .tr-left { flex:1.2; min-width:0; }
  .tr-right { flex:1; min-width:0; }
  .tr-head { font-size:12px; color:#8fa3bd; font-weight:800; letter-spacing:1px; border-bottom:1px solid rgba(255,255,255,.1); padding-bottom:6px; }
  /* 赛程左右并列 */
  .fx-head { margin-bottom:10px; }
  .fx-wrap { display:flex; gap:14px; align-items:flex-start; }
  .fx-col { flex:1; min-width:0; }
  @media (max-width:820px) {
    .tr-wrap, .fx-wrap { flex-direction:column; }
    .tr-left, .tr-right, .fx-col { width:100%; }
  }
  /* 平板等中等宽度：阵容列表换行、隐藏次要信息，确保球员名字完整显示 */
  @media (max-width:1150px) {
    .lu-wrap { flex-wrap:wrap; }
    .lu-left { flex:0 0 auto; }
    .lu-mid, .lu-right { flex:1 1 280px; min-width:280px; }
    .lu-row .lu-attr, .lu-row .lu-age { display:none; }
  }
  @media (max-width:820px) {
    .lu-wrap { flex-direction:column; align-items:center; }
    .lu-right { width:100%; }
    .lu-row .lu-attr { display:none; }
  }
  .pcard { cursor:pointer; border:1px solid rgba(255,255,255,.2); border-radius:8px; padding:4px 8px; font-size:11px; background:rgba(20,28,42,.8); width:138px; text-align:center; }
  .pcard.sel { border-color:#ffe08a; background:rgba(255,224,138,.12); }
  .pcard .pn { font-weight:800; }
  .pcard .pa { color:#3ddc7a; font-weight:700; }
  .pcard .meta { color:#8fa3bd; font-size:9px; }
  .btn { cursor:pointer; border:0; border-radius:10px; padding:9px 30px; font-size:14px; font-weight:800; color:#081018; background:linear-gradient(90deg,#57c8ff,#3ddc7a); }
  .btn:disabled { opacity:.5; cursor:default; }
  .btn.sm { padding:5px 12px; font-size:11px; }
  table { width:100%; border-collapse:collapse; font-size:11px; margin-top:6px; }
  th,td { padding:4px 5px; text-align:center; border-bottom:1px solid rgba(255,255,255,.08); }
  th { color:#8fa3bd; font-weight:600; }
  .mine { color:#3ddc7a; font-weight:800; }
  #events { position:fixed; left:50%; bottom:8px; transform:translateX(-50%); z-index:11; width:min(560px,92vw); max-height:110px; overflow:hidden;
    background:rgba(8,12,20,.85); border:1px solid rgba(255,255,255,.12); border-radius:10px; padding:6px 12px; font-size:11px; color:#cfd8e3; pointer-events:none; }
  #events .ev { padding:1px 0; }
  #events .ev.goal { color:#ffe08a; font-weight:800; }
  #controls { position:fixed; right:10px; bottom:10px; z-index:11; display:flex; flex-direction:column; gap:6px; }
  #controls .btn { padding:9px 18px; font-size:16px; }
  #tacList { position:fixed; right:10px; bottom:210px; z-index:12; width:210px; background:rgba(8,12,20,.96); border:1px solid rgba(255,255,255,.15); border-radius:10px; padding:10px; display:none; }

var PTYPES=[
  {id:'st', name:'前锋型', pos:'fw', tpl:{spd:6,  pow:2, tec:3, awa:1, sho:7,  gkp:-6}},

  {id:'def', name:'防守型', pos:'df', tpl:{spd:-2, pow:3, tec:1, awa:5, sho:-4, gkp:4}},
  {id:'gen', name:'天才型', pos:null, tpl:{spd:2,  pow:2, tec:3, awa:3, sho:2,  gkp:2}}
];
function ptypeById(id){ for(var i=0;i<PTYPES.length;i++){ if(PTYPES[i].id===id) return PTYPES[i]; } return PTYPES[0]; }
// 位置 → 合适的类型（各位置有小概率出现天才型；中场灵活：攻/守/天才）
function typeForPos(pos){
  if(Math.random()<0.12) return 'gen'; // 12% 概率任何位置都是天才型
  if(pos==='gk') return 'gk';
  if(pos==='df') return Math.random()<0.6?'df':'def';
  if(pos==='fw') return ['st','cf','atk'][(Math.random()*3)|0];
  return ['atk','def','gen'][(Math.random()*3)|0];
}
// 类型模板最大加成对应的基础能力上限（基础+加成上限=99，最强球员恰好99）
function centerCap(ptype){
  var t=ptype.tpl;
  return 99-Math.max(t.spd,t.pow,t.tec,t.awa,t.sho,t.gkp);
}
// 生成六维属性：按球员类型模板（base 为中心值，受上限约束；rngFn 提供随机）
function mkAttrs(rngFn,base,pos,ptype){
  var tpl=(ptype||ptypeById(typeForPos(pos))).tpl;
  var base2=Math.min(base,centerCap(ptype||ptypeById(typeForPos(pos))));
  var mk=function(bi){ return clamp(Math.round(base2+((rngFn()*22-11)|0)+bi),40,99); };
  return {spd:mk(tpl.spd),pow:mk(tpl.pow),tec:mk(tpl.tec),awa:mk(tpl.awa),sho:mk(tpl.sho),gkp:mk(tpl.gkp)};
}
function teamAbility(team){ var s=0,c=0; for(var i=0;i<team.length;i++){ if(team[i]){ s+=team[i].ab; c++; } } return c?s/c:0; }
// 速度影响移动；力量影响传球/射门力度；技巧影响过人/抢断/传射精准；意识影响跑动范围与走位；射门影响射门；守门影响门将
function pSpeed(p){ return (100+p.spd*0.5)*(0.7+0.3*p.fit/100)*(0.85+0.15*p.mor/100); }
function pAtk(p){ return 9+(p.sho-45)*0.55+(p.pow-45)*0.3; }
function pDef(p){ return 9+(p.tec-45)*0.4+(p.awa-45)*0.4; }
function pGk(p){ return 9+(p.gkp-45)*0.6; }
// 意识因子：跑动范围/走位幅度（0.8~1.6）
function awaFactor(p){ return clamp(0.7+p.awa*0.009,0.8,1.6); }
// 六维成长：随机提升 1-2 项（≤99），总评重算
function growAttrs(p){
  var keys=['spd','pow','tec','awa','sho','gkp'];
  var used={};
  var n=1+(Math.random()<0.4?1:0);
  for(var i=0;i<n;i++){
    var k=keys[(Math.random()*6)|0];
    if(used[k]) continue;
    used[k]=true;
    p[k]=Math.min(99,p[k]+1);
  }
  p.ab=calcAb(p);
}
// 六维老化：随机下降 1-2 项（≥40），总评重算
function ageAttrs(p){
  var keys=['spd','pow','tec','awa','sho','gkp'];
  var used={};
  var n=1+(Math.random()<0.4?1:0);
  for(var i=0;i<n;i++){
    var k=keys[(Math.random()*6)|0];
    if(used[k]) continue;
    used[k]=true;
    p[k]=Math.max(40,p[k]-1);
  }
  p.ab=calcAb(p);
}

// 效果曲线（线性从 Lv1 到 Lv20，收益递减感知：投入越大边际收益越小）
function facGate(lv){ return Math.round((1+0.0789*(lv-1))*100)/100; }      // 门票 1.0→2.5
function facGrowth(lv){ return Math.round((1+0.0474*(lv-1))*100)/100; }    // 成长 1.0→1.9

// 球员身价算法（买卖统一）：基础价按能力分级，再叠加 ±10% 波动
function basePrice(ab){
  return ab>=85?750:(ab>=75?400:(ab>=65?200:75));
}
function priceOf(ab,age){
  // 基础价按能力分级，叠加 ±10% 波动；年龄修正：越年轻越贵（18岁+25%，32岁-30%）
  var base=Math.round(basePrice(ab)*(0.9+Math.random()*0.2));
  var ageMul=1;
  if(age!==undefined&&age>0){
    ageMul=clamp(1.25-(age-18)*0.05,0.7,1.25); // 18岁1.25 → 32岁0.7
  }
  return Math.max(15,Math.round(base*ageMul));
}

// 赛季老化：全员年龄+1，34岁40%退役/35岁必退役，队伍不足18人自动补员
function seasonAging(){
  var retMsgs=[], newMsgs=[];
  for(var t=0;t<aiClubs.length;t++){
    var team=aiClubs[t];
    var ret=[];
    for(var i=team.squad.length-1;i>=0;i--){
      var pl=team.squad[i];
      pl.age++;
      var rp=pl.age>=35?1:(pl.age===34?0.4:0);
      if(Math.random()<rp){ ret.push(pl.name+'（'+pl.age+'岁）'); team.squad.splice(i,1); }
    }
    for(var e=0;e<team.eleven.length;e++){ if(team.eleven[e]&&team.squad.indexOf(team.eleven[e])<0) team.eleven[e]=null; }
    var added=[];
    while(team.squad.length<18){
      var na=uniqName(Math.random);
      var base=50+((Math.random()*15)|0);
      var pos=['gk','df','df','mf','mf','fw'][(Math.random()*6)|0];
      var pt2=ptypeById(typeForPos(pos));
      var attrs=mkAttrs(Math.random,base,pos,pt2);
      var kp={name:na,pos:pos,ptype:pt2.id,spd:attrs.spd,pow:attrs.pow,tec:attrs.tec,awa:attrs.awa,sho:attrs.sho,gkp:attrs.gkp,age:18+((Math.random()*3)|0),fit:90,mor:60,inj:0,played:0,goals:0,assists:0,rating:6.0};
      kp.ab=calcAb(kp);
      team.squad.push(kp); added.push(kp.name);
    }
    if(team.idx===myIdx){
      if(ret.length) retMsgs.push('👋 球员退役：'+ret.join('、'));
      if(added.length) newMsgs.push('🔍 球探补员：'+added.join('、'));
    }
  }
  window.ensureEleven();
  if(retMsgs.length) showMsg(retMsgs.join(' · '));
  if(newMsgs.length) showMsg(newMsgs.join(' · '));
}

function pickEvents(){
  var r=Math.random();
  var n=r<0.1?0:(r<0.6?1:(r<0.9?2:3));
  if(n===0) return [];
  var pool=EVENTS.slice(), picks=[];
  for(var i=0;i<n&&pool.length;i++){
    picks.push(pool.splice((Math.random()*pool.length)|0,1)[0]);
  }
  return picks;
}

function buildBriefs(){
  var briefs=[];
  var myRow=tableOf(myTier).filter(function(r){return r.idx===myIdx;})[0];
  if(!myRow) return briefs;
  var curRank=rankOf(myIdx)+1;
  var prev=myRow.prevRank;
  if(prev){
    if(curRank<prev) briefs.push('📊 排名上升 '+ (prev-curRank)+' 位，来到第 '+curRank+' 名！');
    else if(curRank>prev) briefs.push('📊 排名下降 '+(curRank-prev)+' 位，跌至第 '+curRank+' 名');
    else briefs.push('📊 排名保持第 '+curRank+' 名');
  }
  briefs.push('📈 战绩：'+myRow.w+'胜 '+myRow.d+'平 '+myRow.l+'负 · 进 '+myRow.gf+' 失 '+myRow.ga+' · 积分 '+myRow.pts);
  var scorers=myClub.squad.filter(function(q){return q.goals>0;}).sort(function(a,b){return b.goals-a.goals;});
  if(scorers.length) briefs.push('⚽ 队内射手王：'+scorers[0].name+'（'+scorers[0].goals+'球）');
  var hurt=myClub.squad.filter(function(q){return q.inj>0;});
  if(hurt.length) briefs.push('🩹 伤病名单：'+hurt.map(function(q){return q.name+'（缺'+q.inj+'轮）';}).join('、'));
  else briefs.push('🩹 球队全员健康，无伤病');

  var oppIdx=opponentOf(round);

// 应用事件效果（mul=增强倍数，fix=是否化解/增强）
function applyEvent(ev,fix){
  var eff=ev.eff;
  if(fix&&ev.fix) eff=ev.fix.fixEff&&Object.keys(ev.fix.fixEff).length?ev.fix.fixEff:null;
  if(fix&&ev.type==='good'&&ev.fix&&(!ev.fix.fixEff||!Object.keys(ev.fix.fixEff).length)) eff=null;
  var mul=1;
  if(fix&&ev.fix){
    if(ev.type==='bad'){ myClub.cash-=ev.fix.cost; }
    else { myClub.cash-=ev.fix.cost; if(!eff) { eff=ev.eff; mul=2; } }
  }
  if(!eff) return '';
  var msgs=[];
  if(eff.mor){ for(var i=0;i<myClub.squad.length;i++) myClub.squad[i].mor=clamp(myClub.squad[i].mor+eff.mor*mul,20,100); msgs.push('全队士气'+(eff.mor*mul>=0?'+':'')+eff.mor*mul); }
  if(eff.fit){ for(var j=0;j<myClub.squad.length;j++) myClub.squad[j].fit=clamp(myClub.squad[j].fit+eff.fit*mul,40,100); msgs.push('全队体能'+(eff.fit*mul>=0?'+':'')+eff.fit*mul); }
  if(eff.cash){ myClub.cash+=eff.cash*mul; msgs.push('资金'+(eff.cash*mul>=0?'+':'')+eff.cash*mul+'万'); }
  if(eff.inj){
    var pool=myClub.squad.filter(function(q){ return q.inj<=0; });
    if(pool.length){
      var hurt=pool[(Math.random()*pool.length)|0];
      hurt.inj=eff.inj.rounds; hurt.fit=40;
      msgs.push(hurt.name+'受伤缺阵'+hurt.inj+'轮');
    }
  }
  if(eff.heal){
    var hurtP=myClub.squad.filter(function(q){ return q.inj>0; });
    if(hurtP.length){ hurtP[0].inj=0; msgs.push(hurtP[0].name+'提前复出'); }
  }
  if(eff.homeBonus){ nextHomeBonus+=eff.homeBonus*mul; msgs.push('下轮主场加成'+(eff.homeBonus*mul>=0?'+':'')+eff.homeBonus*mul); }
  if(eff.oppDebuff){ oppDebuff+=eff.oppDebuff*mul; msgs.push('下轮对手实力'+(eff.oppDebuff*mul>=0?'-':'+')+Math.abs(eff.oppDebuff*mul)); }
  if(eff.gateBoost){ gateBoostRounds=Math.max(gateBoostRounds,eff.gateBoost*mul); msgs.push('门票收入'+(eff.gateBoost*mul>=0?'提升':'下降')); }
  if(eff.sponsorExtra){ sponsorExtra+=eff.sponsorExtra*mul; msgs.push('赞助合同金额+'+(eff.sponsorExtra*mul)+'万/轮'); }
  if(eff.youthBonus){ youthBonus+=eff.youthBonus*mul; msgs.push('赛季末青训新秀'+(eff.youthBonus*mul>=0?'+':'')+eff.youthBonus*mul+'名'); }
  if(eff.trainStop){ msgs.push('本周训练停滞'); }
  if(eff.youthBoost){ msgs.push('青训小将成长加速'); }
  if(eff.marketStrong){
    var pos=['gk','df','mf','fw'][(Math.random()*4)|0];
    var pool2=genSquad('event_'+Math.random(),80+((Math.random()*10)|0)).filter(function(q){ return q.pos===pos; });
    var star=pool2[(Math.random()*pool2.length)|0];
    star.age=18+((Math.random()*6)|0);
    star.price=Math.round(priceOf(star.ab,star.age)*(eff.marketDiscount?0.5:1)); // 独家谈判权：价格减半
    market.push(star);
    msgs.push('转会市场出现强援 '+star.name+'（'+star.ab+'）'+(eff.marketDiscount?'，独家价'+star.price+'万':''));
  }
  return msgs.join('，');
}
function eventText(eff){
  var s=[];
  if(eff.mor) s.push('士气 '+(eff.mor>=0?'+':'')+eff.mor);
  if(eff.fit) s.push('体能 '+(eff.fit>=0?'+':'')+eff.fit);
  if(eff.cash) s.push('资金 '+(eff.cash>=0?'+':'')+eff.cash+'万');
  if(eff.inj) s.push('随机球员伤停'+eff.inj.rounds+'轮');
  if(eff.heal) s.push('一名伤员提前复出');
  if(eff.homeBonus) s.push('下轮主场'+(eff.homeBonus>=0?'+':'')+eff.homeBonus);
  if(eff.oppDebuff) s.push('下轮对手'+(eff.oppDebuff>=0?'-':'+')+Math.abs(eff.oppDebuff));
  if(eff.gateBoost) s.push('门票'+(eff.gateBoost>=0?'提升':'下降'));
  if(eff.sponsorExtra) s.push('赞助每轮+'+(eff.sponsorExtra>=0?'+':'')+eff.sponsorExtra+'万');
  if(eff.youthBonus) s.push('青训新秀'+(eff.youthBonus>=0?'+':'')+eff.youthBonus);
  if(eff.trainStop) s.push('本周训练停滞');
  if(eff.youthBoost) s.push('青训小将成长');
  if(eff.marketStrong) s.push('市场出现强援');
  return s.join(' · ')||'无明显数值变化';
}

function stockTrade(si,hands){
  var st=invest.stocks[si];
  if(!st) return;
  var price=st.val; // 一手=1万份，成本=净值(万)
  var fee=3;
  if(hands>0){
    var cost=hands*price+fee;
    if(myClub.cash<cost){ showMsg('资金不足，买入 '+hands+' 手需 '+(hands*price+fee)+'万'); return; }
    myClub.cash-=cost;
    st.hands+=hands;
    st.cost=(st.cost||0)+cost; // 累计成本（含手续费）
    showMsg('📈 买入 '+st.name+' '+hands+' 手（均价 '+price+' 万/手 · 手续费3万）');
  } else {
    var sell=Math.min(-hands,st.hands);
    if(sell<=0){ showMsg('该股没有持仓'); return; }
    var avg=st.hands>0?(st.cost||0)/st.hands:0;
    myClub.cash+=sell*price-fee;
    st.hands-=sell;
    st.cost=Math.max(0,(st.cost||0)-sell*avg); // 成本按均价扣减
    showMsg('📉 卖出 '+st.name+' '+sell+' 手（均价 '+price+' 万/手 · 手续费3万）');
  }
  refreshUI();
}

function sponBand(){
  var myRank=rankOf(myIdx)+1;
  var globalRank=myTier==='A'?myRank:18+myRank; // A级占1-18名，B级占19-34名
  for(var i=0;i<SPON_TIERS.length;i++){
    if(globalRank<=SPON_TIERS[i].max) return SPON_TIERS[i];
  }
  return SPON_TIERS[7];
}
var sponCandidates=[];
var contracts=[];
function refreshSponCandidates(){
  var remainRounds=TOTAL_ROUNDS-round+1;
  if(remainRounds<2){ sponCandidates=[]; return; }
  var band=sponBand(); // 当前排名允许的最高档
  var bandIdx=SPON_TIERS.indexOf(band);
  // 商务中心设施：按比例提升赞助金额（满级 +100%）
  var sponMul=1+facSponBonus(facilities.commercial);
  // 每周生成 3 个新候选（档位 = 当前档及以下，排名低不会出现高额赞助）
  var next=[];
  var usedNames={};
  for(var i=0;i<3;i++){
    var nm=SPON_NAMES[(Math.random()*SPON_NAMES.length)|0];
    if(usedNames[nm]) continue;
    usedNames[nm]=true;
    var term=Math.min(4+((Math.random()*9)|0),Math.max(2,remainRounds));
    var tierIdx=bandIdx+((Math.random()*(SPON_TIERS.length-bandIdx))|0);
    var tb=SPON_TIERS[tierIdx];
    var baseV=Math.round(tb.min+((Math.random()*(tb.maxW-tb.min))|0));
    next.push({name:nm, tier:tb, base:baseV, perWeek:Math.round(baseV*sponMul), term:term});
  }
  sponCandidates=next;
}
function signSpon(i){
  var s=sponCandidates[i];
  if(!s) return;
  if(contracts.length>=2){ showMsg('最多同时持有 2 份赞助合同'); return; }
  var remainRounds=TOTAL_ROUNDS-round+1;
  var term=Math.min(s.term,remainRounds);
  if(term<1){ showMsg('本赛季剩余轮数不足'); return; }
  contracts.push({name:s.name, perWeek:s.perWeek, base:s.base||s.perWeek, remain:term});
  sponCandidates.splice(i,1);
  showMsg('🤝 与「'+s.name+'」签订赞助合同：每轮 +'+s.perWeek+'万，为期 '+term+' 轮');
  refreshUI();
}
function settleSpon(){
  for(var c=contracts.length-1;c>=0;c--){
    var ct=contracts[c];
    if(ct.remain>0){

function genFixtures(tier,rounds){
  var tbl=tableOf(tier);
  var n=tbl.length;
  var halfRounds=rounds/2; // 单循环轮数
  // 标准 circle method：固定最后一个元素，其余轮转，保证每对队伍恰好交手一次
  var arr=tbl.map(function(r){return r.idx;}); // 使用实际球队 idx（B级 idx 为18-33）
  var fixed=arr.pop();
  var m=arr.length; // n-1
  for(var r=1;r<=halfRounds;r++){
    var pairs=[];
    for(var i=0;i<Math.floor(n/2);i++){
      var h,a;
      if(i===0){ h=arr[0]; a=fixed; }
      else { h=arr[i]; a=arr[m-i]; }
      // 第一循环：奇数轮主队在前，偶数轮客队在前（交替）
      if(r%2===1) pairs.push([h,a]);
      else pairs.push([a,h]);
    }
    // 固定元素不动，其余轮转（右旋）
    arr.unshift(arr.pop());
    fixtures[tier][r]=pairs;
    // 第二循环：主客对调
    var pairs2=[];
    for(var i=0;i<pairs.length;i++){
      pairs2.push([pairs[i][1],pairs[i][0]]);
    }
    fixtures[tier][r+halfRounds]=pairs2;
  }
}

}

    // 旧档四维→六维迁移（spd/sho/def/pas → spd/pow/tec/awa/sho/gkp）
    var _migTeams=aiClubs.slice();
    if(myClub) _migTeams.push(myClub);
    for(var _mt=0;_mt<_migTeams.length;_mt++){
      var _msq=_migTeams[_mt].squad||[];
      for(var _mp=0;_mp<_msq.length;_mp++){
        var _pl=_msq[_mp];
        if(!_pl||_pl.gkp!==undefined) continue;
        var _os=_pl.spd||55,_osh=_pl.sho||55,_odf=_pl.def||55,_ops=_pl.pas||55;
        _pl.spd=Math.round(_os);
        _pl.pow=Math.round((_odf+_osh)/2);
        _pl.tec=Math.round((_ops+_osh)/2);
        _pl.awa=Math.round((_ops+_odf)/2);
        _pl.sho=Math.round(_osh);
        _pl.gkp=Math.round(_odf);
        _pl.ab=calcAb(_pl);
      }
    }
    if(market&&market.length){
      for(var _mk2=0;_mk2<market.length;_mk2++){
        var _mp2=market[_mk2];
        if(!_mp2||_mp2.gkp!==undefined) continue;
        var _os2=_mp2.spd||55,_osh2=_mp2.sho||55,_odf2=_mp2.def||55,_ops2=_mp2.pas||55;
        _mp2.spd=Math.round(_os2);
        _mp2.pow=Math.round((_odf2+_osh2)/2);
        _mp2.tec=Math.round((_ops2+_osh2)/2);
        _mp2.awa=Math.round((_ops2+_odf2)/2);
        _mp2.sho=Math.round(_osh2);
        _mp2.gkp=Math.round(_odf2);
        _mp2.ab=calcAb(_mp2);

    }
    if(!myClub.tactic) myClub.tactic='balanced';
    loadedMatchInterrupted=!!d.matchActive;
    match=null;
    return true;
  }catch(e){ return false; }
}

function params(team,home){
  var tac=team.tactic?tacticById(team.tactic):null;
  var att=tac?tac.mentality==='att':team.mentality==='att';
  var def=tac?tac.mentality==='def':team.mentality==='def';
  var pressV=tac?tac.press:team.press;
  var lineV=tac?tac.line:team.line;
  var ab=teamAbility(team.eleven)+(home?2:0);
  var hotN=0;
  for(var hk=0;hk<team.eleven.length;hk++){ if(team.eleven[hk]&&team.eleven[hk].hot) hotN++; }
  ab+=hotN*0.35;
  var morSum=0,morN=0;
  for(var mi=0;mi<team.eleven.length;mi++){ if(!team.eleven[mi]) continue; morSum+=team.eleven[mi].mor; morN++; }
  ab+=morN?(morSum/morN-50)*0.03:0;
  var pressMul=pressV==='high'?1.5:(pressV==='low'?0.7:1);
  var lineMul=lineV==='high'?1.25:(lineV==='low'?0.85:1);
  var shootMul=tac?tac.shootMul:(att?1.7:(def?0.8:1));
  var shootDist=tac?tac.shootDist:(att?500:(def?400:450));
  var forward=tac?tac.forward:(att?1.35:(def?0.85:1.1));
  var pressVal=(def?1.25:(att?0.95:1.1))*pressMul;
  var tackleMul=tac&&tac.tackleMul!==undefined?tac.tackleMul:1;
  var retreatMul=tac&&tac.retreatMul!==undefined?tac.retreatMul:1;
  return { shootMul:shootMul, shootDist:shootDist,
    press:pressVal, forward:forward, shift:(att?0.17:(def?0.08:0.13))*lineMul,
    tackle:clamp((0.03+ab*0.0009)*(0.85+0.3*pressVal/1.1)*tackleMul,0.03,0.15),
    retreat:retreatMul,
    shootRate:clamp(0.015+ab*0.0003,0.015,0.045),
    passAgg:tac?tac.passAgg:0.35, tempo:tac?tac.tempo:1.0, direct:tac?tac.direct:0.3,
    wing:tac?tac.wing:0.45, counter:tac?tac.counter:1.1, buildUp:(tac&&tac.direct>=0.8)?'direct':((tac&&tac.passAgg>=0.45)?'short':'mid') };
}
function doKickoff(m,team){
  m.phase='kickoff'; m.phaseT=1.2;
  // 全员按阵型比例分布在本方半场（保留 gk→fw 的梯度），非开球方在中圈外
  for(var i=0;i<m.players.length;i++){
    var p=m.players[i];
    if(p.team===0) p.x=Math.min(p.homeX*0.58,W/2-95);
    else p.x=Math.max(W-(W-p.homeX)*0.58,W/2+95);
    p.vx=0; p.vy=0;
  }
  m.ball={x:W/2,y:MIDY,vx:0,vy:0,owner:null,spin:0,trail:[],_zone:0};
  // 双人开球：主踢者持球站中圈，接应者站侧后方
  var taker=playersOf(m,team)[5];
  var partner=playersOf(m,team)[4];
  if(!partner) partner=taker;
  if(taker){ taker.x=W/2-18*(team===0?1:-1); taker.y=MIDY; m.ball.owner=taker; }
  if(partner&&partner!==taker){ partner.x=taker.x-34*(team===0?1:-1); partner.y=MIDY+22; }
  m.kickoffPair={taker:taker,partner:partner,team:team};
}
// 半场换边：队伍编号、场地位置、比分统计全部对调
function swapSides(m){
  for(var i=0;i<m.players.length;i++){
    var p=m.players[i];
    p.team=1-p.team;

function kickoffPass(m){
  var kp=m.kickoffPair;
  if(!kp||!kp.taker||!kp.partner||kp.taker===kp.partner) return;
  var dx=kp.partner.x-kp.taker.x,dy=kp.partner.y-kp.taker.y;
  var dd=Math.sqrt(dx*dx+dy*dy)||1;
  m.ball.owner=null;
  m.ball.vx=dx/dd*260;
  m.ball.vy=dy/dd*260;
  m.ball._passTx=kp.partner.x; m.ball._passTy=kp.partner.y;
  m.ball._passTo=kp.partner;

function spawnMatch(m){

        if(picked.pos!==order[o]){
          var orig=picked;
          picked={name:orig.name,pos:orig.pos,age:orig.age,fit:orig.fit,mor:orig.mor,inj:orig.inj,played:orig.played,goals:orig.goals,assists:orig.assists,rating:orig.rating,hot:orig.hot,
            spd:Math.round(orig.spd*0.8),pow:Math.round(orig.pow*0.8),tec:Math.round(orig.tec*0.8),awa:Math.round(orig.awa*0.8),sho:Math.round(orig.sho*0.8),gkp:Math.round(orig.gkp*0.8),_orig:orig};
          picked.ab=calcAb(picked);
        }

        m.players.push({team:home?0:1,pl:picked,role:order[o],x:W*0.06+t*W*0.88,y:list[k][1]*H*0.96+H*0.02,
          vx:0,vy:0,face:home?0:Math.PI,protect:0,shootCd:0,homeX:0,homeY:0});

  }
}
  place(m.home,true);

  for(var i=0;i<m.players.length;i++){ var p=m.players[i]; p.homeX=p.x; p.homeY=p.y; }
  doKickoff(m,0);
}
function playersOf(m,team){ return m.players.filter(function(p){ return p.team===team; }); }
function dist2(a,b){ var dx=a.x-b.x,dy=a.y-b.y; return dx*dx+dy*dy; }
function giveBall(m,p){
  var prevOwner=m.ball.owner;
  m.ball.owner=p; p.protect=1.0; p.shootCd=0; m.lastTouch=p.team;
  // 抢断/拦截成功 → 触发反击冲刺窗口；并清空助攻候选（球权易手）
  if(prevOwner&&prevOwner.team!==p.team){ m.counterT=1.6; m.counterTeam=p.team; m.lastPasser=null; }
}
function kickBall(m,shooter,power,angle){
  m.ball.owner=null;
  m.ball.x=shooter.x; m.ball.y=shooter.y;
  m.ball.vx=Math.cos(angle)*power;
  m.ball.vy=Math.sin(angle)*power;
  m.ball.lastShooter=shooter;
  shooter.shootCd=0.6;
  m.lastTouch=shooter.team;
}
// ---- AI（角色权重化分层决策）----
// 角色AI权重：射门/传球/盘带/逼抢倾向（df后卫 mf中场 fw前锋）
var ROLE_AI={
  df:{shoot:0.15, pass:0.85, dribble:0.18, press:1.1,  defend:1.3},
  mf:{shoot:0.55, pass:0.75, dribble:0.42, press:1.0,  defend:1.0},
  fw:{shoot:1.30, pass:0.35, dribble:0.80, press:1.20, defend:0.7}
};
function aiPlayer(m,p,dt){
  var b=m.ball, pr=p.pl;
  if(p.role==='gk'){ aiGK(m,p,dt); return; }
  // 紧急响应（不受决策间隙限制）：
  // 1) 队友传球给自己 → 立即迎球
  if(b._passTo===p&&b.owner!==p&&(p.role!=='df'||(p.team===0?b.x<W/2+60:b.x>W/2-60))){
    p.decT=0.06+Math.random()*0.08;
    p.lbx=b.x; p.lby=b.y;
    goTo(p,b.x,b.y,dt,1.15);
    return;
  }
  // 2) 无主球且自己是全队最近者 → 立即追球
  if(!b.owner&&b._passTo===undefined){
    var mn=nearestTo(m,p.team);
    if(p===mn&&dist2(p,b)<220*220&&(p.role!=='df'||(p.team===0?b.x<W/2+60:b.x>W/2-60))){
      var gkO=playersOf(m,1-p.team)[0];
      if(!(gkO&&dist2(gkO,b)<140*140)){
        p.decT=0.06+Math.random()*0.08;
        p.lbx=b.x; p.lby=b.y;
        goTo(p,b.x,b.y,dt,1);
        return;
      }
    }
  }
  // 决策间隙约0.1秒；球快速移动（传球/射门/抢断）时立即响应
  p.decT=(p.decT||0)-dt;
  var bd2=Math.abs(b.x-(p.lbx!==undefined?p.lbx:b.x))+Math.abs(b.y-(p.lby!==undefined?p.lby:b.y));
  if(p.decT>0&&bd2<140){
    if(p.face!==undefined&&(Math.abs(p.vx)+Math.abs(p.vy))<10){
      var attd=p.team===0?1:-1;
      p.vx=Math.cos(p.face)*pSpeed(pr)*0.9;
      p.vy=Math.sin(p.face)*pSpeed(pr)*0.9;
    }
    return;
  }
  p.decT=0.06+Math.random()*0.08;
  p.lbx=b.x; p.lby=b.y;
  if(b.owner===p) aiHold(m,p);
  else aiOff(m,p,dt);
}
// ===== 持球决策（按优先级）=====
function aiHold(m,p){
  var b=m.ball, pr=p.pl;
  var P=p.team===0?m.paramsHome:m.paramsAway;
  var att=p.team===0?1:-1, gateX=att>0?W:0;
  var dToGate=Math.abs(p.x-gateX);
  var RA=ROLE_AI[p.role]||ROLE_AI.mf;
  // 前方空间探测（110px 推进窗口）
  var aheadBlocked=false, ax=p.x+att*110;
  for(var abi=0;abi<m.players.length;abi++){
    var aq=m.players[abi];
    if(aq.team!==p.team&&aq.role!=='gk'&&Math.abs(aq.x-ax)<36&&Math.abs(aq.y-p.y)<48){ aheadBlocked=true; break; }
  }
  // 被逼抢探测
  var threat=false, near=null, nbd=1e9;
  for(var i=0;i<m.players.length;i++){
    var q=m.players[i];
    if(q.team!==p.team&&dist2(q,p)<70*70) threat=true;
    if(q.team!==p.team&&q.role!=='gk'&&dist2(q,p)<nbd){ nbd=dist2(q,p); near=q; }
  }
  var inBox=dToGate<175&&Math.abs(p.y-MIDY)<145;
  // 1) 边路传中（边路战术）
  if(P.wing>0.6&&Math.abs(p.y-MIDY)>90&&dToGate<180&&Math.random()<0.05*P.wing){
    var crossY=MIDY+(Math.random()<0.5?-55:55);
    kickBall(m,p,640*P.tempo,Math.atan2(crossY-p.y,att));
    addEvent(((m.clock/60)|0)+1,'传中 '+(p.team===0?m.home.name:m.away.name)+' '+pr.name+' 起脚传中');
    return;
  }
  // 2) 长传调度（direct 战术，中后场）
  if(P.direct>0.7&&dToGate>400&&Math.random()<0.012*P.direct){
    var bestFwd=null;
    for(var qx2=0;qx2<m.players.length;qx2++){
      var fw2=m.players[qx2];
      if(fw2.team!==p.team||fw2.role!=='fw'||fw2===p) continue;
      if(!bestFwd||(att>0?fw2.x>bestFwd.x:fw2.x<bestFwd.x)) bestFwd=fw2;
    }
    if(bestFwd&&Math.abs(bestFwd.x-p.x)>250){
      var ddx2=bestFwd.x-p.x,ddy2=bestFwd.y-p.y,ddd2=Math.sqrt(ddx2*ddx2+ddy2*ddy2)||1;
      m.ball.owner=null;
      m.ball.vx=ddx2/ddd2*780*P.tempo;
      m.ball.vy=ddy2/ddd2*780*P.tempo;
      m.ball._passTx=bestFwd.x; m.ball._passTy=bestFwd.y;
      m.ball._passTo=bestFwd;
      p.shootCd=0.6;
      m.lastTouch=p.team; m.lastPasser=p;
      addEvent(((m.clock/60)|0)+1,'长传 '+(p.team===0?m.home.name:m.away.name)+' '+pr.name+' 长传冲吊');
      return;
    }
  }
  // 3) 射门：禁区果断/机会评估（角色权重）
  if(dToGate<P.shootDist){
    if(p.shootCd>0&&dToGate<160) p.shootCd=Math.min(p.shootCd,0.05);
    if(dToGate<90) p.shootCd=0;
    if(p.shootCd<=0){
      var marked=false;
      for(var mi=0;mi<m.players.length;mi++){
        var mq=m.players[mi];
        if(mq.team!==p.team&&mq.role!=='gk'&&dist2(mq,p)<70*70&&(mq.x-p.x)*att>0) marked=true;
      }
      // 门前/禁区内：无人盯防时果断射门（避免单刀回传），被盯防再权衡
      var shootP;
      if(dToGate<130) shootP=0.9;                     // 门前必射
      else if(inBox) shootP=marked?0.55:0.95;         // 禁区内：空位95%射门，5%留给队友更好位置
      else {
        shootP=P.shootRate*P.shootMul*RA.shoot;        // 禁区外：角色权重
        if(dToGate>320) shootP*=0.45;
        if(marked) shootP*=0.45;
      }
      var angleGood=Math.abs(p.y-MIDY)<75;
      var gk0=playersOf(m,1-p.team)[0];
      var gkD=gk0?Math.sqrt(dist2(gk0,p)):999;
      var gkOut=gkD>170;
      if(angleGood) shootP*=1.25;
      if(gkOut&&dToGate>150) shootP*=1.3;
      if(dToGate<130||Math.random()<shootP){
        var onT=Math.random()<0.25+pr.sho*0.0028+pr.tec*0.0022;
        m.ball._onT=onT; // 供扑救消息区分（射正化解/偏球没收）
        // 瞄准点：射正瞄准门框内（±24px）；偏出球强制瞄准门框外（±55px，门框半宽45px）——消息与轨迹一致
        var aim;
        if(onT) aim=(Math.random()<0.4?-1:(Math.random()<0.5?0:1));
        else aim=(Math.random()<0.5?-1:1);
        var offX=onT?24:55;
        var ang=Math.atan2((MIDY+aim*offX-(pr.sho*0.3+pr.pow*0.1)-p.y)/Math.max(1,Math.abs(p.x-gateX)),att);
        kickBall(m,p,400+pr.sho*6+pr.pow*5,ang);
        m.shots[p.team]++;
        if(onT) m.onTarget[p.team]++;
        else m.rating[pr.name]=(m.rating[pr.name]||6)-0.1;
        resolveShot(m,p,ang);
        var min=((m.clock/60)|0)+1;
        // 射门消息按距离与结果分类（避免"远距离禁区内劲射"等错误）
        var dTxt=dToGate<175?'禁区内':(dToGate<300?'中距离':'远距离');
        var shotsTxt=onT?(dToGate<175?'劲射！':(dToGate<300?'大力轰门！':'远射发炮！')):(dToGate<175?'打飞！':(dToGate<300?'抽射偏出！':'高射炮！'));
        addEvent(min,(onT?'射门！':'射门偏出！')+(p.team===0?m.home.name:m.away.name)+' '+pr.name+' '+dTxt+' '+shotsTxt);
        return;
      }
    }
  }
  // 4) 突破：禁区外有空间+角色盘带倾向+速度 → 突入内切
  if(!inBox&&!aheadBlocked&&dToGate>150&&dToGate<400){
    var spdF=clamp(0.5+pr.spd/200,0.5,1.2);
    var counterPush=m.counterT>0&&m.counterTeam===p.team;
    if(Math.random()<clamp(0.9*RA.dribble*spdF+(counterPush?0.3:0),0.15,0.95)){
      var goalY=MIDY+(p.y>MIDY?-1:1)*35;
      p.vx=att*pSpeed(pr)*(counterPush?1.12:1.02);
      p.vy=(goalY-p.y)*0.5+Math.sin(m.clock*0.1+pr.name.length)*14;
      p.face=Math.atan2(p.vy,p.vx);
      return;
    }
  }
  // 5) 传球：被逼抢或高质量机会（角色传球倾向）；禁区内5%机会给位置更好的队友
  var bt=bestPassTarget(m,p);
  var passNow=false;
  if(inBox){ passNow=Math.random()<0.05; } // 禁区内极少回传，仅队友位置明显更好时
  else if(threat){ passNow=Math.random()<clamp(0.8*RA.pass,0.3,0.95); }
  else if(bt){ passNow=Math.random()<(0.3*RA.pass); }
  if(passNow){
    var tgt=bt?bt.q:null;
    if(!tgt) tgt=escapePassTarget(m,p);
    if(tgt){ doPass(m,p,tgt,threat?250:230,0.4); return; }
  }
  // 6) 被逼抢且无法出球：摆脱/护球
  if(threat&&near){
    var away=Math.atan2(p.y-near.y,p.x-near.x);
    if(p.x<70&&Math.cos(away)<0) away=0;
    else if(p.x>W-70&&Math.cos(away)>0) away=Math.PI;
    if(p.y<70&&Math.sin(away)<0) away=Math.PI/2;
    else if(p.y>H-70&&Math.sin(away)>0) away=-Math.PI/2;
    var sp=pSpeed(pr);
    if(Math.random()<0.5){ // 护球慢速
      p.vx=Math.cos(away)*sp*0.5+att*sp*0.3;
      p.vy=Math.sin(away)*sp*0.6;
    } else { // 摆脱加速
      p.vx=Math.cos(away)*sp*0.7+att*sp*0.15;
      p.vy=Math.sin(away)*sp*0.8;
    }
    p.face=Math.atan2(p.vy,p.vx);
    return;
  }
  // 7) 被堵推进：变向找空隙
  if(aheadBlocked){
    var ex=att*60+(p.x-(near?near.x:gateX))*0.5;
    var ey=(p.y-(near?near.y:MIDY))*0.6;
    var eev=Math.sqrt(ex*ex+ey*ey)||1;
    var spEv=pSpeed(pr);
    p.vx=ex/eev*spEv*0.85; p.vy=ey/eev*spEv*0.7;
    p.face=Math.atan2(p.vy,p.vx);
    return;
  }
  // 8) 默认推进（朝球门+轻微横摆）
  p.vx=att*pSpeed(pr);
  p.vy=(MIDY-p.y)*0.4+Math.sin(m.clock*0.12+pr.name.length)*22;
  p.face=Math.atan2(p.vy,p.vx);
}
// ===== 无球决策（按优先级）=====
function aiOff(m,p,dt){
  var b=m.ball;
  var P=p.team===0?m.paramsHome:m.paramsAway;
  var att=p.team===0?1:-1;
  var RA=ROLE_AI[p.role]||ROLE_AI.mf;
  // 1) 对方门将持球：退守站位不逼抢
  if(b.owner&&b.owner.role==='gk'&&b.owner.team!==p.team){
    var retX=p.team===0?Math.min(p.homeX,W*0.55):Math.max(p.homeX,W*0.45);
    goTo(p,retX,p.homeY,dt,1.05);
    return;
  }
  // 2) 接应队友传球
  if(b._passTo===p&&b.owner!==p&&(p.role!=='df'||(p.team===0?b.x<W/2+60:b.x>W/2-60))){ goTo(p,b.x,b.y,dt,1.15); return; }
  var myNearest=nearestTo(m,p.team);
  var inMyHalf=p.team===0?b.x<W/2+60:b.x>W/2-60;
  // 3) 无主球：最近者追球（门将保护圈除外）
  if(!b.owner&&p===myNearest&&dist2(p,b)<220*220&&(p.role!=='df'||inMyHalf)){
    var gkOwn=playersOf(m,1-p.team)[0];
    if(!(gkOwn&&dist2(gkOwn,b)<140*140)){ goTo(p,b.x,b.y,dt,1); return; }
  }
  // 4) 对方持球 → 防守分层
  if(b.owner&&b.owner.team!==p.team&&b.owner.role!=='gk'){
    var dOwn=Math.sqrt(dist2(p,b.owner));
    if(dOwn<PLAYER_R*2.4){ p.pressT=(p.pressT||0)+dt; } else { p.pressT=0; }
    if(p.pressT>1.2){ p.pressT=0; var awayA=Math.atan2(p.y-b.owner.y,p.x-b.owner.x); goTo(p,p.x+Math.cos(awayA)*80,p.y+Math.sin(awayA)*80,dt,1.25); return; }
    // 逼抢（角色权重：后卫警戒大、前锋压迫强）
    var pressers=(P.press>=1.3)?2:1;
    var pRange=(150+50*P.press/1.1)*RA.press;
    var nearerCnt=0;
    for(var pr_i=0;pr_i<m.players.length;pr_i++){
      var pr2=m.players[pr_i];
      if(pr2.team!==p.team||pr2===p||pr2.role==='gk') continue;
      if(dist2(pr2,b.owner)<dist2(p,b.owner)) nearerCnt++;
    }
    if(nearerCnt<pressers&&dist2(p,b)<pRange*pRange&&(p.role!=='df'||inMyHalf)){
      goTo(p,b.owner.x,b.owner.y,dt,nearerCnt===0?1.0:1.08);
      return;
    }
    // 4.5) 防线压迫：对方持球已攻入我方半场，离球最近的后卫无条件上前封堵（避免"看着对手带球过来却不迎上去"）
    if(p.role==='df'&&inMyHalf&&dOwn<pRange){
      var nearestDf=true;
      for(var di=0;di<m.players.length;di++){
        var dp=m.players[di];
        if(dp.team!==p.team||dp===p||dp.role!=='df') continue;
        if(dist2(dp,b.owner)<dist2(p,b.owner)){ nearestDf=false; break; }
      }
      if(nearestDf){ goTo(p,b.owner.x,b.owner.y,dt,1.0); return; }
    }
    // 4.6) 后卫封堵射门路线：另一名后卫（离球第二近）站持球者与球门连线，防远射与内切
    if(p.role==='df'&&inMyHalf&&dOwn<340){
      var nearerDf=0;
      for(var d2i=0;d2i<m.players.length;d2i++){
        var dp2=m.players[d2i];
        if(dp2.team!==p.team||dp2===p||dp2.role!=='df') continue;
        if(dist2(dp2,b.owner)<dist2(p,b.owner)) nearerDf++;
      }
      if(nearerDf===1){
        var gx3=p.team===0?0:W;
        var dvx3=b.owner.x-gx3,dvy3=b.owner.y-MIDY;
        var dd3=Math.sqrt(dvx3*dvx3+dvy3*dvy3)||1;
        var ax3=b.owner.x-dvx3/dd3*90;
        var ay3=b.owner.y-dvy3/dd3*90;
        goTo(p,ax3,ay3,dt,1.0);
        return;
      }
    }
    // 协防封堵：第二近者站持球者与球门连线
    var dCar=Math.sqrt(dist2(p,b.owner));
    if(dCar<(p.role==='df'?540:460)*(0.8+0.3*P.press/1.1)&&(p.role!=='df'||inMyHalf)){
      var nearer=0;
      for(var qi=0;qi<m.players.length;qi++){
        var qq=m.players[qi];
        if(qq.team!==p.team||qq===p||qq.role==='gk') continue;
        if(dist2(qq,b.owner)<dist2(p,b.owner)) nearer++;
      }
      if(nearer<=1){
        var gateX2=p.team===0?0:W;
        var dvx=b.owner.x-gateX2,dvy=b.owner.y-MIDY;
        var dd2=Math.sqrt(dvx*dvx+dvy*dvy)||1;
        var ax=b.owner.x-dvx/dd2*90;
        var ay=b.owner.y-dvy/dd2*90;
        goTo(p,ax,ay,dt,1.0);
        return;
      }
    }
    // 后卫回防：斜插持球者与球门连线拦截点
    if(p.role==='df'){
      var gx3=p.team===0?0:W;
      var dvx3=gx3-b.owner.x,dvy3=MIDY-b.owner.y;
      var dd3=Math.sqrt(dvx3*dvx3+dvy3*dvy3)||1;
      var ax3=b.owner.x+dvx3/dd3*120;
      var ay3=b.owner.y+dvy3/dd3*120;
      var tx0=p.homeX+(b.x-W/2)*P.shift*att;
      if((p.team===0&&ax3<tx0)||(p.team===1&&ax3>tx0)){ goTo(p,ax3,ay3,dt,1.05); return; }
    }
  }
  // 5) 默认阵型站位（椭圆活动区，角色范围）
  formationMove(m,p,dt);
}

function nearestTo(m,team){
  var best=null,bd=1e9;
  for(var i=0;i<m.players.length;i++){
    var p=m.players[i];
    if(p.team!==team||p.role==='gk') continue;
    var d=dist2(p,m.ball);
    if(d<bd){ bd=d; best=p; }
  }
  return best;
}
function goTo(p,tx,ty,dt,sp){
  var dx=tx-p.x,dy=ty-p.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  var speed=pSpeed(p.pl)*(sp||1);
  p.vx=dx/d*speed; p.vy=dy/d*speed;
  p.face=Math.atan2(dy,dx);
}
function formationMove(m,p,dt){
  var att=p.team===0?1:-1;
  var P=p.team===0?m.paramsHome:m.paramsAway;
  // 各位置活动范围（椭圆：前后半径×左右半径，非正方形；门将最小，中场最大）
  var RANGE={ gk:{rx:55,ry:110}, df:{rx:150,ry:125}, mf:{rx:265,ry:130}, fw:{rx:235,ry:105} };
  // 无球动态跑位（意识越高跑动范围越大，走位越灵活）
  var af=awaFactor(p.pl);
  var R=RANGE[p.role]||RANGE.mf;
  if(!p.wt||p.wt<=0){
    p.wt=0.7+Math.random()*1.3;
    p.wx=(Math.random()-.5)*R.rx*af;
    p.wy=(Math.random()-.5)*R.ry*af;
  }
  p.wt-=dt;
  var shift=(m.ball.x-W/2)*P.shift*att;
  // 后卫适度压上：shift 缩小 45%（可参与中场逼抢，但防线不过于靠前）
  if(p.role==='df') shift*=0.55;
  var tx=p.homeX+shift+p.wx;
  var ty=p.homeY+(m.ball.y-MIDY)*0.08+p.wy;
  // 持球队友时：前锋/边路前插拉扯（意识高跑位更激进）
    if(m.ball.owner&&m.ball.owner.team===p.team&&m.ball.owner!==p&&p.role!=='df'&&p.role!=='gk'){
    tx=p.homeX+att*130*P.forward*af+shift+p.wx;
    ty=p.homeY+(Math.random()<0.3?30:-30)*af+p.wy;
  }
  // 接应：队友持球时靠拢拉开接球路线（意识高接应范围更大）
  if(m.ball.owner&&m.ball.owner.team===p.team&&m.ball.owner!==p&&p.role!=='gk'){
    var dToOwn=Math.sqrt(dist2(p,m.ball.owner));
    if(dToOwn>140&&dToOwn<420*af&&p.role!=='df'){
      var dirX=m.ball.owner.x>p.x?1:-1;
      tx=m.ball.owner.x+dirX*(70*af+p.wx);
      ty=m.ball.owner.y+p.wy;
    }
  }
  // 椭圆约束：目标点超出活动椭圆时收缩回椭圆边界内（前后/左右范围不同）
  var edx=(tx-p.homeX)/R.rx, edy=(ty-p.homeY)/R.ry;
  if(edx*edx+edy*edy>1){
    var es=1/Math.sqrt(edx*edx+edy*edy);
    tx=p.homeX+edx*R.rx*es;
    ty=p.homeY+edy*R.ry*es;
  }
  tx=clamp(tx,30,W-30); ty=clamp(ty,30,H-30);
  // 后卫防线可适度越过中线参与前场逼抢（但不超过对方半场1/4处）
  if(p.role==='df'){
    if(p.team===0) tx=Math.min(tx,W/2+120);
    else tx=Math.max(tx,W/2-120);
  }
  // 对方持球攻入己方半场：后卫斜线直插持球者与球门连线上的拦截点（不平退再横赶），1.3 倍速回防
  if(m.ball.owner&&m.ball.owner.team!==p.team&&p.role==='df'){
    var gateX2=p.team===0?0:W;
    var dvx=gateX2-m.ball.owner.x,dvy=MIDY-m.ball.owner.y;
    var dd2=Math.sqrt(dvx*dvx+dvy*dvy)||1;
    var ax=m.ball.owner.x+dvx/dd2*120;
    var ay=m.ball.owner.y+dvy/dd2*120;
    // 仅当拦截点比当前目标更靠近本方球门时执行（避免上前失位）
    if((p.team===0&&ax<tx)||(p.team===1&&ax>tx)){ goTo(p,ax,ay,dt,1.05); return; }
  }
  // 回防加速：球在自己身后且远离时快速回撤；反击窗口内全队加速前插（防线越高压回防越慢）
  var behind=(p.team===0&&m.ball.x<p.x)||(p.team===1&&m.ball.x>p.x);
  var burst=(m.counterT>0&&m.counterTeam===p.team)?(1+(P.counter-1)*0.7):1;
  goTo(p,tx,ty,dt,(behind&&p.role!=='fw'?1.12*(P.retreat||1):0.95)*burst);
}
function bestPassTarget(m,p){
  var gateX=p.team===0?W:0;
  var P=p.team===0?m.paramsHome:m.paramsAway;
  var maxD=P.buildUp==='short'?420:(P.buildUp==='direct'?820:620);
  // 过半场禁回传：进攻方进入对方半场后不得把球传回本方半场
  var pInAttHalf=p.team===0?(p.x>W/2):(p.x<W/2);
  var best=null,bd=1e9;
  for(var i=0;i<m.players.length;i++){
    var q=m.players[i];
    if(q.team!==p.team||q===p||q.role==='gk') continue;
    if(pInAttHalf){
      if(p.team===0&&q.x<W/2) continue;
      if(p.team===1&&q.x>W/2) continue;
    }
    var d=Math.sqrt(dist2(q,p));
    if(d>maxD||d<50) continue;
    var forward=q.x-p.x;
    if(p.team===0&&forward<40) continue;
    if(p.team===1&&forward>-40) continue;
    if(passBlocked(m,p,q)) continue;
    // 接球者空间：周围 45px 内无防守者优先
    var spaceOk=true;
    for(var s2=0;s2<m.players.length;s2++){
      var sq=m.players[s2];
      if(sq.team!==p.team&&sq.role!=='gk'&&dist2(sq,q)<45*45){ spaceOk=false; break; }
    }
    // 战术倾向：边路战术偏爱边路队友；直塞战术偏爱更接近球门的队友
    var fwd=Math.abs(q.x-gateX)/W;
    var wide=Math.abs(q.y-MIDY)/MIDY;
    var score=d*(1.6-fwd*1.1-P.wing*wide*0.5)*(spaceOk?0.65:1.4)/(1+P.direct*fwd*0.7);
    if(score<bd){ bd=score; best=q; }
  }
  return best?{q:best,score:bd}:null;
}
// 执行传球（含精度判定），返回后调用处需自行 return
function doPass(m,p,tgt,basePow,cd){
  var P2=p.team===0?m.paramsHome:m.paramsAway;
  var dx=tgt.x-p.x,dy=tgt.y-p.y,dd=Math.sqrt(dx*dx+dy*dy)||1;
  var passPow=(basePow||230+dd*0.4)*(0.7+0.5*p.pl.pow/100)*P2.tempo;
  m.ball.owner=null;
  m.ball.vx=dx/dd*passPow;
  m.ball.vy=dy/dd*passPow;
  // 传球精度：传球能力越高越准；节奏越快越易偏；距离越远（长传）越易失误——短传稳、长传搏
  var misP=(100-(p.pl.tec+p.pl.awa)/2)/200*(0.6+0.5*P2.tempo)*(0.55+dd/700);
  if(Math.random()<misP){
    m.ball._passTx=tgt.x+(Math.random()-.5)*(90+dd*0.18);
    m.ball._passTy=tgt.y+(Math.random()-.5)*(55+dd*0.1);
  } else {
    m.ball._passTx=tgt.x; m.ball._passTy=tgt.y;
  }
  m.ball._passTo=tgt;
  p.shootCd=cd||0.4;
  m.lastTouch=p.team; m.lastPasser=p;
}
// 逃生传球：被逼抢且没有向前传球目标时，寻找附近（含侧向/回传）安全的队友
function escapePassTarget(m,p){
  var best=null,bd=1e9;
  // 过半场禁回传：进攻方进入对方半场后不得把球传回本方半场
  var pInAttHalf=p.team===0?(p.x>W/2):(p.x<W/2);
  for(var i=0;i<m.players.length;i++){
    var q=m.players[i];
    if(q.team!==p.team||q===p||q.role==='gk') continue;
    if(pInAttHalf){
      if(p.team===0&&q.x<W/2) continue;
      if(p.team===1&&q.x>W/2) continue;
    }
    var d=Math.sqrt(dist2(q,p));
    if(d>360||d<40) continue;
    if(passBlocked(m,p,q)) continue;
    // 周围 40px 内无对方球员的队友优先（安全接应点）
    var safe=true;
    for(var s=0;s<m.players.length;s++){
      var sq=m.players[s];
      if(sq.team!==p.team&&sq.role!=='gk'&&dist2(sq,q)<40*40){ safe=false; break; }
    }
    var score=d*(safe?0.6:1.4);
    if(score<bd){ bd=score; best=q; }
  }
  return best;
}
function passBlocked(m,a,b){
  var dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||1;
  var steps=Math.ceil(d/30);
  for(var s=1;s<steps;s++){
    var x=a.x+dx/d*30*s,y=a.y+dy/d*30*s;
    for(var i=0;i<m.players.length;i++){
      var q=m.players[i];
      if(q===a||q===b||q.team===a.team) continue;
      if(dist2(q,{x:x,y:y})<22*22) return true;
    }
  }
  return false;
}
function aiGK(m,p,dt){
  var b=m.ball, pr=p.pl;
  var gateX=p.team===0?0:W, dir=p.team===0?1:-1;
  // 对方持球逼近球门：仅当持球者突入禁区（门前160px×左右130px）才出击没收
  if(b.owner&&b.owner.team!==p.team&&b.owner.role!=='gk'&&p.gkCd<=0){
    var inGKBox=Math.abs(b.owner.x-gateX)<160&&Math.abs(b.owner.y-MIDY)<130;
    if(inGKBox){
    var distG=Math.sqrt(dist2(p,b.owner));
    if(distG<95){
      if(Math.random()<0.35){
        giveBall(m,p);
        b.owner.protect=0.8;
        p.gkCd=1.5;
        m.rating[pr.name]=(m.rating[pr.name]||6)+0.4;
        addEvent(((m.clock/60)|0)+1,'扑救 '+(p.team===0?m.home.name:m.away.name)+' '+pr.name+' 出击没收');
        return;
      }
      p.gkCd=0.8;
    } else {
      // 出击迎上持球者
      p.x+=(b.owner.x-p.x)*Math.min(1,dt*6);
      p.y+=(b.owner.y-p.y)*Math.min(1,dt*6);
      p.face=dir;
      return;
    }
    }
  }
  if(b.owner===p){
    if(!(p.gkCd>0)) p.gkCd=0.8;
    p.gkCd-=dt;
    if(p.gkCd<=0){
      var best=null,bd=1e9;

      else if(_diff>=1&&m.clock>65*60){ _at.tactic='counter'; } // 领先：防反
      else { _at.tactic=randTactic(); }                // 正常：随机调整
      if(_at===m.home) m.paramsHome=params(_at,true);
      else m.paramsAway=params(_at,false);

  }

  if(m.clock>=45*60&&m.half===1){

      for(var ai=0;ai<m.players.length;ai++){ if(m.players[ai].team===1) m.players[ai].pl.mor=clamp(m.players[ai].pl.mor+5,20,100); }

      for(var ai2=0;ai2<m.players.length;ai2++){ if(m.players[ai2].team===0) m.players[ai2].pl.mor=clamp(m.players[ai2].pl.mor+5,20,100); }

    swapSides(m);
    var hh=document.getElementById('homeName'); if(hh) hh.textContent=m.home.name;
    var an=document.getElementById('awayName'); if(an) an.textContent=m.away.name;
    var dhh=document.getElementById('dotHome'); if(dhh) dhh.style.background=m.home.color;
    var daa=document.getElementById('dotAway'); if(daa) daa.style.background=m.away.color;
    doKickoff(m,0); // 换边后由另一队开球
    return;
  }
  for(var i=0;i<m.players.length;i++){
    var p=m.players[i];
    aiPlayer(m,p,sdt);
    stepPlayer(m,p,sdt);
  }
  stepBall(m,sdt);
  for(var i2=0;i2<m.players.length;i2++) playerContact(m,m.players[i2]);
  collide(m);
  // 持球统计
  if(m.ball.owner) m.poss[m.ball.owner.team]+=sdt;
  postBounce(m);
  if(checkGoal(m)) return;
  if(outOfBounds(m)) return;
}

  var ar=tableOf(myTier).filter(function(r){return r.idx===oppIdx;})[0];

  if(myScore>oppScore){ hr.w++; ar.l++; hr.form.push('W'); ar.form.push('L'); }

  for(var i=0;i<myClub.squad.length;i++){

    // 体能：首发消耗，非首发恢复（训练中心加速恢复），受伤后恢复慢
    var recMul=facGrowth(facilities.training);

    else if(!played&&p.age<=21&&facilities.training>=2&&Math.random()<0.15*growMul) growAttrs(p);

  var injRate=facInjRate(facilities.medical);
  var fitBack=facFitBack(facilities.medical);
  var injMax=(facilities.medical>=12)?2:3;
  if(Math.random()<injRate){
    var pool=myClub.squad.filter(function(q){ return q.inj<=0; });
    if(pool.length){
      var hurt=pool[(Math.random()*pool.length)|0];

  if(!resultsByRound[round]) resultsByRound[round]={A:[],B:[]};
  // 赛果记录：按开局主客归因（换边后 m.home 已对调，不能用 m.home.idx/score[0] 直接对应）
  var oppIdx2=m.isHome?m.home.idx:m.away.idx;      // 换边后 home=开局客队；isHome=true 时对手=换边后 home
  var myGoals2=m.isHome?m.score[1]:m.score[0];     // 换边后我方进球与对手对调了数组下标
  var oppGoals2=m.isHome?m.score[0]:m.score[1];
  var recHome=m.isHome?myIdx:oppIdx2;
  var recAway=m.isHome?oppIdx2:myIdx;

  // 排名快照滚动：prevRank=上一轮结束排名，lastRank=本轮结束排名（积分榜升降箭头）
  var _rs=function(a,b){ return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga); };
  var _tsX=['A','B'];
  for(var _tx2=0;_tx2<_tsX.length;_tx2++){
    var _tbX=tableOf(_tsX[_tx2]);

    for(var _rkX=0;_rkX<_srtX.length;_rkX++){

      if(_row.lastRank) _row.prevRank=_row.lastRank;

  showFinal(m);

function addEvent(min,txt){

  var maxRows=Math.max(5,Math.floor((el.clientHeight-12)/17));
  el.innerHTML='';

    var e=m.events[i];

  }
}

var AC=null;
function ac(){ if(!SFX_ON) return null; if(!AC){ try{ AC=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){} } if(AC&&AC.state==='suspended') AC.resume(); return AC; }
function tone(f0,f1,dur,vol,type){
  var a=ac(); if(!a) return;
  try{ var o=a.createOscillator(),g=a.createGain();
    o.type=type||'square'; o.frequency.setValueAtTime(f0,a.currentTime);
    if(f1&&f1!==f0) o.frequency.exponentialRampToValueAtTime(Math.max(30,f1),a.currentTime+dur);
    g.gain.setValueAtTime(vol||.12,a.currentTime); g.gain.exponentialRampToValueAtTime(.001,a.currentTime+dur);
    o.connect(g); g.connect(a.destination); o.start(); o.stop(a.currentTime+dur);
  }catch(e){}
}
function noise(dur,vol){
  var a=ac(); if(!a) return;
  try{ var n=a.createBufferSource(),buf=a.createBuffer(1,a.sampleRate*dur,a.sampleRate);
    var d=buf.getChannelData(0); for(var i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
    n.buffer=buf; var g=a.createGain(); g.gain.setValueAtTime(vol||.2,a.currentTime);
    n.connect(g); g.connect(a.destination); n.start();
  }catch(e){}
}

var confetti2=[];
function render(){
  var g=ctx;
  g.save();
  drawPitch(g);
if(match&&!match.over){
    var m=match;
    if(!m.ball) return;
    // 影子
    for(var i=0;i<m.players.length;i++){

    }

      var p2=m.players[i2];
      var col=p2.team===0?match.home.color:match.away.color;

      g.fillText(p2.pl.name.slice(0,1),p2.x,p2.y);
      g.textAlign='start'; g.textBaseline='alphabetic';
      if(m.ball.owner===p2){
        g.strokeStyle='rgba(255,255,255,.8)'; g.lineWidth=1.5;
        g.beginPath(); g.arc(p2.x,p2.y,PLAYER_R+3,0,Math.PI*2); g.stroke();
      }
    }
// 球
    var b=m.ball;
    if(!b) return;
    g.fillStyle='rgba(0,0,0,.25)';
    g.beginPath(); g.ellipse(b.x+2,b.y+3,6,3.8,0,0,Math.PI*2); g.fill();
    g.fillStyle='#f5f7fa';
    g.beginPath(); g.arc(b.x,b.y,BALL_R,0,Math.PI*2); g.fill();
    g.strokeStyle='#22262e'; g.lineWidth=1.2; g.stroke();
    // 进球彩带
    if(m.goalCeleb>0){
      for(var c=0;c<confetti2.length;c++){
        var f2=confetti2[c];
        f2.x+=f2.vx*0.016; f2.y+=f2.vy*0.016; f2.vy+=400*0.016; f2.life-=0.016;
        g.globalAlpha=Math.max(0,Math.min(1,f2.life));
        g.fillStyle=f2.c;
        g.fillRect(f2.x-1.5,f2.y-1.5,3,3);
      }
      g.globalAlpha=1;
      if(confetti2.length<40&&Math.random()<0.5){
        confetti2.push({x:W/2,y:MIDY,vx:(Math.random()-.5)*300,vy:-80-Math.random()*160,life:1.2,c:['#ffe08a','#57c8ff','#3ddc7a','#ff6b81','#c76bff'][(Math.random()*5)|0]});
      }
    } else { confetti2.length=0; }
  }
  g.restore();
}
function drawPitch(g){
  g.fillStyle='#0a0e14';
  g.fillRect(-20,-20,W+40,H+40);
  for(var row=0;row<8;row++){
    g.fillStyle=row%2===0?'#2b8f47':'#268641';
    g.fillRect(0,row*H/8,W,H/8);
  }
  var grd=g.createRadialGradient(W/2,MIDY,80,W/2,MIDY,560);
  grd.addColorStop(0,'rgba(255,255,255,.07)');
  grd.addColorStop(1,'rgba(0,0,0,.15)');
  g.fillStyle=grd; g.fillRect(0,0,W,H);
  g.strokeStyle='rgba(255,255,255,.9)'; g.lineWidth=2;
  g.strokeRect(2,2,W-4,H-4);
  g.beginPath(); g.moveTo(W/2,2); g.lineTo(W/2,H-2); g.stroke();
  g.beginPath(); g.arc(W/2,MIDY,88,0,Math.PI*2); g.stroke();
  g.beginPath(); g.arc(W/2,MIDY,3,0,Math.PI*2); g.fill();
  for(var s=0;s<2;s++){
    var gx=s===0?0:W;
    g.strokeRect(s===0?2:W-168,MIDY-200,165,400);
    g.strokeRect(s===0?2:W-58,MIDY-91,55,182);
    g.beginPath(); g.arc(s===0?110:W-110,MIDY,3,0,Math.PI*2); g.fill();
    g.beginPath(); g.arc(gx,MIDY,8,0,Math.PI*2); g.fillStyle='#fff'; g.fill();
    g.fillStyle='rgba(255,255,255,.5)';
    g.fillRect(s===0?2:W-9,MIDY-45,7,90);
  }
}

function renderPanTable(tbl){
  var el=pan('Table'); if(!el) return;
  var sorted=tbl.slice().sort(function(a,b){ return b.pts-a.pts||(b.gf-b.ga)-(a.gf-a.ga); });
  var rows=[];
  for(var i=0;i<sorted.length;i++){
    var r=sorted[i];
    var pos=i+1;
    var mine=r.idx===myIdx;
    // 排名升降箭头（对比上一轮排名快照）
    var move='–';
    if(r.prevRank) move=(pos<r.prevRank?'<span style="color:#3ddc7a">▲</span>':(pos>r.prevRank?'<span style="color:#ff6b81">▼</span>':'<span style="color:#5a6678">–</span>'));
    var zone='';
    var isA=myTier==='A';
    // A级：前三名金银铜特别标注；降级区仅A级存在（B级为底层联赛不再降级）
    if(isA&&pos<=3) zone=''; // 金银铜徽章已在排名列展示
    else if(!isA&&pos<=2) zone='<span class="zone champ">升</span>';
    else if(isA&&pos>=sorted.length-1) zone='<span class="zone demote">降</span>';
    var fm=r.form.length?r.form.slice(-3).map(function(f){return f==='W'?'<span style="color:#3ddc7a">●</span>':(f==='D'?'<span style="color:#ffe08a">●</span>':'<span style="color:#ff6b81">●</span>');}).join(''):'';

    var posHtml=(isA&&pos<=3)?'<span class="zone t'+pos+'">'+pos+'</span>':pos;
    rows.push('<tr class="'+(mine?'mine':'')+'"><td class="pos">'+posHtml+'</td><td>'+zone+move+'</td><td class="nm">'+r.name+'</td><td>'+r.p+'</td><td>'+r.w+'</td><td>'+r.d+'</td><td>'+r.l+'</td><td>'+r.gf+'-'+r.ga+'</td><td><b>'+r.pts+'</b></td><td>'+fm+'</td></tr>');

      }

  var bench=sorted.filter(function(p){ return myClub.eleven.indexOf(p)<0; });
  for(var si=0;si<starters.length;si++) pcard(starters[si],sorted.indexOf(starters[si]));

    html+='<button class="fbtn'+(p.pos===o?' sel':'')+'" data-pos="'+o+'" style="flex:1;padding:8px 0">'+POS_NAMES[o]+'（总评 '+newAb+'）</button>';

  box.innerHTML=html;
  overlay.appendChild(box);
  document.body.appendChild(overlay);

  box.addEventListener('click',function(ev){

    if(pp){ var np=pp.getAttribute('data-pos'); close(); if(np!==p.pos) changePos(p,np); return; }

function changePos(p,newPos){
  var cost=30+Math.round(p.ab*0.2);
  if(myClub.cash<cost){ showMsg('资金不足，改位置需 '+cost+' 万'); return; }
  myClub.cash-=cost;
  fin.training+=cost;
  p.pos=newPos;
  p.ab=calcAb(p);
  // 位置固定：若当前首发槽位与新位置不符则移出首发
  var roles=window.roleList(myClub.form);
  for(var i=0;i<myClub.eleven.length;i++){
    if(myClub.eleven[i]===p&&roles[i]!==newPos){ myClub.eleven[i]=null; }
  }
  showMsg('🔄 '+p.name+' 改练'+POS_NAMES[newPos]+'成功（费用'+cost+'万）· 总评'+p.ab);
  refreshUI();
}
function openSlotPicker(slotIdx){
  var roles=window.roleList(myClub.form);
  var role=roles[slotIdx];
  var cur=myClub.eleven[slotIdx];
  var cands=myClub.squad.filter(function(p){ return p.inj<=0&&p.pos===role&&p!==cur&&myClub.eleven.indexOf(p)<0; }).sort(function(a,b){ return b.ab-a.ab; });
  var overlay=document.createElement('div');
  overlay.style.cssText='position:fixed;inset:0;z-index:30;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;';
  var box=document.createElement('div');
  box.style.cssText='background:#111826;border:1px solid rgba(255,255,255,.2);border-radius:14px;padding:14px;max-height:82vh;overflow-y:auto;width:min(430px,94vw);';
  var html='<div style="color:#8fa3bd;font-size:12px;margin-bottom:8px">'+POS_NAMES[role]+'（'+role.toUpperCase()+'）槽位'+(cur?' · 当前首发：<b style="color:#ffe08a">'+cur.name+'</b>':'')+'</div>';
  if(cur){
    html+='<button class="fbtn" data-clear="1" style="margin-bottom:6px">卸下 '+cur.name+'（转为替补）</button>';
  }
  for(var i=0;i<cands.length;i++){
    var p=cands[i];
    html+='<div class="mkt-card" style="cursor:pointer" data-pick="'+i+'"><div class="info"><b>'+p.name+'</b> <span class="badge '+p.pos+'">'+p.pos.toUpperCase()+'</span>'+(p.hot?' 🔥':'')+(p.fit<60?' <span style="color:#ff6b81">体能低</span>':'')+
      '<div class="abbar"><div class="abtrack"><div class="abfill" style="width:'+p.ab+'%"></div></div><span class="abnum">'+p.ab+'</span></div>'+
      '<div style="color:#8fa3bd;font-size:10px">速'+p.spd+' 力'+p.pow+' 技'+p.tec+' 意'+p.awa+' 射'+p.sho+' 守'+p.gkp+' · '+p.age+'岁 · 士气'+p.mor+'</div></div></div>';
  }
  if(!cands.length&&!cur) html+='<div style="color:#5a6678;font-size:11px">没有可用的'+POS_NAMES[role]+'球员</div>';
  html+='<div style="text-align:center;margin-top:8px"><button class="fbtn" data-close="1">关闭</button></div>';
  box.innerHTML=html;
  overlay.appendChild(box);
  document.body.appendChild(overlay);
  function close(){ if(overlay.parentNode) overlay.parentNode.removeChild(overlay); }
  box.addEventListener('click',function(ev){
    var t=ev.target;
    var clear=t.closest&&t.closest('[data-clear]');
    var pick=t.closest&&t.closest('[data-pick]');
    if(clear){ myClub.eleven[slotIdx]=null; close(); renderLineup(); return; }
    if(pick){
      var p=cands[parseInt(pick.getAttribute('data-pick'))];
      if(p){
        var oldIdx=myClub.eleven.indexOf(p);
        if(oldIdx>=0&&oldIdx!==slotIdx) myClub.eleven[oldIdx]=null;
        myClub.eleven[slotIdx]=p;
        close(); renderLineup();
      }
      return;
    }
    if(t.getAttribute&&t.getAttribute('data-close')) close();
  });
}

      (isSt?'<span class="lu-st">★首发</span>':'<span class="lu-st sub">替补</span>')+

  b3.onclick=function(){
    var tl=document.getElementById('tacList');
    if(tl&&tl.style.display==='block'){ tl.style.display='none'; return; }
    if(!tl){
      tl=document.createElement('div');
      tl.id='tacList';
      document.body.appendChild(tl);
    }
    tl.innerHTML='';
    for(var i=0;i<TACTICS.length;i++){
      var t=TACTICS[i];
      var tb=document.createElement('button');
      tb.className='btn sm';
      tb.textContent=(t.id===myClub.tactic?'▸ ':'')+t.name;
      tb.title=t.desc;
      tb.onclick=(function(tc){ return function(){
        myClub.tactic=tc.id; myClub.mentality=tc.mentality; myClub.press=tc.press; myClub.line=tc.line;
        if(match.home===myClub) match.paramsHome=params(myClub,true);
        else match.paramsAway=params(myClub,false);
        showMsg('战术：'+tc.name+' —— '+tc.desc);
        document.getElementById('mtTxt').textContent='我的战术：'+tc.name;
        tl.style.display='none';
      }; })(t);
      tl.appendChild(tb);
    }
    tl.style.display='block';
  };
  c.appendChild(b3);
  // 音效开关（与速度/战术统一按钮）
  var b4=document.createElement('button'); b4.className='btn sm'; b4.textContent='音效'+(SFX_ON?'':'关');
  b4.onclick=function(){ toggleSfx(); };
  c.appendChild(b4);
}
function updateHud(){
  if(!match) return;
  document.getElementById('score0').textContent=match.score[0];
  document.getElementById('score1').textContent=match.score[1];
  document.getElementById('clock').textContent=((match.clock/60)|0)+"'";
  document.getElementById('timelineFill').style.width=(match.clock/(90*60)*100)+'%';
  document.getElementById('roundTxt').textContent='R'+round;
  var rl=document.getElementById('rating');
  var posTotal=match.poss[0]+match.poss[1];
  var pos0=posTotal>0?Math.round(match.poss[0]/posTotal*100):50;
  var html='<div class="r3head" style="grid-column:1/-1;color:#8fa3bd;font-size:11px;margin-bottom:3px;white-space:nowrap">控球 '+pos0+'% : '+(100-pos0)+'% · 射门 '+match.shots[0]+'/'+match.shots[1]+'</div>';
  for(var i=0;i<myClub.eleven.length;i++){
    var p=myClub.eleven[i];
    var rt=Math.min(10,Math.max(3.5,match.rating[p.name]||6));
    html+='<div class="r3"><div class="r3n">'+p.name+'</div><div class="r3v" style="color:'+(rt>=7?'#3ddc7a':(rt<6?'#ff6b81':'#ffe08a'))+'">'+rt.toFixed(1)+'</div></div>';
  }
  rl.innerHTML=html;
}
// ================= 主循环 =================
var lastTime=0;
function frame(ts){
  requestAnimationFrame(frame);
  if(!lastTime) lastTime=ts;
  var dt=(ts-lastTime)/1000;
  lastTime=ts;
  if(match&&!match.over){
    updateMatch(match,Math.min(dt,0.05));
    updateHud();
  }
  render();
}
document.querySelectorAll('.tab').forEach(function(t){
  t.onclick=function(){
    document.querySelectorAll('.tab').forEach(function(x){ x.classList.remove('sel'); });
    this.classList.add('sel');
    var v=this.getAttribute('data-v');
    document.querySelectorAll('.view').forEach(function(x){ x.classList.remove('show'); });
    document.getElementById('view-'+v).classList.add('show');
  };
});
// ================= 自适应 =================
function fitGame(){
  // 卡片式布局：画布填满"比赛卡"内 wrap 的剩余空间（顶部比分条+时间线已占用上部分）
  var wrap=document.getElementById('wrap');
  if(!wrap) return;
  var aw=Math.max(200,wrap.clientWidth-12), ah=Math.max(120,wrap.clientHeight-12);
  var s=Math.min(aw/W, ah/H);
  cv.style.width=Math.round(W*s)+'px';
  cv.style.height=Math.round(H*s)+'px';
  cv.style.position='';
}
window.addEventListener('resize',fitGame);
window.addEventListener('orientationchange',function(){ setTimeout(fitGame,250); });
window.addEventListener('beforeunload',saveGame);
setInterval(saveGame,30000);
fitGame();

document.getElementById('btnStartMatch').onclick=function(){
  if(round>TOTAL_ROUNDS) return;
  if(myClub.eleven.length<11){ showMsg('首发不足 11 人'); return; }
  // 本轮已打完则不允许重开（防重复计分）
  var played=resultsByRound[round]&&resultsByRound[round][myTier]?resultsByRound[round][myTier].some(function(mr){
    return (mr.home===myIdx||mr.away===myIdx)&&mr.home!==mr.away;
  }):false;
  if(played){ showMsg('本轮比赛已完成，请进入下一轮'); return; }
  startMatch();
};
// 工作台侧边栏目录（单页切换，侧边栏固定）
document.querySelectorAll('.dash-side [data-view]').forEach(function(btn){
  btn.onclick=function(){
    var v=this.getAttribute('data-view');
    openDrawer(v==='home'?null:v);
  };
});
function setSideSel(dv){
  document.querySelectorAll('.dash-side [data-view]').forEach(function(x){
    x.classList.toggle('sel', x.getAttribute('data-view')===(dv||'home'));
  });
}
var btnReset2=document.getElementById('btnReset2');
if(btnReset2) btnReset2.onclick=function(){ doReset(); };
var btnSfx2=document.getElementById('btnSfx2');
if(btnSfx2) btnSfx2.onclick=function(){ toggleSfx(); };
function selectTeam(idx){
  myIdx=idx;
  myClub=aiClubs[idx];
  myTier=myClub.tier;
  TOTAL_ROUNDS=myTier==='A'?LEAGUE_A_ROUNDS:LEAGUE_B_ROUNDS;
  round=1;
  // 第一轮前就刷新赞助商（开局积分榜按实力排名，强队开赛前即有商家求赞助）
  refreshSponCandidates();
  document.getElementById('homeName').textContent=myClub.name;
  document.getElementById('pickClub').classList.add('hide');
  saveGame();
  renderScreen();
  showMsg('欢迎执教 '+myClub.name+'！');
}
function renderPickClub(){
  var el=document.getElementById('pickClub');
  if(!el) return;
  document.getElementById('dash').classList.add('hide');
  document.getElementById('top').classList.add('hide');
  var _mu3=document.getElementById('matchUI');
  if(_mu3){ _mu3.classList.add('hide'); _mu3.classList.remove('show'); }
  var html='<div class="card"><h1>足球经理</h1><div style="text-align:center;color:#8fa3bd;font-size:12px;margin-bottom:10px">选择你的球队</div>';
  html+='<div class="section-title">A级联赛（18队）</div><div style="display:flex;flex-wrap:wrap;gap:5px;margin-bottom:8px">';
  for(var i=0;i<aiClubs.length;i++){
    var c=aiClubs[i];
    if(c.tier!=='A') continue;
    html+='<div class="mkt-card" style="cursor:pointer;width:150px;flex:0 0 auto" data-pick="'+c.idx+'"><span class="teamDot" style="background:'+c.color+';width:16px;height:16px"></span> <b>'+c.name+'</b><div style="color:#8fa3bd;font-size:10px">实力'+c.ab+'</div></div>';
  }
  html+='</div><div class="section-title">B级联赛（16队）</div><div style="display:flex;flex-wrap:wrap;gap:5px">';
  for(var j=0;j<aiClubs.length;j++){
    var c2=aiClubs[j];
    if(c2.tier!=='B') continue;
    html+='<div class="mkt-card" style="cursor:pointer;width:150px;flex:0 0 auto" data-pick="'+c2.idx+'"><span class="teamDot" style="background:'+c2.color+';width:16px;height:16px"></span> <b>'+c2.name+'</b><div style="color:#8fa3bd;font-size:10px">实力'+c2.ab+'</div></div>';
  }
  html+='</div></div>';
  el.innerHTML=html;
  el.classList.remove('hide');
  el.querySelectorAll('[data-pick]').forEach(function(btn){
    btn.onclick=function(){ selectTeam(parseInt(this.getAttribute('data-pick'))); };
  });
}
var loaded=loadGame();
if(loaded&&myIdx>=0&&myClub){
  renderScreen();
  if(loadedMatchInterrupted) showMsg('⚠ 刷新时比赛中断，本轮可重新开赛');
} else {
  initLeague();
  refreshMarket();
  renderPickClub();
}
requestAnimationFrame(frame);
</script>
</body>
</html>
