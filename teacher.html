<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师工作台</title>
<style>
:root{
  --bg-base:#F5F3EE;--bg-card:#FFFFFF;--bg-soft:#FAF8F4;
  --text-primary:#3A3A3A;--text-secondary:#7A7670;--text-light:#B0ABA3;
  --border-light:#E8E5DF;
  --primary-blue:#5B8DB8;--primary-blue-light:#7BA7CE;--primary-blue-bg:#EBF2F8;
  --neutral-gray:#8B8680;--accent-orange:#F0A04B;--accent-orange-bg:#FFF4E8;--accent-orange-active:#F5B870;
  --ok-green:#4A9A5A;--err-red:#D6605F;
  --radius-sm:8px;--radius-md:14px;--radius-lg:20px;--radius-xl:24px;
  --shadow-sm:0 1px 3px rgba(0,0,0,0.04);--shadow-md:0 2px 12px rgba(0,0,0,0.06);--shadow-lg:0 4px 24px rgba(0,0,0,0.08);
  --c-res:#5B8DB8;--c-paper:#4A9A8E;--c-leave:#D68B8B;--c-talk:#7BA7CE;--c-point:#F0A04B;--c-seat-bg:#FFF4E8;
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg-base);color:var(--text-primary);font-size:14px;line-height:1.6;
}
button{font-family:inherit;cursor:pointer;border:none;background:none}
input,select,textarea{font-family:inherit;font-size:14px;color:var(--text-primary);background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-sm);padding:7px 10px;outline:none;transition:border-color .15s}
input:focus,select:focus,textarea:focus{border-color:var(--primary-blue);box-shadow:0 0 0 2px rgba(91,141,184,.15)}
a{color:var(--primary-blue);text-decoration:none}
/* ===== 头部 ===== */
header{height:60px;background:#fff;border-bottom:1px solid var(--border-light);box-shadow:var(--shadow-sm);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:100}
.hamburger{display:none;width:36px;height:36px;border-radius:8px;align-items:center;justify-content:center;color:var(--text-secondary)}
.hamburger:hover{background:var(--bg-soft)}
.logo{width:36px;height:36px;flex:none;border-radius:10px;background:linear-gradient(135deg,#5B8DB8,#7BA7CE);color:#fff;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700}
.brand-title{font-size:18px;font-weight:700;letter-spacing:1px}
.h-spacer{flex:1}
.save-indicator{display:none;font-size:12px;color:var(--ok-green);background:rgba(74,154,90,.12);padding:3px 12px;border-radius:12px;animation:saveFade 1.2s both}
@keyframes saveFade{0%{opacity:0}20%{opacity:1}80%{opacity:1}100%{opacity:0}}
.data-btn{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary)}
.data-btn:hover{background:var(--bg-soft);color:var(--primary-blue)}
.welcome{font-size:13px;color:var(--text-secondary);white-space:nowrap}
.clock{font-size:13px;color:var(--text-light);white-space:nowrap}
/* ===== 侧边栏 ===== */
.sidebar{width:230px;background:#fff;border-right:1px solid var(--border-light);display:flex;flex-direction:column;padding:14px 10px 20px;position:sticky;top:60px;height:calc(100vh - 60px);overflow-y:auto}
.nav-home{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:14.5px;color:var(--text-primary);margin-bottom:6px;transition:background .15s}
.nav-home:hover{background:var(--bg-soft)}
.nav-home.active{background:var(--accent-orange-bg);color:var(--accent-orange);font-weight:700}
.nav-group{margin-top:14px}
.nav-group-title{display:flex;align-items:center;gap:8px;font-size:16px;font-weight:700;color:var(--text-primary);padding:0 12px 8px}
.nav-group-title::before{content:'';width:8px;height:8px;border-radius:50%;flex:none}
.nav-group-title.g1::before{background:var(--primary-blue)}
.nav-group-title.g2::before{background:var(--accent-orange)}
.nav-group{border-top:1px solid var(--border-light);padding-top:12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:9px 12px;margin:2px 0;border-radius:10px;cursor:pointer;font-size:13.5px;color:var(--text-secondary);transition:all .15s;position:relative}
.nav-item:hover{background:var(--bg-soft);color:var(--text-primary)}
.nav-item.active{background:var(--accent-orange-bg);color:var(--accent-orange);font-weight:700}
.nav-item.active::before{content:'';position:absolute;left:-10px;top:8px;bottom:8px;width:3px;background:var(--accent-orange);border-radius:2px}
.nav-item svg{flex:none}
/* ===== 主内容区 ===== */
main{flex:1;padding:24px 28px;min-width:0}
.content-wrap{max-width:1100px;margin:0 auto}
.view{display:none}
.view.active{display:block;animation:fadeIn .2s}
@keyframes fadeIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.page-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:16px}
.page-title{font-size:19px;font-weight:700}
.status-badge{display:inline-flex;align-items:center;gap:6px;background:var(--primary-blue-bg);color:var(--primary-blue);padding:4px 14px;border-radius:20px;font-size:12.5px}
.status-badge::before{content:'';width:7px;height:7px;border-radius:50%;background:currentColor}
.status-badge.orange{background:var(--accent-orange-bg);color:var(--accent-orange)}
.status-badge.green{background:rgba(74,154,90,.12);color:var(--ok-green)}
.status-badge.pink{background:rgba(214,139,139,.14);color:var(--c-leave)}
.status-badge.teal{background:rgba(74,154,142,.14);color:var(--c-paper)}
.spacer{flex:1}
/* ===== 卡片 ===== */
.card{background:var(--bg-card);border:1px solid var(--border-light);border-radius:var(--radius-md);padding:18px 20px;margin-bottom:16px;box-shadow:var(--shadow-sm)}
.card-title{font-size:15px;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card-title .sub{font-size:12px;color:var(--text-light);font-weight:400}
/* ===== 首页 ===== */
.hero{background:linear-gradient(135deg,#5B8DB8,#7BA7CE);border-radius:var(--radius-xl);padding:32px;color:#fff;position:relative;overflow:hidden;margin-bottom:20px;box-shadow:var(--shadow-md)}
.hero h2{font-size:26px;letter-spacing:1px;margin-bottom:6px}
.hero p{font-size:14px;opacity:.9}
.hero::after{content:'';position:absolute;right:-60px;bottom:-60px;width:220px;height:220px;border-radius:50%;background:rgba(255,255,255,.12)}
.hero::before{content:'';position:absolute;right:40px;bottom:-90px;width:160px;height:160px;border-radius:50%;background:rgba(255,255,255,.08)}
.overview-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;margin-bottom:22px}
.ov-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-md);padding:18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-sm);transition:transform .2s,box-shadow .2s;cursor:default}
.ov-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md)}
.ov-icon{width:48px;height:48px;flex:none;border-radius:12px;display:flex;align-items:center;justify-content:center;color:#fff}
.ov-num{font-size:24px;font-weight:700;line-height:1.2}
.ov-label{font-size:12px;color:var(--text-light)}
.entry-section{margin-bottom:22px}
.entry-title{display:flex;align-items:center;gap:8px;font-size:15px;font-weight:700;margin-bottom:12px;padding-left:10px;border-left:4px solid var(--primary-blue);border-radius:2px}
.entry-title.orange{border-left-color:var(--accent-orange)}
.entry-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}
.entry-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-md);padding:18px;display:flex;gap:14px;align-items:center;box-shadow:var(--shadow-sm);cursor:pointer;transition:all .2s}
.entry-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--primary-blue-light)}
.entry-ic{width:44px;height:44px;flex:none;border-radius:11px;display:flex;align-items:center;justify-content:center;color:#fff}
.entry-name{font-size:14.5px;font-weight:700}
.entry-desc{font-size:12px;color:var(--text-secondary);margin:2px 0 4px}
.entry-stat{font-size:11.5px;color:var(--text-light)}
/* ===== 按钮 ===== */
.btn{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;padding:7px 16px;border-radius:var(--radius-sm);transition:all .15s;border:1px solid transparent;white-space:nowrap}
.btn.primary{background:var(--primary-blue);color:#fff}
.btn.primary:hover{background:#4C7FA8}
.btn.soft{background:var(--primary-blue-bg);color:var(--primary-blue)}
.btn.soft:hover{background:#DFEAF4}
.btn.outline{background:#fff;border-color:var(--border-light);color:var(--text-primary)}
.btn.outline:hover{border-color:var(--primary-blue);color:var(--primary-blue)}
.btn.danger{color:var(--err-red);background:rgba(214,96,95,.08)}
.btn.danger:hover{background:rgba(214,96,95,.14)}
.btn.orange{background:var(--accent-orange);color:#fff}
.btn.orange:hover{background:var(--accent-orange-active)}
.btn.sm{padding:4px 12px;font-size:12.5px}
.btn.lg{padding:10px 24px;font-size:14px}
.btn:disabled{opacity:.5;cursor:not-allowed}
/* ===== 表格 ===== */
.table-wrap{border:1px solid var(--border-light);border-radius:var(--radius-md);overflow:hidden;overflow-x:auto;background:#fff}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:560px}
th{background:var(--bg-soft);color:var(--text-secondary);font-weight:600;text-align:left;padding:10px 12px;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--border-light);vertical-align:middle}
tbody tr:hover{background:var(--bg-soft)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
/* ===== 标签 ===== */
.tag{display:inline-block;padding:2px 10px;border-radius:12px;font-size:11.5px;white-space:nowrap}
.tag.blue{background:var(--primary-blue-bg);color:var(--primary-blue)}
.tag.green{background:rgba(74,154,90,.12);color:var(--ok-green)}
.tag.red{background:rgba(214,96,95,.1);color:var(--err-red)}
.tag.orange{background:var(--accent-orange-bg);color:var(--accent-orange)}
.tag.gray{background:var(--bg-soft);color:var(--text-secondary)}
/* ===== 上传区 ===== */
.upload-zone{border:2px dashed var(--border-light);border-radius:var(--radius-md);padding:26px;text-align:center;color:var(--text-secondary);cursor:pointer;transition:all .15s;font-size:13px}
.upload-zone:hover{border-color:var(--primary-blue);background:var(--primary-blue-bg);color:var(--primary-blue)}
.upload-zone svg{margin-bottom:6px}
.upload-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap}
/* ===== 工具条（搜索+筛选） ===== */
.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:12px}
.toolbar input[type=text]{width:220px}
.toolbar select{width:130px}
/* ===== 表单 ===== */
.form-row{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:12px}
.form-row label{display:block;font-size:12.5px;color:var(--text-secondary);margin-bottom:4px}
.form-item{flex:1;min-width:180px}
.form-item input,.form-item select,.form-item textarea{width:100%}
.form-item textarea{resize:vertical;min-height:80px}
.form-check-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:4px}
.form-check-grid label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text-primary);margin:0;cursor:pointer;background:var(--bg-soft);padding:7px 10px;border-radius:8px}
.form-check-grid label input{width:auto}
.form-check-grid .cnt{display:flex;align-items:center;gap:6px;margin-left:auto}
.form-check-grid .cnt input{width:52px;padding:3px 6px}
/* ===== 模态框 ===== */
.modal-mask{position:fixed;inset:0;background:rgba(0,0,0,0.3);display:none;align-items:flex-start;justify-content:center;z-index:300;padding:40px 16px;overflow-y:auto}
.modal-mask.show{display:flex;animation:fadeIn .2s}
.modal{background:#fff;border-radius:var(--radius-lg);width:100%;max-width:520px;max-height:85vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg);animation:slideUp .25s}
@keyframes slideUp{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.modal-h{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;border-bottom:1px solid var(--border-light)}
.modal-h h3{font-size:17px;font-weight:700}
.modal-x{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;color:var(--text-secondary);font-size:18px}
.modal-x:hover{background:var(--bg-soft)}
.modal-b{padding:20px 24px;overflow-y:auto}
.modal-f{padding:14px 24px;border-top:1px solid var(--border-light);display:flex;justify-content:flex-end;gap:10px}
.modal.wide{max-width:780px}
/* ===== Toast ===== */
#toast{position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(16px);background:#3A3A3A;color:#fff;padding:10px 22px;border-radius:10px;font-size:13.5px;opacity:0;pointer-events:none;transition:all .3s;z-index:400;box-shadow:var(--shadow-lg);max-width:80vw}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
#toast.ok{background:var(--ok-green)}
#toast.err{background:var(--err-red)}
/* ===== 座位表 ===== */
.seat-grid{display:grid;gap:8px;justify-content:center;margin:12px 0 20px}
.seat{width:80px;height:48px;border:1px solid var(--border-light);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12.5px;background:#fff;cursor:grab;user-select:none;transition:all .15s;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;padding:0 4px}
.seat:hover{border-color:var(--accent-orange);background:var(--c-seat-bg)}
.seat:active{cursor:grabbing}
.seat.dragging{opacity:.4}
.seat.drag-over{border:2px dashed var(--accent-orange);background:var(--c-seat-bg)}
.seat.empty{border-style:dashed;color:var(--text-light);background:transparent;cursor:default}
.seat.empty:hover{border-color:var(--accent-orange);background:var(--c-seat-bg);color:var(--text-secondary)}
.platform{margin:0 auto 16px;width:220px;text-align:center;background:var(--bg-soft);border:1px solid var(--border-light);border-radius:8px;color:var(--text-secondary);font-size:12.5px;padding:6px}
/* ===== 进度徽章（背书表） ===== */
.prog-badge{display:inline-block;min-width:64px;text-align:center;padding:2px 10px;border-radius:12px;font-size:12px;cursor:pointer;user-select:none;border:1px solid transparent}
.prog-0{background:var(--bg-soft);color:var(--text-light);border-color:var(--border-light)}
.prog-1{background:var(--accent-orange-bg);color:var(--accent-orange);border-color:var(--accent-orange-active)}
.prog-2{background:rgba(74,154,90,.12);color:var(--ok-green);border-color:rgba(74,154,90,.3)}
.prog-bar{height:8px;background:var(--bg-soft);border-radius:4px;overflow:hidden;margin:10px 0 4px}
.prog-fill{height:100%;background:linear-gradient(90deg,#5B8DB8,#7BA7CE);border-radius:4px;transition:width .3s}
.prog-total{font-size:12px;color:var(--text-secondary)}
/* ===== 评价等级 ===== */
.grade-A{color:#D4956B;font-weight:700}.grade-B{color:#6B9BC8;font-weight:700}.grade-C{color:#8B8680;font-weight:700}.grade-D{color:#D68B8B;font-weight:700}
.grade-badge{display:inline-block;width:26px;height:26px;line-height:26px;text-align:center;border-radius:8px;font-weight:700;font-size:13px;color:#fff}
.gb-A{background:#D4956B}.gb-B{background:#6B9BC8}.gb-C{background:#8B8680}.gb-D{background:#D68B8B}
/* ===== 统计卡片 ===== */
.stat-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.stat-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-md);padding:14px 16px;box-shadow:var(--shadow-sm)}
.stat-card .v{font-size:22px;font-weight:700;color:var(--primary-blue)}
.stat-card .l{font-size:12px;color:var(--text-secondary)}
.stat-card .v.orange{color:var(--accent-orange)}
.stat-card .v.green{color:var(--ok-green)}
.stat-card .v.red{color:var(--err-red)}
.stat-card .v.pink{color:var(--c-leave)}
.stat-card .v.teal{color:var(--c-paper)}
.stat-card .v.gray{color:var(--neutral-gray)}
/* ===== 柱状图 ===== */
.bar-chart{display:flex;align-items:flex-end;gap:14px;height:150px;padding:10px 4px 0;margin-bottom:10px}
.bar-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bar{width:100%;max-width:46px;border-radius:6px 6px 2px 2px;min-height:4px;transition:height .3s}
.bar-label{font-size:11px;color:var(--text-secondary)}
.bar-val{font-size:11.5px;color:var(--text-primary);font-weight:600}
/* ===== 通讯录 ===== */
.contact-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.contact-card{background:#fff;border:1px solid var(--border-light);border-radius:var(--radius-md);padding:14px 16px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-sm)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--primary-blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;font-weight:600;flex:none}
.contact-info{flex:1;min-width:0}
.contact-info .cn{font-weight:600;font-size:13.5px}
.contact-info .cp{font-size:12px;color:var(--text-secondary)}
.contact-info .cpn{font-size:12px;color:var(--text-light)}
/* ===== 特殊学生分组 ===== */
.special-group{margin-bottom:14px}
.special-group .sg-title{font-size:13.5px;font-weight:700;color:var(--accent-orange);margin-bottom:8px;display:flex;align-items:center;gap:6px}
.special-group .sg-title::before{content:'';width:8px;height:8px;border-radius:50%;background:var(--accent-orange)}
/* ===== 分段控件 ===== */
.seg{display:inline-flex;background:var(--bg-soft);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 18px;border-radius:8px;font-size:13px;color:var(--text-secondary)}
.seg button.active{background:#fff;color:var(--primary-blue);font-weight:600;box-shadow:var(--shadow-sm)}
/* ===== 排行榜 ===== */
.rank-1{color:#D4A020;font-weight:700}.rank-2{color:#999;font-weight:700}.rank-3{color:#B87333;font-weight:700}
.point-bar{height:10px;background:var(--bg-soft);border-radius:5px;overflow:hidden;min-width:100px}
.point-fill{height:100%;background:linear-gradient(90deg,#F0A04B,#F5B870);border-radius:5px}
.point-val{color:var(--c-point);font-weight:700}
/* ===== 检索平台卡片 ===== */
.plat-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:12px}
.plat-card{border:1px solid var(--border-light);border-radius:var(--radius-md);padding:16px;cursor:pointer;transition:all .15s;background:#fff}
.plat-card:hover{border-color:var(--primary-blue);box-shadow:var(--shadow-md)}
.plat-card .pt{font-weight:700;font-size:14px;margin-bottom:4px}
.plat-card .pd{font-size:12px;color:var(--text-secondary);min-height:36px}
.plat-card .go{font-size:12px;color:var(--primary-blue)}
/* ===== 移动端 ===== */
@media (max-width:768px){
  header{height:52px;padding:0 12px;gap:10px}
  .brand-title{font-size:16px}
  .welcome,.save-indicator{display:none!important}
  .hamburger{display:flex}
  .sidebar{position:fixed;left:0;top:0;height:100vh;z-index:200;transform:translateX(-100%);transition:transform .25s;box-shadow:var(--shadow-lg);width:230px;padding-top:70px}
  .sidebar.open{transform:translateX(0)}
  main{padding:16px}
  .overview-grid{grid-template-columns:repeat(2,1fr)}
  .entry-grid{grid-template-columns:1fr}
  .form-row{flex-direction:column;gap:8px}
  .form-item{min-width:0}
  .modal-mask{padding:16px 10px}
  .modal{max-width:100%;max-height:88vh}
  .seat{width:60px;height:40px;font-size:11px}
  .stat-card{min-width:100px}
  .toolbar input[type=text]{width:100%}
  .toolbar select{flex:1}
}
@media (max-width:480px){
  .overview-grid{grid-template-columns:1fr}
  .btn{padding:6px 12px;font-size:12.5px}
  .entry-card{padding:14px}
}
</style>
</head>
<body>
<header>
  <button class="hamburger" id="hamburger" title="菜单"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="4" y1="7" x2="20" y2="7"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="17" x2="20" y2="17"/></svg></button>
  <div class="logo">师</div>

function saveDB(){

function loadDB(){
  var raw=null;
  try{raw=localStorage.getItem(STORE_KEY)}catch(e){}
  if(!raw)return;
  var d=null;
  try{d=JSON.parse(raw)}catch(e){toast('数据读取失败','err');return}
  if(!d||typeof d!=='object')return;
  DB.resources=(d.resources||[]).filter(function(x){return x&&x.id});
  DB.papers=(d.papers||[]).filter(function(x){return x&&x.id});
  DB.recitation=(d.recitation||[]).filter(function(x){return x&&x.id});
  DB.students=(d.students||[]).filter(function(x){return x&&x.id});
  DB.points=(d.points||[]).filter(function(x){return x&&x.id});
  DB.leaves=(d.leaves||[]).filter(function(x){return x&&x.id});
  DB.evaluations=(d.evaluations||[]).filter(function(x){return x&&x.id});
  DB.communications=(d.communications||[]).filter(function(x){return x&&x.id});
  DB.seating=(d.seating&&d.seating.layout)?d.seating:{rows:5,cols:8,layout:[]};
  /* 迁移：exams.subject -> subjects */
  DB.exams=(d.exams||[]).filter(function(x){return x&&x.id}).map(function(x){
    if(!x.subjects){
      x.subjects=x.subject?[x.subject]:[];
    }
    return x;
  });
  /* 迁移：grades.score -> scores + total */
  DB.grades=(d.grades||[]).filter(function(x){return x&&x.id}).map(function(g){
    if(!g.scores&&g.score!=null){
      g.scores={};var subj=(g.examId?findExamSubjects(g.examId):[]);
      if(subj.length)g.scores[subj[0]]=g.score;
      g.total=g.score;
    }
    return g;
  });
  /* 迁移：recitation.items -> pieces + records */
  DB.recitation=DB.recitation.map(function(r){
    if(!r.pieces){
      r.pieces=(r.items||[]).map(function(x){return typeof x==='string'?{id:uid('p'),content:x}:x});
    }
    if(!r.records)r.records={};
    return r;
  });
}
function findExamSubjects(examId){
  for(var i=0;i<DB.exams.length;i++)if(DB.exams[i].id===examId)return DB.exams[i].subjects||[];
  return [];
}

/* ===== CSV 工具 ===== */
function parseCSV(text){
  var s=String(text||'');
  if(s.charCodeAt(0)===0xFEFF)s=s.slice(1);
  s=s.replace(/\r\n/g,'\n').replace(/\r/g,'\n');
  var rows=[],cur='',inQ=false,row=[];
  for(var i=0;i<s.length;i++){
    var c=s[i];
    if(inQ){
      if(c==='"'){
        if(s[i+1]==='"'){cur+='"';i++}
        else inQ=false;
      }else cur+=c;
    }else{
      if(c==='"')inQ=true;
      else if(c===','){row.push(cur);cur=''}
      else if(c==='\n'){row.push(cur);rows.push(row);row=[];cur=''}
      else cur+=c;
    }
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows;
}
function csvLine(arr){return arr.map(function(v){
  v=String(v==null?'':v);
  return /[",\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v;
}).join(',')}
function downloadFile(name,content,mime){
  var blob=new Blob([content],{type:mime||'text/plain;charset=utf-8'});
  var a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=name;
  document.body.appendChild(a);
  a.click();
  setTimeout(function(){URL.revokeObjectURL(a.href);a.remove()},200);
}
function downloadCSV(name,rows){downloadFile(name,'\ufeff'+rows.map(csvLine).join('\n'),'text/csv;charset=utf-8')}

function studentById(id){
  for(var i=0;i<DB.students.length;i++)if(DB.students[i].id===id)return DB.students[i];
  return null;
}
function studentName(id){var s=studentById(id);return s?s.name:'未知'}
function examById(id){
  for(var i=0;i<DB.exams.length;i++)if(DB.exams[i].id===id)return DB.exams[i];
  return null;
}
function pointsOf(sid){var t=0;DB.points.forEach(function(p){if(p.studentId===sid)t+=p.value});return t}
function activeLeaves(){return DB.leaves.filter(function(l){return l.status==='active'}).length}
function evalTotal(id){var s=studentById(id);if(!s)return 0;var sc=finalScoreOf(id);return sc}
function finalScoreOf(sid){
  for(var i=0;i<DB.exams.length;i++){
    var ex=DB.exams[i];
    if(ex.name&&String(ex.name).indexOf('期末')>=0){
      for(var j=0;j<DB.grades.length;j++){
        var g=DB.grades[j];
        if(g.examId===ex.id&&g.studentId===sid)return g.total||0;
      }
    }
  }
  return 0;
}
function examGrade(examId,sid){
  for(var j=0;j<DB.grades.length;j++){
    var g=DB.grades[j];
    if(g.examId===examId&&g.studentId===sid)return g;
  }
  return null;
}

function createPaper(id){
  var name=$('ppName').value.trim();

  var subj=$('ppSubj').value,type=$('ppType').value,note=$('ppNote').value.trim();
  var questions=[];
  QUESTION_TYPES.forEach(function(q){
    var cb=document.querySelector('.form-check-grid input[data-k="'+q.k+'"]');
    var cntInput=cb.parentNode.querySelector('.cnt input');
    if(!cb.checked)return;
    var n=parseInt(cntInput.value,10)||0;
    for(var i=1;i<=n;i++){
      questions.push({type:q.k,index:i,content:q.n+' '+i,score:q.score});
    }
  });
  if(!questions.length){toast('请至少选择一种题型','err');return}
  if(id){
    for(var i=0;i<DB.papers.length;i++){
      if(DB.papers[i].id===id){
        DB.papers[i].name=name;DB.papers[i].subject=subj;DB.papers[i].type=type;
        DB.papers[i].note=note;DB.papers[i].questions=questions;
        break;
      }
    }
    toast('已保存修改');
  }else{
    DB.papers.unshift({id:uid('p'),name:name,subject:subj,type:type,note:note,questions:questions,createDate:nowStr()});
    toast('试卷「'+name+'」已生成');
  }

function saveRec(id){
  var title=$('recName').value.trim();
  if(!title){toast('请填写名称','err');return}
  var pieces=$('recPieces').value.split('\n').map(function(x){return x.trim()}).filter(Boolean)
    .map(function(x){return {id:uid('p'),content:x}});
  if(!pieces.length){toast('请至少填写一项背诵内容','err');return}
  var subj=$('recSubj').value;
  if(id){
    for(var i=0;i<DB.recitation.length;i++){
      if(DB.recitation[i].id===id){
        var old=DB.recitation[i];
        var keep={};
        pieces.forEach(function(p){if(old.records)keep[p.id]=old.records[p.id]||{}});
        var oldByContent={};(old.pieces||[]).forEach(function(p,i){oldByContent[p.content]=old.records?old.records[old.pieces[i].id]:undefined});
        var merged={};
        pieces.forEach(function(p){merged[p.id]=(oldByContent[p.content]!==undefined)?oldByContent[p.content]:{}});
        old.title=title;old.subject=subj;old.pieces=pieces;old.records=merged;
        break;
      }
    }
    toast('已保存');
  }else{
    var records={};
    pieces.forEach(function(p){records[p.id]={}});
    DB.recitation.unshift({id:uid('rt'),title:title,subject:subj,pieces:pieces,records:records,createDate:nowStr()});
    toast('已创建背书表');
  }
  saveDB();closeModal();renderRecitation();
}

function viewRec(id){
  var r=null;

  if(!r)return;
  var sts=DB.students.map(function(s){return s.id});
  var pieces=r.pieces||[];
  var head='<tr><th>学生</th>'+pieces.map(function(p){return '<th style="min-width:90px">'+esc(p.content.slice(0,8))+'</th>'}).join('')+'<th>完成度</th></tr>';

  sts.forEach(function(sid){

    var cells=pieces.map(function(p,i){
      var v=rec[p.id]||0;
      if(v===2)done++;
      return '<td><span class="prog-badge prog-'+v+'" onclick="toggleReciteProgress(\''+id+'\',\''+sid+'\',\''+p.id+'\')">'+['未背','背诵中','已背'][v]+'</span></td>';
    }).join('');
    var pct=pieces.length?Math.round(done/pieces.length*100):0;
    rows+='<tr><td>'+esc(studentName(sid))+'</td>'+cells+'<td><div class="prog-bar"><div class="prog-fill" style="width:'+pct+'%"></div></div><div class="prog-total">'+done+'/'+pieces.length+'</div></td></tr>';
  });
  var body='<div class="prog-bar" style="margin:0 0 14px"><div class="prog-fill" id="recOverall"></div></div><div class="table-wrap" style="overflow-x:auto"><table style="min-width:640px">'+head+rows+'</table></div>';
  openModal(modalShell('查看：'+esc(r.title),body,'<button class="btn outline" onclick="closeModal()">关闭</button>'));
}
function toggleReciteProgress(rid,sid,pidx){
  var r=null;
  for(var i=0;i<DB.recitation.length;i++)if(DB.recitation[i].id===rid){r=DB.recitation[i];break}
  if(!r)return;
  r.records[sid]=r.records[sid]||{};
  var v=r.records[sid][pidx]||0;
  r.records[sid][pidx]=(v+1)%3;
  saveDB();viewRec(rid);
}
function downloadRecTpl(id){

  for(var i=0;i<DB.recitation.length;i++)if(DB.recitation[i].id===id){r=DB.recitation[i];break}
  if(!r)return;
  var rows=[['姓名'].concat((r.pieces||[]).map(function(p){return p.content})).concat(['背诵进度'])];
  DB.students.forEach(function(s){rows.push([s.name].concat((r.pieces||[]).map(function(){return '未背'})).concat(['未背']))});
  downloadCSV(safeFileName(r.title)+'_模板.csv',rows);

function importRecCsv(id,inp){
  var f=inp.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    var rows=parseCSV(reader.result);
    if(!rows.length){toast('文件为空','err');return}
    var r=null;
    for(var i=0;i<DB.recitation.length;i++)if(DB.recitation[i].id===id){r=DB.recitation[i];break}
    if(!r)return;
    var sts=DB.students;
    var header=rows[0];
    var titleIdx=header.indexOf('姓名');
    if(titleIdx<0)titleIdx=0;
    var progIdx=header.indexOf('背诵进度');
    var pieces=r.pieces||[];
    var headerMap={};
    for(var c=0;c<header.length;c++){
      for(var pi=0;pi<pieces.length;pi++){
        if(header[c]===pieces[pi].content)headerMap[c]=pieces[pi].id;
      }
    }
    var count=0;
    for(var ri=1;ri<rows.length;ri++){
      var row=rows[ri];
      var nm=String(row[titleIdx]||'').trim();
      if(!nm)continue;
      var sid=null;
      for(var si=0;si<sts.length;si++)if(sts[si].name===nm){sid=sts[si].id;break}
      if(!sid)continue;
      r.records[sid]=r.records[sid]||{};
      for(var ci=0;ci<row.length;ci++){
        var pid=headerMap[ci];
        if(!pid)continue;
        var v=String(row[ci]||'').trim();
        var num='0';
        if(v==='已背'||v==='2')num='2';
        else if(v==='背诵中'||v==='1')num='1';
        r.records[sid][pid]=parseInt(num,10)||0;
      }
      if(progIdx>=0&&row[progIdx]!=null){
        var pv=String(row[progIdx]).trim();
        var fill=pv==='已背'?2:(pv==='背诵中'?1:0);
        pieces.forEach(function(p){r.records[sid][p.id]=fill});
      }
      count++;
    }
    saveDB();inp.value='';renderRecitation();toast('已导入 '+count+' 名学生进度');
  };
  reader.readAsText(f);
}

function doImportGradesFromFile(){
  var name=$('gdName').value.trim();
  if(!name){toast('请填写考试名称','err');return}
  if(!window._gradeImportText){toast('请先选择成绩文件','err');return}
  var rows=parseCSV(window._gradeImportText);
  if(rows.length<2){toast('文件无数据','err');return}
  var header=rows[0];
  var nameIdx=header.indexOf('姓名');
  if(nameIdx<0)nameIdx=0;
  var subjects=[];
  for(var c=0;c<header.length;c++){
    if(c===nameIdx)continue;
    if(String(header[c]||'').trim())subjects.push(String(header[c]).trim());
  }
  if(!subjects.length){toast('未识别到科目列','err');return}
  var examId=uid('e');
  var date=$('gdDate').value||todayStr();
  var exam={id:examId,name:name,date:date,subjects:subjects};
  DB.exams.unshift(exam);
  var added=0;
  for(var ri=1;ri<rows.length;ri++){
    var row=rows[ri];
    var nm=String(row[nameIdx]||'').trim();
    if(!nm)continue;
    var sid=null;
    for(var si=0;si<DB.students.length;si++){
      if(DB.students[si].name===nm){sid=DB.students[si].id;break}
    }
    if(!sid)continue;
    var scores={},total=0;
    subjects.forEach(function(s,i){
      var v=parseFloat(row[nameIdx+1+i]);
      if(!isNaN(v)&&v>=0){scores[s]=v;total+=v}
    });
    DB.grades.push({id:uid('g'),examId:examId,studentId:sid,studentName:nm,scores:scores,total:Math.round(total*10)/10,date:date});
    added++;
  }
  window._gradeImportText=null;
  saveDB();closeModal();renderGrades();
  toast('成功导入 '+added+' 名学生成绩');
}

    DB.grades=DB.grades.filter(function(g){return g.examId!==examId});

function viewGradeAnalysis(examId){
  var ex=examById(examId);
  if(!ex)return;
  var gs=DB.grades.filter(function(g){return g.examId===examId});
  if(!gs.length){toast('该考试暂无成绩','err');return}
  var line=ex.subjects?ex.subjects.length*60:(SUBJECTS.length*60);
  var totals=gs.map(function(g){return g.total||0});
  var avg=Math.round(totals.reduce(function(a,b){return a+b},0)/totals.length*10)/10;
  var max=Math.max.apply(null,totals),min=Math.min.apply(null,totals);
  var pass=gs.filter(function(g){return g.total>=line}).length;
  var passRate=Math.round(pass/gs.length*100);
  var bands=[
    ['优秀',gs.filter(function(g){return g.total>=line*1.5}).length,'#D4956B'],
    ['良好',gs.filter(function(g){return g.total>=line*1.33&&g.total<line*1.5}).length,'#5B8DB8'],
    ['中等',gs.filter(function(g){return g.total>=line*1.17&&g.total<line*1.33}).length,'#7BA7CE'],
    ['及格',gs.filter(function(g){return g.total>=line&&g.total<line*1.17}).length,'#F0A04B'],
    ['不及格',gs.filter(function(g){return g.total<line}).length,'#D68B8B']];
  var maxBand=Math.max.apply(null,bands.map(function(b){return b[1]}))||1;
  var body='<div class="stat-row">'
    +'<div class="stat-card"><div class="v">'+avg+'</div><div class="l">总分平均</div></div>'
    +'<div class="stat-card"><div class="v green">'+max+'</div><div class="l">最高分</div></div>'
    +'<div class="stat-card"><div class="v red">'+min+'</div><div class="l">最低分</div></div>'
    +'<div class="stat-card"><div class="v orange">'+passRate+'%</div><div class="l">及格率</div></div></div>';
  body+='<div class="card" style="margin-bottom:14px"><div class="card-title">分数段分布<span class="sub">及格线 '+line+' 分</span></div><div class="bar-chart">'
    +bands.map(function(b){return '<div class="bar-item"><div class="bar-val">'+b[1]+'</div><div class="bar" style="height:'+(b[1]/maxBand*100)+'%;background:'+b[2]+'"></div><div class="bar-label">'+b[0]+'</div></div>'}).join('')
    +'</div></div>';
  if(ex.subjects&&ex.subjects.length>1){
    body+='<div class="card" style="margin-bottom:14px"><div class="card-title">各科分析</div><div class="table-wrap"><table style="min-width:400px"><thead><tr><th>科目</th><th>平均分</th><th>最高</th><th>最低</th><th>及格率</th></tr></thead><tbody>';
    ex.subjects.forEach(function(s){
      var vals=gs.map(function(g){return g.scores[s]}).filter(function(v){return v!=null});
      if(!vals.length)return;
      var sa=Math.round(vals.reduce(function(a,b){return a+b},0)/vals.length*10)/10;
      var smax=Math.max.apply(null,vals),smin=Math.min.apply(null,vals);
      var spass=vals.filter(function(v){return v>=60}).length;
      body+='<tr><td>'+esc(s)+'</td><td>'+sa+'</td><td>'+smax+'</td><td>'+smin+'</td><td>'+Math.round(spass/vals.length*100)+'%</td></tr>';
    });
    body+='</tbody></table></div></div>';
  }
  var idx=DB.exams.indexOf(ex);
  if(idx<DB.exams.length-1){
    var prev=DB.exams[idx+1];
    var prevGs=DB.grades.filter(function(g){return g.examId===prev.id});
    if(prevGs.length){
      body+='<div class="card" style="margin-bottom:14px"><div class="card-title">进退情况<span class="sub">对比上次考试：'+esc(prev.name)+'</span></div><div class="table-wrap"><table style="min-width:400px"><thead><tr><th>学生</th><th>本次总分</th><th>上次总分</th><th>变化</th></tr></thead><tbody>';
      var sorted=gs.slice().sort(function(a,b){return (b.total||0)-(a.total||0)});
      sorted.forEach(function(g){
        var pg=examGrade(prev.id,g.studentId);
        var diff=pg?(g.total-pg.total):null;
        var icon=diff==null?'—':(diff>0?'<span style="color:var(--ok-green)">↑ +'+diff+'</span>':(diff<0?'<span style="color:var(--err-red)">↓ '+diff+'</span>':'<span style="color:var(--text-light)">→ 0</span>'));

  sortedAll.forEach(function(g,i){

    var lv=pct>=1.5?'A':pct>=1.33?'B':'C';
    body+='<tr><td>'+(i+1)+'</td><td>'+esc(g.studentName)+'</td>'
      +(ex.subjects||[]).map(function(s){return '<td>'+(g.scores[s]!=null?g.scores[s]:'—')+'</td>'}).join('')
      +'<td style="font-weight:700">'+g.total+'</td><td><span class="grade-badge gb-'+lv+'">'+lv+'</span></td></tr>';
  });
  body+='</tbody></table></div></div>';
  openModal(modalShell('成绩分析：'+esc(ex.name),body,'<button class="btn outline" onclick="closeModal()">关闭</button>'));
}

var dragPos=null;
function seatingGrid(rows,cols){
  var l=DB.seating.layout||[];
  if(!Array.isArray(l))l=[];
  DB.seating.layout=l;
  while(l.length<rows)l.push([]);
  for(var r=0;r<rows;r++){
    while(l[r].length<cols)l[r].push(null);
    l[r].length=cols;
  }
  return l;
}
function renderSeating(){
  var rows=DB.seating.rows||5,cols=DB.seating.cols||8;
  seatingGrid(rows,cols);
  var html=pageHead('座位表',DB.students.length+' 名学生',
    '<button class="btn primary" onclick="autoSeating()">自动生成座位表</button>'
    +'<button class="btn soft" onclick="openSeatConfig()">设置行列</button>'
    +'<button class="btn outline" onclick="exportSeating()">导出</button>');
  html+='<div class="card"><div class="platform">— 讲台 —</div>';
  html+='<div class="seat-grid" style="grid-template-columns:repeat('+cols+',80px)">';
  for(var r=0;r<rows;r++){
    for(var c=0;c<cols;c++){
      var sid=DB.seating.layout[r][c];
      var s=sid?studentById(sid):null;
      var isE=!sid;
      html+='<div class="seat'+(isE?' empty':'')+'" draggable="'+(isE?'false':'true')+'"'
        +' ondragstart="dragSeat(event,'+r+','+c+')" ondragover="event.preventDefault();this.classList.add(\'drag-over\')"'
        +' ondragleave="this.classList.remove(\'drag-over\')"'
        +' ondrop="dropSeat(event,'+r+','+c+')" ondragend="clearSeatDrag()"'
        +' onclick="editSeat('+r+','+c+')">'+(s?esc(s.name):'空')+'</div>';
    }
  }
  html+='</div></div>';
  $('content').innerHTML=html;
}
function clearSeatDrag(){
  document.querySelectorAll('.seat').forEach(function(el){el.classList.remove('dragging','drag-over')});
}
function dragSeat(ev,r,c){
  dragPos={r:r,c:c};
  ev.dataTransfer.setData('text/plain','');
  ev.dataTransfer.effectAllowed='move';
  var el=ev.target;
  setTimeout(function(){el.classList.add('dragging')},0);
}
function dropSeat(ev,r2,c2){
  ev.preventDefault();
  ev.target.classList.remove('drag-over');
  if(!dragPos)return;
  var r1=dragPos.r,c1=dragPos.c;
  dragPos=null;
  if(r1===r2&&c1===c2)return;
  var l=seatingGrid(DB.seating.rows,DB.seating.cols);
  var t=l[r1][c1];
  l[r1][c1]=l[r2][c2];
  l[r2][c2]=t;
  saveDB();renderSeating();
  toast('座位已交换');
}
function editSeat(r,c){
  var l=seatingGrid(DB.seating.rows,DB.seating.cols);
  var cur=l[r][c];
  var body='<div class="form-row"><div class="form-item"><label>选择学生</label><select id="seatStu"><option value="">设为空座位</option>'
    +DB.students.map(function(s){return '<option value="'+s.id+'"'+(cur===s.id?' selected':'')+'>'+esc(s.name)+'</option>'}).join('')
    +'</select></div></div>';
  openModal(modalShell('设置座位（第'+(r+1)+'行 第'+(c+1)+'列）',body,
    '<button class="btn outline" onclick="closeModal()">取消</button><button class="btn primary" id="seatOk">确定</button>'));
  $('seatOk').onclick=function(){
    l[r][c]=$('seatStu').value||null;
    saveDB();closeModal();renderSeating();toast('座位已更新');
  };
}
function autoSeating(){
  if(!DB.students.length){toast('请先添加学生','err');return}
  confirmDialog('自动生成座位表将打乱当前排列，继续？',function(){
    var rows=DB.seating.rows||5,cols=DB.seating.cols||8;
    var arr=DB.students.map(function(s){return s.id}).sort(function(){return Math.random()-0.5});
    var l=seatingGrid(rows,cols);
    for(var r=0;r<rows;r++)for(var c=0;c<cols;c++)l[r][c]=null;
    for(var k=0;k<arr.length;k++)l[Math.floor(k/cols)][k%cols]=arr[k];
    saveDB();renderSeating();toast('座位表已生成');
  });
}
function openSeatConfig(){
  openModal(modalShell('设置行列',
    '<div class="form-row"><div class="form-item"><label>行数（1-10）</label><input type="number" id="seatRows" min="1" max="10" value="'+(DB.seating.rows||5)+'"></div>'

function exportSeating(){
  var rows=DB.seating.rows||5,cols=DB.seating.cols||8;

function recalcEvalLevels(){
  var evals=DB.evaluations.slice().sort(function(a,b){return (b.totalScore||0)-(a.totalScore||0)});
  var n=evals.length;
  if(!n)return;
  var aCount=Math.max(1,Math.round(n*0.2));
  var bCount=Math.max(1,Math.round(n*0.4));
  var cCount=Math.max(1,Math.round(n*0.2));
  evals.forEach(function(e,i){
    if(i<aCount)e.level='A';
    else if(i<aCount+bCount)e.level='B';
    else if(i<aCount+bCount+cCount)e.level='C';
    else e.level='D';
  });
}

  html+='<div class="card"><div class="card-title">评价列表<span class="sub">按综合分降序</span></div>'
    +'<div class="table-wrap"><table><thead><tr><th>排名</th><th>姓名</th><th>教师打分</th><th>期末成绩</th><th>综合分</th><th>等级</th><th>评语</th><th>操作</th></tr></thead><tbody>';
  if(!evals.length)html+='<tr><td colspan="8" style="text-align:center;color:var(--text-light);padding:30px">暂无评价，点击「生成评价」</td></tr>';
  evals.forEach(function(e,i){
    var lv=e.level||'B';
    html+='<tr><td>'+(i+1)+'</td><td>'+esc(e.studentName||studentName(e.studentId))+'</td>'
      +'<td>'+e.teacherScore+'</td><td>'+(e.gradeScore!=null?e.gradeScore:'—')+'</td>'
      +'<td style="font-weight:700">'+(e.totalScore!=null?e.totalScore:'—')+'</td>'
      +'<td><span class="grade-badge gb-'+lv+'">'+lv+'</span></td>'
      +'<td style="max-width:320px">'+esc(e.comment||'')+'</td>'
      +'<td><div class="actions"><button class="btn sm outline" onclick="editEval(\''+e.id+'\')">编辑</button>'
      +'<button class="btn sm danger" onclick="delEval(\''+e.id+'\')">删除</button></div></td></tr>';
  });
  html+='</tbody></table></div></div>';
  $('content').innerHTML=html;
}
function evalStudentsOptions(){
  var evaled={};
  DB.evaluations.forEach(function(e){evaled[e.studentId]=true});
  var opts=DB.students.map(function(s){
    var fs=finalScoreOf(s.id);
    var dis=evaled[s.id]?'disabled ':'';
    return '<option value="'+s.id+'"'+dis+'>'+esc(s.name)+'（期末：'+(fs||'无')+'）</option>';
  }).join('');
  if(!opts)return '<option value="">请先添加学生</option>';
  return opts;
}
function openEvalForm(){
  if(!DB.students.length){toast('请先添加学生','err');return}
  var body='<div class="form-row"><div class="form-item"><label>选择学生</label><select id="evStu" onchange="evalSyncGrade()">'
    +evalStudentsOptions()+'</select></div></div>'
    +'<div class="form-row"><div class="form-item"><label>教师打分（0-100）</label><input type="number" id="evTeacher" min="0" max="100" value="85"></div>'
    +'<div class="form-item"><label>期末成绩（自动获取）</label><input type="number" id="evGrade" readonly style="background:var(--bg-soft)"></div></div>'
    +'<div class="form-row"><div class="form-item"><label>评语风格</label><select id="evStyle">'
    +EVAL_STYLES.map(function(s){return '<option value="'+s[0]+'">'+s[1]+'</option>'}).join('')+'</select></div>'
    +'<div class="form-item"><label>综合分</label><div id="evTotal" style="font-size:18px;font-weight:700;color:var(--primary-blue)">—</div></div></div>'
    +'<div id="evNoFinal" style="display:none;font-size:12px;color:var(--accent-orange);margin-bottom:8px">未找到期末考试，期末成绩按 0 分计算。</div>';
  openModal(modalShell('生成评价',body,
    '<button class="btn outline" onclick="closeModal()">取消</button><button class="btn primary" id="evOk">保存</button>'));
  $('evTeacher').oninput=evalSyncGrade;
  evalSyncGrade();
  $('evOk').onclick=function(){
    var sid=$('evStu').value;
    if(!sid){toast('请选择学生','err');return}
    if(DB.evaluations.some(function(e){return e.studentId===sid})){toast('该学生已评价，可编辑原记录','err');return}
    var ts=parseFloat($('evTeacher').value);
    if(isNaN(ts)||ts<0||ts>100){toast('教师打分需在 0-100','err');return}
    var gs=parseFloat($('evGrade').value)||0;
    var total=Math.round((ts*0.4+gs*0.6)*10)/10;
    var ev={id:uid('ev'),studentId:sid,studentName:studentName(sid),teacherScore:ts,gradeScore:gs,totalScore:total,level:'B',comment:'',date:nowStr()};
    DB.evaluations.push(ev);
    recalcEvalLevels();
    ev.comment=generateComment(ev.level,$('evStyle').value);
    saveDB();closeModal();renderEvaluations();
    toast('已生成评价，等级 '+ev.level);
  };
}
function evalSyncGrade(){
  var sid=$('evStu')?$('evStu').value:null;
  var gs=0;
  if(sid){gs=finalScoreOf(sid);$('evGrade').value=gs;}
  var ts=parseFloat($('evTeacher').value)||0;
  var total=Math.round((ts*0.4+gs*0.6)*10)/10;
  if($('evTotal'))$('evTotal').textContent=total;
  if($('evNoFinal'))$('evNoFinal').style.display=gs?'none':'block';
}
function generateComment(level,style){
  var tpls=EVAL_TPL[level]||EVAL_TPL.B;
  var list=tpls[style]||tpls.default||EVAL_TPL[level].default;
  var pick=list[Math.floor(Math.random()*list.length)];
  var used={};
  DB.evaluations.forEach(function(e){if(e.comment)used[e.comment]=true});
  if(used[pick]&&list.length>1){
    for(var i=0;i<list.length;i++){
      if(!used[list[i]]){pick=list[i];break}
    }
  }
  return pick;
}
function editEval(id){
  var e=null;
  for(var i=0;i<DB.evaluations.length;i++)if(DB.evaluations[i].id===id){e=DB.evaluations[i];break}
  if(!e)return;
  var gs=finalScoreOf(e.studentId)||e.gradeScore||0;
  var body='<div class="form-row"><div class="form-item"><label>学生</label><input value="'+esc(e.studentName)+'" readonly style="background:var(--bg-soft)"></div></div>'
    +'<div class="form-row"><div class="form-item"><label>教师打分（0-100）</label><input type="number" id="evTeacher" min="0" max="100" value="'+e.teacherScore+'"></div>'
    +'<div class="form-item"><label>期末成绩</label><input type="number" id="evGrade" value="'+(gs||0)+'" readonly style="background:var(--bg-soft)"></div></div>'
    +'<div class="form-row"><div class="form-item"><label>评语</label><textarea id="evComment" style="min-height:90px">'+esc(e.comment||'')+'</textarea></div></div>';
  openModal(modalShell('编辑评价',body,
    '<button class="btn outline" onclick="closeModal()">取消</button><button class="btn primary" id="evOk">保存</button>'));
  $('evOk').onclick=function(){
    var ts=parseFloat($('evTeacher').value);
    if(isNaN(ts)||ts<0||ts>100){toast('教师打分需在 0-100','err');return}
    e.teacherScore=ts;
    e.gradeScore=gs||0;
    e.totalScore=Math.round((ts*0.4+(gs||0)*0.6)*10)/10;
    e.comment=$('evComment').value.trim();
    recalcEvalLevels();
    saveDB();closeModal();renderEvaluations();
    toast('已保存，等级 '+e.level);
  };
}
function delEval(id){
  confirmDialog('删除这条评价？',function(){
    DB.evaluations=DB.evaluations.filter(function(x){return x.id!==id});
    recalcEvalLevels();
    saveDB();renderEvaluations();toast('已删除');
  });
}
function exportEvals(){
  var rows=[['姓名','教师打分','成绩分','综合分','等级','评语']];
  DB.evaluations.forEach(function(e){
    rows.push([e.studentName||studentName(e.studentId),e.teacherScore,e.gradeScore||'',e.totalScore,e.level||'B',e.comment||'']);
  });
  downloadCSV('学生评价.csv',rows);
  toast('已导出');
}
/* ================= 家校共育 ================= */
var COMM_VIEW='special';
function renderCommunications(){
  var today=DB.communications.filter(function(c){return String(c.date).indexOf(todayStr())===0}).length;
  var html=pageHead('家校共育','今日新增 '+today+' 次沟通',
    '<button class="btn primary" onclick="openCommForm()">记录沟通</button>'
    +'<button class="btn outline" onclick="exportComms()">导出</button>');
  html+='<div class="seg" style="margin-bottom:16px">'
    +'<button class="'+(COMM_VIEW==='special'?'active':'')+'" onclick="COMM_VIEW=\'special\';renderCommunications()">特殊学生</button>'
    +'<button class="'+(COMM_VIEW==='contact'?'active':'')+'" onclick="COMM_VIEW=\'contact\';renderCommunications()">家长通讯录</button>'
    +'<button class="'+(COMM_VIEW==='comm'?'active':'')+'" onclick="COMM_VIEW=\'comm\';renderCommunications()">家校沟通</button></div>';
  if(COMM_VIEW==='special'){
    var groups={'单亲':[],'孤儿':[],'低保':[],'脱贫户':[],'贫困':[]};
    DB.students.forEach(function(s){
      var fs=s.familyStatus||'普通';
      if(groups[fs])groups[fs].push(s);
    });
    var keys=['单亲','孤儿','低保','脱贫户','贫困'];
    var any=keys.some(function(k){return groups[k].length});
    if(!any){
      html+='<div class="card"><div style="text-align:center;color:var(--text-light);padding:40px">暂未登记特殊家庭学生</div></div>';
    }else{
      keys.forEach(function(k){
        var list=groups[k];
        if(!list.length)return;
        html+='<div class="card"><div class="special-group" style="margin:0"><div class="sg-title">'+k+'（'+list.length+' 人）</div>'
          +'<div class="table-wrap"><table style="min-width:420px"><thead><tr><th>姓名</th><th>性别</th><th>家长</th><th>联系方式</th><th>家庭住址</th></tr></thead><tbody>';
        list.forEach(function(s){
          html+='<tr><td>'+esc(s.name)+'</td><td>'+esc(s.gender||'')+'</td><td>'+esc(s.parentName||'')+'</td><td>'+esc(s.phone||'')+'</td><td>'+esc(s.address||'')+'</td></tr>';
        });
        html+='</tbody></table></div></div>';
      });
    }
  }else if(COMM_VIEW==='contact'){
    var q=(window._conQ||'').toLowerCase();
    var list=DB.students.filter(function(s){
      if(!s.parentName&&!s.phone)return false;
      return !q||String(s.name).toLowerCase().indexOf(q)>=0||String(s.parentName||'').toLowerCase().indexOf(q)>=0;
    });
    html+='<div class="card"><div class="card-title">家长通讯录<span class="sub">'+list.length+' 人</span></div>'
      +'<div class="toolbar"><input type="text" placeholder="按学生或家长姓名搜索…" value="'+(window._conQ||'')+'" oninput="window._conQ=this.value;renderCommunications()"></div>'
      +'<div class="contact-grid">';
    if(!list.length)html+='<div style="text-align:center;color:var(--text-light);padding:40px;grid-column:1/-1">暂无家长信息</div>';
    list.forEach(function(s){
      html+='<div class="contact-card"><div class="avatar">'+esc(s.name.slice(0,1))+'</div>'
        +'<div class="contact-info"><div class="cn">'+esc(s.name)+' <span style="font-size:11px;color:var(--text-light)">的家长</span></div>'
        +'<div class="cpn">'+esc(s.parentName||'未填写')+'</div><div class="cp">'+esc(s.phone||'')+'</div></div>'
        +'<button class="btn sm soft" onclick="callParent(\''+esc(s.phone)+'\')">联系</button></div>';
    });
    html+='</div></div>';
  }else{
    html+='<div class="card"><div class="card-title">沟通记录<span class="sub">共 '+DB.communications.length+' 条</span></div>'
      +'<div class="table-wrap"><table><thead><tr><th>日期</th><th>学生</th><th>方式</th><th>沟通内容</th><th>家长反馈</th><th>操作</th></tr></thead><tbody>';
    if(!DB.communications.length)html+='<tr><td colspan="6" style="text-align:center;color:var(--text-light);padding:30px">暂无沟通记录</td></tr>';
    DB.communications.slice().reverse().forEach(function(c){
      var mc=c.method==='电话'?'blue':c.method==='微信'?'green':c.method==='面谈'?'orange':c.method==='家访'?'red':'gray';
      html+='<tr><td>'+fmtDate(c.date)+'</td><td>'+esc(c.studentName||studentName(c.studentId))+'</td>'
        +'<td><span class="tag '+mc+'">'+esc(c.method||'')+'</span></td><td>'+esc(c.content||'')+'</td><td>'+esc(c.feedback||'')+'</td>'
        +'<td><button class="btn sm danger" onclick="delComm(\''+c.id+'\')">删除</button></td></tr>';
    });
    html+='</tbody></table></div></div>';
  }
  $('content').innerHTML=html;
}
function openCommForm(){
  if(!DB.students.length){toast('请先添加学生','err');return}
  var body='<div class="form-row"><div class="form-item"><label>学生</label><select id="cmStu">'
    +DB.students.map(function(s){return '<option value="'+s.id+'">'+esc(s.name)+'</option>'}).join('')+'</select></div>'
    +'<div class="form-item"><label>日期</label><input type="date" id="cmDate" value="'+todayStr()+'"></div></div>'
    +'<div class="form-row"><div class="form-item"><label>沟通方式</label><select id="cmMethod">'
    +['电话','微信','面谈','家访','其他'].map(function(m){return '<option>'+m+'</option>'}).join('')+'</select></div></div>'
    +'<div class="form-row"><div class="form-item"><label>沟通内容</label><textarea id="cmContent" style="min-height:70px"></textarea></div></div>'
    +'<div class="form-row"><div class="form-item"><label>家长反馈</label><textarea id="cmFeedback" style="min-height:70px"></textarea></div></div>';
  openModal(modalShell('记录沟通',body,
    '<button class="btn outline" onclick="closeModal()">取消</button><button class="btn primary" id="cmOk">保存</button>'));
  $('cmOk').onclick=function(){
    var sid=$('cmStu').value;
    var s=studentById(sid);
    DB.communications.push({id:uid('c'),studentId:sid,studentName:s?s.name:'',
      date:$('cmDate').value||todayStr(),method:$('cmMethod').value,
      content:$('cmContent').value.trim(),feedback:$('cmFeedback').value.trim()});
    saveDB();closeModal();renderCommunications();toast('已记录沟通');
  };
}
function callParent(phone){
  if(!phone){toast('该学生未填写联系方式','err');return}
  toast('正在拨打：'+phone);
}
function delComm(id){
  confirmDialog('删除这条沟通记录？',function(){
    DB.communications=DB.communications.filter(function(x){return x.id!==id});
    saveDB();renderCommunications();toast('已删除');
  });
}
function exportComms(){
  var rows=[['日期','学生','方式','内容','家长反馈']];
  DB.communications.forEach(function(c){
    rows.push([c.date,c.studentName||studentName(c.studentId),c.method||'',c.content||'',c.feedback||'']);
  });
  downloadCSV('家校沟通记录.csv',rows);
  toast('已导出');
}
/* ================= 数据管理 ================= */
function openDataManager(){
  var stat='<div class="stat-row" style="grid-template-columns:repeat(3,1fr)">'
    +'<div class="stat-card"><div class="v">'+DB.resources.length+'</div><div class="l">资源</div></div>'
    +'<div class="stat-card"><div class="v">'+DB.papers.length+'</div><div class="l">试卷</div></div>'
    +'<div class="stat-card"><div class="v">'+DB.students.length+'</div><div class="l">学生</div></div>'
    +'<div class="stat-card"><div class="v">'+DB.exams.length+'</div><div class="l">考试</div></div>'
    +'<div class="stat-card"><div class="v">'+DB.grades.length+'</div><div class="l">成绩</div></div>'
    +'<div class="stat-card"><div class="v">'+DB.points.length+'</div><div class="l">积分记录</div></div>'
    +'<div class="stat-card"><div class="v">'+DB.leaves.length+'</div><div class="l">请假</div></div>'
    +'<div class="stat-card"><div class="v">'+DB.evaluations.length+'</div><div class="l">评价</div></div>'
    +'<div class="stat-card"><div class="v">'+DB.communications.length+'</div><div class="l">沟通</div></div></div>';
  var body=stat+'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:12px">'
    +'<button class="btn primary" onclick="backupAll()">备份全部数据</button>'
    +'<button class="btn outline" onclick="$(\'fileBackup\').click()">恢复数据</button>'
    +'<input type="file" id="fileBackup" accept=".json" hidden onchange="restoreBackup(this)"></div>';
  openModal(modalShell('数据管理',body,'<button class="btn outline" onclick="closeModal()">关闭</button>'));
}
function backupAll(){
  var payload={version:1,exportDate:nowStr(),data:DB};
  downloadFile('教师工作台备份_'+todayStr()+'.json',JSON.stringify(payload,null,2),'application/json');
  toast('已导出备份');
}
function restoreBackup(inp){
  var f=inp.files[0];
  if(!f)return;
  var reader=new FileReader();
  reader.onload=function(){
    try{
      var j=JSON.parse(reader.result);
      var data=j.data||j;
      if(!data||typeof data!=='object')throw new Error('bad');
      confirmDialog('恢复数据将覆盖当前全部数据，确定？',function(){
        DB=data;
        ['resources','papers','recitation','students','exams','grades','points','leaves','evaluations','communications'].forEach(function(k){
          if(!DB[k])DB[k]=[];
        });
        if(!DB.seating||!DB.seating.layout)DB.seating={rows:5,cols:8,layout:[]};
        saveDB();closeModal();navigate('home');
        toast('数据已恢复');
      });
      inp.value='';
    }catch(e){toast('恢复失败：文件格式错误','err');inp.value=''}
  };
  reader.readAsText(f);
}
/* ================= 初始化 ================= */
function updateClock(){
  var d=new Date(),wd=['日','一','二','三','四','五','六'][d.getDay()];
  $('clock').textContent=(d.getMonth()+1)+'月'+d.getDate()+'日 星期'+wd+' '+pad2(d.getHours())+':'+pad2(d.getMinutes());
}
function init(){
  loadDB();
  updateClock();
  setInterval(updateClock,60000);
  $('btnData').onclick=openDataManager;
  $('hamburger').onclick=function(){document.getElementById('sidebar').classList.toggle('open')};
  ['res','papers','recitation','students','grades','points','seating','leaves','evaluations','communications'].forEach(function(k){
    var el=document.getElementById('i-'+k);
    if(el)el.innerHTML=I[k];
  });
  document.addEventListener('click',function(e){
    if(e.target===$('modalMask'))closeModal();
  });
  navigate('home');
}
init();
</script>
