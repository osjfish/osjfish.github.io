<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>智能计算器</title>
<style>
:root{--bg:#f6f7f9;--text:#1c2333;--muted:#8a93a6;--card-bg:#fff;--border:#e3e7ee;--shadow:rgba(30,40,80,.06);--accent:#4361ee;--accent-hover:#3454d1;--key-bg:#eef1f6;--key-text:#1c2333;--key-hover:#e2e6ef;--op-bg:#fdf2e3;--op-text:#c77418;--eq-bg:#4361ee;--eq-text:#fff;--danger:#e5484d;--ok:#30a46c;--chip:#f1f3f8}
[data-theme="dark"]{--bg:#10141c;--text:#e8ecf4;--muted:#7f8a9b;--card-bg:#1a1f2c;--border:#2a3142;--shadow:rgba(0,0,0,.35);--accent:#6a8bff;--accent-hover:#7f9cff;--key-bg:#242b3b;--key-text:#e8ecf4;--key-hover:#2e364a;--op-bg:#3a2e18;--op-text:#f5a623;--eq-bg:#6a8bff;--eq-text:#0e1220;--danger:#ff6b6b;--ok:#3ddc97;--chip:#242b3b}
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif}
body{background:var(--bg);color:var(--text);min-height:100vh;display:flex;justify-content:center;padding:20px 12px 40px}
.container{width:100%;max-width:520px}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.header h1{font-size:1.15rem;font-weight:700;letter-spacing:.5px}
.header-actions{display:flex;gap:8px}
.icon-btn{background:var(--card-bg);border:1px solid var(--border);color:var(--text);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center;transition:all .2s}
.icon-btn:hover{background:var(--key-hover)}
.display-wrap{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:14px 16px 12px;margin-bottom:12px;box-shadow:0 4px 16px var(--shadow)}
.expression{min-height:22px;font-size:.85rem;color:var(--muted);text-align:right;word-break:break-all;font-family:Consolas,Menlo,monospace;margin-bottom:6px}
.result{font-size:2.4rem;font-weight:700;text-align:right;line-height:1.15;word-break:break-all;min-height:46px;font-variant-numeric:tabular-nums;font-family:Consolas,Menlo,monospace}
.result.error{color:var(--danger);font-size:1.5rem}
.result.ok{color:var(--ok);font-size:1.6rem}
.display-tools{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.history-btn{font-size:.72rem;color:var(--muted);cursor:pointer;background:none;border:none;display:flex;align-items:center;gap:4px;padding:2px}
.history-btn:hover{color:var(--accent)}
.copy-wrap{display:flex;gap:6px}
.copy-btn{font-size:.72rem;color:var(--accent);cursor:pointer;background:none;border:none;padding:2px}
.copy-btn:hover{text-decoration:underline}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:8px;font-size:.8rem;font-weight:600;background:var(--card-bg);border:1px solid var(--border);border-radius:10px;color:var(--muted);cursor:pointer;transition:all .2s}
.tab.active{color:var(--accent);border-color:var(--accent);background:var(--card-bg)}
.calc-panel{display:none}
.calc-panel.active{display:block}
.sci-keys{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:8px}
.sci-keys button{height:36px;font-size:.75rem;background:var(--chip);color:var(--muted);border:1px solid var(--border);border-radius:8px;cursor:pointer;transition:all .15s}
.sci-keys button:hover{color:var(--accent);border-color:var(--accent)}
.keypad{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.key{height:56px;font-size:1.15rem;font-weight:600;border-radius:12px;border:1px solid transparent;cursor:pointer;transition:all .12s;user-select:none;}
.key:active{transform:scale(.96)}
.key.num{background:var(--key-bg);color:var(--key-text)}
.key.num:hover{background:var(--key-hover)}
.key.op{background:var(--op-bg);color:var(--op-text)}
.key.op:hover{filter:brightness(1.05)}
.key.fn{background:var(--chip);color:var(--muted);font-size:.95rem}
.key.fn:hover{color:var(--accent)}
.key.eq{background:var(--eq-bg);color:var(--eq-text);font-size:1.35rem}
.key.eq:hover{opacity:.9}
.key.ac{background:var(--danger);color:#fff}
.key.del{font-size:1.1rem}
.history-panel{display:none;background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:12px;box-shadow:0 4px 16px var(--shadow)}
.history-panel.active{display:block}
.history-title{display:flex;justify-content:space-between;align-items:center;font-size:.85rem;font-weight:600;margin-bottom:8px}
.history-title .clear-all{font-size:.72rem;color:var(--danger);cursor:pointer;background:none;border:none}
.history-item{padding:8px 6px;border-bottom:1px solid var(--border);cursor:pointer;border-radius:6px}
.history-item:hover{background:var(--chip)}
.history-item:last-child{border-bottom:none}
.history-expr{font-size:.78rem;color:var(--muted);word-break:break-all}
.history-val{font-size:1rem;font-weight:600;color:var(--text);word-break:break-all;font-variant-numeric:tabular-nums}
.history-empty{text-align:center;color:var(--muted);font-size:.85rem;padding:24px 0}
.footer{text-align:center;color:var(--muted);font-size:.7rem;margin-top:16px}
.footer span{display:inline-flex;align-items:center;gap:6px}
.dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}
@media(max-width:420px){.key{height:50px}.result{font-size:2rem}}
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>智能计算器</h1>
    <div class="header-actions">
      <button class="icon-btn" id="themeBtn" title="切换主题">&#9788;</button>
      <button class="icon-btn" id="histToggle" title="历史记录">&#128203;</button>
    </div>
  </div>

  <div class="display-wrap">
    <div class="expression" id="exprLine"></div>
    <div class="result" id="resultLine">0</div>
    <div class="display-tools">
      <button class="history-btn" id="histBtnInline">&#128203; 历史</button>
      <div class="copy-wrap">
        <button class="copy-btn" id="copyBtn" title="复制结果">复制</button>
      </div>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-panel="standard">标准</button>
    <button class="tab" data-panel="scientific">科学</button>
    <button class="tab" data-panel="converter">换算</button>
  </div>

  <div class="calc-panel active" id="panel-standard">
    <div class="keypad">
      <button class="key ac" data-act="ac">AC</button>
      <button class="key del" data-act="del">&#9003;</button>
      <button class="key op" data-sym="%">%</button>
      <button class="key op" data-sym="/">&#247;</button>

      <button class="key num" data-sym="7">7</button>
      <button class="key num" data-sym="8">8</button>
      <button class="key num" data-sym="9">9</button>
      <button class="key op" data-sym="*">&#215;</button>

      <button class="key num" data-sym="4">4</button>
      <button class="key num" data-sym="5">5</button>
      <button class="key num" data-sym="6">6</button>
      <button class="key op" data-sym="-">&#8722;</button>

      <button class="key num" data-sym="1">1</button>
      <button class="key num" data-sym="2">2</button>
      <button class="key num" data-sym="3">3</button>
      <button class="key op" data-sym="+">+</button>

      <button class="key fn" data-act="br">&#40;&#41;</button>
      <button class="key num" data-sym="0">0</button>
      <button class="key num" data-sym=".">.</button>
      <button class="key eq" data-act="eq">=</button>
    </div>
  </div>

  <div class="calc-panel" id="panel-scientific">
    <div class="sci-keys">
      <button data-fn="sqrt">&#8730;</button>
      <button data-fn="sin">sin</button>
      <button data-fn="cos">cos</button>
      <button data-fn="tan">tan</button>
      <button data-fn="ln">ln</button>
      <button data-fn="^2">x&sup2;</button>
      <button data-fn="^">x^y</button>
      <button data-fn="exp">e^x</button>
      <button data-fn="log">log</button>
      <button data-fn="!">n!</button>
      <button data-fn="floor">floor</button>
      <button data-fn="ceil">ceil</button>
      <button data-fn="abs">|x|</button>
      <button data-fn="round">round</button>
      <button data-fn="rand">rand</button>
    </div>
    <div class="keypad">
      <button class="key ac" data-act="ac">AC</button>
      <button class="key del" data-act="del">&#9003;</button>
      <button class="key op" data-sym="%">%</button>
      <button class="key op" data-sym="/">&#247;</button>

      <button class="key num" data-sym="7">7</button>
      <button class="key num" data-sym="8">8</button>
      <button class="key num" data-sym="9">9</button>
      <button class="key op" data-sym="*">&#215;</button>

      <button class="key num" data-sym="4">4</button>
      <button class="key num" data-sym="5">5</button>
      <button class="key num" data-sym="6">6</button>
      <button class="key op" data-sym="-">&#8722;</button>

      <button class="key num" data-sym="1">1</button>
      <button class="key num" data-sym="2">2</button>
      <button class="key num" data-sym="3">3</button>
      <button class="key op" data-sym="+">+</button>

      <button class="key fn" data-act="br">&#40;&#41;</button>
      <button class="key num" data-sym="0">0</button>
      <button class="key num" data-sym=".">.</button>
      <button class="key eq" data-act="eq">=</button>
    </div>
  </div>

  <div class="calc-panel" id="panel-converter">
    <div class="converter" style="display:flex;flex-direction:column;gap:10px">
      <select id="convType" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:.9rem;outline:none">
        <option value="length">长度：米 / 千米 / 厘米 / 毫米 / 英里 / 英尺 / 英寸</option>
        <option value="weight">重量：千克 / 克 / 吨 / 斤 / 磅 / 盎司</option>
        <option value="temp">温度：摄氏度 / 华氏度 / 开尔文</option>
        <option value="area">面积：平方米 / 平方千米 / 公顷 / 亩 / 平方英尺 / 平方英寸</option>
        <option value="volume">体积：升 / 毫升 / 立方米 / 加仑 / 品脱</option>
        <option value="speed">速度：米/秒 / 千米/时 / 英里/时 / 节</option>
      </select>
      <div style="display:flex;gap:8px">
        <input type="number" id="convFrom" style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:1.1rem;outline:none" value="1">
        <select id="convFromUnit" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:.9rem;outline:none"></select>
      </div>
      <div style="text-align:center;color:var(--muted)">&#8595;</div>
      <div style="display:flex;gap:8px">
        <div style="flex:1;padding:12px;border-radius:10px;border:1px solid var(--accent);background:var(--card-bg);color:var(--text);font-size:1.1rem;font-weight:700;outline:none" id="convResult">0</div>
        <select id="convToUnit" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);font-size:.9rem;outline:none"></select>
      </div>
      <button id="convSwap" style="padding:10px;border-radius:10px;border:1px solid var(--border);background:var(--card-bg);color:var(--text);cursor:pointer;font-size:.85rem">&#8646; 交换单位</button>
    </div>
  </div>

  <div class="history-panel" id="historyPanel">
    <div class="history-title">计算历史
      <button class="clear-all" id="clearHistory">清空</button>
    </div>
    <div id="historyList"><div class="history-empty">暂无记录</div></div>
  </div>

  <div class="footer"><span><span class="dot"></span> 本地计算，支持键盘输入</span></div>
</div>

<script>
(function(){
  const exprEl=document.getElementById('exprLine');
  const resultEl=document.getElementById('resultLine');
  const HISTORY_KEY='smartcalc_history';

  let expr='';
  let lastResult=null;
  let history=JSON.parse(localStorage.getItem(HISTORY_KEY)||'[]');

  const units={
    length:{m:1,km:1000,cm:0.01,mm:0.001,mi:1609.344,ft:0.3048,in:0.0254},
    weight:{kg:1,g:0.001,t:1000,jin:0.5,lb:0.45359237,oz:0.028349523125},
    temp:{C:['c'],F:['f'],K:['k']},
    area:{m2:1,km2:1e6,ha:10000,mu:2000/3,ft2:0.09290304,in2:0.00064516},
    volume:{l:1,ml:0.001,m3:1000,gal:3.785411784,pt:0.473176473},
    speed:{mps:1,kmh:1000/3600,mph:1609.344/3600,knot:1852/3600}
  };
  const unitNames={
    length:{m:'米',km:'千米',cm:'厘米',mm:'毫米',mi:'英里',ft:'英尺',in:'英寸'},
    weight:{kg:'千克',g:'克',t:'吨',jin:'斤',lb:'磅',oz:'盎司'},
    temp:{C:'摄氏(°C)',F:'华氏(°F)',K:'开尔文(K)'},
    area:{m2:'平方米',km2:'平方千米',ha:'公顷',mu:'亩',ft2:'平方英尺',in2:'平方英寸'},
    volume:{l:'升',ml:'毫升',m3:'立方米',gal:'加仑',pt:'品脱'},
    speed:{mps:'米/秒',kmh:'千米/时',mph:'英里/时',knot:'节'}
  };

  const sciFns={'sin':Math.sin,'cos':Math.cos,'tan':Math.tan,'sqrt':Math.sqrt,'ln':Math.log,'log':Math.log10,'exp':Math.exp,'abs':Math.abs,'floor':Math.floor,'ceil':Math.ceil,'round':Math.round};
  const consts={'pi':Math.PI,'e':Math.E};

  function factorial(n){
    if(!Number.isInteger(n)||n<0)throw new Error('阶乘需非负整数');
    if(n>170)throw new Error('数值过大');
    let r=1;for(let i=2;i<=n;i++)r*=i;return r;
  }

  function evaluate(str){
    const tokens=tokenize(str);
    let pos=0;
    function peek(){return tokens[pos]}
    function next(){return tokens[pos++]}
    function parseExpr(){let v=parseTerm();for(;;){const t=peek();if(t&&t.type==='op'&&(t.val==='+'||t.val==='-')){next();const r=parseTerm();v=t.val==='+'?v+r:v-r;}else break;}return v;}
    function parseTerm(){let v=parseFactor();for(;;){const t=peek();if(t&&t.type==='op'&&(t.val==='*'||t.val==='/'||t.val==='%')){next();const r=parseFactor();if(t.val==='*')v=v*r;else if(t.val==='/'){if(r===0)throw new Error('除数不能为 0');v=v/r;}else v=v%r;}else break;}return v;}
    function parseFactor(){
      let v=parseUnary();
      for(;;){
        const t=peek();
        if(t&&t.type==='fact'){next();v=factorial(v);}
        else if(t&&t.type==='op'&&t.val==='^'){next();v=Math.pow(v,parseFactor());}
        else break;
      }
      return v;
    }
    function parseUnary(){
      const t=peek();
      if(t&&t.type==='op'&&(t.val==='+'||t.val==='-')){next();const v=parseUnary();return t.val==='-'?-v:v;}
      return parseInt1();
    }
    function parseInt1(){
      const t=peek();
      if(!t)throw new Error('表达式不完整');
      if(t.type==='num'){next();return t.val;}
      if(t.type==='const'){next();return t.val;}
      if(t.type==='fn'){
        next();
        if(peek()&&peek().type==='lparen')next();else throw new Error('函数需要参数');
        const arg=parseExpr();
        if(peek()&&peek().type==='rparen')next();else throw new Error('缺少右括号');
        if(t.val==='rand')return Math.random();
        const fn=sciFns[t.val];
        if(!fn)throw new Error('未知函数');
        return fn(arg);
      }
      if(t.type==='lparen'){next();const v=parseExpr();if(peek()&&peek().type==='rparen')next();else throw new Error('缺少右括号');return v;}
      throw new Error('表达式有误');
    }
    const r=parseExpr();
    if(pos<tokens.length)throw new Error('表达式有误');
    return r;
  }

  function tokenize(str){
    const tokens=[];let i=0;const s=str.replace(/\s/g,'');
    while(i<s.length){
      const c=s[i];
      if(/[0-9.]/.test(c)){
        let j=i;while(j<s.length&&/[0-9.]/.test(s[j]))j++;
        const num=parseFloat(s.slice(i,j));
        if(isNaN(num))throw new Error('数字格式错误');
        tokens.push({type:'num',val:num});i=j;continue;
      }
      if(/[a-zA-Z]/.test(c)){
        let j=i;while(j<s.length&&/[a-zA-Z]/.test(s[j]))j++;
        const word=s.slice(i,j);
        if(consts.hasOwnProperty(word))tokens.push({type:'const',val:consts[word]});
        else if(sciFns.hasOwnProperty(word)||word==='rand')tokens.push({type:'fn',val:word});
        else throw new Error('未知标识符: '+word);
        i=j;continue;
      }
      if(c==='('){tokens.push({type:'lparen'});i++;continue;}
      if(c===')'){tokens.push({type:'rparen'});i++;continue;}
      if(c==='!'){tokens.push({type:'fact'});i++;continue;}
      if('+-*/%^'.includes(c)){tokens.push({type:'op',val:c});i++;continue;}
      if(c==='√'){tokens.push({type:'fn',val:'sqrt'});i++;continue;}
      throw new Error('无法识别的字符: '+c);
    }
    return tokens;
  }

  function formatResult(v){
    if(!isFinite(v))throw new Error('结果无效');
    if(Math.abs(v)>=1e15||(Math.abs(v)<1e-9&&v!==0))return v.toExponential(8).replace(/e\+?/,'e');
    const s=parseFloat(v.toPrecision(12)).toString();
    return s.replace(/\B(?=(\d{3})+(?!\d))/g,',');
  }

  function renderExpr(){
    exprEl.textContent=expr||'\u00A0';
    if(expr){
      try{
        const v=evaluate(expr);
        resultEl.classList.remove('error');resultEl.classList.add('ok');
        resultEl.textContent='= '+formatResult(v);
      }catch(e){
        resultEl.classList.remove('ok');resultEl.classList.add('error');
        resultEl.textContent=e.message;
      }
    }else{
      resultEl.classList.remove('error','ok');
      resultEl.textContent=lastResult===null?'0':formatResult(lastResult);
    }
  }

  function addSym(sym){
    expr+=sym;renderExpr();
  }

  function del(){
    expr=expr.slice(0,-1);renderExpr();
  }

  function clearAll(){
    expr='';resultEl.classList.remove('error','ok');
    if(lastResult!==null){resultEl.textContent=formatResult(lastResult);}
    else resultEl.textContent='0';
    renderExpr();
  }

  function equals(){
    if(!expr)return;
    try{
      const v=evaluate(expr);
      const disp=formatResult(v);
      history.unshift({expr:expr,val:parseFloat(v.toPrecision(12)),display:disp});
      if(history.length>50)history.pop();
      localStorage.setItem(HISTORY_KEY,JSON.stringify(history));
      renderHistory();
      lastResult=v;
      expr='';
      resultEl.classList.remove('ok','error');
      resultEl.textContent=disp;
      exprEl.textContent='\u00A0';
    }catch(e){
      resultEl.classList.remove('ok');resultEl.classList.add('error');
      resultEl.textContent=e.message;
    }
  }

  function backspace(){del()}

  function addFn(fn){
    if(fn==='^2')expr+='^2';
    else if(fn==='^')expr+='^';
    else if(fn==='!')expr+='!';
    else if(fn==='rand')expr+='rand';
    else expr+=(fn+'(');
    renderExpr();
  }

  function renderHistory(){
    const list=document.getElementById('historyList');
    if(!history.length){list.innerHTML='<div class="history-empty">暂无记录</div>';return;}
    list.innerHTML=history.map(h=>`
      <div class="history-item" data-idx="${history.indexOf(h)}">
        <div class="history-expr">${h.expr}</div>
        <div class="history-val">= ${h.display}</div>
      </div>`).join('');
  }

  function toggleHistory(){
    const p=document.getElementById('historyPanel');
    const isActive=p.classList.toggle('active');
    document.getElementById('histToggle').textContent=isActive?'\u2715':'\uD83D\uDCCB';
  }

  document.addEventListener('click',e=>{
    const t=e.target;
    const key=t.closest('.key');
    if(key){
      if(key.dataset.act){
        if(key.dataset.act==='ac')clearAll();
        else if(key.dataset.act==='del')backspace();
        else if(key.dataset.act==='eq')equals();
        else if(key.dataset.act==='br')addSym('()');
      }else if(key.dataset.sym!==undefined){
        addSym(key.dataset.sym);
      }
    }
    const fnBtn=t.closest('.sci-keys button');
    if(fnBtn&&fnBtn.dataset.fn)addFn(fnBtn.dataset.fn);
    const hi=t.closest('.history-item');
    if(hi){
      const idx=parseInt(hi.dataset.idx);
      if(!isNaN(idx)&&history[idx]){
        expr=history[idx].expr;
        lastResult=history[idx].val;
        resultEl.classList.remove('ok','error');
        resultEl.textContent=history[idx].display;
        renderExpr();
      }
    }
  });

  document.getElementById('themeBtn').addEventListener('click',()=>{
    const cur=document.documentElement.getAttribute('data-theme');
    const next=cur==='dark'?'':'dark';
    document.documentElement.setAttribute('data-theme',next);
    localStorage.setItem('smartcalc_theme',next);
    document.getElementById('themeBtn').textContent=next?'\u2600':'\uD83C\uDF19';
  });

  const theme=localStorage.getItem('smartcalc_theme');
  if(theme==='dark'){document.documentElement.setAttribute('data-theme','dark');document.getElementById('themeBtn').textContent='\u2600';}
  else document.getElementById('themeBtn').textContent='\uD83C\uDF19';

  document.getElementById('histToggle').addEventListener('click',toggleHistory);
  document.getElementById('histBtnInline').addEventListener('click',toggleHistory);

  document.getElementById('clearHistory').addEventListener('click',()=>{
    history=[];localStorage.removeItem(HISTORY_KEY);renderHistory();
  });

  document.getElementById('copyBtn').addEventListener('click',async()=>{
    const txt=resultEl.classList.contains('error')?'':resultEl.textContent.replace('= ','').replace(',','');
    try{
      await navigator.clipboard.writeText(txt);
      resultEl.classList.remove('ok','error');
      resultEl.textContent='已复制';
      setTimeout(()=>{if(!expr){renderExpr();}},600);
    }catch(e){}
  });

  document.querySelectorAll('.tab').forEach(tab=>{
    tab.addEventListener('click',()=>{
      document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
      document.querySelectorAll('.calc-panel').forEach(x=>x.classList.remove('active'));
      tab.classList.add('active');
      document.getElementById('panel-'+tab.dataset.panel).classList.add('active');
    });
  });

  function fillUnits(){
    const type=document.getElementById('convType').value;
    const keys=Object.keys(unitNames[type]);
    const fromSel=document.getElementById('convFromUnit');
    const toSel=document.getElementById('convToUnit');
    fromSel.innerHTML=keys.map(k=>`<option value="${k}">${unitNames[type][k]}</option>`).join('');
    toSel.innerHTML=keys.map(k=>`<option value="${k}">${unitNames[type][k]}</option>`).join('');
    toSel.value=keys[1]||keys[0];
    convert();
  }

  function convert(){
    const type=document.getElementById('convType').value;
    const val=parseFloat(document.getElementById('convFrom').value);
    const from=document.getElementById('convFromUnit').value;
    const to=document.getElementById('convToUnit').value;
    const res=document.getElementById('convResult');
    if(isNaN(val)||!from||!to){res.textContent='-';return;}
    let result;
    if(type==='temp'){
      const base=from==='C'?val:from==='F'?(val-32)*5/9:val;
      result=to==='C'?base:to==='F'?base*9/5+32:base+273.15;
    }else{
      result=val*units[type][from]/units[type][to];
    }
    res.textContent=formatResult(result);
  }

  document.getElementById('convType').addEventListener('change',fillUnits);
  document.getElementById('convFromUnit').addEventListener('change',convert);
  document.getElementById('convToUnit').addEventListener('change',convert);
  document.getElementById('convFrom').addEventListener('input',convert);
  document.getElementById('convSwap').addEventListener('click',()=>{
    const fromSel=document.getElementById('convFromUnit');
    const toSel=document.getElementById('convToUnit');
    const tmp=fromSel.value;
    fromSel.value=toSel.value;
    toSel.value=tmp;
    convert();
  });

  document.addEventListener('keydown',e=>{
    if(document.activeElement&&/INPUT|SELECT|TEXTAREA/.test(document.activeElement.tagName))return;
    if(e.key>='0'&&e.key<='9'||e.key==='.'||e.key==='+'||e.key==='-'||e.key==='*'||e.key==='/'||e.key==='%'||e.key==='^'){
      e.preventDefault();addSym(e.key);
    }else if(e.key==='('||e.key===')'){e.preventDefault();addSym(e.key);}
    else if(e.key==='Enter'){e.preventDefault();equals();}
    else if(e.key==='Backspace'){e.preventDefault();backspace();}
    else if(e.key==='Escape'){e.preventDefault();clearAll();}
  });

  renderExpr();
  fillUnits();
  renderHistory();
})();
</script>
</body>
</html>
