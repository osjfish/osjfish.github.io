<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人物对话</title>
    <!-- 引入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 React/ReactDOM/Babel -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone@7.26.0/babel.min.js"></script>
    <!-- 引入 Lucide 图标 -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Noto+Serif+SC:wght@400;600;700&display=swap');
        
        :root {
            --gf-bg: #fdfaf5;
            --gf-sidebar: #f5efe2;
            --gf-border: #e8ded0;
            --gf-text: #1a1614;
            --gf-muted: #6b6359;
            --gf-accent: #c04851;
            --gf-accent-hover: #9c353d;
            --gf-bubble-user: #c04851;
            --gf-bubble-ai: #ffffff;
        }

        body {
            font-family: 'Inter', system-ui, -apple-system, sans-serif;
            background-color: var(--gf-bg);
            color: var(--gf-text);
            margin: 0;
            overflow: hidden;
        }

        .font-serif {
            font-family: 'Noto Serif SC', serif;
        }

        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: transparent;
        }
        ::-webkit-scrollbar-thumb {
            background: #c5c1b1;
            border-radius: 10px;
        }
    </style>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        gf: {
                            bg: '#fdfaf5',
                            sidebar: '#f5efe2',
                            border: '#e8ded0',
                            text: '#1a1614',
                            muted: '#6b6359',
                            accent: '#c04851',
                            'accent-hover': '#9c353d',
                            'bubble-user': '#c04851',
                            'bubble-ai': '#ffffff',
                            'red': '#c04851',
                            'red-hover': '#9c353d',
                            'red-bg': '#fcefee',
                        }
                    }
                }
            }
        }
    </script>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        // 简易图标组件封装
        const Icon = ({ name, size = 18, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons({
                        attrs: {
                            'stroke-width': 2,
                            'width': size,
                            'height': size
                        }
                    });
                }
            }, [name, size]);
            return <i data-lucide={name} className={className}></i>;
        };

        // 应用内通知组件
        const Toast = ({ message, type, onClose }) => {
            useEffect(() => {
                const timer = setTimeout(onClose, 3000);
                return () => clearTimeout(timer);
            }, [onClose]);

            const bgClass = type === 'error' ? 'bg-gf-accent' : 'bg-gf-text';
            return (
                <div className={`fixed top-10 left-1/2 -translate-x-1/2 z-[200] px-6 py-3 rounded-full text-white text-sm shadow-2xl flex items-center gap-3 animate-bounce-in ${bgClass}`}>
                    <Icon name={type === 'error' ? 'alert-circle' : 'info'} size={16} />
                    {message}
                </div>
            );
        };

        function App() {
            // 初始化状态
            const [state, setState] = useState(() => {
                const saved = localStorage.getItem('deepseek_chat_state_standalone');
                return saved ? JSON.parse(saved) : {
                    apiKey: '',
                    model: 'deepseek-chat',
                    characters: [],
                    activeCharacterId: null,
                    chats: {}
                };
            });

            const [isSidebarOpen, setIsSidebarOpen] = useState(window.innerWidth > 768);
            const [isSettingsOpen, setIsSettingsOpen] = useState(false);
            const [editingCharacter, setEditingCharacter] = useState(undefined); // undefined: closed, null: new, obj: edit
            const [notice, setNotice] = useState(null); // { message, type }

            const showNotice = (message, type = 'info') => {
                setNotice({ message, type });
            };

            // 持久化存储
            useEffect(() => {
                localStorage.setItem('deepseek_chat_state_standalone', JSON.stringify(state));
            }, [state]);

            const updateState = (updates) => {
                setState(prev => ({ ...prev, ...updates }));
            };

            const activeCharacter = state.characters.find(c => c.id === state.activeCharacterId) || null;

            return (
                <div className="flex h-screen w-full bg-gf-bg overflow-hidden relative">
                    {/* 通知 */}
                    {notice && <Toast message={notice.message} type={notice.type} onClose={() => setNotice(null)} />}

                    {/* 侧边栏叠加层 (移动端) */}
                    {isSidebarOpen && (
                        <div className="md:hidden fixed inset-0 bg-black/20 z-40 backdrop-blur-sm" onClick={() => setIsSidebarOpen(false)} />
                    )}

                    <Sidebar 
                        state={state} 
                        updateState={updateState} 
                        isOpen={isSidebarOpen} 
                        onOpenSettings={() => setIsSettingsOpen(true)}
                        onOpenCharacterEditor={() => setEditingCharacter(null)}
                        showNotice={showNotice}
                    />

                    <ChatArea 
                        state={state}
                        activeCharacter={activeCharacter}
                        updateState={updateState}
                        onToggleSidebar={() => setIsSidebarOpen(!isSidebarOpen)}
                        onEditCharacter={(char) => setEditingCharacter(char)}
                        isSidebarOpen={isSidebarOpen}
                        showNotice={showNotice}
                    />

                    {isSettingsOpen && (
                        <SettingsModal 
                            state={state} 
                            updateState={updateState} 
                            onClose={() => setIsSettingsOpen(false)} 
                            showNotice={showNotice}
                        />
                    )}

                    {editingCharacter !== undefined && (
                        <CharacterModal 
                            state={state} 
                            updateState={updateState} 
                            editingCharacter={editingCharacter}
                            onClose={() => setEditingCharacter(undefined)}
                            showNotice={showNotice}
                        />
                    )}
                </div>
            );
        }

        function Sidebar({ state, updateState, isOpen, onOpenSettings, onOpenCharacterEditor, showNotice }) {
            const handleExport = () => {
                const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
                const a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = '对话备份.json';
                a.click();
                showNotice('备份已下载');
            };

            const handleImport = (e) => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (event) => {
                    try {
                        const parsed = JSON.parse(event.target.result);
                        updateState(parsed);
                        showNotice('数据导入成功');
                    } catch (err) {
                        showNotice('解析失败，文件格式错误', 'error');
                    }
                };
                reader.readAsText(file);
            };

            return (
                <div className={`bg-gf-sidebar border-r border-gf-border flex flex-col h-screen shrink-0 absolute md:relative z-50 transition-all duration-300 ${
                    isOpen 
                    ? 'translate-x-0 w-[280px] opacity-100' 
                    : '-translate-x-full w-[280px] md:w-0 md:translate-x-0 md:opacity-0 md:border-none pointer-events-none invisible md:visible'
                }`}>
                    <div className="h-[80px] pt-3 px-5 flex items-center justify-between border-b border-gf-border shrink-0">
                        <h1 className="text-lg font-bold text-gf-text flex items-center gap-2">
                            <Icon name="message-square" className="text-gf-accent" />
                            <span>人物对话</span>
                        </h1>
                        <button onClick={onOpenCharacterEditor} className="p-2 hover:bg-gf-border/50 rounded-lg transition-colors">
                            <Icon name="user-plus" />
                        </button>
                    </div>

                    <div className="flex-1 overflow-y-auto p-3 space-y-1.5">
                        {state.characters.map(char => (
                            <button
                                key={char.id}
                                onClick={() => updateState({ activeCharacterId: char.id })}
                                className={`w-full text-left p-3 rounded-xl transition-all border ${
                                    state.activeCharacterId === char.id 
                                    ? 'bg-white border-gf-border shadow-sm font-bold' 
                                    : 'border-transparent hover:bg-white/40'
                                }`}
                            >
                                <div className="text-sm truncate text-gf-text">{char.name}</div>
                                <div className="text-xs text-gf-muted truncate mt-1 opacity-70">
                                    {char.traits ? char.traits.substring(0, 15) : '暂无设定'}
                                </div>
                            </button>
                        ))}
                    </div>

                    <div className="p-4 border-t border-gf-border space-y-2">
                        <div className="flex gap-2">
                            <button onClick={() => document.getElementById('import-input').click()} className="flex-1 flex justify-center items-center gap-1 py-2 bg-gf-bg border border-gf-border rounded-lg text-sm hover:bg-white">
                                <Icon name="upload" size={14} /> 导入
                            </button>
                            <button onClick={handleExport} className="flex-1 flex justify-center items-center gap-1 py-2 bg-gf-bg border border-gf-border rounded-lg text-sm hover:bg-white">
                                <Icon name="download" size={14} /> 导出
                            </button>
                        </div>
                        <input id="import-input" type="file" className="hidden" accept=".json" onChange={handleImport} />
                        <button onClick={onOpenSettings} className="w-full py-2 flex justify-center items-center gap-2 text-gf-muted hover:text-gf-text text-sm">
                            <Icon name="settings" size={14} /> API 设置
                        </button>
                    </div>
                </div>
            );
        }

        function ChatArea({ state, activeCharacter, updateState, onToggleSidebar, onEditCharacter, isSidebarOpen, showNotice }) {
            const [input, setInput] = useState('');
            const [isTyping, setIsTyping] = useState(false);
            const messagesEndRef = useRef(null);
            const messages = activeCharacter ? (state.chats[activeCharacter.id] || []) : [];

            useEffect(() => {
                messagesEndRef.current?.scrollIntoView({ behavior: 'smooth' });
            }, [messages, isTyping]);

            const handleSend = async () => {
                if (!input.trim() || !activeCharacter || isTyping) return;
                if (!state.apiKey) {
                    showNotice('请先设置 DeepSeek API Key', 'error');
                    return;
                }

                const userMsg = { id: Date.now().toString(), role: 'user', content: input.trim(), timestamp: Date.now() };
                const newMessages = [...messages, userMsg];
                
                setInput('');
                const updatedChats = { ...state.chats, [activeCharacter.id]: newMessages };
                updateState({ chats: updatedChats });
                setIsTyping(true);

                try {
                    const response = await fetch('https://api.deepseek.com/chat/completions', {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                            'Authorization': `Bearer ${state.apiKey}`
                        },
                        body: JSON.stringify({
                            model: state.model || 'deepseek-chat',
                            messages: [
                                { role: 'system', content: `你正在扮演角色：${activeCharacter.name}。性格设定：${activeCharacter.traits}。请完全以该角色身份回答，不要解释，不要出戏。` },
                                ...newMessages.map(m => ({ role: m.role, content: m.content }))
                            ],
                            stream: true
                        })
                    });

                    if (!response.ok) throw new Error('API 请求失败');

                    const reader = response.body.getReader();
                    const decoder = new TextDecoder();
                    let assistantContent = '';
                    const aiMsgId = (Date.now() + 1).toString();

                    while (true) {
                        const { done, value } = await reader.read();
                        if (done) break;
                        const chunk = decoder.decode(value);
                        const lines = chunk.split('\n');
                        for (const line of lines) {
                            if (line.startsWith('data: ') && line.trim() !== 'data: [DONE]') {
                                try {
                                    const data = JSON.parse(line.slice(6));
                                    const text = data.choices[0]?.delta?.content;
                                    if (text) {
                                        assistantContent += text;
                                        updateState({
                                            chats: {
                                                ...updatedChats,
                                                [activeCharacter.id]: [
                                                    ...newMessages,
                                                    { id: aiMsgId, role: 'assistant', content: assistantContent, timestamp: Date.now() }
                                                ]
                                            }
                                        });
                                    }
                                } catch (e) {}
                            }
                        }
                    }
                } catch (err) {
                    showNotice('对话失败，请检查 API Key', 'error');
                } finally {
                    setIsTyping(false);
                }
            };

            if (!activeCharacter) {
                return (
                    <div className="flex-1 flex flex-col items-center justify-center bg-gf-bg text-gf-muted p-6">
                        <button onClick={onToggleSidebar} className="absolute top-8 left-8 p-3 bg-white border border-gf-border shadow-sm hover:bg-gf-border/20 rounded-full z-40 transition-all">
                           <Icon name={isSidebarOpen ? "panel-left-close" : "panel-left-open"} />
                        </button>
                        <p>请在左侧选择或创建一个人物开始对话</p>
                    </div>
                );
            }

            return (
                <div className="flex-1 flex flex-col h-screen bg-white relative">
                    <header className="h-[80px] pt-3 px-6 border-b border-gf-border flex items-center justify-between shrink-0 bg-gf-bg z-30">
                        <div className="flex items-center gap-3">
                            <button onClick={onToggleSidebar} className="p-2.5 text-gf-muted hover:text-gf-text rounded-lg hover:bg-gf-border/30 transition-colors">
                                <Icon name={isSidebarOpen ? "panel-left-close" : "panel-left-open"} />
                            </button>
                            <h2 className="text-xl font-serif font-bold text-gf-text truncate ml-1">与「{activeCharacter.name}」对话</h2>
                        </div>
                        <button onClick={() => onEditCharacter(activeCharacter)} className="px-3 py-1.5 border border-gf-border rounded-lg text-sm hover:bg-white flex items-center gap-1.5 shadow-sm">
                            <Icon name="edit" size={14} /> 人物设定
                        </button>
                    </header>

                    <main className="flex-1 overflow-y-auto bg-gf-bg px-4 md:px-12 py-8">
                        <div className="max-w-3xl mx-auto space-y-6">
                            {messages.map(msg => (
                                <div key={msg.id} className={`flex w-full ${msg.role === 'user' ? 'justify-end' : 'justify-start'}`}>
                                    <div className={`px-5 py-3 max-w-[85%] text-[15px] leading-relaxed shadow-sm rounded-2xl ${
                                        msg.role === 'user' 
                                        ? 'bg-gf-bubble-user text-white rounded-br-sm' 
                                        : 'bg-white border border-gf-border text-gf-text rounded-bl-sm'
                                    }`}>
                                        {msg.content}
                                    </div>
                                </div>
                            ))}
                            {isTyping && (
                                <div className="flex justify-start">
                                    <div className="px-4 py-2 border border-gf-border bg-white text-gf-muted rounded-2xl rounded-bl-sm text-sm italic">
                                        正在回复...
                                    </div>
                                </div>
                            )}
                            <div ref={messagesEndRef} className="h-4" />
                        </div>
                    </main>

                    <footer className="p-4 border-t border-gf-border bg-gf-sidebar">
                        <div className="max-w-3xl mx-auto relative flex items-end gap-2 bg-white border border-gf-border rounded-2xl p-2 shadow-sm focus-within:ring-1 focus-within:ring-gf-accent/30 transition-all">
                            <textarea 
                                value={input}
                                onChange={(e) => setInput(e.target.value)}
                                onKeyDown={(e) => {
                                    if (e.key === 'Enter' && !e.shiftKey) {
                                        e.preventDefault();
                                        handleSend();
                                    }
                                }}
                                className="flex-1 max-h-40 min-h-[44px] p-2 bg-transparent outline-none resize-none text-[15px]"
                                placeholder="输入消息..."
                            />
                            <button onClick={handleSend} disabled={!input.trim() || isTyping} className="w-10 h-10 flex items-center justify-center bg-gf-accent text-white rounded-xl disabled:bg-gf-border shrink-0">
                                <Icon name="send" size={16} />
                            </button>
                        </div>
                    </footer>
                </div>
            );
        }

        function SettingsModal({ state, updateState, onClose, showNotice }) {
            const [key, setKey] = useState(state.apiKey);
            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/30 backdrop-blur-sm p-4">
                    <div className="bg-gf-bg rounded-2xl w-full max-w-md p-6 border border-gf-border shadow-2xl">
                        <h3 className="text-xl font-bold mb-4">DeepSeek API 设置</h3>
                        <div className="space-y-4">
                            <div>
                                <label className="block text-sm font-medium mb-1">API Key</label>
                                <input 
                                    type="password" 
                                    value={key} 
                                    onChange={(e) => setKey(e.target.value)}
                                    placeholder="sk-..."
                                    className="w-full px-4 py-2 border border-gf-border rounded-xl outline-none focus:border-gf-accent"
                                />
                                <p className="text-[10px] text-gf-muted mt-2">密钥仅在您的浏览器本地存储，不会上传到任何服务器。</p>
                            </div>
                            <div className="flex justify-end gap-3 pt-2">
                                <button onClick={onClose} className="px-4 py-2 text-gf-text hover:bg-gf-border/40 rounded-lg">取消</button>
                                <button onClick={() => { updateState({ apiKey: key }); showNotice('API Key 已保存'); onClose(); }} className="px-6 py-2 bg-gf-accent text-white rounded-lg">保存设置</button>
                            </div>
                        </div>
                    </div>
                </div>
            );
        }

        function CharacterModal({ state, updateState, editingCharacter, onClose, showNotice }) {
            const [name, setName] = useState(editingCharacter?.name || '');
            const [traits, setTraits] = useState(editingCharacter?.traits || '');
            const [showConfirm, setShowConfirm] = useState(false);

            const handleSave = () => {
                if (!name.trim()) return showNotice('请输入角色名称', 'error');
                if (editingCharacter) {
                    const newList = state.characters.map(c => c.id === editingCharacter.id ? { ...c, name, traits } : c);
                    updateState({ characters: newList });
                    showNotice('角色资料已更新');
                } else {
                    const id = Date.now().toString();
                    updateState({ 
                        characters: [...state.characters, { id, name, traits }],
                        activeCharacterId: id
                    });
                    showNotice('新角色已创建');
                }
                onClose();
            };

            const handleDelete = () => {
                const newList = state.characters.filter(c => c.id !== editingCharacter.id);
                updateState({ 
                    characters: newList,
                    activeCharacterId: state.activeCharacterId === editingCharacter.id ? (newList[0]?.id || null) : state.activeCharacterId
                });
                showNotice('角色已删除');
                onClose();
            };

            return (
                <div className="fixed inset-0 z-[100] flex items-center justify-center bg-black/30 backdrop-blur-sm p-4">
                    <div className="bg-gf-bg rounded-2xl w-full max-w-lg overflow-hidden border border-gf-border shadow-2xl flex flex-col max-h-[90vh]">
                        <header className="px-6 py-4 border-b border-gf-border flex justify-between items-center">
                            <h2 className="text-xl font-bold">{editingCharacter ? '修改角色' : '创建新角色'}</h2>
                            <button onClick={onClose} className="p-2 hover:bg-gf-border/40 rounded-full"><Icon name="x" /></button>
                        </header>
                        <div className="p-6 space-y-5 overflow-y-auto">
                            <div>
                                <label className="block font-medium mb-1 text-sm">角色名称</label>
                                <input value={name} onChange={e => setName(e.target.value)} className="w-full px-4 py-2 border border-gf-border rounded-xl outline-none focus:border-gf-accent" placeholder="给人物起个名字..." />
                            </div>
                            <div>
                                <label className="block font-medium mb-1 text-sm">核心特质与背景设定</label>
                                <textarea value={traits} onChange={e => setTraits(e.target.value)} className="w-full h-48 px-4 py-2 border border-gf-border rounded-xl resize-none outline-none focus:border-gf-accent" placeholder="例如：性格沉稳、知识博深、说话喜欢引经据典..." />
                            </div>
                        </div>
                        <footer className="px-6 py-4 border-t border-gf-border bg-white/30 flex justify-between items-center">
                            {editingCharacter ? (
                                <button onClick={() => setShowConfirm(true)} className="text-gf-accent hover:underline text-xs">删除该角色</button>
                            ) : <div></div>}
                            <div className="flex gap-2">
                                <button onClick={onClose} className="px-4 py-2 text-sm">取消</button>
                                <button onClick={handleSave} className="px-8 py-2 bg-gf-accent text-white rounded-lg shadow-md">保存</button>
                            </div>
                        </footer>
                        {showConfirm && (
                            <div className="absolute inset-0 bg-gf-bg/95 flex flex-col items-center justify-center p-6 text-center animate-fade-in">
                                <div className="w-16 h-16 bg-gf-accent/10 text-gf-accent rounded-full flex items-center justify-center mb-4">
                                    <Icon name="trash-2" size={32} />
                                </div>
                                <h3 className="text-lg font-bold mb-2">确认删除此角色？</h3>
                                <p className="text-sm text-gf-muted mb-8 leading-relaxed px-10">此操作不可恢复，「{name}」的所有对话记录也将被永久删除。</p>
                                <div className="flex gap-4">
                                    <button onClick={() => setShowConfirm(false)} className="px-8 py-2 border border-gf-border rounded-lg hover:bg-white transition-colors">我不删了</button>
                                    <button onClick={handleDelete} className="px-8 py-2 bg-gf-accent text-white rounded-lg hover:bg-gf-accent-hover shadow-lg">确认删除</button>
                                </div>
                            </div>
                        )}
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
